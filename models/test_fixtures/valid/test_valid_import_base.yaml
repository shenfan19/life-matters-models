metadata:
  name: test_valid_import_base
  lm_format_version: "1.0"
  description:
    problem: >
      Pure component model (no input variables): provides cardiovascular state variables
      (heart_rate, cardiac_output, systemic_resistance) and dynamics intended only for
      import by other test models. Tests the base layer of the import chain and diamond
      deduplication — both test_valid_import_layer and test_valid_import_top import this file.
    result: >
      The Loader should include this file's variables and equations exactly once in any
      composite model, regardless of how many importers reference it. No standalone
      simulation or optimisation is expected.
    limitations: Purely structural; parameters are not clinically calibrated.
  tags: [test, import, base, component, no-input]
variables:
  heart_rate:
    type: state
    value: 70.0
    unit: bpm
    description: Resting heart rate; decays toward basal set-point over time.

  cardiac_output:
    type: state
    value: 5.0
    unit: L/min
    description: Cardiac output; proportional to heart_rate × stroke_volume.

  systemic_resistance:
    type: state
    value: 1200.0
    unit: dyn·s/cm⁵
    description: Total systemic vascular resistance; drives blood pressure.

  # Parameters defined in this base component
  hr_set_point:
    type: parameter
    value: 65.0
    unit: bpm
    description: Resting heart rate set-point; HR relaxes toward this value daily.

  hr_recovery_rate:
    type: parameter
    value: 0.05
    unit: 1/day
    description: Rate at which HR returns to set-point per day.

  stroke_volume:
    type: parameter
    value: 0.070
    unit: L/beat
    description: Stroke volume (fixed parameter); cardiac_output = HR × SV × 60.

equations:
  heart_rate_recovery:
    description: HR relaxes exponentially toward set-point (rate × step).
    step_unit: day
    dynamics:
      heart_rate: "heart_rate - (heart_rate - hr_set_point) * hr_recovery_rate * step"
    priority: 5

  cardiac_output_update:
    description: Cardiac output computed from HR and stroke volume (equation, no step needed).
    step_unit: day
    dynamics:
      cardiac_output: "heart_rate * stroke_volume * 60.0 / 1000.0"
    priority: 3

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-30"
  output_types: [state]

references: ["TEST: base component for import chain test"]
