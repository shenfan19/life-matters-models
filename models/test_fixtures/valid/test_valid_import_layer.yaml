metadata:
  name: test_valid_import_layer
  lm_format_version: "1.0"
  description:
    problem: >
      Intermediate import layer in a 2-level chain: imports test_valid_import_base (cardiovascular
      component), adds aerobic fitness variables, and overrides hr_set_point from 65 → 58 bpm
      (trained athlete baseline). Is itself imported by test_valid_import_top, creating the
      diamond-dependency scenario where test_valid_import_base is reachable via two paths.
    problem_cn: >
      两层 import 链中的中间层：导入 test_valid_import_base（心血管组件），新增有氧适能
      相关变量，并将 hr_set_point 从 65 覆盖为 58 bpm（训练有素运动员的基线）。本文件
      又被 test_valid_import_top 导入，形成菱形依赖场景——test_valid_import_base 通过
      两条路径均可达。
    result: >
      When imported by test_valid_import_top, this layer's override (58 bpm) should take precedence
      over the base value (65 bpm), and aerobic fitness variables should appear in the resolved
      model. test_valid_import_base must remain deduplicated.
    result_cn: >
      当被 test_valid_import_top 导入时，本层的覆盖值（58 bpm）应优先于基础层的值
      （65 bpm），且有氧适能相关变量应出现在解析后的模型中。test_valid_import_base
      必须保持去重（仅一份）。
    limitations: Aerobic fitness model is simplified; not clinically calibrated.
    limitations_cn: 有氧适能模型经过简化，未经临床校准。
  tags: [test, import, layer, aerobic-fitness, override]
imports:
- test_fixtures/valid/test_valid_import_base

references: ["TEST: layer model in import chain — extends base component"]

variables:
  # Override base parameter: trained athlete has lower resting HR
  hr_set_point:
    type: parameter
    value: 58.0
    unit: bpm
    description: Overrides base hr_set_point (65→58 bpm) for a trained athlete profile.

  # New variables added by this layer
  vo2max:
    type: state
    value: 40.0
    unit: mL/kg/min
    description: Maximal aerobic capacity; improves with exercise load, decays at rest.

  aerobic_fitness_index:
    type: state
    value: 0.60
    unit: "fraction"
    description: Normalized fitness index (0=untrained, 1=elite); derived from vo2max.

  vo2_recovery_rate:
    type: parameter
    value: 0.003
    unit: 1/day
    description: Daily VO2max detraining rate when no exercise stimulus is present.

equations:
  vo2max_baseline_decay:
    description: VO2max decays slightly at rest (detraining effect, rate × step).
    step_unit: day
    dynamics:
      vo2max: "max(20.0, vo2max - vo2max * vo2_recovery_rate * step)"
    priority: 4

  fitness_index_calc:
    description: Normalize VO2max to fitness index; elite ≈ 70 mL/kg/min → 1.0.
    step_unit: day
    dynamics:
      aerobic_fitness_index: "min(1.0, vo2max / 70.0)"
    priority: 2

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-30"
  output_variables: [heart_rate, cardiac_output, vo2max, aerobic_fitness_index]
