metadata:
  todo:
    - type: noref
      issue: "Missing sufficient literature citation support (migrated from the old _noref filename suffix)"
      evidence: "Migrated from the old _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check for and fill in missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: test_valid_evidence_ard
  lm_format_version: "1.0"
  description:
    problem: >
      Validates Loader handling of the `ard` (absolute risk difference) evidence subtype
      in isolation. `aspirin_stroke_ard` must equal `value`
      (ard: effective = value, no auxiliary fields).
    result: >
      `ard_display` = aspirin_stroke_ard = 0.008 (constant, every step, prob/year).
      `stroke_risk_reduction` accumulates at 0.008/365 ≈ 0.0000219/day,
      reaching ≈0.000658 after 30 days.
      `stroke_risk_reduction_auto` (generated via `applies_to`, no hand-written dynamics)
      must track `stroke_risk_reduction` exactly every step.
    limitations: Values are illustrative; no clinical interpretation intended. TEST file.
  tags: [test, evidence, ard]

variables:
  ard_display:
    type: state
    value: 0.0
    unit: prob/year
    description: Displays aspirin_stroke_ard each step (expected constant 0.008).

  stroke_risk_reduction:
    type: state
    value: 0.0
    unit: cumulative_prob
    description: Cumulative absolute stroke risk reduction from aspirin (hand-written dynamics).

  stroke_risk_reduction_auto:
    type: state
    value: 0.0
    unit: cumulative_prob
    description: Same accumulation as stroke_risk_reduction, but generated by Loader via applies_to.

  aspirin_stroke_ard:
    type: parameter
    evidence_type: ard
    value: 0.008
    unit: prob/year
    rate_unit: year
    applies_to: stroke_risk_reduction_auto
    step_unit: day
    description: Aspirin reduces annual stroke risk by 0.8 percentage points absolutely.
    reference: "TODO:SOURCE"

equations:
  display_ard:
    description: "Shows aspirin_stroke_ard (ard: effective = value)."
    dynamics:
      ard_display: "aspirin_stroke_ard"
    priority: 0

  reduction_accum:
    description: Cumulative absolute stroke risk reduction.
    step_unit: day
    dynamics:
      stroke_risk_reduction: "stroke_risk_reduction + aspirin_stroke_ard / 365.0 * step"
    priority: 3

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date:   "2026-01-31"
  output_variables: [ard_display, stroke_risk_reduction, stroke_risk_reduction_auto]

references: ["TEST: ard evidence subtype isolation"]
