metadata:
  name: test_valid_opt_metric_min
  lm_format_version: "1.0"
  description:
    problem: >
      Validates `optimization.objectives[].metric: min` (the only metric value among
      final|max|min|mean not covered by other test models). A warehouse stocks
      `stock` with a single up-front order, then depletes at a fixed daily demand.
      The objective is to maximize the worst-case (minimum) inventory level over the
      planning horizon, subject to a hard cost cap on the order.
    problem_cn: >
      验证 `optimization.objectives[].metric: min`（final|max|min|mean 四种 metric 取值
      中唯一未被其他测试模型覆盖的一种）。一个仓库通过一次性订货补充库存 `stock`，
      此后按固定的每日需求持续消耗。优化目标是在订货成本硬约束上限下，最大化整个
      计划周期内的最差（最小）库存水平。
    result: >
      `stock(t) = order_qty - daily_demand * t`, monotonically decreasing, so
      `min(stock)` over the 14-day horizon occurs at the final step:
      `min(stock) = order_qty - 10*13 = order_qty - 130`.
      maximize metric:min therefore pushes `order_qty` to its largest feasible value.
      The hard constraint `order_cost <= 250` (order_cost = order_qty * 2) caps
      `order_qty` at 125, giving `min(stock) = -5` at the optimum (best_f ≈ -5).
    result_cn: >
      `stock(t) = order_qty - daily_demand * t`，单调递减，因此 14 天周期内的
      `min(stock)` 出现在最后一步：`min(stock) = order_qty - 10*13 = order_qty - 130`。
      因此 maximize metric:min 会将 `order_qty` 推向其可行范围内的最大值。硬约束
      `order_cost <= 250`（order_cost = order_qty * 2）将 `order_qty` 上限设为 125，
      最优解处 `min(stock) = -5`（best_f ≈ -5）。
    limitations: Linear toy inventory dynamics; for engine validation only, not a real supply-chain model.
    limitations_cn: 线性玩具级库存动力学；仅用于引擎验证，非真实供应链模型。
  tags: [test, optimization, metric_min]
variables:
  stock:
    type: state
    value: 0.0
    unit: units
    description: Inventory level; receives one up-front order, then depletes at daily_demand.

  order_qty:
    type: input
    value: 0.0
    unit: units
    description: One-time order placed at the start of the horizon (pulse).

  daily_demand:
    type: parameter
    value: 10.0
    unit: units/day
    description: Fixed daily demand drawn from stock.

  unit_cost:
    type: parameter
    value: 2.0
    unit: currency/unit
    description: Cost per ordered unit, used to compute order_cost.

  order_cost:
    type: state
    value: 0.0
    unit: currency
    description: Total cost of the up-front order (order_qty * unit_cost), static.

equations:
  receive_order:
    description: Order pulse adds to stock once at the start of the horizon.
    step_unit: day
    dynamics:
      stock: "stock + order_qty"
    priority: 10

  deplete_stock:
    description: Stock depletes by daily_demand each day.
    step_unit: day
    dynamics:
      stock: "stock - daily_demand * step"
    priority: 5

  compute_order_cost:
    description: Static order cost (no dt dependence).
    step_unit: day
    dynamics:
      order_cost: "order_qty * unit_cost"
    priority: 0

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-14"
  output_variables: [stock, order_qty, order_cost]
  plans:
  - id: "no_order"
    label: "No order (0 units) — stock depletes to min(stock) = -130 (stockout from day 1)"
    regimens:
    - variable: order_qty
      time_start: "00:00"
      value: 0.0
      date_range: ["2026-01-01", "2026-01-01"]
      label: "Up-front order (units)"
  - id: "moderate_order"
    label: "Moderate order (60 units) — min(stock) = -70"
    regimens:
    - variable: order_qty
      time_start: "00:00"
      value: 60.0
      date_range: ["2026-01-01", "2026-01-01"]
      label: "Up-front order (units)"
  - id: "max_feasible_order"
    label: "Max feasible order (125 units, order_cost = 250 = constraint boundary) — min(stock) = -5, the optimum"
    regimens:
    - variable: order_qty
      time_start: "00:00"
      value: 125.0
      date_range: ["2026-01-01", "2026-01-01"]
      label: "Up-front order (units)"

optimization:
  method: nelder-mead
  objectives:
  - variable: stock
    metric: min
    direction: maximize
    description: "Maximize the worst-case (minimum) inventory level over the horizon."
  constraints:
  - variable: order_cost
    condition: "<= 250"
    type: hard
    description: "Order budget cap: order_qty * unit_cost <= 250 → order_qty <= 125."
  startpoint:
    regimens:
    - variable: order_qty
      time_start: "00:00"
      time_end: "00:00"
      date_range: ["2026-01-01", "2026-01-01"]
      label: "Up-front order quantity"
      optimize:
        value: [0.0, 200.0]
  algorithm:
    population_size: 1
    n_generations: 60
    seed: 19

references: ["TEST: optimization.objectives metric: min"]
