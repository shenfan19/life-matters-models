metadata:
  name: test_valid_banister_v1_analytical
  lm_format_version: "1.0"
  description:
    problem: >
      Engine-correctness fixture for test_verification/verification_report.md §2 Protocol V1: does the Euler
      forward integrator's numerical error stay under the 2% threshold against
      the Banister two-compartment model's closed-form analytical solution under
      constant load? Standalone from banister_validation.yaml on purpose — that
      file's training_load values are mid-dispute (see its metadata.todo, "75 vs
      50/10" open decision) and its step_unit is hour; this fixture uses the
      exact Morton 1990 standard parameters and day-granularity step_size the
      protocol itself specifies, so the check doesn't depend on that unresolved
      question.
    problem_cn: >
      用于 test_verification/verification_report.md §2 Protocol V1 的引擎正确性夹具：
      在恒定负荷下，Euler 前向积分器相对于 Banister 双室模型闭式解析解的数值误差，
      是否能保持在 2% 阈值以内？该文件刻意独立于 banister_validation.yaml——
      后者的 training_load 取值仍有争议（见其 metadata.todo 中 "75 vs 50/10" 的未决问题），
      且其 step_unit 为小时；本夹具使用 Morton 1990 论文的标准参数原值，
      以及该验证协议本身指定的日粒度 step_size，因此该检查不依赖那个尚未解决的争议。
    result: >
      Consumed by reference_engine/scripts/validate_banister.py, which runs this
      model at constant training_load=50 AU/day for 60 days and compares
      fitness/fatigue/performance against the closed-form solution
      a(t)=g*w/k1*(1-e^{-k1*t}), f(t)=h*w/k2*(1-e^{-k2*t}), p(t)=p0+a(t)-f(t).
    result_cn: >
      由 reference_engine/scripts/validate_banister.py 调用：该脚本以
      training_load=50 AU/day 的恒定负荷运行本模型 60 天，
      并将 fitness/fatigue/performance 与闭式解
      a(t)=g*w/k1*(1-e^{-k1*t})、f(t)=h*w/k2*(1-e^{-k2*t})、p(t)=p0+a(t)-f(t) 进行比较。
    limitations: No physiological meaning beyond reproducing the closed-form solution; purely a numeric engine-correctness fixture.
    limitations_cn: 除了复现闭式解外没有生理学意义；纯粹是一个数值引擎正确性夹具。
  tags: [test, banister, numerical_precision, engine_correctness]
  todo:
    - type: bug
      severity: resolved
      issue: "training_load 原配置为单点脉冲（time_start 无 time_end），dynamics 方程把它和状态自身衰减项一起乘了 *step；在 step_size=1天（=equation step_unit）下是 no-op，仅在更细步长下才会暴露成误差"
      evidence: "2026-07-10 用此配置跑 validate_banister.py 得到的 FAIL（performance 误差 day14=7.08%）本身数字没错，但该配置只在 step_size=1天 下碰巧正确；2026-07-13 排查 Banister S1 步长自适应问题时定位到此 bug（详见 c:/fan/b_life_matters/life-matters-home/tasks/2026-07-13_task_step-size-adaptive-input-rate-design.md）"
      fix: "按 ADR 0128 改为全天 sustained 窗口（time_start=00:00, time_end=24:00），value=50.0 不变（ADR 0128 起本就是日速率语义）；dynamics 拆开括号，training_load 项不再乘 *step，衰减项保留 *step。修复后跑通 6 步长(1天/12h/6h/3h/1h/30min)×4区间(7/14/30/60天) 收敛网格，结果见 test_verification/verification_report.md §2。"

variables:
  fitness:
    type: state
    value: 0.0
    unit: AU
    description: Fitness compartment, analytical solution a(t)=g*w/k1*(1-e^{-k1*t}).

  fatigue:
    type: state
    value: 0.0
    unit: AU
    description: Fatigue compartment, analytical solution f(t)=h*w/k2*(1-e^{-k2*t}).

  performance:
    type: state
    value: 494.0
    unit: AU
    description: performance = p0 + fitness - fatigue (Morton 1990 eq.3).

  training_load:
    type: input
    value: 0.0
    unit: AU
    description: Constant daily training load w, driven by regimen.

  g:
    type: parameter
    value: 1.0
    unit: dimensionless
    description: Fitness gain coefficient (Morton 1990 Table 1 standard value).

  h:
    type: parameter
    value: 2.0
    unit: dimensionless
    description: Fatigue gain coefficient (Morton 1990 Table 1 standard value).

  k1:
    type: parameter
    value: 0.022222222
    unit: 1/day
    description: Fitness decay rate = 1/45 per day (Morton 1990).

  k2:
    type: parameter
    value: 0.066666667
    unit: 1/day
    description: Fatigue decay rate = 1/15 per day (Morton 1990).

  p0:
    type: parameter
    value: 494.0
    unit: AU
    description: Baseline performance (Mujika et al. 1996).

equations:
  fitness_dynamics:
    description: "dA/dt = g*w - k1*A (Euler); training_load is a day-rate input (ADR 0128, no *step), decay term keeps *step"
    step_unit: day
    dynamics:
      fitness: fitness + g * training_load - k1 * fitness * step
    priority: 5

  fatigue_dynamics:
    description: "df/dt = h*w - k2*f (Euler); training_load is a day-rate input (ADR 0128, no *step), decay term keeps *step"
    step_unit: day
    dynamics:
      fatigue: fatigue + h * training_load - k2 * fatigue * step
    priority: 5

  performance_update:
    description: "performance = p0 + fitness - fatigue (Morton 1990 eq.3, static)"
    priority: 3
    dynamics:
      performance: p0 + fitness - fatigue

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-03-02"
  output_variables: [fitness, fatigue, performance, training_load]
  plans:
    - id: "constant_w50"
      label: "Constant training_load=50 AU/day for 60 days (Protocol V1)"
      regimens:
        - {variable: training_load, time_start: "00:00", time_end: "24:00", value: 50.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-03-02"], label: "constant load (ADR 0128: value is the per-day rate, independent of step_size or how many days date_range covers)"}

references: ["Morton RH, Fitz-Clarke JR, Banister EW (1990) J Appl Physiol 69(3):1171-1177"]
