metadata:
  name: test_valid_import_top
  lm_format_version: "1.0"
  description:
    problem: >
      Top-level composite model for diamond-dependency deduplication: directly imports
      test_valid_import_base AND test_valid_import_layer (which itself also imports test_valid_import_base).
      The Loader must include test_valid_import_base exactly once. Also tests the override chain:
      layer overrides base (58 bpm), and this model further overrides stroke_volume (0.075 L).
    problem_cn: >
      用于验证菱形依赖去重的顶层组合模型：同时直接导入 test_valid_import_base 与
      test_valid_import_layer（后者本身也导入 test_valid_import_base）。Loader 必须使
      test_valid_import_base 恰好只出现一次。同时测试覆盖链：layer 覆盖 base（58 bpm），
      本模型进一步覆盖 stroke_volume（0.075 L）。
    result: >
      Resolved model should contain cardiovascular + aerobic fitness variables merged exactly
      once, with override precedence: top > layer > base. Optimizer should maximise VO2max
      subject to a heart rate ceiling constraint, confirming the composite model runs end-to-end.
    result_cn: >
      解析后的模型应恰好合并一次心血管与有氧适能相关变量，覆盖优先级为
      top > layer > base。优化器应在心率上限约束下最大化 VO2max，以确认组合模型
      能端到端运行。
    limitations: Simplified adaptation kinetics; not validated against training science.
    limitations_cn: 适应性动力学经过简化，未针对训练科学做过验证。
  tags: [test, import, diamond, composite, override-chain]
  references: ["TEST: diamond import deduplication and override chain"]
imports:
- test_fixtures/valid/test_valid_import_base
- test_fixtures/valid/test_valid_import_layer

variables:
  # Override from layer (58) and base (65): top-level can further override or accept layer's
  # Here we accept layer's 58 bpm (no re-declaration needed; this tests that layer wins over base)

  # Override parameter from base component
  stroke_volume:
    type: parameter
    value: 0.075
    unit: L/beat
    description: Overrides base stroke_volume (0.070→0.075 L/beat) for elite athlete profile.

  # New variable: training stimulus
  training_load:
    type: input
    value: 0.0
    unit: minutes
    description: Daily aerobic training duration (pulse; VO2max adaptation in formula).

  vo2max_adaptation_rate:
    type: parameter
    value: 0.08
    unit: mL/kg/min per minute of training
    description: VO2max gain per minute of training session (adapted from Bassett & Howley 2000).

formulas:
  # This model adds VO2max gain from training (pulse; no step multiplication)
  vo2max_training:
    description: VO2max improves from each training session (pulse input, no step).
    step_unit: hour
    dynamics:
      vo2max: "min(80.0, vo2max + training_load * vo2max_adaptation_rate)"
    priority: 10

  # Training also temporarily elevates heart_rate above set-point (pulse)
  hr_training_elevation:
    description: Training session transiently raises HR (pulse, no step).
    step_unit: hour
    dynamics:
      heart_rate: "min(200.0, heart_rate + training_load * 0.5)"
    priority: 10

simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-01-01"
  end_date: "2026-06-30"
  plans:
  - id: default
    label: Default
    regimens:
    - variable: training_load
      time_start: "07:00"
      value: 45.0
      days: [Mon, Tue, Wed, Thu, Fri]
      label: "Training 45 min Mon–Fri"
  output_variables: [heart_rate, cardiac_output, vo2max, aerobic_fitness_index, training_load]

optimizer:
  method: nsga2
  objectives:
  - variable: vo2max
    metric: final
    direction: maximize
  - variable: heart_rate
    metric: mean
    direction: minimize
  constraints:
  - variable: heart_rate
    condition: "<= 100"
    type: hard
  startpoint:
    regimens:
    - variable: training_load
      time_start: "07:00"
      time_end: "07:00"
      label: "Training session (min + weekly pattern)"
      optimize:
        value: [20.0, 90.0]
        days_pool: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        days_n: [1, 7]
  algorithm:
    population_size: 25
    n_generations: 40
    seed: 19
