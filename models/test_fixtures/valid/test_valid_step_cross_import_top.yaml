metadata:
  name: test_valid_step_cross_import_top
  lm_format_version: "1.0"
  description:
    problem: >
      Core multi-scale correctness check: this model runs at 1-hour steps and imports
      test_valid_step_cross_import_base (step=1 day). The daily decay equation must fire once every
      24 hours — not once per hour. A separate hourly PK variable decays at 0.1% per hour,
      independently confirming the hourly engine is working correctly.
    problem_cn: >
      多尺度正确性的核心检验：本模型以 1 小时步长运行，并 import 了
      test_valid_step_cross_import_base（步长=1 天）。该逐日衰减方程必须每 24 小时触发一次，
      而不是每小时触发一次。另有一个独立的小时级 PK 变量以每小时 0.1% 的速率衰减，用于独立
      确认小时级引擎运行正确。
    result: >
      body_mass at 24-hour marks must match the daily ground truth (day 1→99.0, day 2→98.01,
      day 3→97.03). If it drops to ~5.2 after 72 h, the engine ran the daily equation at hourly
      rate (72× overcounting). If it stays at 100.0, the daily equation never fired — both are
      engine bugs. plasma_drug should decay smoothly at 0.1%/h regardless.
    result_cn: >
      body_mass 在每个 24 小时节点必须与逐日真值一致（第 1 天→99.0，第 2 天→98.01，第 3 天→
      97.03）。如果 72 小时后降至约 5.2，说明引擎以小时级频率运行了逐日方程（72 倍重复计算）；
      如果仍停留在 100.0，说明逐日方程从未触发——这两种情况都是引擎 bug。无论如何，
      plasma_drug 都应以每小时 0.1% 的速率平滑衰减。
    limitations: Purely a numeric engine-correctness fixture; no physiological meaning.
    limitations_cn: 纯粹是引擎数值正确性测试用例，不具有生理学意义。
  tags: [test, step_size, cross_import, hour, multi_scale]
imports:
- test_fixtures/valid/test_valid_step_cross_import_base

references: ["TEST: cross-step-size import — top model (1-hour step)"]

variables:
  plasma_drug:
    type: state
    value: 100.0
    unit: mg/L
    description: Plasma drug concentration; decays 0.1% per hour. Purely hourly variable.
    reference: "TEST synthetic"

equations:
  drug_decay:
    description: 0.1% per hour elimination (step=1 hour).
    step_unit: hour
    dynamics:
      plasma_drug: "plasma_drug - 0.001 * plasma_drug * step"
    priority: 5

simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-01-01"
  end_date: "2026-01-03"
  output_variables: [body_mass, plasma_drug]
