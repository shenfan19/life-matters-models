metadata:
  name: test_valid_pulse_reset_bounds_floor
  lm_format_version: "1.0"
  description:
    problem: >
      Regression fixture for the pulse-reset bounds-clamp bug: an input variable whose
      `bounds[0] > 0` must still read exactly its regimen `value` while the pulse fires,
      not `bounds[0] + value`. Each step, apply_schedules() zeroes controlled variables
      before re-accumulating the firing event's value (model.md pulse semantics); if that
      zeroing goes through the bounds-clamped setter, the floor gets pulled up to
      `bounds[0]` instead of true 0, inflating every firing step by `bounds[0]`.
    result: >
      dose fires daily at 08:00 with value=0.8 and bounds=[0.3, 2.0]. Every simulated step
      must show dose == 0.8 exactly (not 1.1, which is the pre-fix bug value).
    limitations: Not a physiological model; exists only to pin the reset/bounds interaction.
  tags: [test, pulse, bounds, regression]

variables:
  dose:
    type: input
    value: 0.8
    unit: "au"
    bounds: [0.3, 2.0]
    description: Daily pulse dose; bounds[0] > 0 is the condition that exposes the bug.

  dose_echo:
    type: state
    value: 0.0
    unit: "au"
    bounds: [0.0, 10.0]
    description: Copies dose each step so its trajectory is inspectable via output_variables.

equations:
  echo_dose:
    description: Mirrors dose into a state variable for CSV inspection.
    condition: true
    dynamics:
      dose_echo: "dose"
    priority: 1

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-05"
  output_variables: [dose, dose_echo]
  plans:
  - id: default
    label: "Daily dose"
    regimens:
    - variable: dose
      time_start: "08:00"
      value: 0.8
      label: "Daily dose (au)"

references: ["TEST: pulse reset must not be clamped to bounds[0]"]
