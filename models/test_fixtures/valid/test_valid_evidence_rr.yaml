metadata:
  todo:
    - type: noref
      issue: "Missing sufficient literature citation support (migrated from the old _noref filename suffix)"
      evidence: "Migrated from the old _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check for and fill in missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: test_valid_evidence_rr
  lm_format_version: "1.0"
  description:
    problem: >
      Validates Loader handling of the `rr` (relative risk) evidence subtype in isolation.
      `smoking_cvd_rr` must equal `value` (rr: effective = value, no auxiliary
      fields), and the effective value must be usable in a equation multiplying a baseline
      daily risk parameter.
    result: >
      `rr_display` = smoking_cvd_rr = 2.5 (constant, every step).
      `smoker_cvd_risk` accumulates at baseline_cvd_daily_risk × 2.5 = 0.0000825/day,
      reaching ≈0.00248 after 30 days (hand-written dynamics, baseline is a plain parameter).
      `smoker_cvd_risk_auto` (generated via `applies_to`, baseline is the `baseline_cvd_ir`
      evidence entry below) accumulates at baseline_cvd_ir × 2.5 / 365 ≈ 0.0000822/day,
      reaching ≈0.002466 after 30 days — a different baseline, so it won't numerically equal
      smoker_cvd_risk, but exercises the rr+baseline_ref+applies_to code path end to end.
    limitations: Values are illustrative; no clinical interpretation intended. TEST file.
  tags: [test, evidence, rr]

variables:
  rr_display:
    type: state
    value: 0.0
    unit: "dimensionless"
    description: Displays smoking_cvd_rr each step (expected constant 2.5).

  smoker_cvd_risk:
    type: state
    value: 0.0
    unit: cumulative_prob
    description: Cumulative CVD risk for a smoker (baseline_cvd_daily_risk × rr effective, hand-written).

  smoker_cvd_risk_auto:
    type: state
    value: 0.0
    unit: cumulative_prob
    description: Cumulative CVD risk for a smoker, generated by Loader via applies_to (baseline_cvd_ir × rr).

  baseline_cvd_daily_risk:
    type: parameter
    value: 0.000033
    unit: prob/day
    description: Illustrative baseline daily CVD risk for a non-smoker (parameter, not evidence).

  baseline_cvd_ir:
    type: parameter
    evidence_type: ir
    value: 0.012
    unit: prob/year
    rate_unit: year
    description: Baseline annual CVD incidence, used as baseline_ref for the applies_to demo below.

  smoking_cvd_rr:
    type: parameter
    evidence_type: rr
    value: 2.5
    baseline_ref: baseline_cvd_ir
    applies_to: smoker_cvd_risk_auto
    step_unit: day
    description: Relative risk of CVD for active smokers vs non-smokers.
    reference: "TODO:SOURCE"

equations:
  display_rr:
    description: "Shows smoking_cvd_rr (rr: effective = value)."
    dynamics:
      rr_display: "smoking_cvd_rr"
    priority: 0

  smoker_risk_accum:
    description: Cumulative smoker CVD risk = baseline daily risk × rr effective.
    step_unit: day
    dynamics:
      smoker_cvd_risk: "min(1.0, smoker_cvd_risk + baseline_cvd_daily_risk * smoking_cvd_rr * step)"
    priority: 3

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date:   "2026-01-31"
  output_variables: [rr_display, smoker_cvd_risk, smoker_cvd_risk_auto]

references: ["TEST: rr evidence subtype isolation"]
