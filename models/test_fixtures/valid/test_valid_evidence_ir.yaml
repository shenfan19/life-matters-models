      next: "核查并补充缺失的文献引用，或确认现有引用已足够后移除该 todo 项。"
  name: test_valid_evidence_ir
  lm_format_version: "1.0"
  description:
    problem: >
      Validates Loader handling of the `ir` (incidence rate) evidence subtype in isolation.
      `baseline_cvd_ir` must equal `value` (ir: effective = value, no auxiliary
      fields), and the effective value must be usable as a daily accumulation rate.
    problem_cn: >
      验证 Loader 对 `ir`（发病率，incidence rate）证据子类型的独立处理。
      `baseline_cvd_ir` 必须等于 `value`（ir 类型：有效值 = value，无需辅助字段），
      且该有效值必须能够作为按天的累积速率使用。
    result: >
      `ir_display` = baseline_cvd_ir = 0.012 (constant, every step, prob/year).
      `cvd_risk_baseline` accumulates at 0.012/365 ≈ 0.0000329/day,
      reaching ≈0.000986 after 30 days.
      `cvd_risk_baseline_auto` (generated via `applies_to`, no hand-written dynamics)
      must track `cvd_risk_baseline` exactly every step.
    result_cn: >
      `ir_display` = baseline_cvd_ir = 0.012（每一步恒定，单位 prob/year）。
      `cvd_risk_baseline` 按 0.012/365 ≈ 0.0000329/天 累积，30 天后达到约 0.000986。
      `cvd_risk_baseline_auto`（通过 `applies_to` 自动生成，没有手写 dynamics）
      必须在每一步都与 `cvd_risk_baseline` 精确一致。
    limitations: Values are illustrative; no clinical interpretation intended. TEST file.
    limitations_cn: 数值仅作示例，不作临床解读用途。测试文件。
  tags: [test, evidence, ir]
  references: ["TEST: ir evidence subtype isolation"]

variables:
  ir_display:
    type: state
    value: 0.0
    unit: prob/year
    description: Displays baseline_cvd_ir each step (expected constant 0.012).

  cvd_risk_baseline:
    type: state
    value: 0.0
    unit: cumulative_prob
    description: Cumulative baseline CVD risk from ir evidence effective value (hand-written dynamics).

  cvd_risk_baseline_auto:
    type: state
    value: 0.0
    unit: cumulative_prob
    description: Same accumulation as cvd_risk_baseline, but generated by Loader via applies_to.

  baseline_cvd_ir:
    type: parameter
    evidence_type: ir
    value: 0.012
    unit: prob/year
    rate_unit: year
    applies_to: cvd_risk_baseline_auto
    step_unit: day
    description: Baseline annual CVD incidence in non-smoking population.

equations:
  display_ir:
    description: "Shows baseline_cvd_ir (ir: effective = value)."
    dynamics:
      ir_display: "baseline_cvd_ir"
    priority: 0

  baseline_risk_accum:
    description: Baseline CVD daily risk from ir evidence effective value.
    step_unit: day
    dynamics:
      cvd_risk_baseline: "min(1.0, cvd_risk_baseline + baseline_cvd_ir / 365.0 * step)"
    priority: 3

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date:   "2026-01-31"
  output_variables: [ir_display, cvd_risk_baseline, cvd_risk_baseline_auto]
