metadata:
  todo:
    - type: noref
      issue: "缺少充分文献引用支持（从旧文件名后缀 _noref 迁移而来）"
      evidence: "迁移自旧版 _noref 后缀标记，尚未核查 metadata.references 及各变量 reference 字段的具体缺失项。"
      next: "核查并补充缺失的文献引用，或确认现有引用已足够后移除该 todo 项。"
  name: test_valid_evidence_hr
  lm_format_version: "1.0"
  description:
    problem: >
      Validates Loader handling of the `hr` (hazard ratio) evidence subtype in isolation.
      `statin_cvd_hr` must equal `baseline_cvd_ir × HR`
      (hr: effective = baseline_ir × value, requires `baseline_ref`
      pointing at an `ir` evidence variable in the same section).
    problem_cn: >
      验证 Loader 对 `hr`（风险比，hazard ratio）证据子类型的独立处理。
      `statin_cvd_hr` 必须等于 `baseline_cvd_ir × HR`（hr 类型：有效值 = baseline_ir ×
      value，需要 `baseline_ref` 指向同一 section 内的一个 `ir` 证据变量）。
    result: >
      `hr_display` = statin_cvd_hr = 0.012 × 0.75 = 0.009 (constant, every step).
      `statin_protected_risk` accumulates at 0.009/365 ≈ 0.0000247/day,
      reaching ≈0.00074 after 30 days.
      `statin_protected_risk_auto` (generated via `applies_to`, no hand-written dynamics)
      must track `statin_protected_risk` exactly every step.
    result_cn: >
      `hr_display` = statin_cvd_hr = 0.012 × 0.75 = 0.009（每一步恒定）。
      `statin_protected_risk` 按 0.009/365 ≈ 0.0000247/天 累积，30 天后达到约
      0.00074。`statin_protected_risk_auto`（通过 `applies_to` 自动生成，没有手写
      dynamics）必须在每一步都与 `statin_protected_risk` 精确一致。
    limitations: Values are illustrative; no clinical interpretation intended. TEST file.
    limitations_cn: 数值仅作示例，不作临床解读用途。测试文件。
  tags: [test, evidence, hr]
  references: ["TEST: hr evidence subtype isolation"]

variables:
  hr_display:
    type: state
    value: 0.0
    unit: prob/year
    description: Displays statin_cvd_hr each step (expected constant 0.009).

  statin_protected_risk:
    type: state
    value: 0.0
    unit: cumulative_prob
    description: Cumulative CVD risk under statin treatment (hand-written dynamics).

  statin_protected_risk_auto:
    type: state
    value: 0.0
    unit: cumulative_prob
    description: Same accumulation as statin_protected_risk, but generated by Loader via applies_to.

evidence:
  baseline_cvd_ir:
    type: ir
    value: 0.012
    unit: prob/year
    rate_unit: year
    description: Baseline annual CVD incidence, used as baseline_ref for the hr evidence below.
    reference: "TODO:SOURCE"

  statin_cvd_hr:
    type: hr
    value: 0.75
    baseline_ref: baseline_cvd_ir
    applies_to: statin_protected_risk_auto
    step_unit: day
    description: Statin reduces CVD hazard by 25%; effective = baseline_cvd_ir × 0.75.
    reference: "TODO:SOURCE"

formulas:
  display_hr:
    description: "Shows statin_cvd_hr (hr: effective = baseline_ir × HR)."
    dynamics:
      hr_display: "statin_cvd_hr"
    priority: 0

  protected_risk_accum:
    description: Cumulative CVD risk under statin treatment.
    step_unit: day
    dynamics:
      statin_protected_risk: "min(1.0, statin_protected_risk + statin_cvd_hr / 365.0 * step)"
    priority: 3

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date:   "2026-01-31"
  output_variables: [hr_display, statin_protected_risk, statin_protected_risk_auto]
