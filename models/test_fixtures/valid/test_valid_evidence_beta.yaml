metadata:
  todo:
    - type: noref
      issue: "Missing sufficient literature citation support (migrated from the old _noref filename suffix)"
      evidence: "Migrated from the old _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check for and fill in missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: test_valid_evidence_beta
  lm_format_version: "1.0"
  description:
    problem: >
      Validates Loader handling of the `beta` (regression coefficient) evidence subtype
      in isolation. `age_sbp_beta` must equal `value`
      (beta: effective = value, no auxiliary fields), and the effective value must be
      usable as a per-day rate (per-year coefficient ÷ 365).
    result: >
      `beta_display` = age_sbp_beta = 0.45 (constant, every step, mmHg/year).
      `systolic_bp` rises by 0.45/365 ≈ 0.00123 mmHg/day from a baseline of 120 mmHg,
      reaching ≈120.037 after 30 days.
    limitations: Values are illustrative; no clinical interpretation intended. TEST file.
  tags: [test, evidence, beta]

variables:
  beta_display:
    type: state
    value: 0.0
    unit: mmHg/year
    description: Displays age_sbp_beta each step (expected constant 0.45).

  systolic_bp:
    type: state
    value: 120.0
    unit: mmHg
    description: Systolic BP rising with age (beta evidence, per year → per day).

  age_sbp_beta:
    type: parameter
    evidence_type: beta
    value: 0.45
    unit: mmHg/year
    description: SBP rises 0.45 mmHg per year of age.
    reference: "TODO:SOURCE"

equations:
  display_beta:
    description: "Shows age_sbp_beta (beta: effective = value)."
    dynamics:
      beta_display: "age_sbp_beta"
    priority: 0

  bp_aging:
    description: SBP increases per day using beta evidence (mmHg/yr ÷ 365).
    step_unit: day
    dynamics:
      systolic_bp: "systolic_bp + age_sbp_beta / 365.0 * step"
    priority: 2

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date:   "2026-01-31"
  output_variables: [beta_display, systolic_bp]

references: ["TEST: beta evidence subtype isolation"]
