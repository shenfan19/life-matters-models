metadata:
  name: test_valid_opt_inner_mc
  lm_format_version: "1.0"
  description:
    problem: >
      Validates `optimization.mc.runs` (inner robust-optimization Monte Carlo): each
      candidate `dose` is evaluated across multiple samples of `absorption_rate`
      (an individual-variability `parameter` with a `normal(μ, σ)` distribution),
      and the optimization should use the aggregated (e.g. mean) objective across runs
      rather than a single deterministic draw.
    result: >
      `plasma` rises by `dose * absorption_rate` (one-time pulse at day 1) and decays
      at `elimination_rate = 0.1/day`. With `optimization.mc.runs: 5`, repeated optimization
      runs with the same `seed` should converge to a similar `dose` near its upper
      bound (maximize final plasma), and the reported objective should reflect the
      across-run average rather than a single noisy `absorption_rate` draw.
    limitations: Linear one-compartment toy PK; for engine validation only, not a calibrated PK model.
  tags: [test, optimization, mc, robust]
variables:
  plasma:
    type: state
    value: 0.0
    unit: mg/L
    description: Drug plasma concentration; rises with absorbed dose, decays at elimination_rate.

  dose:
    type: input
    value: 0.0
    unit: mg
    description: One-time oral dose (pulse) on day 1.

  absorption_rate:
    type: parameter
    value: "normal(0.5, 0.1)"
    unit: fraction
    bounds: [0.1, 1.0]
    description: "Individual absorption fraction; sampled once per MC run (σ=0.1 illustrative)."

  elimination_rate:
    type: parameter
    value: 0.1
    unit: 1/day
    description: First-order elimination rate constant.

equations:
  drug_pk:
    description: Dose pulse absorbed at absorption_rate, then first-order elimination.
    step_unit: day
    dynamics:
      plasma: "max(0.0, plasma + dose * absorption_rate - plasma * elimination_rate * step)"
    priority: 5

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-06"
  output_variables: [plasma, dose, absorption_rate]
  mc:
    runs: 5
    seed: 19
  plans:
  - id: "no_dose"
    label: "No dose (0 mg) — plasma stays at 0 regardless of absorption_rate"
    regimens:
    - variable: dose
      time_start: "00:00"
      value: 0.0
      date_range: ["2026-01-01", "2026-01-01"]
      label: "One-time dose (mg)"
  - id: "moderate_dose"
    label: "Moderate dose (50 mg) — plasma rises and decays at elimination_rate"
    regimens:
    - variable: dose
      time_start: "00:00"
      value: 50.0
      date_range: ["2026-01-01", "2026-01-01"]
      label: "One-time dose (mg)"
  - id: "high_dose"
    label: "High dose (100 mg, optimization upper bound) — highest final plasma"
    regimens:
    - variable: dose
      time_start: "00:00"
      value: 100.0
      date_range: ["2026-01-01", "2026-01-01"]
      label: "One-time dose (mg)"

optimization:
  method: nelder-mead
  objectives:
  - variable: plasma
    metric: final
    direction: maximize
    description: "Maximize final plasma concentration, robust to absorption_rate variability."
  startpoint:
    regimens:
    - variable: dose
      time_start: "00:00"
      time_end: "00:00"
      date_range: ["2026-01-01", "2026-01-01"]
      label: "Dose amount"
      optimize:
        value: [0.0, 100.0]
  mc:
    runs: 5
    seed: 19
  algorithm:
    population_size: 1
    n_generations: 40
    seed: 19

references: ["TEST: optimization.mc.runs (inner robust optimization)"]
