metadata:
  name: test_valid_opt_results
  lm_format_version: "1.0"
  description:
    problem: >
      Tests three features together: (1) optimizer evaluation window shorter than simulation
      (6-month eval vs 2-year visualisation); (2) pre-populated optimizer.results block with
      5 Pareto solutions from a prior run — the GUI must show historical results and offer
      warm-start at load time; (3) combined hard and soft constraint handling.
    problem_cn: >
      同时测试三个功能：（1）优化器评估窗口短于仿真窗口（6 个月评估 vs 2 年可视化）；
      （2）预填充的 optimizer.results 块，包含一次先前运行得到的 5 个 Pareto 解——GUI
      必须在加载时展示历史结果并提供热启动（warm-start）选项；（3）硬约束与软约束的
      组合处理。
    result: >
      At load, the GUI should display "5 historical solutions from 2026-05-20" and enable the
      warm-start checkbox. A fresh run should start from those seeds and refine the front
      within the 6-month eval window. Both constraints (cholesterol hard, energy-balance soft)
      must appear correctly in the GUI constraint panel.
    result_cn: >
      加载时，GUI 应显示 "5 historical solutions from 2026-05-20" 并启用热启动复选框。
      新一轮运行应从这些种子解出发，在 6 个月评估窗口内继续优化前沿。硬约束（胆固醇）
      与软约束（能量平衡）都应正确显示在 GUI 的约束面板中。
    limitations: Nutrient dynamics are simplified; parameters chosen for numeric clarity only.
    limitations_cn: 营养动力学经过简化，参数选取仅为了数值清晰，不代表真实生理值。
  tags: [test, opt_results, eval-window, warm-start, pareto, hard-soft-constraint]
  references: ["TEST: optimizer evaluation window + pre-filled results block"]
variables:
  muscle_mass:
    type: state
    value: 30.0
    unit: kg
    description: Skeletal muscle mass; rises with protein above anabolic threshold.

  fat_mass:
    type: state
    value: 20.0
    unit: kg
    description: Body fat mass; rises with excess caloric intake.

  cholesterol:
    type: state
    value: 4.5
    unit: mmol/L
    description: Total cholesterol; rises slightly with high protein + high fat intake.

  energy_balance:
    type: state
    value: 0.0
    unit: kcal/day
    description: Net daily energy balance (positive = surplus, negative = deficit).

  protein_intake:
    type: input
    value: 0.8
    unit: g/kg
    description: Daily protein intake event (per-event amount; fires once per day).

  carb_load:
    type: input
    value: 200.0
    unit: g
    description: Daily carbohydrate intake event (per-event amount; fires once per day).

  protein_anabolic_threshold:
    type: parameter
    value: 0.8
    unit: g/kg
    description: Minimum protein intake per event for net muscle synthesis.

  muscle_gain_rate:
    type: parameter
    value: 0.03
    unit: kg per g/kg excess
    description: Muscle gain per unit excess protein above threshold per day.

  muscle_loss_rate:
    type: parameter
    value: 0.002
    unit: kg/day
    description: Baseline daily muscle catabolism.

  fat_gain_per_carb:
    type: parameter
    value: 0.000025
    unit: kg per g
    description: Fat mass increase per g/day excess carbohydrate.

equations:
  muscle_dynamics:
    description: Net muscle mass change from protein excess and basal catabolism (rate × step).
    step_unit: hour
    dynamics:
      muscle_mass: "max(5.0, muscle_mass + (protein_intake - protein_anabolic_threshold) * muscle_gain_rate - muscle_loss_rate * step)"
    priority: 5

  fat_dynamics:
    description: Fat mass increases with carbohydrate surplus (simplified; rate × step).
    step_unit: hour
    dynamics:
      fat_mass: "max(3.0, fat_mass + carb_load * fat_gain_per_carb)"
    priority: 5

  cholesterol_dynamics:
    description: Cholesterol rises with high protein and fat intake (simplified rate × step).
    step_unit: hour
    dynamics:
      cholesterol: "max(2.0, min(8.0, 4.5 + (protein_intake - 0.8) * 0.3 + fat_mass * 0.005))"
    priority: 3

  energy_balance_calc:
    description: Approximate daily energy balance (equation, static indicator).
    step_unit: hour
    dynamics:
      energy_balance: "carb_load * 4.0 + protein_intake * 70.0 * 4.0 - 2000.0"
    priority: 1

simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-01-01"
  end_date: "2027-12-31"
  plans:
  - id: baseline
    label: "Baseline (0.8 g/kg protein, 200 g carbs) — at anabolic threshold, slow basal catabolism"
    regimens:
    - variable: protein_intake
      time_start: "08:00"
      value: 0.8
      label: "Protein 0.8 g/kg/day"
    - variable: carb_load
      time_start: "08:00"
      value: 200.0
      label: "Carbs 200 g/day"
  - id: high_protein_low_carb
    label: "High protein / low carb (1.80 g/kg, 130 g) — Pareto extreme: max muscle_mass, min fat_mass (pareto_front[4])"
    regimens:
    - variable: protein_intake
      time_start: "08:00"
      value: 1.80
      label: "Protein 1.80 g/kg/day"
    - variable: carb_load
      time_start: "08:00"
      value: 130.0
      label: "Carbs 130 g/day"
  - id: low_protein_high_carb
    label: "Low protein / high carb (0.70 g/kg, 320 g) — Pareto extreme: min muscle_mass, max fat_mass (pareto_front[0])"
    regimens:
    - variable: protein_intake
      time_start: "08:00"
      value: 0.70
      label: "Protein 0.70 g/kg/day"
    - variable: carb_load
      time_start: "08:00"
      value: 320.0
      label: "Carbs 320 g/day"
  output_variables: [muscle_mass, fat_mass, cholesterol, energy_balance, protein_intake, carb_load]

optimizer:
  method: nsga2

  # Evaluation window shorter than simulation (6 months vs 2 years → faster search)
  start_date: "2026-01-01"
  end_date: "2026-06-30"
  step_size:
    value: 1
    unit: hour

  objectives:
  - variable: muscle_mass
    metric: final
    direction: maximize
  - variable: fat_mass
    metric: final
    direction: minimize

  constraints:
  - variable: cholesterol
    condition: "<= 6.0"
    type: hard
  - variable: energy_balance
    condition: ">= -500"
    type: soft

  startpoint:
    regimens:
    - variable: protein_intake
      time_start: "08:00"
      time_end: "08:00"
      label: "Daily protein (g/kg/day)"
      optimize:
        value: [0.5, 2.0]
    - variable: carb_load
      time_start: "08:00"
      time_end: "08:00"
      label: "Daily carbohydrates (g/day)"
      optimize:
        value: [100.0, 350.0]

  algorithm:
    population_size: 30
    n_generations: 60
    seed: 19


  # Pre-filled results block — tests GUI warm-start display and Pareto visualization
  results:
    generated_at: "2026-05-20"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 43.7
    pareto_front:
    - {x: [0.70, 320.0], f: [-29.8, 21.5]}
    - {x: [0.90, 280.0], f: [-30.4, 20.8]}
    - {x: [1.10, 240.0], f: [-31.1, 20.2]}
    - {x: [1.40, 190.0], f: [-31.6, 19.5]}
    - {x: [1.80, 130.0], f: [-32.0, 18.4]}
    recommended:
      x: [1.10, 240.0]
      f: [-31.1, 20.2]
