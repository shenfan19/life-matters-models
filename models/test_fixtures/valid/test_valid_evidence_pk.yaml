  name: test_valid_evidence_pk
  lm_format_version: "1.0"
  description:
    problem: >
      Validates Loader handling of the `pk` (PK/PD parameter) evidence subtype in isolation.
      `drug_ke` must equal `value` (pk: effective = value, no auxiliary fields),
      and the effective value (in 1/hour) must be usable directly in an hour-step elimination
      formula (step_unit: hour, sim step_size: 1 hour → step=1, no extra conversion factor).
    problem_cn: >
      验证 Loader 对 `pk`（PK/PD 参数）证据子类型的独立处理。`drug_ke` 必须等于
      `value`（pk 类型：有效值 = value，无需辅助字段），且该有效值（单位 1/hour）
      必须能够直接用于以小时为步长的消除公式（step_unit: hour，仿真 step_size:
      1 小时 → step=1，无需额外换算系数）。
    result: >
      `pk_display` = drug_ke = 0.0347 (constant, every step, 1/hour;
      t½ ≈ ln2 / 0.0347 ≈ 20 h).
      `drug_conc` rises by daily 100 mg oral dose pulses (80% bioavailability, Vd = 10 L)
      and decays at drug_conc × 0.0347 per hour between doses (t½ ≈ 20 h), settling into a
      daily peak-trough oscillation rather than decaying to ≈0 between doses.
    result_cn: >
      `pk_display` = drug_ke = 0.0347（每一步恒定，单位 1/hour；半衰期
      t½ ≈ ln2 / 0.0347 ≈ 20 小时）。`drug_conc` 每日因 100 mg 口服剂量脉冲而上升
      （生物利用度 80%，Vd = 10 L），并在两次给药之间以 drug_conc × 0.0347 每小时
      的速率衰减（t½ ≈ 20 小时），最终形成每日的峰谷振荡，而不是在两次给药之间
      衰减至约 0。
    limitations: Values are illustrative; no clinical interpretation intended. TEST file.
    limitations_cn: 数值仅作示例，不作临床解读用途。测试文件。
  tags: [test, evidence, pk]
  references: ["TEST: pk evidence subtype isolation"]

variables:
  pk_display:
    type: state
    value: 0.0
    unit: 1/hour
    description: Displays drug_ke each step (expected constant 0.0347).

  drug_conc:
    type: state
    value: 0.0
    unit: mg/L
    description: Drug plasma concentration (uses pk evidence ke, in 1/h → ×24 for day steps).

  drug_dose:
    type: input
    value: 0.0
    unit: mg
    description: Daily oral drug dose (pulse; 80% bioavailability, Vd = 10 L in formula).

evidence:
  drug_ke:
    type: pk
    value: 0.0347
    unit: 1/hour
    description: Drug elimination rate constant; ke = ln2/t½, t½ ≈ 20 h.
    reference: "TODO:SOURCE"

formulas:
  display_pk:
    description: "Shows drug_ke (pk: effective = value)."
    dynamics:
      pk_display: "drug_ke"
    priority: 0

  drug_pk:
    description: Drug PK — absorption pulse + elimination; ke is already an hourly rate
      (unit 1/hour) and step_unit is hour (step=1), so no extra ×24 conversion is needed.
    step_unit: hour
    dynamics:
      drug_conc: "max(0.0, drug_conc + drug_dose * 0.8 / 10.0 - drug_conc * drug_ke * step)"
    priority: 5

simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-01-01"
  end_date:   "2026-01-31"
  output_variables: [pk_display, drug_conc, drug_dose]
  plans:
    - id: "default"
      label: "Default"
      regimens:
        - variable: drug_dose
          time_start: "08:00"
          value: 100.0
          label: "Daily drug dose 100 mg"
