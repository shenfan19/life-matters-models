metadata:
  todo:
    - type: quality
      issue: "优化器 Pareto 前沿坍缩为单点；默认仿真从未触发 latch（lm_alive 始终为1，lm_score_irreversible 与 lm_score 从未分化）"
      evidence: >
        2026-06-14_16-27-43 批量结果：8 代全部 "Pareto CSV: ... (1 solutions)"，最终解 lm_score=729,
        sbp=60.28（x0≈50.4mg, x1≈111.1mg）——maximize lm_score 与 minimize sbp(mean) 方向一致
        （sbp 越低，sbp<=160 的天数越多），不构成真正的多目标权衡。
        同时默认 plan（50mg/80mg）使 sbp 单调趋向 60 的下限，从未接近 220 的 stroke 阈值，
        problem 中描述的 "Latch mode" 在 sim 和 opt 输出中均未被实际验证。
      next: >
        本次已调整：(1) optimizer 第二目标改为 minimize antihypertensive(mean)，与
        maximize lm_score 形成真实的"用药量 vs 健康天数"权衡；(2) 提高 bp_natural_rise
        并调整默认 plan（前 ~235 天停药）使 sbp 在默认仿真中越过 220 触发 latch。
        重新跑 --sim/--opt 后验证：Pareto 前沿应出现多点解；默认 sim 中 lm_alive 应在约
        第235天变为0，此后 lm_score 与 lm_score_irreversible 应分化（lm_score 在停药期暂停、
        给药后恢复累积，lm_score_irreversible 永久冻结）。若数值与预期偏差较大，按实际结果
        调整 bp_natural_rise / plan 切换时间点。
  log:
    "2026-06-14_20-57-26":
      change: >
        optimizer 第二目标 sbp(mean,minimize) -> antihypertensive(mean,minimize)；
        bp_natural_rise 0.05 -> 0.3 mmHg/day；默认 plan 第一段改为停药(0mg)
        覆盖 2026-01-01~2026-08-23（约235天），第二段(80mg)覆盖其后至 2027-12-31。
      reason: >
        原配置下两个优化目标方向一致（都偏好更低 sbp），Pareto 前沿坍缩为单点；
        且默认 plan 下 sbp 从未接近 220，problem 中声明要验证的 latch/lm_alive/
        lm_score_irreversible 机制从未被实际触发，与模型主旨不符。
  name: test_valid_lm_score
  lm_format_version: "1.0"
  description:
    problem: >
      Validates both lm_score semantics on a hypertension management model. Cumulative mode:
      healthy days accumulate while SBP ≤ 160 mmHg, pause during hypertensive episodes, and
      resume on recovery. Latch mode: once SBP exceeds the stroke threshold (220 mmHg),
      lm_alive permanently flips to 0 — no further accumulation even if BP normalises. BP
      is controlled via an antihypertensive dose input; thresholds are set to be reachable.
    problem_cn: >
      在一个高血压管理模型上验证 lm_score 的两种语义。累积（Cumulative）模式：当 SBP
      （收缩压）≤ 160 mmHg 时健康天数累积，在高血压发作期间暂停，恢复后继续累积。
      锁存（Latch）模式：一旦 SBP 超过卒中阈值（220 mmHg），lm_alive 永久变为 0——
      即使血压之后恢复正常也不再累积。血压通过降压药剂量（input）控制；各阈值均设置
      为可实际触及。
    result: >
      Default plan (withhold dosing for ~235 days, then 80mg/day): sbp rises from 150 at
      +0.3 mmHg/day. lm_score accumulates on days 1-33 (sbp<=160) then pauses while sbp
      climbs past 160. Around day 235, sbp (pre-progression) exceeds 220 -> stroke_latch
      sets lm_alive=0 permanently, freezing lm_score_irreversible at ~234. Treatment then
      brings sbp back below 160 by ~day 242; lm_score resumes accumulating (lm_score
      ends near ~520) while lm_score_irreversible stays frozen at ~234 -- the two
      counters visibly diverge, demonstrating cumulative (recoverable) vs latch
      (irreversible) semantics. Exact day counts to be confirmed by re-running --sim.
      Optimizer: maximize lm_score (final) vs minimize antihypertensive (mean) now form
      a genuine trade-off bounded by the sbp<=220 / sbp>=90 hard constraints, so the
      Pareto front should contain multiple solutions (not collapse to one point).
    result_cn: >
      默认给药方案（停药约 235 天，之后每天 80mg）：sbp 从 150 开始，以 +0.3 mmHg/day
      上升。lm_score 在第 1-33 天（sbp<=160）累积，此后在 sbp 升破 160 期间暂停。约第
      235 天，sbp（在病情进展前）超过 220，触发 stroke_latch，使 lm_alive 永久置 0，
      lm_score_irreversible 冻结在约 234。此后治疗使 sbp 在约第 242 天回落到 160 以下；
      lm_score 恢复累积（最终约达 520），而 lm_score_irreversible 始终冻结在约 234——
      两个计数器出现明显分化，体现累积（可恢复）与锁存（不可逆）两种语义的差异。具体
      天数以重新运行 --sim 的结果为准。优化器：maximize lm_score（final）与 minimize
      antihypertensive（mean）在 sbp<=220 / sbp>=90 硬约束下现已构成真正的权衡，因此
      Pareto 前沿应包含多个解（而非坍缩为单点）。
    limitations: Simplified first-order BP dynamics; not validated clinically.
    limitations_cn: 简化的一阶血压动力学；未经临床验证。
  tags: [test, lm_score, latch, cumulative, hypertension, irreversible]
  references: ["TEST: lm_score cumulative and latch modes"]

variables:
  # --- Blood pressure dynamics ---
  sbp:
    type: state
    value: 150.0
    unit: mmHg
    description: Systolic blood pressure; elevated baseline (Stage 2 hypertension).

  antihypertensive:
    type: input
    value: 0.0
    unit: mg
    description: Daily antihypertensive dose (pulse; lowers SBP per mg in equation).

  bp_effect_per_mg:
    type: parameter
    value: 0.12
    unit: mmHg per mg
    description: SBP reduction per mg of antihypertensive (immediate pulse effect).

  bp_natural_rise:
    type: parameter
    value: 0.3
    unit: mmHg/day
    description: Daily untreated SBP rise due to disease progression.

  # --- Cumulative (recoverable) lm_score ---
  lm_score:
    type: state
    value: 0.0
    unit: day
    description: |
      Cumulative healthy days (SBP <= 160 mmHg).
      Recoverable: pauses during hypertensive episodes, resumes on recovery.

  # --- Latch (irreversible) lm_score ---
  lm_score_irreversible:
    type: state
    value: 0.0
    unit: day
    description: |
      Cumulative days while lm_alive = 1, irreversible latch mode.
      Permanently stops accumulating after first stroke event (SBP > 220 mmHg).

  lm_alive:
    type: state
    value: 1.0
    unit: "flag"
    description: |
      Survival flag for latch mode; 1 = alive, 0 = stroke event (irreversible).
      Once set to 0, lm_score_irreversible stops accumulating forever.

equations:
  # --- BP dynamics ---
  bp_treatment:
    description: Antihypertensive dose reduces SBP (pulse, no step).
    dynamics:
      sbp: "max(60.0, sbp - antihypertensive * bp_effect_per_mg)"
    priority: 10

  bp_progression:
    description: Untreated disease progression raises SBP daily (rate × step).
    step_unit: hour
    dynamics:
      sbp: "min(250.0, sbp + bp_natural_rise * step)"
    priority: 5

  # --- Cumulative lm_score (recoverable) ---
  lm_score_update:
    description: |
      Accumulate healthy days when SBP <= 160 mmHg.
      Condition not met → no accumulation; resumes automatically when BP controlled.
    step_unit: hour
    dynamics:
      lm_score: "lm_score + step if sbp <= 160.0 else lm_score"
    priority: 2

  # --- Latch lm_score (irreversible) ---
  stroke_latch:
    description: |
      Stroke event: SBP > 220 mmHg permanently sets lm_alive = 0.
      Once 0, it stays 0 even if BP normalizes (irreversible latch).
    condition: "sbp > 220.0"
    dynamics:
      lm_alive: "0.0"
    priority: 8

  lm_score_irreversible_update:
    description: |
      Accumulate healthy days only while lm_alive = 1.
      After stroke (lm_alive=0), accumulation permanently stops.
    step_unit: hour
    dynamics:
      lm_score_irreversible: "lm_score_irreversible + lm_alive * step"
    priority: 2

simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-01-01"
  end_date: "2027-12-31"
  plans:
    - id: default
      label: "No treatment then 80mg (latch triggers ~day 235) — lm_score and lm_score_irreversible diverge after the stroke event"
      regimens:
        - variable: antihypertensive
          time_start: "08:00"
          value: 0.0
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-01-01", "2026-08-23"]
          label: "No treatment (~235 days, lets sbp breach 220 and trigger latch)"
        - variable: antihypertensive
          time_start: "08:00"
          value: 80.0
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-08-24", "2027-12-31"]
          label: "Antihypertensive 80 mg (treatment after latch)"
    - id: early_treatment
      label: "Treated from day 1 (30mg/day) — sbp never exceeds 220, lm_alive stays 1, lm_score == lm_score_irreversible throughout (no divergence)"
      regimens:
        - variable: antihypertensive
          time_start: "08:00"
          value: 30.0
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-01-01", "2027-12-31"]
          label: "Antihypertensive 30 mg/day from day 1"
  output_variables: [sbp, lm_score, lm_score_irreversible, lm_alive, antihypertensive]

optimizer:
  method: nsga2
  objectives:
    # Maximize cumulative lm_score (healthy days with controlled SBP),
    # trading off against average drug burden (antihypertensive mean dose).
    - variable: lm_score
      metric: final
      direction: maximize
    - variable: antihypertensive
      metric: mean
      direction: minimize
  constraints:
    - variable: sbp
      condition: "<= 220"
      type: hard
    - variable: sbp
      condition: ">= 90"
      type: hard
      description: "避免降压过度导致医源性低血压（正常收缩压下限约90 mmHg）"
  startpoint:
    regimens:
      - variable: antihypertensive
        time_start: "08:00"
        time_end: "08:00"
        label: "Antihypertensive dose first half (mg)"
        optimize:
          value: [0.0, 120.0]
      - variable: antihypertensive
        time_start: "08:00"
        time_end: "08:00"
        label: "Antihypertensive dose second half (mg)"
        optimize:
          value: [0.0, 120.0]
  algorithm:
    population_size: 30
    n_generations: 50
    seed: 19
