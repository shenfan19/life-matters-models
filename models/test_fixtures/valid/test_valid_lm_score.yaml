metadata:
  todo:
    - type: quality
      issue: "The optimizer's Pareto front collapses to a single point; the default simulation never triggers latch (lm_alive stays at 1 the whole time, and lm_score_irreversible never diverges from lm_score)"
      evidence: >
        The 2026-06-14_16-27-43 batch result: all 8 generations report "Pareto CSV: ... (1 solutions)",
        with the final solution lm_score=729, sbp=60.28 (x0 approximately 50.4mg, x1 approximately 111.1mg).
        Maximizing lm_score and minimizing sbp(mean) point in the same direction (a lower sbp means more
        days with sbp<=160), so this is not a genuine multi-objective tradeoff. The default plan (50mg/80mg)
        also drives sbp monotonically toward its lower bound of 60, never approaching the stroke threshold
        of 220, so the "Latch mode" described in problem is never actually exercised in either the sim or
        the opt output.
      next: >
        Adjusted this round: (1) optimization's second objective changed to minimize antihypertensive(mean),
        forming a genuine dose-versus-healthy-days tradeoff against maximize lm_score; (2) bp_natural_rise
        raised, and the default plan adjusted (withholding medication for the first approximately 235 days)
        so that sbp crosses 220 and triggers latch within the default simulation.
        After rerunning --sim/--opt, verify: the Pareto front should show multiple solutions; in the default
        sim, lm_alive should drop to 0 around day 235, after which lm_score and lm_score_irreversible should
        diverge (lm_score pausing while medication is withheld and resuming accumulation once it restarts,
        lm_score_irreversible frozen permanently). If the numbers deviate substantially from expectation,
        adjust bp_natural_rise or the plan's switch timing based on the actual result.
  log:
    "2026-06-14_20-57-26":
      change: >
        optimization's second objective changed from sbp(mean,minimize) to antihypertensive(mean,minimize);
        bp_natural_rise changed from 0.05 to 0.3 mmHg/day; the default plan's first segment changed to
        withholding medication (0mg), covering 2026-01-01~2026-08-23 (about 235 days), with the second
        segment (80mg) covering the rest through 2027-12-31.
      reason: >
        Under the original configuration, the two optimization objectives pointed in the same direction
        (both favoring a lower sbp), collapsing the Pareto front to a single point; and under the default
        plan, sbp never approached 220, so the latch/lm_alive/lm_score_irreversible mechanism problem
        declares it should validate was never actually triggered, inconsistent with the model's stated
        purpose.
  name: test_valid_lm_score
  lm_format_version: "1.0"
  description:
    problem: >
      Validates both lm_score semantics on a hypertension management model. Cumulative mode:
      healthy days accumulate while SBP ≤ 160 mmHg, pause during hypertensive episodes, and
      resume on recovery. Latch mode: once SBP exceeds the stroke threshold (220 mmHg),
      lm_alive permanently flips to 0 — no further accumulation even if BP normalises. BP
      is controlled via an antihypertensive dose input; thresholds are set to be reachable.
    result: >
      Default plan (withhold dosing for ~235 days, then 80mg/day): sbp rises from 150 at
      +0.3 mmHg/day. lm_score accumulates on days 1-33 (sbp<=160) then pauses while sbp
      climbs past 160. Around day 235, sbp (pre-progression) exceeds 220 -> stroke_latch
      sets lm_alive=0 permanently, freezing lm_score_irreversible at ~234. Treatment then
      brings sbp back below 160 by ~day 242; lm_score resumes accumulating (lm_score
      ends near ~520) while lm_score_irreversible stays frozen at ~234 -- the two
      counters visibly diverge, demonstrating cumulative (recoverable) vs latch
      (irreversible) semantics. Exact day counts to be confirmed by re-running --sim.
      optimization: maximize lm_score (final) vs minimize antihypertensive (mean) now form
      a genuine trade-off bounded by the sbp<=220 / sbp>=90 hard constraints, so the
      Pareto front should contain multiple solutions (not collapse to one point).
    limitations: Simplified first-order BP dynamics; not validated clinically.
  tags: [test, lm_score, latch, cumulative, hypertension, irreversible]

variables:
  # --- Blood pressure dynamics ---
  sbp:
    type: state
    value: 150.0
    unit: mmHg
    description: Systolic blood pressure; elevated baseline (Stage 2 hypertension).

  antihypertensive:
    type: input
    value: 0.0
    unit: mg
    description: Daily antihypertensive dose (pulse; lowers SBP per mg in equation).

  bp_effect_per_mg:
    type: parameter
    value: 0.12
    unit: mmHg per mg
    description: SBP reduction per mg of antihypertensive (immediate pulse effect).

  bp_natural_rise:
    type: parameter
    value: 0.3
    unit: mmHg/day
    description: Daily untreated SBP rise due to disease progression.

  # --- Cumulative (recoverable) lm_score ---
  lm_score:
    type: state
    value: 0.0
    unit: day
    description: |
      Cumulative healthy days (SBP <= 160 mmHg).
      Recoverable: pauses during hypertensive episodes, resumes on recovery.

  # --- Latch (irreversible) lm_score ---
  lm_score_irreversible:
    type: state
    value: 0.0
    unit: day
    description: |
      Cumulative days while lm_alive = 1, irreversible latch mode.
      Permanently stops accumulating after first stroke event (SBP > 220 mmHg).

  lm_alive:
    type: state
    value: 1.0
    unit: "flag"
    description: |
      Survival flag for latch mode; 1 = alive, 0 = stroke event (irreversible).
      Once set to 0, lm_score_irreversible stops accumulating forever.

equations:
  # --- BP dynamics ---
  bp_treatment:
    description: Antihypertensive dose reduces SBP (pulse, no step).
    dynamics:
      sbp: "max(60.0, sbp - antihypertensive * bp_effect_per_mg)"
    priority: 10

  bp_progression:
    description: Untreated disease progression raises SBP daily (rate × step).
    step_unit: hour
    dynamics:
      sbp: "min(250.0, sbp + bp_natural_rise * step)"
    priority: 5

  # --- Cumulative lm_score (recoverable) ---
  lm_score_update:
    description: |
      Accumulate healthy days when SBP <= 160 mmHg.
      Condition not met → no accumulation; resumes automatically when BP controlled.
    step_unit: hour
    dynamics:
      lm_score: "lm_score + step if sbp <= 160.0 else lm_score"
    priority: 2

  # --- Latch lm_score (irreversible) ---
  stroke_latch:
    description: |
      Stroke event: SBP > 220 mmHg permanently sets lm_alive = 0.
      Once 0, it stays 0 even if BP normalizes (irreversible latch).
    condition: "sbp > 220.0"
    dynamics:
      lm_alive: "0.0"
    priority: 8

  lm_score_irreversible_update:
    description: |
      Accumulate healthy days only while lm_alive = 1.
      After stroke (lm_alive=0), accumulation permanently stops.
    step_unit: hour
    dynamics:
      lm_score_irreversible: "lm_score_irreversible + lm_alive * step"
    priority: 2

simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-01-01"
  end_date: "2027-12-31"
  plans:
    - id: default
      label: "No treatment then 80mg (latch triggers ~day 235) — lm_score and lm_score_irreversible diverge after the stroke event"
      regimens:
        - variable: antihypertensive
          time_start: "08:00"
          value: 0.0
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-01-01", "2026-08-23"]
          label: "No treatment (~235 days, lets sbp breach 220 and trigger latch)"
        - variable: antihypertensive
          time_start: "08:00"
          value: 80.0
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-08-24", "2027-12-31"]
          label: "Antihypertensive 80 mg (treatment after latch)"
    - id: early_treatment
      label: "Treated from day 1 (30mg/day) — sbp never exceeds 220, lm_alive stays 1, lm_score == lm_score_irreversible throughout (no divergence)"
      regimens:
        - variable: antihypertensive
          time_start: "08:00"
          value: 30.0
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-01-01", "2027-12-31"]
          label: "Antihypertensive 30 mg/day from day 1"
  output_variables: [sbp, lm_score, lm_score_irreversible, lm_alive, antihypertensive]

optimization:
  method: nsga2
  objectives:
    # Maximize cumulative lm_score (healthy days with controlled SBP),
    # trading off against average drug burden (antihypertensive mean dose).
    - variable: lm_score
      metric: final
      direction: maximize
    - variable: antihypertensive
      metric: mean
      direction: minimize
  constraints:
    - variable: sbp
      condition: "<= 220"
      type: hard
    - variable: sbp
      condition: ">= 90"
      type: hard
      description: "Avoids overcorrection into iatrogenic hypotension; a normal systolic pressure lower bound is about 90 mmHg"
  startpoint:
    regimens:
      - variable: antihypertensive
        time_start: "08:00"
        time_end: "08:00"
        label: "Antihypertensive dose first half (mg)"
        optimize:
          value: [0.0, 120.0]
      - variable: antihypertensive
        time_start: "08:00"
        time_end: "08:00"
        label: "Antihypertensive dose second half (mg)"
        optimize:
          value: [0.0, 120.0]
  algorithm:
    population_size: 30
    n_generations: 50
    seed: 19

references: ["TEST: lm_score cumulative and latch modes"]
