metadata:
  name: test_invalid_step_size
  lm_format_version: "1.0"
  description:
    problem: >
      ERROR-DETECTION FIXTURE (intentionally invalid). `simulation.step_size.value`
      is 0, which `Validator.validate_model` (validator.py) requires to be a
      positive number.
    result: >
      Loading this model must raise ValueError containing
      "simulation.step_size is required and must be a positive number". See test_verification/errors/test_structural_errors.py.
    limitations: Not a real model; exists only to exercise this one validator check.
  tags: [test, error-detection, structural, step_size]

variables:
  x:
    type: state
    value: 1.0
    unit: unit
    description: Placeholder state variable; irrelevant to the error under test.

simulation:
  step_size:
    value: 0
    unit: hour
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [x]

references: ["TEST(error-detection): simulation.step_size must be > 0"]
