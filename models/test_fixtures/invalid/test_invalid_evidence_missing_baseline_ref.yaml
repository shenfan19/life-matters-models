metadata:
  name: test_invalid_evidence_missing_baseline_ref
  lm_format_version: "1.0"
  description:
    problem: >
      ERROR-DETECTION FIXTURE (intentionally invalid). The `rr` (relative
      risk) evidence entry `smoker_cvd_rr` declares `applies_to` (auto-wiring
      into a state's dynamics) but omits the required `baseline_ref`, which
      must point at an `ir`/`ard` evidence entry in the same file. Per
      `docs/model.md`, rr/or evidence types cannot compute an absolute rate
      without a baseline. `Loader._apply_model_data` (loader.py) must reject
      this rather than silently generating a equation with an undefined
      baseline.
    result: >
      Loading this model must raise ValueError containing "baseline_ref must be declared"
      and "ir/ard". See test_verification/errors/test_evidence_errors.py.
    limitations: Not a real model; exists only to exercise this one loader check.
  tags: [test, error-detection, evidence, baseline_ref]

variables:
  smoker_cvd_risk_auto:
    type: state
    value: 0.0
    unit: cumulative_prob
    description: Target state for the auto-generated applies_to dynamics (never reached; load must fail first).

  smoker_cvd_rr:
    type: parameter
    evidence_type: rr
    value: 2.0
    applies_to: smoker_cvd_risk_auto
    step_unit: day
    description: Relative risk of CVD for smokers; deliberately missing baseline_ref.
    reference: "TEST fixture, no real source"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-31"
  output_variables: [smoker_cvd_risk_auto]

references: ["TEST(error-detection): rr/or applies_to requires baseline_ref"]
