metadata:
  name: test_invalid_equation_undefined_var
  lm_format_version: "1.0"
  description:
    problem: >
      ERROR-DETECTION FIXTURE (intentionally invalid). Equation `bad_dynamics`
      references `undeclared_var` on the right-hand side of its `dynamics`
      expression, but no such variable or equation exists anywhere in this
      file — `Validator.validate_equations` (validator.py) does AST-based
      undefined-variable detection and must catch this.
    result: >
      Loading this model must raise ValueError containing "Missing variables"
      and "undeclared_var". See test_verification/errors/test_structural_errors.py.
    limitations: Not a real model; exists only to exercise this one validator check.
  tags: [test, error-detection, structural, equation]

variables:
  x:
    type: state
    value: 1.0
    unit: unit
    description: Placeholder state variable; irrelevant to the error under test.

equations:
  bad_dynamics:
    description: References an undeclared variable on purpose.
    step_unit: hour
    dynamics:
      x: "x + undeclared_var * step"
    priority: 0

simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [x]

references: ["TEST(error-detection): dynamics must only reference declared variables"]
