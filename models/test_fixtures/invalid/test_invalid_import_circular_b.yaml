metadata:
  name: test_invalid_import_circular_b
  lm_format_version: "1.0"
  description:
    problem: >
      ERROR-DETECTION FIXTURE (intentionally invalid). Imports
      test_invalid_import_circular_a, which imports this file back — a
      direct circular import. `Loader._load_model_data` (loader.py) must
      detect this and raise before parsing either file's variables/equations,
      not hang or silently drop one side of the cycle.
    result: >
      Loading this model (or its sibling _a) must fail with ValueError
      containing "a circular import was detected" and naming the chain b -> a -> b (or the
      reverse). See test_verification/errors/test_import_errors.py.
    limitations: Not a real model; exists only to exercise circular-import detection.
  tags: [test, error-detection, import, circular]

imports:
- test_fixtures/invalid/test_invalid_import_circular_a

references: ["TEST(error-detection): circular import must raise ValueError"]
