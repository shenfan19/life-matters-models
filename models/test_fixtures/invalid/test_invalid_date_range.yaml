metadata:
  name: test_invalid_date_range
  lm_format_version: "1.0"
  description:
    problem: >
      ERROR-DETECTION FIXTURE (intentionally invalid). `simulation.end_date`
      ("2026-01-01") is before `simulation.start_date` ("2026-06-30"). This
      model loads and validates structurally without error — the check lives
      in `validation.py::validate_simulator_dates`, called upfront by
      `run_simulation`/`run_simulation_mc`/`start_session` (ADR 0118), not by
      `Validator.validate_model`. So the failure only surfaces when actually
      running the model, not merely loading it.
    result: >
      Calling run_simulation()/run_simulation_mc()/start_session() on this
      model must raise/return an error containing "end_date" and
      "is before". See test_verification/errors/test_date_errors.py.
    limitations: Not a real model; exists only to exercise the upfront
      date-range check.
  tags: [test, error-detection, date, schedule]

variables:
  x:
    type: state
    value: 1.0
    unit: unit
    description: Placeholder state variable; irrelevant to the error under test.

equations:
  noop:
    description: No-op dynamics; irrelevant to the error under test.
    step_unit: hour
    dynamics:
      x: "x"
    priority: 0

simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-06-30"
  end_date: "2026-01-01"
  output_variables: [x]

references: ["TEST(error-detection): simulation.end_date must not precede start_date"]
