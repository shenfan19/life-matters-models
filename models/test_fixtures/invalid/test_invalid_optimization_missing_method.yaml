metadata:
  name: test_invalid_optimization_missing_method
  lm_format_version: "1.0"
  description:
    problem: >
      ERROR-DETECTION FIXTURE (intentionally invalid). The `optimization:` block
      declares objectives/startpoint/algorithm but omits the required
      `method` field, which `Validator.validate_model` (validator.py) requires.
    result: >
      Loading this model must raise ValueError containing
      "optimization is missing method". See test_verification/errors/test_structural_errors.py.
    limitations: Not a real model; exists only to exercise this one validator check.
  tags: [test, error-detection, structural, optimization]

variables:
  x:
    type: input
    value: 0.0
    unit: unit
    description: Placeholder input variable; irrelevant to the error under test.

  y:
    type: state
    value: 1.0
    unit: unit
    description: Placeholder state variable; irrelevant to the error under test.

simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [y]

optimization:
  objectives:
  - variable: y
    metric: final
    direction: minimize
  startpoint:
    regimens:
    - variable: x
      time_start: "00:00"
      time_end: "00:00"
      label: "Placeholder decision variable"
      optimize:
        value: [0.0, 10.0]
  algorithm:
    population_size: 10
    n_generations: 5
    seed: 19

references: ["TEST(error-detection): optimization.method is required"]
