metadata:
  name: test_invalid_equation_deprecated_dt
  lm_format_version: "1.0"
  description:
    problem: >
      ERROR-DETECTION FIXTURE (intentionally invalid). Equation `bad_dynamics`
      uses the deprecated symbol `dt` instead of `step` in its dynamics
      expression — `Validator.validate_equations` (validator.py) must reject
      this rather than silently accepting the old symbol.
    result: >
      Loading this model must raise ValueError containing
      "the deprecated symbol dt/step_size was used; use step instead". See test_verification/errors/test_structural_errors.py.
    limitations: Not a real model; exists only to exercise this one validator check.
  tags: [test, error-detection, structural, equation]

variables:
  x:
    type: state
    value: 1.0
    unit: unit
    description: Placeholder state variable; irrelevant to the error under test.

equations:
  bad_dynamics:
    description: Uses the deprecated `dt` symbol on purpose.
    step_unit: hour
    dynamics:
      x: "x + 1.0 * dt"
    priority: 0

simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [x]

references: ["TEST(error-detection): dynamics must use `step`, not deprecated `dt`/`step_size`"]
