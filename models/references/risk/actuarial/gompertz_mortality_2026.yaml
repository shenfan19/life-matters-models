category: risk

metadata:
  name: gompertz_mortality
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: |
      Validation purpose: a cross-disciplinary extension into actuarial science and risk studies,
      the first case in the risk category. Gompertz (1825) observed that mortality risk after
      adulthood rises exponentially with age, and "roughly doubling every 8 years" is a widely cited
      empirical rule, corresponding to a Gompertz coefficient b of about 0.0866/year, repeatedly
      confirmed by modern demographic data to fit extremely well from mid-life onward.
    result: |
      Using the anchor that a 1% annual mortality risk corresponds to age 58, and the 8-year
      doubling empirical rule to back out the coefficient, predicts annual mortality risk at ages 66
      and 74 of about 2.0% and 4.0% respectively, matching the commonly cited US white male data from
      2000, which shows 1% at 58, 2% at 66, and 4% at 74.
    limitations: |
      This case's "validation" character differs from the other leave-one-out prediction cases:
      the three anchors 58/66/74 are themselves a textbook illustration of the every-8-years-doubling
      rule, and this data source itself is very likely already computed from or heavily smoothed by
      the Gompertz rule, not independently measured raw cohort data, so the high agreement between
      prediction and target reflects mainly that the model correctly implements the Gompertz
      exponential structure, not a genuinely independent, degree-of-freedom-free extrapolation test.
      A more rigorous test would need unsmoothed raw cohort mortality data to re-check against, such
      as a complete life table for a specific year.
  ratings:
    importance: 0.25 - A foundational rule in actuarial science/insurance/geriatrics, the first case in the risk category, a pure reference component not yet imported by a specific paper
    variable: 0.75 - The Gompertz-Makeham model is a classic rule validated over two centuries in demography, but the three anchor points used in this file may be a smoothed teaching example
    equation: 1.0 - Gompertz-Makeham is a widely cited, independently reproduced standard equation form in actuarial science/demography
    simulation: 0.5 - Correctly reproduces the Gompertz exponential structure, but the three anchor points themselves may already be a smoothed illustration of the same rule, not an independent cohort-data extrapolation test
    optimization: 0.0 - This file contains no optimization block, being a pure rule-reproduction demonstration with no decision variables
    confidence: 0.25 - The reproduced structure is correct, but the anchors and the rule being verified may share the same origin, so this does not constitute a genuinely independent extrapolation test
  tags: [risk, actuarial, mortality, gompertz, demography, validation, literature-benchmark, cross-domain]

variables:
  age_years:
    description: Age (years), the direct accumulation of the simulation clock
    value: 58.0
    unit: year
    type: state

  annual_mortality_risk:
    description: The predicted annual mortality risk (probability), computed with the Gompertz exponential model, a static algebraic equation
    value: 0.0
    unit: probability
    type: state

  r0_baseline:
    description: >
      The Gompertz model's base coefficient, back-derived from the age-58 anchor (a 1% annual
      mortality risk) and the 8-year doubling empirical rule:
      r0 = 0.01 * exp(-b*58).
    value: 0.0000658
    unit: dimensionless
    type: parameter
    reference: "Back-derived by the author, based on Gompertz's (1825) doubling empirical rule"

  gompertz_b:
    description: The Gompertz coefficient, corresponding to the "mortality risk doubles every 8 years" empirical rule, b=ln(2)/8
    value: 0.0866
    unit: 1/year
    type: parameter
    reference: "Gompertz (1825); the 8-year doubling empirical rule, widely confirmed by modern demography"

equations:
  clock_tick:
    description: "Clock accumulation: age_years tracks age step by step"
    step_unit: day
    condition: true
    priority: 5
    dynamics:
      age_years: "age_years + step / 365.25"

  mortality_calc:
    description: "A static Gompertz calculation: annual_mortality_risk = r0*exp(b*age), not integrated over time"
    condition: true
    priority: 3
    dynamics:
      annual_mortality_risk: "r0_baseline * exp(gompertz_b * age_years)"

simulation:
  step_size:
    value: 30
    unit: day
  start_date: "2026-01-01"
  end_date: "2042-01-01"
  output_variables:
    - age_years
    - annual_mortality_risk
  plans:
    - id: "aging_58_to_74"
      label: "The evolution of annual mortality risk from age 58 to 74 (no input events, a purely clock-driven static curve evaluation)"
      regimens: []

references:
  - "Gompertz B (1825) On the nature of the function expressive of the law of human mortality. Phil Trans R Soc 115:513-583"
  - "A review on personalized late-life life-expectancy estimation (PLOS ONE 2014, PMC4180452)"
