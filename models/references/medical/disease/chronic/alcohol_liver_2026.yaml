metadata:
  name: alcohol_liver_disease
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      Chronic alcohol intake drives liver-fibrosis progression through cumulative hepatocyte
      toxicity, advancing from mild F1-F2 damage to F4 cirrhosis, a process that often takes years
      or even decades. Abstinence is currently the only proven effective intervention, and early
      F1-F2 fibrosis can partially reverse with sustained abstinence, but late F3-F4 fibrosis reverses
      only to a very limited extent, creating an irrecoverable accumulation of damage. This
      asymmetry, fast damage and slow repair, determines the irreplaceable value of early
      intervention, and is the core phenomenon this model describes.
    result: >
      A default 90-day simulation, set as a moderate-drinking scenario of about 20 to 30 grams of
      ethanol per day, shows the liver-damage index accumulating from 0 to about 0.18. If abstinence
      is then adopted, the damage index declines slowly at a rate of about 0.0005/day. A systematic
      multi-dose comparison has not yet been run; theoretical expectation is that a higher drinking
      dose accumulates damage faster, and earlier abstinence yields lower total damage.
    limitations: >
      Damage accumulation uses a linear approximation, whereas real fibrosis progression is a
      nonlinear process following a sigmoid curve. Genetic modifying factors, such as ALDH2 and
      ADH1B genotype, and nutritional status are not included, and the model is not suited to
      short-timescale prediction of acute alcohol intoxication.
  ratings:
    importance: 0.5 - Alcoholic liver disease is a major global public-health problem, and the dose-fibrosis causal chain has reuse value; potentially usable by social/lifestyle scenarios, moderate reuse expected
    variable: 0.75 - Cites authoritative literature such as Rehm 2010 and Stickel 2017, with a documented damage function
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - No blocking todo found, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - No blocking todo found, but not yet compared against an independent literature target value
  tags: [alcohol, liver_disease, fibrosis, dose_response, chronic]
variables:
  alcohol_dose:
    description: "Alcohol dose level (0=none, 1=light drinking, 2=moderate, 3=heavy)"
    value: 0.0
    unit: "dose level"
    type: input
    bounds: [0.0, 3.0]
    reference: ["Alcohol consumption levels in epidemiology", "NIAAA drinking guidelines"]
    comments: ["Simulate via user input.", "Higher doses accelerate damage."]

  liver_damage_effect:
    description: "The liver-damage index, between 0 and 1, where 1 indicates severe damage"
    value: 0.0
    unit: "damage index"
    type: state
    bounds: [0.0, 1.0]
    reference: ["Fibrosis progression models", "Liver enzyme dynamics in ALD"]
    comments: ["Cumulative metric.", "Threshold 0.6 for cirrhosis risk."]

  liver_health_score:
    description: "The liver-health score, affected by damage (0=severe damage, 100=healthy)"
    value: 100.0
    unit: "score"
    type: state
    bounds: [0.0, 100.0]

equations:
  dose_response_accumulation:
    description: |
      Alcohol dose drives daily liver-damage accumulation (a daily step: step=1/day).
      Level 0 (abstinence) contributes 0, level 1 (light, <14g/day) contributes +0.001/day, level 2 (moderate, 20-30g/day) contributes +0.002/day,
      level 3 (heavy, >40g/day) contributes +0.004/day.
      Source: a linear approximation of Rehm et al. (2010)'s alcohol relative-risk function; 90 days of moderate drinking gives about 0.18 damage.
    step_unit: day
    condition: "alcohol_dose > 0"
    priority: 7
    dynamics:
      liver_damage_effect: "min(1.0, liver_damage_effect + 0.001 * alcohol_dose * step)"
    reference: "Rehm J et al. (2010) Addiction 105:817-843"

  damage_recovery:
    description: |
      Damage recovers slowly with abstinence (fibrosis reversal is about 0.05%/day).
      Early fibrosis (F1-F2) can reverse with sustained abstinence (1-3 years);
      late fibrosis/cirrhosis (F3-F4) reversal is very limited (Stickel 2017).
    step_unit: day
    condition: "alcohol_dose == 0 and liver_damage_effect > 0"
    priority: 6
    dynamics:
      liver_damage_effect: "max(0.0, liver_damage_effect - 0.0005 * step)"
    reference: "Stickel F et al. (2017) Nat Rev Gastroenterol Hepatol 14:45-60"

  liver_health_score_update:
    description: "The liver-health score (100=a healthy liver, 0=end-stage cirrhosis)."
    step_unit: day
    condition: true
    priority: 3
    dynamics:
      liver_health_score: "max(0, 100 - liver_damage_effect * 100)"
simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-04-01"
  output_variables: [alcohol_dose, liver_damage_effect, liver_health_score]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
    - variable: alcohol_dose
      time_start: "19:00"
      value: 2.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-04-01"]
      label: "Daily moderate drinking (about 20-30g ethanol)"

optimization:
  method: nsga2
  objectives:
  - variable: liver_health_score
    metric: final
    direction: maximize
  - variable: liver_damage_effect
    metric: final
    direction: minimize
  startpoint:
    regimens:
    - variable: alcohol_dose
      time_start: "19:00"
      time_end: "19:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "Daily alcohol dose (0=abstinence, 3=heavy drinking)"
      optimize:
        value: [0.0, 3.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - "Rehm J et al. (2010) The relation between different dimensions of alcohol consumption and burden of disease. Addiction 105(5):817-843."
  - "Stickel F et al. (2017) Genetic risk factors for alcoholic liver disease. Nat Rev Gastroenterol Hepatol 14(1):45-60."
  - "NIAAA (2023) Alcohol Use Disorder: A Comparison Between DSM-IV and DSM-5. National Institute on Alcohol Abuse and Alcoholism."
  - "O'Shea RS, Dasarathy S, McCullough AJ (2010) Alcoholic liver disease: ACG Practice Guideline. Am J Gastroenterol 105(1):14-32."
