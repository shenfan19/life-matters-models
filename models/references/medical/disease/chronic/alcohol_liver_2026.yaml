metadata:
  name: alcohol_liver_disease
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      慢性酒精摄入通过累积性肝细胞毒性损伤推动肝纤维化进展，从F1-F2期轻度损伤到F4期肝硬化，过程往往经历数年甚至数十年。戒酒是目前证实有效的干预手段，F1-F2期的早期纤维化在持续戒酒后可部分逆转，但F3-F4期的晚期纤维化逆转极为有限，形成难以弥补的损伤累积。这一损伤快、修复慢的时间非对称性决定了早期干预的不可替代价值，也是本模型描述的核心现象。
    result: >
      默认仿真90天，设定为每日摄入约20至30克乙醇的中度饮酒场景，肝损伤指数从0逐步累积至约0.18。若切换为戒酒干预，损伤指数以约0.0005/天的速率缓慢回落。仿真尚未运行系统化的多剂量对比，理论预期为饮酒剂量越高损伤积累越快，戒酒越早总损伤越低。
    limitations: >
      损伤积累采用线性近似，真实纤维化进展为非线性过程，呈Sigmoid曲线。未包含遗传修饰因素，例如ALDH2、ADH1B基因型，及营养状态的影响，也不适用于急性酒精中毒的短时尺度预测。
  ratings:
    validation_confidence: 2 - 未发现阻断性todo，但未与独立文献目标数值比对
    topic_importance: 4 - 酒精性肝病是全球重大公卫问题，剂量-纤维化因果链有复用价值
    framework_demand: 3 - 潜在被社会/生活方式场景使用，中等复用预期
    evidence_quality: 4 - 引用Rehm 2010、Stickel 2017等权威文献，损伤函数有据
    popularity: 3 - 酒精肝模型有一定参考价值但不属于教科书级经典基准
  tags: [alcohol, liver_disease, fibrosis, dose_response, chronic]
  references:
  - "Rehm J et al. (2010) The relation between different dimensions of alcohol consumption and burden of disease. Addiction 105(5):817-843."
  - "Stickel F et al. (2017) Genetic risk factors for alcoholic liver disease. Nat Rev Gastroenterol Hepatol 14(1):45-60."
  - "NIAAA (2023) Alcohol Use Disorder: A Comparison Between DSM-IV and DSM-5. National Institute on Alcohol Abuse and Alcoholism."
  - "O'Shea RS, Dasarathy S, McCullough AJ (2010) Alcoholic liver disease: ACG Practice Guideline. Am J Gastroenterol 105(1):14-32."
variables:
  alcohol_dose:
    description: "酒精剂量水平 (0=无, 1=轻度饮酒, 2=中度, 3=重度)"
    value: 0.0
    unit: "剂量级别"
    type: input
    bounds: [0.0, 3.0]
    reference: ["Alcohol consumption levels in epidemiology", "NIAAA drinking guidelines"]
    comments: ["Simulate via user input.", "Higher doses accelerate damage."]

  liver_damage_effect:
    description: "肝损伤效果指数，0-1之间，1表示严重损伤"
    value: 0.0
    unit: "损伤指数"
    type: state
    bounds: [0.0, 1.0]
    reference: ["Fibrosis progression models", "Liver enzyme dynamics in ALD"]
    comments: ["Cumulative metric.", "Threshold 0.6 for cirrhosis risk."]

  liver_health_score:
    description: "肝健康评分，受损伤影响（0=严重损伤，100=健康）"
    value: 100.0
    unit: "分"
    type: state
    bounds: [0.0, 100.0]

equations:
  dose_response_accumulation:
    description: |
      酒精剂量导致肝损伤日积累（日步长：step=1/day）。
      0级（戒酒）→0，1级（轻度<14g/day）→+0.001/day，2级（中度20-30g/day）→+0.002/day，
      3级（重度>40g/day）→+0.004/day。
      来源：Rehm et al. (2010)酒精相对风险函数线性近似，90天中度饮酒损伤约0.18。
    step_unit: day
    condition: "alcohol_dose > 0"
    priority: 7
    dynamics:
      liver_damage_effect: "min(1.0, liver_damage_effect + 0.001 * alcohol_dose * step)"
    reference: "Rehm J et al. (2010) Addiction 105:817-843"

  damage_recovery:
    description: |
      戒酒时损伤缓慢恢复（纤维化逆转：约0.05%/day）。
      早期纤维化（F1-F2）可通过持续戒酒逆转（1-3年）；
      晚期纤维化/肝硬化（F3-F4）逆转极为有限（Stickel 2017）。
    step_unit: day
    condition: "alcohol_dose == 0 and liver_damage_effect > 0"
    priority: 6
    dynamics:
      liver_damage_effect: "max(0.0, liver_damage_effect - 0.0005 * step)"
    reference: "Stickel F et al. (2017) Nat Rev Gastroenterol Hepatol 14:45-60"

  liver_health_score_update:
    description: "肝健康评分（100=健康肝脏，0=终末期肝硬化）。"
    step_unit: day
    condition: true
    priority: 3
    dynamics:
      liver_health_score: "max(0, 100 - liver_damage_effect * 100)"
simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-04-01"
  output_variables: [alcohol_dose, liver_damage_effect, liver_health_score]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
    - variable: alcohol_dose
      time_start: "19:00"
      value: 2.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-04-01"]
      label: "每日中度饮酒（约20-30g乙醇）"

optimizer:
  method: nsga2
  objectives:
  - variable: liver_health_score
    metric: final
    direction: maximize
  - variable: liver_damage_effect
    metric: final
    direction: minimize
  startpoint:
    regimens:
    - variable: alcohol_dose
      time_start: "19:00"
      time_end: "19:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "每日饮酒剂量（0=戒酒，3=重度饮酒）"
      optimize:
        value: [0.0, 3.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
