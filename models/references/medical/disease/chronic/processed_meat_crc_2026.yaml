category: physiological

metadata:
  name: processed_meat_crc
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: |
      The processed-meat to colorectal-cancer association is an effect size in epidemiology that
      has been independently measured repeatedly and that meta-analyses converge on. The relative
      risk (RR) of colorectal cancer per additional 50g of processed meat consumed daily is one of
      the pieces of quantitative evidence behind WHO/IARC's qualitative classification of processed
      meat as a Group 1 carcinogen.
    result: |
      This case declares the effect size using the rr subtype of the LM format's evidence block,
      substituting an illustrative baseline risk of 1.0%, to verify that the loader correctly reads,
      carries, and displays this effect size, with the exposed-group risk equal to the baseline risk
      times 1.18, that is, an RR of 1.18.
    limitations: |
      This case demonstrates the correctness of effect-size encoding, not an independent prediction
      test: the number 1.18 is itself the target being verified, not a value extrapolated and then
      compared against a separate independent source. The 1.0% baseline risk is an illustrative
      setting, not a measured prevalence in any specific population.
  ratings:
    importance: 0.25 - One case in the epidemiological-effect-size family, a general-purpose reference component not yet imported by a specific paper
    variable: 1.0 - The effect size is a consensus value from a meta-analysis and large cohort studies, directly traceable to the literature
    equation: 1.0 - The evidence_type conversion is a standard mechanism defined by the LM format specification, not a self-built structure
    simulation: 0.5 - The correctness of the effect-size encoding has been verified and demonstrated, but this is explicitly not an independent prediction test, a form of circular verification
    optimization: 0.0 - This file contains no optimization block, being a pure effect-size encoding demonstration with no decision variables
    confidence: 0.75 - The effect size itself comes from a high-quality independent source, and the loader's correct encoding is demonstrated; that this is not an independent prediction is noted in the rationale
  tags: [epidemiology, evidence, rr, validation, literature-benchmark, rr-family]

variables:
  baseline_risk_pct:
    description: An illustrative baseline (unexposed-group) risk (%)
    value: 1.0
    unit: "%"
    type: parameter

  exposed_risk_pct:
    description: The predicted exposed-group risk (%) = baseline risk x relative risk
    value: 0.0
    unit: "%"
    type: state

  exposure_rr:
    type: parameter
    evidence_type: rr
    value: 1.18
    unit: "RR"
    description: The relative risk (RR) of colorectal cancer per additional 50g of processed meat consumed daily, one of the pieces of quantitative evidence behind WHO/IARC's assessment of processed meat as a Group 1 carcinogen
    reference: "Chan DSM, Lau R, Aune D, et al. (2011) Red and processed meat and colorectal cancer incidence: meta-analysis of prospective studies. PLOS ONE 6(6):e20456, RR=1.18 (95% CI 1.10-1.28) per 50g/day processed meat; WHO/IARC (2018) Monographs Vol 114 classifies processed meat as a Group 1 carcinogen, a qualitative classification assessment that is not the source of this row's specific number"

equations:
  risk_calc:
    description: "A static calculation: exposed_risk_pct = baseline_risk_pct x exposure_rr"
    condition: true
    priority: 3
    dynamics:
      exposed_risk_pct: "baseline_risk_pct * exposure_rr"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables:
    - baseline_risk_pct
    - exposed_risk_pct
  plans:
    - id: "exposure_scenario"
      label: "Exposed-group versus baseline-risk effect-size demonstration"
      regimens: []

references:
  - "Chan DSM, Lau R, Aune D, et al. (2011) Red and processed meat and colorectal cancer incidence: meta-analysis of prospective studies. PLOS ONE 6(6):e20456"
  - "WHO/IARC (2018) Monographs Vol 114; qualitative carcinogen classification, background context, not the source of this row's RR value"
