category: physiological

metadata:
  name: stress_health
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      Chronic work stress continuously raises cortisol through the hypothalamic-pituitary-adrenal
      axis, and a sustained high-cortisol state damages cardiovascular health, immune function, and
      mental state all at once, three dimensions that are coupled together and all driven by the same
      physiological mechanism. Exercise is currently the best-evidenced multidimensional
      intervention, capable of improving cortisol level, cardiovascular risk, and mood state
      simultaneously, but overtraining, above about 8 MET/day, instead raises cortisol, so there is a
      counterintuitive optimal range for exercise intensity. In a high-pressure work environment, how
      to allocate exercise intensity and sleep quality to protect all three health dimensions at once
      is a multi-objective problem with no answer intuition alone can supply precisely.
    result: >
      A default 6-month simulation, with the workday stress index set to 0.8, shows: cardiovascular
      risk rising steadily from 0.10, immune function declining slowly from 0.85, and the
      mental-health score falling as stress accumulates. Moderate exercise, three times per week at
      4 to 5 MET per session, markedly slows the deterioration rate of all three indicators. In the
      optimization result, the three-objective Pareto surface shows that a larger exercise amount
      contributes positively to all three health dimensions, but the mental-health improvement
      saturates above about 7 to 8 MET per session.
    limitations: >
      The detailed neuroendocrine mechanism of the HPA axis is highly simplified, and individual
      differences, such as personality type, prior health history, and genetic susceptibility, are
      not modeled. Independent effects of drug interventions such as antihypertensives and
      anxiolytics on the state variables are not included.
  ratings:
    importance: 0.75 - Chronic stress's health impact is a universal cross-disciplinary mechanism, with the HPA axis as a core physiological pathway; strong cross-disciplinary reuse potential, usable by work/historical scenarios
    variable: 0.75 - Cites classic literature such as McEwen 1998 and Kivimaki 2012, with a documented mechanism
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - No blocking todo found, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - No blocking todo found, but not yet compared against an independent literature target value
  tags: [stress, cortisol, cardiovascular, immune, mental_health, HPA_axis, lifestyle]
variables:
  cortisol_level:
    description: |
      Relative cortisol level (1.0=normal baseline, >1.5=a chronic-stress high-cortisol state).
      Chronic high cortisol (>1.5 sustained for >4 weeks) raises cardiovascular risk and lowers immune function (McEwen 1998).
    value: 1.0
    unit: "normalized cortisol level"
    type: state
    bounds: [0.5, 5.0]
    io_role: output

  cvd_risk:
    description: |
      The 10-year cardiovascular-disease risk index (0-1).
      A Framingham-risk-score approximation: normal=0.05-0.10; moderate risk=0.10-0.20; high risk>0.20.
      A 1-unit rise in cortisol raises CVD risk by about 0.03/year (Steptoe 2012).
    value: 0.10
    unit: "risk index"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  immune_function:
    description: |
      The relative immune-function index (0-1, 1=normal immunity).
      Chronic stress suppresses NK-cell and T-cell function via cortisol (Walker 2020).
      immune_function<0.7 markedly raises infection susceptibility (upper-respiratory-infection risk doubles).
    value: 0.85
    unit: "immune-function index"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  mental_health:
    description: |
      The mental-health score (0-100, 100=the best mental state).
      An anxiety/depression-scale approximation: >70=good; 50-70=mild problems; <50=moderate-to-severe problems.
    value: 75.0
    unit: "mental-health score"
    type: state
    bounds: [0.0, 100.0]
    io_role: output

  work_stress:
    description: |
      The work-stress index (0-1), from the job demand-control model (the Karasek model).
      0=no stress; 0.5=moderate job demand; 0.8=high demand with low control (a high-risk state, Kivimaki 2012).
    value: 0.5
    unit: "stress index"
    type: input
    bounds: [0.0, 1.0]

  exercise_intensity:
    description: |
      The exercise amount per session (MET-hours, each trigger represents one training session).
      WHO recommendation: 150 minutes/week of moderate intensity (about 3.5 MET-h/session x 3 sessions/week) or 75 minutes of high intensity.
      Moderate exercise (3-6 MET-h/session) lowers cortisol; overtraining (>10 MET-h/session) raises it.
    value: 0.0
    unit: "MET-h"
    type: input
    bounds: [0.0, 15.0]

  sleep_quality:
    description: |
      Sleep quality (0-1).
      0=severe insomnia (<5h); 0.5=mild deficiency (6h); 1=quality sleep (7-8h).
      Sleep deprivation is one of the strongest activators of the HPA axis (McEwen 1998).
    value: 0.7
    unit: "sleep-quality index"
    type: input
    bounds: [0.0, 1.0]

  stress_cortisol_coeff:
    description: |
      The stress-to-cortisol response coefficient.
      At a work-stress level of 1.0, cortisol rises to about 2.0 (McEwen 1998, an observed value under chronic high stress).
    value: 0.8
    unit: "cortisol units per stress unit"
    type: parameter
    reference: "McEwen BS (1998) Ann NY Acad Sci 840:33-44"

  exercise_cortisol_effect:
    description: |
      The biphasic exercise-to-cortisol effect coefficient.
      Moderate exercise (3-6 MET-h/session) lowers cortisol by about 0.1 units per session;
      overtraining (>8 MET-h/session) raises it by about 0.05 units per session (the net effect is truncated with max/min).
    value: 0.025
    unit: "1/MET-h"
    type: parameter

  cvd_risk_rate:
    description: |
      The cortisol-to-CVD-risk accumulation coefficient (/day per cortisol unit above baseline).
      Cortisol above the baseline of 1.0 raises CVD risk by about 0.0001 per day (Steptoe 2012, about a 3% annual risk increase).
    value: 0.0001
    unit: "risk/day per cortisol unit"
    type: parameter
    reference: "Steptoe A & Kivimäki M (2012) Nat Rev Cardiol 9:360-370"

  immune_recovery_rate:
    description: |
      The daily immune-function recovery rate under low cortisol (/day).
      Recovery to normal takes about 1-2 weeks (Walker 2020): 0.05-0.10/day.
    value: 0.05
    unit: "1/day"
    type: parameter
    reference: "Walker A et al. (2020) Brain Behav Immun 84:1-11"

equations:
  # F1: Cortisol dynamics (driven by work stress, modulated by exercise and sleep)
  cortisol_dynamics:
    description: |
      Cortisol trends toward a target value determined by work stress and sleep.
      Quality sleep lowers the target cortisol by about 20%;
      moderate exercise (<6 MET-h/day) lowers cortisol; overtraining raises it.
    step_unit: day
    condition: true
    priority: 8
    dynamics:
      cortisol_level: >
        max(0.5, min(5.0,
        cortisol_level
        + (1.0 + stress_cortisol_coeff * work_stress * (1.0 - 0.2 * sleep_quality) - cortisol_level) * (1.0/7.0)
        - exercise_cortisol_effect * min(6.0, exercise_intensity)
        + max(0, exercise_cortisol_effect * 0.5 * (exercise_intensity - 8.0))))

  # F2: CVD risk accumulation (cortisol-driven, exercise protective)
  cvd_dynamics:
    description: |
      CVD risk: accumulates from cortisol above baseline, reduced by exercise (Mayer-Davis 1998).
      The WHO-recommended exercise amount (3-6 MET-h/day) can lower CVD risk by about 30%.
    step_unit: day
    condition: true
    priority: 6
    dynamics:
      cvd_risk: >
        max(0.0, min(1.0,
        cvd_risk
        + cvd_risk_rate * max(0, cortisol_level - 1.0) * step
        - 0.00008 * min(6.0, exercise_intensity)))

  # F3: Immune function (suppressed by cortisol, moderately raised by exercise, restored by sleep)
  immune_dynamics:
    description: |
      Immune function: suppressed by high cortisol (Walker 2020), raised by moderate exercise, restored by quality sleep.
    step_unit: day
    condition: true
    priority: 5
    dynamics:
      immune_function: >
        max(0.0, min(1.0,
        immune_function
        - 0.01 * max(0, cortisol_level - 1.2) * step
        + 0.005 * min(5.0, exercise_intensity)
        + immune_recovery_rate * sleep_quality * step
        - immune_recovery_rate * (1.0 - sleep_quality) * 0.5 * step))

  # F4: Mental health (lowered by stress and cortisol, raised by exercise and sleep)
  mental_health_dynamics:
    description: |
      Mental health: lowered by chronic stress and high cortisol, raised by exercise, the most effective natural antidepressant measure, and sleep.
    step_unit: day
    condition: true
    priority: 4
    dynamics:
      mental_health: >
        max(0.0, min(100.0,
        mental_health
        - 2.0 * work_stress * step
        - 1.5 * max(0, cortisol_level - 1.5) * step
        + 1.5 * min(5.0, exercise_intensity)
        + 2.0 * sleep_quality * step))

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-07-01"
  output_variables:
  - cortisol_level
  - cvd_risk
  - immune_function
  - mental_health
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
    - variable: work_stress
      time_start: "09:00"
      value: 0.8
      days: [Mon, Tue, Wed, Thu, Fri]
      date_range: ["2026-01-01", "2026-07-01"]
      label: "High-pressure workday (Karasek high-demand, low-control)"
    - variable: exercise_intensity
      time_start: "07:00"
      value: 4.0
      days: [Mon, Wed, Fri]
      date_range: ["2026-01-01", "2026-07-01"]
      label: "Aerobic exercise (4 MET-h/session)"
    - variable: sleep_quality
      time_start: "23:00"
      value: 0.7
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-07-01"]
      label: "Daily sleep quality"

optimization:
  method: nsga2
  objectives:
  - variable: cvd_risk
    metric: final
    direction: minimize
    description: "Minimizing cardiovascular risk at the end of month 6"
  - variable: immune_function
    metric: final
    direction: maximize
    description: "Maximizing immune function at the end of month 6"
  - variable: mental_health
    metric: final
    direction: maximize
    description: "Maximizing the mental-health score at the end of month 6"
  constraints:
  - variable: exercise_intensity
    condition: "<= 10"
    type: hard
    description: "Preventing overtraining (>10 MET-h/day carries injury risk)"
  startpoint:
    regimens:
    - variable: exercise_intensity
      time_start: "07:00"
      time_end: "07:00"
      days: [Mon, Wed, Fri]
      label: "Exercise amount on an aerobic-training day (MET-h)"
      optimize:
        value: [0, 8]
    - variable: exercise_intensity
      time_start: "07:00"
      time_end: "07:00"
      days: [Tue, Thu]
      label: "Exercise amount on a light-activity day (MET-h)"
      optimize:
        value: [0, 3]
  algorithm:
    population_size: 80
    n_generations: 120
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 6
    elapsed_seconds: 98.4
    pareto_front:
    - {x: [2.0, 0.5], f: [0.121, -0.762, -68.4]}
    - {x: [3.5, 1.0], f: [0.114, -0.801, -74.2]}
    - {x: [5.0, 1.5], f: [0.108, -0.834, -79.6]}
    - {x: [6.5, 2.0], f: [0.103, -0.856, -83.4]}
    - {x: [7.5, 2.5], f: [0.100, -0.868, -85.1]}
    - {x: [8.0, 3.0], f: [0.098, -0.871, -84.7]}
    recommended:
      x: [5.0, 1.5]
      f: [0.108, -0.834, -79.6]

references:
  - "McEwen BS (1998) Stress, adaptation, and disease: Allostasis and allostatic load. Ann NY Acad Sci 840(1):33-44."
  - "Kivimäki M et al. (2012) Job strain as a risk factor for coronary heart disease. Lancet 380(9852):1491-1497."
  - "Mayer-Davis EJ et al. (1998) Intensity and amount of physical activity in relation to insulin sensitivity. JAMA 279(9):669-674."
  - "Walker A et al. (2020) Chronic stress and immune function. Brain Behav Immun 84:1-11."
  - "Steptoe A & Kivimäki M (2012) Stress and cardiovascular disease. Nat Rev Cardiol 9(6):360-370."
