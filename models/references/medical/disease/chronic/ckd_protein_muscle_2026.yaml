metadata:
  name: ckd_protein_muscle
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      A patient with chronic kidney disease (CKD) faces an unavoidable nutritional conflict: a
      low-protein diet, 0.6 to 0.8 g/kg/day, slows the decline in glomerular filtration rate (GFR),
      but also accelerates net muscle-protein breakdown, causing sarcopenia; sarcopenia in turn
      further accelerates the decline in renal function, forming a vicious cycle. The KDIGO 2020
      guideline explicitly states that the evidence on the tradeoff between a low-protein diet and
      sarcopenia risk is currently insufficient to give a unified recommendation. The optimal
      protein intake varies by an individual's CKD stage, dialysis status, and baseline muscle mass,
      making this a genuinely unresolved clinical problem.
    result: >
      A three-arm simulation, the KDIGO low-protein 0.6, the baseline 0.8, and the dialysis-phase
      high-protein 1.2 g/kg/day, shows that after one year the final GFR and final muscle mass trend
      clearly in opposite directions: the 0.6 arm gives a final GFR of about 43.06, the best renal
      protection, but muscle atrophies to 24.36kg; the 1.2 arm raises muscle to 35.28kg, but GFR
      falls to 42.01, confirming the direction of the core tradeoff between low-protein renal
      protection and high-protein muscle preservation. The 7-solution optimization front obtained
      with NSGA-II agrees in direction with the three-arm simulation: the baseline arm at 0.80
      g/kg/day strikes a compromise between a muscle mass of about 28.0kg and a GFR of about 42.7,
      which is not clinically optimal but merely one representative point on the Pareto front.
    limitations: >
      Both the damage and recovery mechanisms use a linear approximation, whereas real CKD
      progression is a nonlinear process. The dialysis stage, where protein requirements reverse to
      above 1.2 g/kg/day, is not included, nor is the complete mechanism by which metabolic acidosis
      affects muscle breakdown.
  ratings:
    importance: 0.75 - CKD nutritional management is a core clinical problem, reused by several A4-series scenarios; imported by several A4-series scenarios, a core dependency component in the nephrology domain
    variable: 0.75 - Supported by the KDIGO guideline and multiple RCTs, with a few mechanism coefficients estimated
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - No blocking todo found, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - No blocking todo found, but not yet compared against an independent literature target value
  tags: [nephrology, ckd, protein, muscle, sarcopenia, optimization, physiological, A4]

variables:
  # R1: Renal Function
  gfr:
    description: |
      Glomerular filtration rate (GFR), in mL/min/1.73m2.
      CKD stages: stage 1 >=90; stage 2 60-89; stage 3 30-59; stage 4 15-29; stage 5 <15.
      The model baseline is set at CKD stage 3b (45 mL/min), representing moderate CKD, the stage where decision-making matters most.
    value: 45.0
    unit: "mL/min/1.73m²"
    type: state
    bounds: [1.0, 120.0]

  bun:
    description: |
      Blood urea nitrogen (BUN), an indicator of nitrogenous-waste accumulation, normally 7-20 mg/dL.
      In CKD, BUN rises with higher protein intake and lower GFR, reflecting the uremic-toxin burden.
      A steady-state approximation is used: BUN ≈ 24.1 x protein_intake x body_weight / GFR.
      Coefficient source: standard urea-clearance kinetics (Daugirdas et al. 2015, Handbook of Dialysis).
    value: 30.0
    unit: "mg/dL"
    type: state
    bounds: [5.0, 150.0]

  # R2: Muscle Mass
  muscle_mass:
    description: |
      Skeletal-muscle mass (lean body mass), normally about 28-32kg in an adult male.
      A CKD patient's muscle breakdown accelerates due to protein restriction, metabolic acidosis, inflammation, and other causes (protein-energy wasting syndrome).
      The baseline is set at 28kg (a mild-sarcopenia starting point, typical of a CKD stage-3 patient).
    value: 28.0
    unit: "kg"
    type: state
    bounds: [5.0, 60.0]

  muscle_synthesis_rate:
    description: |
      The net muscle-synthesis rate (positive=synthesis, negative=breakdown).
      Determined by the difference between protein_intake and the maintenance threshold (0.8 g/kg/day), with additional acceleration of breakdown in late-stage CKD.
      Source: Kalantar-Zadeh & Fouque (2017) sarcopenia-progression data.
    value: 0.0
    unit: "g/day"
    type: state
    bounds: [-100.0, 50.0]

  # Parameters
  body_weight:
    description: "Body weight (kg), used to convert to absolute protein intake (g/day = g/kg/day x body_weight)."
    value: 70.0
    unit: "kg"
    type: parameter

  gfr_base_decline:
    description: |
      The annual GFR-decline rate without intervention (mL/min/yr).
      A CKD stage-3 average is about 3 mL/min/yr (source: the MDRD Study's 10-year follow-up data).
      With comorbid hypertension or diabetes it can reach 5-7 mL/min/yr.
    value: 3.0
    unit: "mL/min/yr"
    type: parameter
    bounds: [1.0, 10.0]

  # P1: Input — Daily Protein Intake
  protein_intake:
    description: |
      Daily protein intake (g/kg/day).
      The KDIGO 2020 recommendation (non-dialysis CKD stages 3-5): 0.6-0.8 g/kg/day.
      Below 0.6, nitrogen balance turns negative, accelerating net muscle breakdown.
      Above 0.8, nitrogenous waste rises, accelerating the GFR decline.
      A dialysis patient needs >=1.2 g/kg/day, the opposite of the non-dialysis recommendation, which is the core conflict here.
      The optimal range varies by an individual's CKD stage, muscle mass, and dialysis status; KDIGO itself acknowledges there is no unified recommendation.
    value: 0.8
    unit: "g/kg/day"
    type: input
    bounds: [0.3, 2.0]

equations:
  # F1: GFR Decline Dynamics
  # The MDRD study: low protein (0.6 g/kg/d) versus normal protein (1.2 g/kg/d) gives a 35% slower GFR decline
  # Linear interpolation: protein_modifier = 0.65 at 0.6g/kg/d, 1.0 at 1.2g/kg/d
  # Full equation: decline/day = (annual rate/365) x modifier
  gfr_decline:
    description: |
      The daily GFR-decline dynamics.
      The protein_modifier range: 0.6g/kg/d gives 0.65 (35% slower), 1.2g/kg/d gives 1.0 (no slowing), linearly interpolated.
      Source: the MDRD Study (Klahr 1994).
    step_unit: day
    condition: gfr > 2.0
    dynamics:
      gfr: "gfr - (gfr_base_decline / 365.0) * (0.65 + 0.35 * min(1.0, max(0.0, (protein_intake - 0.6) / 0.6))) * step"
    priority: 7

  # F2: BUN Steady-State Approximation
  # BUN ≈ 24.1 x protein_intake x body_weight / GFR
  # Coefficient derivation: 70kg body weight, 0.8g/kg/d protein, GFR=90 gives BUN≈15 mg/dL (the upper normal limit)
  # Standard reference: Daugirdas JT et al. (2015) Handbook of Dialysis, 5th Ed.
  bun_calc:
    description: |
      A BUN steady-state approximation (urea-clearance kinetics).
      The coefficient 24.1 is calibrated to a standard reference point: 70kg, 0.8g/kg/d, GFR=90 gives BUN=15 mg/dL.
      Source: Daugirdas et al. (2015).
    step_unit: day
    condition: true
    dynamics:
      bun: "min(150.0, 24.1 * protein_intake * body_weight / max(5.0, gfr))"
    priority: 5

  # F3: Muscle Mass Dynamics
  # Net synthesis rate = (protein_intake - 0.8) x synthesis coefficient x body_weight
  # Synthesis coefficient 0.05: each 0.1 g/kg/day deviation gives net synthesis of ±0.005 kg/day (i.e. ±1.8 kg/yr, matching clinical observation)
  # Late-stage CKD (GFR<30) adds accelerated breakdown: metabolic acidosis and inflammatory mediators increase protein breakdown
  # Source: Carrero et al. (2013) protein-energy wasting syndrome data
  muscle_dynamics:
    description: |
      The net skeletal-muscle synthesis dynamics.
      net_rate = (protein_intake - 0.8) x 0.05 minus a late-stage-CKD extra breakdown factor.
      Late-stage CKD (GFR<30) adds extra breakdown from metabolic acidosis: +0.003 kg/day.
      Source: Carrero et al. (2013).
    step_unit: day
    condition: true
    dynamics:
      muscle_mass: "muscle_mass + ((protein_intake - 0.8) * 0.05 - max(0.0, (30.0 - gfr) / 30.0) * 0.003) * step"
      muscle_synthesis_rate: "(protein_intake - 0.8) * 0.05 * body_weight - max(0.0, (30.0 - gfr) / 30.0) * 0.3"
    priority: 5

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
    - variable: protein_intake
      time_start: "08:00"
      value: 0.8
      label: "Daily protein intake (g/kg/day)"

  - id: kdigo_low_protein
    label: "KDIGO low-protein arm (0.6 g/kg/day, renal protection priority)"
    regimens:
    - variable: protein_intake
      time_start: "08:00"
      value: 0.6
      label: "Daily protein intake (g/kg/day)"

  - id: dialysis_high_protein
    label: "Dialysis-phase high-protein arm (1.2 g/kg/day, muscle preservation priority)"
    regimens:
    - variable: protein_intake
      time_start: "08:00"
      value: 1.2
      label: "Daily protein intake (g/kg/day)"
  output_variables: [gfr, muscle_mass, bun, protein_intake, muscle_synthesis_rate]
optimization:
  # A two-objective Pareto search: finding the daily protein intake that maximizes both muscle_mass and gfr.
  # The core conflict: high protein preserves muscle, low protein protects the kidney; the KDIGO 2020 guideline itself acknowledges there is no unified recommendation.
  method: nsga2

  objectives:
  - variable: muscle_mass
    metric: final         # muscle mass (kg) at the end of the simulation
    direction: maximize
  - variable: gfr
    metric: final         # GFR (mL/min/1.73m2) at the end of the simulation
    direction: maximize

  constraints:
  - variable: bun
    condition: "<= 80"    # BUN should not exceed 80 mg/dL throughout (avoiding uremia)

  startpoint:
    regimens:
    - variable: protein_intake
      time_start: "08:00"
      time_end: "08:00"
      label: "Daily protein intake (g/kg/day)"
      optimize:
        value: [0.3, 2.0]

  algorithm:
    population_size: 60
    n_generations: 120
    seed: 19

  results:
    generated_at: "2026-07-06"
    method: nsga2
    n_solutions: 7
    elapsed_seconds: 38.6
    pareto_front:
    - {x: [0.60], f: [-24.36, -43.06]}
    - {x: [0.68], f: [-25.87, -42.91]}
    - {x: [0.80], f: [-28.02, -42.70]}
    - {x: [0.91], f: [-30.00, -42.51]}
    - {x: [1.03], f: [-32.12, -42.31]}
    - {x: [1.10], f: [-33.53, -42.18]}
    - {x: [1.99], f: [-49.69, -42.01]}
    recommended:
      x: [0.80]
      f: [-28.02, -42.70]

references:
  - citation: "KDIGO (2021) KDIGO 2020 CKD Clinical Practice Guideline. Kidney Int Suppl 11(1):1-169."
    description: "Section 3.1.3 gives the evidence on the tradeoff between low-protein diet recommendations and sarcopenia risk."
  - citation: "Klahr S et al. (1994) The effects of dietary protein restriction and blood-pressure control on the progression of CKD (MDRD Study). NEJM 330(13):877-884."
    description: "A low-protein diet slowed the GFR decline by 35%."
  - citation: "Kalantar-Zadeh K, Fouque D (2017) Nutritional Management of Chronic Kidney Disease. N Engl J Med 377(18):1765-1776."
    description: "Supplies the basis for a dialysis patient's high-protein requirement."
  - citation: "Fouque D, Aparicio M (2007) Eleven reasons to control protein intake of patients with CKD. Nat Clin Pract Nephrol 3(7):383-392."
    description: "Supplies the clinical basis for controlling protein intake in CKD patients."
  - citation: "Carrero JJ et al. (2013) Etiology of the protein-energy wasting syndrome in CKD. J Ren Nutr 23(2):77-90."
    description: "Describes the etiologic mechanism of CKD's protein-energy wasting syndrome."
