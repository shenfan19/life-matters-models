metadata:
  name: hypertension_gout
  lm_format_version: "1.0"
  updated: 2026-08-12
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  todo:
    - type: quality
      severity: resolved
      issue: "[已修复 2026-09-04] optimization.results 此前是 population=20/generations=20 验证性预算，已用文件声明的完整预算 population=80/generations=120 重新求解"
      evidence: "hourly粒度下单次完整预算求解显著慢于修复前的day粒度设计（单次评估90天×24步而非90步），此前排查未等待完整预算跑完。"
      resolution: "2026-09-04 完整预算重新求解：120代全程feasible=100%，80个解全部非退化，权衡结构与数值范围与验证性预算前沿基本一致，results.pareto_front/recommended已更新为完整预算结果，status字段已去掉'验证性预算'说明。"
    - type: quality
      issue: "[待办，非本次修复范围] weight_loss_rate 声明为决策/约束变量但没有任何 regimen 驱动它"
      evidence: "simulation.plans 的 default 方案和 optimization.startpoint 均未给 weight_loss_rate 提供 regimen，实际仿真中恒为0，减重相关机制（体重下降、酮体竞争尿酸排泄）目前不可能被复现，这是修复前就存在的建模缺口。"
      next: "决定是否要把 weight_loss_rate 也做成 optimization 的决策变量，或者在 description 里明确这一维度当前只是声明、未接入。"
  log:
    "2026-08-12_00-00-00":
      change: >
        新增 thiazide_level 一阶药代衰减状态与 k_thiazide_decay 参数，bp_dynamics/ua_dynamics
        改读 thiazide_level 而非瞬时 diuretic_dose；purine_intake/weight_loss_rate 的 regimen
        改为全天窗口+delivery:level；weight_dynamics 补上 *step；simulation.step_size 从
        1 day 改为 1 hour；bp_dynamics/ua_dynamics 的 τ=14天弛豫速率按 ADR 0121 类型B开根公式
        重新换算为小时等效值；description.result 与 optimization.results 按新机制重新生成，
        旧结果移入 optimization.results.historical_stale_from_2026-05-17 保留存档。
      reason: >
        本文件与 papers/s4/hypertension_gout/hypertension_gout_sim.yaml 同名同主题，后者早先
        发现瞬时给药脉冲直接驱动慢弛豫方程会被脉冲窗口外的23小时"回弹"抵消，已改用衰减态修复；
        本文件当时用 day 粒度仿真，脉冲窗口恰好与仿真步长重合，同一个问题被掩盖而未暴露，
        属于全库排查"脉冲输入被重复乘step"这一类问题时确认的一个实例，用户判断这是公开
        FAIR 模型库的基础设施风险（不止本论文引用，未来可能被其他人 imports 或复用），
        要求本次直接修复而非只记录待办。详见
        life-matters-home/tasks/2026-08-12_task_pulse-multiplied-by-step-design-bug.md。
  description:
    problem: >
      高血压合并痛风是一种在临床上极为常见的共病组合，然而两病的标准治疗方案之间存在直接冲突。噻嗪类利尿剂，例如氢氯噻嗪，是高血压一线用药，可显著降低收缩压，但同时会升高血尿酸约60至80 μmol/L，直接对抗痛风控制目标，即尿酸应低于360 μmol/L。减重是对两病均有益的干预，但减重过快时体内酮体会竞争尿酸的肾小管排泄，反而导致尿酸一过性升高。没有单一干预能同时满足两套指南的目标，权衡必须通过量化来实现。
    result: >
      默认90天仿真显示，使用12.5 mg氢氯噻嗪配合每日800mg嘌呤摄入时，收缩压从158 mmHg降至约155.0 mmHg，血尿酸从480升至约489.1 μmol/L，仍高于ACR指南目标360 μmol/L。这两个数字与2026-08-12修复前记录的151/420不同，是因为修复前HCTZ剂量效应直接读取瞬时给药量，修复后改读一阶药代衰减状态thiazide_level，两种机制的稳态换算关系不同，不是同一个模型的重新标定，见limitations。优化结果展示了降压剂量与尿酸升高之间的权衡曲线：剂量越大，降压效果越好，同时尿酸风险越高，不存在同时达标的方案。
    limitations: >
      血压与尿酸动力学均采用一阶线性趋近模型，基于稳态假设，真实药物效应存在非线性饱和与个体差异。未涵盖别嘌醇等降尿酸药物的联合治疗场景，也未建模痛风急性发作的触发与消退过程。thiazide_level对血压/尿酸的效应系数（0.4 mmHg/mg、2.8 μmol/L/mg）延续修复前对瞬时剂量的标定，未针对衰减态的稳态量级重新校准，是2026-08-12修复遗留的简化，后续如需更精确的量效关系应重新标定这两个系数。weight_loss_rate声明为决策/约束变量但当前simulation.plans与optimization.startpoint均未提供驱动它的regimen，实际仿真中恒为0，减重相关机制目前不可复现，这是修复前就存在的、本次未处理的建模缺口。
  ratings:
    importance: 0.75 - 药物冲突问题临床高发，被 A5 系列多次引用，患者群体庞大；被A5系列多次引用，跨科室冲突场景核心组件
    variable: 0.75 - ESC/ACR 双指南支撑，HCTZ 效应系数有文献来源
    equation: 0.5 - 自建方程锚定文献机制方向，非独立复现的标准形式
    simulation: 0.5 - 未发现阻断性todo，但未与独立文献目标数值比对
    optimization: 0.75 - ESC/ACR双指南支撑噻嗪类利尿剂降压升尿酸的真实权衡，2026-09-04完整预算(pop80/gen120)验证前沿连续单调非退化
    confidence: 0.25 - 未发现阻断性todo，但未与独立文献目标数值比对
  tags: [cardiology, rheumatology, hypertension, gout, uric_acid, optimization, physiological, A5]

variables:
  # R1: Blood Pressure
  systolic_bp:
    description: |
      收缩压（mmHg）。基线158mmHg（高血压2级合并痛风患者典型值）。
      目标：ESC 2018指南 <130 mmHg。
      干预：噻嗪类利尿剂（降压）、减肥（降压）。
    value: 158.0
    unit: "mmHg"
    type: state
    bounds: [90.0, 200.0]

  # R2: Uric Acid
  uric_acid:
    description: |
      血尿酸（μmol/L）。基线480μmol/L（痛风患者，正常上限420男性/360女性）。
      目标：ACR 2020指南 <360 μmol/L（预防痛风发作）。
      干预矛盾：噻嗪类升高尿酸；减肥降低尿酸；快速减重升高尿酸（酮体竞争）；
      低嘌呤饮食降低尿酸。
    value: 480.0
    unit: "μmol/L"
    type: state
    bounds: [100.0, 900.0]

  # R3: Body Weight
  body_weight:
    description: "体重（kg）。基线90kg（超重，BMI约29）。减重对BP和UA均有正面效应，但速度受限。"
    value: 90.0
    unit: "kg"
    type: state
    bounds: [40.0, 150.0]

  # R4: Composite Goal Score
  goal_score:
    description: |
      双目标达标综合评分（0-100）。
      BP得分：systolic_bp从158→120线性映射到0→50分；
      UA得分：uric_acid从480→250线性映射到0→50分；
      满分100 = 两个指南目标均完美达标。
    value: 0.0
    unit: "分"
    type: state
    bounds: [0.0, 100.0]

  # Parameters
  bp_baseline:
    description: "血压自然基线（无药物干预时的稳态收缩压），来自患者初始状态。"
    value: 158.0
    unit: "mmHg"
    type: parameter

  ua_baseline:
    description: "尿酸自然基线（无干预时的稳态尿酸水平，由肾脏排泄能力决定）。"
    value: 480.0
    unit: "μmol/L"
    type: parameter

  body_weight_ref:
    description: "参考体重（90kg，用于计算减重对血压影响的相对量）。"
    value: 90.0
    unit: "kg"
    type: parameter

  # P1: Diuretic Dose — 核心冲突输入
  diuretic_dose:
    description: |
      氢氯噻嗪（HCTZ）单次剂量（mg）。
      降压效果：25mg → 收缩压降低约10 mmHg（Law 2003）；剂量-效应线性假设。
      尿酸代价：25mg → 尿酸升高约70 μmol/L（Gurwitz 1992）。
      临床推荐范围：12.5-25 mg/day（ESC 2018，指每日一次给药）。
      2026-08-12 起不再被 bp_dynamics/ua_dynamics 直接读取，见 thiazide_level。
    value: 0.0
    unit: "mg"
    type: input
    bounds: [0.0, 25.0]

  # P1b: HCTZ 体内水平（一阶药代衰减状态，2026-08-12 新增）
  thiazide_level:
    description: >
      HCTZ 体内有效水平（一阶药代衰减状态，半衰期≈10h，Beermann & Groschinsky-Grind 1977）。
      2026-08-12 新增：此前 bp_dynamics/ua_dynamics 直接读取瞬时 diuretic_dose 作为弛豫目标
      的一部分，diuretic_dose 由 regimen 单点脉冲投放（仅在给药那一刻非零），本文件此前用
      day 粒度仿真（simulation.step_size=1day）恰好让每日一次脉冲和每日一步的仿真步长
      重合，才没有暴露问题；一旦换成更细的仿真粒度（如本仓库 papers/s4/hypertension_gout
      同名模型最初就踩过的坑），瞬时剂量在弛豫方程里会被大部分步的"0"读数抵消，药效几乎
      消失。改为脉冲先累加进这个衰减状态、bp_dynamics/ua_dynamics 改读该状态，结构复用
      papers/s4/hypertension_gout_sim.yaml 已验证过的设计，同时把本文件的仿真粒度从
      day 改为 hour，让这一衰减动态本身也得到合理精度的积分。
    value: 0.0
    unit: "mg"
    type: state
    bounds: [0.0, 100.0]
    reference: "Beermann B & Groschinsky-Grind M (1977) Eur J Clin Pharmacol 12(4):297-303"

  k_thiazide_decay:
    description: "HCTZ消除速率常数 = ln2/t_half，t_half取10h（Beermann & Groschinsky-Grind 1977报告血浆半衰期6.4-15h范围中值）。与 papers/s4/hypertension_gout_sim.yaml 使用同一取值。"
    value: 0.0693
    unit: "1/hour"
    type: parameter
    reference: "Beermann B & Groschinsky-Grind M (1977) Eur J Clin Pharmacol 12(4):297-303"

  # P2: Dietary Purine Intake
  purine_intake:
    description: |
      每日嘌呤摄入水平（mg，代表持续的饮食习惯而非单次给药事件）。
      高嘌呤食物：内脏（肝/肾/脑），贝类，红肉 → 每100g约150-1000mg嘌呤。
      低嘌呤目标：<500 mg/日（ACR 2020建议）。
      参考基线：普通饮食约1000 mg/日（Choi 2005）。
      每降低500mg嘌呤 → 尿酸降低约30 μmol/L（Choi 2005数据估算）。
      2026-08-12：regimen 改为全天窗口 + delivery:level（见 simulation.plans），
      使这一读数在任意仿真粒度下都保持恒定，不是需要衰减态缓冲的离散给药事件——
      饮食习惯是"当前持续设定"，不是"单次投放的量"，两者需要不同的建模处理，
      不能套用 diuretic_dose 那种脉冲+衰减态的修法。
    value: 1000.0
    unit: "mg"
    type: input
    bounds: [0.0, 3000.0]

  # P3: Weight Loss Rate — 双刃剑输入
  weight_loss_rate:
    description: |
      当前减重速率设定（kg/日，代表持续的饮食/运动方案而非单次事件）。
      正面效应：减重1kg → 收缩压降低约1 mmHg（Neter 2003）；同时降低尿酸。
      负面效应（快速减重>0.071 kg/日，即>0.5 kg/周）：酮体在肾小管竞争尿酸排泄 →
      尿酸反而升高（Fam 2005）。
      ACR 2020推荐：≤0.071 kg/日（≤0.5 kg/周，避免痛风急性发作）。
      约束：0-0.143 kg/日（对应≤1.0 kg/周）。
      2026-08-12：regimen 改为全天窗口 + delivery:level，理由同 purine_intake。
    value: 0.0
    unit: "kg"
    type: input
    bounds: [0.0, 0.143]

equations:
  # F0: Thiazide Level Dynamics（一阶药代衰减，2026-08-12 新增）
  thiazide_level_dynamics:
    description: >
      HCTZ体内水平：给药脉冲累加，按一阶消除速率常数衰减，供bp_dynamics/ua_dynamics读取。
      priority设为全文件最高，确保同一step内bp_dynamics/ua_dynamics读到的是本step更新后的值。
    step_unit: hour
    condition: true
    priority: 10
    dynamics:
      thiazide_level: thiazide_level + diuretic_dose - k_thiazide_decay * thiazide_level * step
    reference: "Beermann B & Groschinsky-Grind M (1977) Eur J Clin Pharmacol 12(4):297-303"

  # F1: Blood Pressure Dynamics（一阶趋向平衡动力学）
  # 目标收缩压 = 基线 - 药物效应 - 减重效应
  # 趋向速率τ ≈ 14天（HCTZ达到稳态约2周，来源：Lacourciere 2000）
  # dSBP/dt = (target_SBP - SBP) × (1/14)
  bp_dynamics:
    description: >
      收缩压向目标值的一阶动力学趋近（τ=14天）。
      target_SBP = 基线 - HCTZ效应(10mmHg/25mg，改读thiazide_level衰减态) - 减重效应(1mmHg/kg)。
      来源：Law 2003 (HCTZ); Neter 2003 (减重)。2026-08-12：τ=14天换算为小时等效值须用
      ADR 0121类型B开根公式（本项是"状态-目标"弛豫项）：k_day=1/14≈0.07143，
      k_hour=1-(1-k_day)^(1/24)≈0.0030831。系数0.4（mmHg/mg）延续原始标定，代表
      thiazide_level这个衰减态量级下的降压效力，与真实瞬时剂量的对应关系未重新校准，
      是本次改动遗留的简化，与本文件已声明的"一阶线性趋近模型"限制同一性质。
    step_unit: hour
    condition: true
    dynamics:
      systolic_bp: "systolic_bp + ((bp_baseline - thiazide_level * 0.4 - max(0.0, body_weight_ref - body_weight) * 1.0) - systolic_bp) * 0.0030831 * step"
    priority: 7

  # F2: Uric Acid Dynamics（一阶趋向平衡动力学）
  # 目标尿酸 = 基线 + HCTZ效应(+70/25mg) + 饮食效应 + 快速减重效应
  # 趋向速率τ ≈ 14天（血尿酸平衡约2周，来源：临床观测）
  # 快速减重效应：若减重速率>0.5 kg/week，每超额1 kg/week → 尿酸额外升高50 μmol/L
  ua_dynamics:
    description: >
      血尿酸向目标值的一阶动力学趋近（τ=14天）。
      target_UA = 基线 + HCTZ效应(+70μmol/L per 25mg，改读thiazide_level衰减态) +
      饮食效应((purine-1000)×0.06) + 快速减重惩罚。
      快速减重惩罚：max(0, weight_loss_rate - 0.5) × 50 μmol/L（Fam 2005）。
      来源：Gurwitz 1992 (HCTZ); Choi 2005 (饮食); Fam 2005 (减重)。2026-08-12：
      τ换算同bp_dynamics；purine_intake/weight_loss_rate在这里是瞬时读数用于计算目标值，
      不是被累加进状态，不需要单独乘step——真正需要按ADR 0121类型B换算的只有τ=14天这一项。
    step_unit: hour
    condition: true
    dynamics:
      uric_acid: "uric_acid + ((ua_baseline + thiazide_level * 2.8 + (purine_intake - 1000.0) * 0.06 + max(0.0, weight_loss_rate - 0.0714) * 350.0) - uric_acid) * 0.0030831 * step"
    priority: 7

  # F3: Body Weight Dynamics
  # 每次体重变化 = -weight_loss_rate（kg/日，作为持续速率读数乘step积分）
  weight_dynamics:
    description: >
      体重按当前减重速率设定线性下降（安全约束：≤0.143 kg/日，即≤1.0 kg/周）。
      2026-08-12：weight_loss_rate 的 regimen 改为全天窗口+delivery:level（详见该变量
      description），本方程需要相应补上 *step 才能正确积分——此前"不乘step"是配合单点脉冲
      regimen 在day粒度仿真下的写法，两处必须同步修改，不能只改其中一处。
    step_unit: day
    condition: weight_loss_rate > 0.0
    dynamics:
      body_weight: "max(50.0, body_weight - weight_loss_rate * step)"
    priority: 5

  # F4: Composite Goal Score
  # BP分：(158-SBP)/(158-120) × 50，SBP=120时得50分
  # UA分：(480-UA)/(480-250) × 50，UA=250时得50分
  goal_score_calc:
    description: |
      双指南达标综合评分。BP目标<130（ESC 2018）；UA目标<360（ACR 2020）。
      满分100=两个目标均完美达标。
    step_unit: day
    condition: true
    dynamics:
      goal_score: "max(0.0, min(50.0, (bp_baseline - systolic_bp) / (bp_baseline - 120.0) * 50.0)) + max(0.0, min(50.0, (ua_baseline - uric_acid) / (ua_baseline - 250.0) * 50.0))"
    priority: 1

simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-01-01"
  end_date: "2026-04-01"
  output_variables: [systolic_bp, uric_acid, thiazide_level, body_weight, goal_score, diuretic_dose, purine_intake, weight_loss_rate]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
    - variable: diuretic_dose
      time_start: "08:00"
      value: 12.5
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-04-01"]
      label: "HCTZ 晨服（初始12.5mg，单点脉冲，累加进thiazide_level）"
    - variable: purine_intake
      time_start: "00:00"
      time_end: "24:00"
      delivery: level
      value: 800.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-04-01"]
      label: "每日嘌呤摄入水平（mg，全天恒定设定）"

optimization:
  method: nsga2
  objectives:
  - variable: systolic_bp
    metric: final
    direction: minimize
    description: "最小化90天末收缩压（ESC 2018目标<130 mmHg）"
  - variable: uric_acid
    metric: final
    direction: minimize
    description: "最小化90天末血尿酸（ACR 2020目标<360 μmol/L）"
  constraints:
  - variable: weight_loss_rate
    condition: "<= 0.071"
    type: hard
    description: "ACR 2020：减重≤0.071 kg/日（≤0.5 kg/周），防止酮体竞争排泄升高尿酸"
  - variable: diuretic_dose
    condition: "<= 25"
    type: hard
    description: "HCTZ标准剂量上限25mg（ESC 2018）"
  startpoint:
    regimens:
    - variable: diuretic_dose
      time_start: "08:00"
      time_end: "08:00"
      label: "HCTZ晨服剂量（mg）"
      optimize:
        value: [0, 25]
  algorithm:
    population_size: 80
    n_generations: 120
    seed: 19
  results:
    status: >
      2026-09-04 用文件当前 algorithm 声明的完整预算（population=80/generations=120）重新
      求解，取代此前 2026-08-12 population=20/generations=20 的验证性预算前沿。120代全程
