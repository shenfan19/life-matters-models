category: physiological

metadata:
  name: smoking_lungcancer
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: |
      Smoking is the leading known risk factor for lung cancer, and a current smoker's lung-cancer
      mortality hazard ratio (HR) relative to a nonsmoker is commonly reported in the epidemiological
      literature as a large effect size on the order of double digits. This file uses HR=17.85 as an
      illustrative value at this order of magnitude. A check on 2026-08-28 could not locate a
      specific publication reporting this exact number combination, including the 95% CI 14.38-22.17,
      so it is no longer claimed to be drawn directly from a particular study, and is instead marked
      as an illustrative value, used to demonstrate that the evidence_type=rr conversion mechanism
      correctly handles a large-magnitude effect size.
    result: |
      This case declares the effect size using the rr subtype of the LM format's evidence block,
      substituting an illustrative baseline risk of 0.6%, to verify that the loader correctly reads,
      carries, and displays this effect size, with the exposed-group risk equal to the baseline risk
      times 17.85, that is, an HR of 17.85.
    limitations: |
      This case demonstrates the correctness of effect-size encoding, not an independent prediction
      test: the number 17.85 is itself the target being verified, not a value extrapolated and then
      compared against a separate independent source. The 0.6% baseline risk is an illustrative
      setting, not a measured prevalence in any specific population. HR=17.85 is itself an
      illustrative value that does not correspond to a specific publication, unlike this file's other
      cases in the same family, such as processed_meat_mortality, which are all traceable to a
      specific publication; this is noted in the problem field, and if a genuine publication
      supporting the smoking-lung-cancer association is needed before submission, a separate search
      and replacement will be required.
  ratings:
    importance: 0.25 - One case in the epidemiological-effect-size family, a general-purpose reference component not yet imported by a specific paper
    variable: 0.25 - A check on 2026-08-28 confirmed HR=17.85 has no traceable corresponding publication and has been changed to an illustrative value, no longer claimed as a consensus value from a meta-analysis or large cohort study
    equation: 1.0 - The evidence_type conversion is a standard mechanism defined by the LM format specification, not a self-built structure
    simulation: 0.5 - The correctness of the effect-size encoding has been verified and demonstrated, but this is explicitly not an independent prediction test, a form of circular verification
    optimization: 0.0 - This file contains no optimization block, being a pure effect-size encoding demonstration with no decision variables
    confidence: 0.25 - The value itself has no traceable basis, and is not comparable in confidence to this family's other cases; see the problem/limitations fields
  tags: [epidemiology, evidence, rr, validation, literature-benchmark, rr-family]

variables:
  baseline_risk_pct:
    description: An illustrative baseline (unexposed-group) risk (%)
    value: 0.6
    unit: "%"
    type: parameter

  exposed_risk_pct:
    description: The predicted exposed-group risk (%) = baseline risk x relative risk
    value: 0.0
    unit: "%"
    type: state

  exposure_rr:
    type: parameter
    evidence_type: rr
    value: 17.85
    unit: "HR"
    description: An illustrative value at the order of magnitude of a current smoker's lung-cancer mortality hazard ratio relative to a nonsmoker, not corresponding to a specific publication
    reference: "An illustrative value, not claimed to be drawn from a specific study; a check on 2026-08-28 found no publication reporting this exact number combination, HR=17.85 with 95% CI 14.38-22.17, hence this label"

equations:
  risk_calc:
    description: "A static calculation: exposed_risk_pct = baseline_risk_pct x exposure_rr"
    condition: true
    priority: 3
    dynamics:
      exposed_risk_pct: "baseline_risk_pct * exposure_rr"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables:
    - baseline_risk_pct
    - exposed_risk_pct
  plans:
    - id: "exposure_scenario"
      label: "Exposed-group versus baseline-risk effect-size demonstration"
      regimens: []

references:
  - "An illustrative value, not claimed to be drawn from a specific study; a check on 2026-08-28 found no publication reporting this exact number combination, HR=17.85 with 95% CI 14.38-22.17"
