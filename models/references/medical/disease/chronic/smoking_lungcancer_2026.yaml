category: physiological

metadata:
  name: smoking_lungcancer
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: |
      Smoking is the leading known risk factor for lung cancer, and a current smoker's lung-cancer
      mortality relative risk (RR) relative to a never-smoker is commonly reported in the
      epidemiological literature as a large effect size on the order of double digits. A search on
      2026-09-05 located Thun et al.'s (2013) pooled analysis of the contemporary NIH-AARP and
      American Cancer Society CPS-II cohorts (2000-2010), reporting RR=24.97 (95% CI 22.20-28.09)
      for men and RR=25.66 (95% CI 23.17-28.40) for women, current smokers versus never-smokers, with
      the paper itself noting the two sex-specific point estimates are virtually identical in the
      contemporary period. This file uses the male point estimate, 24.97, replacing the earlier
      HR=17.85 placeholder that a 2026-08-28 check could not trace to any publication.
    result: |
      This case declares the effect size using the rr subtype of the LM format's evidence block,
      substituting an illustrative baseline risk of 0.6%, to verify that the loader correctly reads,
      carries, and displays this effect size, with the exposed-group risk equal to the baseline risk
      times 24.97, an RR of 24.97.
    limitations: |
      The 0.6% baseline risk is an illustrative setting, not a measured prevalence in any specific
      population; only the RR itself, 24.97, is the literature-traced value. This case still
      demonstrates the correctness of effect-size encoding, not an independent prediction test, since
      the number being checked is the same number being loaded.
  ratings:
    importance: 0.25 - One case in the epidemiological-effect-size family, a general-purpose reference component not yet imported by a specific paper
    variable: 0.75 - RR=24.97 now traces to Thun et al.'s (2013) pooled NIH-AARP/CPS-II contemporary cohort analysis in NEJM, replacing the earlier untraceable placeholder
    equation: 1.0 - The evidence_type conversion is a standard mechanism defined by the LM format specification, not a self-built structure
    simulation: 0.5 - The correctness of the effect-size encoding has been verified and demonstrated, but this is explicitly not an independent prediction test, a form of circular verification
    optimization: 0.0 - This file contains no optimization block, being a pure effect-size encoding demonstration with no decision variables
    confidence: 0.5 - The RR itself now matches a named, citable cohort study, but the case still only round-trips a declared value rather than testing an independent prediction
  tags: [epidemiology, evidence, rr, validation, literature-benchmark, rr-family]

variables:
  baseline_risk_pct:
    description: An illustrative baseline (unexposed-group) risk (%)
    value: 0.6
    unit: "%"
    type: parameter

  exposed_risk_pct:
    description: The predicted exposed-group risk (%) = baseline risk x relative risk
    value: 0.0
    unit: "%"
    type: state

  exposure_rr:
    type: parameter
    evidence_type: rr
    value: 24.97
    unit: "RR"
    description: A current smoker's lung-cancer mortality relative risk versus a never-smoker, the male point estimate from the contemporary (2000-2010) cohort
    reference: "Thun MJ, Carter BD, Feskanich D, Freedman ND, Prentice R, Lopez AD, Hartge P, Gapstur SM (2013). 50-Year Trends in Smoking-Related Mortality in the United States. N Engl J Med 368(4):351-364, Table 3, contemporary cohort, men, RR=24.97 (95% CI 22.20-28.09)"

equations:
  risk_calc:
    description: "A static calculation: exposed_risk_pct = baseline_risk_pct x exposure_rr"
    condition: true
    priority: 3
    dynamics:
      exposed_risk_pct: "baseline_risk_pct * exposure_rr"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables:
    - baseline_risk_pct
    - exposed_risk_pct
  plans:
    - id: "exposure_scenario"
      label: "Exposed-group versus baseline-risk effect-size demonstration"
      regimens: []

references:
  - "Thun MJ, Carter BD, Feskanich D, Freedman ND, Prentice R, Lopez AD, Hartge P, Gapstur SM (2013). 50-Year Trends in Smoking-Related Mortality in the United States. N Engl J Med 368(4):351-364."
