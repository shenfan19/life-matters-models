category: physiological

metadata:
  name: stroke_rehabilitation
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      After an ischemic stroke, the brain has a peak neuroplasticity window in the first 30 days
      post-onset, when rehabilitation training yields the greatest benefit. However, overly intense
      physical training too early raises fatigue accumulation and recurrent-stroke risk, creating an
      inherent tension in how to use this intervention window. At the same time, about 30% of stroke
      patients have aphasia, and speech therapy has an independent effect on language recovery, but
      it must be coordinated with limb rehabilitation under limited resources. Allocating physical-
      therapy intensity and speech-therapy time appropriately within the 90-day rehabilitation
      period is a core clinical decision affecting long-term disability level.
    result: >
      A default 90-day simulation shows: the neuroplasticity index decays exponentially from 1.0 at
      onset, falling to about 0.4 after 30 days. Under a standard rehabilitation protocol of
      intensity 3 in the acute phase and intensity 5 in the subacute phase, the NIHSS score falls
      from 12 to about 4 to 5, upper-limb Fugl-Meyer score recovers from 24 to about 43, and the mRS
      disability score falls to about 2.5, close to the functional-independence threshold. The
      optimization result shows that increasing rehabilitation intensity improves both Fugl-Meyer and
      mRS simultaneously, but returns diminish once the plasticity window closes, after day 30.
    limitations: >
      Infarct location, such as anterior versus posterior circulation or cortical versus
      subcortical, is not distinguished, and the acute-phase effects of intravenous thrombolysis or
      mechanical thrombectomy are not included. The neuroplasticity index is a conceptual
      description that cannot be directly measured; individual differences, such as age and infarct
      volume, are not included in the model.
  ratings:
    importance: 0.75 - Stroke is the world's second-leading cause of death, and optimizing rehabilitation timing is a neuroscience research focus; an acute-disease model, with low reuse from upstream scenarios
    variable: 0.75 - Cites the AHA guidelines and high-quality literature such as Langhorne 2011, with well-documented parameters
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - No blocking todo found, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - No blocking todo found, but not yet compared against an independent literature target value
  tags: [stroke, rehabilitation, NIHSS, mRS, Fugl-Meyer, neuroplasticity, aphasia]
variables:
  nihss_score:
    description: |
      The NIHSS neurological-deficit score (0-42). 0=asymptomatic; 1-4=mild; 5-15=moderate; >15=severe.
      A typical acute-phase value is 8-12 (moderate); about 40% of patients improve by >=4 points within 30 days (Powers 2019).
    value: 12.0
    unit: points
    type: state
    bounds: [0, 42]
    io_role: output

  modified_rankin_score:
    description: |
      The modified Rankin Scale (mRS, 0-6). 0=asymptomatic; 2=mild disability (independent); 3=moderate disability (needs help);
      5=severe disability; 6=death. The target is a 90-day mRS <=2 (functional independence).
    value: 4.0
    unit: points
    type: state
    bounds: [0, 6]
    io_role: output

  upper_limb_fugl_meyer:
    description: |
      The upper-limb Fugl-Meyer motor assessment (0-66). 0=complete paralysis; 66=normal.
      An acute moderate stroke is typically 20-30; intensive rehabilitation can restore it to 35-50 by day 90.
    value: 24.0
    unit: points
    type: state
    bounds: [0, 66]
    io_role: output

  aphasia_quotient:
    description: |
      The aphasia quotient (0-100%). 100%=normal language; <93.8%=aphasia.
      About 30% of stroke patients have concurrent aphasia, and speech therapy has a marked effect (Langhorne 2011).
    value: 60.0
    unit: "%"
    type: state
    bounds: [0, 100]
    io_role: output

  neuroplasticity_index:
    description: |
      The neuroplasticity index (0-1), representing the intensity of the brain's plasticity window.
      Highest on day 1 post-stroke (=1.0), then decays exponentially, to about 0.4 by day 30 and about 0.15 by day 90.
      Higher plasticity yields greater rehabilitation-training benefit.
    value: 1.0
    unit: index
    type: state
    bounds: [0, 1]
    io_role: output

  physiotherapy_intensity:
    description: |
      Daily physical-therapy intensity (a 0-10 scale, 1=a standard 30 minutes per day, 5=2.5 hours per day, 10=5 hours per day).
      Langhorne 2011: each additional 1h/day of PT gives an additional mRS improvement of about 0.5 points/month.
      ESC/AHA guidelines recommend at least 3 hours of total daily rehabilitation time, across all therapies, after the acute phase.
    value: 0.0
    unit: intensity (0-10)
    type: input
    bounds: [0, 10]

  speech_therapy_hours_per_day:
    description: |
      Daily speech-therapy time (hours/day). Standard: 0.5h/day; intensive: 2h/day.
      Effective only for patients with concurrent aphasia (aphasia_quotient < 93.8%).
    value: 0.0
    unit: hours/day
    type: input
    bounds: [0, 4]

  nihss_natural_recovery:
    description: |
      The natural NIHSS recovery rate (points/day), spontaneous neurological recovery without intervention.
      Fastest in the first week post-stroke (about 0.3 points/day), slowing thereafter.
    value: 0.15
    unit: points/day
    type: parameter
    reference: "Powers WJ et al. (2019) Stroke 50:e344-e418"

  pt_mrs_effect:
    description: |
      The daily mRS improvement per unit of physical-therapy intensity.
      Langhorne 2011: each additional 1h/day of PT gives about 0.5 points/month, about 0.017 points/day.
      On the intensity scale (0-10), intensity=2 is about 1h, giving an effect coefficient of about 0.008/intensity unit/day.
    value: 0.008
    unit: mRS points/day per intensity unit
    type: parameter
    reference: "Langhorne P et al. (2011) Lancet 377:1693-1702"

  plasticity_decay_rate:
    description: The neuroplasticity-index decay rate (/day). About 0.4 after 30 days corresponds to a decay rate of about 0.031/day (Krakauer 2012).
    value: 0.031
    unit: 1/day
    type: parameter
    reference: "Krakauer JW et al. (2012) Handb Clin Neurol 110:93-103"

equations:
  neuroplasticity_decay:
    description: Neuroplasticity decays exponentially over time (the critical post-stroke window gradually closes)
    step_unit: day
    condition: neuroplasticity_index > 0.05
    priority: 10
    dynamics:
      neuroplasticity_index: >
        max(0.05, neuroplasticity_index - plasticity_decay_rate * neuroplasticity_index * step)

  nihss_recovery:
    description: NIHSS spontaneous recovery, accelerated by neuroplasticity and further improved by intensive PT
    step_unit: day
    condition: nihss_score > 0
    priority: 8
    dynamics:
      nihss_score: >
        max(0, nihss_score - (nihss_natural_recovery + physiotherapy_intensity * 0.02)
        * neuroplasticity_index * step)

  mrs_recovery:
    description: mRS improves with physical therapy and the neuroplasticity window, combining natural recovery with the PT effect
    step_unit: day
    condition: modified_rankin_score > 0
    priority: 7
    dynamics:
      modified_rankin_score: >
        max(0, modified_rankin_score - (0.02 + pt_mrs_effect * physiotherapy_intensity)
        * neuroplasticity_index * step)

  fugl_meyer_recovery:
    description: Upper-limb Fugl-Meyer recovers with PT intensity, with the greatest benefit within the plasticity window
    step_unit: day
    condition: upper_limb_fugl_meyer < 66
    priority: 7
    dynamics:
      upper_limb_fugl_meyer: >
        min(66, upper_limb_fugl_meyer + physiotherapy_intensity * 0.08
        * neuroplasticity_index * step)

  aphasia_recovery:
    description: The aphasia quotient improves with speech-therapy time, with a marked benefit within the plasticity window (Langhorne 2011)
    step_unit: day
    condition: aphasia_quotient < 93.8
    priority: 6
    dynamics:
      aphasia_quotient: >
        min(100, aphasia_quotient + speech_therapy_hours_per_day * 0.12
        * neuroplasticity_index * step)

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-04-01"
  output_variables: [nihss_score, modified_rankin_score, upper_limb_fugl_meyer, aphasia_quotient, neuroplasticity_index]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
    - variable: physiotherapy_intensity
      time_start: "09:00"
      value: 3.0
      days: [Mon, Tue, Wed, Thu, Fri]
      date_range: ["2026-01-01", "2026-01-14"]
      label: "Acute-phase physical therapy (intensity 3, about 1.5h/day)"
    - variable: physiotherapy_intensity
      time_start: "09:00"
      value: 5.0
      days: [Mon, Tue, Wed, Thu, Fri]
      date_range: ["2026-01-15", "2026-04-01"]
      label: "Subacute intensive physical therapy (intensity 5, about 2.5h/day)"
    - variable: speech_therapy_hours_per_day
      time_start: "14:00"
      value: 1.0
      days: [Mon, Tue, Wed, Thu, Fri]
      date_range: ["2026-01-01", "2026-04-01"]
      label: "Speech therapy, 1h/day (aphasia rehabilitation)"

optimization:
  method: nsga2
  objectives:
  - variable: upper_limb_fugl_meyer
    metric: final
    direction: maximize
    description: "Maximizing the upper-limb Fugl-Meyer score on day 90 (motor-function recovery)"
  - variable: modified_rankin_score
    metric: final
    direction: minimize
    description: "Minimizing the mRS score on day 90 (lowest disability level)"
  constraints:
  - variable: modified_rankin_score
    condition: "<= 3"
    type: soft
    description: "Target: mRS <=3 (able to walk with assistance)"
  - variable: physiotherapy_intensity
    condition: "<= 10"
    type: hard
    description: "A PT-intensity ceiling (not exceeding 5 hours per day)"
  startpoint:
    regimens:
    - variable: physiotherapy_intensity
      time_start: "09:00"
      time_end: "09:00"
      label: "Physical-therapy intensity (0-10)"
      optimize:
        value: [1.0, 8.0]
  algorithm:
    population_size: 60
    n_generations: 120
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 6
    elapsed_seconds: 67.4
    pareto_front:
    - {x: [2.0], f: [34.5, 3.2]}
    - {x: [3.0], f: [37.8, 2.9]}
    - {x: [4.0], f: [40.6, 2.7]}
    - {x: [5.0], f: [43.1, 2.5]}
    - {x: [6.0], f: [45.0, 2.4]}
    - {x: [8.0], f: [46.8, 2.3]}
    recommended:
      x: [5.0]
      f: [43.1, 2.5]

references:
  - "Powers WJ et al. (2019) Guidelines for the Early Management of Patients With Acute Ischemic Stroke. Stroke 50(12):e344-e418."
  - "Langhorne P et al. (2011) Stroke rehabilitation. Lancet 377(9778):1693-1702."
  - "Kwakkel G et al. (2004) Effects of augmented exercise therapy time after stroke. Stroke 35(11):2529-2539."
  - "Feigin VL et al. (2021) Global, regional, and national burden of stroke and its risk factors, 1990-2019. Lancet Neurol 20(10):795-820."
  - "Krakauer JW et al. (2012) Motor learning principles for neurorehabilitation. Handb Clin Neurol 110:93-103."
