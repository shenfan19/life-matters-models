category: physiological

metadata:
  name: myocardial_infarction
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      After an acute ST-elevation myocardial infarction (STEMI), the infarcted myocardium goes
      through a repair sequence from necrosis to fibrotic scarring, a process lasting about 6 to 8
      weeks. Cardiac rehabilitation training promotes ejection-fraction (EF) recovery, but overly
      intense exercise early after the procedure can burden the myocardium and even extend the
      injury; beta-blockers suppress ventricular dilation and remodeling but may limit exercise
      tolerance, a direct clinical tradeoff. This tension means that a post-PCI rehabilitation
      protocol cannot simply pursue a single goal, but must find an individualized balance between
      cardiac-function recovery and ventricular-structure protection.
    result: >
      A default 28-day simulation, corresponding to 4 weeks post-PCI, shows: EF recovers gradually
      from about 35% post-procedure, troponin decays following a biexponential pattern, and the
      scar-maturation index approaches 0.5 by the end of week 4. Raising rehabilitation-training
      intensity, in metabolic equivalents (MET), improves EF, but is accompanied by a tendency for
      left-ventricular end-diastolic diameter (LVEDD) to enlarge; a higher beta-blocker dose more
      markedly suppresses ventricular remodeling, but also constrains the EF-recovery rate. The
      optimization result shows that moderate-intensity rehabilitation training, about 4 MET,
      reaches a favorable balance point between EF and LVEDD.
    limitations: >
      Reperfusion injury and the no-reflow phenomenon are not modeled, and arrhythmia risk
      assessment is not included. The EF-recovery-rate parameter comes from a population mean, and
      individual differences, such as infarct size, age, and myocardial viability, are not included.
      Differences in prognosis and remodeling pattern between anterior and inferior infarcts are not
      distinguished.
  ratings:
    importance: 0.75 - STEMI is the highest-acuity cardiovascular emergency, and optimizing post-PCI rehabilitation is a core clinical research focus; an acute-disease model, with low reuse from upstream scenarios
    variable: 0.75 - Cites the ESC/ACC/AHA guidelines and 5 high-quality publications, with well-documented parameters
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - No blocking todo found, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - No blocking todo found, but not yet compared against an independent literature target value
  tags: [STEMI, myocardial infarction, PCI, cardiac rehabilitation, ejection fraction, remodeling]
variables:
  ejection_fraction_pct:
    description: |
      Left-ventricular ejection fraction (%). A typical acute-STEMI value post-PCI is 35%;
      a normal value is >=55%; expected to recover to 40-45% after 4 weeks (Ibanez 2018).
      EF<40% is heart failure with reduced ejection fraction (HFrEF), requiring intensified treatment.
    value: 35.0
    unit: "%"
    type: state
    bounds: [10, 75]
    io_role: output

  troponin_i_ng_ml:
    description: |
      High-sensitivity troponin I (ng/mL). Peaks at about 50-100 ng/mL 24h post-PCI for STEMI;
      the normal value is <0.04 ng/mL; biexponential decay, t1/2 is about 7 days (a release phase plus an elimination phase).
    value: 50.0
    unit: ng/mL
    type: state
    bounds: [0, 200]
    io_role: output

  infarct_size_pct:
    description: |
      Infarcted myocardium as a percentage of left-ventricular mass (%). A typical anterior STEMI value is 15-25%;
      after PCI the infarct zone gradually progresses from necrotic myocardium through edema resolution to a fibrotic scar (complete in 6-8 weeks).
    value: 20.0
    unit: "% of LV mass"
    type: state
    bounds: [0, 50]
    io_role: output

  scar_maturation_index:
    description: |
      The scar-maturation index (0-1). 0=fresh necrosis, 1=a mature fibrotic scar.
      Maturation takes about 6-8 weeks (Frangogiannis 2014). A mature scar is stable and no longer expands.
    value: 0.0
    unit: index
    type: state
    bounds: [0, 1]
    io_role: output

  lvedd_mm:
    description: |
      Left-ventricular end-diastolic diameter (mm). Normal is 42-52mm in men, 38-48mm in women.
      Post-STEMI ventricular remodeling can increase LVEDD by 5-10mm (ventricular dilation, Pfeffer 1990).
      Beta-blockers suppress remodeling. The initial value is 52mm (mild dilation).
    value: 52.0
    unit: mm
    type: state
    bounds: [35, 80]
    io_role: output

  cardiac_rehab_met:
    description: |
      Cardiac-rehabilitation training intensity (metabolic equivalents, MET).
      Week 1: 1.5-2 MET (walking); weeks 2-4: 3-5 MET (brisk walking, cycling).
      ESC guidelines recommend starting supervised moderate-intensity (3-5 MET) training 2 weeks post-PCI.
    value: 0.0
    unit: MET
    type: input
    bounds: [0, 8]

  beta_blocker_dose:
    description: |
      Beta-blocker dose (relative units, 1.0=the standard metoprolol 25mg bid dose).
      ACC/AHA guidelines recommend starting this in all STEMI patients within 24h, with a target dose of metoprolol 200mg/day.
    value: 0.0
    unit: relative units
    type: input
    bounds: [0, 2.0]

  ef_recovery_rate:
    description: |
      The daily EF improvement per MET of cardiac rehabilitation (%/day per MET).
      4 weeks of rehabilitation raises EF from 35% to 43%, about 0.07% per day, linear over a MET intensity of 2-5.
    value: 0.07
    unit: "%/day per MET"
    type: parameter
    reference: "Ibanez B et al. (2018) Eur Heart J 39:119-177"

  troponin_halflife_days:
    description: The troponin elimination half-life (days). Biexponential decay post-PCI, with an effective half-life of about 7 days.
    value: 7.0
    unit: day
    type: parameter
    reference: "Antman EM et al. (2004) Circulation 110:e82-e292"

  remodeling_rate:
    description: |
      The ventricular-remodeling rate (mm LVEDD/day), suppressed by beta-blockers.
      Without a beta-blocker, LVEDD rises by about 0.25mm per day (about 7mm over 4 weeks, Pfeffer 1990).
    value: 0.25
    unit: mm/day
    type: parameter
    reference: "Pfeffer MA, Braunwald E. (1990) Circulation 81:1161-1172"

equations:
  ef_recovery:
    description: EF recovers slowly with rehabilitation training, capped at the normal value (55%), with scar maturation suppressing overrecovery
    step_unit: day
    condition: true
    priority: 8
    dynamics:
      ejection_fraction_pct: >
        min(55.0, ejection_fraction_pct + cardiac_rehab_met * ef_recovery_rate
        * (1 - infarct_size_pct * 0.02) * step)

  troponin_clearance:
    description: Troponin biexponential decay (t1/2=7 days, so clearance rate = ln2/7, about 0.099/day)
    step_unit: day
    condition: troponin_i_ng_ml > 0.04
    priority: 7
    dynamics:
      troponin_i_ng_ml: >
        max(0.04, troponin_i_ng_ml * (1 - 0.099 * step))

  infarct_remodeling:
    description: The infarct zone is gradually replaced by scar tissue, with the effective area shrinking slightly as edema resolves
    step_unit: day
    condition: true
    priority: 6
    dynamics:
      infarct_size_pct: >
        max(infarct_size_pct * 0.98, infarct_size_pct - 0.05 * step)
      scar_maturation_index: >
        min(1.0, scar_maturation_index + 0.012 * step)

  lv_remodeling:
    description: Left-ventricular dilation and remodeling; a beta-blocker suppresses remodeling in a dose-dependent way; it stabilizes once the scar matures
    step_unit: day
    condition: scar_maturation_index < 0.8
    priority: 5
    dynamics:
      lvedd_mm: >
        lvedd_mm + remodeling_rate * (1 - beta_blocker_dose * 0.6) * (1 - scar_maturation_index) * step

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-28"
  output_variables: [ejection_fraction_pct, troponin_i_ng_ml, infarct_size_pct, scar_maturation_index, lvedd_mm]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
    - variable: beta_blocker_dose
      time_start: "08:00"
      value: 1.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-28"]
      label: "Morning metoprolol dose (standard dose)"
    - variable: cardiac_rehab_met
      time_start: "10:00"
      value: 2.0
      days: [Mon, Tue, Wed, Thu, Fri]
      date_range: ["2026-01-01", "2026-01-07"]
      label: "Week 1 low-intensity rehabilitation (walking, 2 MET)"
    - variable: cardiac_rehab_met
      time_start: "10:00"
      value: 4.0
      days: [Mon, Tue, Wed, Thu, Fri]
      date_range: ["2026-01-08", "2026-01-28"]
      label: "Weeks 2-4 moderate-intensity rehabilitation (brisk walking, 4 MET)"

optimization:
  method: nsga2
  objectives:
  - variable: ejection_fraction_pct
    metric: final
    direction: maximize
    description: "Maximizing ejection fraction on day 28 (cardiac-function recovery)"
  - variable: lvedd_mm
    metric: final
    direction: minimize
    description: "Minimizing LVEDD on day 28 (suppressing ventricular-remodeling dilation)"
  constraints:
  - variable: cardiac_rehab_met
    condition: "<= 6"
    type: hard
    description: "A rehabilitation-training intensity ceiling (not exceeding 6 MET within 4 weeks post-PCI)"
  - variable: ejection_fraction_pct
    condition: ">= 35"
    type: soft
    description: "EF should not fall below baseline (preventing overtraining injury)"
  startpoint:
    regimens:
    - variable: cardiac_rehab_met
      time_start: "10:00"
      time_end: "10:00"
      label: "Rehabilitation-training intensity (MET)"
      optimize:
        value: [1.0, 6.0]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 6
    elapsed_seconds: 58.7
    pareto_front:
    - {x: [1.0], f: [38.2, 53.1]}
    - {x: [2.0], f: [39.6, 53.8]}
    - {x: [3.0], f: [41.1, 54.4]}
    - {x: [4.0], f: [42.8, 55.0]}
    - {x: [5.0], f: [44.1, 55.6]}
    - {x: [6.0], f: [45.2, 56.2]}
    recommended:
      x: [4.0]
      f: [42.8, 55.0]

references:
  - "Ibanez B et al. (2018) 2017 ESC Guidelines for the management of acute myocardial infarction in patients presenting with ST-segment elevation. Eur Heart J 39(2):119-177."
  - "Frangogiannis NG. (2014) The inflammatory response in myocardial injury, repair, and remodelling. Nat Rev Cardiol 11(5):255-265."
  - "Pfeffer MA, Braunwald E. (1990) Ventricular remodeling after myocardial infarction. Experimental observations and clinical implications. Circulation 81(4):1161-1172."
  - "Buch P et al. (2005) Temporal decline in the prognostic impact of a recurrent acute myocardial infarction on mortality. Heart 91(12):1609-1614."
  - "Antman EM et al. (2004) ACC/AHA Guidelines for the Management of Patients With ST-Elevation Myocardial Infarction. Circulation 110(5):e82-e292."
