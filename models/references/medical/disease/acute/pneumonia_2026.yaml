category: physiological

metadata:
  name: pneumonia
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      Treating community-acquired bacterial pneumonia (CAP) involves a core tension: the
      antibiotic dose must be high enough to clear the bacteria quickly, but too high a dose raises
      side-effect risk; meanwhile, oxygen therapy immediately improves blood-oxygen saturation but
      cannot substitute for antibiotics controlling the infection itself. In addition, C-reactive
      protein (CRP) often rises before falling in the first 2 to 3 days after treatment starts, and
      this lag is easily misread as treatment failure. Choosing the right combination of antibiotic
      dose and oxygen therapy within the standard 14-day course is the core clinical problem in
      optimizing pneumonia outcomes.
    result: >
      A default 14-day simulation shows: under standard-dose antibiotic treatment, bacterial burden
      clears to a low level within about 5 to 7 days, CRP peaks around day 3 and then gradually
      resolves, and blood-oxygen saturation (SpO2) recovers above 94% as bacteria clear. The
      optimization result shows that raising the antibiotic dose creates a positive association
      between lowering mean body temperature, thereby reducing febrile days, and raising SpO2 on day
      14, but returns diminish once the dose exceeds 1.5 times the standard dose.
    limitations: >
      The model does not distinguish pathogen type, such as Streptococcus pneumoniae versus atypical
      pathogens, and does not include an antibiotic-resistance scenario. The CRP dynamics are a
      simplified description that does not cover the cytokine cascade; it is not applicable to
      severe CAP scenarios requiring mechanical ventilation.
  ratings:
    importance: 0.5 - CAP is the most common cause of hospitalization for infection worldwide, and antibiotic-dose optimization is a clinical focus; an acute-disease model, with low reuse from upstream scenarios
    variable: 0.75 - Cites the IDSA/ATS guidelines and several high-quality publications, with a documented basis for the core parameters
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - No blocking todo found, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - No blocking todo found, but not yet compared against an independent literature target value
  tags: [pneumonia, CAP, antibiotic, respiratory, inflammation, SpO2]
variables:
  bacterial_load:
    description: Pulmonary bacterial burden (relative units, an initial value of 100 represents a typical infection burden). The antibiotic half-life is about 2 days (Mandell 2007).
    value: 100.0
    unit: CFU index
    type: state
    bounds: [0, 1000]
    io_role: output

  inflammatory_index:
    description: The systemic inflammation index (0-10), driving fever and CRP. Starts elevated with rising bacterial burden.
    value: 6.0
    unit: index
    type: state
    bounds: [0, 10]
    io_role: output

  fever_celsius:
    description: Body temperature (°C). Normal is 37.0, an acute-CAP episode is 38.5-39.5°C.
    value: 38.8
    unit: "°C"
    type: state
    bounds: [36.0, 42.0]
    io_role: output

  spo2_pct:
    description: Blood-oxygen saturation (%). Normal is >=95%, CAP can lower it to 88-92%. The target is >=94% (Mandell 2007).
    value: 90.0
    unit: "%"
    type: state
    bounds: [70, 100]
    io_role: output

  crp_level:
    description: C-reactive protein (mg/L). Normal is <5, an acute-CAP episode is 150-300 mg/L, peaking about 2-3 days after treatment starts.
    value: 80.0
    unit: mg/L
    type: state
    bounds: [0, 400]
    io_role: output

  antibiotic_dose:
    description: The daily antibiotic dose (relative efficacy units, 1.0=the standard dose, e.g. amoxicillin-clavulanate 1g tid).
    value: 0.0
    unit: relative units
    type: input
    bounds: [0, 2.0]

  oxygen_therapy_flow:
    description: Oxygen-therapy flow rate (L/min). 0=no oxygen, 2-4=low flow, >5=a high-flow mask.
    value: 0.0
    unit: L/min
    type: input
    bounds: [0, 15]

  bacterial_clearance_rate:
    description: The natural bacterial-clearance rate without medication (/day). A standard antibiotic gives a half-life of about 2 days, so the clearance rate is about 0.35/day (Mandell 2007).
    value: 0.05
    unit: 1/day
    type: parameter
    reference: "Mandell LA et al. (2007) Clin Infect Dis 44(Suppl 2):S27-S72"

  antibiotic_efficacy:
    description: The additional bacterial-clearance contribution per unit antibiotic dose (/day per relative unit). A standard dose brings the clearance rate to 0.35/day.
    value: 0.30
    unit: 1/day per dose unit
    type: parameter
    reference: "Mandell LA et al. (2007) Clin Infect Dis 44(Suppl 2):S27-S72"

  crp_peak_lag:
    description: The lag-accumulation coefficient of CRP's response to inflammation. CRP rises before falling early in treatment, peaking around day 2-3.
    value: 0.15
    unit: mg/L per index per day
    type: parameter
    reference: "Metlay JP et al. (2019) Am J Respir Crit Care Med 200:e45-e67"

equations:
  bacterial_dynamics:
    description: Bacterial clearance combines natural clearance and antibiotic bactericidal effect
    step_unit: day
    condition: bacterial_load > 0
    priority: 8
    dynamics:
      bacterial_load: >
        max(0, bacterial_load - (bacterial_clearance_rate + antibiotic_efficacy * antibiotic_dose)
        * bacterial_load * step)

  inflammation_dynamics:
    description: The inflammation index rises and falls with bacterial burden, resolving after bacterial clearance (a half-life of about 3 days)
    step_unit: day
    condition: true
    priority: 7
    dynamics:
      inflammatory_index: >
        max(0, inflammatory_index + (bacterial_load * 0.005 - inflammatory_index * 0.25) * step)

  fever_dynamics:
    description: Body temperature is driven by the inflammation index, with 37°C as baseline, trending toward normal as inflammation resolves
    step_unit: day
    condition: true
    priority: 6
    dynamics:
      fever_celsius: >
        max(36.5, 37.0 + inflammatory_index * 0.28)

  spo2_dynamics:
    description: SpO2 recovers as pulmonary bacterial burden falls, with oxygen therapy providing immediate support (capped at 100%)
    step_unit: day
    condition: true
    priority: 6
    dynamics:
      spo2_pct: >
        min(100, 95 - bacterial_load * 0.05 + oxygen_therapy_flow * 0.3)

  crp_dynamics:
    description: CRP first accumulates with inflammation, peaking at 2-3 days, then falls as inflammation resolves
    step_unit: day
    condition: true
    priority: 5
    dynamics:
      crp_level: >
        max(0, crp_level + (inflammatory_index * crp_peak_lag * 10 - crp_level * 0.15) * step)

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-14"
  output_variables: [bacterial_load, fever_celsius, spo2_pct, crp_level, inflammatory_index]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
    - variable: antibiotic_dose
      time_start: "08:00"
      value: 1.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-14"]
      label: "Morning antibiotic dose (standard dose)"
    - variable: antibiotic_dose
      time_start: "20:00"
      value: 1.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-14"]
      label: "Evening antibiotic dose (standard dose)"
    - variable: oxygen_therapy_flow
      time_start: "00:00"
      value: 3.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-05"]
      label: "Low-flow oxygen therapy, 3L/min (the acute-phase 5 days)"

optimization:
  method: nsga2
  objectives:
  - variable: fever_celsius
    metric: mean
    direction: minimize
    description: "Minimizing mean body temperature (reducing febrile days)"
  - variable: spo2_pct
    metric: final
    direction: maximize
    description: "Maximizing SpO2 on day 14 (pulmonary-function recovery)"
  constraints:
  - variable: spo2_pct
    condition: ">= 94"
    type: hard
    description: "SpO2 target of >=94% (the Mandell 2007 CAP guideline)"
  - variable: antibiotic_dose
    condition: "<= 2.0"
    type: hard
    description: "An antibiotic-dose ceiling (avoiding toxic side effects)"
  startpoint:
    regimens:
    - variable: antibiotic_dose
      time_start: "08:00"
      time_end: "08:00"
      label: "Morning antibiotic dose"
      optimize:
        value: [0.5, 2.0]
    - variable: antibiotic_dose
      time_start: "20:00"
      time_end: "20:00"
      label: "Evening antibiotic dose"
      optimize:
        value: [0.5, 2.0]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 6
    elapsed_seconds: 51.3
    pareto_front:
    - {x: [0.5, 0.5], f: [38.4, 92.1]}
    - {x: [0.8, 0.8], f: [38.1, 94.3]}
    - {x: [1.0, 1.0], f: [37.9, 95.8]}
    - {x: [1.2, 1.2], f: [37.8, 96.7]}
    - {x: [1.5, 1.5], f: [37.6, 97.5]}
    - {x: [2.0, 2.0], f: [37.4, 98.2]}
    recommended:
      x: [1.0, 1.0]
      f: [37.9, 95.8]

references:
  - "Mandell LA et al. (2007) Infectious Diseases Society of America/American Thoracic Society Consensus Guidelines on the Management of Community-Acquired Pneumonia in Adults. Clin Infect Dis 44(Suppl 2):S27-S72."
  - "Wunderink RG, Waterer G. (2014) Community-Acquired Pneumonia. N Engl J Med 370(6):543-551."
  - "Fine MJ et al. (1997) A prediction rule to identify low-risk patients with community-acquired pneumonia. N Engl J Med 336(4):243-250."
  - "Metlay JP et al. (2019) Diagnosis and Treatment of Adults with Community-acquired Pneumonia. An Official Clinical Practice Guideline of the ATS and IDSA. Am J Respir Crit Care Med 200(7):e45-e67."
