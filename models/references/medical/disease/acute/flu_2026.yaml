  name: flu
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      流感病毒在人体内快速复制，同时触发免疫系统应答，两者之间存在固有的时序矛盾：免疫激活，例如发热和乏力，是清除病毒的必要代价，但过强的免疫反应本身也会损伤体能。休息、补水和药物干预可以调节这一平衡，但最优干预时机和组合因人而异。本模型描述病毒载量、免疫活性与体能活力三者之间的耦合动态，用于量化不同干预策略下感冒进程的差异。
    result: >
      仿真显示，在默认25天时间窗口内，病毒载量先升后降，体温随免疫活性的激活而上升，体能活力在未干预时因病毒消耗而持续下滑。充分休息与适量用药可加速病毒清除并缓解体能损耗，两者存在权衡：用药可快速压低病毒但不替代休息对活力的恢复作用。
    limitations: >
      参数尚无正式文献来源，机制为定性近似，不适合用于临床预测。模型未区分流感与普通感冒，也未包含肺炎、心肌炎等并发症风险。
  ratings:
    importance: 0.5 - 感冒是最常见急性感染，免疫-病毒动力学有广泛复用价值；noref + 未被其他模型引用，复用价值极低
    variable: 0.25 - noref标记，参数无文献来源，机制为定性近似
    equation: 0.25 - 参数缺乏文献来源，方程为定性近似，未见独立复现
    simulation: 0.5 - 未发现阻断性todo，但未与独立文献目标数值比对
    optimization: 0.5 - 决策变量搜索前沿方向合理，未独立验证是否退化
    confidence: 0.25 - 未发现阻断性todo，但未与独立文献目标数值比对
  tags: [medical, physiological, flu]

variables:
  # R1: Pathogen
  viral_load: {description: "病毒载量", value: 1.0, unit: "相对单位", type: state, bounds: [0, 1000]}
  # R2: Immune System
  immune_activity: {description: "免疫活性", value: 10, unit: "指数", type: state, bounds: [0, 100]}
  body_temperature: {description: "体温", value: 37.0, unit: "°C", type: state, bounds: [35, 42]}
  # R3: Systemic State
  vitality: {description: "体能/活力", value: 100, unit: "分", type: state, bounds: [0, 100]}
  # P1: Inputs (Card Inputs)
  rest_hours: {description: "休息时间", value: 0, unit: "h", type: input}
  medicine_intake: {description: "药物干预", value: 0, unit: "mg", type: input}
  water_intake: {description: "饮水量", value: 0, unit: "ml", type: input}

equations:
  # F1: Viral Replication vs Immune Kill
  infection_dynamics:
    description: "病毒增殖与免疫对抗"
    step_unit: day
    condition: viral_load > 0
    dynamics:
      viral_load: "viral_load + (viral_load * 0.1 - immune_activity * 0.05 - medicine_intake * 0.2) * step"
    priority: 5

  # F2: Immune Response (Fever)
  immune_dynamics:
    description: "免疫系统激活"
    step_unit: day
    condition: viral_load > 10
    dynamics:
      immune_activity: "immune_activity + viral_load * 0.01 * step"
      body_temperature: "37.0 + viral_load * 0.005"
    priority: 5

  # F3: Recovery & Vitality
  recovery_dynamics:
    description: "体能恢复与损耗"
    step_unit: day
    condition: true
    dynamics:
      vitality: "vitality + (rest_hours * 5 + water_intake * 0.01 - viral_load * 0.1) * step"
    priority: 3

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-25"
  output_variables: [viral_load, body_temperature, vitality]

optimization:
  method: nsga2
  objectives:
    - variable: vitality
      metric: final
      direction: maximize
    - variable: viral_load
      metric: final
      direction: minimize
  constraints:
    - variable: body_temperature
      condition: "<= 38.5"
      type: hard
      description: "体温不超过38.5°C（避免高热危机）"
  startpoint:
    regimens:
      - variable: rest_hours
        time_start: "22:00"
        time_end: "22:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "每日休息（0=不休息，1=充分休息）"
        optimize:
          value: [0, 1]
      - variable: medicine_intake
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "每日用药（0=不用药，1=足量）"
        optimize:
          value: [0, 1]
      - variable: water_intake
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "每日饮水（0=不足，1=充足）"
        optimize:
          value: [0, 1]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
