metadata:
  todo:
    - type: noref
      issue: "Lacks sufficient literature citation support (migrated from the old filename's _noref suffix)"
      evidence: "Migrated from the legacy _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check and supply the missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: flu
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      A flu virus replicates rapidly in the body while simultaneously triggering an immune
      response, and the two are in an inherent temporal tension: immune activation, such as fever
      and fatigue, is a necessary cost of clearing the virus, but an overly strong immune response
      itself also depletes physical energy. Rest, hydration, and medication can adjust this balance,
      but the optimal timing and combination of intervention varies by individual. This model
      describes the coupled dynamics among viral load, immune activity, and physical vitality, used
      to quantify how the course of a cold differs under different intervention strategies.
    result: >
      The simulation shows that within the default 25-day window, viral load first rises then
      falls, body temperature rises as immune activity is activated, and vitality declines steadily
      from viral depletion when no intervention is applied. Sufficient rest and moderate medication
      accelerate viral clearance and ease vitality depletion, and the two present a tradeoff:
      medication quickly suppresses the virus but does not substitute for rest's role in restoring
      vitality.
    limitations: >
      The parameters have no formal literature source yet, and the mechanism is a qualitative
      approximation not suited to clinical prediction. The model does not distinguish influenza from
      the common cold, and does not include complication risks such as pneumonia or myocarditis.
  ratings:
    importance: 0.5 - The common cold is the most frequent acute infection, and immune-virus dynamics have broad reuse value; noref and not yet cited by other models, so reuse value is currently very low
    variable: 0.25 - noref marker, parameters lack a literature source, the mechanism is a qualitative approximation
    equation: 0.25 - Parameters lack a literature source, the equation is a qualitative approximation with no independent reproduction
    simulation: 0.5 - No blocking todo found, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - No blocking todo found, but not yet compared against an independent literature target value
  tags: [medical, physiological, flu]

variables:
  # R1: Pathogen
  viral_load: {description: "Viral load", value: 1.0, unit: "relative units", type: state, bounds: [0, 1000]}
  # R2: Immune System
  immune_activity: {description: "Immune activity", value: 10, unit: "index", type: state, bounds: [0, 100]}
  body_temperature: {description: "Body temperature", value: 37.0, unit: "°C", type: state, bounds: [35, 42]}
  # R3: Systemic State
  vitality: {description: "Physical vitality", value: 100, unit: "score", type: state, bounds: [0, 100]}
  # P1: Inputs (Card Inputs)
  rest_hours: {description: "Rest time", value: 0, unit: "h", type: input}
  medicine_intake: {description: "Medication intervention", value: 0, unit: "mg", type: input}
  water_intake: {description: "Water intake", value: 0, unit: "ml", type: input}

equations:
  # F1: Viral Replication vs Immune Kill
  infection_dynamics:
    description: "Viral replication versus immune counteraction"
    step_unit: day
    condition: viral_load > 0
    dynamics:
      viral_load: "viral_load + (viral_load * 0.1 - immune_activity * 0.05 - medicine_intake * 0.2) * step"
    priority: 5

  # F2: Immune Response (Fever)
  immune_dynamics:
    description: "Immune-system activation"
    step_unit: day
    condition: viral_load > 10
    dynamics:
      immune_activity: "immune_activity + viral_load * 0.01 * step"
      body_temperature: "37.0 + viral_load * 0.005"
    priority: 5

  # F3: Recovery & Vitality
  recovery_dynamics:
    description: "Vitality recovery and depletion"
    step_unit: day
    condition: true
    dynamics:
      vitality: "vitality + (rest_hours * 5 + water_intake * 0.01 - viral_load * 0.1) * step"
    priority: 3

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-25"
  output_variables: [viral_load, body_temperature, vitality]

optimization:
  method: nsga2
  objectives:
    - variable: vitality
      metric: final
      direction: maximize
    - variable: viral_load
      metric: final
      direction: minimize
  constraints:
    - variable: body_temperature
      condition: "<= 38.5"
      type: hard
      description: "Body temperature should not exceed 38.5°C (avoiding a high-fever crisis)"
  startpoint:
    regimens:
      - variable: rest_hours
        time_start: "22:00"
        time_end: "22:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Daily rest (0=no rest, 1=full rest)"
        optimize:
          value: [0, 1]
      - variable: medicine_intake
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Daily medication (0=none, 1=full dose)"
        optimize:
          value: [0, 1]
      - variable: water_intake
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Daily water intake (0=insufficient, 1=sufficient)"
        optimize:
          value: [0, 1]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
