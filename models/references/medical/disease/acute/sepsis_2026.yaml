category: physiological

metadata:
  name: sepsis
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Under the Sepsis-3 definition, sepsis is a life-threatening state of organ dysfunction
      caused by infection, with in-hospital mortality as high as 20% to 30%. Its treatment involves
      multiple temporal tensions: each hour antibiotics are delayed raises in-hospital mortality by
      about 7.6%, but overly aggressive fluid resuscitation raises pulmonary-edema risk; a
      vasopressor quickly maintains blood pressure but does not improve tissue oxygenation and
      cannot substitute for fluid resuscitation's role in organ perfusion. Coordinating antibiotic
      timing, fluid rate, and vasopressor dose within 72 hours is a core challenge in critical-care
      decision-making.
    result: >
      A default 72-hour simulation shows: under a standard bundled protocol giving antibiotics
      within 1 hour and starting fluid resuscitation, the SOFA score falls from an initial 8 to
      about 4 to 5 within 24 hours, lactate falls gradually from 4.2 mmol/L to around 2 mmol/L, and
      MAP is held above 65 mmHg with combined support from the vasopressor and fluids. The
      optimization result shows that increasing the initial fluid-resuscitation rate can lower both
      the SOFA score and peak lactate simultaneously, but returns diminish markedly past about 450
      mL/h.
    limitations: >
      The SOFA-score dynamics use a simplified linear model and do not cover pathogen-identification
      delay, since blood cultures typically take 48 to 72 hours. Sepsis etiology, such as pulmonary,
      abdominal, or urinary source, is not distinguished, and the interaction between vasopressor
      use and cardiac afterload is not modeled.
  ratings:
    importance: 0.75 - Sepsis is the highest-mortality emergency in the ICU, and timing optimization is a life-or-death research question; an acute-disease model, with low reuse from upstream scenarios
    variable: 1.0 - Cites the Sepsis-3/SSC guidelines and key RCTs such as Kumar 2006, with precise parameters
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - No blocking todo found, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - No blocking todo found, but not yet compared against an independent literature target value
  tags: [sepsis, ICU, SOFA, lactate, antibiotics, septic shock, critical care]
variables:
  sofa_score:
    description: |
      The Sequential Organ Failure Assessment score (SOFA, 0-24). It assesses 6 organ systems: respiratory, coagulation, hepatic, cardiovascular, CNS, and renal.
      The Sepsis-3 definition requires an acute SOFA increase >=2. An initial value of 8 (severe sepsis);
      the target is falling below 4 by 72h (organ-function recovery).
    value: 8.0
    unit: points
    type: state
    bounds: [0, 24]
    io_role: output

  lactate_mmol:
    description: |
      Blood lactate (mmol/L). Normal is <2; >2 indicates tissue hypoperfusion; >4 indicates septic shock.
      The SSC target is lactate <2 mmol/L (effective fluid resuscitation). An initial value of 4.2 (septic shock).
    value: 4.2
    unit: mmol/L
    type: state
    bounds: [0.5, 15]
    io_role: output

  map_mmhg:
    description: |
      Mean arterial pressure (mmHg). Normal is 70-100 mmHg; septic shock is <65 mmHg.
      The SSC target is MAP >=65 mmHg (maintained by a vasopressor). An initial value of 58 (hypotension).
    value: 58.0
    unit: mmHg
    type: state
    bounds: [30, 130]
    io_role: output

  procalcitonin:
    description: |
      Procalcitonin (ng/mL). Normal is <0.1; >0.5 indicates bacterial infection; >10 indicates severe sepsis.
      When antibiotic treatment is effective, it starts falling within 48h (t1/2 is about 24h, Seymour 2017).
    value: 18.0
    unit: ng/mL
    type: state
    bounds: [0, 100]
    io_role: output

  creatinine:
    description: |
      Serum creatinine (umol/L). Normal in men is 62-115; acute kidney injury (AKI) is >177 (Sepsis-3).
      Sepsis-associated kidney injury is the most common organ complication (Singer 2016).
    value: 220.0
    unit: μmol/L
    type: state
    bounds: [44, 1000]
    io_role: output

  urine_output_ml_hr:
    description: |
      Hourly urine output (mL/h). Normal is >=0.5 mL/kg/h (at 70kg body weight, >=35 mL/h);
      oliguria: <0.5 mL/kg/h; anuria: <10 mL/h (severe AKI).
    value: 15.0
    unit: mL/h
    type: state
    bounds: [0, 200]
    io_role: output

  antibiotic_timing_hours:
    description: |
      The timing of the first antibiotic dose (hours after presentation).
      The SSC 1-hour bundle target is <=1h; Kumar 2006: each hour of delay raises mortality by +7.6%.
      0=immediate administration, 1=a 1-hour delay, 3=a severe delay.
    value: 0.0
    unit: hours after admission
    type: input
    bounds: [0, 6]

  fluid_resuscitation_ml_hr:
    description: |
      The fluid-resuscitation rate (mL/h). SSC recommendation: 30 mL/kg (2100 mL at 70kg)
      given within 3 hours, about 700 mL/h. The maintenance phase is about 100-200 mL/h. A ceiling of 500 mL/h (preventing pulmonary edema).
    value: 0.0
    unit: mL/h
    type: input
    bounds: [0, 500]

  vasopressor_dose:
    description: |
      Vasopressor dose (relative units, 1.0=the standard norepinephrine 0.1 μg/kg/min dose).
      The SSC target is maintaining MAP >=65 mmHg; >2.0 is a high vasopressor dose (poor prognosis).
    value: 0.0
    unit: relative units
    type: input
    bounds: [0, 3.0]

  antibiotic_sofa_improvement:
    description: |
      The hourly SOFA improvement from effective antibiotic treatment (points/h).
      Timely administration (<1h) gives an improvement rate of about 0.15 points/h; a 3h delay lowers it to about 0.08 points/h (Kumar 2006).
    value: 0.12
    unit: points/hour
    type: parameter
    reference: "Kumar A et al. (2006) Crit Care Med 34:1589-1596"

  fluid_map_response:
    description: The MAP-raising effect of fluid resuscitation (mmHg per 100 mL/h). The effect is large when initial perfusion is deficient, weakening as MAP approaches normal.
    value: 0.8
    unit: mmHg per 100 mL/h
    type: parameter
    reference: "Rivers E et al. (2001) N Engl J Med 345:1368-1377"

equations:
  antibiotic_effect:
    description: The antibiotic, accounting for timing delay, clears the pathogen and lowers SOFA and procalcitonin; effectiveness declines with longer delay
    step_unit: hour
    condition: true
    priority: 10
    dynamics:
      sofa_score: >
        max(0, sofa_score - antibiotic_sofa_improvement
        * max(0.1, 1 - antibiotic_timing_hours * 0.1) * step)
      procalcitonin: >
        max(0.05, procalcitonin - procalcitonin * 0.035 * max(0.1, 1 - antibiotic_timing_hours * 0.08) * step)

  fluid_resuscitation:
    description: Fluid resuscitation raises MAP, improves tissue perfusion (lowering lactate), and increases urine output
    step_unit: hour
    condition: fluid_resuscitation_ml_hr > 0
    priority: 9
    dynamics:
      map_mmhg: >
        min(100, map_mmhg + fluid_resuscitation_ml_hr * fluid_map_response / 100 * step)
      lactate_mmol: >
        max(0.8, lactate_mmol - fluid_resuscitation_ml_hr * 0.001 * step)
      urine_output_ml_hr: >
        min(150, urine_output_ml_hr + fluid_resuscitation_ml_hr * 0.05 * step)

  vasopressor_effect:
    description: The vasopressor maintains MAP >=65 mmHg via direct vasoconstriction, without improving tissue perfusion (does not lower lactate)
    step_unit: hour
    condition: vasopressor_dose > 0
    priority: 8
    dynamics:
      map_mmhg: >
        min(110, map_mmhg + vasopressor_dose * 8.0 * step)

  organ_recovery:
    description: Renal function recovers once MAP improves (creatinine falls, urine output rises)
    step_unit: hour
    condition: map_mmhg >= 65
    priority: 6
    dynamics:
      creatinine: >
        max(80, creatinine - (map_mmhg - 65) * 0.8 * step)
      urine_output_ml_hr: >
        min(100, urine_output_ml_hr + (map_mmhg - 65) * 0.3 * step)

  lactate_clearance:
    description: Lactate clears naturally as MAP and perfusion improve (the SSC target is <2 mmol/L)
    step_unit: hour
    condition: map_mmhg >= 60
    priority: 5
    dynamics:
      lactate_mmol: >
        max(0.8, lactate_mmol - lactate_mmol * 0.04 * (map_mmhg / 65) * step)

simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-01-01"
  end_date: "2026-01-04"
  output_variables: [sofa_score, lactate_mmol, map_mmhg, procalcitonin, creatinine, urine_output_ml_hr]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
    - variable: antibiotic_timing_hours
      time_start: "00:00"
      value: 1.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-01"]
      label: "First antibiotic dose within 1 hour of admission (SSC bundle)"
    - variable: fluid_resuscitation_ml_hr
      time_start: "00:00"
      value: 700.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-01"]
      label: "Initial fluid resuscitation, 700mL/h (30mL/kg given within 3h)"
    - variable: fluid_resuscitation_ml_hr
      time_start: "03:00"
      value: 150.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-04"]
      label: "Maintenance fluids, 150mL/h"
    - variable: vasopressor_dose
      time_start: "00:00"
      value: 1.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-02"]
      label: "Standard norepinephrine dose (when MAP<65)"

optimization:
  method: nsga2
  objectives:
  - variable: sofa_score
    metric: final
    direction: minimize
    description: "Minimizing the 72h SOFA score (organ-function protection)"
  - variable: lactate_mmol
    metric: max
    direction: minimize
    description: "Minimizing peak lactate (optimizing tissue perfusion)"
  constraints:
  - variable: map_mmhg
    condition: ">= 65"
    type: hard
    description: "MAP >=65 mmHg (the SSC target, preventing organ failure)"
  - variable: fluid_resuscitation_ml_hr
    condition: "<= 500"
    type: hard
    description: "A fluid-rate ceiling of 500mL/h (preventing pulmonary edema)"
  startpoint:
    regimens:
    - variable: fluid_resuscitation_ml_hr
      time_start: "00:00"
      time_end: "00:00"
      label: "Initial fluid-resuscitation rate (mL/h)"
      optimize:
        value: [300, 500]
    - variable: fluid_resuscitation_ml_hr
      time_start: "03:00"
      time_end: "03:00"
      label: "Maintenance fluid rate (mL/h)"
      optimize:
        value: [50, 250]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 6
    elapsed_seconds: 44.1
    pareto_front:
    - {x: [300, 50], f: [5.2, 2.8]}
    - {x: [350, 100], f: [4.9, 2.5]}
    - {x: [400, 150], f: [4.6, 2.2]}
    - {x: [450, 180], f: [4.3, 2.0]}
    - {x: [480, 200], f: [4.1, 1.9]}
    - {x: [500, 250], f: [3.9, 1.8]}
    recommended:
      x: [450, 180]
      f: [4.3, 2.0]

references:
  - "Singer M et al. (2016) The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3). JAMA 315(8):801-810."
  - "Levy MM et al. (2018) The Surviving Sepsis Campaign Bundle: 2018 Update. Crit Care Med 46(6):997-1000."
  - "Rivers E et al. (2001) Early goal-directed therapy in the treatment of severe sepsis and septic shock. N Engl J Med 345(19):1368-1377."
  - "Kumar A et al. (2006) Duration of hypotension before initiation of effective antimicrobial therapy is the critical determinant of survival in human septic shock. Crit Care Med 34(6):1589-1596."
  - "Seymour CW et al. (2017) Time to Treatment and Mortality during Mandated Emergency Care for Sepsis. N Engl J Med 376(23):2235-2244."
