metadata:
  name: inflammation
  updated: 2026-04-23
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      慢性低度炎症是2型糖尿病和肥胖症相互促进的关键中间机制：高血糖和脂肪组织过多均能激活炎症通路，
      而炎症反过来加重胰岛素抵抗，形成正反馈循环。
      在1型糖尿病中，自身免疫活性（autoimmune_activity）的持续激活导致β细胞的进行性破坏，
      与2型糖尿病的代谢性炎症机制在根本上不同，但两者均可通过运动和血糖控制获得部分改善。
      本模块将系统炎症水平与自身免疫活性作为独立状态变量，供上层综合模型调用。
    result: >
      本模块仅作为组件被上层糖尿病综合模型导入，仿真尚未独立运行。
      理论预期：持续高血糖或高肥胖指数时，炎症水平以0.001/分钟的速率缓慢累积；
      规律运动（强度高于1 MET）配合血糖控制（低于100 mg/dL）可使炎症以0.002/分钟的速率消退。
    limitations: >
      炎症动力学高度简化，时间步长为分钟级（随导入模块继承），与真实慢性炎症数周至数月的演变时间尺度不匹配。
      参数缺少文献来源标注，需结合具体疾病场景重新校准。
  conflicts: []
  ratings:
    topic_importance: 5 - 系统炎症是代谢病/糖尿病共同机制，作为组件有广泛复用价值
    framework_demand: 3 - 被2个上层模型import，代谢炎症共用组件
    evidence_quality: 2 - 模块为生成代码，变量描述简略，缺少文献标注
    popularity: 3 - 炎症组件在代谢建模中有一定地位但非独立经典模型
  tags:
  - inflammation
  - immune
  step_size:
    value: 1
    unit: minute
imports:
- references/medical/physiology/glucose_regulation_2026_mw
- references/medical/disease/metabolic/obesity_2026_noref
variables:
  inflammation_level:
    description: 系统炎症水平
    value: 1.0
    unit: 指数
    type: state
    bounds:
    - 0.5
    - 5.0
  autoimmune_activity:
    description: 自身免疫活性（针对1型糖尿病）
    value: 0
    unit: 指数
    type: state
    bounds:
    - 0
    - 1.0
formulas:
  inflammation_increase:
    description: 高血糖和肥胖增加炎症
    condition: blood_glucose > 150 or obesity_index > 0.5
    dynamics:
      inflammation_level: min(5.0, inflammation_level + 0.001 * step)
    priority: 3
  inflammation_decrease:
    description: 运动和血糖控制减少炎症
    condition: blood_glucose < 100 and exercise_intensity > 1
    dynamics:
      inflammation_level: max(0.5, inflammation_level - 0.002 * step)
    priority: 3
  autoimmune_activation:
    description: 1型糖尿病自身免疫激活
    condition: diabetes_type == 1 and autoimmune_activity < 1.0
    dynamics:
      autoimmune_activity: min(1.0, autoimmune_activity + 0.0005 * step)
    priority: 4
simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-08"
  output_variables:
  - inflammation_level
  - autoimmune_activity
