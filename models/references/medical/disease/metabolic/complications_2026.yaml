  name: complications
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      长期高血糖会通过多种生化机制损伤全身微血管和神经，导致四类主要慢性并发症逐渐累积进展：神经病变，表现为末梢感觉丧失；肾病变，表现为肾功能渐进下降；视网膜病变，表现为视力损伤；以及心血管风险升高。这四类并发症的进展阈值和速率各不相同：肾病变在血糖超过160 mg/dL时加速，而视网膜病变在140 mg/dL以上即开始进展，意味着单纯控制平均血糖并不足以全面预防所有并发症，不同靶点的控制策略之间存在优先级权衡。
    result: >
      本模块作为组件被上层糖尿病综合模型导入，仿真尚未独立运行。理论预期：高血糖持续时间越长、幅度越高，四类并发症的累积严重程度均越高；肾病变进展同时降低kidney_function变量，对其他依赖肾功能的代谢计算产生级联影响。
    limitations: >
      所有并发症进展均采用简化线性累积模型，未涵盖并发症之间的相互影响，例如肾病变加速心血管风险。参数描述简略，缺少文献来源标注，需在被具体场景调用时结合临床数据重新校准。
  conflicts: []
  ratings:
    validation_confidence: 1 - 从未跑通--sim/--opt(nosim/noopt标记)
    topic_importance: 5 - 糖尿病并发症（神经/肾/视网膜/心血管）是糖尿病管理核心模块
    framework_demand: 3 - 被1个上层模型import，糖尿病并发症核心组件
    evidence_quality: 2 - 模块为生成代码，参数描述简略，缺少文献标注
    popularity: 3 - 并发症进展组件在糖尿病建模中有复用价值但不独立使用
  tags:
  - complications
  - diabetes
imports:
- references/medical/physiology/glucose_regulation_2026_mw
- references/medical/disease/metabolic/inflammation_2026_mw
variables:
  neuropathy_severity:
    description: 神经病变严重程度
    value: 0
    unit: 指数
    type: state
    bounds:
    - 0
    - 100
  nephropathy_severity:
    description: 肾病变严重程度
    value: 0
    unit: 指数
    type: state
    bounds:
    - 0
    - 100
  retinopathy_severity:
    description: 视网膜病变严重程度
    value: 0
    unit: 指数
    type: state
    bounds:
    - 0
    - 100
  cardiovascular_risk:
    description: 心血管风险指数
    value: 0.1
    unit: 风险系数
    type: state
    bounds:
    - 0
    - 1.0
equations:
  neuropathy_progression:
    description: 高血糖导致神经病变进展
    step_unit: minute
    condition: blood_glucose > 150
    dynamics:
      neuropathy_severity: min(100, neuropathy_severity + (blood_glucose - 150) * 0.001 * step)
    priority: 7
  nephropathy_progression:
    description: 高血糖导致肾病变进展
    step_unit: minute
    condition: blood_glucose > 160
    dynamics:
      nephropathy_severity: min(100, nephropathy_severity + (blood_glucose - 160) * 0.0008 * step)
      kidney_function: max(0.1, kidney_function - 0.0001 * step)
    priority: 7
  retinopathy_progression:
    description: 高血糖导致视网膜病变进展
    step_unit: minute
    condition: blood_glucose > 140
    dynamics:
      retinopathy_severity: min(100, retinopathy_severity + (blood_glucose - 140) * 0.0005 * step)
    priority: 7
  cardiovascular_risk_increase:
    description: 高血糖和炎症增加心血管风险
    step_unit: minute
    condition: blood_glucose > 130 or inflammation_level > 2.0
    dynamics:
      cardiovascular_risk: min(1.0, cardiovascular_risk + 0.0002 * step)
    priority: 7
simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-04-01"
  output_variables:
  - neuropathy_severity
  - nephropathy_severity
  - retinopathy_severity
  - cardiovascular_risk
