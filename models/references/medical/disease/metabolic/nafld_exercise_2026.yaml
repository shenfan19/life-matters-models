  name: nafld_exercise
  lm_format_version: "1.0"
  updated: 2026-05-23
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Non-alcoholic fatty liver disease (NAFLD) is the world's most prevalent chronic liver
      disease, reaching the diagnostic threshold once liver fat exceeds 5%. Exercise is currently the
      best-evidenced non-pharmacological intervention, and among exercise types, high-intensity
      interval training (HIIT), above about 6 MET, mobilizes liver fat more effectively than
      moderate-intensity aerobic training at an equal exercise volume, but high-intensity exercise
      also acutely raises serum ALT, a marker of hepatocyte injury, creating a direct tradeoff
      between fat-reduction efficiency and liver safety. Accumulated exercise fatigue also limits
      subsequent training tolerance, making the sustainability of the optimal intensity an additional
      constraint.
    result: >
      A default 90-day simulation, with a protocol of one daily low-intensity walk at 3.5 MET,
      verified with --sim-only, shows: liver fat declines slowly from 15% to about 14.05% by day 90,
      ALT falls back from an initial 32 IU/L and converges near a 28 IU/L baseline, and the fatigue
      score rises to about 11.7 before reaching steady state. Solving --opt-only with main-training-
      day exercise intensity, a 6-9 MET range, as the decision variable for the liver-fat/ALT two-
      objective problem yields 50 solutions forming a non-degenerate front: as exercise intensity
      rises from about 6.24 MET to 7.73 MET, liver fat at day 90 falls from about 14.04% to 13.81%,
      while peak ALT rises from 31.4 IU/L to 39.9 IU/L, approaching but not crossing the 40 IU/L hard
      constraint, showing a clear monotonic reverse tradeoff between fat-reduction efficiency and
      liver safety, consistent with the modeling expectation.
    limitations: >
      The additional HIIT fat-reduction coefficient, the beta_hiit parameter, is an estimated value
      not yet refined from a randomized controlled trial comparing HIIT with moderate-intensity
      aerobic training. The model does not cover the effect of diet, body weight, or insulin
      resistance on liver fat, describing only the single intervention pathway of exercise.
  ratings:
    importance: 0.5 - NAFLD has high global prevalence, and the exercise-mechanism component has broad application value; already has clear paper dependencies (the A1/MASLD series), moderate use in a specific subfield
    variable: 0.5 - The ALT dynamics have a good source, the beta_hiit coefficient is an estimated value (TODO:SOURCE)
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.75 - Verified on 2026-09-04, the --sim-only liver-fat/ALT/fatigue trajectories match the expected direction and magnitude, not compared point-by-point against independent data
    optimization: 0.5 - Verified on 2026-09-04, 50 solutions form a non-degenerate front, with exercise intensity 6.24-7.73MET monotonically trading a genuine liver-fat decline against a rising ALT peak; but the two key coefficients beta_hiit and delta_alt remain TODO:SOURCE estimates, so the quantitative evidence chain is not closed
    confidence: 0.25 - Verified on 2026-09-04, both --sim and --opt run and match the expected direction, but not yet compared point-by-point against independent literature values
  tags: [nafld, fatty_liver, exercise, HIIT, ALT, hepatology]

variables:
  liver_fat_pct:
    description: "Liver fat content (MRI-PDFF, %). The NAFLD diagnostic threshold is >=5%, moderate-to-severe is >=10%."
    value: 15.0
    unit: "%"
    type: state
    bounds: [0, 60]
    reference: "Kleiner DE et al. (2005) Design and validation of a histological scoring system for NAFLD. Hepatology 41(6):1313-1321."

  alt_level:
    description: "Alanine aminotransferase (IU/L). Rises acutely after high-intensity exercise, then falls back naturally. The normal upper limit is 40 IU/L (male)."
    value: 32.0
    unit: IU/L
    type: state
    bounds: [0, 300]
    reference: "Prati D et al. (2002) Ann Intern Med 137(1):1-10."

  fatigue_score:
    description: "The exercise-fatigue score (0-100 AU). Training tolerance declines at high fatigue; recovers on a rest day following first-order dynamics."
    value: 0.0
    unit: AU
    type: state
    bounds: [0, 100]

  exercise_intensity:
    description: "The day's exercise intensity (MET). Above hiit_threshold triggers the additional HIIT fat-reduction effect and an acute ALT rise."
    value: 0.0
    unit: MET
    type: input
    bounds: [0, 12]

  alpha_fat:
    description: "The base exercise-driven liver-fat consumption coefficient. Keating 2012 meta-analysis: 150 MET-min/week x 12 weeks gives about a 3-4% liver-fat reduction, converting to about 0.003 %/(MET-day)."
    value: 0.003
    unit: "% per MET·day"
    type: parameter
    reference: "Keating SE et al. (2012) J Hepatol 57(1):157-166."

  beta_hiit:
    description: "The additional HIIT fat-reduction coefficient (a multiplier relative to MICT at an equal exercise volume). HIIT reduces about 30% more liver fat (an estimated value requiring refinement)."
    value: 0.35
    unit: dimensionless
    type: parameter
    reference: "TODO:SOURCE Keating 2012 or Promrat 2010 HIIT vs MICT subgroup analysis."

  delta_alt:
    description: "The acute ALT-rise coefficient from high-intensity exercise (>hiit_threshold MET)."
    value: 2.1
    unit: "IU/L per MET·day"
    type: parameter
    reference: "TODO:SOURCE Chalasani et al. (2012) Hepatology 55(6):2005-2023."

  epsilon_alt:
    description: "The natural ALT decay rate (first-order, 1/day). The half-life is about 4.6 days (ln2/0.15 is about 4.6d)."
    value: 0.15
    unit: 1/day
    type: parameter
    reference: "Prati D et al. (2002) Ann Intern Med 137(1):1-10."

  alt_baseline:
    description: "The physiological ALT baseline (mildly elevated in NAFLD patients, about 28 IU/L)."
    value: 28.0
    unit: IU/L
    type: parameter
    reference: "Mofrad P et al. (2003) Nonalcoholic fatty liver disease in nonobese patients. Hepatology 37(6):1286-1292."

  hiit_threshold:
    description: "The intensity threshold (MET) triggering the additional HIIT effect and the acute ALT response."
    value: 6.0
    unit: MET
    type: parameter
    reference: "EASL-EASD-EASO (2016) J Hepatol 64(6):1388-1402."

equations:
  fat_mobilization:
    description: "Liver-fat consumption: the base exercise effect plus additional HIIT fat reduction above threshold (the beta_hiit boost)."
    step_unit: day
    condition: exercise_intensity > 0
    priority: 5
    dynamics:
      liver_fat_pct: >
        max(0, liver_fat_pct - alpha_fat * exercise_intensity
        * (1 + beta_hiit if exercise_intensity > hiit_threshold else 1.0) * step)
    reference: "Keating SE et al. (2012) J Hepatol 57(1):157-166."

  alt_dynamics:
    description: "ALT first-order dynamics: an acute rise from high-intensity exercise minus natural decay toward baseline (a 4.6-day half-life)."
    step_unit: day
    condition: true
    priority: 4
    dynamics:
      alt_level: >
        max(0, alt_level + (delta_alt * max(0, exercise_intensity - hiit_threshold)
        - epsilon_alt * (alt_level - alt_baseline)) * step)
    reference: "Prati D et al. (2002) Ann Intern Med 137(1):1-10."

  fatigue_dynamics:
    description: "Exercise-fatigue first-order dynamics: training accumulation (0.5xMET/day) minus 15%/day natural recovery."
    step_unit: day
    condition: true
    priority: 3
    dynamics:
      fatigue_score: >
        max(0, min(100, fatigue_score + (0.5 * exercise_intensity - 0.15 * fatigue_score) * step))

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-04-01"
  output_variables: [liver_fat_pct, alt_level, fatigue_score, exercise_intensity]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: exercise_intensity
        time_start: "07:00"
        value: 3.5
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-04-01"]
        label: "Low-intensity walking (3.5 MET, once daily)"

optimization:
  method: nsga2
  objectives:
    - variable: liver_fat_pct
      metric: final
      direction: minimize
      description: "Minimizing liver fat (%) at the end of 90 days"
    - variable: alt_level
      metric: max
      direction: minimize
      description: "Minimizing peak ALT (avoiding liver injury)"
  constraints:
    - variable: alt_level
      condition: "<= 40"
      type: hard
      description: "ALT should not exceed the normal upper limit (EASL 2016)"
  startpoint:
    regimens:
      - variable: exercise_intensity
        time_start: "07:00"
        time_end: "07:00"
        days: [Mon, Wed, Fri]
        label: "Main-training-day exercise intensity (MET)"
        optimize:
          value: [3.0, 9.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - "Keating SE et al. (2012) Exercise and nonalcoholic fatty liver disease. J Hepatol 57(1):157-166."
  - "Promrat K et al. (2010) Randomized controlled trial testing the effects of weight loss on NASH. Hepatology 51(1):121-129."
  - "EASL-EASD-EASO Clinical Practice Guidelines (2016) Management of non-alcoholic fatty liver disease. J Hepatol 64(6):1388-1402."
  - "Prati D et al. (2002) Updated definitions of healthy ranges for serum ALT in adults. Ann Intern Med 137(1):1-10."
  - "Chalasani N et al. (2012) The diagnosis and management of NAFLD. Hepatology 55(6):2005-2023."
