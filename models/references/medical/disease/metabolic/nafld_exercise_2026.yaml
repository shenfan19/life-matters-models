  name: nafld_exercise
  lm_format_version: "1.0"
  updated: 2026-05-23
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      非酒精性脂肪肝（NAFLD）是全球患病率最高的慢性肝病，肝脏脂肪堆积超过5%即达到诊断阈值。运动是目前证据最充分的非药物干预手段，其中高强度间歇训练（HIIT），即强度超过约6 MET，比同等运动量的中等强度有氧训练更有效地动员肝脏脂肪，但高强度运动同时会急性升高血清ALT，即肝细胞损伤标志物，两者之间存在减脂效率与肝安全性的直接权衡。运动疲劳的累积还会限制后续训练耐受性，使最优强度的可持续性成为额外约束。
    result: >
      默认90天仿真，方案为每天一次低强度步行3.5 MET，显示：肝脂从15%缓慢下降，ALT维持在28 IU/L基线附近，疲劳评分处于低水平。仿真尚未运行高强度训练对比场景，理论预期为增加运动强度至HIIT阈值以上可加速肝脂下降，但同时ALT会出现急性升高并以约4.6天半衰期回落，每次高强度训练后的ALT峰值不应超过正常上限40 IU/L。
    limitations: >
      HIIT额外减脂系数，即beta_hiit参数，为估算值，尚未从HIIT与中等强度有氧对比的随机对照试验中精化。模型未涵盖饮食、体重和胰岛素抵抗对肝脂的影响，仅描述运动的单一干预通路。
  ratings:
    importance: 0.5 - NAFLD 全球患病率高，运动机制组件有广泛应用价值；已有明确papers依赖（A1/MASLD系列），特定子领域中等使用
    variable: 0.5 - ALT 动力学来源良好，beta_hiit 系数为估算值（TODO:SOURCE）
    equation: 0.5 - 自建方程锚定文献机制方向，非独立复现的标准形式
    simulation: 0.25 - 从未跑通--sim/--opt(nosim/noopt标记)
    optimization: 0.5 - 决策变量搜索前沿方向合理，未独立验证是否退化
    confidence: 0.0 - 从未跑通--sim/--opt(nosim/noopt标记)
  tags: [nafld, fatty_liver, exercise, HIIT, ALT, hepatology]

variables:
  liver_fat_pct:
    description: "肝脏脂肪含量（MRI-PDFF，%）。NAFLD 诊断阈值 ≥5%，中重度 ≥10%。"
    value: 15.0
    unit: "%"
    type: state
    bounds: [0, 60]
    reference: "Kleiner DE et al. (2005) Design and validation of a histological scoring system for NAFLD. Hepatology 41(6):1313-1321."

  alt_level:
    description: "丙氨酸氨基转移酶（IU/L）。高强度运动后急性升高，自然回落。正常上限 40 IU/L（男）。"
    value: 32.0
    unit: IU/L
    type: state
    bounds: [0, 300]
    reference: "Prati D et al. (2002) Ann Intern Med 137(1):1-10."

  fatigue_score:
    description: "运动疲劳评分（0-100 AU）。高疲劳时训练耐受性下降；休息日按一阶动力学恢复。"
    value: 0.0
    unit: AU
    type: state
    bounds: [0, 100]

  exercise_intensity:
    description: "当日运动强度（MET）。>hiit_threshold 触发 HIIT 额外减脂效应和 ALT 急性升高。"
    value: 0.0
    unit: MET
    type: input
    bounds: [0, 12]

  alpha_fat:
    description: "运动对肝脂的基础消耗系数。Keating 2012 Meta：150 MET·min/周×12周 ↓约3-4% 肝脂，换算约 0.003 %/(MET·day)。"
    value: 0.003
    unit: "% per MET·day"
    type: parameter
    reference: "Keating SE et al. (2012) J Hepatol 57(1):157-166."

  beta_hiit:
    description: "HIIT 额外减脂系数（相对于 MICT 同等运动量的倍增因子）。HIIT 约多减 30% 肝脂（估算值，需精化）。"
    value: 0.35
    unit: dimensionless
    type: parameter
    reference: "TODO:SOURCE Keating 2012 or Promrat 2010 HIIT vs MICT subgroup analysis."

  delta_alt:
    description: "高强度运动（>hiit_threshold MET）对 ALT 的急性升高系数。"
    value: 2.1
    unit: "IU/L per MET·day"
    type: parameter
    reference: "TODO:SOURCE Chalasani et al. (2012) Hepatology 55(6):2005-2023."

  epsilon_alt:
    description: "ALT 自然回落速率（一阶，1/day）。半衰期约 4.6 天（ln2/0.15 ≈ 4.6d）。"
    value: 0.15
    unit: 1/day
    type: parameter
    reference: "Prati D et al. (2002) Ann Intern Med 137(1):1-10."

  alt_baseline:
    description: "ALT 生理基线（NAFLD 患者轻度升高约 28 IU/L）。"
    value: 28.0
    unit: IU/L
    type: parameter
    reference: "Mofrad P et al. (2003) Nonalcoholic fatty liver disease in nonobese patients. Hepatology 37(6):1286-1292."

  hiit_threshold:
    description: "触发 HIIT 额外效应和 ALT 急性反应的强度阈值（MET）。"
    value: 6.0
    unit: MET
    type: parameter
    reference: "EASL-EASD-EASO (2016) J Hepatol 64(6):1388-1402."

equations:
  fat_mobilization:
    description: "肝脂消耗：基础运动效应 + HIIT 超阈值额外减脂（beta_hiit 加成）。"
    step_unit: day
    condition: exercise_intensity > 0
    priority: 5
    dynamics:
      liver_fat_pct: >
        max(0, liver_fat_pct - alpha_fat * exercise_intensity
        * (1 + beta_hiit if exercise_intensity > hiit_threshold else 1.0) * step)
    reference: "Keating SE et al. (2012) J Hepatol 57(1):157-166."

  alt_dynamics:
    description: "ALT 一阶动力学：高强度运动急性升高 - 向基线的自然回落（半衰期 4.6 天）。"
    step_unit: day
    condition: true
    priority: 4
    dynamics:
      alt_level: >
        max(0, alt_level + (delta_alt * max(0, exercise_intensity - hiit_threshold)
        - epsilon_alt * (alt_level - alt_baseline)) * step)
    reference: "Prati D et al. (2002) Ann Intern Med 137(1):1-10."

  fatigue_dynamics:
    description: "运动疲劳一阶动力学：训练累积（0.5×MET/day）- 15%/day 自然恢复。"
    step_unit: day
    condition: true
    priority: 3
    dynamics:
      fatigue_score: >
        max(0, min(100, fatigue_score + (0.5 * exercise_intensity - 0.15 * fatigue_score) * step))

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-04-01"
  output_variables: [liver_fat_pct, alt_level, fatigue_score, exercise_intensity]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: exercise_intensity
        time_start: "07:00"
        value: 3.5
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-04-01"]
        label: "低强度步行（MET 3.5，每天一次）"

optimization:
  method: nsga2
  objectives:
    - variable: liver_fat_pct
      metric: final
      direction: minimize
      description: "最小化90天末肝脂肪（%）"
    - variable: alt_level
      metric: max
      direction: minimize
      description: "最小化ALT峰值（避免肝损伤）"
  constraints:
    - variable: alt_level
      condition: "<= 40"
      type: hard
      description: "ALT不超正常上限（EASL 2016）"
  startpoint:
    regimens:
      - variable: exercise_intensity
        time_start: "07:00"
        time_end: "07:00"
        days: [Mon, Wed, Fri]
        label: "主训练日运动强度（MET）"
        optimize:
          value: [3.0, 9.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - "Keating SE et al. (2012) Exercise and nonalcoholic fatty liver disease. J Hepatol 57(1):157-166."
  - "Promrat K et al. (2010) Randomized controlled trial testing the effects of weight loss on NASH. Hepatology 51(1):121-129."
  - "EASL-EASD-EASO Clinical Practice Guidelines (2016) Management of non-alcoholic fatty liver disease. J Hepatol 64(6):1388-1402."
  - "Prati D et al. (2002) Updated definitions of healthy ranges for serum ALT in adults. Ann Intern Med 137(1):1-10."
  - "Chalasani N et al. (2012) The diagnosis and management of NAFLD. Hepatology 55(6):2005-2023."
