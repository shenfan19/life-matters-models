metadata:
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  conflicts: []
  description:
    problem: >
      糖尿病的长期风险不仅由血糖水平决定，还与肥胖程度、胰岛素系统功能、体液调节以及多个生理系统的协同状态密切相关。
      本模块作为聚合枢纽，将营养摄入、消化系统、血糖调节、胰岛素系统、内分泌系统、能量平衡、并发症、炎症和肥胖等
      多个基础参考模型整合在一起，提供糖尿病风险指数和综合健康评分的综合计算。
      1型与2型糖尿病在自身免疫机制和胰岛素依赖性上有本质区别，本模块通过diabetes_type参数区分两者的行为逻辑。
    result: >
      本模块仅作为组件被上层综合场景导入，仿真尚未独立运行。
      理论预期：血糖持续偏高（超过120 mg/dL）或高胰岛素血症将推动肥胖指数上升，
      进而通过暴露累积机制加速糖尿病风险（diabetes_risk）的增长，体液异常（body_water偏低）将同步触发脱水保护机制。
    limitations: >
      本模块为多组件聚合的基础框架，各子模块的参数描述简略，缺少文献来源标注。
      变量和公式依赖多个导入模块的状态，独立运行时行为不完整，需结合完整的上层场景校准。
  name: diabetes_core
  lm_format_version: "1.0"
  ratings:
    topic_importance: 5 - 糖尿病核心组件，聚合多个生理系统，是代谢场景的枢纽模块
    framework_demand: 4 - 糖尿病核心枢纽，被依赖性强，多个上层场景依赖
    evidence_quality: 2 - 模块为生成代码，description简略，参数无文献标注
    popularity: 4 - 糖尿病综合组件在代谢建模框架中具有核心地位
  tags:
  - diabetes
  - core
  updated: 2026-04-23
  step_size:
    value: 1
    unit: minute
imports:
- references/medical/physiology/nutrition_intake_2026_mw
- references/medical/physiology/digestive_system_2026_mw
- references/medical/physiology/glucose_regulation_2026_mw
- references/medical/physiology/insulin_system_2026_mw
- references/medical/physiology/endocrine_system_2026_mw
- references/medical/physiology/energy_balance_2026_mw
- references/medical/disease/metabolic/complications_2026_mw
- references/medical/disease/metabolic/inflammation_2026_mw
- references/medical/disease/metabolic/obesity_2026_noref
- references/medical/physiology/physiology_2026_mw
variables:
  body_water:
    bounds:
    - 30000
    - 45000
    description: 体液总量
    type: state
    unit: 毫升
    value: 40000
  diabetes_risk:
    bounds:
    - 0.0
    - 1.0
    description: 糖尿病风险指数，0-1之间，1表示高风险
    type: state
    unit: 风险指数
    value: 0.01
  diabetes_type:
    bounds:
    - 0
    - 2
    description: 糖尿病类型 (0-无, 1-1型, 2-2型)
    type: parameter
    unit: 类型代码
    value: 0
formulas:
  critical_condition_high_risk:
    condition: diabetes_risk > 0.5
    description: 高糖尿病风险警报
    priority: 9
  dehydration_protection:
    condition: body_water < 35000
    description: 脱水时减少尿液产生
    dynamics:
      urine_production: urine_production * 0.5
    priority: 8
  health_score:
    condition: true
    description: 综合健康评分
    dynamics:
      health_score: max(0, min(100, 100 - max(0, abs(blood_glucose - 90) - 20) * 0.5 - hunger_level * 30 - max(0, 1 - digestive_efficiency) * 40 - max(0, 40000 - body_water) / 1000 * 10))
    priority: 1
simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-08"
  output_variables:
  - body_water
  - diabetes_risk
  - diabetes_type
