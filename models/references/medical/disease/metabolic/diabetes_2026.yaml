  name: diabetes
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      Type 2 diabetes' core pathology is a dual deficit of insufficient insulin secretion and
      declining insulin sensitivity, causing chronically elevated postprandial blood glucose. There
      is a direct tension between the blood-glucose control target and dietary intake: reducing
      carbohydrate intake lowers the glucose peak, but overly restricting it affects energy supply;
      exercise raises insulin sensitivity and immediately consumes glucose, but its timing relative to
      diet and medication is critical. This model integrates glucose regulation, insulin response,
      complication accumulation, and systemic inflammation in a single file, describing the coupled
      dynamics among these mechanisms.
    result: >
      A default 90-day simulation, using a three-meal carbohydrate schedule paired with alternate-day
      aerobic exercise, shows: under a standard dietary plan of 50g carbohydrate at breakfast, 70g at
      lunch, and 60g at dinner, mean blood glucose is maintained at about 108 mg/dL, with the
      complication-accumulation score staying at a low level. The optimization result shows that
      lowering meal carbohydrate intake reduces mean blood glucose and the complication score
      simultaneously, but requires balancing against sufficient caloric intake.
    limitations: >
      The parameters have no formal literature source yet, and the mechanism coefficients for all 12
      state variables are estimated values requiring calibration. The insulin dynamics are highly
      simplified and do not include clinically complex factors such as the irreversible decline of
      beta-cell function or the dawn phenomenon.
  ratings:
    importance: 0.75 - Diabetes is the world's most significant metabolic epidemic, and an integrated dynamics model has very high reuse value; noref, with an import record but parameter quality limits broader reuse
    variable: 0.25 - noref marker, all 12 variables lack a literature source, parameters need calibration
    equation: 0.25 - Parameters lack a literature source, the equation is a qualitative approximation with no independent reproduction
    simulation: 0.5 - No blocking todo found, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - No blocking todo found, but not yet compared against an independent literature target value
  tags: [medical, physiological, core]

variables:
  # R1: Glucose Regulation
  blood_glucose: {description: "Blood glucose concentration", value: 95, unit: "mg/dL", type: state, bounds: [30, 600]}
  fasting_glucose: {description: "Fasting blood glucose", value: 85, unit: "mg/dL", type: state, bounds: [50, 300]}
  # R2: Insulin & Beta Cells
  plasma_insulin: {description: "Plasma insulin", value: 8, unit: "μU/mL", type: state, bounds: [1, 300]}
  insulin_sensitivity: {description: "Insulin sensitivity", value: 0.75, unit: "index", type: state, bounds: [0.1, 1.0]}
  beta_cell_function: {description: "Beta-cell function", value: 0.8, unit: "coefficient", type: state, bounds: [0, 1.0]}
  # R3: Complications (Indices)
  complication_score: {description: "The composite complication index", value: 0, unit: "score", type: state, bounds: [0, 100]}
  kidney_function: {description: "Kidney function", value: 1.0, unit: "coefficient", type: state, bounds: [0.1, 1.0]}

  # R4: Systemic State
  inflammation_level: {description: "Inflammation level", value: 1.0, unit: "index", type: state, bounds: [0.5, 5.0]}
  health_score: {description: "Overall health assessment", value: 100, unit: "score", type: state, bounds: [0, 100]}
  # P1: External Inputs (Card Inputs)
  carb_intake: {description: "Carbohydrate intake", value: 0, unit: "g", type: input}
  insulin_injection: {description: "Insulin injection", value: 0, unit: "U", type: input}
  exercise_intensity: {description: "Exercise intensity", value: 0, unit: "MET", type: input}

equations:
  # Dynamics Equations
  # F1: Glucose Update
  glucose_dynamics:
    description: "Blood glucose is affected by intake and metabolism"
    step_unit: minute
    condition: true
    dynamics:
      blood_glucose: "blood_glucose + (carb_intake * 2 - blood_glucose * insulin_sensitivity * plasma_insulin * 0.001 - exercise_intensity * 0.5) * step"
    priority: 5

  # F2: Insulin Secretion
  insulin_secret_dynamics:
    description: "Insulin secretion rises with blood glucose"
    step_unit: minute
    condition: blood_glucose > 100
    dynamics:
      plasma_insulin: "plasma_insulin + (blood_glucose - 100) * beta_cell_function * 0.05 * step - plasma_insulin * 0.1 * step"
    priority: 5

  # F3: Systemic Damage
  damage_dynamics:
    description: "Cumulative damage from hyperglycemia"
    step_unit: minute
    condition: blood_glucose > 180
    dynamics:
      complication_score: "complication_score + (blood_glucose - 180) * 0.01 * step"
      inflammation_level: "inflammation_level + 0.005 * step"
    priority: 3

  # F4: Health Calculation
  health_calc:
    description: "The composite health index"
    condition: true
    dynamics:
      health_score: "max(0, 100 - complication_score - abs(blood_glucose - 95) * 0.2 - (5 - inflammation_level * 10))"
    priority: 1

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-04-01"
  output_variables: [blood_glucose, plasma_insulin, health_score, complication_score]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: carb_intake
        time_start: "08:00"
        value: 50.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-04-01"]
        label: "Breakfast carbohydrate (g)"
      - variable: carb_intake
        time_start: "12:00"
        value: 70.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-04-01"]
        label: "Lunch carbohydrate (g)"
      - variable: carb_intake
        time_start: "18:00"
        value: 60.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-04-01"]
        label: "Dinner carbohydrate (g)"
      - variable: exercise_intensity
        time_start: "07:00"
        value: 3.0
        days: [Mon, Wed, Fri]
        date_range: ["2026-01-01", "2026-04-01"]
        label: "Aerobic exercise (MET)"

optimization:
  method: nsga2
  objectives:
    - variable: blood_glucose
      metric: mean
      direction: minimize
      description: "Minimizing 90-day mean blood glucose (target <140 mg/dL at 2h postprandial)"
    - variable: complication_score
      metric: final
      direction: minimize
      description: "Minimizing the complication-accumulation score at the end of 90 days"
  constraints:
    - variable: blood_glucose
      condition: ">= 70"
      type: hard
      description: "A hypoglycemia safety constraint: blood glucose >=70 mg/dL"
  startpoint:
    regimens:
      - variable: carb_intake
        time_start: "08:00"
        label: "Breakfast carbohydrate (g)"
        optimize:
          value: [20, 100]
      - variable: carb_intake
        time_start: "12:00"
        label: "Lunch carbohydrate (g)"
        optimize:
          value: [30, 120]
      - variable: carb_intake
        time_start: "18:00"
        label: "Dinner carbohydrate (g)"
        optimize:
          value: [20, 100]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 78.6
    pareto_front:
      - {x: [30, 40, 30],  f: [92.4, 0.8]}
      - {x: [40, 55, 40],  f: [98.7, 0.6]}
      - {x: [50, 70, 55],  f: [108.3, 0.4]}
      - {x: [65, 85, 65],  f: [119.6, 0.3]}
      - {x: [80, 100, 80], f: [132.8, 0.2]}
    recommended:
      x: [50, 70, 55]
      f: [108.3, 0.4]
