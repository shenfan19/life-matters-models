  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  conflicts: []
  description:
    problem: >
      糖尿病的长期风险不仅由血糖水平决定，还与肥胖程度、胰岛素系统功能、体液调节以及多个生理系统的协同状态密切相关。本模块作为聚合枢纽，将营养摄入、消化系统、血糖调节、胰岛素系统、内分泌系统、能量平衡、并发症、炎症和肥胖等多个基础参考模型整合在一起，提供糖尿病风险指数和综合健康评分的综合计算。1型与2型糖尿病在自身免疫机制和胰岛素依赖性上有本质区别，本模块通过diabetes_type参数区分两者的行为逻辑。
    result: >
      本模块仅作为组件被上层综合场景导入，仿真尚未独立运行。理论预期：血糖持续偏高，即超过120 mg/dL，或高胰岛素血症将推动肥胖指数上升，进而通过暴露累积机制加速糖尿病风险的增长，即diabetes_risk变量上升，体液异常，即body_water偏低，将同步触发脱水保护机制。
    limitations: >
      本模块为多组件聚合的基础框架，各子模块的参数描述简略，缺少文献来源标注。变量和方程依赖多个导入模块的状态，独立运行时行为不完整，需结合完整的上层场景校准。
  name: diabetes_core
  lm_format_version: "1.0"
  ratings:
    importance: 0.75 - 糖尿病核心组件，聚合多个生理系统，是代谢场景的枢纽模块；糖尿病核心枢纽，被依赖性强，多个上层场景依赖
    variable: 0.25 - 模块为生成代码，description简略，参数无文献标注
    equation: 0.25 - 参数缺乏文献来源，方程为定性近似，未见独立复现
    simulation: 0.25 - 从未跑通--sim/--opt(nosim/noopt标记)
    optimization: 0.5 - 决策变量搜索前沿方向合理，未独立验证是否退化
    confidence: 0.0 - 从未跑通--sim/--opt(nosim/noopt标记)
