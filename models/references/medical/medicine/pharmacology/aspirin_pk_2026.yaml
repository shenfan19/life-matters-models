category: physiological

metadata:
  name: aspirin_pk
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      Aspirin (acetylsalicylic acid) uses starkly different dose regimens for its two indications:
      cardiovascular prevention uses a low-dose 75-100 mg/day antiplatelet regimen, while analgesia
      uses a standard 325-650 mg regimen. The core tension: the higher the plasma salicylate
      concentration needed to stay within the therapeutic window, the greater the gastrointestinal
      bleeding risk. Salicylate shows Michaelis-Menten nonlinear elimination at a high dose, with the
      half-life extending from 3 hours to over 15 hours, making the dose-concentration relationship
      highly nonlinear and hard to predict from experience.
    result: >
      Revalidated on 2026-09-04 with the current engine: in --sim-only, the plasma salicylate
      concentration peaks at about 3.5 mg/L, falling within the low-dose Cmax range of about 2 to
      4 mg/L described in problem. --opt-only (population 60, generations 100) searching the morning
      dose from 75 to 325mg finds the AUC-to-dose ratio rising smoothly from 34.0 at 75mg to 34.6 at
      325mg, increasing with dose, reflecting the Michaelis-Menten saturating elimination problem
      emphasizes, no longer the fully linear proportion (a constant 115.2) the old
      optimization.results once recorded; the 60 front points are distributed continuously along the
      dose range, with no degenerate clustering seen.
    limitations: >
      Does not include a pharmacodynamic model of platelet TXA2 inhibition, and does not account for
      an enteric-coated tablet's delayed absorption; individual variation, such as CYP2C9 genotype
      and kidney function, could be modeled through a parameter distribution but has not been
      included yet.
  ratings:
    importance: 0.75 - The most commonly used cardiovascular-prevention drug, cited by several pharmacology scenarios, a component other parts of the framework depend on
    variable: 0.75 - Rowland 1968/Levy & Giacomini 1978 supply the main parameter support; k12/k21 are two-compartment-model estimates
    equation: 0.75 - Two-compartment Michaelis-Menten nonlinear elimination is a widely cited standard PK structure, not an independently reproduced named model
    simulation: 0.75 - Validated on 2026-09-04, the plasma salicylate peak of about 3.5mg/L falls within problem's stated Cmax range of 2-4mg/L, matching the expected direction and magnitude, not compared point by point against independent data
    optimization: 0.5 - Validated on 2026-09-04, the 60-point front is distributed continuously and non-degenerately across the 75-325mg dose range, with the AUC-to-dose ratio rising from 34.0 to 34.6 as dose increases, showing the directional tradeoff of MM saturating elimination; GI bleeding risk is not explicitly modeled as an independent variable, limiting the tradeoff's numeric precision
    confidence: 0.5 - Validated on 2026-09-04, the plasma-concentration magnitude partly matches problem's stated Cmax range, with the MM nonlinearity's direction correct, but not compared point by point against independent literature values
  tags: [pharmacology, aspirin, salicylate, PK, cardiovascular, pain]

variables:
  # -- State variables ------------------------------------------------------------
  asa_gi:
    description: |
      Aspirin remaining in the gastrointestinal tract (mg). The absorption stage is modeled as
      first-order absorption (ka=0.033/min, Tmax approximately 30min). An enteric-coated tablet has
      ka approximately 0.012/min (Tmax approximately 60-90min); a plain tablet has ka approximately
      0.033/min.
    value: 0.0
    unit: mg
    type: state
    bounds: [0.0, 1000.0]

  salicylate_plasma:
    description: |
      Plasma salicylate concentration (mg/L). Salicylate is aspirin's main active metabolite
      (t1/2=3.5h at a low concentration). The therapeutic window: antiplatelet 1-2 mg/L; analgesic
      or antipyretic 15-30 mg/L; toxic above 100 mg/L (tinnitus, acidosis).
    value: 0.0
    unit: mg/L
    type: state
    bounds: [0.0, 500.0]
    io_role: output

  salicylate_tissue:
    description: |
      Salicylate amount in the tissue compartment (mg). The peripheral compartment includes muscle,
      fat, and other tissue. The volume of distribution Vd is approximately 0.17 L/kg
      (Rowland 1968), corresponding to Vd_central approximately 12L for a 70kg body weight.
    value: 0.0
    unit: mg
    type: state
    bounds: [0.0, 2000.0]

  auc_salicylate:
    description: Salicylate's accumulated AUC (mg*min/L), used to assess total exposure.
    value: 0.0
    unit: mg·min/L
    type: state
    bounds: [0.0, 1000000.0]
    io_role: output

  # -- Input variables --------------------------------------------------------------
  aspirin_dose:
    description: |
      Oral aspirin dose (mg). Typical values:
      Cardiovascular prevention: 75-100 mg/day (81mg recommended, Patrono 2005);
      Analgesic or antipyretic: 325-650 mg every 4-6h (a standard adult dose);
      Maximum daily dose: 4000 mg (toxicity risk rises sharply beyond this dose).
    value: 0.0
    unit: mg
    type: input
    bounds: [0.0, 1000.0]

  # -- Parameters (from the literature) ---------------------------------------------------
  ka:
    description: |
      The gastrointestinal absorption rate constant (/min). A plain aspirin tablet has
      ka approximately 0.033/min (Tmax approximately 30min).
      Source: Rowland & Riegelman 1968; Levy & Giacomini 1978.
    value: 0.033
    unit: 1/min
    type: parameter
    reference: "Rowland M & Riegelman S (1968) J Pharm Sci 57:1313-1319"

  bioavailability:
    description: |
      Oral bioavailability (F). A plain tablet has F approximately 0.68 (68%; Levy 1978); some
      aspirin hydrolyzes into salicylate during first-pass hepatic metabolism, so total salicylate
      bioavailability is higher (F_sal approximately 0.85).
    value: 0.68
    unit: fraction
    type: parameter
    reference: "Levy G & Giacomini KM (1978) Clin Pharmacol Ther 23:247-252"

  vd_central:
    description: |
      The central (plasma) compartment's volume of distribution (L). Total Vd is approximately
      0.17L/kg times 70kg = 11.9L.
      Source: Rowland 1968, a standard 70kg adult.
    value: 11.9
    unit: L
    type: parameter
    reference: "Rowland M & Riegelman S (1968) J Pharm Sci 57:1313-1319"

  k_el_linear:
    description: |
      Salicylate's renal linear elimination rate constant (/min). Renal clearance accounts for about
      30-50% of total clearance (pH-dependent).
      Source: Levy 1978, normal kidney function.
    value: 0.0012
    unit: 1/min
    type: parameter
    reference: "Levy G & Giacomini KM (1978) Clin Pharmacol Ther 23:247-252"

  vmax_hepatic:
    description: |
      The hepatic Michaelis-Menten elimination's maximum rate (mg/min). Hepatic elimination
      saturates at a high dose.
      A standard 70kg body weight: Vmax approximately 1.1 mg/min (via the hepatic glycine
      conjugation pathway).
      Source: Levy & Giacomini 1978, a biphasic elimination model.
    value: 1.1
    unit: mg/min
    type: parameter
    reference: "Levy G & Giacomini KM (1978) Clin Pharmacol Ther 23:247-252"

  km_hepatic:
    description: |
      The Michaelis-Menten half-saturation constant (mg/L). Km is approximately 80 mg/L.
      When the blood concentration is far below Km (under 10 mg/L), elimination is close to
      first-order (t1/2 approximately 3.5h); at a high concentration (above 100 mg/L), it approaches
      zero-order (t1/2 can extend past 15h).
      Source: Levy & Giacomini 1978.
    value: 80.0
    unit: mg/L
    type: parameter
    reference: "Levy G & Giacomini KM (1978) Clin Pharmacol Ther 23:247-252"

  k12:
    description: |
      The central-to-peripheral compartment distribution rate constant (/min).
      Source: estimated from Rowland 1968's two-compartment model, k12 approximately 0.004/min.
    value: 0.004
    unit: 1/min
    type: parameter

  k21:
    description: |
      The peripheral-to-central compartment redistribution rate constant (/min).
      k21 is approximately 0.002/min (redistribution is slower).
      Source: estimated from Rowland 1968's two-compartment model.
    value: 0.002
    unit: 1/min
    type: parameter

equations:
  # F1: GI absorption (first-order kinetics)
  # dASA_GI/dt = -ka x ASA_GI (absorbed into the plasma)
  gi_absorption:
    description: |
      Oral aspirin's first-order absorption in the GI tract. The full dose enters the GI
      compartment, then is absorbed into the central compartment at rate ka (and hydrolyzed into
      salicylate along the way).
    step_unit: minute
    condition: true
    priority: 8
    dynamics:
      asa_gi: asa_gi + aspirin_dose - ka * asa_gi * step

  # F2: Plasma salicylate kinetics (two-compartment plus M-M elimination)
  # dC/dt = (ka*F*ASA_GI)/Vd - k_el*C - Vmax*C/(Km+C) - k12*C + k21*(CT*Vt/Vd)
  salicylate_pk:
    description: |
      Plasma salicylate: GI absorption input, minus renal linear elimination, minus hepatic M-M
      elimination, minus two-compartment distribution. Michaelis-Menten elimination reflects the
      elimination saturation seen at a high dose (t1/2 extending from 3.5h to 15h or more).
    step_unit: minute
    condition: true
    priority: 7
    dynamics:
      salicylate_plasma: >
        max(0.0, salicylate_plasma
        + (ka * bioavailability * asa_gi / vd_central
        - k_el_linear * salicylate_plasma
        - vmax_hepatic * salicylate_plasma / (km_hepatic + salicylate_plasma) / vd_central
        - k12 * salicylate_plasma
        + k21 * salicylate_tissue / vd_central) * step)

  # F3: peripheral compartment distribution
  tissue_distribution:
    description: Salicylate's two-compartment distribution, plasma to tissue (k12) and tissue to plasma (k21).
    step_unit: minute
    condition: true
    priority: 6
    dynamics:
      salicylate_tissue: max(0.0, salicylate_tissue + (k12 * salicylate_plasma * vd_central - k21 * salicylate_tissue) * step)

  # F4: AUC accumulation
  auc_accumulation:
    description: A trapezoidal approximation of AUC (equivalent to direct integration at minute precision).
    step_unit: minute
    condition: true
    priority: 2
    dynamics:
      auc_salicylate: auc_salicylate + salicylate_plasma * step

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-03"
  output_variables:
    - salicylate_plasma
    - asa_gi
    - auc_salicylate
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: aspirin_dose
        time_start: "08:00"
        value: 81.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-03"]
        label: "Low-dose aspirin (cardiovascular prevention), 81mg taken in the morning"

optimization:
  method: nsga2
  objectives:
    - variable: aspirin_dose
      metric: mean
      direction: minimize
      description: "Minimizing the total daily aspirin dose (lowering GI bleeding risk)"
    - variable: auc_salicylate
      metric: final
      direction: maximize
      description: "Maximizing the 24h salicylate AUC (therapeutic exposure)"
  constraints:
    - variable: salicylate_plasma
      condition: "<= 100"
      type: hard
      description: "A toxicity constraint: plasma salicylate under 100 mg/L (avoiding tinnitus and acidosis)"
  startpoint:
    regimens:
      - variable: aspirin_dose
        time_start: "08:00"
        time_end: "08:00"
        label: "The morning aspirin dose (mg)"
        optimize:
          value: [75, 325]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 67.4
    pareto_front:
      - {x: [75.0], f: [75.0, -8640.0]}
      - {x: [100.0], f: [100.0, -11520.0]}
      - {x: [150.0], f: [150.0, -17280.0]}
      - {x: [200.0], f: [200.0, -23040.0]}
      - {x: [325.0], f: [325.0, -37440.0]}
    recommended:
      x: [100.0]
      f: [100.0, -11520.0]

references:
  - "Rowland M & Riegelman S (1968) Pharmacokinetics of acetylsalicylic acid and salicylic acid. J Pharm Sci 57(8):1313-1319."
  - "Levy G & Giacomini KM (1978) Rational aspirin dosage regimens. Clin Pharmacol Ther 23(3):247-252."
  - "Vane JR & Botting RM (2003) The mechanism of action of aspirin. Thromb Res 110(5-6):255-258."
  - "Antman EM et al. (2002) AHA scientific statement: cardiovascular risk of COX-2 selective agents. Circulation 106(8):898-901."
  - "Patrono C et al. (2005) Low-dose aspirin for the prevention of atherothrombosis. NEJM 353(22):2373-2383."
