category: physiological

metadata:
  name: statin_ldl_doseresponse
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      The relationship between a statin's dose and its LDL reduction is one of the most numerically
      stable, most consensus-agreed dose-response relationships in cardiovascular clinical
      medicine, the so-called "rule of 6": each time the dose doubles, LDL falls an additional
      roughly 6 percentage points, essentially independent of the specific statin or the starting
      dose. This relationship has very few degrees of freedom, just one slope coefficient and one
      starting anchor, and the literature figures themselves can be checked against independent
      RCTs, making it a clean demonstration of the evidence-type conversion mechanism.
    result: |
      Anchored on rosuvastatin 10mg corresponding to a 46% LDL reduction, a figure from an
      independent RCT measurement in the STELLAR trial (Jones et al. 2003), unrelated to the "rule
      of 6" slope given by Law, Wald, and Rudnicka's 2003 meta-analysis; extrapolating the predicted
      reduction at 20mg and 40mg using "an additional 6 percentage points per doubling" and
      comparing against the STELLAR trial's own independently reported 20mg and 40mg measured
      reductions: the 20mg prediction of 52% matches the measured 52% exactly, while the 40mg
      prediction of 58% deviates from the measured 55% by 3 percentage points, with the direction of
      this deviation consistent with the already-known literature limitation that the rule of 6
      shows diminishing marginal benefit at the higher dose end.
    limitations: |
      The "rule of 6" slope itself is noted in the original meta-analysis to carry a standard error
      of about 1 percentage point per doubling; 40mg is extrapolated across 2 doublings from the
      10mg anchor, and the accumulated uncertainty is of the same order as the observed 3
      percentage-point deviation, which does not indicate the model is wrong. ldl_baseline is set to
      190 mg/dL, an illustrative representative-patient value, not the mean of any specific trial's
      population.
  ratings:
    importance: 0.25 - A methodological validation demonstration, usable as a dose-response sub-model for a cardiovascular pharmacology case
    variable: 1.0 - Both the STELLAR trial (an independent RCT) and Law 2003's meta-analysis are high-quality, widely cited sources, directly traceable to the literature
    equation: 0.75 - The "rule of 6" is a widely cited empirical rule in the statin dose-response literature, not an independently reproduced standard differential-equation form
    simulation: 1.0 - The 20mg prediction of 52% matches STELLAR's measured 52% exactly, and the 40mg deviation of 3 percentage points matches the expected accumulated uncertainty, passing point-by-point validation
    optimization: 0.0 - This file is a static algebraic calculation containing no optimization and no decision variable
    confidence: 1.0 - Passes independent predictive testing, with the predicted value matching the STELLAR trial's independently measured data
  tags: [statin, ldl, evidence, dose-response, validation, literature-benchmark]

variables:
  statin_dose:
    description: Rosuvastatin's daily dose (mg), fixed per plan, dosed every day throughout
    value: 0.0
    unit: mg
    type: input

  reference_dose:
    description: "The anchor dose for the rule-of-6 extrapolation (an independent measurement in the STELLAR trial: 10mg gives a 46% reduction)"
    value: 10.0
    unit: mg
    type: parameter
    reference: "Jones PH et al. (2003) STELLAR Trial"

  reference_reduction_pct:
    description: "The LDL reduction corresponding to the anchor dose (10mg), an independently measured value from the STELLAR trial (%)"
    value: 46.0
    unit: "%"
    type: parameter
    reference: "Jones PH et al. (2003) STELLAR Trial"

  ldl_baseline:
    description: An illustrative representative patient's untreated LDL baseline (a common range in primary hyperlipidemia)
    value: 190.0
    unit: mg/dL
    type: parameter

  ldl_reduction_pct:
    description: The predicted LDL reduction percentage (computed from reference_reduction_pct plus the rule-of-6 extrapolation)
    value: 0.0
    unit: "%"
    type: state

  ldl_level:
    description: The predicted post-treatment LDL level
    value: 190.0
    unit: mg/dL
    type: state

  dose_doubling_effect:
    type: parameter
    evidence_type: beta
    value: 6.0
    unit: "percentage points per doubling"
    description: >
      The "rule of 6": each time a statin's dose doubles, LDL falls an additional roughly
      6 percentage points (a standard error of about 1 percentage point), essentially independent
      of the specific statin or the starting dose.
    reference: "Law MR, Wald NJ, Rudnicka AR (2003) BMJ 326:1423"

equations:
  reduction_calc:
    description: "ldl_reduction_pct = reference_reduction_pct + dose_doubling_effect * log2(statin_dose/reference_dose) (a static algebraic calculation, not integrated over time)"
    condition: true
    priority: 5
    dynamics:
      ldl_reduction_pct: "reference_reduction_pct + dose_doubling_effect * (log(statin_dose / reference_dose) / log(2.0))"
    reference: "Law MR, Wald NJ, Rudnicka AR (2003) BMJ 326:1423"

  ldl_calc:
    description: "ldl_level = ldl_baseline * (1 - ldl_reduction_pct/100) (a static algebraic calculation)"
    condition: true
    priority: 3
    dynamics:
      ldl_level: "ldl_baseline * (1.0 - ldl_reduction_pct / 100.0)"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-30"
  output_variables:
    - statin_dose
    - ldl_reduction_pct
    - ldl_level
  plans:
    - id: "dose_10mg"
      label: "Rosuvastatin 10mg/day (the STELLAR trial anchor dose)"
      regimens:
        - {variable: statin_dose, time_start: "00:00", time_end: "23:00", value: 10.0, delivery: level, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-01-30"], label: "A constant 10mg/day"}
    - id: "dose_20mg"
      label: "Rosuvastatin 20mg/day (1 doubling, compared against STELLAR's measured 52%)"
      regimens:
        - {variable: statin_dose, time_start: "00:00", time_end: "23:00", value: 20.0, delivery: level, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-01-30"], label: "A constant 20mg/day"}
    - id: "dose_40mg"
      label: "Rosuvastatin 40mg/day (2 doublings, compared against STELLAR's measured 55%)"
      regimens:
        - {variable: statin_dose, time_start: "00:00", time_end: "23:00", value: 40.0, delivery: level, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-01-30"], label: "A constant 40mg/day"}

references:
  - "Law MR, Wald NJ, Rudnicka AR (2003) Quantifying effect of statins on low density lipoprotein cholesterol, ischaemic heart disease, and stroke: systematic review and meta-analysis. BMJ 326:1423"
  - "Jones PH, Davidson MH, Stein EA, et al. (2003) Comparison of the efficacy and safety of rosuvastatin versus atorvastatin, simvastatin, and pravastatin across doses (STELLAR Trial). Am J Cardiol 92(2):152-160"
