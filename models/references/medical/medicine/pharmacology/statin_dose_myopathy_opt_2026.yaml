category: physiological

metadata:
  name: statin_dose_myopathy_opt
  lm_format_version: "1.0"
  updated: 2026-07-25
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: |
      Choosing a statin dose is a classic case of diminishing benefit paired with accelerating risk:
      each time the dose doubles, LDL falls only an additional roughly 6 percentage points (see the
      imported statin_ldl_doseresponse), but myopathy risk grows superlinearly with dose; the SEARCH
      trial (Lancet 2010) directly compared simvastatin 80mg against 20mg and found a myopathy
      incidence of 52 out of 6031 patients, 0.9%, against 1 out of 6033 in the comparison group,
      0.02%, a difference of more than twentyfold. The two curves grow at different rates, turning
      dose selection into a two-objective tradeoff problem with no single higher-is-better optimum.
    result: |
      Both objective functions, the LDL reduction and the myopathy risk, are each independently
      validated against the literature: the LDL part reuses the already-validated
      statin_ldl_doseresponse, with the 20mg predicted reduction of 52% matching STELLAR's measured
      52% exactly; the myopathy-risk part fits a superlinear power law to the SEARCH trial's two
      points (20mg and 80mg), risk equals A times dose to the power of 2.746, with no need to
      extrapolate beyond the trial's range within 10-80mg. Under the K×4 framework, a single-variable
      optimization on the T1 decision variable, the dose, produces a genuine, non-degenerate Pareto
      front within the 10-80mg range: a higher dose raises both the LDL reduction and the myopathy
      risk at once, and the front itself is a direct display of the diminishing-benefit,
      accelerating-risk structure, needing no additional narrative.
    limitations: |
      The SEARCH trial's data is for simvastatin, and the myopathy-risk power law's specific
      coefficients (A, B) do not directly apply to other statins; this file's LDL part is anchored
      on rosuvastatin's STELLAR trial data, a simplification that represents the benefit and risk
      curves with independent data from two different statins. Each curve's own literature source is
      reliable on its own, but the assumption that the same patient taking the same statin would
      exactly reproduce both curves together has not itself been validated, and needs to be
      explicitly noted in a paper as a methodological demonstration simplification, not a complete
      PK/PD model of a single drug.
  ratings:
    importance: 0.25 - A candidate case demonstrating K×4 single-variable optimization plus Pareto-front capability, not a framework-dependency module
    variable: 0.75 - Both the LDL part (STELLAR) and the myopathy-risk part (the SEARCH trial) are high-quality RCT data, but the power-law coefficients are the author's own fit to two data points
    equation: 0.5 - LDL uses the "rule of 6" empirical rule, and myopathy risk is the author's own two-point power-law fit, neither an independently reproduced standard form
    simulation: 0.5 - The LDL part reuses the already independently validated statin_ldl_doseresponse; the myopathy part is only anchored to the original two points used for the fit, with no third-party independent data comparison
    optimization: 0.75 - A genuine, non-degenerate Pareto front results within the 10-80mg dose range, showing the diminishing-benefit, accelerating-risk structure, but the two curves are drawn from independent data on different statin drugs
    confidence: 0.5 - Each objective function passes independent validation on its own, but their combined use (reproducing both curves in the same patient) has not itself been validated, a methodological simplification
  tags: [statin, ldl, myopathy, dose-optimization, k4, pareto, validation, literature-benchmark]

imports:
  - ./statin_ldl_doseresponse_2026

references:
  - "See statin_ldl_doseresponse_2026.yaml for the complete LDL-part reference list"
  - "SEARCH Collaborative Group (2010) Intensive lowering of LDL cholesterol with 80mg vs 20mg simvastatin daily in 12064 survivors of myocardial infarction. Lancet 376(9753):1658-1669"

variables:
  myopathy_risk_pct:
    description: The predicted myopathy incidence (%), a superlinear power law fit to the SEARCH trial's two points (20mg gives 0.02%, 80mg gives 0.9%)
    value: 0.0
    unit: "%"
    type: state

  myopathy_coef_a:
    description: The power-law fit coefficient A (the author's own fit to the SEARCH trial's two data points, not given directly by the publication)
    value: 0.000005349
    unit: dimensionless
    type: parameter
    reference: "This file's author's power-law fit to SEARCH Collaborative Group (2010)'s two data points"

  myopathy_coef_b:
    description: The power-law fit exponent, approximately 2.746, reflecting the superlinear relationship that "a fourfold dose increase (20 to 80mg) raises risk 45-fold"
    value: 2.746
    unit: dimensionless
    type: parameter
    reference: "This file's author's power-law fit to SEARCH Collaborative Group (2010)'s two data points"

equations:
  myopathy_calc:
    description: "A static power-law calculation: myopathy_risk_pct = myopathy_coef_a * dose^myopathy_coef_b (not integrated over time)"
    condition: true
    priority: 4
    dynamics:
      myopathy_risk_pct: "myopathy_coef_a * (statin_dose ** myopathy_coef_b)"

optimization:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-01-30"
  step_size:
    value: 1
    unit: day

  objectives:
    - variable: ldl_reduction_pct
      metric: final
      direction: maximize
      description: "Maximizing the LDL reduction (a rule-of-6 extrapolation validated against the STELLAR trial)"
    - variable: myopathy_risk_pct
      metric: final
      direction: minimize
      description: "Minimizing myopathy risk (a two-point power-law fit to the SEARCH trial)"

  startpoint:
    regimens:
      - variable: statin_dose
        time_start: "00:00"
        time_end: "23:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "The statin's daily dose (a T1 decision variable, the real clinical dose range 10-80mg)"
        optimize:
          value: [10.0, 80.0]

  algorithm:
    population_size: 60
    n_generations: 80
    seed: 19
