category: physiological

metadata:
  name: warfarin_pk
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      华法林是香豆素类抗凝药，消除半衰期 t½=40.0小时是药代动力学教科书和临床指南广泛引用的共识数字。本文件用归一化血药浓度验证 LM format 能否正确复现标准一阶消除曲线，浓度以峰值为1.0进行归一化，不依赖具体剂量、表观分布容积或生物利用度参数，只验证消除动力学本身。
    result: |
      单室一阶消除，t½=40.0小时：1个半衰期后应降至峰值50%，2个半衰期后25%，3个半衰期后12.5%，4个半衰期后6.25%。仿真结果见下方 output_variables，各检查点应与理论值偏差<0.5%。
    limitations: |
      归一化模型简化了吸收相，真实达峰通常需数十分钟到数小时；同时简化了个体差异，肝肾功能、年龄和药物相互作用均会影响实际半衰期。模型只验证消除相本身的一阶动力学结构，非完整 PK/PD 模型。
  ratings:
    importance: 0.25 - 药代动力学族案例之一，通用参考组件，尚未被具体论文import
    variable: 1.0 - 消除半衰期为药代动力学教科书级共识数字，文献可直接追溯
    equation: 1.0 - 单室一阶消除是被广泛引用且独立复现的标准药代动力学方程形式
    simulation: 1.0 - 归一化一阶消除曲线与理论值(50%/25%/12.5%/6.25%)逐位吻合，逐点验证通过
    optimization: 0.0 - 本文件不含optimization，纯消除动力学验证，不涉及决策变量
    confidence: 1.0 - 独立预测检验通过，仿真轨迹与解析理论值逐点吻合
  tags: [pharmacokinetics, warfarin, validation, literature-benchmark, pk-family]

variables:
  normalized_conc:
    description: 归一化血药浓度（峰值=1.0），一阶消除
    value: 1.0
    unit: dimensionless
    type: state
    bounds: [0, 1]

  elimination_ke:
    description: 消除速率常数 ke = ln2/t½，t½=40.0小时（文献共识值）
    value: 0.017329
    unit: 1/hour
    type: parameter
    reference: "Holford NH (1986) Clin Pharmacokinet 11(6):483-504"

equations:
  first_order_elimination:
    description: "单室一阶消除：dC/dt = -ke·C"
    step_unit: hour
    condition: true
    priority: 5
    dynamics:
      normalized_conc: "normalized_conc - elimination_ke * normalized_conc * step"

simulation:
  step_size:
    value: 80
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-11"
  output_variables:
    - normalized_conc
  plans:
    - id: "from_peak"
      label: "从峰值浓度(归一化=1.0)开始的消除追踪"
      regimens: []

references:
  - "Holford NH (1986) Clin Pharmacokinet 11(6):483-504"
