category: physiological

metadata:
  name: warfarin_pk
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      Warfarin is a coumarin-class anticoagulant whose elimination half-life, t1/2=40.0 hours, is a consensus figure widely cited in pharmacokinetics textbooks and clinical guidelines. This file uses a normalized plasma concentration to validate whether LM format can correctly reproduce the standard first-order elimination curve; the concentration is normalized to a peak of 1.0 and does not depend on a specific dose, apparent volume of distribution, or bioavailability parameter, validating only the elimination kinetics itself.
    result: |
      A single-compartment first-order elimination, t1/2=40.0 hours: the concentration should fall to 50% of peak after 1 half-life, 25% after 2, 12.5% after 3, and 6.25% after 4. See output_variables below for the simulation result; each checkpoint should deviate from the theoretical value by less than 0.5%.
    limitations: |
      The normalized model simplifies away the absorption phase, since a real peak typically takes tens of minutes to a few hours to reach; it also simplifies individual variation, since liver and kidney function, age, and drug interactions all affect the actual half-life. The model validates only the first-order kinetic structure of the elimination phase itself, not a complete PK/PD model.
  ratings:
    importance: 0.25 - One of a family of pharmacokinetics cases, a general reference component, not yet imported by a specific paper
    variable: 1.0 - The elimination half-life is a textbook-level consensus figure in pharmacokinetics, directly traceable to the literature
    equation: 1.0 - Single-compartment first-order elimination is a widely cited, independently reproduced standard pharmacokinetic equation form
    simulation: 1.0 - The normalized first-order elimination curve matches the theoretical values (50%/25%/12.5%/6.25%) exactly, passing point-by-point validation
    optimization: 0.0 - This file contains no optimization, a pure elimination-kinetics validation with no decision variable
    confidence: 1.0 - Passes independent predictive testing, with the simulation trajectory matching the analytical theoretical value point by point
  tags: [pharmacokinetics, warfarin, validation, literature-benchmark, pk-family]

variables:
  normalized_conc:
    description: Normalized plasma concentration (peak=1.0), first-order elimination
    value: 1.0
    unit: dimensionless
    type: state
    bounds: [0, 1]

  elimination_ke:
    description: Elimination rate constant ke = ln2/t1/2, with t1/2=40.0 hours (a literature consensus value)
    value: 0.017329
    unit: 1/hour
    type: parameter
    reference: "Holford NH (1986) Clin Pharmacokinet 11(6):483-504"

equations:
  first_order_elimination:
    description: "Single-compartment first-order elimination: dC/dt = -ke*C"
    step_unit: hour
    condition: true
    priority: 5
    dynamics:
      normalized_conc: "normalized_conc - elimination_ke * normalized_conc * step"

simulation:
  step_size:
    value: 80
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-11"
  output_variables:
    - normalized_conc
  plans:
    - id: "from_peak"
      label: "Tracking elimination starting from the peak concentration (normalized=1.0)"
      regimens: []

references:
  - "Holford NH (1986) Clin Pharmacokinet 11(6):483-504"
