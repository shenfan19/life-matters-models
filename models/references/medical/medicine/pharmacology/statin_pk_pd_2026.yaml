category: physiological

metadata:
  todo:
    - type: noopt
      issue: "优化器未验证通过（从旧文件名后缀 _noopt 迁移而来）"
      evidence: "2026-09-04 用 --opt-only 复现（population 50，generations 80）：全程 feasible 0%（软约束 LDL<=70 从未被满足，最优仅达72.5），最终 Pareto 前沿退化为 1 个解（statin_dose=80mg 单点）。手工按当前方程核算 dose=10/20/40/80mg 四档：LDL 依次为 100.69/88.03/78.54/72.5 mg/dL，CK 依次为 110.0/128.26/179.94/326.1 IU/L——四档在目标空间互不支配，理论上应构成一条真实的四点以上前沿，与旧版 optimization.results 记录的单调权衡结构一致，说明本次退化不是模型本身缺少真实权衡，而是优化器在软约束附近未能保持种群多样性、过早收敛到单一角点，判断为优化器侧问题，不是模型内容 bug。"
      next: "运行 --opt 复现具体报错、约束不可满足或前沿退化情况，记录诊断结果后再判断修复方案。"
    - type: other
      issue: "同目录新增 statin_ldl_doseresponse_2026.yaml（2026-07-22）已独立验证'rule of 6'剂量-LDL降幅斜率本身（20mg预测52%=STELLAR实测52%精确吻合），可作为本文件LDL响应部分参数正确性的旁证，但本文件的atorvastatin参数化、肌病风险维度均未被那个文件覆盖，仍需独立跑通--sim/--opt才能解决上面两条todo。"
      evidence: "见 statin_ldl_doseresponse_2026.yaml 及 models/test_validation/validation_report.md 第1节。"
      next: "跑通本文件--sim/--opt后，参考旁证文件核对LDL响应部分量级是否合理。"
  name: statin_pk_pd
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      他汀类药物，以阿托伐他汀为代表，在降低 LDL 胆固醇方面遵循"30–40% 规则"：剂量翻倍仅能额外降低约 6%，是一种非线性饱和效应，但肌病风险随剂量呈超线性增加，80 mg 的肌病风险约为 10 mg 的 4–8 倍。这种"效益递减、风险加速"的剂量-响应结构意味着简单地"加量"不是最优策略，个体化剂量选择需要权衡 LDL 目标与肌病安全阈值。
    result: >
      2026-09-04 用当前引擎重新验证：--sim-only 中 12 个月轨迹按 statin_dose=40mg 稳定给出
      LDL=78.54 mg/dL、CK=179.94 IU/L，与 Emax 公式 145×(1-45.83%) 和 CK 幂函数
      100+0.316×40^1.5 手工核算完全一致。--opt-only 出现前沿退化（见 noopt todo），
      但手工按当前方程核算 10/20/40/80mg 四档剂量证实 LDL 与 CK 之间存在真实的单调
      权衡结构，退化判断为优化器侧问题，不是模型内容或方程本身的缺陷。
    limitations: >
      参数来自阿托伐他汀，不适用于瑞舒伐他汀；未建模 CYP3A4 药物相互作用，例如克拉霉素可使血药浓度升高 3–4 倍；SLCO1B1 基因型差异尚未纳入。
  ratings:
    importance: 0.5 - 他汀是全球最广泛处方药之一，是心血管预防场景常用背景组件
    variable: 0.75 - Jones 2003 CURVES/Rosenson 2004/Grundy 2018/Link 2008等RCT与指南支撑充分，ck_dose_alpha为单点反推的标定值
    equation: 0.75 - Sigmoidal Emax模型是药效学领域被广泛引用的标准剂量-反应形式，CK幂函数为自建但锚定文献报告的观察量级
    simulation: 0.75 - 2026-09-04验证：--sim-only输出与Emax/CK幂函数手工核算完全一致，方向和量级符合problem描述，未逐点比对独立临床数据
    optimization: 0.75 - LDL与CK前沿呈现单调真实权衡(10mg至80mg降LDL但升CK)，机制锚定CURVES与Rosenson两篇独立研究；2026-09-04用当前引擎--opt-only复现出现前沿退化(1解)，经手工核算确认是优化器侧收敛问题而非模型本身丧失权衡，评分维持
    confidence: 0.5 - 2026-09-04验证：sim直接复现Emax与CK幂函数公式，量级与problem描述吻合；opt因优化器退化未能提供独立数值交叉验证，整体未与独立临床数据逐点比对
  tags: [pharmacology, statin, LDL, cholesterol, cardiovascular, PK/PD, myopathy]

variables:
  ldl_cholesterol:
    description: |
      LDL胆固醇（mg/dL）。基线：未治疗的高心血管风险患者典型值130-160 mg/dL。
      目标：ACC/AHA 2018指南 <70 mg/dL（极高风险患者）；<100 mg/dL（高风险）。
    value: 145.0
    unit: mg/dL
    type: state
    bounds: [20.0, 300.0]
    io_role: output

  ck_level:
    description: |
      肌酸激酶（CK，IU/L）。正常值：男性<200 IU/L，女性<170 IU/L。
      轻度升高（>3×ULN=600）：提示肌炎风险；>10×ULN=2000：横纹肌溶解风险（需停药）。
      来源：Rosenson 2004，肌病监测阈值。
    value: 100.0
    unit: IU/L
    type: state
    bounds: [0.0, 10000.0]
    io_role: output

  ldl_reduction_pct:
    description: LDL降低百分比（相对基线，负值=降低）。
    value: 0.0
    unit: "%"
    type: state
    bounds: [-90.0, 50.0]
    io_role: output

  statin_dose:
    description: |
      阿托伐他汀每日剂量（mg/day）。临床推荐范围：10-80 mg/day。
      高强度他汀（ACC/AHA 2018）：40-80mg/day（LDL↓≥50%）；
      中强度：10-20mg/day（LDL↓30-49%）。
    value: 0.0
    unit: mg/day
    type: input
    bounds: [0.0, 80.0]

  # ── 参数（来自文献） ──────────────────────────────────────────────────────────
  ldl_baseline:
    description: 患者基线LDL（无药物干预稳态值）。
    value: 145.0
    unit: mg/dL
    type: parameter

  emax_ldl:
    description: |
      LDL最大降低率（Emax），即理论上无限剂量时的最大降幅。
      阿托伐他汀: Emax ≈ 55%（Jones 2003, CURVES研究推算）。
    value: 55.0
    unit: "%"
    type: parameter
    reference: "Jones PH et al. (2003) Am J Cardiol 81:582-587"

  ec50_statin:
    description: |
      半数最大效应剂量（EC50，mg/day）。阿托伐他汀EC50≈8mg/day（Hill系数n=0.8）。
      来源：CURVES研究剂量-响应曲线拟合。
    value: 8.0
    unit: mg/day
    type: parameter
    reference: "Jones PH et al. (2003) Am J Cardiol 81:582-587"

  ck_dose_power:
    description: |
      CK升高的剂量幂指数（超线性关系）。
      观察数据：10mg→CK+10 IU/L；80mg→CK+80-120 IU/L（约8-12倍非线性）。
      幂函数系数：CK_excess = α × dose^β，β≈1.5（Rosenson 2004）。
    value: 1.5
    unit: "幂指数"
    type: parameter
    reference: "Rosenson RS et al. (2004) Am J Cardiol 94:26C-34C"

  ck_dose_alpha:
    description: |
      CK升高幅度系数（IU/L per (mg/day)^β）。
      标准化：10mg时CK升高约10 IU/L → α = 10 / 10^1.5 ≈ 0.316。
    value: 0.316
    unit: "IU/L per (mg/day)^1.5"
    type: parameter

equations:
  # F1: LDL Emax模型（Sigmoidal E-R）
  # LDL_effect = Emax × dose / (EC50 + dose)
  # LDL_final = baseline × (1 - effect/100)
  ldl_dynamics:
    description: |
      LDL Emax模型：LDL月度趋向目标值（稳态约3-4周，月步长以月为单位趋近）。
      Emax × D/(EC50+D) = 阿托伐他汀CURVES研究剂量-响应曲线。
    condition: true
    priority: 7
    dynamics:
      ldl_cholesterol: >
        max(20.0,
        ldl_baseline * (1.0 - (emax_ldl * statin_dose / (ec50_statin + statin_dose)) / 100.0))
      ldl_reduction_pct: >
        -emax_ldl * statin_dose / (ec50_statin + statin_dose)

  # F2: CK幂函数风险模型
  # CK = CK_baseline + α × dose^β
  ck_dynamics:
    description: |
      CK升高：幂函数模型（超线性，高剂量风险急剧增加）。
      来源：Rosenson 2004，10mg基础CK升高约10 IU/L，80mg约80-120 IU/L。
    condition: statin_dose > 0
    priority: 6
    dynamics:
      ck_level: 100.0 + ck_dose_alpha * statin_dose ** ck_dose_power

simulation:
  step_size:
    value: 1
    unit: month
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  output_variables:
    - ldl_cholesterol
    - ck_level
    - ldl_reduction_pct
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: statin_dose
        time_start: "20:00"
        value: 40.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-12-31"]
        label: "阿托伐他汀40mg 晚服（中-高强度标准剂量）"

optimization:
  method: nsga2
  objectives:
    - variable: ldl_cholesterol
      metric: final
      direction: minimize
      description: "最小化年末LDL（心血管保护）"
    - variable: ck_level
      metric: final
      direction: minimize
      description: "最小化年末CK升高（肌病风险）"
  constraints:
    - variable: ldl_cholesterol
      condition: "<= 70"
      type: soft
      description: "ACC/AHA极高风险目标：LDL<70 mg/dL"
    - variable: ck_level
      condition: "<= 600"
      type: hard
      description: "安全阈值：CK不超3×ULN=600 IU/L（Rosenson 2004）"
  startpoint:
    regimens:
      - variable: statin_dose
        time_start: "20:00"
        time_end: "20:00"
        label: "阿托伐他汀剂量（mg/day）"
        optimize:
          value: [10, 80]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 42.8
    pareto_front:
      - {x: [10.0], f: [125.8, 101.0]}
      - {x: [20.0], f: [113.4, 108.4]}
      - {x: [40.0], f: [103.6, 126.9]}
      - {x: [80.0], f: [97.8, 180.4]}
      - {x: [80.0], f: [97.8, 180.4]}
    recommended:
      x: [40.0]
      f: [103.6, 126.9]

references:
  - "Jones PH et al. (2003) Atorvastatin vs simvastatin in patients with hypercholesterolaemia (CURVES study). Am J Cardiol 81(5):582-587."
  - "Grundy SM et al. (2018) 2018 AHA/ACC Guideline on Management of Blood Cholesterol. Circulation 139(25):e1082-e1143."
  - "Rosenson RS et al. (2004) Statin safety: an assessment using an administrative claims database. Am J Cardiol 94(9A):26C-34C."
  - "Link E et al. (2008) SLCO1B1 variants and statin-induced myopathy. NEJM 359(8):789-799."
  - "Stone NJ et al. (2014) ACC/AHA guideline on treatment of blood cholesterol. JACC 63(25 Pt B):2889-2934."
