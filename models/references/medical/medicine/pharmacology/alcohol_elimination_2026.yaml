category: physiological

metadata:
  name: alcohol_elimination
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      Ethanol elimination follows zero-order kinetics: the elimination rate is constant and does not
      change with blood concentration, a methodological contrast with the first-order elimination of
      most drugs such as caffeine, where the rate is proportional to concentration. Hepatic alcohol
      dehydrogenase is already saturated at a moderate blood concentration, so the elimination rate
      no longer speeds up as concentration rises. Widmark's classic rate of about
      0.015-0.018 g/dL/hour is a standard figure in forensic toxicology and clinical teaching.
    result: |
      Starting from a blood concentration of 0.08 g/dL, a common legal-driving-limit reference
      point, decaying at the zero-order elimination rate of 0.015 g/dL/hour, it falls to 0.05 g/dL
      after 2 hours and 0.02 g/dL after 4 hours, with complete clearance needing about 5.33 hours;
      the simulation result matches the analytical calculation of a linear, not exponential, decay
      exactly.
    limitations: |
      0.015 g/dL/hour is a representative value for a healthy adult, with an individual range of
      0.009-0.035 g/dL/hour; sex, body weight, and drinking experience all affect hepatic alcohol
      dehydrogenase activity. The absorption phase is not modeled; a real blood concentration after
      drinking takes 30-90 minutes to peak, and this file starts its calculation from the peak
      moment, validating only the elimination phase.
  ratings:
    importance: 0.25 - A standard forensic-toxicology/clinical-teaching case, a general reference component
    variable: 1.0 - Widmark's zero-order elimination rate is a textbook-level consensus figure in toxicology, directly traceable to the literature
    equation: 1.0 - Widmark's zero-order elimination equation is a widely cited, independently reproduced standard form in forensic toxicology
    simulation: 1.0 - The zero-order linear-decay analytical solution matches the simulation result exactly, passing point-by-point validation
    optimization: 0.0 - This file contains no optimization, a pure elimination-kinetics validation with no decision variable
    confidence: 1.0 - Passes independent predictive testing, with the simulation trajectory matching the analytical theoretical value point by point, forming a methodological contrast with caffeine_pk_2026's first-order kinetics
  tags: [pharmacokinetics, alcohol, zero-order-kinetics, validation, literature-benchmark]

variables:
  blood_alcohol_conc:
    description: Blood alcohol concentration (g/dL), zero-order elimination (a constant rate, independent of concentration)
    value: 0.08
    unit: g/dL
    type: state
    bounds: [0, 0.5]

  elimination_rate:
    description: The zero-order elimination rate (Widmark's classic value, a representative healthy-adult figure, with an individual range of 0.009-0.035)
    value: 0.015
    unit: g/dL/hour
    type: parameter
    reference: "Widmark (1932); StatPearls (2023)"

equations:
  zero_order_elimination:
    description: "Zero-order elimination: blood concentration declines linearly at a constant rate, independent of concentration (unlike first-order elimination's exponential decay)"
    step_unit: hour
    condition: true
    priority: 5
    dynamics:
      blood_alcohol_conc: "max(0.0, blood_alcohol_conc - elimination_rate * step)"

simulation:
  step_size:
    value: 6
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables:
    - blood_alcohol_conc
  plans:
    - id: "peak_0.08"
      label: "Tracking elimination starting from a peak concentration of 0.08 g/dL"
      regimens: []

references:
  - "Widmark EMP (1932) Die theoretischen Grundlagen und die praktische Verwendbarkeit der gerichtlich-medizinischen Alkoholbestimmung. Urban & Schwarzenberg, Berlin."
  - "StatPearls: Physiology, Zero- and First-Order Kinetics. NCBI Bookshelf, 2023."
