category: physiological

metadata:
  name: alcohol_elimination
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      乙醇消除遵循零阶动力学：消除速率恒定，不随血药浓度变化，这与咖啡因等大多数药物的一阶消除形成方法论对比，一阶消除下速率正比于浓度。肝脏乙醇脱氢酶在中等血药浓度下即饱和，消除速率不再随浓度升高而加快。Widmark 提出的经典速率约0.015-0.018 g/dL/小时是法医毒理学和临床教学的标准数字。
    result: |
      以常见法定驾驶限值参照点0.08 g/dL为起始血药浓度，按零阶消除速率0.015 g/dL/小时衰减，2小时后降至0.05 g/dL，4小时后降至0.02 g/dL，完全清除需约5.33小时，仿真结果与线性衰减而非指数衰减的解析计算逐位吻合。
    limitations: |
      0.015 g/dL/小时是健康成年人代表值，个体差异范围0.009-0.035 g/dL/小时，性别、体重、饮酒经验等因素会影响肝脏乙醇脱氢酶活性；未建模吸收相，真实饮酒后血药浓度需30-90分钟达峰，本文件从峰值时刻开始计算，只验证消除相。
  ratings:
    importance: 0.25 - 法医毒理学/临床教学标准案例，通用参考组件
    variable: 1.0 - Widmark零阶消除速率是毒理学教科书级共识数字，文献可直接追溯
    equation: 1.0 - Widmark零阶消除方程是法医毒理学被广泛引用且独立复现的标准形式
    simulation: 1.0 - 零阶线性衰减解析解与仿真结果逐位吻合，逐点验证通过
    optimization: 0.0 - 本文件不含optimization，纯消除动力学验证，不涉及决策变量
    confidence: 1.0 - 独立预测检验通过，仿真轨迹与解析理论值逐点吻合，与caffeine_pk_2026一阶动力学形成方法论对照
  tags: [pharmacokinetics, alcohol, zero-order-kinetics, validation, literature-benchmark]

variables:
  blood_alcohol_conc:
    description: 血液酒精浓度（g/dL），零阶消除（速率恒定，与浓度无关）
    value: 0.08
    unit: g/dL
    type: state
    bounds: [0, 0.5]

  elimination_rate:
    description: 零阶消除速率（Widmark经典值，健康成年人代表值，个体范围0.009-0.035）
    value: 0.015
    unit: g/dL/hour
    type: parameter
    reference: "Widmark (1932); StatPearls (2023)"

equations:
  zero_order_elimination:
    description: "零阶消除：血药浓度线性下降，速率恒定，不随浓度变化（不同于一阶消除的指数衰减）"
    step_unit: hour
    condition: true
    priority: 5
    dynamics:
      blood_alcohol_conc: "max(0.0, blood_alcohol_conc - elimination_rate * step)"

simulation:
  step_size:
    value: 6
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables:
    - blood_alcohol_conc
  plans:
    - id: "peak_0.08"
      label: "从0.08 g/dL峰值血药浓度开始的消除追踪"
      regimens: []

references:
  - "Widmark EMP (1932) Die theoretischen Grundlagen und die praktische Verwendbarkeit der gerichtlich-medizinischen Alkoholbestimmung. Urban & Schwarzenberg, Berlin."
  - "StatPearls: Physiology, Zero- and First-Order Kinetics. NCBI Bookshelf, 2023."
