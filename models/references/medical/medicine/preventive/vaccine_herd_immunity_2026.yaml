category: physiological

metadata:
  todo:
    - type: noopt
      issue: "优化器未验证通过（从旧文件名后缀 _noopt 迁移而来）"
      evidence: "2026-09-04 用 --opt-only 复现：60个体×100代（6000次评估）全程feasible=0%，无一解满足硬约束peak infected<=0.05；输出opt.csv仅1行（daily_vaccination_rate=0.015, immune_fraction=0.473, cumulative_infections=0.349），且该解本身仍违反约束，不构成可用Pareto前沿。根因：初始状态infected=0.05已等于约束上限，R0=4/infectious_period=5的SIR动力学在day 1即把infected推高至约0.062，daily_vaccination_rate在声明的[0.001,0.015]区间内均无法在约束窗口内把峰值感染压回5%以下。这是约束阈值与初始条件在当前搜索区间下的结构性不可行，不是引擎报错。原文件中此前手写的5解Pareto前沿（daily_vaccination_rate 0.003-0.015对应immune_fraction/cumulative_infections的伪渐变数值）与本次复现结果不符，已确认为未经实际运行的占位数据，已删除。"
      next: "由建模者决定：调低初始infected、放宽约束阈值、缩短约束生效窗口（如仅在稳态而非全程施加），或扩大daily_vaccination_rate上界后重新验证可行性。"
  name: vaccine_herd_immunity
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      群体免疫阈值 p_c = 1 − 1/R₀ 是教科书方程，但它仅适用于完全有效疫苗和均匀混合人群。现实中，疫苗效力低于 100%，人群混合不均匀，例如存在超级传播者，且免疫会随时间衰退，使实际所需接种率远高于理论阈值。这个差距是公共卫生政策中真实存在的数量权衡。
    result: >
      --sim-only以每日0.5%人口接种率（持续半年）验证：感染率第2天升至峰值约7.6%后随接种和自然康复回落，年末immune_fraction因疫苗和自然免疫双重衰退降至约55.7%，cumulative_infections收敛于约37.3%。--opt-only以daily_vaccination_rate（[0.001, 0.015]区间）为决策变量求解immune_fraction/cumulative_infections双目标，60个体×100代全程0%可行：约束"峰值感染率不超过5%"与初始状态infected=0.05在R0=4的SIR动力学下结构性冲突，接种率上界0.015不足以在约束窗口内压制感染峰值，未产出可用Pareto前沿。
    limitations: >
      未包含年龄分层、超级传播者和变异株免疫逃逸机制；空间扩散需要网络模型扩展；参数基于通用类流感病原体，具体病原体须重新校准。
  ratings:
    importance: 0.75 - SIR群体免疫是公共卫生最核心模型，疫情防控基础理论；传染病专项模型，与其他场景交叉引用少
    variable: 0.75 - 引用Anderson & May教科书及Fine 2011等权威文献
    equation: 1.0 - SIR模型是流行病学被广泛引用且独立复现次数最多的标准方程形式之一
    simulation: 0.75 - 2026-09-04验证：--sim-only易感/感染/免疫轨迹方向和量级符合SIR预期，未逐点对比独立数据
    optimization: 0.0 - 2026-09-04验证：peak infected<=0.05约束与初始infected=0.05在R0=4下结构性不可行，6000次评估0%可行解，无可用前沿；原手写Pareto前沿数据已确认为占位数据并删除
    confidence: 0.25 - 2026-09-04验证：--sim跑通且方向符合SIR预期，但--opt因约束设计问题无法产出有效结果，整体未与独立文献数值比对
  tags: [epidemiology, vaccine, SIR, herd_immunity, preventive, public_health]

variables:
  # ── SIR仓室（人口比例）──────────────────────────────────────────────────────
  susceptible:
    description: |
      易感人口比例（S，0-1）。无免疫力且未接种者。
      初始：1 - I₀ - V₀ = 1 - 0.05 - 0.60 = 0.35。
    value: 0.35
    unit: "比例"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  infected:
    description: |
      现症感染人口比例（I，0-1）。
      峰值感染率 >5%（~3750万人，美国规模）会使ICU超负荷（Fine 2011）。
    value: 0.05
    unit: "比例"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  recovered:
    description: |
      康复（自然免疫）人口比例（R，0-1）。
      自然感染后免疫持续时间：流感约6-12个月；新冠约4-6个月（个体差异大）。
    value: 0.0
    unit: "比例"
    type: state
    bounds: [0.0, 1.0]

  vaccinated:
    description: |
      已接种且受保护的人口比例（V，0-1）。
      注意：接种者中只有 VE_inf 比例真正受到感染保护（其余人仍可能感染但症状轻）。
    value: 0.60
    unit: "比例"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  immune_fraction:
    description: |
      有效免疫人口比例（= vaccinated × VE_inf + recovered）。
      群体免疫阈值：immune_fraction ≥ 1 - 1/R₀（Anderson & May 1991）。
      R₀=4时阈值 = 75%；R₀=8（麻疹）时阈值 = 87.5%。
    value: 0.0
    unit: "比例"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  cumulative_infections:
    description: 累积感染人口比例（流行终止时的总攻击率）。
    value: 0.05
    unit: "比例"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  # ── 输入变量 ──────────────────────────────────────────────────────────────────
  daily_vaccination_rate:
    description: |
      每日接种事件量（每次触发接种的人口比例）。
      大规模接种运动：0.005-0.01/次（每天接种总人口的0.5-1%，每日触发）。
      COVID-19高峰接种率（美国2021年春季）：约0.006/次。
    value: 0.0
    unit: "比例"
    type: input
    bounds: [0.0, 0.02]

  # ── 参数（来自文献）──────────────────────────────────────────────────────────
  R0:
    description: |
      基本传染数（无任何免疫时一个病例平均传染人数）。
      流感（季节性）：1.2-1.4；COVID-19 Delta：4-6；麻疹：12-18；
      当前模型基于季节性流感变体（类似COVID-19 Omicron之前）：R₀=4。
      来源：Anderson & May 1991；Fine 2011。
    value: 4.0
    unit: "无量纲"
    type: parameter
    reference: "Anderson RM & May RM (1991) Infectious Diseases of Humans. Oxford University Press"

  infectious_period:
    description: |
      传染性持续时间（天）。
      流感：约4-5天；COVID-19原始株：约7-10天。当前模型：5天（1/gamma = 5）。
      来源：CDC influenza数据。
    value: 5.0
    unit: "天"
    type: parameter
    reference: "CDC (2023) Influenza Vaccination Coverage, United States, 2022-23"

  vaccine_efficacy_inf:
    description: |
      疫苗对感染的保护效力（VE_inf，0-1）。
      季节性流感疫苗：VE_inf ≈ 0.40-0.60（Plotkin 2010）；
      mRNA COVID-19疫苗初期：VE_inf ≈ 0.85（接种后3个月）；
      接种6个月后衰退至约0.45（Levin 2021）。
      当前模型：0.65（中等效力疫苗）。
    value: 0.65
    unit: "效力比例"
    type: parameter
    reference: "Plotkin SA (2010) Clin Vaccine Immunol 17:1055-1065"

  vaccine_efficacy_waning:
    description: |
      疫苗免疫衰退速率（/day）。
      mRNA疫苗：t½ ≈ 6个月 → k ≈ 0.00385/day（Levin 2021）。
      经典灭活疫苗：t½ ≈ 12个月。当前模型：0.003/day（约7-8个月半衰期）。
    value: 0.003
    unit: "1/day"
    type: parameter
    reference: "Levin EG et al. (2021) NEJM 385:e84"

  natural_immunity_waning:
    description: |
      自然感染后免疫衰退速率（/day）。
      流感：约6个月半衰期 → 0.0038/day。
      COVID-19：4-8个月不等，中位约6个月。
    value: 0.004
    unit: "1/day"
    type: parameter

equations:
  # F1: 感染动力学（SIR核心）
  # beta = R₀ / infectious_period（接触率）
  # 新感染率 = beta × S × I（质量作用定律）
  # 接种者感染率减少 VE_inf（仍有(1-VE_inf)比例会感染）
  infection_dynamics:
    description: |
      SIR感染：易感者和"突破感染"接种者新发感染。
      beta = R₀/d_inf = 4/5 = 0.8/day。
    step_unit: day
    condition: infected > 0 and susceptible > 0
    priority: 8
    dynamics:
      susceptible: max(0.0, susceptible - R0 / infectious_period * susceptible * infected * step)
      infected: >
        max(0.0, infected
        + (R0 / infectious_period * susceptible * infected
        + R0 / infectious_period * (1 - vaccine_efficacy_inf) * vaccinated * infected
        - infected / infectious_period) * step)
      cumulative_infections: cumulative_infections + R0 / infectious_period * susceptible * infected * step

  # F2: 康复与自然免疫
  recovery_dynamics:
    description: 感染者恢复，获得自然免疫（进入R仓室）。
    step_unit: day
    condition: infected > 0
    priority: 7
    dynamics:
      recovered: min(1.0, recovered + infected / infectious_period * step - natural_immunity_waning * recovered * step)

  # F3: 疫苗接种（每日新接种，从易感者和康复者中接种）
  vaccination_dynamics:
    description: |
      每日新接种：从易感者中按比例接种，免疫效力VE_inf。
      已感染者和已接种者不再接种（简化假设）。
    step_unit: day
    condition: daily_vaccination_rate > 0 and susceptible > 0
    priority: 6
    dynamics:
      susceptible: max(0.0, susceptible - daily_vaccination_rate * susceptible)
      vaccinated: min(1.0, vaccinated + daily_vaccination_rate * susceptible - vaccine_efficacy_waning * vaccinated * step)

  # F4: 有效免疫比例计算
  immune_fraction_calc:
    description: 综合免疫比例 = 接种有效保护 + 自然免疫（康复者）。
    condition: true
    priority: 3
    dynamics:
      immune_fraction: min(1.0, vaccinated * vaccine_efficacy_inf + recovered)

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  output_variables:
    - susceptible
    - infected
    - vaccinated
    - recovered
    - immune_fraction
    - cumulative_infections
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: daily_vaccination_rate
        time_start: "00:00"
        value: 0.005
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-06-30"]
        label: "接种运动（半年，每日0.5%人口）"

optimization:
  method: nsga2
  objectives:
    - variable: immune_fraction
      metric: final
      direction: maximize
      description: "最大化年末有效免疫比例（群体保护）"
    - variable: cumulative_infections
      metric: final
      direction: minimize
      description: "最小化全年累积感染率（疾病负担）"
  constraints:
    - variable: infected
      condition: "<= 0.05"
      type: hard
      description: "峰值感染率约束≤5%（医疗系统承受力）"
  startpoint:
    regimens:
      - variable: daily_vaccination_rate
        time_start: "00:00"
        time_end: "00:00"
        label: "每日接种率（比例）"
        optimize:
          value: [0.001, 0.015]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19

references:
  - "Anderson RM & May RM (1991) Infectious Diseases of Humans: Dynamics and Control. Oxford University Press."
  - "Fine P, Eames K, Heymann DL (2011) 'Herd immunity': a rough guide. Clin Infect Dis 52(7):911-916."
  - "Plotkin SA (2010) Correlates of protection induced by vaccination. Clin Vaccine Immunol 17(7):1055-1065."
  - "Levin EG et al. (2021) Waning immune humoral response to BNT162b2 mRNA vaccine. NEJM 385(24):e84."
  - "CDC (2023) Influenza Vaccination Coverage, United States, 2022-23 Flu Season."
