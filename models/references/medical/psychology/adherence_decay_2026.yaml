metadata:
  name: adherence_decay
  lm_format_version: "1.0"
  updated: 2026-06-09
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    brief: "Medication-adherence decay dynamics: the adherence rate declines naturally over time, modulated by regimen complexity, side-effect burden, and life stress, with a reminder intervention able to partially reverse it."
    need: >
      WHO estimates that about 50% of chronic-disease patients fail to sustain adherence to their
      prescribed regimen (WHO 2003). The great majority of LM format chronic-disease models assume
      full adherence, adherence=1.0, a structural flaw that systematically overestimates treatment
      effect. Adherence decay is a state variable that can be modeled, and introducing it allows
      comparing "the optimal regimen under real adherence conditions" against "the optimal regimen
      assuming full adherence," generating an intervention plan robust to dropout.
    problem: >
      Two core modeling challenges:
      First, adherence is not a binary 0/1 variable but a dynamic process that decays continuously
      over time, typically high in the first 1 to 4 weeks after prescription, about 0.85, then
      decaying exponentially to an average of about 0.50 at 6 months, with regimen complexity,
      side-effect experience, and life stress as three independent accelerating factors.
      Second, adherence's effect is nonlinear: partial adherence, the 0.5 to 0.8 range, affects
      treatment outcome far more than linear interpolation would predict, because most drugs have a
      minimum effective concentration threshold; this model uses a linear approximation as a
      conservative baseline, and modelers can adjust it after import based on the specific drug's
      properties.
    method: >
      A daily-step ODE, with the adherence rate, adherence_rate, as the main state variable, ranging
      from 0 to 1. Decay is modulated by a base rate and three factors, a regimen-complexity
      parameter, a side-effect-burden parameter, and a life-stress input, where life stress can be
      set by the host model. A reminder intervention, as an input variable, can partially reverse the
      decay, based on the Haynes 2008 Cochrane effect size. This file is designed to be referenced by
      other models via imports, not used standalone.
    simulation: >
      No built-in simulation configuration is included; this is a pure component model. An importing
      model sets life_stress and reminder_intervention in the host model's simulation.schedules,
      with a typical comparison of three arms: no intervention baseline, a weekly reminder, and a
      daily digital reminder.
    result: >
      A --sim-only run on 2026-09-04 reproduced the 12-month trajectories of the three arms
      (life_stress=0.4, regimen_complexity=0.4): the no-intervention baseline goes 0.786 at month 1,
      0.673 at month 3, 0.533 at month 6, 0.330 at month 12, with the 6-month value landing near the
      DiMatteo 2004 mean of 0.50 and the 12-month value somewhat below the earlier estimate of 0.40;
      a weekly SMS reminder (intensity 0.5) reaches 0.582 by month 6, +0.049 over baseline, below the
      Haynes 2008 estimated upper bound for the reminder effect of +0.12; a daily app reminder
      (intensity 1.0) converges to a steady state near 0.85 by about month 2 and holds it throughout,
      with a recovery effect markedly stronger than the weekly reminder.
    limitations: >
      A single adherence variable stands in for the specific behavior of which doses were skipped;
      the coupling between side effects and adherence is a linear approximation, whereas the real
      relationship is nonlinear; intentional non-adherence driven by belief is not distinguished from
      unintentional non-adherence driven by forgetting; the decay parameters carry high uncertainty
      for long-term behavior change beyond 2 years.
  integration_candidates:
    description: >
      The following papers/ models could consider importing this component to turn adherence from
      an implicit assumption into an explicit state variable, and re-run optimization under "real
      adherence conditions." After import, the key intervention effect size in the host model's
      equations should be multiplied by adherence_rate, or a nonlinear transform of it.
    models:
      - path: "papers/s1/ckd_protein_noref"
        reason: >
          The CKD low-protein diet regimen has a long duration, months to years, so the
          adherence-decay rate has a cumulative effect on the GFR-protection benefit. After import,
          regimen complexity, a simple K x 4 staged plan versus a complex personalized one, can be
          optimized for robustness to dropout.
  ratings:
    importance: 0.25 - Designed as an adherence component for import by multiple chronic-disease models, with no actual import record yet
    variable: 0.75 - Supported by multiple publications, WHO 2003/Osterberg 2005/DiMatteo 2004/the Haynes 2008 Cochrane review/Horne 1999/Vrijens 2012
    equation: 0.5 - A self-built decay equation, with base_decay_rate and reminder_recovery_strength each anchored to the effect sizes reported by DiMatteo and Haynes respectively
    simulation: 0.5 - Reverified on 2026-09-04, the three arms' trajectories agree in direction, the 6-month no-intervention value of 0.53 is close to the DiMatteo mean of 0.50, the 12-month value of 0.33 is somewhat below the earlier estimate of 0.40, and the weekly-reminder effect (+0.049) is weaker than the Haynes upper-bound estimate (+0.12), not compared point-by-point against independent data
    optimization: 0.0 - This file contains no optimization block, being a pure component model with no decision-variable search
    confidence: 0.25 - Reverified on 2026-09-04, runs normally, with the 6-month point close to the literature mean, but the 12-month value and the reminder-effect magnitude differ from the earlier estimate, not compared point-by-point against independent data
  tags: [adherence, non-adherence, medication_compliance, chronic_disease, behavioral_dynamics, reference_component]

variables:

  adherence_rate:
    type: state
    value: 0.85
    unit: AU
    bounds: [0, 1]
    io_role: output
    description: >
      The medication-adherence rate (0-1). About 0.85 early in a prescription (DiMatteo 2004's
      initial-adherence mean). Decays naturally over time, accelerated by three factors, regimen
      complexity, side-effect burden, and life stress; a reminder intervention can partially reverse
      it.
      In the host model, multiply the key intervention effect size by adherence_rate to get the
      actual effect under real adherence conditions.
    reference: "DiMatteo MR (2004) Medical Care 42(3):200."

  cumulative_nonadherence:
    type: state
    value: 0.0
    unit: day
    io_role: output
    description: >
      Cumulative non-adherence exposure (an integral of days times non-adherence magnitude, 0 if
      fully adherent throughout).
      Used for reporting and as a penalty-term input to the host model.
    reference: "Vrijens B et al. (2012) Br J Clin Pharmacol 73(5):691."

  life_stress:
    type: input
    value: 0.3
    unit: AU
    bounds: [0, 1]
    optimizable: false
    io_role: input
    description: >
      The life-stress index (0-1). Set by the host model (e.g. work_pressure from a burnout model,
      or night_feed_count as a proxy in a postpartum-recovery model).
      0=low stress, 0.5=moderate, 0.8=high stress (layoff, serious illness, bereavement, etc.).
      A high-stress environment is one of the strongest predictors of non-adherence (Horne & Weinman 1999).
    reference: "Horne R & Weinman J (1999) J Psychosom Res 47(6):555."

  reminder_intervention:
    type: input
    value: 0.0
    unit: AU
    bounds: [0, 1]
    optimizable: true
    io_role: input
    description: >
      Reminder-intervention intensity (0=no reminder, 0.5=a weekly SMS reminder, 1.0=a daily
      digital-health app reminder).
      Haynes 2008 Cochrane: a reminder intervention raises adherence by 6-21%, with the effect
      approximated as linear in intervention intensity.
      The K x 4 T3 optimization target: optimizing reminder frequency, daily, every other day, or
      weekly, to maximize the adherence rate.
    reference: "Haynes RB et al. (2008) Cochrane Database Syst Rev (2):CD000011."

  regimen_complexity:
    type: parameter
    value: 0.4
    unit: AU
    bounds: [0, 1]
    description: >
      Regimen complexity (0=very simple, a single drug once daily; 0.5=2-3 drugs at different
      times; 1.0=multiple drugs multiple times plus dietary restriction).
      Osterberg 2005: a regimen with >=3 drugs has about 26% lower adherence than a single-drug
      regimen; a combined CKD low-protein-diet-plus-exercise-plus-lifestyle regimen has a complexity
      of about 0.7.
    reference: "Osterberg L & Blaschke T (2005) N Engl J Med 353(5):487."

  side_effect_burden:
    type: parameter
    value: 0.2
    unit: AU
    bounds: [0, 1]
    description: >
      Side-effect burden (0=no noticeable side effects, 0.5=mild but tolerable, 1.0=severely
      affecting quality of life).
      Horne 1999: the side-effect experience is the second-leading cause of non-adherence (about 30%
      of patients discontinue because of it).
      The specific value is set by the host model based on the drug type (e.g. HCTZ's urinary
      frequency/hypokalemia is about 0.3-0.5).
    reference: "Horne R & Weinman J (1999) J Psychosom Res 47(6):555."

  base_decay_rate:
    type: parameter
    value: 0.0012
    unit: 1/day
    bounds: [0.0005, 0.003]
    description: >
      The base daily adherence-decay rate (the natural forgetting rate with no extra stress, a
      simple regimen, and no side effects).
      Calibration: DiMatteo 2004's 6-month average adherence of about 0.50, decaying from 0.85 to
      0.50, gives a pure exponential k of about ln(0.85/0.50)/180, about 0.003/day; with reminder
      compensation the base rate is lower, and 0.0012 is used here as a conservative value under
      some baseline adherence motivation.
    reference: "DiMatteo MR (2004) Medical Care 42(3):200."

  reminder_recovery_strength:
    type: parameter
    value: 0.015
    unit: 1/(AU·day)
    description: >
      The daily adherence-recovery coefficient per unit of reminder intensity.
      Haynes 2008: a weekly SMS reminder's effect is about +12% at 6 months, converting to
      0.00067/day; a daily app reminder is about +21%, converting to 0.0012/day. Here it is stated
      per unit intensity, scaling linearly.
    reference: "Haynes RB et al. (2008) Cochrane Database Syst Rev CD000011."

equations:

  adherence_decay_dynamics:
    step_unit: day
    priority: 0
    dynamics:
      adherence_rate: >
        max(0.05, min(1.0,
          adherence_rate
          - base_decay_rate
            * (1 + 1.5 * regimen_complexity + 1.2 * side_effect_burden + 0.8 * life_stress)
            * adherence_rate * step
          + reminder_recovery_strength * reminder_intervention
            * (1 - adherence_rate) * step))
    description: >
      Adherence decay, first-order, times a modulation factor, regimen complexity, side effects,
      life stress.
      The reminder intervention drives recovery in the (1-adherence_rate) space, easier to raise the
      lower it is.
      A floor of 0.05 (someone is always fully non-adherent, but the value does not reach zero, to
      avoid a numerical singularity).
    reference: "DiMatteo (2004); Haynes et al. (2008); Osterberg & Blaschke (2005)"

  nonadherence_accumulation:
    priority: 10
    dynamics:
      cumulative_nonadherence: "cumulative_nonadherence + (1.0 - adherence_rate) * step"
    description: "Cumulative non-adherence exposure: each day integrates the non-adherence magnitude (1-rate)."
    step_unit: day
    reference: "Vrijens B et al. (2012)"

# This model is designed as a pure component (references/) and is typically not run standalone.
# The simulation block below is only a minimal configuration for previewing the component's behavior in the GUI.
simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date:   "2026-12-31"
  output_variables:
    - adherence_rate
    - cumulative_nonadherence
    - life_stress
    - reminder_intervention
  plans:
    - id: "no_intervention"
      label: "No-intervention baseline (a moderately complex regimen, life stress 0.4)"
      regimens:
        - {variable: life_stress, time_start: "00:00", value: 0.4,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-01-01", "2026-12-31"], label: "Sustained moderate stress"}
        - {variable: reminder_intervention, time_start: "00:00", value: 0.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-01-01", "2026-12-31"], label: "No reminder"}

    - id: "weekly_reminder"
      label: "Weekly SMS reminder (intensity 0.5)"
      regimens:
        - {variable: life_stress, time_start: "00:00", value: 0.4,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-01-01", "2026-12-31"], label: "Sustained moderate stress"}
        - {variable: reminder_intervention, time_start: "09:00", value: 0.5,
           days: [Mon],
           date_range: ["2026-01-01", "2026-12-31"], label: "SMS every Monday"}

    - id: "daily_app_reminder"
      label: "Daily app reminder (intensity 1.0)"
      regimens:
        - {variable: life_stress, time_start: "00:00", value: 0.4,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-01-01", "2026-12-31"], label: "Sustained moderate stress"}
        - {variable: reminder_intervention, time_start: "08:00", value: 1.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-01-01", "2026-12-31"], label: "Daily app reminder"}

references:
  - "WHO (2003) Adherence to Long-Term Therapies: Evidence for Action. World Health Organization, Geneva."
  - "Osterberg L & Blaschke T (2005) Adherence to medication. N Engl J Med 353(5):487-497."
  - "DiMatteo MR (2004) Variations in patients' adherence to medical recommendations: a quantitative review of 50 years of research. Medical Care 42(3):200-209."
  - "Haynes RB et al. (2008) Interventions for enhancing medication adherence. Cochrane Database Syst Rev (2):CD000011."
  - "Horne R & Weinman J (1999) Patients' beliefs about prescribed medicines and their role in adherence. J Psychosom Res 47(6):555-567."
  - "Jimmy B & Jose J (2011) Patient medication adherence: measures in daily practice. Oman Med J 26(3):155-159."
  - "Vrijens B et al. (2012) A new taxonomy for describing and defining adherence to medications. Br J Clin Pharmacol 73(5):691-705."
