category: socio_economic

metadata:
  name: mindfulness_mood
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: |
      Mindfulness-based therapy for mood symptoms is one of the intervention effects in
      psychotherapy research that has been repeatedly meta-analyzed with a relatively stable,
      converging effect size. The effect size of mindfulness-based therapy relative to a control
      condition for improving mood or depressive symptoms, pre-post treatment comparison, from a
      comprehensive meta-analytic sample.
    result: |
      This case declares the effect size using the cohens_d subtype in the LM format's evidence
      block, with population_sd=1.0, meaning the output variable itself is in SD units, to verify
      that the loader correctly reads, converts, and displays this effect size, with the result
      matching the declared value exactly, d=0.59 SD.
    limitations: |
      This case demonstrates the correctness of effect-size encoding, not an independent prediction
      test, and the number 0.59 is itself the target being verified. Psychotherapy effect sizes
      commonly show cross-study heterogeneity, from factors such as publication bias and differing
      control conditions, and this file carries only one comprehensive meta-analytic point estimate,
      which does not represent this effect size as precisely stable across all contexts.
  ratings:
    importance: 0.25 - One case in the psychotherapy-effect-size family, a general-purpose reference component not yet imported by a specific paper
    variable: 0.75 - The effect size comes from a comprehensive meta-analytic sample, but psychotherapy effect sizes commonly show cross-study heterogeneity
    equation: 1.0 - The evidence_type conversion is a standard mechanism defined by the LM format specification, not a self-built structure
    simulation: 0.5 - The correctness of the effect-size encoding has been verified and demonstrated, but this is explicitly not an independent prediction test, a form of circular verification
    optimization: 0.0 - This file contains no optimization block, being a pure effect-size encoding demonstration with no decision variables
    confidence: 0.5 - The effect size comes from a comprehensive meta-analytic sample, but the cross-study heterogeneity of psychotherapy effect sizes is not captured in the encoding itself
  tags: [psychology, cohens-d, evidence, validation, literature-benchmark, cohend-family]

variables:
  effect_size_sd:
    description: The intervention effect size (in SD units)
    value: 0.0
    unit: SD
    type: state

  intervention_effect:
    type: parameter
    evidence_type: cohens_d
    value: 0.59
    population_sd: 1.0
    unit: SD
    description: The effect size of mindfulness-based therapy relative to a control condition for improving mood/depressive symptoms (pre-post treatment), from a comprehensive meta-analytic sample
    reference: "Hofmann SG et al. (2010) J Consult Clin Psychol; meta-analytic review of mindfulness-based therapy, Hedges g=0.59"

equations:
  display_effect:
    description: "A static demonstration: effect_size_sd = intervention_effect (for the cohens_d type: the effective value equals value times population_sd)"
    condition: true
    priority: 3
    dynamics:
      effect_size_sd: "intervention_effect"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables:
    - effect_size_sd
  plans:
    - id: "intervention_vs_control"
      label: "Intervention-versus-control effect-size demonstration"
      regimens: []

references:
  - "Hofmann SG et al. (2010) J Consult Clin Psychol; meta-analytic review of mindfulness-based therapy, Hedges g=0.59"
