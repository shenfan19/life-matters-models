category: physiological

metadata:
  todo:
    - type: noopt
      issue: "优化器未验证通过（从旧文件名后缀 _noopt 迁移而来）"
      evidence: "2026-09-04 用 --opt-only 复现：60个体×100代（6000次评估）全程feasible=0%，输出opt.csv仅1行（warfarin_dose≈5.36，cardiac_index=3.5恒定，anticoagulation_inr≈2.05）。原因有二，均已核实：(1) pulmonary_pressure<=35声明type:soft但未加metric，追查reference_engine源码确认optimizer_engine.py第80行`constraints = list(opt_block.get('constraints', []))`及optimizer_eval.py的`_eval_G`均未按type字段过滤，soft被当作hard强制执行；`_eval_G`对无metric的约束默认逐时间步校验，baseline初始值38 mmHg高于35，术后早期肺压尚未随左室后负荷改善而下降，从day1起持续违反，与warfarin_dose取值无关，全区间0%可行。(2) 即便约束问题修复，本优化本身也不构成真正的双目标权衡：optimization.startpoint.regimens只声明warfarin_dose一个决策变量，cardiac_index_recovery方程只依赖aortic_gradient和physical_therapy_intensity（后者固定为baseline plan值、不参与搜索），与warfarin_dose完全无耦合——本次复现6000次评估中cardiac_index恒定为3.5（decision variable无关），只有anticoagulation_inr随warfarin_dose变化，实质是单变量单目标（INR贴近2.5）问题，被包装成了双目标形式。"
      next: "engine层面：_eval_G需要区分type:hard/soft；model层面两处：pulmonary_pressure约束需补充metric（如仅在4-6周窗口生效），以及若要保留cardiac_index为优化目标，需要把physical_therapy_intensity也纳入决策变量，否则应移除该目标改为单目标INR优化。"
  name: valve_replacement
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      主动脉瓣狭窄在75岁以上人群患病率约3.4%，其 TAVR/SAVR 术后恢复包含两个时序不同的过程：主动脉跨瓣压差在术后 24–48 小时内立即改善，从≥40 mmHg降至<20 mmHg，而肺血管阻力下降和左室肥大消退需数周至数月适应性重塑。抗凝管理同步进行，生物瓣INR目标2.5并维持3个月，机械瓣需终身抗凝，华法林剂量调整与物理治疗强度进阶的协同时序需要量化支持。
    result: >
      PARTNER Trial（Leon 2010）：TAVR 后压差 24 h 内从 48 降至 18 mmHg；仿真预期 6 周末心脏指数从 1.8 恢复至 2.4–2.6 L/min/m²，肺动脉压从 38 降至 30 mmHg。
      --sim-only以文件内baseline plan（PT强度1→3，华法林5mg/day）验证：主动脉压差迅速降至人工瓣固有压差14 mmHg；心脏指数6周末升至声明上界3.5 L/min/m²，明显超过预期的2.4-2.6区间；肺动脉压降至约29.0 mmHg，略优于预期的30；INR收敛至约2.0（低于生物瓣目标2.5，因baseline华法林剂量未按目标滴定）；活动能力评分升至约4.85。心脏指数超出预期上限，提示cardiac_index_recovery方程系数可能偏强。--opt-only以华法林剂量为决策变量求解心脏指数/INR双目标，60个体×100代全程0%可行，且即便约束问题修复，cardiac_index本身也不随warfarin_dose变化（只依赖压差和固定不变的PT强度），并非真正的双目标权衡，详见noopt todo。
    limitations: >
      未包含瓣周漏（PVL）对有效瓣口面积的影响；INR 模型未考虑 CYP2C9/VKORC1 基因型差异；未建模 TAVR 特有并发症，例如传导阻滞约10%、30天卒中约2到3%。
  ratings:
    importance: 0.5 - 主动脉瓣置换（TAVR）是近年心外科最重要进展，血流动力学管理是核心；心外科专项模型，上层场景复用少
    variable: 0.75 - 引用PARTNER Trial及ACC/AHA/ESC多项权威指南，参数有据
    equation: 0.5 - 自建方程锚定文献机制方向，非独立复现的标准形式
    simulation: 0.5 - 2026-09-04验证：跑通且压差/肺压量级与PARTNER Trial预期接近，但心脏指数6周末触及声明上界3.5，明显超过预期的2.4-2.6区间，提示cardiac_index_recovery系数偏强
    optimization: 0.0 - 2026-09-04验证：pulmonary_pressure<=35约束缺metric+soft被engine当作hard强制导致全区间0%可行；且cardiac_index目标本身不随唯一决策变量warfarin_dose变化，并非真实双目标权衡，两个独立问题均详见noopt todo
    confidence: 0.25 - 2026-09-04验证：--sim方向基本符合PARTNER Trial但心脏指数幅度超出预期，--opt因约束缺陷与目标/决策变量脱耦均无法给出有效结果
  tags: [tavr, savr, valve_replacement, aortic_stenosis, cardiac_index, anticoagulation, warfarin]

variables:
  # ── 状态变量 ──────────────────────────────────────────────────────────────────
  aortic_gradient:
    description: |
      主动脉跨瓣平均压差（mmHg）。
      重度主动脉瓣狭窄标准：平均压差≥40 mmHg（ACC/AHA 2014）。
      TAVR/SAVR后即刻降至新瓣膜的有效压差：生物瓣通常8-20 mmHg（Leon 2010）。
      残余压差受人工瓣有效口面积（EOA）决定，TAVR生物瓣EOA≈1.5-2.0 cm²。
    value: 48.0
    unit: mmHg
    type: state
    bounds: [3.0, 80.0]
    io_role: output

  cardiac_index:
    description: |
      心脏指数（L/min/m²），体表面积校正的心输出量。
      正常值2.5-4.0 L/min/m²；<2.2为低心排（需干预）；<1.8为心源性休克。
      重度主动脉瓣狭窄术前典型值1.8-2.2 L/min/m²；TAVR后随压差降低逐步改善。
      来源：Leon et al. (2010) PARTNER Trial，基线及随访数据。
    value: 1.9
    unit: "L/min/m²"
    type: state
    bounds: [1.0, 5.0]
    io_role: output

  pulmonary_pressure:
    description: |
      肺动脉平均压（mmHg）。正常值8-20 mmHg；≥25为肺动脉高压。
      主动脉瓣狭窄继发肺高压（左心室后负荷增加→左室压力升高→肺静脉压升高）。
      TAVR后肺压随左心室压力降低逐步下降，时间常数约2-6周。
      来源：Vahanian et al. (2022) ESC指南，术后肺血管重塑数据。
    value: 38.0
    unit: mmHg
    type: state
    bounds: [10.0, 70.0]
    io_role: output

  anticoagulation_inr:
    description: |
      实际INR（国际标准化比率）。正常值0.8-1.2；治疗目标视瓣膜类型而定：
      生物瓣（TAVR/SAVR）：术后3个月华法林INR目标2.5（Nishimura 2014）；
      机械瓣：终身INR 2.0-3.0（主动脉位）或2.5-3.5（二尖瓣位）。
      INR<1.5：血栓风险增加；INR>3.5：出血风险显著增加。
    value: 1.1
    unit: INR
    type: state
    bounds: [0.5, 5.0]

  mobility_score:
    description: |
      术后活动能力评分（0-5）。
      0=ICU卧床；1=床边坐起；2=室内步行；3=走廊步行；4=楼梯；5=正常活动。
      TAVR患者（微创入路）通常比SAVR（开胸）恢复更快：TAVR在第2-3天可达到评分3，
      SAVR需要5-7天。来源：Mack et al. (2019) PARTNER 3 Trial。
    value: 0.5
    unit: score
    type: state
    bounds: [0.0, 5.0]

  # ── 输入变量 ──────────────────────────────────────────────────────────────────
  physical_therapy_intensity:
    description: |
      物理治疗强度（0-5，对应mobility_score量纲）。
      0=无；1=床边活动指导；2=辅助步行；3=独立步行训练；4=楼梯训练；5=出院后门诊康复。
      TAVR术后建议：第1天强度1，第2-3天强度2，第4-7天强度3，出院后继续门诊康复。
    value: 0.0
    unit: score
    type: input
    bounds: [0.0, 5.0]
    optimizable: true

  warfarin_dose:
    description: |
      华法林日剂量（mg）。典型起始剂量5 mg/day，根据INR监测调整。
      目标INR 2.5（生物瓣术后3个月）；超出2.0-3.0时需调整±1-2 mg/day。
      CYP2C9基因型、维生素K饮食、药物相互作用（胺碘酮等）显著影响有效剂量。
    value: 0.0
    unit: mg
    type: input
    bounds: [0.0, 15.0]
    optimizable: true

  # ── 参数 ──────────────────────────────────────────────────────────────────────
  prosthetic_gradient:
    description: |
      人工瓣膜固有压差（mmHg），由手术植入的瓣膜型号和尺寸决定。
      TAVR生物瓣（26mm）：有效压差约10-15 mmHg（Leon 2010）；
      SAVR生物瓣（23mm）：有效压差约12-18 mmHg；
      SAVR机械瓣：有效压差约6-12 mmHg（更低，但需终身抗凝）。
    value: 14.0
    unit: mmHg
    type: parameter
    reference: "Leon MB et al. (2010) NEJM 363:1597-1607."

  warfarin_inr_sensitivity:
    description: |
      每mg华法林对INR的日效应系数（INR单位/mg/day）。
      人群平均值约0.15-0.25 INR/mg（5mg华法林→INR约1.75-2.25）。
      个体间差异大（CYP2C9基因型可使敏感性差异3-5倍）。
      来源：Nishimura et al. (2014) ACC/AHA指南，INR管理建议。
    value: 0.20
    unit: INR/mg
    type: parameter
    reference: "Nishimura RA et al. (2014) JACC 63:e57-185."

equations:
  # F1: 主动脉压差恢复动力学
  # 手术当天（第1天）立即从重度狭窄压差降至人工瓣固有压差
  # 随后随左室重塑（肥厚消退）压差缓慢优化
  gradient_recovery:
    description: |
      主动脉压差：手术后快速降至人工瓣固有压差（第1-3天），
      随后随左室肥大消退和心功能改善缓慢继续降低（残余改善约2-4 mmHg/6周）。
      时间常数：初始快速恢复3天，缓慢重塑6周。
      来源：Leon et al. (2010) PARTNER Trial，术后即刻至6个月超声心动图随访。
    step_unit: day
    condition: true
    priority: 8
    dynamics:
      aortic_gradient: >
        max(prosthetic_gradient,
        aortic_gradient - (aortic_gradient - prosthetic_gradient) * 0.35 * step
        - 0.05 * step)

  # F2: 心脏指数改善动力学
  # 后负荷降低（压差改善）→ 心输出量改善
  # 物理治疗通过提高心率储备和外周血管适应性改善CI
  cardiac_index_recovery:
    description: |
      心脏指数改善由后负荷降低（压差驱动）和物理治疗共同驱动。
      后负荷改善系数：压差每降低1 mmHg → CI改善约0.008 L/min/m²（来源：PARTNER数据）。
      物理治疗通过外周适应性提升心储备。CI上限3.5（正常范围）。
    step_unit: day
    condition: true
    priority: 7
    dynamics:
      cardiac_index: >
        min(3.5,
        cardiac_index
        + (max(0.0, 48.0 - aortic_gradient) * 0.002
        + physical_therapy_intensity * 0.008) * step)

  # F3: 肺动脉压下降动力学
  # 左心室后负荷降低后，肺静脉压和肺动脉压缓慢下降
  # 时间常数比压差恢复慢（肺血管重塑需2-6周）
  pulmonary_pressure_dynamics:
    description: |
      肺动脉压随左心室后负荷降低缓慢下降（肺血管重塑时间常数约4-6周）。
      目标值：25 mmHg（正常上限）；改善速率与cardiac_index改善正相关。
      来源：Vahanian et al. (2022) ESC指南，TAVR后肺血管重塑数据。
    step_unit: day
    condition: true
    priority: 6
    dynamics:
      pulmonary_pressure: >
        max(20.0,
        pulmonary_pressure - (pulmonary_pressure - 24.0) * 0.025 * step
        + max(0.0, 1.9 - cardiac_index) * 0.3 * step)

  # F4: INR药代动力学（简化一室模型）
  # 华法林效应延迟约2-3天（凝血因子消耗时间）
  # 此处采用简化的稳态近似：INR → 目标 = warfarin_dose × sensitivity
  inr_dynamics:
    description: |
      INR简化动力学：每日根据华法林剂量和敏感性调整INR，时间常数2天（凝血因子半衰期）。
      稳态INR = warfarin_dose × warfarin_inr_sensitivity + 1.0（基础）。
      来源：Nishimura et al. (2014)，华法林INR管理算法。
    step_unit: day
    condition: true
    priority: 5
    dynamics:
      anticoagulation_inr: >
        anticoagulation_inr
        + (warfarin_dose * warfarin_inr_sensitivity + 1.0 - anticoagulation_inr) * 0.5 * step

  # F5: 活动能力改善动力学
  # 物理治疗强度驱动活动能力评分改善，上限5分
  mobility_dynamics:
    description: |
      活动能力评分随物理治疗强度改善，速率随当前评分接近上限而减慢（渐进趋势）。
      TAVR患者比SAVR恢复更快（系数×1.3），此处模拟TAVR标准康复轨迹。
      来源：Mack et al. (2019) PARTNER 3，出院时功能状态数据。
    step_unit: day
    condition: true
    priority: 4
    dynamics:
      mobility_score: >
        min(5.0,
        mobility_score + physical_therapy_intensity * (1.0 - mobility_score / 5.0) * 0.15 * step)

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-02-11"
  output_variables:
    - aortic_gradient
    - cardiac_index
    - pulmonary_pressure
    - anticoagulation_inr
    - mobility_score
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: physical_therapy_intensity
        time_start: "10:00"
        value: 1.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-07"]
        label: "第1周：床边活动指导"
      - variable: physical_therapy_intensity
        time_start: "10:00"
        value: 3.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-08", "2026-02-11"]
        label: "第2-6周：步行与阶梯训练"
      - variable: warfarin_dose
        time_start: "18:00"
        value: 5.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-02-11"]
        label: "华法林5mg晚服（生物瓣3个月方案）"

optimization:
  method: nsga2
  objectives:
    - variable: cardiac_index
      metric: final
      direction: maximize
      description: "最大化6周末心脏指数（L/min/m²）"
    - variable: anticoagulation_inr
      metric: mean
      direction: minimize
      description: "最小化INR与目标值2.5的偏差（稳定性优化）"
  constraints:
    - variable: anticoagulation_inr
      condition: ">= 1.5"
      type: hard
      description: "INR全程≥1.5（预防人工瓣血栓）"
    - variable: anticoagulation_inr
      condition: "<= 3.5"
      type: hard
      description: "INR全程≤3.5（出血风险控制）"
    - variable: pulmonary_pressure
      condition: "<= 35"
      type: soft
      description: "6周末肺动脉压≤35 mmHg"
  startpoint:
    regimens:
      - variable: warfarin_dose
        time_start: "18:00"
        time_end: "18:00"
        label: "华法林日剂量（mg）"
        optimize:
          value: [2.0, 10.0]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19

references:
  - "Leon MB et al. (2010) Transcatheter aortic-valve implantation for aortic stenosis in patients who cannot undergo surgery (PARTNER Trial). NEJM 363(17):1597-1607."
  - "Nishimura RA et al. (2014) 2014 ACC/AHA Guideline on the Management of Patients with Valvular Heart Disease. JACC 63(22):e57-185."
  - "Vahanian A et al. (2022) 2021 ESC/EACTS Guidelines for the management of valvular heart disease. Eur Heart J 43(7):561-632."
  - "Mack MJ et al. (2019) Transcatheter aortic-valve replacement with a balloon-expandable valve in low-risk patients (PARTNER 3). NEJM 380(18):1695-1705."
  - "Otto CM et al. (2021) 2020 ACC/AHA Guideline for the Management of Patients with Valvular Heart Disease. JACC 77(4):e25-197."
