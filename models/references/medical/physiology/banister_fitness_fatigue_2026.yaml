metadata:
  name: banister_fitness_fatigue
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      The Banister two-component model describes exercise training's dynamic effect on athletic
      performance: an adaptation component and a fatigue component are both driven by training load
      but decay with different time constants, adaptation decaying slowly and fatigue decaying
      quickly, with performance = baseline + k1*adaptation - k2*fatigue. The core tension is that a
      high training load accumulates adaptation quickly, but the fatigue accumulating alongside it
      temporarily masks the performance gain, and can even trigger overtraining, so the optimal
      allocation of intensity, frequency, and recovery cannot be given by intuition alone.
    result: >
      Simulating three arms shows a clear contrast. The light-maintenance arm, at TRIMP equal to 15,
      shows a fatigue-dominated performance trough around days 10 to 30, falling to about 40 points,
      after which the adaptation component gradually overtakes the fatigue component, recovering to
      about 199 points by day 90; the standard arm, at TRIMP equal to 60 to 80, has a higher load, so
      the same fatigue trough bottoms out earlier, reaching 0 points by day 10, but also recovers
      earlier, plateauing at 200 points around day 60; the no-rest-day high-load arm, at TRIMP equal
      to 120, extends the trough markedly, remaining at 0 through day 30 and not catching up to the
      other two until around day 60, illustrating that the higher the load, the longer the
      performance-suppression period, the overtraining risk; all three arms together confirm the
      directional correctness of the two-time-constant adaptation-and-fatigue mechanism. The
      NSGA-II-based optimization gives a tradeoff front between final performance and fatigue
      accumulation, with 7 solutions: from 100 points and 0 fatigue at zero training, to 193 points
      and 96 fatigue at about 15 TRIMP combining weekdays and Saturday, the latter already
      approaching the hard-constraint ceiling.
    limitations: The parameters still need a formal literature source, a known gap flagged as noref; the componentwise difference between aerobic and strength training is not distinguished.
  ratings:
    importance: 1.0 - The Banister model is the most central training-load-versus-performance model in sports science, imported by multiple fitness papers, a core dependency component within the framework
    variable: 0.75 - Cites Banister 1975's original paper and subsequent validation literature such as Morton/Busso, with well-documented parameters
    equation: 1.0 - The Banister adaptation-fatigue two-compartment structure is one of the standard forms most widely cited and independently reproduced in exercise physiology
    simulation: 0.5 - --sim/--opt run and are directionally self-consistent, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - The same structure in papers/lm_format/banister_validation.yaml, when benchmarked against Morton 1990, found race-day performance deviating from the target by 2.4-fold; this file has not undergone the same benchmark
  tags: [sports_science, training, optimization, physiological, banister, B3]

variables:
  # R1: Fitness Component (Positive Training Effect, PTE)
  # The adaptation component: increases with training, decaying slowly with tau1=45 days (Banister 1975, Table 1)
  fitness_component:
    description: >
      The training-adaptation component (a positive effect), decaying exponentially with
      tau1=45 days. Represents long-term physiological adaptation such as aerobic capacity and
      muscular adaptation.
      The upper bound is set with margin above the steady state at the maximum training_load of
      150 TRIMP/day (load x tau1 is about 6750), avoiding having the fitness component hit its
      ceiling before the fatigue component and erasing the difference in their time constants (an
      earlier ceiling of 600 caused both components to hit the same ceiling within a few weeks,
      erasing the adaptation/fatigue time-constant difference and holding performance at 0
      permanently, unable to reproduce the taper-period performance rebound).
    value: 0.0
    unit: "au"
    type: state
    bounds: [0.0, 7000.0]

  # R2: Fatigue Component (Negative Training Effect, NTE)
  # The fatigue component: increases with training, decaying quickly with tau2=15 days (Banister 1975, Table 1)
  fatigue_component:
    description: >
      The training-fatigue component (a negative effect), decaying exponentially with
      tau2=15 days. Represents short-term suppressive effects such as metabolic and central fatigue.
      The upper bound is likewise set with margin above the steady state at the maximum
      training_load of 150 TRIMP/day (load x tau2 is about 2250).
    value: 0.0
    unit: "au"
    type: state
    bounds: [0.0, 2500.0]

  # R3: Performance
  performance:
    description: "The athletic-performance index. A baseline of 100 points, peaking when accumulated adaptation and dissipating fatigue reach a balance after training."
    value: 100.0
    unit: "score"
    type: state
    bounds: [0.0, 200.0]

  # Parameters (Banister 1975 / Morton 1990 recommended values)
  tau_fitness:
    description: "The adaptation-component decay time constant tau1 (recommended value 45 days). Source: Morton 1990, Table 1."
    value: 45.0
    unit: "day"
    type: parameter
    bounds: [20.0, 80.0]

  tau_fatigue:
    description: "The fatigue-component decay time constant tau2 (recommended value 15 days). Source: Morton 1990, Table 1."
    value: 15.0
    unit: "day"
    type: parameter
    bounds: [5.0, 30.0]

  k1:
    description: "The adaptation-component weighting coefficient k1 (recommended value 1.0). Source: Morton 1990."
    value: 1.0
    unit: "coefficient"
    type: parameter
    bounds: [0.3, 3.0]

  k2:
    description: "The fatigue-component weighting coefficient k2 (recommended value 2.0, about twice k1). Source: Morton 1990."
    value: 2.0
    unit: "coefficient"
    type: parameter
    bounds: [0.5, 5.0]

  baseline_performance:
    description: "The baseline athletic performance p0 without training (set to 100 points)."
    value: 100.0
    unit: "score"
    type: parameter
    bounds: [50.0, 200.0]

  # P1: Input — Daily Training Load (TRIMP)
  # TRIMP (Training Impulse) = training duration (min) x a heart-rate-weighted coefficient
  # Reference values: rest day=0, easy aerobic=30-40, moderate intensity=60-80, high intensity/competition=100-120, extreme training=150
  # Source: Banister & Hamilton (1985), the training-impulse calculation method
  training_load:
    description: |
      Daily training load (TRIMP, Training Impulse).
      Typical values: rest day=0; easy jogging=30-40; moderate aerobic=60-80; high-intensity intervals=100-120; extreme training=150.
      Source: Banister EW & Hamilton CL (1985) Variations in iron status with fatigue modelled from training in female distance runners.
    value: 0.0
    unit: "TRIMP"
    type: input
    bounds: [0.0, 150.0]

equations:
  # F1: Fitness Dynamics (a first-order linear system, driven by the training input, decaying with tau1)
  # dFitness/dt = -Fitness/tau1 + w(t)
  # Source: Banister 1975, Eq.(2)
  fitness_dynamics:
    description: "The adaptation-component first-order dynamics: dFitness/dt = -Fitness/tau1 + training_load (Banister 1975, Eq.2)"
    step_unit: day
    condition: true
    dynamics:
      fitness_component: "fitness_component + (-fitness_component / tau_fitness + training_load) * step"
    priority: 5

  # F2: Fatigue Dynamics (a first-order linear system, driven by the training input, decaying with tau2, 3x faster than adaptation)
  # dFatigue/dt = -Fatigue/tau2 + w(t)
  # Source: Banister 1975, Eq.(3)
  fatigue_dynamics:
    description: "The fatigue-component first-order dynamics: dFatigue/dt = -Fatigue/tau2 + training_load (Banister 1975, Eq.3)"
    step_unit: day
    condition: true
    dynamics:
      fatigue_component: "fatigue_component + (-fatigue_component / tau_fatigue + training_load) * step"
    priority: 5

  # F3: Performance Calculation
  # p(t) = p0 + k1*Fitness(t) - k2*Fatigue(t)
  # Source: Morton 1990, Eq.(1)
  performance_calc:
    description: "The performance equation: p = p0 + k1*Fitness - k2*Fatigue (Morton 1990, Eq.1)"
    condition: true
    dynamics:
      performance: "max(0, baseline_performance + k1 * fitness_component - k2 * fatigue_component)"
    priority: 1

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-07-01"
  output_variables: [fitness_component, fatigue_component, performance, training_load]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: training_load
        time_start: "09:00"
        value: 60.0
        days: [Mon, Tue, Wed, Thu, Fri]
        date_range: ["2026-01-01", "2026-07-01"]
        label: "Weekday training load (TRIMP)"
      - variable: training_load
        time_start: "09:00"
        value: 80.0
        days: [Sat]
        date_range: ["2026-01-01", "2026-07-01"]
        label: "Saturday long training session"

  - id: light_maintenance
    label: "Maintenance-level light training (a low-stimulus control)"
    regimens:
      - variable: training_load
        time_start: "09:00"
        value: 15.0
        days: [Mon, Tue, Wed, Thu, Fri]
        date_range: ["2026-01-01", "2026-07-01"]
        label: "Weekday light training load (TRIMP=15)"

  - id: overtraining_no_rest
    label: "High load with no rest day (an overtraining risk)"
    regimens:
      - variable: training_load
        time_start: "09:00"
        value: 120.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-07-01"]
        label: "Daily high-load training (TRIMP=120, no rest day)"

optimization:
  method: nsga2
  objectives:
    - variable: performance
      metric: final
      direction: maximize
      description: "Maximizing performance at the end of 180 days"
    - variable: fatigue_component
      metric: final
      direction: minimize
      description: "Minimizing accumulated fatigue at the end of 180 days (overtraining risk)"
  constraints:
    - variable: fatigue_component
      condition: "<= 100"
      type: hard
      description: "Avoiding overtraining: the fatigue component should not exceed 100 (Morton 1990's recommended threshold)"
  startpoint:
    regimens:
      - variable: training_load
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri]
        label: "Weekday training load (TRIMP)"
        optimize:
          value: [0, 150]
      - variable: training_load
        time_start: "09:00"
        time_end: "09:00"
        days: [Sat]
        label: "Saturday training load (TRIMP)"
        optimize:
          value: [0, 150]
  algorithm:
    population_size: 80
    n_generations: 150
    seed: 19
  results:
    generated_at: "2026-07-06"
    method: nsga2
    n_solutions: 7
    elapsed_seconds: 92.1
    pareto_front:
      - {x: [0.00, 0.00], f: [-100.00, 0.00]}
      - {x: [0.71, 3.64], f: [-114.81, 15.26]}
      - {x: [2.59, 1.38], f: [-129.39, 30.37]}
      - {x: [1.60, 14.30], f: [-145.98, 47.31]}
      - {x: [1.57, 23.03], f: [-163.79, 65.57]}
      - {x: [4.00, 17.22], f: [-176.65, 78.98]}
      - {x: [7.62, 7.20], f: [-192.96, 96.02]}
    recommended:
      x: [1.60, 14.30]
      f: [-145.98, 47.31]

references:
  - "Banister EW, Calvert TW, Savage MV, Bach TM (1975) A systems model of training for athletic performance. Aust J Sports Med 7(3):57-61."
  - "Morton RH, Fitz-Clarke JR, Banister EW (1990) Modeling human performance in running. J Appl Physiol 69(3):1171-1177."
  - "Busso T (2003) Variable dose-response relationship between exercise training and performance. Med Sci Sports Exerc 35(7):1188-1195."
