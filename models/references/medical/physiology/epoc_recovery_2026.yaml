category: physiological

metadata:
  name: epoc_recovery
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      The classic EPOC (excess post-exercise oxygen consumption) data comes from Bahr & Sejersted
      (1991): 6 healthy men cycled for 80 minutes at 29%/50%/75% VO2max, and the measured EPOC total
      (in L) and duration (in hours) both rose with intensity, with the paper itself reporting "an
      exponential relationship between exercise intensity and EPOC total." This file demonstrates
      both the intensity-to-total exponential extrapolation relationship and a
      pulse-injection-plus-first-order-decay time-dynamics structure.
    result: |
      Using the EPOC totals at the 29% and 75% intensities, 1.3L and 30.1L, an exponential model
      magnitude=A*exp(B*intensity) is fit, and a leave-one-out prediction is made for the 50%
      intensity, meaning the 50% intensity's own measured data does not participate in the fit:
      the prediction is 5.46L, the reported measurement is 5.7±1.71L, and the prediction falls
      within the measured 95% interval, passing verification. The same leave-one-out prediction for
      duration: the predicted 50%-intensity duration is 1.52h, the reported measurement is
      3.3±0.7h, with the prediction far below the measured lower bound. Total and duration are two
      output metrics of different character, and should not by default be extrapolated equally with
      the same simple exponential model. The full comparison table and discussion are in
      `epoc_recovery_2026.md` in the same directory.
    limitations: |
      In the time_course_75pct plan, the epoc_rate initial value and decay time constant are
      back-derived from magnitude/duration under the assumption duration is about 5 times the time
      constant, a simplified conversion this file's author adopted independently, not a
      first-order-decay parameter Bahr & Sejersted (1991) directly reported; this only demonstrates
      that the engine can correctly numerically integrate a given ODE and recover a known total, and
      does not constitute an independent verification of the true decay shape at that intensity. The
      predict_50pct plan's leave-one-out prediction is this file's genuine independent verification.
  ratings:
    importance: 0.25 - A classic exercise-physiology intensity-recovery relationship, usable as a supplementary submodel for training-load-type cases, not yet imported by a specific paper
    variable: 0.75 - Bahr & Sejersted (1991) supplies the classic measured data for EPOC's intensity dependence
    equation: 0.5 - The author independently fit an exponential extrapolation to the measured data, not an independently reproduced standard equation form
    simulation: 0.5 - The intensity-versus-total leave-one-out prediction passes, the duration extrapolation does not, showing the two metrics differ in measurement robustness
    optimization: 0.0 - This file contains no optimization block and involves no decision variables
    confidence: 0.5 - The intensity-versus-total leave-one-out prediction passes (5.46L at 50% intensity versus a measured 5.7±1.71L), but the duration extrapolation does not
  tags: [epoc, exercise, validation, literature-benchmark, exponential-fit]

variables:
  exercise_intensity:
    description: Exercise intensity (as a fraction of VO2max), fixed per plan and constant throughout
    value: 0.0
    unit: dimensionless
    type: input
    bounds: [0, 1]

  epoc_rate0_input:
    description: >
      Used only in the time_course_75pct plan: the initial EPOC excess-oxygen-consumption rate
      pulse at t=0 (L/hr), back-derived from magnitude/duration (see metadata.limitations); the
      predict_50pct plan sets this to 0 (that plan does not use the time dynamics, only the static
      extrapolation equation).
    value: 0.0
    unit: L/hour
    type: input

  epoc_tau_input:
    description: >
      Used only in the time_course_75pct plan: the exponential decay time constant (hours),
      back-derived from duration/5 (see metadata.limitations). The predict_50pct plan takes an
      arbitrary nonzero value (this parameter has no actual effect when epoc_rate0_input=0).
    value: 1.0
    unit: hour
    type: input

  epoc_rate:
    description: The instantaneous EPOC excess-oxygen-consumption rate (L/hr), decaying first-order after a pulse injection at t=0
    value: 0.0
    unit: L/hour
    type: state
    bounds: [0, 100]

  epoc_cumulative:
    description: The cumulative EPOC total (L); the time_course_75pct plan's final value should be about 30.1L (Bahr 1991 measured)
    value: 0.0
    unit: L
    type: state

  epoc_predicted_magnitude:
    description: >
      The leave-one-out predicted EPOC total (L): fitting A*exp(B*intensity) to the 29%/75%
      intensity data, then substituting this plan's exercise_intensity. The predict_50pct plan
      (intensity=0.50) is the genuine independent-prediction test point; the time_course_75pct plan
      (intensity=0.75), once substituted, should return exactly to the fit anchor of 30.1
      (a consistency self-check, not an independent test).
    value: 0.0
    unit: L
    type: state

  epoc_predicted_duration:
    description: The leave-one-out predicted EPOC duration (hours), fit the same way as above, used to test the predict_50pct plan
    value: 0.0
    unit: hour
    type: state

  epoc_fit_A:
    description: >
      A coefficient of the exponential model fit independently by this file's author (not given
      directly by the literature): fitting magnitude=A*exp(B*intensity) to two points, the
      29%-intensity EPOC total of 1.3L and the 75%-intensity total of 30.1L reported by Bahr &
      Sejersted (1991).
    value: 0.179282
    unit: L
    type: parameter
    reference: "This file's author's two-point exponential fit to Bahr & Sejersted (1991) data"

  epoc_fit_B:
    description: The exponential model's slope coefficient, fit the same way as epoc_fit_A
    value: 6.830785
    unit: dimensionless
    type: parameter
    reference: "This file's author's two-point exponential fit to Bahr & Sejersted (1991) data"

  epoc_duration_fit_C:
    description: >
      The duration exponential model's coefficient (the same fitting method, using two points, a
      29%-intensity duration of 0.3h and a 75%-intensity duration of 10.5h).
    value: 0.031857
    unit: hour
    type: parameter
    reference: "This file's author's two-point exponential fit to Bahr & Sejersted (1991) data"

  epoc_duration_fit_D:
    description: The duration exponential model's slope coefficient, fit the same way as epoc_duration_fit_C
    value: 7.729017
    unit: dimensionless
    type: parameter
    reference: "This file's author's two-point exponential fit to Bahr & Sejersted (1991) data"

equations:
  epoc_injection:
    description: "A pulse at t=0: epoc_rate0_input is injected into epoc_rate once (nonzero only in the time_course_75pct plan)"
    condition: true
    priority: 6
    dynamics:
      epoc_rate: "epoc_rate + epoc_rate0_input"

  epoc_decay:
    description: "First-order decay: depoc_rate/dt = -epoc_rate/epoc_tau_input"
    step_unit: hour
    condition: true
    priority: 5
    dynamics:
      epoc_rate: "epoc_rate - (epoc_rate / epoc_tau_input) * step"

  epoc_integration:
    description: "The cumulative EPOC total: dcumulative/dt = epoc_rate"
    step_unit: hour
    condition: true
    priority: 4
    dynamics:
      epoc_cumulative: "epoc_cumulative + epoc_rate * step"

  predict_magnitude:
    description: "A static extrapolation: epoc_predicted_magnitude = A*exp(B*exercise_intensity), not integrated over time"
    condition: true
    priority: 3
    dynamics:
      epoc_predicted_magnitude: "epoc_fit_A * exp(epoc_fit_B * exercise_intensity)"

  predict_duration:
    description: "A static extrapolation: epoc_predicted_duration = C*exp(D*exercise_intensity), not integrated over time"
    condition: true
    priority: 2
    dynamics:
      epoc_predicted_duration: "epoc_duration_fit_C * exp(epoc_duration_fit_D * exercise_intensity)"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-03"
  output_variables:
    - exercise_intensity
    - epoc_rate
    - epoc_cumulative
    - epoc_predicted_magnitude
    - epoc_predicted_duration
  plans:
    - id: "time_course_75pct"
      label: "The EPOC time course after exercise at 75% VO2max intensity (an engine-integration consistency demonstration)"
      regimens:
        - {variable: exercise_intensity, time_start: "00:00", time_end: "23:00", value: 0.75, delivery: level, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-01-03"], label: "Intensity=0.75 constant"}
        - {variable: epoc_rate0_input, time_start: "00:00", value: 14.333, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-01-01"], label: "A pulse injection at t=0 (back-derived from 30.1L/2.1h)"}
        - {variable: epoc_tau_input, time_start: "00:00", time_end: "23:00", value: 2.1, delivery: level, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-01-03"], label: "Time constant=2.1h constant (back-derived from 10.5h/5)"}

    - id: "predict_50pct"
      label: "50% VO2max intensity, a leave-one-out prediction test (not using the time dynamics, only the static extrapolation equation)"
      regimens:
        - {variable: exercise_intensity, time_start: "00:00", time_end: "23:00", value: 0.50, delivery: level, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-01-03"], label: "Intensity=0.50 constant"}

references:
  - "Bahr R, Sejersted OM (1991) Effect of intensity of exercise on excess postexercise O2 consumption. Metabolism 40(8):836-841"
