  name: energy_balance
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      能量平衡（摄入 − 消耗）决定体重轨迹：基础代谢率（BMR）受体组成影响，运动额外耗能，热适应即代谢适应，使长期节食的效果逐渐减弱。该组件提供 7 个变量和 5 个方程，作为肥胖/减重仿真的能量核算基础层，依赖 nutrition_intake 和 glucose_regulation 的上游输出。
    result: >
      仿真预期呈现能量储备和代谢率在不同饮食/运动方案下的日动态轨迹，仿真尚未运行，为纯组件模型。
    limitations: BMR 方程，例如 Harris-Benedict 公式等，存在个体差异 ±15%；代谢适应速率参数无文献标注，需在上层场景中校准。
  ratings:
    importance: 0.5 - 被1个上层模型import，有潜力但目前引用偏少
    variable: 0.25 - 模块为生成代码，参数描述简略，缺少文献来源标注
    equation: 0.25 - 模块为生成代码，参数缺乏文献来源标注，方程为定性近似，未见独立复现
    simulation: 0.25 - 从未跑通--sim/--opt(nosim/noopt标记)
    optimization: 0.5 - 决策变量搜索前沿方向合理，未独立验证是否退化
    confidence: 0.0 - 从未跑通--sim/--opt(nosim/noopt标记)
  tags:
  - metabolism
  - energy
imports:
- references/medical/physiology/nutrition_intake_2026_mw
- references/medical/physiology/glucose_regulation_2026_mw
variables:
  energy:
    description: 当前能量储备
    value: 2000.0
    unit: kcal
    type: state
  metabolism_rate:
    description: 基础代谢率系数
    value: 1.0
    unit: relative
    type: parameter
  basal_metabolic_rate:
    bounds:
    - 800
    - 3000
    description: 基础代谢率
    type: state
    unit: kcal/day
    value: 1800
  energy_expenditure:
    bounds:
    - 0.5
    - 3.0
    description: 能量消耗率
    type: state
    unit: 倍数
    value: 1.2
  nutrition_base:
    description: 每日基础营养（kcal）
    value: 2000.0
    unit: kcal/day
    type: parameter
  exercise_consume:
    description: 每日运动消耗系数
    value: 500.0
    unit: kcal/day
    type: parameter
  aging_decay:
    description: 每日代谢衰减率
    value: 0.001
    unit: per_day
    type: parameter
equations:
  energy_update:
    description: 能量更新方程
    dynamics:
      energy: metabolism_rate * nutrition_base - exercise_consume
    priority: 3
  aging_update:
    description: 代谢率随衰老衰减
    dynamics:
      metabolism_rate: metabolism_rate * (1 - aging_decay)
    priority: 2
  circadian_hormone_variation:
    condition: true
    description: 昼夜节律对代谢的影响
    dynamics:
      basal_metabolic_rate: 1800 + 200 * sin(time * 3.14159 / 720)
      insulin_sensitivity: 0.8 + 0.1 * cos(time * 3.14159 / 720)
    priority: 1
  exercise_effect:
    condition: exercise_intensity > 0
    description: 运动增加葡萄糖利用和胰岛素敏感性
    step_unit: minute
    dynamics:
      energy_expenditure: min(3.0, energy_expenditure + exercise_intensity * 0.1 * step)
      glucose_utilization: glucose_utilization + exercise_intensity * 0.2 * step
      insulin_sensitivity: min(1.0, insulin_sensitivity + exercise_intensity * 0.005 * step)
    priority: 3
  metabolic_efficiency:
    condition: true
    description: 代谢效率指标
    dynamics:
      metabolic_efficiency: (digestive_efficiency + insulin_sensitivity) / 2 * 100
    priority: 1
simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-08"
  output_variables:
  - energy
  - metabolism_rate
  - basal_metabolic_rate
  - energy_expenditure
