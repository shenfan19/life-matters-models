category: physiological

metadata:
  name: sleep_duration_mortality
  lm_format_version: "1.0"
  updated: 2026-07-27
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: |
      Sleep duration shows a U-shaped association with all-cause mortality, not a "more is
      better" monotonic relationship, since both too little and too much sleep independently
      correspond to higher mortality risk, with the lowest-risk point near about 7 hours/night. In
      several cross-disciplinary behavior-optimization models, such as burnout_allostatic and
      infant_breastfeeding, the "sleep" decision/state variable has previously been built as a
      monotonic positive-effect term, meaning more sleep always gives better recovery with no
      ceiling, contradicting this U-shaped association, and this is one root cause of why these
      models' K x 4 optimization results systematically push sleep to the upper bound of the search
      range, losing a genuine tradeoff. This file declares this U-shaped association separately as a
      reusable evidence reference, for other models' equations to cite the coefficients, avoiding
      each model separately re-estimating or omitting a sleep ceiling.
    result: |
      This declares, using the rr subtype in the LM format's evidence block, the two-segment effect
      size from the Cappuccio et al. (2010) dose-response meta-analysis: for each hour less than
      7 hours/night, the all-cause-mortality relative risk (RR) rises 6% on the short-sleep side; for
      each hour more than 7 hours/night, RR rises 13% on the long-sleep side, with the long-sleep
      slope about twice the short-sleep slope. This verifies that the loader correctly reads, carries,
      and displays this segmented effect size: given any sleep_hours_input, it statically computes
      the corresponding relative-risk multiplier, with the minimum fixed at
      optimal_sleep_hours=7.
    limitations: |
      This case demonstrates the correctness of effect-size encoding, not an independent prediction
      test, and the two per-hour RR coefficients are themselves the target being verified, not values
      extrapolated and then compared against a separate independent source. The real dose-response
      relationship is not strictly piecewise-linear in the transition region between the two
      segments, because the meta-analysis reports a pooled slope, not a precise hour-by-hour curve,
      so other models citing it should treat it as an engineering approximation rather than an exact
      analytical solution; furthermore, this effect size measures mortality, not a short-term outcome
      such as next-day work performance or next-day cortisol level, so other models citing this
      curve's *direction*, the existence of an optimum with decline on both sides, have a sound
      basis, but if a precise coefficient for a short-term behavioral outcome is needed, a more
      directly corresponding publication should be separately checked, such as Van Dongen et al.
      2003's dose-response study on cumulative cognitive-performance impairment from sustained sleep
      restriction.
  ratings:
    importance: 0.5 - A base mechanism coefficient reused across multiple behavior-optimization models, cited by models such as burnout_allostatic/infant_breastfeeding, not an isolated component
    variable: 1.0 - Cappuccio et al. (2010) is a classic, repeatedly cited meta-analysis in this field, directly traceable to the literature
    equation: 1.0 - The evidence_type conversion is a standard mechanism defined by the LM format specification, not a self-built structure
    simulation: 0.5 - The correctness of the effect-size encoding has been verified and demonstrated, but this is explicitly not an independent prediction test, a form of circular verification
    optimization: 0.0 - This file contains no optimization block, being a pure effect-size encoding demonstration with no decision variables
    confidence: 0.75 - The effect size itself comes from a high-quality independent source (a meta-analytic consensus value), and the loader's correct encoding is demonstrated; that this is not an independent prediction is noted in the rationale
  tags: [epidemiology, evidence, rr, validation, literature-benchmark, rr-family, sleep, physiology]

variables:
  optimal_sleep_hours:
    description: The sleep duration corresponding to the lowest all-cause mortality risk (the Cappuccio 2010 meta-analysis's inflection point; the lower end of the AASM consensus 7-8h range)
    value: 7.0
    unit: hours
    type: parameter
    reference: "Cappuccio FP et al. (2010)"

  rr_per_hour_short:
    type: parameter
    evidence_type: rr
    description: The multiplicative increment in all-cause-mortality RR for each hour less than optimal_sleep_hours (the short-sleep-side slope)
    value: 1.06
    unit: "RR/hour"
    reference: "Cappuccio FP et al. (2010) Sleep 33(5):585-592"

  rr_per_hour_long:
    type: parameter
    evidence_type: rr
    description: The multiplicative increment in all-cause-mortality RR for each hour more than optimal_sleep_hours (the long-sleep-side slope, about twice the short-sleep side)
    value: 1.13
    unit: "RR/hour"
    reference: "Cappuccio FP et al. (2010) Sleep 33(5):585-592"

  sleep_hours_input:
    description: The sleep duration to be evaluated (a probe value substituted by other models/demonstration scenarios)
    value: 7.0
    unit: hours
    type: input

  relative_risk:
    description: The all-cause-mortality relative risk corresponding to sleep_hours_input (with optimal_sleep_hours=7 as the reference, =1.0, piecewise linear on both sides)
    value: 1.0
    unit: "RR"
    type: state

equations:
  relative_risk_calc:
    description: >
      A piecewise-linear dose-response: the short-sleep side and long-sleep side each apply their
      own independent per-hour RR increment, meeting at optimal_sleep_hours where RR=1.0. This is
      an engineering approximation of the U-shaped association, not a precise hour-by-hour curve
      given by the literature (see metadata.description.limitations).
    condition: true
    priority: 3
    dynamics:
      relative_risk: >
        1.0
        + max(0, optimal_sleep_hours - sleep_hours_input) * (rr_per_hour_short - 1.0)
        + max(0, sleep_hours_input - optimal_sleep_hours) * (rr_per_hour_long - 1.0)
    reference: "Cappuccio FP et al. (2010)"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables:
    - sleep_hours_input
    - relative_risk
  plans:
    - id: "short_sleep_5h"
      label: "Short-sleep demonstration (5 hours/night)"
      regimens:
        - {variable: sleep_hours_input, time_start: "00:00", value: 5.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-01-01"], label: "5h"}
    - id: "optimal_sleep_7h"
      label: "Optimal-sleep demonstration (7 hours/night)"
      regimens:
        - {variable: sleep_hours_input, time_start: "00:00", value: 7.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-01-01"], label: "7h"}
    - id: "long_sleep_10h"
      label: "Long-sleep demonstration (10 hours/night)"
      regimens:
        - {variable: sleep_hours_input, time_start: "00:00", value: 10.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-01-01"], label: "10h"}

references:
  - "Cappuccio FP, D'Elia L, Strazzullo P, Miller MA (2010) Sleep duration and all-cause mortality: a systematic review and meta-analysis of prospective studies. Sleep 33(5):585-592"
  - "American Academy of Sleep Medicine (AASM) consensus: 7-8 hours/night appropriate for optimal adult health; >=9-10 hours classified as long sleep duration"
