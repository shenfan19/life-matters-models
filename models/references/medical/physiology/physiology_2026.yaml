  name: physiology
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      多器官功能聚合层：通过 15 个变量将肝脏功能 liver_function、胰腺功能 pancreatic_function、胃功能 gastric_function 和小肠状态统一到同一坐标空间，并以单一方程描述器官功能系数的慢性衰竭与自然恢复动力学。依赖 insulin_system 和 glucose_regulation 的输出，作为多系统仿真的顶层生理状态汇聚节点。
    result: >
      仿真预期呈现各器官功能系数在慢性病进程下的缓慢下降趋势，例如糖尿病并发症，仿真尚未运行，为纯组件模型。
    limitations: 15 个变量参数为定性近似，无文献标注；器官功能系数的实际临床测量方法不统一，建议在上层场景中替换为可测指标，例如 GFR、ALT 等。
  conflicts: []
  ratings:
    validation_confidence: 1 - 从未跑通--sim/--opt(nosim/noopt标记)
    topic_importance: 4 - 多器官功能系数聚合组件，为复杂场景提供生理基础
    framework_demand: 2 - 顶层聚合组件，被1个上层模型import，实际引用低
    evidence_quality: 2 - 模块为生成代码，15个变量参数无文献标注，为定性近似
    popularity: 3 - 顶层生理聚合组件在多系统建模中有价值，但不独立引用
  tags:
  - organs
  - function
imports:
- references/medical/physiology/insulin_system_2026_mw
- references/medical/physiology/glucose_regulation_2026_mw
