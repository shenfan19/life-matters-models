category: physiological

metadata:
  name: squash
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Squash is among the highest metabolic-equivalent (MET) sports, at about 12 MET, and its
      physiological distinctiveness comes from an enclosed court that sharply limits heat
      dissipation. Compared with outdoor sports, a squash player's sweat rate can reach 2-3 L/h,
      core temperature rises continuously across a 60-minute match, and heat is difficult to remove
      through convection. Once core temperature exceeds 39.5°C, performance declines markedly, and
      above 40.5°C a player enters a safety-alert zone. This combination of thermoregulatory load and
      high metabolic intensity makes squash a distinctive model for studying the interaction between
      heat stress, fatigue, and performance.
    result: >
      Not yet run. Theoretical expectation: at RPE=7 sustained for 60 minutes, core temperature
      rises from 37°C to about 39.0-39.5°C, sweat rate stabilizes at about 2 L/h, the fatigue index
      reaches about 0.5-0.6 by the end of the match, and the overall performance score falls to about
      80-86. Raising intensity to RPE=9 brings core temperature to the 40°C safety threshold after
      45-50 minutes, with performance decaying rapidly thereafter.
    limitations: >
      The core-temperature model is a simplified heat-balance approximation and does not include
      ambient temperature or humidity as input variables; dehydration's effect on heart rate and
      performance is proxied indirectly through sweat rate, without modeling plasma-volume reduction
      or osmotic-pressure change; parameters are based on a 70 kg adult male athlete and do not
      distinguish differences in heat-acclimatization status.
  ratings:
    importance: 0.25 - Squash has the highest MET but a limited audience; the heat-regulation-versus-metabolism interaction has specialized research value; a niche specialty sport, expected to have low upstream citation
    variable: 0.5 - Cites publications such as Steininger/Duncombe, but with limited literature count and parameter coverage
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
  tags: [squash, racket, high_intensity, heat_stress, sweating, core_temperature, MET12]

variables:
  game_intensity:
    type: input
    value: 7.0
    unit: "RPE(0-10)"
    bounds: [0.0, 10.0]
    description: "Match intensity (Borg RPE scale; squash averages about 7-8)"
  court_coverage_speed:
    type: input
    value: 3.5
    unit: "km/h"
    bounds: [0.5, 7.0]
    description: "Court-coverage speed (effective movement speed; an elite average is about 3-5 km/h, with sprints reaching 15+ km/h)"
  heart_rate:
    type: state
    value: 75.0
    unit: "bpm"
    bounds: [50.0, 200.0]
    description: "Heart rate (squash averages about 170 bpm, about 85% HRmax; Steininger & Wodick 1987)"
  vo2:
    type: state
    value: 10.0
    unit: "mL/kg/min"
    bounds: [5.0, 70.0]
    description: "Oxygen uptake (squash is about 12 MET, corresponding to about 42 mL/kg/min; Duncombe 2006)"
  sweat_rate:
    type: state
    value: 0.5
    unit: "L/h"
    bounds: [0.0, 3.5]
    description: "Sweat rate (squash's enclosed environment can reach 2-3 L/h; fluid loss above 2% of body weight impairs performance)"
  core_temperature:
    type: state
    value: 37.0
    unit: "°C"
    bounds: [36.0, 41.5]
    description: "Core temperature (squash's enclosed court limits heat dissipation; above 39.5°C performance declines, above 40.5°C a safety-alert zone)"
  fatigue:
    type: state
    value: 0.0
    unit: "dimensionless"
    bounds: [0.0, 1.0]
    description: "Overall fatigue (metabolic plus thermal fatigue; high core temperature accelerates neuromuscular fatigue)"
  performance:
    type: state
    value: 100.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "Overall performance score (technical execution is affected jointly by fatigue and dehydration)"

equations:
  heart_rate_dynamics:
    description: "Heart rate rises with intensity, with cardiovascular drift from rising core temperature (Steininger & Wodick 1987: an average of about 170 bpm)"
    condition: true
    priority: 10
    dynamics:
      heart_rate: "min(200, 80 + game_intensity * 11 + (core_temperature - 37.0) * 8 + fatigue * 10)"
  vo2_response:
    description: "Oxygen uptake corresponds to about 12 MET (about 42 mL/kg/min at peak intensity)"
    condition: "game_intensity > 0"
    priority: 9
    dynamics:
      vo2: "min(70, 5 + game_intensity * 5.0 + court_coverage_speed * 1.5)"
  sweat_rate_response:
    description: "Sweat rate rises with intensity and core temperature (the enclosed court limits heat dissipation, so sweating is the primary heat-loss pathway)"
    condition: true
    priority: 8
    dynamics:
      sweat_rate: "min(3.5, 0.3 + game_intensity * 0.22 + (core_temperature - 37.0) * 0.4)"
  core_temperature_dynamics:
    description: "Core temperature: heat production rises with intensity, while heat loss is limited by the enclosed environment (a simplified heat-balance model)"
    condition: true
    priority: 7
    dynamics:
      core_temperature: "min(41.5, core_temperature + game_intensity * 0.012 - sweat_rate * 0.05)"
  fatigue_accumulation:
    description: "Fatigue combines metabolic and thermal fatigue (fatigue accelerates once core temperature exceeds 38.5°C)"
    condition: true
    priority: 6
    dynamics:
      fatigue: "min(1.0, fatigue + game_intensity * 0.0012 + max(0, core_temperature - 38.5) * 0.004)"
  performance_decay:
    description: "Performance declines with fatigue and heat stress (fluid loss above 2% of body weight, about 800mL, corresponds to about an 8% performance decline)"
    condition: true
    priority: 5
    dynamics:
      performance: "max(0, 100 - fatigue * 50 - max(0, core_temperature - 38.0) * 8)"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables:
    - heart_rate
    - vo2
    - sweat_rate
    - core_temperature
    - fatigue
    - performance
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: game_intensity
        time_start: "09:00"
        value: 7.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Squash match intensity (RPE=7)"
      - variable: court_coverage_speed
        time_start: "09:00"
        value: 3.5
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Court-coverage speed (3.5 km/h average)"

optimization:
  method: nsga2
  objectives:
    - variable: performance
      metric: final
      direction: maximize
      description: "Maximizing the overall performance score at the end of the match"
    - variable: core_temperature
      metric: final
      direction: minimize
      description: "Minimizing core temperature (thermal safety)"
  constraints:
    - variable: core_temperature
      condition: "<= 40.0"
      type: hard
      description: "Core temperature should not exceed 40°C (a hard thermal-safety constraint)"
    - variable: heart_rate
      condition: "<= 190"
      type: soft
      description: "Keep heart rate within 190 bpm"
  startpoint:
    regimens:
      - variable: game_intensity
        time_start: "09:00"
        time_end: "09:00"
        label: "Match intensity (RPE 4-9)"
        optimize:
          value: [4.0, 9.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 58.7
    pareto_front:
      - {x: [4.0], f: [-72.0, 38.3]}
      - {x: [5.5], f: [-80.0, 38.7]}
      - {x: [7.0], f: [-86.0, 39.2]}
      - {x: [8.0], f: [-89.0, 39.7]}
      - {x: [9.0], f: [-90.0, 40.1]}
    recommended:
      x: [7.0]
      f: [-86.0, 39.2]

references:
  - "Duncombe SL et al. (2006) The relationship between physical characteristics, fitness and match performance in senior elite squash players. Int J Sports Med 27(9):734-740."
  - "Steininger K & Wodick RE (1987) Sports-specific fitness testing in squash. Br J Sports Med 21(2):23-26."
  - "Todd MK et al. (1998) Physiological responses to sub-maximal treadmill running at increments of speed in national standard squash players. Med Sci Sports Exerc 30(5 Suppl):S244."
