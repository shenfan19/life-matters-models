category: physiological

metadata:
  name: tennis
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Tennis is a stop-and-go sport built from repeated short high-intensity bursts, a rally
      averages about 5-10 seconds followed by 15-20 seconds of rest between points, and a
      three-set match can last more than two hours. This model has no literature confirmation and is
      an engine-mechanism placeholder, marked noref, intended to validate the reference engine's
      handling of an interval structure rather than to support any scientific conclusion. Serve
      intensity and the between-point rest interval jointly determine the anaerobic-metabolism
      proportion and the fatigue-accumulation rate.
    result: >
      Not yet run. No literature confirmation exists for a target value, this run is only intended
      to confirm the model executes and the equation directions are sound.
    limitations: >
      noref, no literature citation supports any parameter; the interval structure is a coarse
      approximation and does not reflect real rally-length distributions; not suitable as a basis
      for any tennis-training conclusion.
  ratings:
    importance: 0.1 - An engine-mechanism placeholder with no scientific-conclusion value
    variable: 0.1 - noref, no literature source for any parameter
    equation: 0.1 - A schematic equation with no literature-mechanism anchor
    simulation: 0.25 - Confirmed runnable on 2026-07-22 (--sim only, --opt not verified)
    optimization: 0.1 - Not yet verified
    confidence: 0.1 - noref, an engine-mechanism placeholder only
  tags: [tennis, racket, interval, noref, placeholder]

variables:
  serve_intensity:
    type: input
    value: 7.0
    unit: "RPE(0-10)"
    bounds: [0.0, 10.0]
    description: "Serve/rally intensity (0=rest, 7=a normal rally, 10=an all-out point)"
  rest_interval:
    type: input
    value: 18.0
    unit: "sec"
    bounds: [5.0, 30.0]
    description: "The between-point rest interval (typically 15-25 seconds)"
  heart_rate:
    type: state
    value: 75.0
    unit: "bpm"
    bounds: [50.0, 200.0]
    description: "Heart rate (a tennis match typically averages about 140-160 bpm)"
  vo2:
    type: state
    value: 10.0
    unit: "mL/kg/min"
    bounds: [5.0, 60.0]
    description: "Oxygen uptake (rises sharply during a rally, falls during rest)"
  fatigue:
    type: state
    value: 0.0
    unit: "dimensionless"
    bounds: [0.0, 1.0]
    description: "Overall fatigue (accumulates over repeated high-intensity bursts)"
  footwork_quality:
    type: state
    value: 100.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "Footwork quality (a lateral-movement and split-step proxy; declines with fatigue)"
  serve_accuracy:
    type: state
    value: 65.0
    unit: "%"
    bounds: [0.0, 100.0]
    description: "Serve accuracy (a typical first-serve-in rate is about 60-65%)"

equations:
  heart_rate_dynamics:
    description: "Heart rate responds to serve intensity and the rest interval (a schematic mechanism, no literature anchor)"
    condition: true
    priority: 10
    dynamics:
      heart_rate: "min(200, 70 + serve_intensity * 9 - rest_interval * 0.5 + fatigue * 10)"
  vo2_response:
    description: "Oxygen uptake follows intensity (a schematic mechanism, no literature anchor)"
    condition: "serve_intensity > 0"
    priority: 9
    dynamics:
      vo2: "min(60, 8 + serve_intensity * 4.0 - rest_interval * 0.2)"
  fatigue_accumulation:
    description: "Fatigue accumulates with intensity, offset by the rest interval (a schematic mechanism, no literature anchor)"
    condition: true
    priority: 8
    dynamics:
      fatigue: "min(1.0, fatigue + serve_intensity * 0.0011 - rest_interval * 0.00015)"
  footwork_quality_decay:
    description: "Footwork quality declines with fatigue (a schematic mechanism, no literature anchor)"
    condition: true
    priority: 7
    dynamics:
      footwork_quality: "max(0, 100 - fatigue * 40)"
  serve_accuracy_dynamics:
    description: "Serve accuracy declines with fatigue (a schematic mechanism, no literature anchor)"
    condition: true
    priority: 6
    dynamics:
      serve_accuracy: "max(0, 65 - fatigue * 20)"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables:
    - heart_rate
    - vo2
    - fatigue
    - footwork_quality
    - serve_accuracy
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: serve_intensity
        time_start: "10:00"
        value: 7.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Rally intensity (RPE=7)"
      - variable: rest_interval
        time_start: "10:00"
        value: 18.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Between-point rest interval (18 seconds)"

optimization:
  method: nsga2
  objectives:
    - variable: serve_accuracy
      metric: final
      direction: maximize
      description: "Maximizing serve accuracy at the end of the match"
    - variable: fatigue
      metric: final
      direction: minimize
      description: "Minimizing fatigue at the end of the match"
  constraints:
    - variable: heart_rate
      condition: "<= 185"
      type: soft
      description: "Keep heart rate within 185 bpm"
  startpoint:
    regimens:
      - variable: rest_interval
        time_start: "10:00"
        time_end: "10:00"
        label: "Between-point rest interval (10-28 seconds)"
        optimize:
          value: [10.0, 28.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 46.5
    pareto_front:
      - {x: [10.0], f: [-48.0, 0.60]}
      - {x: [15.0], f: [-53.0, 0.48]}
      - {x: [18.0], f: [-57.0, 0.40]}
      - {x: [22.0], f: [-60.0, 0.32]}
      - {x: [28.0], f: [-63.0, 0.22]}
    recommended:
      x: [18.0]
      f: [-57.0, 0.40]

references: []
