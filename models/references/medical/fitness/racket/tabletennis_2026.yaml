metadata:
  todo:
    - type: noref
      issue: "Lacks sufficient literature citation support (migrated from the old filename's _noref suffix)"
      evidence: "Migrated from the legacy _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check and supply the missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  conflicts: []
  description:
    problem: >
      Table tennis is a racket sport dominated by neurocognitive load, ball speed can exceed
      100 km/h, and a player must complete the full cycle of judging spin direction, anticipating
      the landing point, and organizing the return within about 200-300 ms. Unlike sports with heavy
      physical exertion, table tennis's core performance constraint comes from neural fatigue: as
      match time extends, reaction time lengthens, judgment accuracy for a spinning ball declines,
      and stroke precision decays, while physical fatigue, meaning cardiorespiratory and muscular
      fatigue, has a comparatively secondary effect on performance. Modeling neural fatigue and
      physical fatigue as separate tracks is table tennis's distinctive physiological feature.
    result: >
      Not yet run. Theoretical expectation: in a 60-minute match at RPE=7 and a spin intensity of 5,
      a moderate-to-high pace, neural fatigue crosses the 0.3 threshold after 40-50 minutes,
      reaction time lengthens from a baseline of 220 ms to about 250-280 ms, stroke precision falls
      by about 10-15 points, and the overall performance score falls from 80 to about 65-70; physical
      fatigue rises more slowly, with heart rate held at about 130-160 bpm.
    limitations: >
      This file is marked noref, its parameters lack a formal literature source, and the mechanism
      is a qualitative approximation not suited to high-precision quantitative prediction. Metabolic
      differences between playing styles such as looping and fast-attack, and between the dominant
      hand, are not distinguished; a one-minute step size is a timescale approximation for a
      3-5 second rally structure.
  name: tabletennis
  lm_format_version: "1.0"
  ratings:
    importance: 0.25 - Table tennis is popular in Asia, but the reaction-speed-versus-neural-fatigue model has limited reuse scope; noref, with very low reuse value
    variable: 0.25 - noref marker, parameters lack a literature source, the mechanism is a qualitative approximation
    equation: 0.25 - An equation structure exists but is a qualitative approximation with no literature basis and no independent reproduction
    simulation: 0.25 - No blocking todo found, but an actual test run has not been confirmed, nor has it been compared against an independent literature target value
    optimization: 0.25 - A decision-variable search structure exists, but lacks literature-supported tradeoff evidence
    confidence: 0.0 - Parameters lack a literature source, no independent verification has been run
  tags:
    - fitness
    - tabletennis
    - ping-pong
    - reaction
    - skill
  updated: 2026-04-23
variables:
  rally_pace:
    bounds:
      - 1.0
      - 10.0
    description: Rally pace (1=slow practice, 10=a high-speed competitive match)
    type: input
    unit: RPE
    value: 7.0
  spin_intensity:
    bounds:
      - 0.0
      - 10.0
    description: Spin/variation-ball intensity (affects neural load)
    type: input
    unit: intensity
    value: 5.0
  heart_rate:
    bounds:
      - 60.0
      - 180.0
    description: Heart rate (lower than in most other sports)
    type: state
    unit: bpm
    value: 70.0
  calories_burned:
    bounds:
      - 0.0
      - 500.0
    description: Calories burned
    type: state
    unit: kcal
    value: 0.0
  physical_fatigue:
    bounds:
      - 0.0
      - 1.0
    description: Physical fatigue (muscular and cardiorespiratory)
    type: state
    unit: dimensionless
    value: 0.0
  neural_fatigue:
    bounds:
      - 0.0
      - 1.0
    description: Neural fatigue (decline in reaction speed and attention)
    type: state
    unit: dimensionless
    value: 0.0
  reaction_time:
    bounds:
      - 150.0
      - 400.0
    description: Reaction time (rises as neural fatigue increases)
    type: state
    unit: ms
    value: 220.0
  spin_reading:
    bounds:
      - 0.0
      - 100.0
    description: Spin-reading ability (affected by fatigue and concentration)
    type: state
    unit: score
    value: 80.0
  stroke_precision:
    bounds:
      - 0.0
      - 100.0
    description: Stroke precision (affected by neural fatigue)
    type: state
    unit: score
    value: 82.0
  footwork_speed:
    bounds:
      - 0.0
      - 100.0
    description: Footwork movement speed (affected by physical fatigue)
    type: state
    unit: score
    value: 80.0
  concentration:
    bounds:
      - 0.0
      - 100.0
    description: Concentration (jointly affected by both fatigue tracks)
    type: state
    unit: score
    value: 90.0
  performance:
    bounds:
      - 0.0
      - 100.0
    description: Overall match performance score
    type: state
    unit: score
    value: 80.0
equations:
  heart_rate_dynamics:
    condition: true
    description: Heart rate responds to pace (table tennis's heart-rate range is fairly narrow)
    dynamics:
      heart_rate: 65 + rally_pace * 9 + physical_fatigue * 12
    priority: 1
  calories_accumulation:
    condition: true
    description: Calorie burn (lower than in most other sports)
    dynamics:
      calories_burned: calories_burned + rally_pace * 0.55 * (1 - physical_fatigue * 0.1)
    priority: 2
  physical_fatigue_accumulation:
    condition: true
    description: Physical fatigue accumulation
    dynamics:
      physical_fatigue: min(1.0, physical_fatigue + rally_pace * 0.0008 + 0.0002)
    priority: 3
  neural_fatigue_accumulation:
    condition: true
    description: Neural fatigue accumulation, accelerated by spin intensity
    dynamics:
      neural_fatigue: min(1.0, neural_fatigue + rally_pace * 0.0006 + spin_intensity * 0.0005)
    priority: 4
  reaction_time_degradation:
    condition: neural_fatigue > 0.2
    description: Neural fatigue lengthens reaction time
    dynamics:
      reaction_time: min(400, 220 + neural_fatigue * 120 + physical_fatigue * 40)
    priority: 5
  spin_reading_decay:
    condition: neural_fatigue > 0.3
    description: Neural fatigue impairs spin-reading ability
    dynamics:
      spin_reading: max(30, 85 - neural_fatigue * 40 - (reaction_time - 220) * 0.1)
    priority: 6
  stroke_precision_decay:
    condition: true
    description: Stroke precision is affected by neural fatigue and reaction time
    dynamics:
      stroke_precision: max(30, 85 - neural_fatigue * 35 - physical_fatigue * 15)
    priority: 7
  footwork_speed_decay:
    condition: physical_fatigue > 0.3
    description: Footwork is affected by physical fatigue
    dynamics:
      footwork_speed: max(40, 85 - physical_fatigue * 35)
    priority: 8
  concentration_dynamics:
    condition: true
    description: Concentration declines with both fatigue tracks
    dynamics:
      concentration: max(30, 95 - neural_fatigue * 40 - physical_fatigue * 20)
    priority: 9
  performance_score:
    condition: true
    description: Overall performance score
    dynamics:
      performance: max(0, min(100, stroke_precision * 0.35 + spin_reading * 0.25 + footwork_speed * 0.2 + concentration * 0.2))
    priority: 10
simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: rally_pace
        time_start: "09:00"
        value: 7.0
        label: Rally pace
      - variable: spin_intensity
        time_start: "09:00"
        value: 5.0
        label: Spin intensity
  output_variables:
    - heart_rate
    - calories_burned
    - physical_fatigue
    - neural_fatigue
    - reaction_time
    - spin_reading
    - stroke_precision
    - footwork_speed
    - concentration
    - performance

optimization:
  method: nsga2
  objectives:
    - variable: performance
      direction: maximize
      metric: final
      description: Maximize overall match performance
    - variable: neural_fatigue
      direction: minimize
      metric: final
      description: Minimize neural fatigue (protecting reaction speed)
  constraints:
    - variable: heart_rate
      condition: <= 180
      type: hard
      description: Heart rate should not exceed the upper bound
    - variable: reaction_time
      condition: <= 350
      type: soft
      description: Keep reaction time within 350ms
  startpoint:
    regimens:
      - variable: rally_pace
        time_start: "09:00"
        time_end: "09:00"
        label: Rally pace (RPE 3-9)
        optimize:
          value: [3.0, 9.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
