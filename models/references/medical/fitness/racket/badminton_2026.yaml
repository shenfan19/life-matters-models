category: physiological

metadata:
  name: badminton
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Badminton is one of the most intense interval sports among racket sports, an elite rally
      lasts only about 6-8 seconds but includes multiple explosive direction changes, and rest
      between points is only about 12-15 seconds, giving a work-to-rest ratio far tighter than
      tennis's. Chin et al. (1995) measured a rally-average heart rate of about 90% HRmax in
      elite matches, while Faude et al. (2007) found lactate can accumulate to 4-6 mmol/L within
      a single game. Court-coverage speed, which measures the ability to sustain rapid lateral and
      front-back movement, declines with fatigue accumulation and directly determines the ability to
      retrieve a passive shot.
    result: >
      Not yet run. Theoretical expectation: in a 45-minute match at a rally intensity of RPE=8 and
      a rest interval of 13 seconds, lactate accumulates to about 5-6 mmol/L by the second half,
      court-coverage speed falls from a baseline of 100 to about 65-70, and the fatigue index
      reaches about 0.55 by the end of the match; extending the rest interval to 20 seconds keeps
      lactate below 4 mmol/L and court-coverage speed at about 80.
    limitations: >
      Does not distinguish the differing movement patterns and physiological loads of singles versus
      doubles play; the rally-rest structure is a coarse approximation and does not reflect the true
      distribution of rally lengths; parameters are based on elite adult-male singles play.
  ratings:
    importance: 0.25 - Badminton's high-intensity interval character has specialized sports-science value, with an audience concentrated in Asia; a racket-sport specialty model, expected to have low reuse elsewhere
    variable: 0.5 - Cites publications such as Chin/Faude, with fairly well-founded parameters
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
  tags: [badminton, racket, interval, anaerobic, lactate, court_coverage, VO2max]

variables:
  rally_intensity:
    type: input
    value: 8.0
    unit: "RPE(0-10)"
    bounds: [0.0, 10.0]
    description: "Rally intensity (0=rest, 8=a normal high-intensity rally, 10=an all-out kill point; Chin 1995)"
  rest_interval:
    type: input
    value: 13.0
    unit: "sec"
    bounds: [5.0, 25.0]
    description: "The between-point rest interval (elite play is about 12-15 seconds; Faude 2007)"
  heart_rate:
    type: state
    value: 75.0
    unit: "bpm"
    bounds: [50.0, 200.0]
    description: "Heart rate (about 90% HRmax during a rally, roughly 175 bpm; Chin 1995)"
  vo2:
    type: state
    value: 10.0
    unit: "mL/kg/min"
    bounds: [5.0, 65.0]
    description: "Oxygen uptake (an elite player's VO2max demand is about 55-60 mL/kg/min; Faude 2007)"
  lactate:
    type: state
    value: 1.5
    unit: "mmol/L"
    bounds: [0.5, 10.0]
    description: "Blood lactate (accumulates to 4-6 mmol/L within a game; Faude 2007)"
  court_coverage_speed:
    type: state
    value: 100.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "Court-coverage speed (a lateral and front-back movement ability proxy; declines with fatigue and lactate)"
  fatigue:
    type: state
    value: 0.0
    unit: "dimensionless"
    bounds: [0.0, 1.0]
    description: "Overall fatigue (rapid accumulation driven by repeated explosive direction changes)"

equations:
  heart_rate_dynamics:
    description: "Heart rate responds to rally intensity and rest interval (Chin 1995: elite play averages about 90% HRmax)"
    condition: true
    priority: 10
    dynamics:
      heart_rate: "min(200, 75 + rally_intensity * 10 - rest_interval * 0.6 + fatigue * 12)"
  vo2_response:
    description: "Oxygen uptake follows rally intensity (Faude 2007: a VO2max demand of about 55-60 mL/kg/min)"
    condition: "rally_intensity > 0"
    priority: 9
    dynamics:
      vo2: "min(65, 8 + rally_intensity * 4.8 - rest_interval * 0.25)"
  lactate_accumulation:
    description: "Lactate accumulates within a game, offset by the rest interval (Faude 2007: rises to 4-6 mmol/L)"
    condition: true
    priority: 8
    dynamics:
      lactate: "min(10, max(1.0, lactate + rally_intensity * 0.028 - rest_interval * 0.05))"
  fatigue_accumulation:
    description: "Fatigue accumulates rapidly, driven by repeated explosive direction changes (offset by the rest interval)"
    condition: true
    priority: 7
    dynamics:
      fatigue: "min(1.0, fatigue + rally_intensity * 0.0015 - rest_interval * 0.0002)"
  court_coverage_decay:
    description: "Court-coverage speed declines with fatigue and lactate (neuromuscular fatigue affects lateral-movement ability)"
    condition: true
    priority: 6
    dynamics:
      court_coverage_speed: "max(0, 100 - fatigue * 40 - max(0, lactate - 3) * 5)"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables:
    - heart_rate
    - vo2
    - lactate
    - court_coverage_speed
    - fatigue
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: rally_intensity
        time_start: "16:00"
        value: 8.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Rally intensity (RPE=8, an elite singles contest)"
      - variable: rest_interval
        time_start: "16:00"
        value: 13.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Between-point rest interval (13 seconds, an elite-competition value)"

optimization:
  method: nsga2
  objectives:
    - variable: court_coverage_speed
      metric: final
      direction: maximize
      description: "Maximizing court-coverage speed retained at the end of the match"
    - variable: fatigue
      metric: final
      direction: minimize
      description: "Minimizing overall fatigue at the end of the match"
  constraints:
    - variable: lactate
      condition: "<= 8.0"
      type: soft
      description: "Keep blood lactate within 8 mmol/L"
    - variable: heart_rate
      condition: "<= 190"
      type: soft
      description: "Keep heart rate within 190 bpm"
  startpoint:
    regimens:
      - variable: rest_interval
        time_start: "16:00"
        time_end: "16:00"
        label: "Between-point rest interval (8-22 seconds)"
        optimize:
          value: [8.0, 22.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 49.7
    pareto_front:
      - {x: [8.0], f: [-58.0, 0.72]}
      - {x: [12.0], f: [-66.0, 0.60]}
      - {x: [13.0], f: [-68.0, 0.55]}
      - {x: [17.0], f: [-75.0, 0.42]}
      - {x: [22.0], f: [-80.0, 0.30]}
    recommended:
      x: [13.0]
      f: [-68.0, 0.55]

references:
  - citation: "Chin MK et al. (1995) Physiological demands of badminton, singles. Br J Sports Med 29(3):153-157."
    description: "Supplies heart-rate and rally-structure data from a singles match, the parameter source for the heart-rate dynamics and rally-intensity mechanism."
  - citation: "Faude O et al. (2007) Physiological characteristics of badminton match play. Eur J Appl Physiol 100(4):479-485."
    description: "Supplies VO2 and lactate-accumulation data from a match, the parameter source for the oxygen-uptake dynamics and lactate-accumulation mechanism."
