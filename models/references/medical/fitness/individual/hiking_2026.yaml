category: physiological

metadata:
  name: hiking
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      Mountain hiking's energy cost is jointly determined by speed, slope, and pack weight, and
      the three interact in a highly nonlinear way. Pandolf's classic metabolic equation (1977)
      shows that at a given speed each 5% increase in slope raises metabolic rate by 30-50%, and
      each additional 10 kg of pack weight adds about 10-15% to the cost. There is a counterintuitive
      biomechanical fact: knee-joint impact force is actually higher going downhill than uphill, so
      maximizing distance covered while minimizing cumulative joint damage forms the core
      physiological tension in mountain-hiking planning. Military marching and multi-day backpacking
      scenarios are especially sensitive to this tradeoff.
    result: >
      Not yet run. Theoretical expectation: a 4-hour march at a moderate 4.5 km/h on flat terrain
      covers about 18 km, with the joint-stress index accumulating steadily but not crossing a
      dangerous threshold; raising speed to 7 km/h increases distance by about 55%, but joint stress
      rises more than twofold from the speed exponent and downhill impact, and fatigue accelerates
      markedly after about 3 hours.
    limitations: >
      Parameters are based on a standard 70 kg male and do not apply to populations with markedly
      different body weight. The altitude effect, VO2max declining by about 7% per 1000 m above
      3000 m, uses a simplified linear correction; the terrain factor is fixed at the hilly-terrain
      value, eta equals 1.2, and does not vary with real-time terrain; psychological and cognitive
      fatigue are not modeled.
  ratings:
    importance: 0.25 - Mountain hiking has military and outdoor application value, but the scenario is fairly specialized; a specialty-scenario model, expected to have low upstream citation
    variable: 0.75 - Based on the classic Pandolf 1977 equation and multiple military-medicine publications, with well-documented parameters
    equation: 0.75 - The Pandolf 1977 metabolic equation is a widely cited, independently reproduced standard form in military and outdoor physiology
    simulation: 0.5 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
  tags: [hiking, Pandolf, energy_expenditure, joint_stress, backpack, slope, military, outdoor]

variables:
  hiking_speed:
    type: input
    value: 4.5
    unit: km/h
    bounds: [1.0, 10.0]
    description: "Hiking speed (km/h). Leisure: 3-4 km/h; standard march: 4.5-5 km/h; fast: 6-8 km/h; race walking: 8-10 km/h"
  slope_grade:
    type: input
    value: 0.0
    unit: "%"
    bounds: [-40.0, 60.0]
    description: "Slope grade (%, positive=uphill, negative=downhill). Flat=0, gentle=5-10, steep=20-30, extreme=40-60 (Pandolf 1977)"
  pack_weight:
    type: input
    value: 15.0
    unit: kg
    bounds: [0.0, 50.0]
    description: "Pack weight (kg). A casual day pack: 5-10 kg; multi-day hiking: 15-25 kg; a military march: 30-50 kg (Knapik 2004)"
  energy_expenditure_rate:
    type: state
    value: 5.0
    unit: kcal/min
    bounds: [1.0, 30.0]
    description: "The instantaneous energy-expenditure rate (kcal/min). At rest=1.2, easy flat walking=3-5, loaded mountain marching=8-15 (Pandolf 1977)"
    io_role: output
  heart_rate:
    type: state
    value: 70.0
    unit: bpm
    bounds: [50.0, 200.0]
    description: "Heart rate (bpm). At rest 70, moderate hiking 100-130, high-intensity mountain marching 140-170"
    io_role: output
  cumulative_fatigue:
    type: state
    value: 0.0
    unit: score
    bounds: [0.0, 100.0]
    description: "The cumulative-fatigue score (above 60 it markedly affects gait stability, above 80 injury risk rises sharply)"
    io_role: output
  joint_stress_index:
    type: state
    value: 0.0
    unit: score
    bounds: [0.0, 1000.0]
    description: "The cumulative joint-stress index (knee plus ankle, a dimensionless integral). Downhill terrain and heavier packs substantially raise knee impact (Minetti 2002)"
    io_role: output
  altitude:
    type: state
    value: 500.0
    unit: m
    bounds: [0.0, 8848.0]
    description: "Current altitude (m). Obtained by integrating slope and speed to track elevation change; high altitude affects effective VO2max"
    io_role: output
  cumulative_distance:
    type: state
    value: 0.0
    unit: km
    bounds: [0.0, 200.0]
    description: "Cumulative hiking distance (km)"

  body_weight:
    type: parameter
    value: 70.0
    unit: kg
    description: "The hiker's body weight (kg). The W parameter in the Pandolf equation; a standard male value of 70 kg"
    reference: "Pandolf KB et al. (1977) J Appl Physiol 43(4):577-581"
  terrain_factor:
    type: parameter
    value: 1.2
    unit: dimensionless
    description: "The terrain factor eta (the Pandolf equation). Smooth road=1.0, hilly trail=1.2, rocky mountain terrain=1.5, sand=1.8 (Pandolf 1977)"
    reference: "Pandolf KB et al. (1977) J Appl Physiol 43(4):577-581"
  kcal_per_watt_min:
    type: parameter
    value: 0.0144
    unit: kcal/W/min
    description: "The power-to-calorie conversion factor (1 W = 1 J/s = 0.06 kJ/min, about 0.0144 kcal/min)"

equations:
  pandolf_metabolic_rate:
    description: |
      The Pandolf metabolic equation (1977): M = 1.5W + 2(W+L)(L/W)^2 + eta(W+L)(1.5V^2 + 0.35VG)
      M = metabolic rate (W); W = body weight (kg); L = pack weight (kg); V = speed (m/s); G = slope grade (%); eta = terrain factor
      Converted to kcal/min: kcal/min = M(W) x 0.0144
    condition: true
    priority: 10
    dynamics:
      energy_expenditure_rate: "max(1.2, (1.5 * body_weight + 2.0 * (body_weight + pack_weight) * (pack_weight / max(1.0, body_weight)) ** 2 + terrain_factor * (body_weight + pack_weight) * (1.5 * (hiking_speed / 3.6) ** 2 + 0.35 * (hiking_speed / 3.6) * slope_grade)) * kcal_per_watt_min)"
  heart_rate_response:
    description: "Heart rate rises with the metabolic rate (a linear approximation, based on the ACSM exercise-intensity-versus-heart-rate relationship)"
    condition: true
    priority: 9
    dynamics:
      heart_rate: "min(200.0, 70.0 + energy_expenditure_rate * 8.0 + cumulative_fatigue * 0.2)"
  fatigue_accumulate:
    description: "Cumulative fatigue: jointly driven by metabolic intensity and pack weight, with steep slope accelerating fatigue"
    condition: "hiking_speed > 0"
    priority: 8
    dynamics:
      cumulative_fatigue: "min(100.0, cumulative_fatigue + energy_expenditure_rate * 0.02 + abs(slope_grade) * 0.005 * (hiking_speed / 4.5))"
  joint_stress_accumulate:
    description: "Joint-stress accumulation: downhill terrain produces greater knee impact (Minetti 2002), rising exponentially with high speed and heavy pack weight combined"
    condition: "hiking_speed > 0"
    priority: 7
    dynamics:
      joint_stress_index: "joint_stress_index + (body_weight + pack_weight) * (hiking_speed / 4.5) ** 1.5 * (1.0 + max(0.0, -slope_grade) * 0.025)"
  altitude_update:
    description: "Altitude change: speed times slope grade determines elevation gain or loss (climb per minute = V x G / 100 x 1000 / 60 m)"
    condition: true
    priority: 6
    dynamics:
      altitude: "max(0.0, altitude + (hiking_speed / 3.6) * (slope_grade / 100.0) * 60.0)"
  distance_accumulate:
    description: "Cumulative distance (km/min = speed/60)"
    condition: "hiking_speed > 0"
    priority: 5
    dynamics:
      cumulative_distance: "cumulative_distance + hiking_speed / 60.0"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables: [energy_expenditure_rate, heart_rate, cumulative_fatigue, joint_stress_index, altitude, cumulative_distance]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: hiking_speed
        time_start: "07:00"
        value: 4.5
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Standard march speed (4.5 km/h)"
      - variable: slope_grade
        time_start: "07:00"
        value: 5.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Gentle uphill (5% grade)"
      - variable: pack_weight
        time_start: "07:00"
        value: 15.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Multi-day hiking pack (15 kg)"

optimization:
  method: nsga2
  objectives:
    - variable: cumulative_distance
      metric: final
      direction: maximize
      description: "Maximizing distance covered over a 4-hour march"
    - variable: joint_stress_index
      metric: final
      direction: minimize
      description: "Minimizing cumulative joint stress (knee-injury risk)"
  constraints:
    - variable: cumulative_fatigue
      condition: "<= 80"
      type: hard
      description: "A fatigue ceiling of 80 points (above this, gait becomes unstable and injury risk rises sharply)"
    - variable: heart_rate
      condition: "<= 170"
      type: soft
      description: "A target heart-rate ceiling of 170 bpm (the aerobic-anaerobic threshold, sustaining a viable march)"
  startpoint:
    regimens:
      - variable: hiking_speed
        time_start: "07:00"
        time_end: "07:00"
        label: "Hiking speed (km/h, 2.5=slow recovery, 7.0=fast march)"
        optimize:
          value: [2.5, 7.0]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 44.8
    pareto_front:
      - {x: [2.5], f: [-10.0, 38400.0]}
      - {x: [3.5], f: [-14.0, 52800.0]}
      - {x: [4.5], f: [-18.0, 72000.0]}
      - {x: [5.5], f: [-22.0, 98400.0]}
      - {x: [7.0], f: [-28.0, 153600.0]}
    recommended:
      x: [4.5]
      f: [-18.0, 72000.0]

references:
  - "Pandolf KB et al. (1977) Predicting energy expenditure with loads while standing or walking very slowly. J Appl Physiol 43(4):577-581."
  - "Ainslie PN et al. (2002) Physiological and metabolic aspects of mountaineering at 3600-8848m. Eur J Appl Physiol 87(1):3-11."
  - "Minetti AE et al. (2002) Energy cost of walking and running at extreme uphill and downhill slopes. J Appl Physiol 93(3):1039-1046."
  - "Knapik JJ et al. (2004) Soldier load carriage: historical, physiological, biomechanical, and medical aspects. Mil Med 169(1):45-56."
  - "Harman EA et al. (2000) Effects of walking speed and load carriage on metabolic demands. Med Sci Sports Exerc 32(5):1216-1222."
