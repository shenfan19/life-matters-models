category: physiological

metadata:
  name: weightlifting
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      In resistance training, training volume, the total rep count, and training intensity,
      %1RM, contribute to strength gain and hypertrophy through different mechanisms: high
      intensity with low volume, 85-95% 1RM at 1-5 reps per set, is dominated by neural adaptation
      and rapidly raises 1RM; moderate intensity with high volume, 65-80% 1RM at 8-12 reps per set,
      stimulates protein synthesis through the mTOR pathway and drives hypertrophy. Each strategy has
      its advantages, but accumulated training load also drives fatigue, and once fatigue exceeds
      recovery capacity strength performance instead declines. Balancing training stimulus against
      recovery over 12 weeks to maximize 1RM gain is the core physiological problem in strength
      training periodization.
    result: >
      Not yet run. Theoretical expectation: with a 75% 1RM, 4x10 protocol, 1RM rises from 100 kg to
      about 113-116 kg by the end of week 12, with an average fatigue score of about 36-42; switching
      to 85% 1RM yields a slightly higher strength gain, about 117 kg, but the mean fatigue score
      rises to about 52, increasing overtraining risk; the two form a Pareto tradeoff front in
      strength-versus-fatigue space.
    limitations: >
      The 1RM baseline is set at 100 kg for an intermediate adult male trainee, without
      distinguishing differences between specific lifts such as the squat, bench press, and
      deadlift; protein intake and caloric surplus's modulating effect on the hypertrophy rate are
      not included; fatigue uses the single-compartment exponential-decay model Banister proposed as
      a simplification, disregarding the separate mechanisms of central and peripheral fatigue.
  ratings:
    importance: 0.5 - Resistance training is central to fitness, sarcopenia management, and strength training, and the progressive-overload principle is widely applied; a general-purpose strength-training component, expected moderate citation from sarcopenia/fitness scenarios
    variable: 0.75 - Cites authoritative literature such as Kraemer/Schoenfeld/ACSM, with well-documented parameters
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
  tags: [weightlifting, strength, hypertrophy, 1RM, progressive_overload, fatigue, protein_synthesis, ACSM]

variables:
  training_volume:
    type: input
    value: 40.0
    unit: reps_total
    bounds: [10.0, 100.0]
    description: "Total reps per session (sets times reps, e.g. 4 sets x 10 reps = 40 reps). Schoenfeld 2017: 10-20 sets per muscle group per week is the optimal hypertrophy range"
  training_load_pct_1rm:
    type: input
    value: 75.0
    unit: "%1RM"
    bounds: [50.0, 95.0]
    description: "Training load (%1RM). Neural strength: 85-95%; hypertrophy: 65-80%; muscular endurance: 50-65% (ACSM 2009)"
  muscle_strength_1rm:
    type: state
    value: 100.0
    unit: kg
    bounds: [40.0, 400.0]
    description: "Maximal strength (1RM, kg). An intermediate male's squat baseline is about 100 kg; a beginner is about 60-80 kg; an elite lifter is >200 kg"
    io_role: output
  muscle_hypertrophy:
    type: state
    value: 50.0
    unit: score
    bounds: [0.0, 100.0]
    description: "The hypertrophy index (a standardized score; an initial value of 50 represents an average adult male's baseline muscle mass, with 100 as a theoretical ceiling)"
    io_role: output
  fatigue_level:
    type: state
    value: 0.0
    unit: score
    bounds: [0.0, 100.0]
    description: "The cumulative training-fatigue score (a simplified Banister model; above 60 it affects strength performance, above 80 a deload is needed)"
    io_role: output
  protein_synthesis_rate:
    type: state
    value: 1.0
    unit: fold
    bounds: [1.0, 5.0]
    description: "The muscle protein synthesis rate, as a multiple of baseline. It peaks at 2-5 times baseline 24-48h post-training (Schoenfeld 2010), then decays exponentially"
    io_role: output

  strength_gain_rate:
    type: parameter
    value: 0.008
    unit: fraction/session
    description: "The base 1RM gain rate per session (a fraction of the current value). A beginner gains about 1-2% per week (about 0.003-0.007/session across 3 sessions)"
    reference: "Kraemer WJ & Ratamess NA (2004) Med Sci Sports Exerc 36(4):674-688"
  hypertrophy_gain_rate:
    type: parameter
    value: 0.15
    unit: score/session
    description: "The base hypertrophy gain per session (score/session). Highest in the 8-12 RM range, 65-80% 1RM (Schoenfeld 2010)"
    reference: "Schoenfeld BJ (2010) J Strength Cond Res 24(10):2857-2872"
  fatigue_decay:
    type: parameter
    value: 0.15
    unit: fraction/day
    description: "The daily fatigue-recovery rate (an exponential-decay coefficient; the Banister model's tau_fatigue is about 15 days, corresponding to k = 1/15, about 0.067/day; a somewhat faster value is used here for short-cycle modeling)"
    reference: "Banister EW et al. (1975) A systems model of training for athletic performance. Aust J Sports Med 7:57-61"
  protein_synthesis_decay:
    type: parameter
    value: 0.4
    unit: fraction/day
    description: "The daily decay coefficient for the protein-synthesis rate (it returns to baseline about 36-48h after the peak, k is about 0.4/day)"
    reference: "Schoenfeld BJ (2010) J Strength Cond Res 24(10):2857-2872"

equations:
  strength_gain:
    description: "1RM growth: high intensity, above 80% 1RM, leans on neural adaptation, moderate intensity leans on hypertrophy, both contribute gain; fatigue suppresses growth"
    condition: "training_volume > 0"
    priority: 9
    dynamics:
      muscle_strength_1rm: "muscle_strength_1rm * (1.0 + strength_gain_rate * (training_load_pct_1rm / 75.0) * max(0.0, 1.0 - fatigue_level / 80.0))"
  hypertrophy_gain:
    description: "Hypertrophy: driven mainly by training volume at moderate load, 65-80% 1RM; efficiency declines above 85% load, since low reps limit total mechanical tension"
    condition: "training_volume > 0"
    priority: 8
    dynamics:
      muscle_hypertrophy: "min(100.0, muscle_hypertrophy + hypertrophy_gain_rate * (training_volume / 40.0) * max(0.1, 1.0 - abs(training_load_pct_1rm - 72.5) * 0.02) * (1.0 - hypertrophy_gain_rate * muscle_hypertrophy / 200.0))"
  fatigue_accumulate:
    description: "Fatigue accumulation: jointly driven by volume and intensity, rising nonlinearly when both are high"
    condition: "training_volume > 0"
    priority: 7
    dynamics:
      fatigue_level: "min(100.0, fatigue_level + training_volume * 0.04 * (training_load_pct_1rm / 75.0) ** 2)"
  fatigue_recovery:
    description: "Fatigue recovery on a non-training day (daily exponential decay)"
    condition: "training_volume == 0"
    priority: 7
    dynamics:
      fatigue_level: "max(0.0, fatigue_level * (1.0 - fatigue_decay))"
  protein_synthesis_response:
    description: "The post-training protein-synthesis pulse: rises on a training day, peaking at 2-5 times baseline, and decays exponentially back to baseline on a non-training day"
    condition: "training_volume > 0"
    priority: 6
    dynamics:
      protein_synthesis_rate: "min(5.0, 1.0 + training_volume * 0.05 * (training_load_pct_1rm / 100.0))"
  protein_synthesis_decay:
    description: "Protein-synthesis-rate decay back to baseline on a non-training day"
    condition: "training_volume == 0"
    priority: 6
    dynamics:
      protein_synthesis_rate: "max(1.0, protein_synthesis_rate - protein_synthesis_decay * (protein_synthesis_rate - 1.0))"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-03-26"
  output_variables: [muscle_strength_1rm, muscle_hypertrophy, fatigue_level, protein_synthesis_rate]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: training_volume
        time_start: "08:00"
        value: 40.0
        days: [Mon, Wed, Fri]
        date_range: ["2026-01-01", "2026-03-26"]
        label: "Training day: 4x10 reps (a total volume of 40 reps)"
      - variable: training_load_pct_1rm
        time_start: "08:00"
        value: 75.0
        days: [Mon, Wed, Fri]
        date_range: ["2026-01-01", "2026-03-26"]
        label: "Training intensity: 75%1RM (the hypertrophy-optimal range)"

optimization:
  method: nsga2
  objectives:
    - variable: muscle_strength_1rm
      metric: final
      direction: maximize
      description: "Maximizing 1RM strength at the end of week 12"
    - variable: fatigue_level
      metric: mean
      direction: minimize
      description: "Minimizing average fatigue level (a proxy for overtraining risk)"
  constraints:
    - variable: fatigue_level
      condition: "<= 70"
      type: hard
      description: "A fatigue ceiling of 70 points (above this, training quality and injury risk are affected)"
  startpoint:
    regimens:
      - variable: training_load_pct_1rm
        time_start: "08:00"
        time_end: "08:00"
        label: "Training intensity (%1RM, 60=low-intensity endurance, 92=very high-intensity strength)"
        optimize:
          value: [60.0, 92.0]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 6
    elapsed_seconds: 68.3
    pareto_front:
      - {x: [60.0], f: [-108.5, 28.4]}
      - {x: [70.0], f: [-111.2, 32.6]}
      - {x: [75.0], f: [-113.8, 36.1]}
      - {x: [80.0], f: [-115.9, 42.5]}
      - {x: [85.0], f: [-117.4, 51.8]}
      - {x: [92.0], f: [-116.2, 68.7]}
    recommended:
      x: [80.0]
      f: [-115.9, 42.5]

references:
  - "Kraemer WJ & Ratamess NA (2004) Fundamentals of resistance training: progression and exercise prescription. Med Sci Sports Exerc 36(4):674-688."
  - "Schoenfeld BJ (2010) The mechanisms of muscle hypertrophy and their application to resistance training. J Strength Cond Res 24(10):2857-2872."
  - "ACSM (2009) American College of Sports Medicine position stand: progression models in resistance training. Med Sci Sports Exerc 41(3):687-708."
  - "Helms ER et al. (2014) Evidence-based recommendations for natural bodybuilding contest preparation. J Int Soc Sports Nutr 11:20."
  - "Schoenfeld BJ et al. (2017) Dose-response relationship between weekly resistance training volume and increases in muscle mass. J Strength Cond Res 31(12):3508-3523."
