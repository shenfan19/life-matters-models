metadata:
  name: swimming
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Swimming is one of the lowest-joint-impact aerobic sports, and its distinctiveness lies in
      the coupling between technical efficiency (stroke efficiency) and fitness. Unlike running,
      where pace is mainly set by cardiorespiratory capacity, swimming speed also depends strongly
      on the propulsive efficiency of each stroke: as fatigue accumulates, neuromuscular control
      precision declines, stroke efficiency decays, and speed and distance fall off at the same
      heart rate. This technique-fitness coupling effect makes swimming an ideal model for studying
      fatigue's effect on athletic technique.
    result: >
      Not yet run. Theoretical expectation: in a 60-minute session at moderate intensity (RPE 5),
      stroke efficiency declines from a baseline of 0.8 to about 0.6-0.7 after 45-60 minutes as
      fatigue accumulates, the technique score falls by about 15-20 points, and swimming distance's
      growth rate slows markedly in the second half. Raising the stroke rate to 45 per minute and
      the intensity to RPE 8 makes efficiency decay noticeably faster after 30 minutes, with overall
      performance falling by about 25%.
    limitations: >
      Does not distinguish the technical characteristics and muscle-group fatigue patterns of
      different strokes such as freestyle, butterfly, and backstroke; environmental factors such as
      water temperature, drag, and 25m versus 50m pool length are not modeled; the heart-rate
      response is adjusted from running parameters, with swimming's characteristic lower heart rate
      (about 10 bpm below running) handled by a constant approximation.
  ratings:
    importance: 0.5 - Swimming is a low-impact aerobic exercise with broad application value in rehabilitation and fitness; one of the most general aerobic-exercise models, usable in rehabilitation scenarios
    variable: 0.5 - Cites publications such as Costill/Toussaint, but the parameter descriptions are fairly brief
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
  tags: [sport, swimming, aerobic, technique, vo2, low_impact]

variables:
  training_intensity:
    type: input
    value: 5.0
    unit: "RPE(0-10)"
    bounds: [0.0, 10.0]
    description: "The rating of perceived exertion"
  stroke_rate:
    type: input
    value: 30.0
    unit: "per minute"
    bounds: [15.0, 60.0]
    description: "Stroke rate (freestyle: 25-35 recreational, 45-60 competitive)"
  stroke_efficiency:
    type: state
    value: 0.8
    unit: "coefficient"
    bounds: [0.1, 1.0]
    description: "Stroke efficiency (the propulsion distance per stroke; declines with fatigue)"
  heart_rate:
    type: state
    value: 70.0
    unit: "bpm"
    bounds: [50.0, 190.0]
    description: "Exercise heart rate (swimming heart rate runs 5-10bpm lower than running)"
  distance:
    type: state
    value: 0.0
    unit: "m"
    bounds: [0.0, 10000.0]
    description: "Cumulative swimming distance"
  calories_burned:
    type: state
    value: 0.0
    unit: "kcal"
    bounds: [0.0, 1500.0]
    description: "Cumulative calories burned (about 400-600kcal/hour)"
  fatigue:
    type: state
    value: 0.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "Muscular fatigue (mainly the upper body; above 60 shows marked technical decline)"
  technique_score:
    type: state
    value: 80.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "A technique score (falls as fatigue distorts the stroke)"
  performance:
    type: state
    value: 100.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "Overall performance (efficiency times fitness)"

equations:
  heart_rate_response:
    description: "Swimming heart rate (about 10bpm lower than running)"
    condition: true
    priority: 10
    dynamics:
      heart_rate: "min(190, 60 + training_intensity * 9 + fatigue * 0.3)"
  distance_accumulate:
    description: "Distance per minute (m) equals stroke rate times efficiency times distance per stroke"
    condition: "training_intensity > 0"
    priority: 9
    dynamics:
      distance: "distance + stroke_rate * stroke_efficiency * 1.8"
  calorie_burn:
    description: "Calories burned (swimming is about 500kcal/h, that is 8.3kcal/min, adjusted by intensity)"
    condition: "training_intensity > 0"
    priority: 8
    dynamics:
      calories_burned: "calories_burned + 5.0 + training_intensity * 0.5"
  fatigue_accumulate:
    description: "Upper-body fatigue accumulation (driven jointly by stroke rate and intensity)"
    condition: "training_intensity > 0"
    priority: 8
    dynamics:
      fatigue: "min(100, fatigue + training_intensity * 0.07 + stroke_rate * 0.001)"
  stroke_efficiency_decay:
    description: "Fatigue lowers stroke efficiency (the core technical-decline mechanism)"
    condition: "fatigue > 30"
    priority: 7
    dynamics:
      stroke_efficiency: "max(0.1, 0.8 - (fatigue - 30) * 0.007)"
  technique_decay:
    description: "The technique score declines with fatigue"
    condition: true
    priority: 7
    dynamics:
      technique_score: "max(0, 80 - fatigue * 0.5)"
  performance_update:
    description: "Overall performance equals efficiency times fitness"
    condition: true
    priority: 6
    dynamics:
      performance: "max(0, stroke_efficiency * 100 * (1 - fatigue * 0.005))"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [heart_rate, distance, stroke_efficiency, calories_burned, fatigue, technique_score, performance]

optimization:
  method: nsga2
  objectives:
    - variable: performance
      metric: final
      direction: maximize
    - variable: technique_score
      metric: mean
      direction: maximize
  constraints:
    - variable: fatigue
      condition: "<= 9.0"
      type: soft
      description: "Perceived fatigue should not exceed 9 (avoiding overtraining)"
  startpoint:
    regimens:
      - variable: training_intensity
        time_start: "07:00"
        time_end: "07:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Training intensity (RPE 0-10)"
        optimize:
          value: [0.0, 10.0]
      - variable: stroke_rate
        time_start: "07:00"
        time_end: "07:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Stroke rate (per minute)"
        optimize:
          value: [15.0, 60.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - "Costill DL et al. (1985) Energy metabolism during front crawl swimming. J Appl Physiol 58(2):397-401."
  - "Toussaint HM & Hollander AP (1994) Energetics of competitive swimming. Sports Med 18(6):384-405."
  - "Mujika I & Padilla S (2001) Physiological and performance characteristics of male professional road cyclists. Eur J Appl Physiol 87(4-5):441-451."
  - "ACSM (2021) ACSM's Guidelines for Exercise Testing and Prescription, 11th ed. Lippincott Williams & Wilkins."
