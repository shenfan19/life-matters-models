metadata:
  name: swimming
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      游泳是关节冲击最低的有氧运动之一，其独特性在于技术效率，即划水效率，与体能的耦合关系。不同于跑步中配速主要由心肺能力决定，游泳速度还强烈依赖每次划水的推进效率：随着疲劳积累，神经肌肉控制精度下降，划水效率衰减，导致同等心率下速度和距离的递减。这一"技术-体能耦合"效应使游泳成为研究疲劳对运动技术影响的理想模型。
    result: >
      仿真尚未运行。理论预期：RPE 5 中等强度训练 60 分钟时，划水效率从基线 0.8 随疲劳积累在 45-60 分钟后降至约 0.6-0.7，技术评分下降约 15-20 分，游泳距离在后半段增速明显放缓。训练频率提升至 45 次/分、强度提升至 RPE 8 时，效率衰减在 30 分钟后明显加速，综合表现下降约 25%。
    limitations: >
      未区分自由泳、蝶泳、仰泳等不同泳姿的技术特征和肌群疲劳模式；水温、水阻以及 25 m 与 50 m 两种泳道长度等环境因素未建模；心率响应基于跑步参数调整，游泳特有的低心率效应，约比跑步低 10 bpm，通过常数近似处理。
  ratings:
    validation_confidence: 2 - 2026-07-22实测--sim(及部分--opt抽查)已可正常跑通，2026-07-27复核nosim/noopt标记已清理（--sim/--opt均可正常跑通），但未与独立文献目标数值比对
    topic_importance: 4 - 游泳是低冲击有氧运动，在康复和健身中有广泛应用价值
    framework_demand: 3 - 最通用有氧运动模型之一，康复场景可用
    evidence_quality: 3 - 引用Costill/Toussaint等文献，但参数description较简略
    popularity: 4 - 游泳是教科书级有氧运动，在运动科学和心肺康复中广泛参考
  tags: [sport, swimming, aerobic, technique, vo2, low_impact]
  references:
    - "Costill DL et al. (1985) Energy metabolism during front crawl swimming. J Appl Physiol 58(2):397-401."
    - "Toussaint HM & Hollander AP (1994) Energetics of competitive swimming. Sports Med 18(6):384-405."
    - "Mujika I & Padilla S (2001) Physiological and performance characteristics of male professional road cyclists. Eur J Appl Physiol 87(4-5):441-451."
    - "ACSM (2021) ACSM's Guidelines for Exercise Testing and Prescription, 11th ed. Lippincott Williams & Wilkins."

variables:
  training_intensity:
    type: input
    value: 5.0
    unit: "RPE(0-10)"
    bounds: [0.0, 10.0]
    description: "运动感知强度"
  stroke_rate:
    type: input
    value: 30.0
    unit: "次/分"
    bounds: [15.0, 60.0]
    description: "划水频率（自由泳：休闲25-35，竞速45-60）"
  stroke_efficiency:
    type: state
    value: 0.8
    unit: "系数"
    bounds: [0.1, 1.0]
    description: "划水效率（每次划水推进距离比；疲劳下降）"
  heart_rate:
    type: state
    value: 70.0
    unit: "bpm"
    bounds: [50.0, 190.0]
    description: "运动心率（游泳心率比跑步低5-10bpm）"
  distance:
    type: state
    value: 0.0
    unit: "m"
    bounds: [0.0, 10000.0]
    description: "累计游泳距离"
  calories_burned:
    type: state
    value: 0.0
    unit: "kcal"
    bounds: [0.0, 1500.0]
    description: "累计热量消耗（约400-600kcal/小时）"
  fatigue:
    type: state
    value: 0.0
    unit: "分"
    bounds: [0.0, 100.0]
    description: "肌肉疲劳（上肢为主；>60技术明显退化）"
  technique_score:
    type: state
    value: 80.0
    unit: "分"
    bounds: [0.0, 100.0]
    description: "技术评分（疲劳导致动作变形降分）"
  performance:
    type: state
    value: 100.0
    unit: "分"
    bounds: [0.0, 100.0]
    description: "综合表现（效率×体能）"

equations:
  heart_rate_response:
    description: "游泳心率（比跑步低约10bpm）"
    condition: true
    priority: 10
    dynamics:
      heart_rate: "min(190, 60 + training_intensity * 9 + fatigue * 0.3)"
  distance_accumulate:
    description: "每分钟游距（m）=划频×效率×单次划水距离"
    condition: "training_intensity > 0"
    priority: 9
    dynamics:
      distance: "distance + stroke_rate * stroke_efficiency * 1.8"
  calorie_burn:
    description: "热量消耗（游泳约500kcal/h=8.3kcal/min，强度调整）"
    condition: "training_intensity > 0"
    priority: 8
    dynamics:
      calories_burned: "calories_burned + 5.0 + training_intensity * 0.5"
  fatigue_accumulate:
    description: "上肢疲劳积累（划水频率和强度共同驱动）"
    condition: "training_intensity > 0"
    priority: 8
    dynamics:
      fatigue: "min(100, fatigue + training_intensity * 0.07 + stroke_rate * 0.001)"
  stroke_efficiency_decay:
    description: "疲劳导致划水效率下降（技术退化核心机制）"
    condition: "fatigue > 30"
    priority: 7
    dynamics:
      stroke_efficiency: "max(0.1, 0.8 - (fatigue - 30) * 0.007)"
  technique_decay:
    description: "技术评分随疲劳下降"
    condition: true
    priority: 7
    dynamics:
      technique_score: "max(0, 80 - fatigue * 0.5)"
  performance_update:
    description: "综合表现=效率×体能"
    condition: true
    priority: 6
    dynamics:
      performance: "max(0, stroke_efficiency * 100 * (1 - fatigue * 0.005))"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [heart_rate, distance, stroke_efficiency, calories_burned, fatigue, technique_score, performance]

optimizer:
  method: nsga2
  objectives:
    - variable: performance
      metric: final
      direction: maximize
    - variable: technique_score
      metric: mean
      direction: maximize
  constraints:
    - variable: fatigue
      condition: "<= 9.0"
      type: soft
      description: "疲劳感不超过9（避免过度训练）"
  startpoint:
    regimens:
      - variable: training_intensity
        time_start: "07:00"
        time_end: "07:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "训练强度（RPE 0-10）"
        optimize:
          value: [0.0, 10.0]
      - variable: stroke_rate
        time_start: "07:00"
        time_end: "07:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "划水频率（次/分）"
        optimize:
          value: [15.0, 60.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
