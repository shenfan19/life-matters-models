category: physiological

metadata:
  name: cycling_indoor
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Indoor power-meter cycling training, exemplified by Spin and Zwift, has as its core
      scientific problem how to use the training stress score (TSS) to quantify each session's
      contribution to long-term aerobic base (CTL) and short-term fatigue (ATL), where CTL is a
      42-day exponentially weighted average and ATL a 7-day exponentially weighted average. Their
      difference, Form = CTL minus ATL, is the key indicator for predicting whether an athlete is in
      peak competitive condition: Form below -20 signals excessive fatigue accumulation, and above
      +10 signals readiness to race. The power zone, divided into Zone 1 through Zone 7, determines
      the TSS accumulation rate, but a high power zone that raises CTL also drives ATL up sharply,
      creating an irreducible physiological tension between training load and freshness.
    result: >
      Not yet run. Theoretical expectation: Zone 2 aerobic-base training, about 60% FTP, steadily
      raises CTL while keeping the ATL increment small, holding Form in a controllable range of -10
      to 0; Zone 4-5 high-intensity training markedly accelerates ATL's rise, dropping Form below -20
      within 1-3 days post-session, requiring a deload week to restore freshness.
    limitations: >
      CTL and ATL are updated with a linear approximation within a single session, which deviates
      from the true daily-update mechanism. FTP is set as a fixed reference value, and the adaptive
      FTP increase that occurs after several weeks of training is not modeled; non-training factors
      that affect recovery rate, such as nutrition and sleep quality, are not included in the model.
  ratings:
    importance: 0.25 - Indoor power-based cycling is an important tool for precise training-load management, and the CTL/ATL framework is widely applied; a specialty training model, with lower generality than a basic physiological model
    variable: 0.75 - Cites authoritative sources such as Coggan/Ronnestad, with a documented TSS/CTL/ATL equation set
    equation: 0.75 - The TSS/CTL/ATL training-load framework is the widely cited Coggan/Ronnestad standard in power-based training
    simulation: 0.5 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
  tags: [cycling, indoor, power_meter, TSS, CTL, ATL, Form, lactate, Zwift, periodization]

variables:
  power_zone:
    type: input
    value: 2.0
    unit: "zone(1-7)"
    bounds: [1.0, 7.0]
    description: "Power zone (Coggan zones: 1=recovery <55%FTP, 2=aerobic 55-75%, 3=tempo 76-90%, 4=lactate threshold 91-105%, 5=VO2max 106-120%, 6=anaerobic >121%, 7=neuromuscular sprint)"
  cadence_rpm:
    type: input
    value: 90.0
    unit: "rpm"
    bounds: [50.0, 130.0]
    description: "Cadence (Coggan recommends 85-95 rpm for aerobic training; a higher cadence lowers muscular stress and raises cardiorespiratory load)"
  heart_rate:
    type: state
    value: 70.0
    unit: "bpm"
    bounds: [50.0, 190.0]
    description: "Heart rate (Zone 2 is about 65-75% HRmax; Zone 5 about 92-97% HRmax; Coggan & Allen 2010)"
  vo2:
    type: state
    value: 10.0
    unit: "mL/kg/min"
    bounds: [5.0, 75.0]
    description: "Oxygen uptake (Zone 2 is about 55-70% VO2max; Zone 5 about 100-120% VO2max; Ronnestad & Mujika 2014)"
  lactate:
    type: state
    value: 1.0
    unit: "mmol/L"
    bounds: [0.5, 14.0]
    description: "Blood lactate (Zone 2 <2 mmol/L, aerobic; Zone 4 about 4 mmol/L, the lactate threshold; Zone 6 >8 mmol/L)"
  tss_accumulated:
    type: state
    value: 0.0
    unit: "TSS"
    bounds: [0.0, 500.0]
    description: "Same-day cumulative TSS (one hour of Zone 1 = 35 TSS; one hour of Zone 4 = 100 TSS; Coggan & Allen 2010)"
  ctl_chronic_load:
    type: state
    value: 50.0
    unit: "TSS/day"
    bounds: [0.0, 150.0]
    description: "CTL, chronic training load (a 42-day exponentially weighted average TSS; reflects aerobic base; Coggan & Allen 2010)"
  atl_acute_load:
    type: state
    value: 50.0
    unit: "TSS/day"
    bounds: [0.0, 200.0]
    description: "ATL, acute training load (a 7-day exponentially weighted average TSS; reflects short-term fatigue; Coggan & Allen 2010)"
  form_index:
    type: state
    value: 0.0
    unit: "TSS/day"
    bounds: [-100.0, 50.0]
    description: "Form, freshness, equals CTL minus ATL (above +10 is fresh and race-ready, -10 to +10 is normal, below -20 is accumulated fatigue; Kuipers 1998)"

equations:
  heart_rate_response:
    description: "Heart rate responds to the power zone (a linear mapping from Coggan zones to %HRmax)"
    condition: true
    priority: 10
    dynamics:
      heart_rate: "min(190, 60 + power_zone * 16 + (cadence_rpm - 90) * 0.2)"
  vo2_response:
    description: "Oxygen uptake follows the power zone (Ronnestad 2014: Zone 4 is about at VO2max, Zone 5 exceeds it)"
    condition: "power_zone > 0"
    priority: 9
    dynamics:
      vo2: "min(75, 10 + power_zone * 8.5 + (cadence_rpm - 90) * 0.15)"
  lactate_dynamics:
    description: "Lactate accumulates above Zone 3, and clears at or below Zone 2 (the Coggan lactate threshold is about Zone 4)"
    condition: "power_zone > 3.0"
    priority: 8
    dynamics:
      lactate: "min(14, lactate + (power_zone - 3) * 0.30)"
  lactate_clearance:
    description: "Lactate gradually clears at Zone 2 or below (predominantly aerobic metabolism)"
    condition: "power_zone <= 3.0"
    priority: 8
    dynamics:
      lactate: "max(0.8, lactate - 0.15)"
  tss_accumulation:
    description: "TSS accumulates per minute by power zone (the Coggan equation: TSS/min = IF^2 x (1/60) x 100; zone IF approximated)"
    condition: "power_zone > 0"
    priority: 7
    dynamics:
      tss_accumulated: "tss_accumulated + (0.3 + (power_zone - 1) * 0.12) * (power_zone / 4.0)"
  ctl_update:
    description: "CTL chronic-load update: a 42-day exponential-decay update (a per-minute step approximation, tau=42 days=60480 minutes)"
    condition: true
    priority: 6
    dynamics:
      ctl_chronic_load: "ctl_chronic_load + (tss_accumulated / 1440.0 - ctl_chronic_load) * (1.0 / 60480.0)"
  atl_update:
    description: "ATL acute-load update: a 7-day exponential-decay update (tau=7 days=10080 minutes)"
    condition: true
    priority: 5
    dynamics:
      atl_acute_load: "atl_acute_load + (tss_accumulated / 1440.0 - atl_acute_load) * (1.0 / 10080.0)"
  form_update:
    description: "Form equals CTL minus ATL (Kuipers 1998: Form >+10 is race-ready, <-20 needs a deload)"
    condition: true
    priority: 4
    dynamics:
      form_index: "ctl_chronic_load - atl_acute_load"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables:
    - heart_rate
    - vo2
    - lactate
    - tss_accumulated
    - ctl_chronic_load
    - atl_acute_load
    - form_index
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: power_zone
        time_start: "06:30"
        value: 2.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Zone 2 aerobic-base training (55-75% FTP)"
      - variable: cadence_rpm
        time_start: "06:30"
        value: 90.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Cadence (90 rpm, the optimal aerobic-efficiency range)"

optimization:
  method: nsga2
  objectives:
    - variable: form_index
      metric: final
      direction: maximize
      description: "Maximizing the Form index (post-training freshness)"
    - variable: atl_acute_load
      metric: final
      direction: minimize
      description: "Minimizing ATL acute load (controlling short-term fatigue accumulation)"
  constraints:
    - variable: lactate
      condition: "<= 6.0"
      type: soft
      description: "Keep blood lactate within 6 mmol/L (predominantly aerobic training)"
    - variable: heart_rate
      condition: "<= 180"
      type: soft
      description: "Keep heart rate within 180 bpm (the Zone 5 ceiling)"
  startpoint:
    regimens:
      - variable: power_zone
        time_start: "06:30"
        time_end: "06:30"
        label: "Power zone (Zone 1-5, aerobic through VO2max range)"
        optimize:
          value: [1.0, 5.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 44.6
    pareto_front:
      - {x: [1.0], f: [-1.2, 50.1]}
      - {x: [2.0], f: [-0.8, 50.3]}
      - {x: [3.0], f: [-0.3, 50.6]}
      - {x: [4.0], f: [0.4, 51.2]}
      - {x: [5.0], f: [1.5, 52.3]}
    recommended:
      x: [2.0]
      f: [-0.8, 50.3]

references:
  - "Coggan AR & Allen H (2010) Training and Racing with a Power Meter, 2nd ed. VeloPress, Boulder, CO."
  - "Ronnestad BR & Mujika I (2014) Optimizing strength training for running and cycling endurance performance: A review. Scand J Med Sci Sports 24(4):603-612."
  - "Kuipers H (1998) Training and overtraining: An introduction. Med Sci Sports Exerc 30(7):1137-1139."
