metadata:
  name: running
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Running is the most popular aerobic endurance sport, and its physiological response centers on
      the relationship between pace and metabolic load. Based on Daniels' running equations, VO2
      increases nonlinearly with pace, and once it passes the lactate threshold (around RPE 6-7,
      lactate 2-4 mmol/L), lactate accumulates rapidly, accelerating fatigue and degrading
      performance. Choosing the optimal pace within a 60-minute training session, one that produces
      enough aerobic training stimulus without excessive fatigue from too-high lactate, is a classic
      physiological problem in running training prescription.
    result: >
      A 60-minute simulation of three plans: a recovery jog (RPE=2, 9 min/km) keeps heart rate around
      86-89 bpm, with fatigue rising only to about 9.8 and performance staying at 94.1; a standard
      plan (RPE=5, 6 min/km) raises fatigue to 25.5 and drops performance to 84.7; a threshold-
      intensity plan (RPE=8, 4.5 min/km) sends lactate soaring to 18.5 mmol/L, far past the
      4 mmol/L threshold zone, with fatigue reaching 42.3 and performance collapsing from 100 to 2.1
      by the end of 60 minutes, consistent with the expectation that high-intensity performance
      declines markedly after 40-50 minutes. All three plans together show the pace-lactate-fatigue-
      performance coupling mechanism behaving as expected in direction. Optimization (NSGA-II,
      7 solutions) produces a tradeoff between calories burned and fatigue accumulation: pace
      converges uniformly to the fastest allowed value, 3 min/km, since pace has no direct effect on
      fatigue and so carries no cost, while training intensity ranges from 0 to about RPE=7.05,
      corresponding to calories from 1200 to 1623 kcal and fatigue from 0 to 36.8.
    limitations: >
      The parameters are based on a 70 kg adult male and do not apply to a population with
      substantially different body weight or aerobic capacity. Environmental factors such as
      temperature, gradient, and altitude are not included; the fatigue model does not distinguish
      neurally driven central fatigue from muscle-driven peripheral fatigue; the fatigue equation
      does not depend on pace, so pace stays at its fastest value throughout the optimization front,
      not reflecting the real constraint that pace itself also carries a cost.
  ratings:
    importance: 0.5 - Running is the most popular aerobic sport, and pace-heart-rate-lactate kinetics are core to sports medicine; the most general aerobic-exercise model, expected to be used by several scenarios
    variable: 0.75 - Cites classic sources such as Daniels' equations and ACSM guidelines, with traceable parameters
    equation: 0.75 - Daniels' running equations are the most common benchmark model in exercise-science textbooks, widely cited and independently reproduced
    simulation: 0.5 - Confirmed runnable on 2026-07-22, with both --sim and --opt running normally (opt reaches 100% feasible after generation 1), but not yet compared against an independent literature target value
    optimization: 0.5 - Calories burned and fatigue accumulation show a genuine tradeoff front, but pace converges to its boundary value since it does not affect fatigue, not reflecting pace's own cost
    confidence: 0.25 - Runs normally, but not yet compared against an independent literature target value
  tags: [sport, running, aerobic, endurance, VO2max, Daniels, lactate]

variables:
  training_intensity:
    type: input
    value: 5.0
    unit: "RPE(0-10)"
    bounds: [0.0, 10.0]
    description: "The rating of perceived exertion (5=moderate aerobic, 7=lactate threshold, 9=very heavy)"
  pace:
    type: input
    value: 6.0
    unit: "min/km"
    bounds: [3.0, 15.0]
    description: "Running pace (3=elite, 6=moderate aerobic, 10=recovery jog)"
  heart_rate:
    type: state
    value: 70.0
    unit: "bpm"
    bounds: [50.0, 200.0]
    description: "Exercise heart rate"
  vo2:
    type: state
    value: 10.0
    unit: "mL/kg/min"
    bounds: [5.0, 80.0]
    description: "Oxygen uptake (resting=5, maximal aerobic=50-70)"
  distance:
    type: state
    value: 0.0
    unit: "km"
    bounds: [0.0, 100.0]
    description: "Cumulative running distance"
  calories_burned:
    type: state
    value: 0.0
    unit: "kcal"
    bounds: [0.0, 3000.0]
    description: "Cumulative calories burned"
  fatigue:
    type: state
    value: 0.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "Muscular and cardiorespiratory fatigue (above 70 affects pace, above 90 requires stopping)"
  lactate:
    type: state
    value: 1.0
    unit: "mmol/L"
    bounds: [0.5, 20.0]
    description: "Blood lactate (under 2 is the aerobic zone, 2-4 the threshold zone, above 4 the anaerobic zone)"
  performance:
    type: state
    value: 100.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "A performance coefficient (suppressed by fatigue and lactate)"

equations:
  heart_rate_response:
    description: "Heart rate rises with pace and intensity, with fatigue adding to cardiac load"
    condition: true
    priority: 10
    dynamics:
      heart_rate: "min(200, 70 + (10 - pace) * 8 + training_intensity * 4 + fatigue * 0.3)"
  vo2_update:
    description: "Oxygen uptake rises with pace (a simplification of Daniels' equations)"
    condition: "training_intensity > 0"
    priority: 9
    dynamics:
      vo2: "min(80, 3.5 + (10 - pace) * 6 + training_intensity * 2.5)"
  distance_accumulate:
    description: "Distance accumulated each minute (km)"
    condition: "training_intensity > 0"
    priority: 8
    dynamics:
      distance: "distance + (1.0 / max(1.0, pace))"
  calorie_burn:
    description: "Calories burned (about 60kcal/km, with an intensity bonus)"
    condition: "training_intensity > 0"
    priority: 8
    dynamics:
      calories_burned: "calories_burned + (1.0 / max(1.0, pace)) * 60 * (1 + training_intensity * 0.05)"
  fatigue_accumulate:
    description: "Fatigue accumulates with intensity, accelerating nonlinearly at a high intensity"
    condition: "training_intensity > 0"
    priority: 7
    dynamics:
      fatigue: "min(100, fatigue + training_intensity * 0.08 * (1 + fatigue * 0.005))"
  lactate_dynamics:
    description: "Lactate accumulates rapidly above the threshold intensity"
    condition: true
    priority: 7
    dynamics:
      lactate: "max(0.5, min(20, lactate + (training_intensity - 6) * 0.15))"
  performance_update:
    description: "Performance is suppressed by both fatigue and high lactate"
    condition: true
    priority: 6
    dynamics:
      performance: "max(0, 100 - fatigue * 0.6 - max(0, lactate - 4) * 5)"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables: [heart_rate, vo2, distance, calories_burned, fatigue, lactate, performance]
  # A 60-minute continuous training session: a sustained interval, 07:00~08:00. Both
  # training_intensity/pace are read directly as instantaneous values in the equations
  # (heart_rate_response/vo2_update, etc.), not accumulated over time, a "constant level"
  # semantics, using delivery: level (ADR 0132), so value is directly the target reading with
  # no need to multiply by N_steps.
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: training_intensity
        time_start: "07:00"
        time_end: "08:00"
        value: 5.0
        delivery: level
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Moderate aerobic intensity running (RPE=5, about 6 min/km, 60 minutes)"
      - variable: pace
        time_start: "07:00"
        time_end: "08:00"
        value: 6.0
        delivery: level
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "A pace of 6 min/km (the moderate aerobic zone, 60 minutes)"

  - id: recovery_jog
    label: "A recovery jog (a low-intensity control)"
    regimens:
      - variable: training_intensity
        time_start: "07:00"
        time_end: "08:00"
        value: 2.0
        delivery: level
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "A recovery jog (RPE=2, about 9 min/km, 60 minutes)"
      - variable: pace
        time_start: "07:00"
        time_end: "08:00"
        value: 9.0
        delivery: level
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "A pace of 9 min/km (the recovery zone, 60 minutes)"

  - id: threshold_intervals
    label: "Lactate-threshold intensity (a high-intensity control)"
    regimens:
      - variable: training_intensity
        time_start: "07:00"
        time_end: "08:00"
        value: 8.0
        delivery: level
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Threshold-intensity running (RPE=8, about 4.5 min/km, 60 minutes)"
      - variable: pace
        time_start: "07:00"
        time_end: "08:00"
        value: 4.5
        delivery: level
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "A pace of 4.5 min/km (the threshold/anaerobic zone, 60 minutes)"

optimization:
  method: nsga2
  # Originally used performance(final) as a maximize objective, but within one 60-minute
  # training session, performance can only decline monotonically from its baseline of 100
  # (with no long-term adaptation effect to show), creating no real conflict with
  # fatigue(minimize) and letting "zero intensity" become trivially optimal on both, degenerating
  # the Pareto front to a single point. Changed to calories_burned (the training benefit, rising
  # monotonically with intensity) competing against fatigue, forming this model's real
  # train-harder-versus-get-more-tired tradeoff.
  objectives:
    - variable: calories_burned
      metric: final
      direction: maximize
      description: "Maximizing the cumulative calories burned at the end of 60 minutes (the training benefit)"
    - variable: fatigue
      metric: final
      direction: minimize
      description: "Minimizing fatigue accumulation at the end of 60 minutes"
  constraints:
    - variable: lactate
      condition: "<= 10.0"
      type: hard
      description: "Blood lactate should not exceed 10 mmol/L (a safety ceiling)"
    - variable: fatigue
      condition: "<= 80.0"
      type: soft
      description: >
        Perceived fatigue should not exceed 80 (per fatigue's own documentation: above 70 starts
        affecting pace, above 90 requires stopping; the original threshold of 9.0 did not match the
        0-100 scale and has been corrected to the critical value the variable's own description
        states).
  startpoint:
    regimens:
      - variable: training_intensity
        time_start: "07:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Training intensity (RPE 0-10, delivery: level, a constant level not split)"
        delivery: level
        optimize:
          value: [0.0, 10.0]
      - variable: pace
        time_start: "07:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Pace (min/km, delivery: level, a constant level not split)"
        delivery: level
        optimize:
          value: [3.0, 15.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-07-06"
    method: nsga2
    n_solutions: 7
    elapsed_seconds: 28.4
    pareto_front:
      - {x: [0.0, 180.0], f: [-1199.91, 0.00]}
      - {x: [81.5, 180.0], f: [-1281.44, 6.63]}
      - {x: [178.6, 180.0], f: [-1378.57, 14.80]}
      - {x: [233.2, 180.0], f: [-1433.16, 19.53]}
      - {x: [287.6, 180.0], f: [-1487.62, 24.36]}
      - {x: [358.5, 180.0], f: [-1558.38, 30.80]}
      - {x: [423.0, 180.0], f: [-1622.87, 36.81]}
    recommended:
      x: [233.2, 180.0]
      f: [-1433.16, 19.53]

references:
  - "Daniels J (2014) Daniels' Running Equation, 3rd ed. Human Kinetics, Champaign, IL."
  - "Borg G (1998) Borg's Perceived Exertion and Pain Scales. Human Kinetics, Champaign, IL."
  - "Weltman A et al. (1990) The lactate threshold is a valid indicator of endurance performance. J Sports Med Phys Fitness 30(2):212-218."
  - "ACSM (2021) ACSM's Guidelines for Exercise Testing and Prescription, 11th ed. Lippincott Williams & Wilkins."
  - "Wilmore JH, Costill DL, Kenney WL (2008) Physiology of Sport and Exercise, 4th ed. Human Kinetics."
