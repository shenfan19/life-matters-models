metadata:
  name: running
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      跑步是最普及的有氧耐力运动，其生理响应的核心在于配速与代谢负荷的关系。基于 Daniels 跑步方程，VO2 随配速非线性增加，当超过乳酸阈值，约 RPE 6-7、乳酸 2-4 mmol/L，后乳酸快速积累，导致疲劳加速和运动表现下降。如何在 60 分钟训练课内选择既能产生足够有氧训练刺激、又不因乳酸过高导致疲劳过度积累的最佳配速，是跑步训练处方的经典生理问题。
    result: >
      三方案 60 分钟仿真：恢复慢跑，RPE=2、9 min/km，心率维持约 86-89 bpm，疲劳仅升至约 9.8，表现保持 94.1；标准方案，RPE=5、6 min/km，疲劳升至 25.5，表现降至 84.7；阈值强度方案，RPE=8、4.5 min/km，乳酸飙升至 18.5 mmol/L，远超 4 mmol/L 阈值区，疲劳达 42.3，表现在 60 分钟末从 100 分崩溃至 2.1 分，与高强度下表现在 40-50 分钟后明显下降的预期一致。三方案共同显示配速-乳酸-疲劳-表现耦合机制的方向符合预期。优化（NSGA-II，7 解）给出消耗热量与疲劳积累的权衡：配速统一收敛至最快允许值 3 min/km，因配速不直接影响疲劳而无代价；训练强度从 0 到 RPE≈7.05 对应热量 1200 到 1623 kcal、疲劳 0 到 36.8。
    limitations: >
      参数基于 70 kg 成年男性，不适用于体重或有氧能力差异较大的人群。未包含气温、坡度、海拔等环境因素；疲劳模型未区分神经主导的中枢疲劳与肌肉主导的外周疲劳机制；fatigue 方程不依赖 pace，故优化前沿中配速恒为最快值，未体现配速本身也有代价的真实约束。
  ratings:
    importance: 0.5 - 跑步是最普及的有氧运动，配速-心率-乳酸动力学是运动医学核心；最通用有氧运动模型，被多个场景使用预期
    variable: 0.75 - 引用Daniels方程/ACSM指南等经典来源，参数有据可查
    equation: 0.75 - Daniels跑步方程是运动科学教科书最常见基准模型，被广泛引用且独立复现
    simulation: 0.5 - 2026-07-22实测--sim与--opt均可正常跑通(opt在gen1后即100%feasible)，但未与独立文献目标数值比对
    optimization: 0.5 - 消耗热量与疲劳积累呈现真实权衡前沿，但配速因不影响疲劳而收敛至边界值，未体现配速本身的代价
    confidence: 0.25 - 可正常跑通，但未与独立文献目标数值比对
  tags: [sport, running, aerobic, endurance, VO2max, Daniels, lactate]

variables:
  training_intensity:
    type: input
    value: 5.0
    unit: "RPE(0-10)"
    bounds: [0.0, 10.0]
    description: "运动感知强度（5=中等有氧，7=乳酸阈值，9=极重）"
  pace:
    type: input
    value: 6.0
    unit: "min/km"
    bounds: [3.0, 15.0]
    description: "跑步配速（3=精英，6=中等有氧，10=慢跑恢复）"
  heart_rate:
    type: state
    value: 70.0
    unit: "bpm"
    bounds: [50.0, 200.0]
    description: "运动心率"
  vo2:
    type: state
    value: 10.0
    unit: "mL/kg/min"
    bounds: [5.0, 80.0]
    description: "摄氧量（安静=5，最大有氧=50-70）"
  distance:
    type: state
    value: 0.0
    unit: "km"
    bounds: [0.0, 100.0]
    description: "累计跑步距离"
  calories_burned:
    type: state
    value: 0.0
    unit: "kcal"
    bounds: [0.0, 3000.0]
    description: "累计热量消耗"
  fatigue:
    type: state
    value: 0.0
    unit: "分"
    bounds: [0.0, 100.0]
    description: "肌肉与心肺疲劳（>70影响配速，>90需停止）"
  lactate:
    type: state
    value: 1.0
    unit: "mmol/L"
    bounds: [0.5, 20.0]
    description: "血乳酸（<2=有氧区，2-4=阈值区，>4=无氧区）"
  performance:
    type: state
    value: 100.0
    unit: "分"
    bounds: [0.0, 100.0]
    description: "运动表现系数（受疲劳和乳酸抑制）"

equations:
  heart_rate_response:
    description: "心率随配速和强度升高，疲劳加重心脏负担"
    condition: true
    priority: 10
    dynamics:
      heart_rate: "min(200, 70 + (10 - pace) * 8 + training_intensity * 4 + fatigue * 0.3)"
  vo2_update:
    description: "摄氧量随配速升高（Daniels方程简化）"
    condition: "training_intensity > 0"
    priority: 9
    dynamics:
      vo2: "min(80, 3.5 + (10 - pace) * 6 + training_intensity * 2.5)"
  distance_accumulate:
    description: "每分钟累计距离（km）"
    condition: "training_intensity > 0"
    priority: 8
    dynamics:
      distance: "distance + (1.0 / max(1.0, pace))"
  calorie_burn:
    description: "热量消耗（约60kcal/km，强度系数加成）"
    condition: "training_intensity > 0"
    priority: 8
    dynamics:
      calories_burned: "calories_burned + (1.0 / max(1.0, pace)) * 60 * (1 + training_intensity * 0.05)"
  fatigue_accumulate:
    description: "疲劳随强度积累，高强度非线性加速"
    condition: "training_intensity > 0"
    priority: 7
    dynamics:
      fatigue: "min(100, fatigue + training_intensity * 0.08 * (1 + fatigue * 0.005))"
  lactate_dynamics:
    description: "乳酸在阈值强度以上快速积累"
    condition: true
    priority: 7
    dynamics:
      lactate: "max(0.5, min(20, lactate + (training_intensity - 6) * 0.15))"
  performance_update:
    description: "运动表现受疲劳和高乳酸双重抑制"
    condition: true
    priority: 6
    dynamics:
      performance: "max(0, 100 - fatigue * 0.6 - max(0, lactate - 4) * 5)"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables: [heart_rate, vo2, distance, calories_burned, fatigue, lactate, performance]
  # 60分钟持续训练课：sustained 区间 07:00~08:00。training_intensity/pace 在方程里都是被当
  # 瞬时读数直接用（heart_rate_response/vo2_update 等），不随时间累加，属于"恒定水平"语义，
  # 用 delivery: level（ADR 0132）——value 直接就是目标读数，不需要再乘 N_steps。
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: training_intensity
        time_start: "07:00"
        time_end: "08:00"
        value: 5.0
        delivery: level
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "中等有氧强度跑步（RPE=5，约6 min/km，60分钟）"
      - variable: pace
        time_start: "07:00"
        time_end: "08:00"
        value: 6.0
        delivery: level
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "配速6分/公里（中等有氧区，60分钟）"

  - id: recovery_jog
    label: "恢复慢跑（低强度对照）"
    regimens:
      - variable: training_intensity
        time_start: "07:00"
        time_end: "08:00"
        value: 2.0
        delivery: level
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "恢复性慢跑（RPE=2，约9 min/km，60分钟）"
      - variable: pace
        time_start: "07:00"
        time_end: "08:00"
        value: 9.0
        delivery: level
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "配速9分/公里（恢复区，60分钟）"

  - id: threshold_intervals
    label: "乳酸阈值强度（高强度对照）"
    regimens:
      - variable: training_intensity
        time_start: "07:00"
        time_end: "08:00"
        value: 8.0
        delivery: level
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "阈值强度跑步（RPE=8，约4.5 min/km，60分钟）"
      - variable: pace
        time_start: "07:00"
        time_end: "08:00"
        value: 4.5
        delivery: level
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "配速4.5分/公里（阈值/无氧区，60分钟）"

optimization:
  method: nsga2
  # 原用 performance(final) 作为 maximize 目标：60分钟单次训练课内 performance 只会
  # 从基线100单调下降（无长期适应效应可体现），与 fatigue(minimize) 无真实冲突，
  # 导致"零强度"trivially同时最优、Pareto前沿退化为单点。改为 calories_burned（训练收益，
  # 随强度单调增加）与 fatigue 竞争，二者构成本模型实际的"练多狠 vs 多累"权衡。
  objectives:
    - variable: calories_burned
      metric: final
      direction: maximize
      description: "最大化60分钟末累计消耗热量（训练收益）"
    - variable: fatigue
      metric: final
      direction: minimize
      description: "最小化60分钟末疲劳积累"
  constraints:
    - variable: lactate
      condition: "<= 10.0"
      type: hard
      description: "血乳酸不超过10 mmol/L（安全上限）"
    - variable: fatigue
      condition: "<= 80.0"
      type: soft
      description: >
        疲劳感不超过80（fatigue自身文档：>70开始影响配速，>90需停止；原阈值9.0与0-100量表不符，
        已按变量自身描述的臨界值改正）。
  startpoint:
    regimens:
      - variable: training_intensity
        time_start: "07:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "训练强度（RPE 0-10，delivery: level，恒定水平不摊分）"
        delivery: level
        optimize:
          value: [0.0, 10.0]
      - variable: pace
        time_start: "07:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "配速（min/km，delivery: level，恒定水平不摊分）"
        delivery: level
        optimize:
          value: [3.0, 15.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-07-06"
    method: nsga2
    n_solutions: 7
    elapsed_seconds: 28.4
    pareto_front:
      - {x: [0.0, 180.0], f: [-1199.91, 0.00]}
      - {x: [81.5, 180.0], f: [-1281.44, 6.63]}
      - {x: [178.6, 180.0], f: [-1378.57, 14.80]}
      - {x: [233.2, 180.0], f: [-1433.16, 19.53]}
      - {x: [287.6, 180.0], f: [-1487.62, 24.36]}
      - {x: [358.5, 180.0], f: [-1558.38, 30.80]}
      - {x: [423.0, 180.0], f: [-1622.87, 36.81]}
    recommended:
      x: [233.2, 180.0]
      f: [-1433.16, 19.53]

references:
  - "Daniels J (2014) Daniels' Running Equation, 3rd ed. Human Kinetics, Champaign, IL."
  - "Borg G (1998) Borg's Perceived Exertion and Pain Scales. Human Kinetics, Champaign, IL."
  - "Weltman A et al. (1990) The lactate threshold is a valid indicator of endurance performance. J Sports Med Phys Fitness 30(2):212-218."
  - "ACSM (2021) ACSM's Guidelines for Exercise Testing and Prescription, 11th ed. Lippincott Williams & Wilkins."
  - "Wilmore JH, Costill DL, Kenney WL (2008) Physiology of Sport and Exercise, 4th ed. Human Kinetics."
