category: physiological

metadata:
  name: triathlon
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      An Olympic-distance triathlon consists of a 1.5 km swim, a 40 km bike, and a 10 km run, a
      sustained endurance contest spanning three sport modes, whose central physiological challenge
      is the cross-discipline allocation of glycogen: the bike leg sustained above the aerobic
      threshold for 40-70 minutes depletes muscle glycogen substantially, and once glycogen stores
      fall below about 20 g the athlete is forced into a sharp pace decline, the so-called "bonk"
      effect. Swim-leg intensity affects the starting physiological state entering the bike, every
      extra gram of glycogen the bike leg burns per minute directly crowds out the run leg's energy
      supply, and the three legs' pacing forms a tightly coupled cross-discipline resource-allocation
      problem, a classic scenario for modeling bonk risk in competitive sport.
    result: >
      Not yet run. Theoretical expectation: with a pacing combination of 72% threshold intensity for
      the swim, 78% for the bike, and 75% for the run, total finish time is about 127 minutes, with
      a finish-line glycogen store of about 148 g, within the safe range; raising bike-leg intensity
      above 86% drops the run-leg glycogen store to 40-80 g, markedly raising bonk risk.
    limitations: >
      Parameters are based on a 70 kg male amateur triathlete, with a fixed 2-minute transition time
      between legs. The effect of in-race carbohydrate-supplementation strategy on glycogen stores is
      not included; psychological factors such as pain tolerance and pacing-perception error are not
      modeled; the accumulation and transfer of sport-specific muscle fatigue across the three
      disciplines is not distinguished by muscle group.
  ratings:
    importance: 0.25 - Integrating multiple sport modes in triathlon is an important exercise-physiology research direction; it combines several sports but is highly specialized, expected to have low upstream citation
    variable: 0.75 - Cites authoritative literature such as Hausswirth/O'Toole, with a documented glycogen-pacing model
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
  tags: [triathlon, olympic, swim, bike, run, glycogen, fatigue, bonk, pacing, energy_system]

variables:
  current_sport:
    type: input
    value: 0.0
    unit: "0=swim,1=bike,2=run"
    bounds: [0.0, 2.0]
    description: "The current discipline (0=swim, 1=bike, 2=run). The YAML schedule switches disciplines in time order"
  intensity_pct_threshold:
    type: input
    value: 75.0
    unit: "%threshold"
    bounds: [50.0, 105.0]
    description: "Current intensity (% of threshold power/pace). 70%=easy aerobic, 85%=moderate-to-high intensity, 100%=an all-out race effort"
  energy_stores_glycogen:
    type: state
    value: 450.0
    unit: g
    bounds: [0.0, 600.0]
    description: "Glycogen stores (g). A trained athlete's liver plus muscle glycogen is about 400-500g (Jeukendrup 2001); the bonk threshold is <20g"
    io_role: output
  energy_stores_fat:
    type: state
    value: 8000.0
    unit: g
    bounds: [1000.0, 30000.0]
    description: "Fat stores (g). An average adult male has about 12-15 kg (15-20% body fat); about 8-10 kg is exercise-available fat"
    io_role: output
  heart_rate:
    type: state
    value: 65.0
    unit: bpm
    bounds: [50.0, 210.0]
    description: "Heart rate (bpm). Swimming is about 155-170, biking 150-165, running, after fatigue, 160-175"
    io_role: output
  fatigue_accumulated:
    type: state
    value: 0.0
    unit: score
    bounds: [0.0, 100.0]
    description: "Cumulative cross-discipline fatigue (above 40 it starts affecting running efficiency, above 70 pace declines markedly)"
    io_role: output
  race_time_elapsed:
    type: state
    value: 0.0
    unit: minutes
    bounds: [0.0, 300.0]
    description: "Elapsed race time (minutes). The final value is the total finish time"
    io_role: output

  glycogen_burn_rate_base:
    type: parameter
    value: 2.5
    unit: g/min
    description: "The baseline glycogen-burn rate (g/min, at 80% threshold intensity). Running is about 2.5-3.5 g/min, biking about 1.8-2.5 g/min (Jeukendrup 2001)"
    reference: "Jeukendrup AE & Martin J (2001) Sports Med 31(7):559-569"
  fat_burn_rate_base:
    type: parameter
    value: 0.6
    unit: g/min
    description: "The baseline fat-burn rate (g/min, at 70% threshold intensity). Predominantly aerobic effort is about 0.5-1.0 g/min; high intensity uses almost no fat"
    reference: "O'Toole ML & Douglas PS (1995) Sports Med 19(4):251-267"
  sport_metabolic_factor:
    type: parameter
    value: 1.0
    unit: dimensionless
    description: "The discipline metabolic factor (swim=0.85, lower due to water buoyancy; bike=1.0; run=1.15, higher due to body-weight support)"

equations:
  glycogen_depletion:
    description: "Glycogen depletion: high intensity, above 80% threshold, relies mainly on glycogen; fat's contribution rises as intensity falls, an energy-system switch"
    condition: "intensity_pct_threshold > 0"
    priority: 10
    dynamics:
      energy_stores_glycogen: "max(0.0, energy_stores_glycogen - glycogen_burn_rate_base * (intensity_pct_threshold / 80.0) ** 2.5 * sport_metabolic_factor)"
  fat_depletion:
    description: "Fat depletion: the main energy source at low aerobic intensity, nearly halted at high intensity, fat-utilization rate declines linearly as intensity rises"
    condition: "intensity_pct_threshold > 0"
    priority: 9
    dynamics:
      energy_stores_fat: "max(0.0, energy_stores_fat - fat_burn_rate_base * max(0.0, 1.0 - (intensity_pct_threshold - 60.0) * 0.025) * sport_metabolic_factor)"
  heart_rate_response:
    description: "Heart-rate response: based on intensity and accumulated fatigue; the run leg, sport 2, typically shows a higher heart rate after the transition"
    condition: true
    priority: 8
    dynamics:
      heart_rate: "min(210.0, 65.0 + intensity_pct_threshold * 1.4 + fatigue_accumulated * 0.3 + current_sport * 3.0)"
  fatigue_accumulate:
    description: "Fatigue accumulation: jointly driven by intensity, discipline, run greater than bike greater than swim, and glycogen level, accelerating as glycogen runs low"
    condition: "intensity_pct_threshold > 0"
    priority: 7
    dynamics:
      fatigue_accumulated: "min(100.0, fatigue_accumulated + (intensity_pct_threshold / 75.0) * 0.08 * (1.0 + current_sport * 0.15) * (1.0 + max(0.0, 100.0 - energy_stores_glycogen) * 0.005))"
  race_time_progress:
    description: "Race-time accumulation (+1 per minute)"
    condition: true
    priority: 5
    dynamics:
      race_time_elapsed: "race_time_elapsed + 1.0"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables: [energy_stores_glycogen, energy_stores_fat, heart_rate, fatigue_accumulated, race_time_elapsed]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: current_sport
        time_start: "07:00"
        value: 0.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Swim leg (1.5km, about 20 minutes)"
      - variable: intensity_pct_threshold
        time_start: "07:00"
        value: 72.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Swim intensity (72% threshold, energy-conserving)"
      - variable: current_sport
        time_start: "07:20"
        value: 1.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Transition T1, then the bike leg (40km, about 70 minutes)"
      - variable: intensity_pct_threshold
        time_start: "07:20"
        value: 78.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Bike intensity (78% threshold, moderate)"
      - variable: current_sport
        time_start: "08:30"
        value: 2.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Transition T2, then the run leg (10km, about 40 minutes)"
      - variable: intensity_pct_threshold
        time_start: "08:30"
        value: 75.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Run intensity (75% threshold, controlling glycogen use)"

optimization:
  method: nsga2
  objectives:
    - variable: race_time_elapsed
      metric: final
      direction: minimize
      description: "Minimizing total finish time (minutes)"
    - variable: energy_stores_glycogen
      metric: final
      direction: maximize
      description: "Maximizing the finish-line glycogen store (preventing bonk, preserving reserve)"
  constraints:
    - variable: energy_stores_glycogen
      condition: ">= 20"
      type: hard
      description: "Bonk protection: glycogen should not fall below 20g (below this a forced slowdown occurs, affecting the finish)"
    - variable: heart_rate
      condition: "<= 195"
      type: hard
      description: "A heart-rate safety ceiling of 195 bpm"
  startpoint:
    regimens:
      - variable: intensity_pct_threshold
        time_start: "07:00"
        time_end: "07:00"
        label: "Swim-leg intensity (% threshold, 65=conservative, 90=aggressive)"
        optimize:
          value: [65.0, 90.0]
      - variable: intensity_pct_threshold
        time_start: "07:20"
        time_end: "07:20"
        label: "Bike-leg intensity (% threshold, 65=conservative, 90=aggressive)"
        optimize:
          value: [65.0, 90.0]
      - variable: intensity_pct_threshold
        time_start: "08:30"
        time_end: "08:30"
        label: "Run-leg intensity (% threshold, 65=conservative, 90=aggressive)"
        optimize:
          value: [65.0, 90.0]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 6
    elapsed_seconds: 78.5
    pareto_front:
      - {x: [65.0, 65.0, 65.0], f: [138.0, -285.0]}
      - {x: [70.0, 72.0, 70.0], f: [131.0, -220.0]}
      - {x: [72.0, 78.0, 75.0], f: [127.0, -148.0]}
      - {x: [75.0, 82.0, 78.0], f: [123.0, -85.0]}
      - {x: [78.0, 86.0, 80.0], f: [120.0, -42.0]}
      - {x: [82.0, 90.0, 85.0], f: [117.0, -12.0]}
    recommended:
      x: [72.0, 78.0, 75.0]
      f: [127.0, -148.0]

references:
  - "Hausswirth C & Lehénaff D (2001) Physiological demands of running during long distance runs and triathlons. Sports Med 31(9):679-689."
  - "Laursen PB & Jenkins DG (2002) The scientific basis for high-intensity interval training. Sports Med 32(1):53-73."
  - "O'Toole ML & Douglas PS (1995) Applied physiology of triathlon. Sports Med 19(4):251-267."
  - "Millet GP & Vleck VE (2000) Physiological and biomechanical adaptations to the cycle to run transition in Olympic triathlon. Br J Sports Med 34(5):384-388."
  - "Jeukendrup AE & Martin J (2001) Improving cycling performance: how should we spend our time and money. Sports Med 31(7):559-569."
