metadata:
  name: running
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      跑步是最普及的有氧耐力运动，其生理响应的核心在于配速与代谢负荷的关系。
      基于 Daniels 跑步公式，VO2 随配速非线性增加，当超过乳酸阈值（约 RPE 6-7，乳酸 2-4 mmol/L）
      后乳酸快速积累，导致疲劳加速和运动表现下降。
      如何在 60 分钟训练课内选择最佳配速——既产生足够的有氧训练刺激，
      又不因乳酸过高导致疲劳过度积累——是跑步训练处方的经典生理问题。
    result: >
      仿真尚未运行。理论预期：6 min/km 中等有氧配速（RPE≈5）持续 60 分钟时，
      乳酸维持在约 1.5 mmol/L，疲劳积分在 60 分钟末约 25-35，运动表现系数保持约 80 分以上。
      配速提升至 4.5 min/km（RPE≈7-8）时，乳酸进入阈值区（>4 mmol/L），疲劳加速积累，
      运动表现系数在 40-50 分钟后明显下降。
    limitations: >
      参数基于 70 kg 成年男性，不适用于体重或有氧能力差异较大的人群。
      未包含气温、坡度、海拔等环境因素；疲劳模型未区分中枢疲劳（神经）和外周疲劳（肌肉）机制。
  ratings:
    topic_importance: 4 - 跑步是最普及的有氧运动，配速-心率-乳酸动力学是运动医学核心
    framework_demand: 3 - 最通用有氧运动模型，被多个场景使用预期
    evidence_quality: 4 - 引用Daniels公式/ACSM指南等经典来源，参数有据可查
    popularity: 5 - 跑步生理模型是运动科学教科书最常见基准模型
  tags: [sport, running, aerobic, endurance, VO2max, Daniels, lactate]
  references:
    - "Daniels J (2014) Daniels' Running Formula, 3rd ed. Human Kinetics, Champaign, IL."
    - "Borg G (1998) Borg's Perceived Exertion and Pain Scales. Human Kinetics, Champaign, IL."
    - "Weltman A et al. (1990) The lactate threshold is a valid indicator of endurance performance. J Sports Med Phys Fitness 30(2):212-218."
    - "ACSM (2021) ACSM's Guidelines for Exercise Testing and Prescription, 11th ed. Lippincott Williams & Wilkins."
    - "Wilmore JH, Costill DL, Kenney WL (2008) Physiology of Sport and Exercise, 4th ed. Human Kinetics."
  step_size:
    value: 1
    unit: minute

variables:
  training_intensity:
    type: input
    value: 5.0
    unit: "RPE(0-10)"
    bounds: [0.0, 10.0]
    description: "运动感知强度（5=中等有氧，7=乳酸阈值，9=极重）"
  pace:
    type: input
    value: 6.0
    unit: "min/km"
    bounds: [3.0, 15.0]
    description: "跑步配速（3=精英，6=中等有氧，10=慢跑恢复）"
  heart_rate:
    type: state
    value: 70.0
    unit: "bpm"
    bounds: [50.0, 200.0]
    description: "运动心率"
  vo2:
    type: state
    value: 10.0
    unit: "mL/kg/min"
    bounds: [5.0, 80.0]
    description: "摄氧量（安静=5，最大有氧=50-70）"
  distance:
    type: state
    value: 0.0
    unit: "km"
    bounds: [0.0, 100.0]
    description: "累计跑步距离"
  calories_burned:
    type: state
    value: 0.0
    unit: "kcal"
    bounds: [0.0, 3000.0]
    description: "累计热量消耗"
  fatigue:
    type: state
    value: 0.0
    unit: "分"
    bounds: [0.0, 100.0]
    description: "肌肉与心肺疲劳（>70影响配速，>90需停止）"
  lactate:
    type: state
    value: 1.0
    unit: "mmol/L"
    bounds: [0.5, 20.0]
    description: "血乳酸（<2=有氧区，2-4=阈值区，>4=无氧区）"
  performance:
    type: state
    value: 100.0
    unit: "分"
    bounds: [0.0, 100.0]
    description: "运动表现系数（受疲劳和乳酸抑制）"

formulas:
  heart_rate_response:
    description: "心率随配速和强度升高，疲劳加重心脏负担"
    condition: true
    priority: 10
    dynamics:
      heart_rate: "min(200, 70 + (10 - pace) * 8 + training_intensity * 4 + fatigue * 0.3)"
  vo2_update:
    description: "摄氧量随配速升高（Daniels公式简化）"
    condition: "training_intensity > 0"
    priority: 9
    dynamics:
      vo2: "min(80, 3.5 + (10 - pace) * 6 + training_intensity * 2.5)"
  distance_accumulate:
    description: "每分钟累计距离（km）"
    condition: "training_intensity > 0"
    priority: 8
    dynamics:
      distance: "distance + (1.0 / max(1.0, pace))"
  calorie_burn:
    description: "热量消耗（约60kcal/km，强度系数加成）"
    condition: "training_intensity > 0"
    priority: 8
    dynamics:
      calories_burned: "calories_burned + (1.0 / max(1.0, pace)) * 60 * (1 + training_intensity * 0.05)"
  fatigue_accumulate:
    description: "疲劳随强度积累，高强度非线性加速"
    condition: "training_intensity > 0"
    priority: 7
    dynamics:
      fatigue: "min(100, fatigue + training_intensity * 0.08 * (1 + fatigue * 0.005))"
  lactate_dynamics:
    description: "乳酸在阈值强度以上快速积累"
    condition: true
    priority: 7
    dynamics:
      lactate: "max(0.5, min(20, lactate + (training_intensity - 6) * 0.15))"
  performance_update:
    description: "运动表现受疲劳和高乳酸双重抑制"
    condition: true
    priority: 6
    dynamics:
      performance: "max(0, 100 - fatigue * 0.6 - max(0, lactate - 4) * 5)"

simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables: [heart_rate, vo2, distance, calories_burned, fatigue, lactate, performance]
  schedules:
    - variable: training_intensity
      time: "07:00"
      value: 5.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-01"]
      label: "中等有氧强度跑步（RPE=5，约6 min/km）"
    - variable: pace
      time: "07:00"
      value: 6.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-01"]
      label: "配速6分/公里（中等有氧区）"

optimizer:
  method: nsga2
  objectives:
    - variable: performance
      metric: final
      direction: maximize
    - variable: fatigue
      metric: final
      direction: minimize
  constraints:
    - variable: lactate
      condition: "<= 10.0"
      type: hard
      description: "血乳酸不超过10 mmol/L（安全上限）"
    - variable: fatigue
      condition: "<= 9.0"
      type: soft
      description: "疲劳感不超过9（避免过度训练）"
  schedules:
    - variable: training_intensity
      time_start: "07:00"
      time_end: "07:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "训练强度（RPE 0-10）"
      optimize:
        value: [0.0, 10.0]
    - variable: pace
      time_start: "07:00"
      time_end: "07:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "配速（min/km）"
      optimize:
        value: [3.0, 15.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
