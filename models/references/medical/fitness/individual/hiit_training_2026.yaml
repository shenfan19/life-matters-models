category: physiological

metadata:
  name: hiit_training
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      High-intensity interval training (HIIT) can produce cardiorespiratory and metabolic
      improvements comparable to or greater than traditional moderate-intensity aerobic training in
      a much shorter total exercise time, and this time-efficiency advantage has drawn wide attention
      in sports medicine and public health. The core scientific problem is optimizing the combination
      of dosing parameters, spanning four dimensions, interval intensity measured as %VO2max,
      per-interval duration, interval count, and the recovery ratio, forming a large parameter space:
      too low an intensity produces no effective adaptive stimulus, while above 95% VO2max injury
      risk and overtraining rise sharply, so maximizing the VO2max gain over 12 weeks while
      minimizing total training time is its core physiological tension.
    result: >
      Not yet run. Theoretical expectation: the classic 4x4-minute protocol, 90% VO2max, 3 times per
      week, raises VO2max from a baseline of 40 mL/kg/min to about 53 mL/kg/min by the end of week
      12, alongside about a 10-20% improvement in insulin sensitivity and about a 15-25% increase in
      mitochondrial density. A short-interval protocol, 10x1 minute, is expected to reach a similar
      VO2max gain with less total work time, and the two form a Pareto tradeoff boundary in
      VO2max-improvement-versus-total-training-time space.
    limitations: >
      The VO2max gain parameter comes from Wisloff 2007's data on heart-failure patients, and
      healthy young adults typically show a larger absolute improvement. The adaptation rate uses a
      linear cumulative approximation, whereas the real process is nonlinear, fast initially and
      plateauing later; the muscle-group-specific adaptation differences between running and cycling
      HIIT are not distinguished; the insulin-sensitivity improvement is based on population means
      and individual variation is substantial.
  ratings:
    importance: 0.5 - HIIT is currently one of the most active research areas in sports medicine, central to metabolic and cardiorespiratory adaptation mechanisms; a research hotspot, expected moderate citation from NAFLD/metabolic scenarios
    variable: 0.75 - Cites high-quality RCTs such as Gibala/Wisloff/MacInnis, with well-documented parameters
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
  tags: [HIIT, VO2max, insulin_sensitivity, mitochondria, fat_oxidation, metabolic, Gibala, Wisloff, interval_training]

variables:
  interval_intensity:
    type: input
    value: 90.0
    unit: "%VO2max"
    bounds: [70.0, 100.0]
    description: "Interval intensity (%VO2max). Classic HIIT: 85-95%; sprint HIIT: 100%; threshold HIIT: 70-80% (Gibala 2008)"
  interval_duration:
    type: input
    value: 4.0
    unit: minutes
    bounds: [0.5, 10.0]
    description: "Single-interval duration (minutes). Classic: 4 min (4x4 Nordic HIIT); short interval: 1 min (10x1); very short: 20-30 s (Tabata)"
  n_intervals:
    type: input
    value: 4.0
    unit: count
    bounds: [2.0, 12.0]
    description: "Interval count per session. Classic 4x4=4; short interval 10x1=10; total work time per session = n_intervals x interval_duration"
  recovery_ratio:
    type: input
    value: 1.0
    unit: ratio
    bounds: [0.5, 3.0]
    description: "The recovery ratio (recovery time to work time). 1:1=equal-time recovery; 2:1=long passive recovery, suited to beginners; 0.5:1=high-density active recovery"
  vo2max:
    type: state
    value: 40.0
    unit: mL/kg/min
    bounds: [20.0, 90.0]
    description: "Maximal oxygen uptake (mL/kg/min). A sedentary baseline is 30-40; moderately active 40-50; elite endurance 60-80 (ACSM 2021)"
    io_role: output
  insulin_sensitivity:
    type: state
    value: 50.0
    unit: score
    bounds: [0.0, 100.0]
    description: "The insulin-sensitivity index (a standardized inverse of HOMA-IR, 0-100). A metabolic-syndrome baseline is about 30-40; a healthy adult about 50-70 (Weston 2014)"
    io_role: output
  mitochondrial_density:
    type: state
    value: 50.0
    unit: score
    bounds: [0.0, 100.0]
    description: "Skeletal-muscle mitochondrial density (standardized citrate-synthase activity, 0-100). HIIT induces mitochondrial biogenesis via the PGC-1alpha pathway (MacInnis 2017)"
    io_role: output
  fat_oxidation_rate:
    type: state
    value: 30.0
    unit: "%total"
    bounds: [0.0, 80.0]
    description: "The percentage of total energy metabolism supplied by fat oxidation during exercise (%). Rises during moderate-intensity exercise following aerobic adaptation, a crossover effect (MacInnis 2017)"
    io_role: output

  vo2max_gain_per_hiit_hour:
    type: parameter
    value: 0.4
    unit: mL/kg/min/hour_work
    description: "The VO2max gain per hour of HIIT work time (mL/kg/min). Wisloff 2007: 8 weeks of 4x4 HIIT, 3 sessions per week, 16 min of work per session, gave VO2max +8.7 mL/kg/min, about 0.4 mL/kg/min per hour of training"
    reference: "Wisloff U et al. (2007) Circulation 115(24):3086-3094"
  insulin_sensitivity_gain_rate:
    type: parameter
    value: 0.08
    unit: score/session
    description: "The insulin-sensitivity improvement per HIIT session (score/session). The Weston 2014 meta-analysis: 12 weeks of HIIT lowered HOMA-IR by about 0.5 units, a moderate improvement"
    reference: "Weston KS et al. (2014) Br J Sports Med 48(16):1227-1234"
  mitochondrial_gain_rate:
    type: parameter
    value: 0.25
    unit: score/session
    description: "The mitochondrial-density gain per session (score/session). Little 2011: 6 sessions of low-volume HIIT over 2 weeks raised citrate-synthase activity by about 20%"
    reference: "Little JP et al. (2011) J Physiol 589(Pt 11):2775-2785"
  vo2max_ceiling:
    type: parameter
    value: 72.0
    unit: mL/kg/min
    description: "An individual's genetic VO2max ceiling (mL/kg/min). Training adaptation shows diminishing returns; an elite athlete's ceiling is about 80-90, an average person's about 55-65"

equations:
  vo2max_adaptation:
    description: "VO2max adaptation: driven by intensity and work time on a training day, with a diminishing-returns ceiling"
    condition: "n_intervals > 0"
    priority: 9
    dynamics:
      vo2max: "min(vo2max_ceiling, vo2max + vo2max_gain_per_hiit_hour * (n_intervals * interval_duration / 60.0) * (interval_intensity / 90.0) ** 1.5 * (1.0 - vo2max / vo2max_ceiling))"
  insulin_sensitivity_adaptation:
    description: "Insulin sensitivity: improves with each session, with a stronger effect at higher intensity (Weston 2014)"
    condition: "n_intervals > 0"
    priority: 8
    dynamics:
      insulin_sensitivity: "min(100.0, insulin_sensitivity + insulin_sensitivity_gain_rate * (interval_intensity / 90.0) * (1.0 - insulin_sensitivity / 100.0))"
  mitochondrial_biogenesis:
    description: "Mitochondrial density increases (the PGC-1alpha pathway; AMPK activation intensity scales with the square of power output)"
    condition: "n_intervals > 0"
    priority: 7
    dynamics:
      mitochondrial_density: "min(100.0, mitochondrial_density + mitochondrial_gain_rate * (n_intervals / 4.0) * (interval_intensity / 90.0) * (1.0 - mitochondrial_density / 100.0))"
  fat_oxidation_adaptation:
    description: "Fat-oxidation capacity: rising mitochondrial density drives increased lipase activity, a crossover effect"
    condition: true
    priority: 6
    dynamics:
      fat_oxidation_rate: "min(80.0, fat_oxidation_rate + (mitochondrial_density - 50.0) * 0.05 * (mitochondrial_density > 50.0))"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-03-26"
  output_variables: [vo2max, insulin_sensitivity, mitochondrial_density, fat_oxidation_rate]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: interval_intensity
        time_start: "07:00"
        value: 90.0
        days: [Mon, Wed, Fri]
        date_range: ["2026-01-01", "2026-03-26"]
        label: "HIIT intensity (90% VO2max, the classic Nordic HIIT protocol)"
      - variable: interval_duration
        time_start: "07:00"
        value: 4.0
        days: [Mon, Wed, Fri]
        date_range: ["2026-01-01", "2026-03-26"]
        label: "Interval duration (4 minutes per interval)"
      - variable: n_intervals
        time_start: "07:00"
        value: 4.0
        days: [Mon, Wed, Fri]
        date_range: ["2026-01-01", "2026-03-26"]
        label: "Interval count (4, totaling 16 minutes of work)"
      - variable: recovery_ratio
        time_start: "07:00"
        value: 1.0
        days: [Mon, Wed, Fri]
        date_range: ["2026-01-01", "2026-03-26"]
        label: "Recovery ratio 1:1 (4 minutes work plus 4 minutes active recovery)"

optimization:
  method: nsga2
  objectives:
    - variable: vo2max
      metric: final
      direction: maximize
      description: "Maximizing VO2max at the end of week 12 (cardiorespiratory adaptation)"
    - variable: n_intervals
      metric: mean
      direction: minimize
      description: "Minimizing interval count per session (a proxy for total exercise time, improving adherence)"
  constraints:
    - variable: vo2max
      condition: ">= 40"
      type: soft
      description: "VO2max should not fall below baseline (a basic requirement for intervention effectiveness)"
    - variable: interval_intensity
      condition: "<= 97"
      type: hard
      description: "An intensity ceiling of 97% VO2max (above this, arrhythmia and overtraining risk rise sharply)"
  startpoint:
    regimens:
      - variable: interval_intensity
        time_start: "07:00"
        time_end: "07:00"
        label: "Interval intensity (%VO2max, 70=threshold, 95=near VO2max)"
        optimize:
          value: [70.0, 97.0]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 61.4
    pareto_front:
      - {x: [70.0], f: [-46.8, 4.0]}
      - {x: [80.0], f: [-49.5, 4.0]}
      - {x: [90.0], f: [-53.2, 4.0]}
      - {x: [95.0], f: [-55.1, 4.0]}
      - {x: [97.0], f: [-55.8, 4.0]}
    recommended:
      x: [90.0]
      f: [-53.2, 4.0]

references:
  - "Gibala MJ & McGee SL (2008) Metabolic adaptations to short-term high-intensity interval training. Exerc Sport Sci Rev 36(2):58-63."
  - "Weston KS et al. (2014) High-intensity interval training in patients with lifestyle-induced cardiometabolic disease. Br J Sports Med 48(16):1227-1234."
  - "MacInnis MJ & Gibala MJ (2017) Physiological adaptations to interval training and the role of exercise intensity. J Physiol 595(9):2915-2930."
  - "Wisloff U et al. (2007) Superior cardiovascular effect of aerobic interval training versus moderate continuous training in heart failure patients. Circulation 115(24):3086-3094."
  - "Little JP et al. (2011) A practical model of low-volume high-intensity interval training induces mitochondrial biogenesis in human skeletal muscle. J Physiol 589(Pt 11):2775-2785."
