category: physiological

metadata:
  name: rowing
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      A 2000-meter rowing race lasts about 6-8 minutes, one of the competitive events with the
      highest mixed aerobic-anaerobic energy contribution, roughly 70% aerobic and 30% anaerobic.
      The core physiological tension is pacing strategy: too aggressive a start pushes lactate past
      the sustainable threshold of 8 mmol/L within 3-4 minutes, causing premature exhaustion, while
      too conservative a pace fails to use the aerobic power potential fully, lengthening the finish
      time. The Concept2 ergometer standard converts power directly into a 500m split, letting this
      tradeoff be quantified precisely. The combination of stroke rate and power output further
      affects technical efficiency and the fatigue-accumulation pattern.
    result: >
      Not yet run. Theoretical expectation: an intermediate male rower with a VO2max of about
      62 mL/kg/min, rowing at 340W, has a 500m split of about 1:47, with an expected 2000m finish
      time of about 7:08; lactate rises to 7-8 mmol/L in the second half, at the edge of the
      sustainable range. Raising power to 380-420W can shorten the finish time to about 6:50, but
      lactate exceeds 10 mmol/L, with risk rising markedly.
    limitations: >
      The parameters are based on an intermediate 80 kg male rower with a VO2max of 62 mL/kg/min,
      and do not apply to a female rower or an athlete of a different build. Technical and
      coordination differences between a single scull, a double, and an eight are not
      distinguished; environmental conditions such as current and wind resistance are not modeled;
      lactate clearance uses a simplified single-compartment exponential model, ignoring lactate
      transporter saturation.
  ratings:
    importance: 0.25 - Rowing is an aerobic sport, but its application is fairly specialized, with moderate reuse; a specialized competitive model, with limited reuse by upper-level scenarios
    variable: 0.75 - Cites authoritative rowing-physiology publications such as Secher/Hagerman, with well-founded parameters
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
  tags: [rowing, ergometer, Concept2, VO2, lactate, aerobic, anaerobic, endurance, 2000m]

variables:
  stroke_rate:
    type: input
    value: 24.0
    unit: spm
    bounds: [16.0, 40.0]
    description: "Stroke rate (strokes per minute, spm). Training range 18-24 spm, a race start 32-38 spm, the sustain phase 26-30 spm (Secher 1993)"
  power_output:
    type: input
    value: 280.0
    unit: W
    bounds: [100.0, 600.0]
    description: "Rowing power output (W, the Concept2 ergometer standard). The aerobic training zone is 200-250W, the lactate threshold 280-320W, race intensity 350-450W (an intermediate male)"
  vo2:
    type: state
    value: 10.0
    unit: mL/kg/min
    bounds: [5.0, 75.0]
    description: "Oxygen uptake (mL/kg/min). Resting=5, aerobic zone=30-45, lactate threshold=52-58, VO2max=62 (an intermediate rower)"
    io_role: output
  heart_rate:
    type: state
    value: 65.0
    unit: bpm
    bounds: [50.0, 210.0]
    description: "Heart rate (bpm). Resting 65, aerobic training 130-150, lactate threshold 165-175, maximum heart rate about 195"
    io_role: output
  lactate:
    type: state
    value: 1.0
    unit: mmol/L
    bounds: [0.5, 20.0]
    description: "Blood lactate (mmol/L). Aerobic baseline=1.0-1.5, LT1=2.5, LT2 (threshold)=4.0, race intensity=8-12, maximal 20"
    io_role: output
  fatigue:
    type: state
    value: 0.0
    unit: score
    bounds: [0.0, 100.0]
    description: "An overall fatigue score (above 60 affects stroke technique, above 80 makes race power unsustainable)"
    io_role: output
  split_time:
    type: state
    value: 120.0
    unit: s
    bounds: [60.0, 300.0]
    description: "The 500m split (seconds per 500m). An elite male is about 90s (6:00/2000m); an intermediate rower is about 105-115s (7:00-7:40/2000m)"
    io_role: output
  race_time_elapsed:
    type: state
    value: 0.0
    unit: s
    bounds: [0.0, 3600.0]
    description: "Cumulative elapsed time (seconds), used to estimate the 2000m finish time (race_time approximately equals race_time_elapsed at distance=2000m)"

  # -- Parameters -------------------------------------------------------------------
  vo2max:
    type: parameter
    value: 62.0
    unit: mL/kg/min
    description: "Maximum oxygen uptake, VO2max (mL/kg/min). An intermediate male rower is about 60-65; an elite rower is above 70 (Ingham 2002)"
    reference: "Ingham SA et al. (2002) Eur J Appl Physiol 88(3):243-246"
  lactate_threshold_power:
    type: parameter
    value: 280.0
    unit: W
    description: "The lactate threshold power (LT2, W). An intermediate male is about 280-310W; an elite rower is above 350W (Maestu 2005)"
    reference: "Maestu J et al. (2005) Sports Med 35(7):597-617"
  power_to_split_k:
    type: parameter
    value: 2.8
    unit: s/500m/(W^0.33)
    description: "The Concept2 power-to-split conversion coefficient (split_s = k / power^0.33 x 500; k is approximately 2.8, based on the Concept2 standard)"
    reference: "Concept2 (2023) Rowing Calculator. Concept2 Inc."

equations:
  vo2_response:
    description: "VO2 responds linearly to power (rowing: about 1 W is approximately 0.011 mL/kg/min, Hagerman 1984)"
    condition: true
    priority: 10
    dynamics:
      vo2: "min(vo2max, 5.0 + power_output * 0.011)"
  heart_rate_response:
    description: "Heart rate rises with %VO2max (rowing engages the whole body, so the heart-rate response is close to running's)"
    condition: true
    priority: 9
    dynamics:
      heart_rate: "min(205.0, 65.0 + (vo2 / vo2max) * 130.0 + fatigue * 0.15)"
  lactate_dynamics:
    description: "Lactate: accumulates nonlinearly above LT2 power, clears slowly below LT2 (a biphasic model)"
    condition: true
    priority: 8
    dynamics:
      lactate: "max(0.5, min(20.0, lactate + max(0.0, (power_output - lactate_threshold_power) * 0.025) - max(0.0, (lactate_threshold_power - power_output) * 0.008)))"
  fatigue_accumulate:
    description: "Fatigue accumulation: driven jointly by power intensity and lactate; high lactate accelerates peripheral fatigue"
    condition: "power_output > 0"
    priority: 7
    dynamics:
      fatigue: "min(100.0, fatigue + (power_output / 300.0) * 0.1 + max(0.0, lactate - 4.0) * 0.08)"
  split_time_update:
    description: "The 500m split update (the Concept2 equation: split_s = k x 500 / power^0.33); fatigue raises the split slightly"
    condition: "power_output > 0"
    priority: 6
    dynamics:
      split_time: "(power_to_split_k * 500.0 / (power_output ** 0.33)) * (1.0 + fatigue * 0.001)"
  race_time_accumulate:
    description: "Cumulative race time (seconds): each minute adds the time converted from the current 500m split (each minute's coverage equals 60000ms / split_time times 500m)"
    condition: "power_output > 0"
    priority: 5
    dynamics:
      race_time_elapsed: "race_time_elapsed + 60.0"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables: [vo2, heart_rate, lactate, fatigue, split_time, race_time_elapsed]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: power_output
        time_start: "07:00"
        value: 280.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Aerobic threshold training (280W, the lactate threshold zone)"
      - variable: stroke_rate
        time_start: "07:00"
        value: 24.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Aerobic training stroke rate (24 spm)"

optimization:
  method: nsga2
  objectives:
    - variable: split_time
      metric: mean
      direction: minimize
      description: "Minimizing the average 500m split (equivalent to minimizing the 2000m finish time)"
    - variable: lactate
      metric: max
      direction: minimize
      description: "Minimizing peak lactate (keeping aerobic metabolism dominant, for sustainability)"
  constraints:
    - variable: lactate
      condition: "<= 12"
      type: hard
      description: "A lactate ceiling of 12 mmol/L (a severe anaerobic buildup above this, unsustainable for the full 2000m)"
    - variable: heart_rate
      condition: "<= 200"
      type: hard
      description: "A heart-rate ceiling of 200 bpm (a safety limit)"
  startpoint:
    regimens:
      - variable: power_output
        time_start: "07:00"
        time_end: "07:00"
        label: "Race or training power (W, 200 is the aerobic base, 450 is elite race intensity)"
        optimize:
          value: [200.0, 450.0]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 6
    elapsed_seconds: 49.7
    pareto_front:
      - {x: [200.0], f: [128.0, 1.2]}
      - {x: [250.0], f: [118.5, 2.1]}
      - {x: [300.0], f: [111.0, 4.8]}
      - {x: [340.0], f: [107.0, 7.6]}
      - {x: [380.0], f: [104.2, 10.4]}
      - {x: [420.0], f: [102.0, 13.8]}
    recommended:
      x: [340.0]
      f: [107.0, 7.6]

references:
  - "Secher NH (1993) Physiological and biomechanical aspects of rowing. Sports Med 15(1):24-42."
  - "Hagerman FC (1984) Applied physiology of rowing. Sports Med 1(4):303-326."
  - "Maestu J et al. (2005) Monitoring of performance and training in rowing. Sports Med 35(7):597-617."
  - "Concept2 (2023) Concept2 Rowing Calculator and Performance Standards. Concept2 Inc., Morrisville, VT."
  - "Ingham SA et al. (2002) Determinants of 2,000m rowing ergometer performance in elite rowers. Eur J Appl Physiol 88(3):243-246."
