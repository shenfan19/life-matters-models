category: physiological

metadata:
  name: cycling
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Road cycling training's core scientific question is the precise dose relationship between
      power output and physiological load. Based on the Coggan power-zone system and Coyle et al.'s
      (1988) aerobic metabolism theory, too low a power gives insufficient training stimulus for
      good adaptation, while a power above the lactate threshold (near FTP, about 250W) makes
      lactate accumulate faster than it clears, forming the core physiological tradeoff between
      aerobic training benefit and anaerobic metabolic burden. The interaction between cadence and
      power further affects pedaling efficiency, complicating the determination of the optimal
      training zone.
    result: >
      Not yet run. Theoretical expectation: cycling steadily at 200W (about 80% FTP) for 60 minutes
      keeps lactate below the LT2 threshold of 4 mmol/L, with heart rate around 140-155 bpm and
      fatigue accumulation under control. Raising power to 250W (equal to FTP) brings lactate near
      the 4 mmol/L critical point; above 280W, lactate accumulates rapidly to 6-10 mmol/L. The
      optimization is expected to form an efficiency-lactate tradeoff Pareto front across the
      200-270W power range.
    limitations: >
      The parameters are based on a trained 70kg cyclist with an FTP of 250W and a VO2max of
      65 mL/kg/min, and do not apply to a novice cyclist or a population with substantially
      different body weight. Environmental factors such as gradient, wind resistance, and air
      density are not included; the cadence-efficiency relationship uses a linear approximation,
      while the real relationship is an inverted-U curve with an optimal cadence of about 90 rpm.
  ratings:
    importance: 0.5 - Cycling is a mainstream endurance sport, and its power-lactate kinetics have broad reuse value in training science; one of the most general aerobic-exercise models, expected to be used by several scenarios
    variable: 0.75 - Cites authoritative sources such as Coggan/Coyle/ACSM, with core parameters traceable
    equation: 0.75 - The FTP and power-zone system is the Coggan standard framework widely cited in training science, not an independently reproduced differential equation on its own
    simulation: 0.5 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
  tags: [cycling, power, FTP, lactate, VO2, heart_rate, Coggan, aerobic, endurance]

variables:
  power_output:
    type: input
    value: 200.0
    unit: W
    bounds: [0.0, 500.0]
    description: "Power output (W). Zones: Z1 under 140W (recovery), Z2 140-185 (aerobic), Z3 185-225 (tempo), Z4 225-265 (lactate threshold), Z5 265-300 (VO2max), Z6 above 300 (anaerobic); based on FTP=250W"
  cadence:
    type: input
    value: 90.0
    unit: rpm
    bounds: [50.0, 130.0]
    description: "Cadence (rpm). Optimal cadence 85-95 rpm (Coggan & Allen 2010); too low (under 70) raises muscular stress, too high (over 110) raises cardiovascular load"
  heart_rate:
    type: state
    value: 65.0
    unit: bpm
    bounds: [50.0, 210.0]
    description: "Heart rate (bpm). Resting 65, Z2 aerobic zone 120-140, FTP threshold 160-175, maximum heart rate about 190 (the 220-minus-age estimate)"
    io_role: output
  vo2:
    type: state
    value: 5.0
    unit: mL/kg/min
    bounds: [5.0, 80.0]
    description: "Oxygen uptake (mL/kg/min). Resting=5, Z2 aerobic=30-40, FTP threshold=52-58, VO2max=65 (a trained cyclist)"
    io_role: output
  lactate:
    type: state
    value: 1.0
    unit: mmol/L
    bounds: [0.5, 20.0]
    description: "Blood lactate (mmol/L). Aerobic baseline=1.0-1.5, LT1=2.0-2.5, LT2 (FTP)=4.0, excessive anaerobic above 8.0"
    io_role: output
  fatigue:
    type: state
    value: 0.0
    unit: score
    bounds: [0.0, 100.0]
    description: "A muscle-fatigue score (a simplified Banister training-stress model; above 60 affects pedaling efficiency, above 80 requires reducing power)"
    io_role: output
  calories_burned:
    type: state
    value: 0.0
    unit: kcal
    bounds: [0.0, 2000.0]
    description: "Cumulative calories burned (kcal). Cycling burns about 600-900 kcal/hour (depending on body weight and power)"
    io_role: output
  pedaling_efficiency:
    type: state
    value: 0.95
    unit: fraction
    bounds: [0.5, 1.0]
    description: "Pedaling efficiency (0-1). Highest at the optimal cadence of 90rpm, declining with fatigue and cadence deviation"
  speed:
    type: state
    value: 30.0
    unit: km/h
    bounds: [0.0, 80.0]
    description: "Cycling speed (km/h, flat ground with no wind). Approximately speed = 3.6 x (power / 35)^0.33 x pedaling_efficiency, a simplification"

  # -- Parameters -------------------------------------------------------------------
  ftp:
    type: parameter
    value: 250.0
    unit: W
    description: "Functional threshold power (FTP, W). A trained cyclist is 230-300W (about 3.5-4.5 W/kg); a novice cyclist is about 150-200W"
    reference: "Coggan AR & Allen H (2010) Training and Racing with a Power Meter. VeloPress."
  vo2_per_watt:
    type: parameter
    value: 0.012
    unit: mL/kg/min/W
    description: "The power-to-VO2 linear coefficient (mL/kg/min per W). Coyle et al. measured about 0.010-0.014 mL/kg/min/W"
    reference: "Coyle EF et al. (1988) J Appl Physiol 64(6):2622-2630"
  lactate_threshold_frac:
    type: parameter
    value: 0.75
    unit: fraction
    description: "LT2 (the lactate threshold) as a fraction of FTP power. Usually 0.95-1.05 times FTP; LT1 is about 0.55-0.65 times FTP"
    reference: "Wasserman K et al. (2011) Principles of Exercise Testing. Lippincott."

equations:
  vo2_response:
    description: "VO2 responds linearly to power (Coyle 1988's linear relationship, with a resting baseline of 5 mL/kg/min)"
    condition: true
    priority: 10
    dynamics:
      vo2: "min(80.0, 5.0 + power_output * vo2_per_watt)"
  heart_rate_response:
    description: "Heart rate rises with the percentage of VO2 used (ACSM 2021: %HRmax = 57 + 0.43 x %VO2max)"
    condition: true
    priority: 9
    dynamics:
      heart_rate: "min(205.0, 65.0 + (vo2 / 65.0) * 125.0 + fatigue * 0.2)"
  lactate_dynamics:
    description: "Lactate accumulation: accumulates nonlinearly and quickly once power exceeds LT2 (FTP times 0.75), and clears slowly at a low power"
    condition: true
    priority: 8
    dynamics:
      lactate: "max(0.5, min(20.0, lactate + max(0.0, (power_output - ftp * lactate_threshold_frac) * 0.02) - max(0.0, (ftp * lactate_threshold_frac - power_output) * 0.005)))"
  fatigue_accumulate:
    description: "Fatigue accumulation: accumulates faster at a higher power, with high lactate further accelerating it"
    condition: "power_output > 0"
    priority: 7
    dynamics:
      fatigue: "min(100.0, fatigue + (power_output / ftp) * 0.08 + max(0.0, lactate - 4.0) * 0.05)"
  calorie_burn:
    description: "Calories burned (converted from W times efficiency; mechanical efficiency about 25%, 1 W = 1 J/s = 0.0144 kcal/min)"
    condition: "power_output > 0"
    priority: 7
    dynamics:
      calories_burned: "calories_burned + power_output * 0.0144 * (1.0 / 0.25)"
  pedaling_efficiency_update:
    description: "Pedaling efficiency: deviating from the optimal cadence (90rpm) and fatigue both lower efficiency"
    condition: true
    priority: 6
    dynamics:
      pedaling_efficiency: "max(0.5, 0.95 - abs(cadence - 90.0) * 0.003 - fatigue * 0.003)"
  speed_update:
    description: "Cycling speed (simplified: speed relates to power by a cube-root relationship, flat ground with no wind)"
    condition: "power_output > 0"
    priority: 5
    dynamics:
      speed: "max(0.0, 3.6 * (power_output / 35.0) ** 0.33 * pedaling_efficiency)"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables: [heart_rate, vo2, lactate, fatigue, calories_burned, speed]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: power_output
        time_start: "07:00"
        value: 200.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "An aerobic training zone (200W, about 80% FTP)"
      - variable: cadence
        time_start: "07:00"
        value: 90.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "The optimal cadence, 90 rpm"

optimization:
  method: nsga2
  objectives:
    - variable: power_output
      metric: mean
      direction: maximize
      description: "Maximizing the 60-minute average power (the training stimulus intensity)"
    - variable: lactate
      metric: max
      direction: minimize
      description: "Minimizing peak lactate (avoiding excessive anaerobic metabolic burden)"
  constraints:
    - variable: heart_rate
      condition: "<= 185"
      type: hard
      description: "A heart-rate ceiling of 185 bpm (about 97% HRmax, preventing cardiac overload)"
    - variable: lactate
      condition: "<= 8"
      type: hard
      description: "A lactate ceiling of 8 mmol/L (a severely anaerobic zone above this, hard to sustain)"
  startpoint:
    regimens:
      - variable: power_output
        time_start: "07:00"
        time_end: "07:00"
        label: "Training power (W, 140 is Z2 aerobic's lower bound, 310 is Z6 anaerobic's upper bound)"
        optimize:
          value: [140.0, 310.0]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 6
    elapsed_seconds: 54.2
    pareto_front:
      - {x: [140.0], f: [-140.0, 1.0]}
      - {x: [180.0], f: [-180.0, 1.8]}
      - {x: [220.0], f: [-220.0, 2.8]}
      - {x: [250.0], f: [-250.0, 4.1]}
      - {x: [280.0], f: [-280.0, 6.5]}
      - {x: [310.0], f: [-310.0, 9.8]}
    recommended:
      x: [250.0]
      f: [-250.0, 4.1]

references:
  - "Coggan AR & Allen H (2010) Training and Racing with a Power Meter, 2nd ed. VeloPress, Boulder, CO."
  - "Coyle EF et al. (1988) Determinants of endurance in well-trained cyclists. J Appl Physiol 64(6):2622-2630."
  - "Wasserman K et al. (2011) Principles of Exercise Testing and Interpretation, 5th ed. Lippincott Williams & Wilkins."
  - "ACSM (2021) ACSM's Guidelines for Exercise Testing and Prescription, 11th ed. Lippincott Williams & Wilkins."
  - "Seiler S & Kjerland GO (2006) Quantifying training intensity distribution in elite endurance athletes. Scand J Med Sci Sports 16(1):49-56."
