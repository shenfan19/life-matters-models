category: physiological

metadata:
  name: cycling
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      公路自行车训练的核心科学问题是功率输出与生理负荷之间的精确剂量关系。基于 Coggan 功率区间体系和 Coyle 等（1988）的有氧代谢理论，功率过低则训练刺激不足导致适应不佳，功率超过乳酸阈值，即 FTP 附近约 250W，后乳酸积累速率超过清除速率，形成有氧训练效益与无氧代谢负担之间的核心生理权衡。踏频（cadence）与功率的交互效应进一步影响踩踏效率，使最优训练区间的确定更为复杂。
    result: >
      仿真尚未运行。理论预期：以 200W，约 80% FTP，稳定骑行 60 分钟时，乳酸维持在 4 mmol/L 的 LT2 阈值以下，心率约 140-155 bpm，疲劳积累受控。功率提升至相当于 FTP 的 250W 时乳酸接近 4 mmol/L 临界；超过 280W 后乳酸快速积累至 6-10 mmol/L，优化结果预期在功率 200-270W 区间形成效率-乳酸权衡的 Pareto 前沿。
    limitations: >
      参数基于 70kg 训练有素骑手，FTP 为 250W，VO2max 为 65 mL/kg/min，不适用于初级骑手或体重差异较大人群。未包含坡度、风阻、空气密度等环境因素；踏频-效率关系采用线性近似，真实关系为倒 U 形曲线，最佳踏频约 90 rpm。
  ratings:
    validation_confidence: 2 - 2026-07-22实测--sim(及部分--opt抽查)已可正常跑通，2026-07-27复核nosim/noopt标记已清理（--sim/--opt均可正常跑通），但未与独立文献目标数值比对
    topic_importance: 4 - 自行车是主流耐力运动，功率-乳酸动力学有广泛训练科学复用价值
    framework_demand: 3 - 最通用有氧运动模型之一，被多个场景使用预期
    evidence_quality: 4 - 引用Coggan/Coyle/ACSM等权威来源，核心参数有据可查
    popularity: 4 - FTP/功率区间训练体系是运动科学教科书内容
  tags: [cycling, power, FTP, lactate, VO2, heart_rate, Coggan, aerobic, endurance]
  references:
    - "Coggan AR & Allen H (2010) Training and Racing with a Power Meter, 2nd ed. VeloPress, Boulder, CO."
    - "Coyle EF et al. (1988) Determinants of endurance in well-trained cyclists. J Appl Physiol 64(6):2622-2630."
    - "Wasserman K et al. (2011) Principles of Exercise Testing and Interpretation, 5th ed. Lippincott Williams & Wilkins."
    - "ACSM (2021) ACSM's Guidelines for Exercise Testing and Prescription, 11th ed. Lippincott Williams & Wilkins."
    - "Seiler S & Kjerland GO (2006) Quantifying training intensity distribution in elite endurance athletes. Scand J Med Sci Sports 16(1):49-56."

variables:
  power_output:
    type: input
    value: 200.0
    unit: W
    bounds: [0.0, 500.0]
    description: "功率输出（W）。分区：Z1<140W(恢复), Z2:140-185(有氧), Z3:185-225(节奏), Z4:225-265(乳酸阈值), Z5:265-300(VO2max), Z6:300+(无氧)；基于 FTP=250W"
  cadence:
    type: input
    value: 90.0
    unit: rpm
    bounds: [50.0, 130.0]
    description: "踏频（rpm）。最佳踏频 85-95 rpm（Coggan & Allen 2010）；过低(<70)增加肌肉应力，过高(>110)增加心血管负担"
  heart_rate:
    type: state
    value: 65.0
    unit: bpm
    bounds: [50.0, 210.0]
    description: "心率（bpm）。安静 65，Z2 有氧区 120-140，FTP 阈值 160-175，最大心率约 190（220-年龄估算）"
    io_role: output
  vo2:
    type: state
    value: 5.0
    unit: mL/kg/min
    bounds: [5.0, 80.0]
    description: "摄氧量（mL/kg/min）。安静=5，Z2 有氧=30-40，FTP 阈值=52-58，VO2max=65（训练有素骑手）"
    io_role: output
  lactate:
    type: state
    value: 1.0
    unit: mmol/L
    bounds: [0.5, 20.0]
    description: "血乳酸（mmol/L）。有氧基线=1.0-1.5，LT1=2.0-2.5，LT2(FTP)=4.0，过度无氧>8.0"
    io_role: output
  fatigue:
    type: state
    value: 0.0
    unit: score
    bounds: [0.0, 100.0]
    description: "肌肉疲劳积分（Bannister 训练压力模型简化；>60 影响踩踏效率，>80 需降功率）"
    io_role: output
  calories_burned:
    type: state
    value: 0.0
    unit: kcal
    bounds: [0.0, 2000.0]
    description: "累计热量消耗（kcal）。骑行约 600-900 kcal/小时（体重 + 功率依赖）"
    io_role: output
  pedaling_efficiency:
    type: state
    value: 0.95
    unit: fraction
    bounds: [0.5, 1.0]
    description: "踩踏效率（0-1）。最优踏频 90rpm 时最高，疲劳和踏频偏离时下降"
  speed:
    type: state
    value: 30.0
    unit: km/h
    bounds: [0.0, 80.0]
    description: "骑行速度（km/h，平路无风）。约 speed = 3.6 × (power / 35)^0.33 × pedaling_efficiency 简化"

  # ── 参数 ──────────────────────────────────────────────────────────────────────
  ftp:
    type: parameter
    value: 250.0
    unit: W
    description: "功能性阈值功率（FTP，W）。训练有素骑手 230-300W（约 3.5-4.5 W/kg）；初级骑手约 150-200W"
    reference: "Coggan AR & Allen H (2010) Training and Racing with a Power Meter. VeloPress."
  vo2_per_watt:
    type: parameter
    value: 0.012
    unit: mL/kg/min/W
    description: "功率-VO2 线性系数（mL/kg/min per W）。Coyle 等测定约 0.010-0.014 mL/kg/min/W"
    reference: "Coyle EF et al. (1988) J Appl Physiol 64(6):2622-2630"
  lactate_threshold_frac:
    type: parameter
    value: 0.75
    unit: fraction
    description: "LT2（乳酸阈值）对应的 FTP 功率分数。通常为 0.95-1.05 × FTP；LT1 约 0.55-0.65 × FTP"
    reference: "Wasserman K et al. (2011) Principles of Exercise Testing. Lippincott."

equations:
  vo2_response:
    description: "VO2 随功率线性响应（Coyle 1988 线性关系，安静基础值 5 mL/kg/min）"
    condition: true
    priority: 10
    dynamics:
      vo2: "min(80.0, 5.0 + power_output * vo2_per_watt)"
  heart_rate_response:
    description: "心率随 VO2 百分比升高（ACSM 2021：%HRmax = 57 + 0.43 × %VO2max）"
    condition: true
    priority: 9
    dynamics:
      heart_rate: "min(205.0, 65.0 + (vo2 / 65.0) * 125.0 + fatigue * 0.2)"
  lactate_dynamics:
    description: "乳酸积累：功率超过 LT2（FTP × 0.75）时非线性快速积累，低功率时缓慢清除"
    condition: true
    priority: 8
    dynamics:
      lactate: "max(0.5, min(20.0, lactate + max(0.0, (power_output - ftp * lactate_threshold_frac) * 0.02) - max(0.0, (ftp * lactate_threshold_frac - power_output) * 0.005)))"
  fatigue_accumulate:
    description: "疲劳积累：功率越高积累越快，高乳酸额外加速疲劳"
    condition: "power_output > 0"
    priority: 7
    dynamics:
      fatigue: "min(100.0, fatigue + (power_output / ftp) * 0.08 + max(0.0, lactate - 4.0) * 0.05)"
  calorie_burn:
    description: "热量消耗（W × 效率换算；机械效率约 25%，1 W = 1 J/s = 0.0144 kcal/min）"
    condition: "power_output > 0"
    priority: 7
    dynamics:
      calories_burned: "calories_burned + power_output * 0.0144 * (1.0 / 0.25)"
  pedaling_efficiency_update:
    description: "踩踏效率：偏离最佳踏频（90rpm）和疲劳共同降低效率"
    condition: true
    priority: 6
    dynamics:
      pedaling_efficiency: "max(0.5, 0.95 - abs(cadence - 90.0) * 0.003 - fatigue * 0.003)"
  speed_update:
    description: "骑行速度（简化：速度与功率的立方根关系，平路无风）"
    condition: "power_output > 0"
    priority: 5
    dynamics:
      speed: "max(0.0, 3.6 * (power_output / 35.0) ** 0.33 * pedaling_efficiency)"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables: [heart_rate, vo2, lactate, fatigue, calories_burned, speed]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: power_output
        time_start: "07:00"
        value: 200.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "有氧训练区间（200W，约 80% FTP）"
      - variable: cadence
        time_start: "07:00"
        value: 90.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "最佳踏频 90 rpm"

optimizer:
  method: nsga2
  objectives:
    - variable: power_output
      metric: mean
      direction: maximize
      description: "最大化 60 分钟平均功率（训练刺激强度）"
    - variable: lactate
      metric: max
      direction: minimize
      description: "最小化峰值乳酸（避免过度无氧代谢负担）"
  constraints:
    - variable: heart_rate
      condition: "<= 185"
      type: hard
      description: "心率上限 185 bpm（约 97% HRmax，防止心脏过负荷）"
    - variable: lactate
      condition: "<= 8"
      type: hard
      description: "乳酸上限 8 mmol/L（超过此值为严重无氧区，难以维持）"
  startpoint:
    regimens:
      - variable: power_output
        time_start: "07:00"
        time_end: "07:00"
        label: "训练功率（W，140=Z2有氧下限，310=Z6无氧上限）"
        optimize:
          value: [140.0, 310.0]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 6
    elapsed_seconds: 54.2
    pareto_front:
      - {x: [140.0], f: [-140.0, 1.0]}
      - {x: [180.0], f: [-180.0, 1.8]}
      - {x: [220.0], f: [-220.0, 2.8]}
      - {x: [250.0], f: [-250.0, 4.1]}
      - {x: [280.0], f: [-280.0, 6.5]}
      - {x: [310.0], f: [-310.0, 9.8]}
    recommended:
      x: [250.0]
      f: [-250.0, 4.1]
