category: physiological

metadata:
  name: yoga
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Yoga is among the few mind-body practices shown to simultaneously lower cortisol, improve
      heart-rate variability (HRV), and increase flexibility, but its effects depend heavily on
      practice intensity. The cortisol response follows an inverted-U shape: low-intensity yoga,
      1.5-2 MET yin yoga, activates the parasympathetic nervous system and lowers
      hypothalamic-pituitary-adrenal axis activity, while high-intensity vinyasa flow, above
      4.5 MET, instead triggers a stress response and raises cortisol. Finding the "just enough"
      practice intensity, one that simultaneously maximizes relaxation, HRV improvement, and
      flexibility gain, is the core physiological challenge in yoga exercise-prescription design.
    result: >
      Not yet run. Theoretical expectation: at 3 MET Hatha yoga practiced 60 minutes daily for
      12 weeks, the flexibility index rises from a baseline of 50 to about 75, HRV rises from
      45 ms to about 61 ms, and morning cortisol falls from 18 nmol/L to about 10 nmol/L. At an
      intensity of 4.5 MET or above, corresponding to Ashtanga yoga, the HRV and flexibility gains
      are similar in magnitude, but cortisol rises due to the stress effect, so the two intensity
      regimes form distinct adaptation clusters in HRV-versus-cortisol space.
    limitations: >
      The model parameters mainly come from randomized controlled trials predominantly enrolling
      female subjects (Cramer 2013), so the effect in men may be smaller; the mindfulness effect of
      meditation and breathing practice is not modeled separately from pure postural practice;
      individual differences in baseline flexibility substantially affect the gain rate.
  ratings:
    importance: 0.25 - Yoga's effect on cortisol, HRV, and mental health is a current stress-management research focus; a stress-management specialty scenario, expected to have low upstream citation
    variable: 0.75 - Cites a high-quality systematic review such as the Cramer 2013 meta-analysis, with a literature basis for the parameters
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
  tags: [yoga, flexibility, cortisol, HRV, mindfulness, stress, parasympathetic, relaxation]

variables:
  yoga_intensity:
    type: input
    value: 3.0
    unit: MET
    bounds: [1.5, 6.0]
    description: "Yoga practice intensity (MET). Yin yoga=1.5-2.0, Hatha yoga=3.0-4.0, Ashtanga/flow=4.5-6.0 (Ainsworth 2011 METs compendium)"
  session_duration:
    type: input
    value: 60.0
    unit: minutes
    bounds: [15.0, 120.0]
    description: "Session duration (minutes). A typical class is 45-90 minutes; a short 15-30 minute practice is also effective (Pascoe 2015)"
  flexibility_index:
    type: state
    value: 50.0
    unit: score
    bounds: [0.0, 100.0]
    description: "The flexibility index (a 0-100 composite score). A standardized composite of seated forward-bend reach and shoulder/hip range of motion; an initial value of 50 represents an average adult baseline"
    io_role: output
  cortisol_level:
    type: state
    value: 18.0
    unit: nmol/L
    bounds: [5.0, 60.0]
    description: "Morning salivary cortisol (nmol/L). A normal range is 5-25, chronic stress can reach 30-60; the post-intervention target is <15 nmol/L (Pascoe 2015)"
    io_role: output
  hrv_score:
    type: state
    value: 45.0
    unit: ms
    bounds: [10.0, 120.0]
    description: "Heart-rate variability, RMSSD (ms). A normal adult range is 25-65ms; an autonomic-health indicator; yoga can raise parasympathetic tone (Streeter 2012)"
    io_role: output
  mindfulness_score:
    type: state
    value: 30.0
    unit: score
    bounds: [0.0, 100.0]
    description: "The mindfulness score (a simplified Five Facet Mindfulness Questionnaire, FFMQ, 0-100). Practice builds mindfulness skill, which further enhances HRV and cortisol suppression"

  flexibility_gain_rate:
    type: parameter
    value: 0.12
    unit: score/day
    description: "The base flexibility gain rate per session (score/day per MET-hour). From the Cramer 2013 meta-analysis: 8 weeks of yoga improved flexibility by about 30% on average"
    reference: "Cramer H et al. (2013) Clin J Pain 29(5):450-460"
  cortisol_sensitivity:
    type: parameter
    value: 0.8
    unit: nmol/L/MET
    description: "The effect size of low-intensity yoga on lowering cortisol, per MET (nmol/L per MET per session-hour). Innes & Vincent 2007 reported an 8-week yoga cortisol decline of about 20%"
    reference: "Innes KE & Vincent HK (2007) J Am Board Fam Med 20(5):486-492"
  hrv_gain_per_session:
    type: parameter
    value: 0.15
    unit: ms/session
    description: "The base HRV gain per session (ms per session-hour). Ross & Thomas 2010: 12 weeks of yoga raised HRV by about 8-12 ms"
    reference: "Ross A & Thomas S (2010) J Altern Complement Med 16(1):3-12"

equations:
  flexibility_gain:
    description: "Daily flexibility gain: jointly driven by intensity and duration, with a saturating ceiling (a sigmoid approximation)"
    condition: "yoga_intensity > 0"
    priority: 8
    dynamics:
      flexibility_index: "min(100.0, flexibility_index + flexibility_gain_rate * yoga_intensity * (session_duration / 60.0) * (1.0 - flexibility_index / 100.0))"
  cortisol_response:
    description: "The cortisol response: inverted-U shaped, lowered by low intensity, raised instead above 4.5 MET, with sustained practice producing a cumulative benefit"
    condition: "yoga_intensity > 0"
    priority: 7
    dynamics:
      cortisol_level: "max(5.0, cortisol_level - cortisol_sensitivity * min(yoga_intensity, 4.0) * (session_duration / 60.0) + max(0.0, yoga_intensity - 4.5) * 1.5)"
  hrv_improvement:
    description: "HRV improvement: aerobic adaptation plus increased parasympathetic tone, with an additional boost from accumulated mindfulness"
    condition: "yoga_intensity > 0"
    priority: 6
    dynamics:
      hrv_score: "min(120.0, hrv_score + hrv_gain_per_session * (session_duration / 60.0) * (1.0 + mindfulness_score * 0.005))"
  mindfulness_accumulate:
    description: "Mindfulness skill accumulates over practice days (a learning-curve effect with diminishing returns)"
    condition: "yoga_intensity > 0"
    priority: 5
    dynamics:
      mindfulness_score: "min(100.0, mindfulness_score + 0.3 * (session_duration / 60.0) * (1.0 - mindfulness_score / 100.0))"
  hrv_cortisol_coupling:
    description: "A low-cortisol state reinforces HRV recovery (stress-recovery coupling: HRV gets an additional boost when cortisol is below 12)"
    condition: "cortisol_level < 12.0"
    priority: 4
    dynamics:
      hrv_score: "min(120.0, hrv_score + (12.0 - cortisol_level) * 0.02)"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-03-26"
  output_variables: [flexibility_index, cortisol_level, hrv_score, mindfulness_score]
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: yoga_intensity
        time_start: "07:30"
        value: 3.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-03-26"]
        label: "Hatha yoga (3 MET, moderate intensity)"
      - variable: session_duration
        time_start: "07:30"
        value: 60.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-03-26"]
        label: "A 60-minute practice session"

optimization:
  method: nsga2
  objectives:
    - variable: flexibility_index
      metric: final
      direction: maximize
      description: "Maximizing the flexibility index at the end of week 12"
    - variable: hrv_score
      metric: final
      direction: maximize
      description: "Maximizing HRV at the end of week 12 (improved parasympathetic function)"
    - variable: cortisol_level
      metric: final
      direction: minimize
      description: "Minimizing morning cortisol at the end of week 12 (stress reduction)"
  constraints:
    - variable: cortisol_level
      condition: ">= 5"
      type: hard
      description: "A cortisol floor of 5 nmol/L (below this indicates adrenal suppression, a pathological state)"
  startpoint:
    regimens:
      - variable: yoga_intensity
        time_start: "07:30"
        time_end: "07:30"
        label: "Practice intensity (MET, 1.5=yin yoga, 4.5=Ashtanga)"
        optimize:
          value: [1.5, 6.0]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 72.8
    pareto_front:
      - {x: [1.5], f: [-62.0, -54.0, 11.2]}
      - {x: [2.5], f: [-71.0, -58.0, 10.5]}
      - {x: [3.0], f: [-75.0, -61.0, 10.1]}
      - {x: [4.0], f: [-79.0, -63.0, 11.8]}
      - {x: [5.5], f: [-74.0, -59.0, 14.5]}
    recommended:
      x: [3.0]
      f: [-75.0, -61.0, 10.1]

references:
  - "Cramer H et al. (2013) A systematic review and meta-analysis of yoga for low back pain. Clin J Pain 29(5):450-460."
  - "Innes KE & Vincent HK (2007) The influence of yoga-based programs on risk profiles in adults with type 2 diabetes. J Am Board Fam Med 20(5):486-492."
  - "Ross A & Thomas S (2010) The health benefits of yoga and exercise: a review of comparison studies. J Altern Complement Med 16(1):3-12."
  - "Streeter CC et al. (2012) Effects of yoga on the autonomic nervous system, gamma-aminobutyric-acid, and allostasis in epilepsy, depression, and post-traumatic stress disorder. Med Hypotheses 78(5):571-579."
  - "Pascoe MC & Bauer IE (2015) A systematic review of randomised control trials on the effects of yoga on stress measures and mood. J Psychiatr Res 68:270-282."
