category: physiological

metadata:
  name: volleyball
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      排球是以垂直起跳为核心爆发动作的间歇性运动，每次扣球或拦网跳约持续 3-5 秒，
      间歇期约 15-20 秒（发球/准备）。精英男子运动员每场垂直跳次数可超过 300 次，
      跳跃能力（起跳高度）随疲劳积累系统性衰减——Sheppard 等（2008）研究表明高强度比赛后
      弹跳力可降低约 10-15%。
      拦网触及高度直接影响防守成功率，因此跳跃能力维持与比赛强度之间的权衡
      是排球体能管理的核心生理问题。
    result: >
      仿真尚未运行。理论预期：扣球强度 RPE=7、防守频率 1 次/分钟的 90 分钟比赛中，
      跳跃能力指数从基线 100 降至约 72，拦网触及高度从 320 cm 降至约 296-302 cm，
      疲劳指数在比赛末达到约 0.48；降低扣球强度至 RPE=5 时跳跃能力维持在约 82-85，
      两者在跳跃能力-疲劳空间形成 Pareto 权衡前沿。
    limitations: >
      未区分二传、主攻、自由人等不同位置的代谢负荷和跳跃频次差异；
      跳跃次数模型未细分助跑扣球与原地拦网的生物力学差异；参数基于精英男子排球运动员。
  ratings:
    topic_importance: 3 - 排球爆发力衰减建模有一定运动科学价值，受众较专项
    framework_demand: 2 - 团队运动专项模型，上层引用预期低
    evidence_quality: 3 - 引用Sheppard/Gabbett等文献，参数基本有据
    popularity: 2 - 排球生理模型较小众，通用度有限
  tags: [volleyball, team, interval, explosive, jump_power, blocking, VO2]
  references:
    - "Sheppard JM et al. (2008) Relative importance of strength, power, and anthropometric measures on jump performance in elite volleyball players. J Strength Cond Res 22(3):758-765."
    - "Palao JM et al. (2014) Physical actions and physiological load during short-duration volleyball competitions. Int J Perform Anal Sport 14(1):119-131."
    - "Gabbett TJ et al. (2007) Physiological and anthropometric characteristics of junior elite and sub-elite volleyball players with consideration for the positions played. J Sports Sci 25(5):583-592."
  step_size:
    value: 1
    unit: minute

variables:
  spike_intensity:
    type: input
    value: 7.0
    unit: "RPE(0-10)"
    bounds: [0.0, 10.0]
    description: "扣球/拦网爆发强度（0=无跳跃，7=中等对抗，10=全力扣杀）"
  dive_frequency:
    type: input
    value: 1.0
    unit: "次/min"
    bounds: [0.0, 5.0]
    description: "防守滑步/鱼跃频率（精英自由人约每分钟1-3次）"
  heart_rate:
    type: state
    value: 75.0
    unit: "bpm"
    bounds: [50.0, 200.0]
    description: "心率（排球平均约150-165 bpm，约75-85% HRmax；Gabbett 2007）"
  vo2:
    type: state
    value: 10.0
    unit: "mL/kg/min"
    bounds: [5.0, 65.0]
    description: "摄氧量（排球间歇特征，平均约30-40 mL/kg/min）"
  jump_power_index:
    type: state
    value: 100.0
    unit: "分"
    bounds: [0.0, 100.0]
    description: "跳跃能力指数（100=比赛初始状态；精英垂直跳高均约80-90cm；Sheppard 2008）"
  fatigue:
    type: state
    value: 0.0
    unit: "无量纲"
    bounds: [0.0, 1.0]
    description: "综合疲劳指数（0=无疲劳，1=力竭；>0.5时跳跃能力明显衰减）"
  blocking_reach:
    type: state
    value: 320.0
    unit: "cm"
    bounds: [200.0, 380.0]
    description: "拦网触及高度（精英男子约320-340cm；疲劳导致起跳高度下降）"
  calories_burned:
    type: state
    value: 0.0
    unit: "kcal"
    bounds: [0.0, 1000.0]
    description: "累计热量消耗（90分钟比赛约400-700 kcal；Palao 2014）"

formulas:
  heart_rate_dynamics:
    description: "心率随扣球强度和防守活动响应（Gabbett 2007：排球间歇性心率波动）"
    condition: true
    priority: 10
    dynamics:
      heart_rate: "min(200, 75 + spike_intensity * 9 + dive_frequency * 6 + fatigue * 12)"
  vo2_response:
    description: "摄氧量跟随运动强度（排球间歇特征均值约35 mL/kg/min）"
    condition: "spike_intensity > 0"
    priority: 9
    dynamics:
      vo2: "min(65, 8 + spike_intensity * 3.5 + dive_frequency * 2.0)"
  jump_power_decay:
    description: "跳跃能力随疲劳积累下降（Sheppard 2008：精英运动员跳跃力在高强度比赛后衰减约10-15%）"
    condition: true
    priority: 8
    dynamics:
      jump_power_index: "max(0, 100 - fatigue * 45 - max(0, spike_intensity - 7) * 1.0)"
  fatigue_accumulation:
    description: "疲劳由扣球跳跃和防守动作共同驱动（每小时约300次垂直跳跃；Palao 2014）"
    condition: true
    priority: 7
    dynamics:
      fatigue: "min(1.0, fatigue + spike_intensity * 0.0014 + dive_frequency * 0.0008)"
  blocking_reach_decay:
    description: "拦网高度随疲劳下降（起跳能力衰减导致触球点降低）"
    condition: true
    priority: 6
    dynamics:
      blocking_reach: "max(200, 320 - fatigue * 50)"
  calories_accumulation:
    description: "热量消耗（排球约5-8 kcal/min，间歇特性下强度调整）"
    condition: "spike_intensity > 0"
    priority: 5
    dynamics:
      calories_burned: "calories_burned + 4.0 + spike_intensity * 0.55 + dive_frequency * 0.5"

simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables:
    - heart_rate
    - vo2
    - jump_power_index
    - fatigue
    - blocking_reach
    - calories_burned
  schedules:
    - variable: spike_intensity
      time: "09:00"
      value: 7.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-01"]
      label: "扣球强度（RPE=7，中高强度对抗）"
    - variable: dive_frequency
      time: "09:00"
      value: 1.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-01-01"]
      label: "防守鱼跃频率（1次/min）"

optimizer:
  method: nsga2
  objectives:
    - variable: jump_power_index
      metric: final
      direction: maximize
      description: "最大化比赛末跳跃能力维持"
    - variable: fatigue
      metric: final
      direction: minimize
      description: "最小化比赛末疲劳指数"
  constraints:
    - variable: heart_rate
      condition: "<= 185"
      type: soft
      description: "心率控制在185 bpm以内"
    - variable: blocking_reach
      condition: ">= 280"
      type: soft
      description: "拦网高度不低于280cm（技战术下限）"
  schedules:
    - variable: spike_intensity
      time_start: "09:00"
      time_end: "09:00"
      label: "扣球强度（RPE 4-10）"
      optimize:
        value: [4.0, 10.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 55.3
    pareto_front:
      - {x: [4.0], f: [-85.0, 0.25]}
      - {x: [5.5], f: [-80.0, 0.35]}
      - {x: [7.0], f: [-72.0, 0.48]}
      - {x: [8.5], f: [-62.0, 0.62]}
      - {x: [10.0], f: [-50.0, 0.78]}
    reference:
      x: [7.0]
      f: [-72.0, 0.48]
      regimen:
        spike_intensity: {"09:00": 7.0}
      objectives:
        jump_power_index: 72.0
        fatigue: 0.48
