metadata:
  todo:
    - type: noref
      issue: "Missing sufficient literature citation support (migrated from the old _noref filename suffix)"
      evidence: "Migrated from the old _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check for and fill in missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  conflicts: []
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Football (soccer) is the world's most participated-in sport; a professional player covers
      about 10-13 km on average over a 90-minute match, of which 800-1200 m is high-speed
      sprinting. Its physiological character combines aerobic endurance with anaerobic bursts:
      sustained moderate-intensity running depletes muscle glycogen, while frequent sprints trigger
      anaerobic metabolism and raise lactate; technical performance, meaning passing accuracy and
      ball control, declines markedly with fatigue after 60-75 minutes, with glycogen becoming a
      key limiting factor in the second half. The sprint-tactic proportion is the core lever
      controlling the fatigue-accumulation rate.
    result: >
      Not yet run. Theoretical expectation: in a 90-minute match at RPE=6 with a sprint proportion
      of 25%, muscle glycogen depletes gradually from a full store of 100% to about 40-50%, the
      fatigue index rises to about 0.7-0.8 after 80 minutes, the technique score falls from 80 to
      about 60-65, and the overall performance score is about 55-65; the match burns roughly
      800-1000 kcal overall.
    limitations: >
      This file is marked noref, and its model parameters lack a formal literature source, with the
      mechanism a qualitative approximation not suited to high-precision quantitative prediction.
      Running-pattern and fitness-expenditure differences between positions such as forward,
      midfielder, and defender are not distinguished; the effect of hydration strategy and ambient
      temperature on glycogen depletion and fatigue is not modeled.
  name: football
  lm_format_version: "1.0"
  ratings:
    importance: 0.25 - Football is the world's biggest sport, and its intermittent high-intensity physiology has broad research value; noref, so reuse value is very low
    variable: 0.25 - Marked noref, with parameters having no literature source and the mechanism a qualitative description
    equation: 0.25 - An equation structure exists but is a qualitative description with no literature basis and no independent reproduction seen
    simulation: 0.25 - No blocking todo found, but not confirmed to actually run, and not compared against an independent literature target value
    optimization: 0.25 - A decision-variable search structure exists, but lacks literature-backed tradeoff evidence
    confidence: 0.0 - Parameters have no literature source, and no independent validation has been run
  tags:
    - fitness
    - football
    - soccer
    - interval
    - endurance
  updated: 2026-04-23
variables:
  game_intensity:
    bounds:
      - 0.0
      - 10.0
    description: The current exercise intensity (RPE 0-10)
    type: input
    unit: RPE
    value: 6.0
  sprint_ratio:
    bounds:
      - 0.0
      - 1.0
    description: The sprint proportion (0-1), higher means a fast-break or high-pressing tactic
    type: input
    unit: fraction
    value: 0.25
  heart_rate:
    bounds:
      - 60.0
      - 200.0
    description: Heart rate
    type: state
    unit: bpm
    value: 70.0
  vo2:
    bounds:
      - 0.0
      - 70.0
    description: Oxygen uptake
    type: state
    unit: mL/kg/min
    value: 5.0
  distance_covered:
    bounds:
      - 0.0
      - 15000.0
    description: Cumulative running distance
    type: state
    unit: meters
    value: 0.0
  sprint_distance:
    bounds:
      - 0.0
      - 3000.0
    description: Cumulative high-speed sprint distance
    type: state
    unit: meters
    value: 0.0
  calories_burned:
    bounds:
      - 0.0
      - 1500.0
    description: Calories burned
    type: state
    unit: kcal
    value: 0.0
  fatigue:
    bounds:
      - 0.0
      - 1.0
    description: The fatigue index (0=no fatigue, 1=exhaustion)
    type: state
    unit: dimensionless
    value: 0.0
  lactate:
    bounds:
      - 0.8
      - 15.0
    description: Blood lactate concentration
    type: state
    unit: mmol/L
    value: 1.0
  muscle_glycogen:
    bounds:
      - 0.0
      - 100.0
    description: Muscle glycogen store percentage
    type: state
    unit: '%'
    value: 100.0
  aerobic_fitness:
    bounds:
      - 0.0
      - 100.0
    description: An aerobic-fitness index (a VO2max proxy)
    type: parameter
    unit: score
    value: 65.0
  technical_performance:
    bounds:
      - 0.0
      - 100.0
    description: A technique score (passing and ball-control quality)
    type: state
    unit: score
    value: 80.0
  performance:
    bounds:
      - 0.0
      - 100.0
    description: An overall match-performance score
    type: state
    unit: score
    value: 75.0
equations:
  heart_rate_dynamics:
    condition: true
    description: Heart rate changes with intensity and fatigue
    dynamics:
      heart_rate: 60 + game_intensity * 13 + fatigue * 15
    priority: 1
  vo2_dynamics:
    condition: true
    description: Oxygen uptake follows heart rate
    dynamics:
      vo2: max(5, (heart_rate - 60) / 140 * aerobic_fitness)
    priority: 2
  distance_accumulation:
    condition: true
    description: Running distance accumulates (the step unit is minutes)
    dynamics:
      distance_covered: distance_covered + (100 + game_intensity * 10) * (1 - fatigue * 0.3)
    priority: 3
  sprint_distance_accumulation:
    condition: sprint_ratio > 0.15
    description: Sprint distance accumulates
    dynamics:
      sprint_distance: sprint_distance + sprint_ratio * 30 * (1 - fatigue * 0.4)
    priority: 4
  lactate_sprint:
    condition: sprint_ratio > 0.3
    description: Lactate rises at a high sprint proportion
    dynamics:
      lactate: min(15, lactate + sprint_ratio * 0.8 * (1 - fatigue * 0.2))
    priority: 5
  lactate_clearance:
    condition: sprint_ratio <= 0.3
    description: Lactate clears at a low intensity
    dynamics:
      lactate: max(1.0, lactate - 0.15 * (1 - game_intensity / 15))
    priority: 6
  glycogen_depletion:
    condition: true
    description: Muscle glycogen depletes over time, accelerated by sprinting
    dynamics:
      muscle_glycogen: max(0, muscle_glycogen - (0.05 + sprint_ratio * 0.08) * game_intensity / 10)
    priority: 7
  fatigue_accumulation:
    condition: true
    description: Fatigue accumulates, accelerating once glycogen runs low
    dynamics:
      fatigue: min(1.0, fatigue + (game_intensity * 0.0012 + sprint_ratio * 0.0008) * (1 + max(0, (50 - muscle_glycogen) / 100)))
    priority: 8
  calories_accumulation:
    condition: true
    description: Calories burned
    dynamics:
      calories_burned: calories_burned + (game_intensity * 1.1 + sprint_ratio * 0.8) * (1 - fatigue * 0.1)
    priority: 9
  technical_performance_decay:
    condition: fatigue > 0.4
    description: Fatigue affects technical performance
    dynamics:
      technical_performance: max(40, technical_performance - (fatigue - 0.4) * 0.8)
    priority: 10
  performance_score:
    condition: true
    description: Overall performance score
    dynamics:
      performance: max(0, min(100, technical_performance * 0.5 + (1 - fatigue) * 30 + (muscle_glycogen / 100) * 20))
    priority: 11
simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: game_intensity
        time_start: "15:00"
        value: 6.0
        label: Match intensity
      - variable: sprint_ratio
        time_start: "15:00"
        value: 0.25
        label: Sprint proportion
  output_variables:
    - heart_rate
    - vo2
    - distance_covered
    - sprint_distance
    - calories_burned
    - fatigue
    - lactate
    - muscle_glycogen
    - technical_performance
    - performance

optimization:
  method: nsga2
  objectives:
    - variable: distance_covered
      direction: maximize
      metric: final
      description: Maximizing the total running distance for the match
    - variable: fatigue
      direction: minimize
      metric: final
      description: Minimizing fatigue at the end of the match
  constraints:
    - variable: lactate
      condition: <= 12.0
      type: hard
      description: Blood lactate should not exceed 12 mmol/L
    - variable: muscle_glycogen
      condition: ">= 20"
      type: soft
      description: Keep a 20% muscle-glycogen reserve
  startpoint:
    regimens:
      - variable: game_intensity
        time_start: "15:00"
        time_end: "15:00"
        label: Match intensity (RPE 3-9)
        optimize:
          value: [3.0, 9.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
