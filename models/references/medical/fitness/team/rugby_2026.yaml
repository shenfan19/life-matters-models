category: physiological

metadata:
  name: rugby
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      Rugby is one of the few sports that combines high-intensity interval running with repeated
      full-body collision contact; a back covers about 800-1400 m of sprinting per match, and a
      forward makes about 30-60 tackles. Repeated collisions trigger muscle micro-tears, releasing
      creatine kinase (CK), a muscle-damage dynamic that peaks 24-48 hours after the match and is
      partly decoupled from real-time in-match fatigue, making rugby a distinctive model for
      studying mechanical damage layered on top of metabolic fatigue. The sprint proportion sets the
      aerobic-anaerobic metabolic split, tackle frequency drives collision-stress accumulation, and
      the two together constrain a player's field coverage.
    result: >
      Not yet run. Theoretical expectation: in an 80-minute match for a back scenario with a sprint
      proportion of 15% and a tackle frequency of 1.5 per minute, the collision-stress index rises to
      about 100, the muscle-damage index to about 16, the fatigue index to about 0.65, and the total
      running distance to about 7300 m; raising the sprint proportion to 30% increases distance to
      about 8000 m, but the muscle-damage index rises to about 30.
    limitations: >
      The model uses generic parameters and does not distinguish forward from back positions;
      muscle-damage (CK) dynamics are an in-match approximation, since the real CK peak occurs
      24-48 hours after the match and cannot be accurately captured within the simulation's time
      range. Skeletal stress and neuromuscular concussion effects from a collision are not modeled.
  ratings:
    importance: 0.25 - A rugby collision-fatigue model has specialized sports-medicine value, with a fairly concentrated audience; a team-sport specialty model, expected to have low reuse elsewhere
    variable: 0.5 - Cites publications such as Duthie/Cunniffe, with fairly well-founded parameters
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
  tags: [rugby, team, contact, collision, sprint, muscle_damage, CK, VO2max]

variables:
  tackle_frequency:
    type: input
    value: 1.5
    unit: "per min"
    bounds: [0.0, 6.0]
    description: "Tackle/collision frequency (a forward is about 2-4 per minute, a back about 0.5-2 per minute; Austin 2011)"
  sprint_ratio:
    type: input
    value: 0.15
    unit: "fraction"
    bounds: [0.0, 0.5]
    description: "The high-speed-sprint time proportion (a back is about 10-20%, a forward about 5-10%; Cunniffe 2009)"
  heart_rate:
    type: state
    value: 75.0
    unit: "bpm"
    bounds: [50.0, 200.0]
    description: "Heart rate (a back averages about 165-175 bpm, a forward about 155-165 bpm; Cunniffe 2009)"
  vo2:
    type: state
    value: 10.0
    unit: "mL/kg/min"
    bounds: [5.0, 70.0]
    description: "Oxygen uptake (a forward's VO2max is about 50-55, a back's about 55-65 mL/kg/min; Duthie 2003)"
  collision_stress_index:
    type: state
    value: 0.0
    unit: "dimensionless"
    bounds: [0.0, 100.0]
    description: "The collision-stress index (cumulative collision intensity times frequency; drives the post-match CK rise; Austin 2011)"
  muscle_damage_index:
    type: state
    value: 0.0
    unit: "dimensionless"
    bounds: [0.0, 100.0]
    description: "The muscle-damage index (a CK-release proxy; a high value signals a longer recovery-period risk)"
  fatigue:
    type: state
    value: 0.0
    unit: "dimensionless"
    bounds: [0.0, 1.0]
    description: "Overall fatigue (metabolic fatigue plus collision buildup; above 0.7, running speed and decision quality decline)"
  distance_covered:
    type: state
    value: 0.0
    unit: "m"
    bounds: [0.0, 12000.0]
    description: "Cumulative running distance (a back covers about 7000-8000m per match, a forward about 5000-6000m; Duthie 2003)"

equations:
  heart_rate_dynamics:
    description: "Heart rate responds to sprint and collision intensity (Cunniffe 2009: rugby averages about 170 bpm)"
    condition: true
    priority: 10
    dynamics:
      heart_rate: "min(200, 80 + sprint_ratio * 100 + tackle_frequency * 8 + fatigue * 15)"
  vo2_response:
    description: "Oxygen uptake follows the sprint proportion (approaching VO2max during a sprint; Duthie 2003)"
    condition: "sprint_ratio > 0"
    priority: 9
    dynamics:
      vo2: "min(70, 15 + sprint_ratio * 100 + tackle_frequency * 2)"
  collision_stress_accumulation:
    description: "Collision stress accumulates with tackle frequency and sprint intensity (contact count times intensity; Austin 2011)"
    condition: true
    priority: 8
    dynamics:
      collision_stress_index: "min(100, collision_stress_index + tackle_frequency * 1.2 + sprint_ratio * 5)"
  muscle_damage_accumulation:
    description: "Muscle damage is driven by collision-stress accumulation (mechanical stress leading to micro-tears leading to CK release)"
    condition: "collision_stress_index > 20"
    priority: 7
    dynamics:
      muscle_damage_index: "min(100, muscle_damage_index + (collision_stress_index - 20) * 0.015)"
  fatigue_accumulation:
    description: "Fatigue has two sources: metabolic (sprinting) and mechanical (collision)"
    condition: true
    priority: 6
    dynamics:
      fatigue: "min(1.0, fatigue + sprint_ratio * 0.006 + tackle_frequency * 0.003 + muscle_damage_index * 0.0005)"
  distance_accumulation:
    description: "Running distance accumulates (sprinting contributes more than jogging; Cunniffe 2009: about 7km total for a back)"
    condition: true
    priority: 5
    dynamics:
      distance_covered: "distance_covered + 60 + sprint_ratio * 120 + max(0, 0.3 - tackle_frequency * 0.05) * 20"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables:
    - heart_rate
    - vo2
    - collision_stress_index
    - muscle_damage_index
    - fatigue
    - distance_covered
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: tackle_frequency
        time_start: "15:00"
        value: 1.5
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Tackle frequency (1.5 per minute, a back scenario)"
      - variable: sprint_ratio
        time_start: "15:00"
        value: 0.15
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Sprint proportion (15%, a typical value for a back)"

optimization:
  method: nsga2
  objectives:
    - variable: distance_covered
      metric: final
      direction: maximize
      description: "Maximizing total running distance (field coverage)"
    - variable: muscle_damage_index
      metric: final
      direction: minimize
      description: "Minimizing the muscle-damage index (reducing the post-match recovery burden)"
  constraints:
    - variable: fatigue
      condition: "<= 0.85"
      type: hard
      description: "Fatigue should not exceed 0.85 (preventing an exhaustion-injury risk)"
    - variable: heart_rate
      condition: "<= 190"
      type: soft
      description: "Keep heart rate within 190 bpm"
  startpoint:
    regimens:
      - variable: sprint_ratio
        time_start: "15:00"
        time_end: "15:00"
        label: "Sprint time proportion (5-35%)"
        optimize:
          value: [0.05, 0.35]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 71.2
    pareto_front:
      - {x: [0.05], f: [-6200.0, 8.5]}
      - {x: [0.10], f: [-6800.0, 12.0]}
      - {x: [0.15], f: [-7300.0, 16.5]}
      - {x: [0.22], f: [-7700.0, 22.0]}
      - {x: [0.30], f: [-8000.0, 30.0]}
    recommended:
      x: [0.15]
      f: [-7300.0, 16.5]

references:
  - citation: "Duthie G et al. (2003) Applied physiology and game analysis of rugby union. Sports Med 33(13):973-991."
    description: "Supplies position-specific VO2max and running-distance data, the parameter source for the oxygen-uptake dynamics and running-distance accumulation mechanism."
  - citation: "Cunniffe B et al. (2009) An evaluation of the physiological demands of elite rugby union using global positioning system tracking software. J Strength Cond Res 23(4):1195-1203."
    description: "Supplies heart-rate, sprint-proportion, and running-distance data from GPS tracking, the parameter source for the heart-rate dynamics and running-distance accumulation mechanism."
  - citation: "Austin DJ et al. (2011) Physiological response to tackling in rugby league. J Strength Cond Res 25(4):1038-1042."
    description: "Supplies physiological-response data for a tackle collision, the parameter source for the collision-stress accumulation mechanism."
