category: physiological

metadata:
  name: volleyball
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      Volleyball is an intermittent sport centered on the vertical jump as its core explosive
      action; each spike or block jump lasts about 3-5 seconds, followed by a rest of about
      15-20 seconds for serving and preparation. An elite male player can exceed 300 vertical jumps
      per match, and jump ability (jump height) declines systematically with fatigue accumulation;
      Sheppard et al. (2008) found that jump power can drop by about 10-15% after a high-intensity
      match. Blocking-reach height directly affects defensive success, so the tradeoff between
      maintaining jump ability and match intensity is the core physiological problem in volleyball
      conditioning.
    result: >
      Not yet run. Theoretical expectation: in a 90-minute match at a spike intensity of RPE=7 and a
      defensive frequency of 1 per minute, the jump-power index falls from a baseline of 100 to
      about 72, blocking reach falls from 320 cm to about 296-302 cm, and the fatigue index reaches
      about 0.48 by the end of the match; lowering spike intensity to RPE=5 keeps jump power at
      about 82-85, with the two forming a Pareto tradeoff front in jump-power-versus-fatigue space.
    limitations: >
      Metabolic-load and jump-frequency differences between positions such as setter, outside
      hitter, and libero are not distinguished; the jump-count model does not separate the
      biomechanics of an approach spike from an in-place block; the parameters are based on elite
      male volleyball players.
  ratings:
    importance: 0.25 - Modeling volleyball's explosive-power decay has some exercise-science value, with a fairly specialized audience; a team-sport specialty model, expected to have low reuse elsewhere
    variable: 0.5 - Cites publications such as Sheppard/Gabbett, with fairly well-founded parameters
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
  tags: [volleyball, team, interval, explosive, jump_power, blocking, VO2]

variables:
  spike_intensity:
    type: input
    value: 7.0
    unit: "RPE(0-10)"
    bounds: [0.0, 10.0]
    description: "Spike/block explosive intensity (0=no jumping, 7=moderate contest, 10=an all-out kill)"
  dive_frequency:
    type: input
    value: 1.0
    unit: "per min"
    bounds: [0.0, 5.0]
    description: "Defensive slide/dive frequency (an elite libero is about 1-3 per minute)"
  heart_rate:
    type: state
    value: 75.0
    unit: "bpm"
    bounds: [50.0, 200.0]
    description: "Heart rate (volleyball averages about 150-165 bpm, roughly 75-85% HRmax; Gabbett 2007)"
  vo2:
    type: state
    value: 10.0
    unit: "mL/kg/min"
    bounds: [5.0, 65.0]
    description: "Oxygen uptake (volleyball's intermittent character averages about 30-40 mL/kg/min)"
  jump_power_index:
    type: state
    value: 100.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "The jump-ability index (100=the match's starting state; an elite vertical jump averages about 80-90cm; Sheppard 2008)"
  fatigue:
    type: state
    value: 0.0
    unit: "dimensionless"
    bounds: [0.0, 1.0]
    description: "An overall fatigue index (0=no fatigue, 1=exhaustion; above 0.5, jump ability declines markedly)"
  blocking_reach:
    type: state
    value: 320.0
    unit: "cm"
    bounds: [200.0, 380.0]
    description: "Blocking-reach height (an elite male is about 320-340cm; fatigue lowers jump height)"
  calories_burned:
    type: state
    value: 0.0
    unit: "kcal"
    bounds: [0.0, 1000.0]
    description: "Cumulative calories burned (a 90-minute match burns about 400-700 kcal; Palao 2014)"

equations:
  heart_rate_dynamics:
    description: "Heart rate responds to spike intensity and defensive activity (Gabbett 2007: volleyball's heart rate fluctuates intermittently)"
    condition: true
    priority: 10
    dynamics:
      heart_rate: "min(200, 75 + spike_intensity * 9 + dive_frequency * 6 + fatigue * 12)"
  vo2_response:
    description: "Oxygen uptake follows exercise intensity (volleyball's intermittent average is about 35 mL/kg/min)"
    condition: "spike_intensity > 0"
    priority: 9
    dynamics:
      vo2: "min(65, 8 + spike_intensity * 3.5 + dive_frequency * 2.0)"
  jump_power_decay:
    description: "Jump ability declines with fatigue accumulation (Sheppard 2008: an elite athlete's jump power declines about 10-15% after a high-intensity match)"
    condition: true
    priority: 8
    dynamics:
      jump_power_index: "max(0, 100 - fatigue * 45 - max(0, spike_intensity - 7) * 1.0)"
  fatigue_accumulation:
    description: "Fatigue is driven jointly by spike jumping and defensive actions (about 300 vertical jumps per hour; Palao 2014)"
    condition: true
    priority: 7
    dynamics:
      fatigue: "min(1.0, fatigue + spike_intensity * 0.0014 + dive_frequency * 0.0008)"
  blocking_reach_decay:
    description: "Blocking height declines with fatigue (declining jump ability lowers the contact point)"
    condition: true
    priority: 6
    dynamics:
      blocking_reach: "max(200, 320 - fatigue * 50)"
  calories_accumulation:
    description: "Calories burned (volleyball is about 5-8 kcal/min, adjusted for its intermittent character and intensity)"
    condition: "spike_intensity > 0"
    priority: 5
    dynamics:
      calories_burned: "calories_burned + 4.0 + spike_intensity * 0.55 + dive_frequency * 0.5"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables:
    - heart_rate
    - vo2
    - jump_power_index
    - fatigue
    - blocking_reach
    - calories_burned
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: spike_intensity
        time_start: "09:00"
        value: 7.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Spike intensity (RPE=7, a moderate-to-high-intensity contest)"
      - variable: dive_frequency
        time_start: "09:00"
        value: 1.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Defensive dive frequency (1 per minute)"

optimization:
  method: nsga2
  objectives:
    - variable: jump_power_index
      metric: final
      direction: maximize
      description: "Maximizing jump ability retained by the end of the match"
    - variable: fatigue
      metric: final
      direction: minimize
      description: "Minimizing the fatigue index at the end of the match"
  constraints:
    - variable: heart_rate
      condition: "<= 185"
      type: soft
      description: "Keep heart rate within 185 bpm"
    - variable: blocking_reach
      condition: ">= 280"
      type: soft
      description: "Blocking height should not fall below 280cm (a tactical lower bound)"
  startpoint:
    regimens:
      - variable: spike_intensity
        time_start: "09:00"
        time_end: "09:00"
        label: "Spike intensity (RPE 4-10)"
        optimize:
          value: [4.0, 10.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 55.3
    pareto_front:
      - {x: [4.0], f: [-85.0, 0.25]}
      - {x: [5.5], f: [-80.0, 0.35]}
      - {x: [7.0], f: [-72.0, 0.48]}
      - {x: [8.5], f: [-62.0, 0.62]}
      - {x: [10.0], f: [-50.0, 0.78]}
    recommended:
      x: [7.0]
      f: [-72.0, 0.48]

references:
  - citation: "Sheppard JM et al. (2008) Relative importance of strength, power, and anthropometric measures on jump performance in elite volleyball players. J Strength Cond Res 22(3):758-765."
    description: "Found that jump power can decline by about 10-15% after a high-intensity match, the direct parameter source for jump ability's decay with fatigue."
  - citation: "Palao JM et al. (2014) Physical actions and physiological load during short-duration volleyball competitions. Int J Perform Anal Sport 14(1):119-131."
    description: "Supplies data on in-match physical actions and physiological load, the parameter source for the calorie-burn and fatigue-accumulation mechanisms."
  - citation: "Gabbett TJ et al. (2007) Physiological and anthropometric characteristics of junior elite and sub-elite volleyball players with consideration for the positions played. J Sports Sci 25(5):583-592."
    description: "Supplies physiological and anthropometric data across positions, the parameter source for the heart-rate and oxygen-uptake dynamics."
