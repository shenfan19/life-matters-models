metadata:
  todo:
    - type: noref
      issue: "Missing sufficient literature citation support (migrated from the old _noref filename suffix)"
      evidence: "Migrated from the old _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check for and fill in missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: basketball
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Basketball is a classic intermittent, high-intensity team sport, with explosive actions such
      as sprints and jumps alternating with low-to-moderate-intensity running across a 48-minute
      game. Its core physiological feature is fluctuating lactate accumulation: every sprint and
      change of direction triggers anaerobic metabolism, with lactate fluctuating in the
      2-8 mmol/L range; aerobic metabolism during a lull can partially clear it but cannot fully
      recover. As fatigue accumulates, agility and shooting accuracy decline systematically,
      forming a tradeoff between game intensity and sustained performance.
    result: >
      Not yet run. Theoretical expectation: in a 48-minute game at RPE=6 with a sprint frequency of
      3 per minute, fatigue exceeds 60 points after 35-45 minutes, agility falls from 90 to about
      70-75, and shooting accuracy falls from 45% to about 35-40%; the game burns roughly
      650-800 kcal overall.
    limitations: >
      This file is marked noref, and its model parameters lack a formal literature source, with the
      mechanism a qualitative approximation not suited to high-precision quantitative prediction.
      Metabolic-load differences between positions such as point guard, forward, and center are not
      distinguished; recovery dynamics during a timeout or a foul-clock stoppage are not modeled.
  ratings:
    importance: 0.25 - Basketball is a globally mainstream sport, and its intermittent high-intensity character has research value; noref, so reuse value is very low
    variable: 0.25 - Marked noref, with parameters having no literature source and the mechanism a qualitative description
    equation: 0.25 - An equation structure exists but is a qualitative description with no literature basis and no independent reproduction seen
    simulation: 0.25 - No blocking todo found, but not confirmed to actually run, and not compared against an independent literature target value
    optimization: 0.25 - A decision-variable search structure exists, but lacks literature-backed tradeoff evidence
    confidence: 0.0 - Parameters have no literature source, and no independent validation has been run
  tags: [sport, basketball, interval, explosive]

variables:
  game_intensity:
    type: input
    value: 6.0
    unit: "RPE(0-10)"
    bounds: [0.0, 10.0]
    description: "The current game intensity (offense/defense pace; timeout=0, full-court press=9)"
  sprint_frequency:
    type: input
    value: 3.0
    unit: "per minute"
    bounds: [0.0, 8.0]
    description: "Sprint/direction-change frequency (rises on a fast break or a defensive scramble)"
  heart_rate:
    type: state
    value: 75.0
    unit: "bpm"
    bounds: [50.0, 200.0]
    description: "Heart rate (basketball averages 165-180bpm)"
  calories_burned:
    type: state
    value: 0.0
    unit: "kcal"
    bounds: [0.0, 1200.0]
    description: "Cumulative calories burned (about 600-900kcal per game)"
  fatigue:
    type: state
    value: 0.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "Overall fatigue (above 60 affects shooting precision and defensive coverage range)"
  lactate:
    type: state
    value: 1.5
    unit: "mmol/L"
    bounds: [0.5, 18.0]
    description: "Blood lactate (fluctuates 2-8mmol/L within intermittent-exercise range)"
  agility:
    type: state
    value: 90.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "Agility (a fatigued player's stop-and-cut ability declines)"
  shot_accuracy:
    type: state
    value: 45.0
    unit: "%"
    bounds: [0.0, 100.0]
    description: "Shooting accuracy (fatigue and lactate affect upper-limb control precision)"
  performance:
    type: state
    value: 100.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "Overall on-court performance"

equations:
  heart_rate_response:
    description: "Heart rate during intermittent exercise (spikes on a sprint, partly falls back during a lull)"
    condition: true
    priority: 10
    dynamics:
      heart_rate: "min(200, 80 + game_intensity * 10 + sprint_frequency * 5)"
  calorie_burn:
    description: "Calories burned (about 10-15kcal/min, adjusted by intensity)"
    condition: "game_intensity > 0"
    priority: 8
    dynamics:
      calories_burned: "calories_burned + 7.0 + game_intensity * 0.8 + sprint_frequency * 0.5"
  fatigue_accumulate:
    description: "Fatigue is driven jointly by intensity and sprinting"
    condition: "game_intensity > 0"
    priority: 8
    dynamics:
      fatigue: "min(100, fatigue + game_intensity * 0.09 + sprint_frequency * 0.05)"
  lactate_interval:
    description: "Lactate accumulates on a sprint and clears slowly during a low-intensity period"
    condition: true
    priority: 8
    dynamics:
      lactate: "max(0.5, min(18, lactate + sprint_frequency * 0.3 - (1 - game_intensity / 10) * 0.1))"
  agility_decay:
    description: "Agility declines with fatigue"
    condition: true
    priority: 7
    dynamics:
      agility: "max(0, 90 - fatigue * 0.5 - max(0, lactate - 5) * 2)"
  shot_accuracy_decay:
    description: "Shooting accuracy is affected by fatigue and lactate (declining arm-control ability)"
    condition: true
    priority: 7
    dynamics:
      shot_accuracy: "max(0, 45 - fatigue * 0.25 - max(0, lactate - 6) * 2)"
  performance_update:
    description: "Overall performance"
    condition: true
    priority: 6
    dynamics:
      performance: "max(0, (agility * 0.5 + shot_accuracy * 1.1) * (1 - fatigue * 0.004))"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [heart_rate, calories_burned, fatigue, lactate, agility, shot_accuracy, performance]

optimization:
  method: nsga2
  objectives:
    - variable: performance
      metric: final
      direction: maximize
    - variable: shot_accuracy
      metric: mean
      direction: maximize
  constraints:
    - variable: fatigue
      condition: "<= 9.0"
      type: soft
      description: "Perceived fatigue should not exceed 9"
    - variable: lactate
      condition: "<= 12.0"
      type: hard
      description: "Blood lactate should not exceed 12 mmol/L"
  startpoint:
    regimens:
      - variable: game_intensity
        time_start: "19:00"
        time_end: "19:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Game intensity (RPE 0-10)"
        optimize:
          value: [0.0, 10.0]
      - variable: sprint_frequency
        time_start: "19:00"
        time_end: "19:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Sprint frequency (per minute)"
        optimize:
          value: [0.0, 8.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
