category: physiological

metadata:
  name: hockey
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      Ice hockey's shift-based structure, about 45-60 seconds near maximal intensity followed by
      3-4 minutes of bench rest, is one of all team sports' most anaerobically dominant patterns.
      Within a single shift, lactate can rise from baseline to 6-10 mmol/L in just 45 seconds, while
      the 3-4 minute bench rest only partially clears it, so the accumulated effect of many shifts
      keeps lactate rising through the second half of a match. Skating efficiency, the mechanical
      effectiveness of the skate's push-off, declines markedly with fatigue and rising lactate, a
      key technique-fitness coupling metric that distinguishes an elite from an amateur player and
      also governs how well shot power is maintained.
    result: >
      Not yet run. Theoretical expectation: in a 60-minute match at a skating intensity of RPE=8 and
      a shift length of 50 seconds, lactate accumulates to about 7-9 mmol/L in the second half,
      skating efficiency falls from a baseline of 90 to about 60-70, the fatigue index reaches about
      0.48 by the end of the match, and shot power is maintained at about 90; extending the shift to
      70 seconds pushes lactate past 10 mmol/L, and shot power falls to about 75.
    limitations: >
      Does not distinguish the typical shift-length difference between forward (about 45 seconds)
      and defense (about 55-60 seconds) positions; a one-minute step size is a timescale
      approximation for a 45-60 second shift structure; environmental factors such as ice
      temperature and skate blade type are not modeled.
  ratings:
    importance: 0.25 - Ice hockey's shift-based, anaerobically dominant character has specialized research value, with an audience concentrated in North America/Northern Europe; a team-sport specialty model, expected to have low reuse elsewhere
    variable: 0.5 - Cites classic publications such as Montgomery/Cox, with fairly well-founded parameters
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
  tags: [hockey, ice_hockey, team, anaerobic, shift, lactate, skating_efficiency, VO2max]

variables:
  skating_intensity:
    type: input
    value: 8.0
    unit: "RPE(0-10)"
    bounds: [0.0, 10.0]
    description: "Skating intensity (0=bench rest, 8=normal shift intensity, 10=an all-out sprint shift)"
  shift_duration:
    type: input
    value: 50.0
    unit: "sec"
    bounds: [30.0, 90.0]
    description: "Shift length (an elite forward is about 45-60 seconds; a longer shift accelerates lactate buildup; Montgomery 1988)"
  heart_rate:
    type: state
    value: 75.0
    unit: "bpm"
    bounds: [50.0, 200.0]
    description: "Heart rate (about 90% HRmax, roughly 180 bpm, during a shift; falls to about 130 bpm between shifts; Montgomery 1988)"
  vo2:
    type: state
    value: 10.0
    unit: "mL/kg/min"
    bounds: [5.0, 70.0]
    description: "Oxygen uptake (a VO2max demand of about 55-65 mL/kg/min; Cox 1995)"
  lactate:
    type: state
    value: 1.5
    unit: "mmol/L"
    bounds: [0.5, 14.0]
    description: "Blood lactate (rises to 6-10 mmol/L within a shift; clears incompletely between shifts; Montgomery 1988)"
  skating_efficiency:
    type: state
    value: 90.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "Skating efficiency (an elite player uses the skate's push-off efficiently; declines with fatigue and rising lactate)"
  fatigue:
    type: state
    value: 0.0
    unit: "dimensionless"
    bounds: [0.0, 1.0]
    description: "Overall fatigue (multi-shift lactate buildup plus neuromuscular fatigue; above 0.6, skating efficiency declines markedly)"
  shot_power:
    type: state
    value: 100.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "The shot-power index (an upper-body explosive-power proxy; declines with fatigue and lactate accumulation; Twist & Rhodes 1993)"

equations:
  heart_rate_dynamics:
    description: "Heart rate responds to shift intensity and length (Montgomery 1988: about 90% HRmax within a shift)"
    condition: true
    priority: 10
    dynamics:
      heart_rate: "min(200, 75 + skating_intensity * 11 + (shift_duration - 45) * 0.3 + fatigue * 12)"
  vo2_response:
    description: "Oxygen uptake follows skating intensity (Cox 1995: a VO2max demand of about 60 mL/kg/min)"
    condition: "skating_intensity > 0"
    priority: 9
    dynamics:
      vo2: "min(70, 10 + skating_intensity * 5.5 + (shift_duration - 45) * 0.15)"
  lactate_shift_dynamics:
    description: "Lactate accumulates within a shift (a very short, high-intensity burst; Montgomery 1988: can rise to 8 mmol/L within a shift)"
    condition: "skating_intensity > 5.0"
    priority: 8
    dynamics:
      lactate: "min(14, lactate + (skating_intensity - 5) * 0.22 + (shift_duration / 60.0) * 0.5)"
  lactate_bench_recovery:
    description: "Lactate clears incompletely during bench rest (3-4 minutes of rest removes only part of it)"
    condition: "skating_intensity <= 5.0"
    priority: 8
    dynamics:
      lactate: "max(1.5, lactate - 0.25)"
  fatigue_accumulation:
    description: "Fatigue rises with shift intensity and lactate buildup (the multi-shift accumulation effect)"
    condition: true
    priority: 7
    dynamics:
      fatigue: "min(1.0, fatigue + skating_intensity * 0.0013 + max(0, lactate - 4) * 0.0015)"
  skating_efficiency_decay:
    description: "Skating efficiency declines with fatigue and high lactate (neuromuscular fatigue affects push-off technique)"
    condition: true
    priority: 6
    dynamics:
      skating_efficiency: "max(0, 90 - fatigue * 40 - max(0, lactate - 5) * 3)"
  shot_power_dynamics:
    description: "Shot power declines with fatigue and lactate (Twist & Rhodes 1993: upper-body explosive power decays in ice hockey)"
    condition: true
    priority: 5
    dynamics:
      shot_power: "max(0, 100 - fatigue * 45 - max(0, lactate - 6) * 4)"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables:
    - heart_rate
    - vo2
    - lactate
    - skating_efficiency
    - fatigue
    - shot_power
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: skating_intensity
        time_start: "19:00"
        value: 8.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Game shift intensity (RPE=8)"
      - variable: shift_duration
        time_start: "19:00"
        value: 50.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Shift length (50 seconds, a typical elite-forward value)"

optimization:
  method: nsga2
  objectives:
    - variable: shot_power
      metric: final
      direction: maximize
      description: "Maximizing shot power retained by the end of the match"
    - variable: fatigue
      metric: final
      direction: minimize
      description: "Minimizing overall fatigue at the end of the match"
  constraints:
    - variable: lactate
      condition: "<= 10.0"
      type: soft
      description: "Keep blood lactate within 10 mmol/L (avoiding extreme acidosis)"
    - variable: heart_rate
      condition: "<= 195"
      type: soft
      description: "Keep heart rate within 195 bpm"
  startpoint:
    regimens:
      - variable: skating_intensity
        time_start: "19:00"
        time_end: "19:00"
        label: "Skating intensity (RPE 5-10)"
        optimize:
          value: [5.0, 10.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 64.8
    pareto_front:
      - {x: [5.0], f: [-82.0, 0.22]}
      - {x: [6.5], f: [-88.0, 0.33]}
      - {x: [8.0], f: [-90.0, 0.48]}
      - {x: [9.0], f: [-88.0, 0.60]}
      - {x: [10.0], f: [-82.0, 0.75]}
    recommended:
      x: [8.0]
      f: [-90.0, 0.48]

references:
  - citation: "Montgomery DL (1988) Physiology of ice hockey. Sports Med 5(2):99-126."
    description: "Supplies overall ice-hockey physiological data, with heart rate near 90% HRmax and lactate rising to 6-10 mmol/L within a shift, the parameter source for the heart-rate dynamics and within-shift lactate accumulation mechanism."
  - citation: "Twist P & Rhodes T (1993) A physiological analysis of ice hockey positions. J Strength Cond Res 7(1):29-35."
    description: "Supplies a physiological-load analysis across positions, the parameter source for shot power's decline with fatigue and lactate."
  - citation: "Cox MH et al. (1995) Aerobic power and treadmill performance of formal Canadian hockey players. J Sports Sci 13(4):333-340."
    description: "Supplies aerobic-capacity data for ice hockey players, the parameter source for the oxygen-uptake dynamics."
