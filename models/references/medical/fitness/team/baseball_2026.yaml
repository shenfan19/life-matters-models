category: physiological

metadata:
  name: baseball
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Baseball's physiology is highly uneven: over a 9-inning game, every pitch a pitcher throws
      places substantial external-rotation stress on the shoulder, and by about 100 pitches a stress
      index reaches MLB's designated safe ceiling, which is exactly the physiological basis for
      pitch-count management. A batter, meanwhile, must recognize the pitch and decide to swing
      within about 0.4 seconds, and as the game progresses, fatigue accumulation lowers grip
      strength and lengthens reaction time, systematically degrading batting quality in the closing
      stretch of a 180-minute game. The tradeoff between protecting a pitcher's shoulder and
      maintaining pitch velocity is the core proposition in baseball sports medicine.
    result: >
      Not yet run. Theoretical expectation: pitching at 90 mph for 180 minutes (roughly 100
      pitches), the shoulder-fatigue index rises to about 0.45-0.50, the arm-stress index reaches
      about 85, close to MLB's safe ceiling, and the performance-accuracy score falls from a
      baseline of 100 to about 86; lowering velocity to 82 mph keeps shoulder fatigue at about 0.35,
      but the pitcher's dominant advantage drops markedly.
    limitations: >
      Does not distinguish the biomechanical stress differences between pitch types such as a
      fastball, curveball, and changeup; shoulder stress is a composite index and does not model
      damage accumulation in the rotator cuff's specific anatomy; does not include the effect of a
      batter's muscle-temperature drop and pre-activation state during waiting time on batting
      quality.
  ratings:
    importance: 0.25 - Baseball shoulder management has specialized research value, but its audience is limited to a specific sporting community; a team-sport specialty model, expected to have low reuse elsewhere
    variable: 0.5 - Cites publications such as Potteiger/Mangine, with basic but limited parameter coverage
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
  tags: [baseball, team, shoulder_stress, reaction_time, grip_strength, pitch_count, explosive]

variables:
  pitch_velocity:
    type: input
    value: 90.0
    unit: "mph"
    bounds: [60.0, 105.0]
    description: "Pitch velocity (an average MLB pitcher is about 85-95 mph, an elite starter about 90-95 mph; Potteiger 1992)"
  batting_effort:
    type: input
    value: 7.0
    unit: "RPE(0-10)"
    bounds: [0.0, 10.0]
    description: "The batter's swing effort intensity (0=taking the pitch, 7=a full swing, 10=maximal effort)"
  shoulder_fatigue:
    type: state
    value: 0.0
    unit: "dimensionless"
    bounds: [0.0, 1.0]
    description: "The shoulder-fatigue index (corresponding to declining muscular endurance; above 0.7, pitch velocity and control precision decline; Potteiger 1992)"
  arm_stress_index:
    type: state
    value: 0.0
    unit: "dimensionless"
    bounds: [0.0, 100.0]
    description: "The arm-stress index (a cumulative external-rotation-stress proxy; about 100 MLB pitches corresponds to an index of about 80; Szymanski 2011)"
  reaction_time_ms:
    type: state
    value: 390.0
    unit: "ms"
    bounds: [300.0, 600.0]
    description: "The batter's reaction time (an MLB average of about 390ms for recognition plus decision; lengthens with fatigue and exhaustion; Mangine 2012)"
  grip_strength:
    type: state
    value: 100.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "The grip-strength index (a forearm-endurance proxy; the basis for control and hitting quality; declines after repeated swings)"
  performance_accuracy:
    type: state
    value: 100.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "Performance accuracy (for a pitcher: control rate plus velocity retention; for a batter: contact rate and timing)"

equations:
  shoulder_fatigue_accumulation:
    description: "Shoulder fatigue rises with pitch velocity and cumulative pitch count (Potteiger 1992: fatigue becomes significant after 100 pitches)"
    condition: "pitch_velocity > 0"
    priority: 10
    dynamics:
      shoulder_fatigue: "min(1.0, shoulder_fatigue + (pitch_velocity / 95.0) * 0.0032)"
  arm_stress_accumulation:
    description: "The arm-stress index accumulates external-rotation stress with each pitch (MLB's 100-pitch limit corresponds to a stress of about 80; Szymanski 2011)"
    condition: "pitch_velocity > 0"
    priority: 9
    dynamics:
      arm_stress_index: "min(100, arm_stress_index + (pitch_velocity / 90.0) * 0.42)"
  reaction_time_degradation:
    description: "The batter's reaction time lengthens with fatigue (Mangine 2012: reaction declines about 10-15% after a long game)"
    condition: true
    priority: 8
    dynamics:
      reaction_time_ms: "min(600, 390 + shoulder_fatigue * 60 + max(0, batting_effort - 8) * 10)"
  grip_strength_decay:
    description: "Grip strength declines with game time and swing effort (forearm endurance is finite)"
    condition: "batting_effort > 0"
    priority: 7
    dynamics:
      grip_strength: "max(0, 100 - shoulder_fatigue * 30 - batting_effort * 0.4)"
  performance_accuracy_dynamics:
    description: "Overall accuracy is affected jointly by shoulder fatigue, grip strength, and reaction time (Potteiger 1992)"
    condition: true
    priority: 6
    dynamics:
      performance_accuracy: "max(0, 100 - shoulder_fatigue * 40 - max(0, arm_stress_index - 60) * 0.5 - max(0, reaction_time_ms - 420) * 0.3)"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables:
    - shoulder_fatigue
    - arm_stress_index
    - reaction_time_ms
    - grip_strength
    - performance_accuracy
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: pitch_velocity
        time_start: "13:00"
        value: 90.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Pitch velocity (90 mph, a starting pitcher)"
      - variable: batting_effort
        time_start: "13:00"
        value: 7.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Batter swing intensity (RPE=7)"

optimization:
  method: nsga2
  objectives:
    - variable: performance_accuracy
      metric: final
      direction: maximize
      description: "Maximizing overall accuracy at the end of the game"
    - variable: shoulder_fatigue
      metric: final
      direction: minimize
      description: "Minimizing shoulder fatigue (protecting the pitcher)"
  constraints:
    - variable: arm_stress_index
      condition: "<= 80"
      type: hard
      description: "The arm-stress index should not exceed 80 (corresponding to MLB's about-100-pitch limit)"
    - variable: shoulder_fatigue
      condition: "<= 0.8"
      type: hard
      description: "Shoulder fatigue should not exceed 0.8 (an injury-risk threshold)"
  startpoint:
    regimens:
      - variable: pitch_velocity
        time_start: "13:00"
        time_end: "13:00"
        label: "Pitch velocity (75-100 mph)"
        optimize:
          value: [75.0, 100.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 48.9
    pareto_front:
      - {x: [75.0], f: [-72.0, 0.28]}
      - {x: [82.0], f: [-80.0, 0.35]}
      - {x: [90.0], f: [-86.0, 0.45]}
      - {x: [95.0], f: [-88.0, 0.58]}
      - {x: [100.0], f: [-89.0, 0.72]}
    recommended:
      x: [90.0]
      f: [-86.0, 0.45]

references:
  - citation: "Potteiger JA et al. (1992) Physiological and performance responses to prolonged, competitive baseball games. J Strength Cond Res 6(3):149-153."
    description: "Supplies physiological and performance response data across a long game, the parameter source for shoulder-fatigue accumulation and overall accuracy dynamics."
  - citation: "Szymanski DJ et al. (2011) Relationship between the NSCA physical testing guidelines and baseball performance in collegiate baseball players. J Strength Cond Res 25(8):2101-2112."
    description: "Supplies data on the relationship between fitness-test measures and pitching performance, the parameter source for the arm-stress index's correspondence with MLB's about-100-pitch limit."
  - citation: "Mangine GT et al. (2012) The effect of recovery time on bat speed, bat path efficiency, and contact rate of NCAA division I baseball players. J Strength Cond Res 26(3):809-815."
    description: "Studies recovery time's effect on bat speed and contact rate, the parameter source for the batter's reaction-time lengthening with fatigue."
