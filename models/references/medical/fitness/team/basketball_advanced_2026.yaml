category: physiological

metadata:
  name: basketball_advanced
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      In elite NBA basketball, a player's heart rate stays at 85-90% HRmax for extended periods,
      performing about 150 vertical jumps per game. Compared with the basic basketball model, this
      model's scientific focus is the synchronized decay of physiological and cognitive fatigue: as
      jump count accumulates and lactate rises, not only does physical performance decline, but
      passing-decision quality degrades in step, with the judgment-error rate rising, forming a
      dual coupling effect where "the body tires and the mind tires together." Fast-break frequency
      is the core tactical parameter governing the anaerobic-metabolism proportion, and also the key
      lever in the fitness-versus-decision-quality tradeoff.
    result: >
      Not yet run. Theoretical expectation: in a 40-minute game at a defensive intensity of RPE=7
      and a fast-break frequency of 2 per minute, jump fatigue reaches about 0.42 by the end of the
      game, the decision-quality index falls from 100 to about 68-72, and shooting accuracy falls
      from 48% to about 44-46%; raising the fast-break frequency to 5 per minute brings jump fatigue
      to about 0.68 and shooting accuracy down further to about 40%.
    limitations: >
      Metabolic-load and jump-frequency differences between point guard, forward, and center
      positions are not distinguished; the decision-quality model is a simplified approximation of
      cognitive load. Partial-recovery dynamics during a timeout or a foul-clock stoppage are not
      included; the parameters are based on NBA elite male athlete level.
  ratings:
    importance: 0.25 - Elite basketball analysis has value, but jointly modeling cognitive decay with physiological fatigue is fairly specialized; a team-sport specialty model, expected to have low reuse elsewhere
    variable: 0.5 - Cites publications such as McInnes/Ben Abdelkrim, with basic parameter coverage
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed runnable on 2026-07-22 (--sim, plus a spot check of --opt); reconfirmed on 2026-07-27 that the nosim/noopt markers have been cleared (both --sim/--opt run normally), but not yet compared against an independent literature target value
  tags: [basketball, advanced, NBA, decision_making, jump_fatigue, shot_accuracy, fast_break, VO2max]

variables:
  defensive_intensity:
    type: input
    value: 7.0
    unit: "RPE(0-10)"
    bounds: [0.0, 10.0]
    description: "Defensive intensity (0=relaxed, 7=normal intensity, 10=full-court pressure; McInnes 1995)"
  fast_break_frequency:
    type: input
    value: 2.0
    unit: "per min"
    bounds: [0.0, 6.0]
    description: "Fast-break frequency (an NBA average of about 1.5-3 per minute; a high frequency markedly raises the anaerobic-metabolism proportion)"
  heart_rate:
    type: state
    value: 75.0
    unit: "bpm"
    bounds: [50.0, 200.0]
    description: "Heart rate (McInnes 1995: basketball averages 165-180 bpm, about 85-90% HRmax)"
  vo2:
    type: state
    value: 10.0
    unit: "mL/kg/min"
    bounds: [5.0, 65.0]
    description: "Oxygen uptake (an NBA elite's VO2max is about 50-60 mL/kg/min; Ben Abdelkrim 2010)"
  jump_fatigue:
    type: state
    value: 0.0
    unit: "dimensionless"
    bounds: [0.0, 1.0]
    description: "Jump fatigue (about 150 vertical jumps per game; above 0.5, jump height declines markedly; Ben Abdelkrim 2010)"
  decision_making_index:
    type: state
    value: 100.0
    unit: "score"
    bounds: [0.0, 100.0]
    description: "The decision-quality index (an inverse of the passing-turnover rate; declines with both cognitive fatigue and high lactate; Scanlan 2011)"
  shot_accuracy:
    type: state
    value: 48.0
    unit: "%"
    bounds: [0.0, 100.0]
    description: "Shooting accuracy (an NBA average of about 45-50%; fatigue and lactate affect upper-limb control precision)"
  calories_burned:
    type: state
    value: 0.0
    unit: "kcal"
    bounds: [0.0, 900.0]
    description: "Cumulative calories burned (a 40-minute game burns about 400-600 kcal; McInnes 1995)"

equations:
  heart_rate_dynamics:
    description: "Heart rate responds to defensive intensity and fast-break frequency (McInnes 1995: basketball averages about 170 bpm)"
    condition: true
    priority: 10
    dynamics:
      heart_rate: "min(200, 80 + defensive_intensity * 10 + fast_break_frequency * 6 + jump_fatigue * 15)"
  vo2_response:
    description: "Oxygen uptake follows exercise intensity (Ben Abdelkrim 2010: high intensity is about 85-90% VO2max)"
    condition: "defensive_intensity > 0"
    priority: 9
    dynamics:
      vo2: "min(65, 10 + defensive_intensity * 4.5 + fast_break_frequency * 2.0)"
  jump_fatigue_accumulation:
    description: "Jump fatigue accumulates (about 150 per game; fast breaks and block jumps accelerate accumulation; Ben Abdelkrim 2010)"
    condition: true
    priority: 8
    dynamics:
      jump_fatigue: "min(1.0, jump_fatigue + defensive_intensity * 0.0012 + fast_break_frequency * 0.0018)"
  decision_making_decay:
    description: "Decision quality declines with physiological fatigue and cognitive load (Scanlan 2011: passing turnovers rise at high intensity)"
    condition: true
    priority: 7
    dynamics:
      decision_making_index: "max(0, 100 - jump_fatigue * 35 - defensive_intensity * 1.5 - fast_break_frequency * 2.0)"
  shot_accuracy_dynamics:
    description: "Shooting accuracy is affected jointly by jump fatigue (upper-body stability) and cognitive state"
    condition: true
    priority: 6
    dynamics:
      shot_accuracy: "max(0, 48 - jump_fatigue * 18 - max(0, defensive_intensity - 8) * 2 - fast_break_frequency * 0.5)"
  calories_accumulation:
    description: "Calories burned (basketball is about 10-15 kcal/min, adjusted by intensity)"
    condition: "defensive_intensity > 0"
    priority: 5
    dynamics:
      calories_burned: "calories_burned + 7.0 + defensive_intensity * 0.9 + fast_break_frequency * 0.6"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-01"
  output_variables:
    - heart_rate
    - vo2
    - jump_fatigue
    - decision_making_index
    - shot_accuracy
    - calories_burned
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: defensive_intensity
        time_start: "19:30"
        value: 7.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Defensive intensity (RPE=7, a normal NBA contest)"
      - variable: fast_break_frequency
        time_start: "19:30"
        value: 2.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-01"]
        label: "Fast-break frequency (2 per minute, an NBA moderate pace)"

optimization:
  method: nsga2
  objectives:
    - variable: shot_accuracy
      metric: final
      direction: maximize
      description: "Maximizing shooting accuracy at the end of the game"
    - variable: jump_fatigue
      metric: final
      direction: minimize
      description: "Minimizing jump fatigue (protecting jump ability)"
  constraints:
    - variable: heart_rate
      condition: "<= 190"
      type: soft
      description: "Keep heart rate within 190 bpm"
    - variable: decision_making_index
      condition: ">= 60"
      type: soft
      description: "The decision-quality index should not fall below 60 (a floor for on-court execution)"
  startpoint:
    regimens:
      - variable: fast_break_frequency
        time_start: "19:30"
        time_end: "19:30"
        label: "Fast-break frequency (0.5-5 per minute)"
        optimize:
          value: [0.5, 5.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 52.1
    pareto_front:
      - {x: [0.5], f: [-46.5, 0.30]}
      - {x: [1.5], f: [-45.8, 0.38]}
      - {x: [2.5], f: [-44.5, 0.46]}
      - {x: [3.5], f: [-43.0, 0.55]}
      - {x: [5.0], f: [-40.5, 0.68]}
    recommended:
      x: [2.0]
      f: [-45.2, 0.42]

references:
  - citation: "McInnes SE et al. (1995) The physiological load imposed on basketball players during competition. J Sports Sci 13(5):387-397."
    description: "Supplies overall in-game physiological-load data, with heart rate held around 165-180 bpm and calorie burn about 400-600 kcal, the parameter source for the heart-rate and calorie-burn dynamics."
  - citation: "Ben Abdelkrim N et al. (2010) Activity profile and physiological requirements of junior elite basketball players in relation to aerobic-anaerobic fitness. J Strength Cond Res 24(9):2330-2342."
    description: "Supplies VO2max data and the mixed aerobic-anaerobic supply characteristic, the parameter source for the oxygen-uptake dynamics and jump-fatigue accumulation mechanism."
  - citation: "Scanlan AT et al. (2011) Muscle activity and physiological responses of helpside defenders during basketball. Int J Sports Physiol Perform 6(2):168-182."
    description: "Supplies physiological-response data under defensive activity, the parameter source for decision quality's decline with physiological fatigue and cognitive load."
