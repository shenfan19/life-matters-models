category: physiological

metadata:
  name: processed_meat_mortality
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      加工肉类-全因死亡率关联是流行病学里被反复独立测量、meta分析收敛的效应量。每日多摄入1份加工肉类对应的全因死亡率相对风险(RR)，多项前瞻性队列研究meta分析共识值
    result: |
      用 LM format 的 evidence 节中的 rr 子类型声明该效应量，代入示意性基线风险1.0%，验证 Loader 能正确读取、承载并展示这一效应量：暴露组风险等于基线风险乘以相对风险1.15。
    limitations: |
      本案例是"效应量编码正确性"展示，不是独立预测检验，1.15这个数字本身就是要验证的目标，不是外推后与另一个独立来源比较。基线风险1.0%为示意性设定值，非任何具体人群的实测患病率。
  ratings:
    importance: 0.25 - 流行病学效应量族案例之一，通用参考组件，尚未被具体论文import
    variable: 1.0 - 效应量来自meta分析/大型队列研究的共识值，文献可直接追溯
    equation: 1.0 - evidence_type换算是LM format规范定义的标准机制，非自建结构
    simulation: 0.5 - 效应量编码正确性已验证展示，但明确非独立预测检验，属循环验证
    optimization: 0.0 - 本文件不含optimization，纯效应量编码展示，不涉及决策变量
    confidence: 0.75 - 效应量本身来自高质量独立来源，Loader正确编码展示，非独立预测已在理由中注明
  tags: [epidemiology, evidence, rr, validation, literature-benchmark, rr-family]

variables:
  baseline_risk_pct:
    description: 示意性基线（未暴露组）风险（%）
    value: 1.0
    unit: "%"
    type: parameter

  exposed_risk_pct:
    description: 暴露组预测风险（%）= 基线风险 × 相对风险
    value: 0.0
    unit: "%"
    type: state

  exposure_rr:
    type: parameter
    evidence_type: rr
    value: 1.15
    unit: "RR"
    description: 每日多摄入1份加工肉类对应的全因死亡率相对风险(RR)，多项前瞻性队列研究meta分析共识值
    reference: "Wang X, Lin X, Ouyang YY, Liu J, Zhao G, Pan A, Hu FB (2016) Red and processed meat consumption and mortality: dose-response meta-analysis of prospective cohort studies. Public Health Nutr 19(5):893-905, RR=1.15 (95% CI 1.11-1.19)"

equations:
  risk_calc:
    description: "静态计算：exposed_risk_pct = baseline_risk_pct × exposure_rr"
    condition: true
    priority: 3
    dynamics:
      exposed_risk_pct: "baseline_risk_pct * exposure_rr"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables:
    - baseline_risk_pct
    - exposed_risk_pct
  plans:
    - id: "exposure_scenario"
      label: "暴露组 vs 基线风险效应量展示"
      regimens: []

references:
  - "Wang X, Lin X, Ouyang YY, Liu J, Zhao G, Pan A, Hu FB (2016) Red and processed meat consumption and mortality: dose-response meta-analysis of prospective cohort studies. Public Health Nutr 19(5):893-905, RR=1.15 (95% CI 1.11-1.19)"
