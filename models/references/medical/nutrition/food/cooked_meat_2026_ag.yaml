category: intervention

metadata:
  name: "cooked_meat"
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      A game-specific cooked-meat food component: converts cooked-meat intake in grams into
      protein and fat nutrients. Per 100g: 26g protein, 15g fat, 0g carbohydrate, 58g water, values
      from a food-composition table.
    result: >
      When intake is triggered, the corresponding nutrients are injected proportionally into the
      upstream scenario's stomach buffer. Run as a standalone file with --sim-only, since no intake
      event is declared, meat_intake stays at its default value of 0, the conversion equation never
      fires, and all outputs remain 0 throughout, matching the expected behavior of a component
      model. In --opt-only, meat_intake as a decision variable is searched across the 0 to 1000g
      range, with protein and fat output varying linearly, verifying that the conversion equation
      itself executes correctly.
    limitations: A minimalist food-conversion component that does not include digestion dynamics; parameters should be calibrated in the upstream scenario against its specific context.
  ratings:
    importance: 0.0 - A game-specific food component supplying only basic nutrient conversion, with no research reuse value
    variable: 0.5 - The cooked-meat nutrient-composition values come from a food-composition table, the data itself is reliable
    equation: 0.0 - Pure additive bookkeeping, containing no digestion/metabolism mechanism
    simulation: 0.5 - Verified on 2026-09-04, --sim-only runs without error since the component model has no intake event and defaults to holding zero; the conversion equation's correctness is cross-verified via the --opt-only variable sweep
    optimization: 0.0 - Verified on 2026-09-04, the 50-point front spreads across the full meat_intake range and is non-degenerate in value, but food_protein and food_fat are both determined linearly from the same decision variable at a fixed 0.26:0.15 ratio, so they cannot be manipulated independently and do not constitute a genuine tradeoff
    confidence: 0.25 - Verified on 2026-09-04, runs and the conversion arithmetic is correct, but not yet compared against independent literature data
  tags: [food, diet, meat]

variables:
  # ========== Input variables ==========
  meat_intake:
    type: input
    value: 0
    unit: "g"
    bounds: [0, 1000]
    io_role: input
    description: "Weight of cooked meat consumed"

  # ========== Output metrics (for use by nutrition_intake) ==========
  food_carbohydrate:
    type: state
    value: 0
    unit: "g"
    io_role: output

  food_protein:
    type: state
    value: 0
    unit: "g"
    io_role: output

  food_fat:
    type: state
    value: 0
    unit: "g"
    io_role: output

  water_intake:
    type: state
    value: 0
    unit: "ml"
    io_role: output

equations:
  calculate_nutrition_impact:
    condition: meat_intake > 0
    priority: 1
    dynamics:
      food_carbohydrate: 0
      food_protein: "meat_intake * 0.26"
      food_fat: "meat_intake * 0.15"
      water_intake: "meat_intake * 0.58"
      meat_intake: 0

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [food_carbohydrate, food_protein, food_fat, water_intake]

optimization:
  method: nsga2
  objectives:
    - variable: food_protein
      metric: final
      direction: maximize
    - variable: food_fat
      metric: final
      direction: minimize
  startpoint:
    regimens:
      - variable: meat_intake
        time_start: "12:00"
        time_end: "12:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Cooked-meat intake (g)"
        optimize:
          value: [0, 1000]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
