category: intervention

metadata:
  name: "cooked_meat"
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      游戏专用烤肉食物组件：将以克为单位的烤肉摄入量转换为蛋白质和脂肪营养素。
      每 100g 含蛋白质 26g、脂肪 15g、碳水化合物 0g、水分 58g，数值来自食品成分表。
    result: >
      摄入触发时，对应营养素按比例注入上层场景的胃缓冲区。作为独立文件运行 --sim-only
      时，因未声明摄入事件，meat_intake 维持默认值 0，换算方程不触发，各输出量全程为
      0，符合组件模型的预期行为。--opt-only 中 meat_intake 作为决策变量在 0至1000g
      范围内搜索，蛋白质与脂肪产出随之线性变化，验证了换算方程本身可正确执行。
    limitations: 极简食物转换组件，不包含消化动力学；参数应在上层场景中结合具体上下文校准。
  ratings:
    importance: 0.0 - 游戏专用食物组件，仅提供基本营养成分转换，无研究复用价值
    variable: 0.5 - 烤肉营养成分数值来自食品成分表，数据本身可靠
    equation: 0.0 - 纯累加记账，不含任何消化/代谢机制
    simulation: 0.5 - 2026-09-04验证：--sim-only跑通无报错，因组件模型无摄入事件默认保持零值；换算方程正确性经--opt-only变量扫描交叉验证
    optimization: 0.0 - 2026-09-04验证：50点前沿沿meat_intake全范围铺开、数值非退化，但food_protein与food_fat由同一决策变量按固定0.26:0.15比例线性决定，二者不可独立操纵，不构成真实权衡
    confidence: 0.25 - 2026-09-04验证：跑通且换算算术正确，但未与独立文献数据比对
  tags: [food, diet, meat]

variables:
  # ========== 输入变量 ==========
  meat_intake:
    type: input
    value: 0
    unit: "g"
    bounds: [0, 1000]
    io_role: input
    description: "摄入烤肉的重量"

  # ========== 输出指标 (供 nutrition_intake 使用) ==========
  food_carbohydrate:
    type: state
    value: 0
    unit: "g"
    io_role: output

  food_protein:
    type: state
    value: 0
    unit: "g"
    io_role: output

  food_fat:
    type: state
    value: 0
    unit: "g"
    io_role: output

  water_intake:
    type: state
    value: 0
    unit: "ml"
    io_role: output

equations:
  calculate_nutrition_impact:
    condition: meat_intake > 0
    priority: 1
    dynamics:
      food_carbohydrate: 0
      food_protein: "meat_intake * 0.26"
      food_fat: "meat_intake * 0.15"
      water_intake: "meat_intake * 0.58"
      meat_intake: 0

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [food_carbohydrate, food_protein, food_fat, water_intake]

optimization:
  method: nsga2
  objectives:
    - variable: food_protein
      metric: final
      direction: maximize
    - variable: food_fat
      metric: final
      direction: minimize
  startpoint:
    regimens:
      - variable: meat_intake
        time_start: "12:00"
        time_end: "12:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "熟肉摄入量（g）"
        optimize:
          value: [0, 1000]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
