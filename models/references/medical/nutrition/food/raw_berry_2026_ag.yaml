category: intervention

metadata:
  name: "raw_berry"
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      游戏专用浆果食物组件：将以克为单位的生浆果摄入量转换为碳水化合物、蛋白质和脂肪营养素。
      每 100g 含碳水化合物 14g、蛋白质 1.5g、脂肪 0.5g、水分 84g，数值来自食品成分表。
    result: >
      摄入触发时，对应营养素按比例注入上层场景的胃缓冲区。作为独立文件运行 --sim-only
      时，因未声明摄入事件，berry_intake 维持默认值 0，换算方程不触发，各输出量全程为 0，
      符合组件模型的预期行为。--opt-only 中 berry_intake 作为决策变量在 0至1000g 范围
      内搜索，食物碳水化合物与脂肪产出随之线性变化，验证了换算方程本身可正确执行。
    limitations: 极简食物转换组件，不包含消化动力学；参数应在上层场景中结合具体上下文校准。
  ratings:
    importance: 0.0 - 游戏专用食物组件，仅提供基本营养成分转换，无研究复用价值
    variable: 0.5 - 浆果营养成分数值来自食品成分表，数据本身可靠
    equation: 0.0 - 纯累加记账，不含任何消化/代谢机制
    simulation: 0.5 - 2026-09-04验证：--sim-only跑通无报错，因组件模型无摄入事件默认保持零值；换算方程正确性经--opt-only变量扫描交叉验证
    optimization: 0.0 - 2026-09-04验证：50点前沿沿berry_intake全范围铺开、数值非退化，但food_carbohydrate与food_fat由同一决策变量按固定0.14:0.005比例线性决定，二者不可独立操纵，不构成真实权衡
    confidence: 0.25 - 2026-09-04验证：跑通且换算算术正确，但未与独立文献数据比对
  tags: [food, diet, fruit, berry]

variables:
  # ========== 输入变量 ==========
  berry_intake:
    type: input
    value: 0
    unit: "g"
    bounds: [0, 1000]
    io_role: input
    description: "摄入浆果的重量"

  # ========== 输出指标 (供 nutrition_intake 使用) ==========
  food_carbohydrate:
    type: state
    value: 0
    unit: "g"
    io_role: output

  food_protein:
    type: state
    value: 0
    unit: "g"
    io_role: output

  food_fat:
    type: state
    value: 0
    unit: "g"
    io_role: output

  water_intake:
    type: state
    value: 0
    unit: "ml"
    io_role: output

equations:
  calculate_nutrition_impact:
    condition: berry_intake > 0
    priority: 1
    dynamics:
      food_carbohydrate: "berry_intake * 0.14"
      food_protein: "berry_intake * 0.015"
      food_fat: "berry_intake * 0.005"
      water_intake: "berry_intake * 0.84"
      berry_intake: 0

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [food_carbohydrate, food_protein, food_fat, water_intake]

optimization:
  method: nsga2
  objectives:
    - variable: food_carbohydrate
      metric: final
      direction: maximize
    - variable: food_fat
      metric: final
      direction: minimize
  startpoint:
    regimens:
      - variable: berry_intake
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "浆果摄入量（g）"
        optimize:
          value: [0, 1000]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
