category: intervention

metadata:
  name: "raw_berry"
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      游戏专用浆果食物组件：将生浆果摄入量（克）转换为碳水化合物、蛋白质和脂肪营养素。
      每 100g 含碳水化合物 14g、蛋白质 1.5g、脂肪 0.5g、水分 84g，数值来自食品成分表。
    result: >
      摄入触发时，对应营养素按比例注入上层场景的胃缓冲区。仿真尚未运行，为组件模型。
    limitations: 极简食物转换组件，不包含消化动力学；参数应在上层场景中结合具体上下文校准。
  ratings:
    topic_importance: 1 - 游戏专用食物组件，仅提供基本营养成分转换，无研究复用价值
    framework_demand: 1 - _ag游戏专用模型，框架内复用价值极低
    evidence_quality: 3 - 浆果营养成分数值来自食品成分表，数据本身可靠
    popularity: 1 - 游戏（_ag）专用食物模块，通用度极低
  tags: [food, diet, fruit, berry]
  step_size:
    value: 1
    unit: minute

variables:
  # ========== 输入变量 ==========
  berry_intake:
    type: input
    value: 0
    unit: "g"
    bounds: [0, 1000]
    io_role: input
    description: "摄入浆果的重量"

  # ========== 输出指标 (供 nutrition_intake 使用) ==========
  food_carbohydrate:
    type: state
    value: 0
    unit: "g"
    io_role: output

  food_protein:
    type: state
    value: 0
    unit: "g"
    io_role: output

  food_fat:
    type: state
    value: 0
    unit: "g"
    io_role: output

  water_intake:
    type: state
    value: 0
    unit: "ml"
    io_role: output

formulas:
  calculate_nutrition_impact:
    condition: berry_intake > 0
    priority: 1
    dynamics:
      food_carbohydrate: "berry_intake * 0.14"
      food_protein: "berry_intake * 0.015"
      food_fat: "berry_intake * 0.005"
      water_intake: "berry_intake * 0.84"
      berry_intake: 0

simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [food_carbohydrate, food_protein, food_fat, water_intake]

optimizer:
  method: nsga2
  objectives:
    - variable: food_carbohydrate
      metric: final
      direction: maximize
    - variable: food_fat
      metric: final
      direction: minimize
  schedules:
    - variable: berry_intake
      time: "08:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "浆果摄入量（g）"
      optimize:
        value: [0, 1000]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
