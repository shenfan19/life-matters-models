category: physiological

metadata:
  todo:
    - type: nosim
      issue: "仿真未验证通过（从旧文件名后缀 _nosim 迁移而来）"
      evidence: "2026-09-04 用 --sim-only 复现：CSV正常产出无报错，但blood_ketones_mmol_l在day9即跌至声明下界0.05并全程停留，与预期的营养性酮症0.5-3.0 mmol/L方向相反。追查ketone_dynamics方程：ketone_production_rate(0.000007)*fat_intake(155)*适应因子(~1)≈0.00117/day产酮，减去carb_ketone_suppression(0.00004)*carb(20)≈0.0008/day，再减去0.001*protein_intake(105)*0.1≈0.0105/day——蛋白质抑制项系数比产酮项和碳水抑制项大一个数量级，主导整个方程使净变化持续为负，血酮被压至下界后不再回升。同时muscle_glycogen_g在day87升至声明上界600（严格生酮碳水20g/day下糖原理应耗竭而非升高），glycogen_dynamics方程中glycogen_carb_replenish(0.5)*carb(20)=10/day补充项，在当前系数下超过了max(0,600-carb*1.2)*0.01≈5.76/day的消耗项，两者净效应为正，与变量自身description声明的'低碳水限制后快速耗竭'方向相反。体重仅降至93.66kg（89天降1.34kg），远低于Volek 2004 12周降9.9kg的文献量级——因血酮被错误压低，未能触发体重方程中`min(1.5,1+ketones*0.1)`的加速因子。这些均为方程系数标定问题，不是引擎报错。"
      next: "由建模者重新校准ketone_dynamics的蛋白质抑制系数（当前0.001*protein*0.1量级过大）和glycogen_dynamics的补充/消耗系数平衡，使血酮和肌糖原动态方向与自身variable description声明的文献机制一致后重新验证。"
    - type: noopt
      issue: "优化器未验证通过（从旧文件名后缀 _noopt 迁移而来）"
      evidence: "2026-09-04 用 --opt-only 复现：60个体×100代（6000次评估）全程feasible=0%，输出opt.csv仅1行（carb_intake_g_day≈39.4，body_weight_kg≈93.66，muscle_glycogen_g=600贴着上界）。除上述nosim记录的血酮/糖原方程系数问题外，追查reference_engine源码确认：optimizer_engine.py第80行`constraints = list(opt_block.get('constraints', []))`和optimizer_eval.py的`_eval_G`均未按`type: hard/soft`过滤，声明为soft的约束被当作hard强制执行；`_eval_G`对未声明`metric`字段的约束默认按整条轨迹每个时间步校验。本文件blood_ketones_mmol_l>=0.5声明type:soft但未加metric，baseline初始值0.1本就低于0.5，且如nosim所述血酮方程会把值进一步压向下界而非升向0.5，在soft被当hard执行+全程逐步校验的组合下从day1起持续违反，导致全区间0%可行，与carb_intake_g_day取值无关。此外optimization.startpoint.regimens仅声明carb_intake_g_day一个决策变量，fat_intake_g_day/protein_intake_g_day在优化上下文中未被任何regimen设置，回落到变量声明的基础value（各80g），与--sim baseline plan的155g/105g不同。"
      next: "engine层面：_eval_G需要区分type:hard/soft；model层面：blood_ketones_mmol_l约束需补充metric（或改为达到诱导期后生效）；两处方程系数问题修复后一并重新验证。此为reference_engine已知设计缺口，非本文件独有，同批多个reference/medical文件的0%可行同样源于此，见本次任务报告。"
  name: ketogenic_diet
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      碳水摄入低于50g/天的生酮饮食通过肝糖原耗竭触发脂肪动员和酮体生成，但为期2到7天的酮症诱导期伴随电解质紊乱引起的酮症流感和初期肌糖原下降，个体差异显著。核心张力是：碳水限制越严格，酮体生成越充分，但同时营养充足性和肌肉保留面临的压力也越大，最优碳水摄入量和蛋白质分配难以从静态数据推断。
    result: >
      文献结果：12周生酮方案体重降低9.9kg，同期低脂组仅降低5.1kg，甘油三酯降低33%（Volek 2004）；24 周生酮可使 2 型糖尿病患者 HbA1c 降低 1.5%（Westman 2008）。
      --sim-only以严格生酮碳水20g/day+脂肪155g/day+蛋白质105g/day验证：血酮不升反降，day9即跌至声明下界0.05并全程停留，未形成预期的0.5-3.0 mmol/L营养性酮症；肌糖原不降反升，day87升至声明上界600g；体重89天仅降1.34kg，远低于Volek 2004对应周期约9.9kg的量级。方程追查显示血酮方程中蛋白质抑制项系数比产酮项和碳水抑制项大一个数量级，是方向与预期相反的根本原因，详见nosim todo。--opt-only以碳水摄入为决策变量求解体重/肌糖原双目标，60个体×100代全程0%可行，未产出可用Pareto前沿，详见noopt todo。
    limitations: >
      未建模肾脏酮体清除和尿酮动态，以及Na、K、Mg丢失导致的电解质紊乱机制；超过1年的长期代谢灵活性提升和平台期尚未纳入。
  ratings:
    importance: 0.5 - 生酮饮食在糖尿病/减重领域证据强，是当前营养学热点；饮食干预常用背景组件，代谢/糖尿病场景引用预期中等
    variable: 0.75 - 引用Volek/Westman等高质量RCT，酮症动力学参数有据
    equation: 0.5 - 自建方程锚定文献机制方向，非独立复现的标准形式
    simulation: 0.25 - 2026-09-04验证：跑通无报错，但血酮方程被蛋白质抑制项主导压至下界（应升反降）、肌糖原方程净效应为正（应降反升），两项均与自身variable description声明的文献机制方向相反，需重新校准系数
    optimization: 0.0 - 2026-09-04验证：血酮约束soft未被engine区别对待而被当作hard强制、且未加metric默认逐时间步校验，叠加血酮方程本身把血酮压向下界，全区间0%可行，无可用前沿
    confidence: 0.0 - 2026-09-04验证：--sim/--opt均跑通但核心机制（血酮生成、肌糖原耗竭）方向与文献基础相反，需先修正方程系数才能重新评估
  tags: [nutrition, ketogenic, ketosis, blood_glucose, weight_loss, fat_oxidation, diabetes]

variables:
  blood_ketones_mmol_l:
    description: |
      血液β-羟基丁酸（BHB，mmol/L），主要酮体。
      基线（普通饮食）：0.1 mmol/L；营养性酮症：0.5-3.0 mmol/L；
      治疗性酮症（癫痫）：3-6 mmol/L；酮症酸中毒（DKA）：>10 mmol/L（糖尿病患者）。
    value: 0.1
    unit: mmol/L
    type: state
    bounds: [0.0, 8.0]
    io_role: output

  blood_glucose_mg_dl:
    description: |
      空腹血糖（mg/dL）。基线：110 mg/dL（空腹血糖受损上限）。
      生酮饮食目标：70-100 mg/dL（Westman 2008）。
    value: 110.0
    unit: mg/dL
    type: state
    bounds: [55.0, 300.0]
    io_role: output

  body_weight_kg:
    description: |
      体重（kg）。基线：95 kg（BMI约30，适用生酮的超重/肥胖患者）。
      Volek 2004：12周生酮→降低9.9 kg。
    value: 95.0
    unit: kg
    type: state
    bounds: [40.0, 200.0]
    io_role: output

  muscle_glycogen_g:
    description: |
      肌糖原储量（g）。正常值：约400g（全身）；碳水限制后第1-3天快速耗竭→约100g。
      肌糖原每1g伴随约3g水分储存（生酮初期体重快速下降部分原因）。
    value: 400.0
    unit: g
    type: state
    bounds: [50.0, 600.0]
    io_role: output

  fat_oxidation_rate_g_day:
    description: |
      全身脂肪氧化速率（g/day）。基线（混合饮食）：约150 g/day；
      完全适应生酮后：约220-250 g/day（Volek 2004）。
      适应期约2-4周（线粒体生物合成和酶表达上调）。
    value: 150.0
    unit: g/day
    type: state
    bounds: [50.0, 400.0]
    io_role: output

  keto_induction_day:
    description: |
      生酮诱导天数计数器（天）。碳水<50g/day时每天+1，否则重置为0。
      用于追踪酮症适应进度（约7天内达到营养性酮症，约14天内脂肪氧化适应）。
    value: 0.0
    unit: day
    type: state
    bounds: [0.0, 365.0]
    io_role: intermediate

  carb_intake_g_day:
    description: |
      碳水化合物日摄入量（g/day）。生酮阈值：<50g/day（严格：<20g/day）。
      普通饮食：250-300g/day；低碳水：100-150g/day。
    value: 250.0
    unit: g/day
    type: input
    bounds: [0.0, 400.0]
    optimizable: true

  fat_intake_g_day:
    description: |
      脂肪日摄入量（g/day）。生酮目标：150-200g/day（占总热量65-75%）。
      普通饮食：约80g/day。
    value: 80.0
    unit: g/day
    type: input
    bounds: [20.0, 300.0]
    optimizable: true

  protein_intake_g_day:
    description: |
      蛋白质日摄入量（g/day）。生酮目标：100-130g/day（约1.2-1.7g/kg/day），
      过高蛋白质→糖异生→抑制酮症。
    value: 80.0
    unit: g/day
    type: input
    bounds: [40.0, 200.0]
    optimizable: true

  # ── 参数 ───────────────────────────────────────────────────────────────────
  ketone_production_rate:
    description: |
      低碳水条件下每天脂肪摄入对血酮的贡献速率（mmol/L per g_fat/day per day）。
      生酮稳态：脂肪150g/day→血酮约1.5 mmol/L（约14天达到）。
      日速率：0.000007（趋近稳态建模）。
    value: 0.000007
    unit: mmol/L per (g/day) per day
    type: parameter
    reference: "Cahill GF Jr. (2006) Annu Rev Nutr 26:1-22"

  carb_ketone_suppression:
    description: |
      碳水摄入对酮体生成的抑制系数（每g碳水/day抑制酮体mmol/L/day）。
      50g碳水/day时酮体接近0；20g/day→轻度酮症。
    value: 0.00004
    unit: mmol/L per (g/day) per day
    type: parameter
    reference: "Westman EC et al. (2008) Nutr Metab 5:36"

  glucose_carb_response:
    description: |
      碳水摄入对空腹血糖的每日效应（mg/dL per g/day per day，趋近稳态系数）。
      减少230g/day碳水→血糖约降20 mg/dL（Westman 2008，约90天稳态）。
    value: 0.0001
    unit: mg/dL per (g/day) per day
    type: parameter
    reference: "Westman EC et al. (2008) Nutr Metab 5:36"

  weight_loss_rate:
    description: |
      热量亏缺导致的体重下降速率。生酮饮食额外代谢优势：约0.02 kg/day（非热量亏缺部分）。
      每7700 kcal亏缺≈1 kg体脂。
    value: 0.015
    unit: kg/day
    type: parameter
    reference: "Volek JS et al. (2004) Nutr Metab 1:13"

  glycogen_carb_replenish:
    description: |
      碳水摄入对肌糖原的每日补充系数（g glycogen per g carb/day per day）。
      正常饮食250g碳水→糖原400g（约需3天）→日速率约0.5 g_glycogen per g_carb/day/day。
    value: 0.5
    unit: g per (g/day) per day
    type: parameter
    reference: "Cahill GF Jr. (2006) Annu Rev Nutr 26:1-22"

equations:
  # F1: 生酮诱导天数更新（碳水<50g/day时累加）
  keto_induction_counter:
    description: 碳水<50g/day时诱导天数+1，否则缓慢回归0（去适应）。
    step_unit: day
    condition: true
    priority: 10
    dynamics:
      keto_induction_day: >
        max(0.0,
        keto_induction_day + (1.0 if carb_intake_g_day < 50.0 else -2.0) * step)

  # F2: 血酮动力学（脂肪→酮体，碳水抑制）
  ketone_dynamics:
    description: |
      血酮：脂肪摄入提供酮体前体，碳水摄入（→胰岛素↑）抑制酮体生成。
      酮症适应因子：诱导天数越多，产酮效率越高（最大2倍，约14天饱和）。
    step_unit: day
    condition: true
    priority: 9
    dynamics:
      blood_ketones_mmol_l: >
        max(0.05, min(8.0, blood_ketones_mmol_l
        + ketone_production_rate * fat_intake_g_day * min(2.0, 1.0 + keto_induction_day / 14.0) * step
        - carb_ketone_suppression * carb_intake_g_day * step
        - 0.001 * protein_intake_g_day * 0.1 * step))

  # F3: 血糖动力学（低碳水→降低空腹血糖）
  glucose_dynamics:
    description: |
      血糖趋近碳水摄入决定的稳态值：高碳→110mg/dL，低碳→85mg/dL（Westman 2008）。
    step_unit: day
    condition: true
    priority: 8
    dynamics:
      blood_glucose_mg_dl: >
        max(55.0, min(300.0, blood_glucose_mg_dl
        + (85.0 + glucose_carb_response * carb_intake_g_day * 100.0 - blood_glucose_mg_dl) * 0.05 * step))

  # F4: 肌糖原动力学（碳水补充 + 自然消耗）
  glycogen_dynamics:
    description: |
      肌糖原：碳水摄入→补充；低碳水→耗竭（前3天快速，之后缓慢稳定）。
    step_unit: day
    condition: true
    priority: 7
    dynamics:
      muscle_glycogen_g: >
        max(50.0, min(600.0, muscle_glycogen_g
        + glycogen_carb_replenish * carb_intake_g_day * step
        - max(0.0, 600.0 - carb_intake_g_day * 1.2) * 0.01 * step))

  # F5: 脂肪氧化速率（酮症适应后升高）
  fat_oxidation_dynamics:
    description: |
      脂肪氧化速率：生酮适应后从150 g/day→250 g/day（约14-21天，线粒体适应）。
      与血酮水平正相关（酮症程度反映脂肪动员程度）。
    step_unit: day
    condition: true
    priority: 6
    dynamics:
      fat_oxidation_rate_g_day: >
        max(50.0, min(400.0, fat_oxidation_rate_g_day
        + (150.0 + 100.0 * min(1.0, blood_ketones_mmol_l / 1.5) - fat_oxidation_rate_g_day) * 0.03 * step))

  # F6: 体重动力学（热量亏缺 + 糖原水分变化）
  weight_dynamics:
    description: |
      体重：生酮初期糖原+水分快速流失（约1-2 kg/3天）；之后以脂肪氧化速率持续下降。
      蛋白质充足（>80g/day）时肌肉流失最小化。
    step_unit: day
    condition: true
    priority: 5
    dynamics:
      body_weight_kg: >
        max(40.0, body_weight_kg
        - weight_loss_rate * min(1.5, 1.0 + blood_ketones_mmol_l * 0.1) * step
        - max(0.0, 400.0 - muscle_glycogen_g) * 0.004 / 30.0 * step)

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-03-31"
  output_variables:
    - blood_ketones_mmol_l
    - blood_glucose_mg_dl
    - body_weight_kg
    - muscle_glycogen_g
    - fat_oxidation_rate_g_day
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: carb_intake_g_day
        time_start: "08:00"
        value: 20.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-03-31"]
        label: "严格生酮碳水20g/day"
      - variable: fat_intake_g_day
        time_start: "08:00"
        value: 155.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-03-31"]
        label: "高脂摄入155g/day（占总热量约70%）"
      - variable: protein_intake_g_day
        time_start: "08:00"
        value: 105.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-03-31"]
        label: "蛋白质105g/day（约1.1g/kg，防止肌肉流失）"

optimization:
  method: nsga2
  objectives:
    - variable: body_weight_kg
      metric: final
      direction: minimize
      description: "最小化90天末体重（减重效果）"
    - variable: muscle_glycogen_g
      metric: final
      direction: maximize
      description: "最大化肌糖原保留（运动能力保护）"
  constraints:
    - variable: blood_ketones_mmol_l
      condition: ">= 0.5"
      type: soft
      description: "维持营养性酮症（≥0.5 mmol/L）"
    - variable: blood_glucose_mg_dl
      condition: ">= 65"
      type: hard
      description: "防止低血糖（≥65 mg/dL）"
  startpoint:
    regimens:
      - variable: carb_intake_g_day
        time_start: "08:00"
        time_end: "08:00"
        label: "碳水摄入（g/day）"
        optimize:
          value: [10.0, 80.0]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19

references:
  - "Volek JS et al. (2004) Comparison of energy-restricted very low-carbohydrate and low-fat diets on weight loss and body composition in overweight men and women. Nutr Metab 1:13."
  - "Westman EC et al. (2008) The effect of a low-carbohydrate, ketogenic diet versus a low-glycemic index diet on glycemic control in type 2 diabetes mellitus. Nutr Metab 5:36."
  - "Paoli A et al. (2013) Beyond weight loss: a review of the therapeutic uses of very-low-carbohydrate (ketogenic) diets. Eur J Clin Nutr 67(8):789-796."
  - "Cahill GF Jr. (2006) Fuel metabolism in starvation. Annu Rev Nutr 26:1-22."
