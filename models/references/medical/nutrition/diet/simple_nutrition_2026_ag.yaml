category: dynamics

metadata:
  name: "simple_nutrition"
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      游戏专用简化营养摄入组件：三餐触发时将碳水化合物、蛋白质、脂肪和水分按固定比例注入胃部缓冲区，为香蕉模型等上层场景提供对照基线组件，用于基础校验。
    result: >
      三餐 schedule 触发后，对应营养素蓄积进胃部。--sim-only 中三餐 plan 按时触发，
      gastric_carbohydrate/gastric_protein/gastric_fat 随三餐累加至 210/60/48g，body_water
      从 42000ml 累加至 43050ml，累加逻辑正确。--opt-only 中 food_carbohydrate/food_protein/
      food_fat/water_intake 是四个相互独立的决策变量，food_protein 与 food_fat 之间没有任何
      共享预算或耦合约束，优化器可同时把 food_protein 推到上界 100g、food_fat 压到下界 0g，
      50 个解全部收敛到 gastric_protein≈100、gastric_fat≈0 这一点，food_carbohydrate 与
      water_intake 因不在目标函数中而在可行域内自由取值。
    limitations: 极简转换组件，不包含消化速率、食物组成差异或个体代谢动力学；参数应在上层场景中校准。
  ratings:
    importance: 0.0 - 游戏专用简化营养模型，仅为演示/校验用途，无研究需求，框架内复用价值极低
    variable: 0.25 - 基本营养成分数值合理，但模型极简，缺少生理动力学，无疾病特异文献支撑
    equation: 0.0 - 纯累加记账，不含任何消化/代谢机制，无文献依据
    simulation: 0.75 - 2026-09-04验证：--sim-only三餐plan按时触发，累加轨迹方向和量级符合预期，未做独立数据逐点比对
    optimization: 0.0 - 2026-09-04验证：50个解在目标空间collapse到gastric_protein≈100/gastric_fat≈0单点，food_protein与food_fat为独立决策变量无共享预算约束，两个目标可同时达到各自极值，不构成真实权衡
    confidence: 0.25 - 2026-09-04验证：跑通且累加逻辑正确，但未与独立文献数据比对
  tags: [nutrition, simple, demo]

variables:
  food_carbohydrate:
    type: input
    value: 60.0
    unit: "g"
    bounds: [0.0, 200.0]
    description: "单次餐食碳水化合物摄入量"

  food_protein:
    type: input
    value: 20.0
    unit: "g"
    bounds: [0.0, 100.0]
    description: "单次餐食蛋白质摄入量"

  food_fat:
    type: input
    value: 15.0
    unit: "g"
    bounds: [0.0, 80.0]
    description: "单次餐食脂肪摄入量"

  water_intake:
    type: input
    value: 300.0
    unit: "ml"
    bounds: [0.0, 1000.0]
    description: "单次饮水量"

  gastric_carbohydrate:
    type: state
    value: 0
    unit: "g"
    io_role: output
    description: "胃部碳水化合物含量"

  gastric_protein:
    type: state
    value: 0
    unit: "g"
    io_role: output
    description: "胃部蛋白质含量"

  gastric_fat:
    type: state
    value: 0
    unit: "g"
    io_role: output
    description: "胃部脂肪含量"

  body_water:
    type: state
    value: 42000
    unit: "ml"
    io_role: output
    description: "身体总水分"

equations:
  ingestion_transfer:
    condition: "food_carbohydrate > 0 or food_protein > 0 or food_fat > 0 or water_intake > 0"
    priority: 1
    dynamics:
      gastric_carbohydrate: "gastric_carbohydrate + food_carbohydrate"
      gastric_protein: "gastric_protein + food_protein"
      gastric_fat: "gastric_fat + food_fat"
      body_water: "body_water + water_intake"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: food_carbohydrate
        time_start: "07:30"
        value: 60.0
        label: 早餐碳水
      - variable: food_protein
        time_start: "07:30"
        value: 15.0
        label: 早餐蛋白质
      - variable: food_fat
        time_start: "07:30"
        value: 10.0
        label: 早餐脂肪
      - variable: water_intake
        time_start: "07:30"
        value: 300.0
        label: 早餐饮水
      - variable: food_carbohydrate
        time_start: "12:00"
        value: 80.0
        label: 午餐碳水
      - variable: food_protein
        time_start: "12:00"
        value: 25.0
        label: 午餐蛋白质
      - variable: food_fat
        time_start: "12:00"
        value: 20.0
        label: 午餐脂肪
      - variable: water_intake
        time_start: "12:00"
        value: 400.0
        label: 午餐饮水
      - variable: food_carbohydrate
        time_start: "18:30"
        value: 70.0
        label: 晚餐碳水
      - variable: food_protein
        time_start: "18:30"
        value: 20.0
        label: 晚餐蛋白质
      - variable: food_fat
        time_start: "18:30"
        value: 18.0
        label: 晚餐脂肪
      - variable: water_intake
        time_start: "18:30"
        value: 350.0
        label: 晚餐饮水
  output_variables: [gastric_carbohydrate, gastric_protein, gastric_fat, body_water]

optimization:
  method: nsga2
  objectives:
    - variable: gastric_protein
      metric: final
      direction: maximize
    - variable: gastric_fat
      metric: final
      direction: minimize
  startpoint:
    regimens:
      - variable: food_carbohydrate
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "碳水化合物摄入（g）"
        optimize:
          value: [0.0, 200.0]
      - variable: food_protein
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "蛋白质摄入（g）"
        optimize:
          value: [0.0, 100.0]
      - variable: food_fat
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "脂肪摄入（g）"
        optimize:
          value: [0.0, 80.0]
      - variable: water_intake
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "水分摄入（ml）"
        optimize:
          value: [0.0, 1000.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
