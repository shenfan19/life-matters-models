category: dynamics

metadata:
  name: "simple_nutrition"
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      A game-specific simplified nutrient-intake component: at each of three daily meals,
      carbohydrate, protein, fat, and water are injected into the stomach buffer at fixed amounts,
      supplying a control-baseline component for upstream scenarios such as the banana model, for
      basic validation use.
    result: >
      After the three-meal schedule triggers, the corresponding nutrients accumulate in the
      stomach. In --sim-only, the three-meal plan fires on schedule, gastric_carbohydrate,
      gastric_protein, and gastric_fat accumulate across the three meals to 210/60/48g, body_water
      accumulates from 42000ml to 43050ml, and the accumulation logic is correct. In --opt-only,
      food_carbohydrate, food_protein, food_fat, and water_intake are four mutually independent
      decision variables, with no shared budget or coupling constraint between food_protein and
      food_fat, so the optimizer can push food_protein to its upper bound of 100g and food_fat to
      its lower bound of 0g at the same time, and all 50 solutions converge to the single point
      gastric_protein is about 100, gastric_fat is about 0, while food_carbohydrate and
      water_intake, not appearing in the objective function, take free values within the feasible
      region.
    limitations: A minimalist conversion component that does not include digestion rate, food-composition variation, or individual metabolic dynamics; parameters should be calibrated in the upstream scenario.
  ratings:
    importance: 0.0 - A game-specific simplified nutrition model intended only for demonstration/validation, with no research need, very low reuse value within the framework
    variable: 0.25 - The basic nutrient-composition values are reasonable, but the model is highly simplified, lacking physiological dynamics or disease-specific literature support
    equation: 0.0 - Pure additive bookkeeping, containing no digestion/metabolism mechanism, no literature basis
    simulation: 0.75 - Verified on 2026-09-04, --sim-only fires the three-meal plan on schedule, with accumulation trajectories matching the expected direction and magnitude, not compared point-by-point against independent data
    optimization: 0.0 - Verified on 2026-09-04, the 50 solutions collapse in objective space to the single point gastric_protein is about 100 / gastric_fat is about 0, since food_protein and food_fat are independent decision variables with no shared-budget constraint, both objectives can reach their own extremes simultaneously, and this does not constitute a genuine tradeoff
    confidence: 0.25 - Verified on 2026-09-04, runs and the accumulation logic is correct, but not yet compared against independent literature data
  tags: [nutrition, simple, demo]

variables:
  food_carbohydrate:
    type: input
    value: 60.0
    unit: "g"
    bounds: [0.0, 200.0]
    description: "Carbohydrate intake for a single meal"

  food_protein:
    type: input
    value: 20.0
    unit: "g"
    bounds: [0.0, 100.0]
    description: "Protein intake for a single meal"

  food_fat:
    type: input
    value: 15.0
    unit: "g"
    bounds: [0.0, 80.0]
    description: "Fat intake for a single meal"

  water_intake:
    type: input
    value: 300.0
    unit: "ml"
    bounds: [0.0, 1000.0]
    description: "Water intake for a single event"

  gastric_carbohydrate:
    type: state
    value: 0
    unit: "g"
    io_role: output
    description: "Gastric carbohydrate content"

  gastric_protein:
    type: state
    value: 0
    unit: "g"
    io_role: output
    description: "Gastric protein content"

  gastric_fat:
    type: state
    value: 0
    unit: "g"
    io_role: output
    description: "Gastric fat content"

  body_water:
    type: state
    value: 42000
    unit: "ml"
    io_role: output
    description: "Total body water"

equations:
  ingestion_transfer:
    condition: "food_carbohydrate > 0 or food_protein > 0 or food_fat > 0 or water_intake > 0"
    priority: 1
    dynamics:
      gastric_carbohydrate: "gastric_carbohydrate + food_carbohydrate"
      gastric_protein: "gastric_protein + food_protein"
      gastric_fat: "gastric_fat + food_fat"
      body_water: "body_water + water_intake"

simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: food_carbohydrate
        time_start: "07:30"
        value: 60.0
        label: Breakfast carbohydrate
      - variable: food_protein
        time_start: "07:30"
        value: 15.0
        label: Breakfast protein
      - variable: food_fat
        time_start: "07:30"
        value: 10.0
        label: Breakfast fat
      - variable: water_intake
        time_start: "07:30"
        value: 300.0
        label: Breakfast water
      - variable: food_carbohydrate
        time_start: "12:00"
        value: 80.0
        label: Lunch carbohydrate
      - variable: food_protein
        time_start: "12:00"
        value: 25.0
        label: Lunch protein
      - variable: food_fat
        time_start: "12:00"
        value: 20.0
        label: Lunch fat
      - variable: water_intake
        time_start: "12:00"
        value: 400.0
        label: Lunch water
      - variable: food_carbohydrate
        time_start: "18:30"
        value: 70.0
        label: Dinner carbohydrate
      - variable: food_protein
        time_start: "18:30"
        value: 20.0
        label: Dinner protein
      - variable: food_fat
        time_start: "18:30"
        value: 18.0
        label: Dinner fat
      - variable: water_intake
        time_start: "18:30"
        value: 350.0
        label: Dinner water
  output_variables: [gastric_carbohydrate, gastric_protein, gastric_fat, body_water]

optimization:
  method: nsga2
  objectives:
    - variable: gastric_protein
      metric: final
      direction: maximize
    - variable: gastric_fat
      metric: final
      direction: minimize
  startpoint:
    regimens:
      - variable: food_carbohydrate
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Carbohydrate intake (g)"
        optimize:
          value: [0.0, 200.0]
      - variable: food_protein
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Protein intake (g)"
        optimize:
          value: [0.0, 100.0]
      - variable: food_fat
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Fat intake (g)"
        optimize:
          value: [0.0, 80.0]
      - variable: water_intake
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Water intake (ml)"
        optimize:
          value: [0.0, 1000.0]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
