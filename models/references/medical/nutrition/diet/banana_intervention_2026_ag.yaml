category: intervention
metadata:
  todo:
    - type: nosim
      issue: "仿真未验证通过（从旧文件名后缀 _nosim 迁移而来）"
      evidence: "2026-09-04 用 --sim-only 复现：无报错，但输出全程为 0。追查发现 calculate_nutrition_impact 方程的 condition: '' 是空字符串，AST 按空表达式解析失败回退到 asteval，求值结果为假值，导致 if not condition: continue 恒成立，方程从未执行——与同目录 raw_berry/cooked_meat 用 banana_intake > 0 作为真实条件不同，这里是空字符串误当条件写入，属于模型自身 bug，不是缺少上层摄入事件的正常组件行为。"
      next: "运行 --sim 复现具体报错或异常输出，记录诊断结果（数值/现象）后再判断修复方案。"
    - type: noopt
      issue: "优化器未验证通过（从旧文件名后缀 _noopt 迁移而来）"
      evidence: "2026-09-04 用 --opt-only 复现：50 个前沿点在 banana_intake 50~874 全范围内变化，但 food_carbohydrate/food_fat 全部恒为 0，与 --sim-only 发现的同一 condition: '' 空条件 bug 一致——方程从未执行，优化器实际在对完全无响应的目标做搜索，前沿数值无意义。"
      next: "运行 --opt 复现具体报错、约束不可满足或前沿退化情况，记录诊断结果后再判断修复方案。"
  name: banana2
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      游戏专用香蕉食物组件：将以克为单位的香蕉摄入量转换为每次摄取的碳水化合物、蛋白质和脂肪营养素。
      每 100g 含碳水化合物 23g、蛋白质 1.1g、脂肪 0.3g、水分 75g，数值来自食品成分表。
    result: >
      摄入触发时，对应营养素按比例注入上层场景的胃缓冲区。仿真尚未运行，为组件模型。
    limitations: 极简食物转换组件，不包含消化动力学；参数应在上层场景中结合具体上下文校准。
  ratings:
    importance: 0.0 - 香蕉营养组件是游戏场景专用，复用价值有限，框架内复用价值极低
    variable: 0.5 - 参数来自标准食品成分表，数值可靠但模型极简
    equation: 0.0 - 纯累加记账，不含任何消化/代谢机制
    simulation: 0.0 - 从未跑通--sim/--opt(nosim/noopt标记)
    optimization: 0.0 - 决策变量之间无结构耦合，不构成真实权衡
    confidence: 0.0 - 从未跑通--sim/--opt
  tags:
    - food
    - diet
    - fruit
variables:
  banana_intake:
    description: 摄入香蕉的重量
    value: 0
    unit: g
    type: input
    bounds:
      - 0
      - 1000
  food_carbohydrate:
    description: 产生的碳水化合物摄入量
    value: 0
    unit: g
    type: state
    bounds:
  food_protein:
    description: 产生的蛋白质摄入量
    value: 0
    unit: g
    type: state
    bounds:
  food_fat:
    description: 产生的脂肪摄入量
    value: 0
    unit: g
    type: state
    bounds:
  water_intake:
    description: 产生的水分摄入量
    value: 0
    unit: ml
    type: state
    bounds:
equations:
  calculate_nutrition_impact:
    description: ''
    condition: ''
    priority: 1
    dynamics:
      food_carbohydrate: banana_intake * 0.23
      food_protein: banana_intake * 0.011
      food_fat: banana_intake * 0.003
      water_intake: banana_intake * 0.75
      banana_intake: 0
simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [food_carbohydrate, food_protein, food_fat, water_intake]

optimization:
  method: nsga2
  objectives:
    - variable: food_carbohydrate
      metric: final
      direction: maximize
    - variable: food_fat
      metric: final
      direction: minimize
  startpoint:
    regimens:
      - variable: banana_intake
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "香蕉摄入量（g）"
        optimize:
          value: [0, 1000]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
