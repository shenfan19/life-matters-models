category: physiological

metadata:
  todo:
    - type: noopt
      issue: "优化器未验证通过（从旧文件名后缀 _noopt 迁移而来）"
      evidence: "2026-09-04 用 --opt-only 复现：60个体×100代（6000次评估）全程feasible=0%，输出opt.csv仅1行（eating_window_hours=6.0贴着下界，insulin_sensitivity_index=1.0，lean_mass_kg≈69.1）。追查reference_engine源码确认两点：(1) optimizer_engine.py第80行`constraints = list(opt_block.get('constraints', []))`和optimizer_eval.py的`_eval_G`均未按`type: hard/soft`过滤或区别处理，声明为soft的约束被当作hard强制执行；(2) `_eval_G`对未声明`metric`字段的约束默认按整条轨迹（每个时间步）校验，而非取final值。本文件body_fat_percentage<=20声明type:soft但未加metric，baseline初始值28%（day1约27.96%）本就高于20，需数月才可能降到20%以下，在soft被当hard执行+全程逐步校验的组合下从day1起持续违反，导致全区间0%可行，与eating_window_hours取值无关。另外optimization.startpoint.regimens仅声明eating_window_hours一个决策变量，caloric_restriction_percent/exercise_timing在优化上下文中未被任何regimen设置，回落到变量声明的基础value（各为0），与--sim baseline plan的15%/禁食态运动设置不同，也印证优化情境下体脂下降路径比baseline更慢。"
      next: "engine层面：optimizer_eval.py的_eval_G需要区分type:hard/soft（soft应计入惩罚而非阻断可行性）；model层面：body_fat_percentage约束需补充metric:final（或改为仅在窗口末尾生效）后重新验证。此为reference_engine已知设计缺口，非本文件独有，同批多个reference/medical文件的0%可行同样源于此，见本次任务报告。"
  name: intermittent_fasting
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      间歇性禁食的16:8方案通过禁食窗口而非单纯热量限制实现代谢益处：禁食期胰岛素水平下降，触发脂肪动员和自噬激活。
      核心张力在于进食窗口越短，热量摄入和营养充足性的压力越大，窗口短于8小时可能导致肌肉流失。
      此外，早晨进食的早期限时进食（eTRF）与晚餐集中的晚窗进食相比，代谢效果存在显著差异，缺乏量化的个体化方案依据。
    result: >
      文献结果：eTRF 5 周可使胰岛素敏感性升高、空腹胰岛素降低 3.4 μU/mL（Sutton 2018）；
      10 小时进食窗口 12 周可使体重降 2.6 kg、体脂率降低 3.3%（Wilkinson 2020）；
      LC3-II 自噬标志物约在禁食 12 小时后显著升高。
      --sim-only以16:8禁食+15%热量限制的baseline plan验证：胰岛素敏感性指数在day42即触及声明上界1.0（完全敏感），LC3比率在day72触及声明上界4.0，此后180天仿真剩余时间两者均贴着上界不再变化，体脂率180天末降至约19.97%（较基线28%降8个百分点，量级超过Wilkinson 2020的12周3.3%）。--opt-only以进食窗口时长为决策变量求解胰岛素敏感性/瘦体重双目标，60个体×100代全程0%可行：优化上下文中caloric_restriction_percent/exercise_timing未被任何regimen设置而回落到基础值0，体脂率下降路径比baseline更慢，soft约束body_fat_percentage<=20在被当作hard执行、且默认逐时间步校验的情况下从day1起持续违反，未产出可用Pareto前沿。
    limitations: >
      未建模昼夜节律调节，即eTRF与晚窗方案的差异，和女性月经周期对禁食响应的差异；
      超过1年的长期代谢适应与平台期尚未纳入。
  ratings:
    importance: 0.75 - 间歇性禁食是当前代谢健康最热门干预，学术和公众需求均高；饮食干预常用背景组件，代谢/糖尿病场景引用预期中等
    variable: 0.75 - 引用Sutton 2018、Wilkinson 2020等Cell Metab高质量RCT
    equation: 0.5 - 自建方程锚定文献机制方向，非独立复现的标准形式
    simulation: 0.5 - 2026-09-04验证：跑通且方向正确，但胰岛素敏感性/LC3比率分别在day42/72即触及声明上界并提前饱和，180天窗口后半段两指标失去区分度，幅度超出文献量级
    optimization: 0.0 - 2026-09-04验证：body_fat_percentage<=20约束未加metric默认逐时间步校验，soft类型未被engine区别对待而被当作hard强制，baseline体脂28%需数月才可能降到20%以下，导致全区间0%可行；根因是reference_engine的soft约束处理缺口而非本文件方程设计，详见noopt todo
    confidence: 0.25 - 2026-09-04验证：--sim方向正确但幅度提前触顶偏离文献量级，--opt因engine层约束处理缺口无法产出有效结果
  tags: [nutrition, intermittent_fasting, insulin_sensitivity, autophagy, body_composition, IGF1, time_restricted_eating]

variables:
  insulin_sensitivity_index:
    description: |
      胰岛素敏感性指数（无量纲，0-1，1=完全敏感）。
      基线：0.55（轻度胰岛素抵抗，适用于代谢综合征患者）。
      Sutton 2018：eTRF 5周→胰岛素敏感性显著改善（HOMA-IR降低）。
    value: 0.55
    unit: index
    type: state
    bounds: [0.1, 1.0]
    io_role: output

  autophagy_marker_lc3_ratio:
    description: |
      自噬标志物LC3-II/LC3-I比率（无量纲，相对基线1.0）。
      禁食12h后开始升高（→1.5-2.5），进食后迅速恢复（Patterson 2017）。
      LC3-II升高反映自噬体形成增加（细胞清除受损蛋白质和细胞器）。
    value: 1.0
    unit: ratio
    type: state
    bounds: [0.5, 4.0]
    io_role: output

  body_fat_percentage:
    description: |
      体脂百分比（%）。基线：28%（超重男性典型值）。
      Wilkinson 2020：10小时窗口12周→体脂率降低3.3%。
    value: 28.0
    unit: "%"
    type: state
    bounds: [5.0, 50.0]
    io_role: output

  lean_mass_kg:
    description: |
      瘦体重（kg，= 总体重 - 体脂重量）。基线：72 kg（总重100 kg × (1-0.28)）。
      IF目标：维持或轻度增加瘦体重（尤其禁食态运动时）。
    value: 72.0
    unit: kg
    type: state
    bounds: [30.0, 120.0]
    io_role: output

  igf1_ng_ml:
    description: |
      类胰岛素生长因子1（IGF-1，ng/mL）。基线：200 ng/mL（正常成年男性）。
      禁食→IGF-1下降（促进自噬的重要信号）；喂食→IGF-1回升。
      长期IF（6个月）→IGF-1下降约5-15%（Patterson 2017）。
    value: 200.0
    unit: ng/mL
    type: state
    bounds: [50.0, 400.0]
    io_role: output

  eating_window_hours:
    description: |
      每日进食窗口时长（小时，4-16小时）。
      16:8 = 8小时窗口；OMAD（一日一餐）= 4小时窗口；
      12:12（对照）= 12小时；10:14（Wilkinson 2020）= 10小时。
    value: 12.0
    unit: hours
    type: input
    bounds: [4.0, 16.0]
    optimizable: true

  caloric_restriction_percent:
    description: |
      热量限制程度（%，0=不限制热量，20=减少20%总热量）。
      IF独立于热量限制的效益在Sutton 2018中已证实（等热量设计）。
    value: 0.0
    unit: "%"
    type: input
    bounds: [0.0, 40.0]
    optimizable: true

  exercise_timing:
    description: |
      运动时机（0=禁食态运动，1=进食态运动）。
      禁食态运动→更高脂肪氧化率（约20%升高）；进食态→肌糖原更充足。
    value: 0.0
    unit: "0=fasted,1=fed"
    type: input
    bounds: [0.0, 1.0]

  # ── 参数 ───────────────────────────────────────────────────────────────────
  insulin_sensitivity_window_rate:
    description: |
      进食窗口每缩短1小时对胰岛素敏感性的每日改善速率。
      8小时窗口 vs 12小时基线：HOMA-IR降低约22%（Sutton 2018，5周=35天）。
      日速率：0.22/(35×4) ≈ 0.0016 per hour_reduction per day。
    value: 0.0016
    unit: index per hour_reduction per day
    type: parameter
    reference: "Sutton EF et al. (2018) Cell Metab 27:1212-1221"

  autophagy_fasting_rate:
    description: |
      禁食窗口每增加1小时对LC3比率的每日升高速率。
      禁食16小时→LC3-II/I约升高1.5倍（Patterson 2017）→日速率约0.03 per hour per day。
    value: 0.03
    unit: ratio per fasting_hour per day
    type: parameter
    reference: "Patterson RE et al. (2017) J Acad Nutr Diet 115:1203-1212"

  fat_loss_rate:
    description: |
      热量限制+IF共同驱动的每日体脂率下降速率（% per day）。
      Wilkinson 2020：10h窗口12周（84天）→体脂率降3.3% → 约0.039%/day。
    value: 0.025
    unit: "% per day"
    type: parameter
    reference: "Wilkinson MJ et al. (2020) Cell Metab 31:92-104"

  igf1_fasting_suppression:
    description: |
      禁食对IGF-1的每日抑制速率（ng/mL per fasting_hour per day）。
      长期IF（6个月）→IGF-1降低约10%（20 ng/mL）→日速率约0.02 per fasting_hour per day。
    value: 0.02
    unit: ng/mL per fasting_hour per day
    type: parameter
    reference: "Patterson RE et al. (2017) J Acad Nutr Diet 115:1203-1212"

equations:
  # F1: 胰岛素敏感性动力学（进食窗口缩短→改善）
  insulin_sensitivity_dynamics:
    description: |
      胰岛素敏感性：进食窗口缩短（vs 12h基线）→禁食期胰岛素持续降低→受体上调。
      热量限制额外贡献20%效益；上限1.0（完全敏感）。
    step_unit: day
    condition: true
    priority: 9
    dynamics:
      insulin_sensitivity_index: >
        min(1.0, insulin_sensitivity_index
        + insulin_sensitivity_window_rate * max(0.0, 12.0 - eating_window_hours) * step
        + 0.0003 * caloric_restriction_percent * step)

  # F2: 自噬标志物动力学（禁食窗口16-eating_window小时）
  autophagy_dynamics:
    description: |
      LC3比率：每日禁食窗口 = 24 - eating_window_hours（小时）。
      禁食12小时后开始显著升高；进食期迅速分解。
      每日净效应反映禁食时长的净自噬激活。
    step_unit: day
    condition: true
    priority: 8
    dynamics:
      autophagy_marker_lc3_ratio: >
        max(0.5, min(4.0, autophagy_marker_lc3_ratio
        + autophagy_fasting_rate * max(0.0, (24.0 - eating_window_hours) - 12.0) * step
        - 0.01 * eating_window_hours * step
        + 0.002 * step))

  # F3: 体脂百分比动力学（IF+热量限制）
  body_fat_dynamics:
    description: |
      体脂率：IF的代谢激活+热量限制→脂肪动员。
      禁食态运动（exercise_timing=0）额外提升20%脂肪氧化。
    step_unit: day
    condition: true
    priority: 7
    dynamics:
      body_fat_percentage: >
        max(5.0, body_fat_percentage
        - fat_loss_rate * (1.0 + 0.3 * max(0.0, 12.0 - eating_window_hours) / 4.0)
          * (1.0 + caloric_restriction_percent / 100.0)
          * (1.0 + 0.2 * (1.0 - exercise_timing)) * step)

  # F4: 瘦体重动力学（蛋白质充足+禁食态运动保护肌肉）
  lean_mass_dynamics:
    description: |
      瘦体重：IF不显著降低瘦体重（Tinsley 2015），
      进食窗口>4h且蛋白质充足时肌肉流失<0.05 kg/week。
      禁食态运动反而轻度促进肌肉合成信号（空腹AMPK激活）。
    step_unit: day
    condition: true
    priority: 6
    dynamics:
      lean_mass_kg: >
        max(30.0, lean_mass_kg
        - 0.003 * max(0.0, 12.0 - eating_window_hours) * step
        + 0.002 * (1.0 - exercise_timing) * step
        - 0.005 * caloric_restriction_percent / 40.0 * step)

  # F5: IGF-1动力学（禁食→降低）
  igf1_dynamics:
    description: |
      IGF-1：禁食→营养信号降低→肝脏IGF-1分泌减少（mTOR抑制）。
      进食后部分恢复；长期IF→慢性低IGF-1（促自噬状态）。
    step_unit: day
    condition: true
    priority: 5
    dynamics:
      igf1_ng_ml: >
        max(50.0, min(400.0, igf1_ng_ml
        - igf1_fasting_suppression * max(0.0, (24.0 - eating_window_hours) - 8.0) * step
        + 0.05 * eating_window_hours * step
        - 0.3 * step))

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-06-29"
  output_variables:
    - insulin_sensitivity_index
    - autophagy_marker_lc3_ratio
    - body_fat_percentage
    - lean_mass_kg
    - igf1_ng_ml
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: eating_window_hours
        time_start: "08:00"
        value: 8.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-06-29"]
        label: "16:8间歇性禁食（8小时进食窗口）"
      - variable: caloric_restriction_percent
        time_start: "08:00"
        value: 15.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-06-29"]
        label: "轻度热量限制15%"
      - variable: exercise_timing
        time_start: "06:30"
        value: 0.0
        days: [Mon, Wed, Fri]
        date_range: ["2026-01-01", "2026-06-29"]
        label: "禁食态晨练（06:30，进食窗口08:00开始）"

optimization:
  method: nsga2
  objectives:
    - variable: insulin_sensitivity_index
      metric: final
      direction: maximize
      description: "最大化180天末胰岛素敏感性"
    - variable: lean_mass_kg
      metric: final
      direction: maximize
      description: "最大化瘦体重保留"
  constraints:
    - variable: body_fat_percentage
      condition: "<= 20"
      type: soft
      description: "体脂率目标≤20%（健康男性）"
    - variable: eating_window_hours
      condition: ">= 6"
      type: hard
      description: "进食窗口不低于6小时（营养充足底线）"
  startpoint:
    regimens:
      - variable: eating_window_hours
        time_start: "08:00"
        time_end: "08:00"
        label: "进食窗口（小时）"
        optimize:
          value: [6.0, 14.0]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19

references:
  - "Patterson RE et al. (2017) Intermittent fasting and human metabolic health. J Acad Nutr Diet 115(8):1203-1212."
  - "Wilkinson MJ et al. (2020) Ten-hour time-restricted eating reduces weight, blood pressure, and atherogenic lipids in patients with metabolic syndrome. Cell Metab 31(1):92-104."
  - "Sutton EF et al. (2018) Early time-restricted feeding improves insulin sensitivity, blood pressure, and oxidative stress even without weight loss in men with prediabetes. Cell Metab 27(6):1212-1221."
  - "Tinsley GM & La Bounty PM (2015) Effects of intermittent fasting on body composition and clinical health markers in humans. Nutr Rev 73(10):661-674."
