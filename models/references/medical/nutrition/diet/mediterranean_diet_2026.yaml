category: physiological

metadata:
  name: mediterranean_diet
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      The Mediterranean diet is currently the best-evidenced cardiovascular-protective dietary
      pattern, with olive oil, fish, and legumes as its core components, but its effect varies
      substantially with adherence and the intake level of each component, and red-meat intake
      partially offsets the protective effect. This structure of multi-component synergy and
      antagonism makes an individualized dietary ratio difficult to derive from a plain dietary
      guideline alone.
    result: >
      Simulating three arms shows that after one year, LDL falls from a baseline of 145 mg/dL to:
      142.67 mg/dL under the high-adherence arm, 144.79 mg/dL under the Western-baseline arm, and
      142.70 mg/dL under the control arm combining high adherence with high red meat. The
      high-adherence arm's reduction is about 11 times that of the Western baseline, while the
      high-red-meat control arm falls only 0.03 mg/dL less than the high-adherence arm, showing that
      red meat's antagonistic effect is far smaller than the protective effect of factors such as
      olive oil, matching PREDIMED's qualitative conclusion in direction. The NSGA-II optimization
      front degenerates to a single point: olive oil 80 mL/day, LDL 141.40 mg/dL, CRP 2.48 mg/L. The
      single decision variable olive_oil_ml_day is monotonically beneficial for LDL, HDL, and SBP
      alike, while crp_dynamics depends only on fish, legume, and red-meat intake, none of which are
      exposed as decision variables, and not on olive oil, so there is no genuine conflict between
      the LDL and CRP objectives, and the population necessarily converges to the upper bound of
      olive-oil intake. A genuine multi-objective tradeoff would require exposing fish, legume, and
      red-meat intake as decision variables together, and the model would need a competing objective
      running counter to a healthier diet, such as adherence or taste cost, which the current model
      does not include.
    limitations: >
      The parameters come from a Mediterranean population, and baseline values and effect sizes may
      differ across ethnicities; synergistic effects of micronutrients such as polyphenols are not
      modeled; individual variation in LDL response by APOE epsilon4 genotype is not yet included.
      LDL's one-year decline of about 2.33 mg/dL is converted proportionally from PREDIMED's 7mg/dL
      over three years; the rate constants for CRP, SBP, and HDL have not undergone the same
      cross-check, and while their magnitude is broadly reasonable, they have not each been
      re-derived from the literature. The current optimization exposes only olive_oil_ml_day as a
      decision variable, so it cannot yield a genuine multi-objective Pareto front, as explained in
      the result field above; a meaningful front would require redesigning the decision-variable set
      together with the objectives and constraints.
  ratings:
    importance: 0.75 - The Mediterranean diet is the best-evidenced cardiovascular-protective diet, a core focus of global nutrition research; dietary intervention is a commonly used background component in scenarios, moderate citation expected
    variable: 1.0 - Based on the large PREDIMED RCT (N>7000), with precise and reliable LDL/CRP parameters
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - No blocking todo found, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - No blocking todo found, but not yet compared against an independent literature target value
  tags: [nutrition, mediterranean, cardiovascular, LDL, CRP, blood_pressure, HDL, PREDIMED, olive_oil]

variables:
  ldl_mg_dl:
    description: |
      LDL cholesterol (mg/dL). Baseline: 145 mg/dL (mildly elevated).
      PREDIMED target: olive oil plus a Mediterranean diet gives about a 5% reduction over 3 years (about 7 mg/dL).
    value: 145.0
    unit: mg/dL
    type: state
    bounds: [50.0, 250.0]
    io_role: output

  crp_mg_l:
    description: |
      High-sensitivity C-reactive protein (hs-CRP, mg/L), a systemic-inflammation marker. Baseline: 2.5 mg/L (mildly elevated).
      Target <1.0 mg/L (low cardiovascular risk). PREDIMED: a Mediterranean diet over 3 years lowers CRP by about 10-20%.
    value: 2.5
    unit: mg/L
    type: state
    bounds: [0.1, 20.0]
    io_role: output

  systolic_bp:
    description: |
      Systolic blood pressure (mmHg). Baseline: 142 mmHg (the borderline of stage-1 hypertension).
      PREDIMED: a Mediterranean diet lowers SBP by about 2.3-5 mmHg (Toledo 2013).
    value: 142.0
    unit: mmHg
    type: state
    bounds: [90.0, 200.0]
    io_role: output

  hdl_mg_dl:
    description: |
      HDL cholesterol (mg/dL). Baseline: 45 mg/dL (somewhat low; the target is >=40 for men, >=50 for women).
      A Mediterranean diet (olive oil) raises HDL by about 1-2 mg/dL (Estruch 2013).
    value: 45.0
    unit: mg/dL
    type: state
    bounds: [20.0, 100.0]
    io_role: output

  mediterranean_diet_score:
    description: |
      The Mediterranean Diet Score, MDS (0-14), based on the Trichopoulou 2003 scale.
      1 point for each of 9 beneficial food groups above the median, 1 point for red meat below the median, and 1 point for moderate alcohol.
      A score >=9 defines high adherence.
    value: 4.0
    unit: score
    type: state
    bounds: [0.0, 14.0]
    io_role: output

  olive_oil_ml_day:
    description: |
      Daily extra-virgin olive oil intake (mL/day). The PREDIMED intervention arm's target is >=50 mL/day (about 4 tablespoons).
      Each 15mL of olive oil contributes about 0.5 points of MDS; >=50mL is a high intake (Estruch 2013).
    value: 20.0
    unit: mL/day
    type: input
    bounds: [0.0, 100.0]
    optimizable: true

  fish_servings_week:
    description: |
      Weekly fish/seafood servings (servings/week, 1 serving is about 150g). MedDiet recommends >=3 servings/week.
      Rich in EPA/DHA, lowering triglycerides and CRP (Calder 2013).
    value: 2.0
    unit: servings/week
    type: input
    bounds: [0.0, 14.0]
    optimizable: true

  legume_servings_week:
    description: |
      Weekly legume servings, tofu, lentils, chickpeas, etc. (servings/week, 1 serving is about 180g cooked weight).
      MedDiet recommends >=4 servings/week. Rich in dietary fiber, lowering LDL and CRP (Martinez-Gonzalez 2015).
    value: 2.0
    unit: servings/week
    type: input
    bounds: [0.0, 21.0]
    optimizable: true

  red_meat_servings_week:
    description: |
      Weekly red-meat/processed-meat servings (servings/week, 1 serving is about 100g).
      MedDiet recommends <1 serving/week; high red-meat intake antagonizes the Mediterranean diet's CVD-protective benefit.
    value: 5.0
    unit: servings/week
    type: input
    bounds: [0.0, 21.0]
    optimizable: true

  ldl_olive_oil_rate:
    description: |
      The daily LDL-lowering rate per mL/day of olive oil (mg/dL per mL/day per day).
      PREDIMED: the 50mL/day arm over 3 years, 1095 days, lowered LDL by 7mg/dL, giving rate = 7/(50x1095) is about 0.000128
      mg/dL per (mL/day) per day. The original value of 0.00002 mistakenly treated 3 years as 2555 days, 7 years, giving only about 0.36mg/dL over a 1-year simulation,
      far below the roughly 2.3mg/dL/year PREDIMED's ratio implies; corrected using the right number of years.
    value: 0.000128
    unit: mg/dL per (mL/day) per day
    type: parameter
    reference: "Estruch R et al. (2013) NEJM 368:1279-1290"

  crp_fish_rate:
    description: |
      The daily CRP-lowering rate from fish intake.
      3 fish servings per week, about 4g/week EPA+DHA, over 3 years lowers CRP by about 12% (about 0.3 mg/L), giving an estimated daily rate.
    value: 0.0001
    unit: mg/L per (servings/week) per day
    type: parameter
    reference: "Estruch R et al. (2013) NEJM 368:1279-1290"

  sbp_mds_rate:
    description: |
      The daily SBP-lowering rate per 1-point rise in MDS (mmHg per score per day).
      A 6-point MDS rise, baseline 4 to 10, lowers SBP by about 4 mmHg (a 750-day steady-state estimate).
    value: 0.0003
    unit: mmHg per score per day
    type: parameter
    reference: "Sofi F et al. (2010) Nutr Metab Cardiovasc Dis 20:456-463"

  hdl_olive_oil_rate:
    description: |
      The daily HDL-raising rate per mL/day of olive oil.
      PREDIMED: 50mL/day over 3 years raised HDL by about 1.5 mg/dL, giving a daily rate of about 0.000015.
    value: 0.000015
    unit: mg/dL per (mL/day) per day
    type: parameter
    reference: "Estruch R et al. (2013) NEJM 368:1279-1290"

  red_meat_ldl_rate:
    description: |
      The daily LDL-raising rate from red-meat intake (mg/dL per servings/week per day).
      5 servings of red meat per week versus 1 raises LDL by about 3-4 mg/dL, giving a daily rate of about 0.00007.
    value: 0.00007
    unit: mg/dL per (servings/week) per day
    type: parameter

equations:
  # F1: Mediterranean-diet score calculation (simplified: based on each food group's intake)
  mds_update:
    description: |
      MDS updates dynamically from food intake.
      Olive oil >=50mL gives 2 points; fish >=3 servings/week gives 2 points; legumes >=4 servings/week gives 2 points; red meat <1 serving/week gives 2 points; a base of 2 points.
      Totals 0-14 (simplified to the main food groups).
    condition: true
    priority: 10
    dynamics:
      mediterranean_diet_score: >
        min(14.0, max(0.0,
        2.0
        + min(2.0, olive_oil_ml_day / 25.0)
        + min(2.0, fish_servings_week / 1.5)
        + min(2.0, legume_servings_week / 2.0)
        + max(0.0, 2.0 - red_meat_servings_week * 1.0)
        + 2.0))

  # F2: LDL dynamics (lowered by olive oil, raised by red meat, approaching steady state)
  ldl_dynamics:
    description: |
      LDL: olive-oil polyphenols suppress LDL oxidation and hepatic synthesis, lowering it; red meat's saturated fat raises LDL;
      a Euler integration approaching steady state.
    step_unit: day
    condition: true
    priority: 8
    dynamics:
      ldl_mg_dl: >
        max(50.0, ldl_mg_dl
        - ldl_olive_oil_rate * olive_oil_ml_day * step
        + red_meat_ldl_rate * red_meat_servings_week * step)

  # F3: CRP dynamics (fish EPA/DHA and legume fiber lower inflammation)
  crp_dynamics:
    description: |
      CRP: fish EPA/DHA suppresses the NF-kB inflammatory pathway; legume dietary fiber improves gut microbiota, lowering endotoxin load.
      Natural baseline: rises slowly without intervention (a chronic-inflammation background).
    step_unit: day
    condition: true
    priority: 7
    dynamics:
      crp_mg_l: >
        max(0.1, crp_mg_l
        - crp_fish_rate * fish_servings_week * step
        - 0.00005 * legume_servings_week * step
        + 0.00005 * red_meat_servings_week * step)

  # F4: Systolic-blood-pressure dynamics (driven by the MDS score plus natural age progression)
  sbp_dynamics:
    description: |
      SBP: a higher MDS score lowers BP (the combined effect of olive-oil polyphenols, potassium, and fiber).
      Age progression without intervention: about +0.3 mmHg/year.
    step_unit: day
    condition: true
    priority: 6
    dynamics:
      systolic_bp: >
        max(90.0, systolic_bp
        - sbp_mds_rate * max(0.0, mediterranean_diet_score - 4.0) * step
        + 0.3 / 365.0 * step)

  # F5: HDL dynamics (raised by olive oil and fish)
  hdl_dynamics:
    description: |
      HDL: olive oil's oleic acid upregulates the ABCA1 transporter, increasing HDL synthesis;
      fish EPA/DHA improves HDL particle function.
    step_unit: day
    condition: true
    priority: 5
    dynamics:
      hdl_mg_dl: >
        min(100.0, hdl_mg_dl
        + hdl_olive_oil_rate * olive_oil_ml_day * step
        + 0.000010 * fish_servings_week * step)

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  output_variables:
    - ldl_mg_dl
    - crp_mg_l
    - systolic_bp
    - hdl_mg_dl
    - mediterranean_diet_score
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: olive_oil_ml_day
        time_start: "12:00"
        value: 50.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-12-31"]
        label: "Extra-virgin olive oil, 50mL/day (the PREDIMED intervention dose)"
      - variable: fish_servings_week
        time_start: "18:00"
        value: 3.0
        days: [Mon, Wed, Fri]
        date_range: ["2026-01-01", "2026-12-31"]
        label: "Fish, 3 servings/week"
      - variable: legume_servings_week
        time_start: "12:00"
        value: 1.0
        days: [Mon, Tue, Wed, Thu]
        date_range: ["2026-01-01", "2026-12-31"]
        label: "Legumes, 4 servings/week"
      - variable: red_meat_servings_week
        time_start: "18:30"
        value: 1.0
        days: [Sun]
        date_range: ["2026-01-01", "2026-12-31"]
        label: "Red meat limited to 1 serving/week"

  - id: western_baseline
    label: "Western-diet baseline (a no-intervention control)"
    regimens:
      - variable: olive_oil_ml_day
        time_start: "12:00"
        value: 5.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-12-31"]
        label: "Olive oil, only 5mL/day (ordinary cooking oil)"
      - variable: red_meat_servings_week
        time_start: "18:30"
        value: 1.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-12-31"]
        label: "Red meat, 7 servings/week (a typical Western diet)"

  - id: red_meat_confound
    label: "High adherence plus high red meat (the protective effect partially offset)"
    regimens:
      - variable: olive_oil_ml_day
        time_start: "12:00"
        value: 50.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-12-31"]
        label: "Extra-virgin olive oil, 50mL/day (the same PREDIMED intervention dose)"
      - variable: fish_servings_week
        time_start: "18:00"
        value: 3.0
        days: [Mon, Wed, Fri]
        date_range: ["2026-01-01", "2026-12-31"]
        label: "Fish, 3 servings/week"
      - variable: legume_servings_week
        time_start: "12:00"
        value: 1.0
        days: [Mon, Tue, Wed, Thu]
        date_range: ["2026-01-01", "2026-12-31"]
        label: "Legumes, 4 servings/week"
      - variable: red_meat_servings_week
        time_start: "18:30"
        value: 1.0
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-12-31"]
        label: "Red meat, 7 servings/week (the only difference from default: red meat raised from 1 to 7 servings/week)"

optimization:
  method: nsga2
  objectives:
    - variable: ldl_mg_dl
      metric: final
      direction: minimize
      description: "Minimizing year-end LDL (atherosclerosis risk)"
    - variable: crp_mg_l
      metric: final
      direction: minimize
      description: "Minimizing year-end CRP (systemic inflammation)"
  # Note: HDL/SBP's original thresholds (>=50 / <=130) are multi-year clinical targets unreachable by
  # any input combination within a 1-year simulation window (HDL reaches at most about 45.49, SBP at
  # most about 141.83), leaving the optimizer's feasible fraction permanently at 0%. They are changed
  # to "no worse than baseline" sanity floors rather than objectives carrying selective pressure,
  # because this model's only decision variable, olive_oil_ml_day, is beneficial to LDL/HDL/SBP in the
  # same direction, more is always better, and has no effect at all on CRP (crp_dynamics depends only
  # on fish/legume/red_meat, none of which are exposed as decision variables), so there is no genuine
  # conflict between the LDL and CRP objectives, and the front necessarily degenerates to a single
  # point (oil=80). A genuine multi-objective tradeoff would require exposing fish/legume/red_meat as
  # decision variables and adding a competing objective running counter to "healthy eating," such as
  # adherence cost, which the current model does not include; this is outside the scope of this
  # validation pass, see metadata.description.limitations.
  constraints:
    - variable: hdl_mg_dl
      condition: ">= 45.0"
      type: soft
      description: "HDL should not fall below the baseline of 45 (a sanity floor, not an objective carrying selective pressure, see the note under objectives)."
    - variable: systolic_bp
      condition: "<= 142.0"
      type: soft
      description: "SBP should not exceed the baseline of 142 (a sanity floor, not an objective carrying selective pressure, see the note under objectives)."
  startpoint:
    regimens:
      - variable: olive_oil_ml_day
        time_start: "12:00"
        time_end: "12:00"
        label: "Olive oil (mL/day)"
        optimize:
          value: [10.0, 80.0]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19
  # The front degenerates to a single point (not a bug): olive_oil_ml_day is the only decision
  # variable, monotonically beneficial for LDL/HDL/SBP alike, and has no effect on CRP (crp_dynamics
  # depends only on fish/legume/red_meat, none of which are exposed as decision variables), so there
  # is no genuine conflict between the LDL and CRP objectives, and the population as a whole converges
  # to oil=80 (the upper bound). See the note under objectives and description.limitations.
  results:
    generated_at: "2026-07-06"
    method: nsga2
    n_solutions: 1
    elapsed_seconds: 24.8
    pareto_front:
      - {x: [80.0], f: [141.40, 2.48]}
    recommended:
      x: [80.0]
      f: [141.40, 2.48]

references:
  - "Estruch R et al. (2013/2018) Primary prevention of cardiovascular disease with a Mediterranean diet supplemented with extra-virgin olive oil or nuts. NEJM 368:1279-1290 / 378:e34."
  - "Toledo E et al. (2015) Mediterranean diet and invasive breast cancer risk among women at high cardiovascular risk in the PREDIMED trial. Ann Intern Med 163(7):503-510."
  - "Sofi F et al. (2010) Accruing evidence on benefits of adherence to the Mediterranean diet on health: an updated systematic review and meta-analysis. Nutr Metab Cardiovasc Dis 20(7):456-463."
  - "Martinez-Gonzalez MA et al. (2015) Mediterranean diet and 10-year incidence of CVD and mortality. Eur J Clin Nutr 69(1):99-107."
