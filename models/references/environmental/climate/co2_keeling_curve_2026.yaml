category: environmental

metadata:
  name: co2_keeling_curve
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      Validation purpose: a cross-disciplinary extension into environmental science. The Mauna Loa
      observatory has continuously measured atmospheric CO2 concentration since 1958, the
      well-known Keeling Curve, one of the longest-running and most precisely measured continuous
      observational records in earth science. A constant compound-growth-rate model is fit to the
      two endpoint years, 316ppm in 1959 and 425ppm in 2024, and a leave-one-out prediction is made
      for the intermediate year 1990, testing whether "simple exponential growth" can describe this
      curve, and whether the deviation's direction matches the known fact that CO2's growth rate
      itself is accelerating.
    result: |
      This file corresponds to paper `paper/c_paper_s1_cn.md` section 6.2. Fitting an annual
      compound growth rate of 0.457% from the 1959/2024 endpoints predicts a 1990 CO2 concentration
      of 364.0ppm, against the NOAA/NASA GISS recorded 1990 measured value of 354.29ppm, an
      overestimate of about 2.7%, with the deviation's direction consistent with the fact that CO2's
      annual growth rate itself has accelerated over time: the annual growth rate was about 0.7ppm/
      year in the 1960s and about 2.5 to 3ppm/year in the 2020s, so a constant-rate model fit to the
      two endpoints of the full period will systematically overestimate the slower early-to-middle
      period.
    limitations: |
      This file uses a simple compound-growth-rate model to approximate a curve known not to grow
      at a constant rate, a simplification the model itself acknowledges, and the prediction
      deviation arises precisely from this, not from a data or calculation error; it includes no
      emissions-driving mechanism, being purely a function-fitting demonstration of the observational
      record itself.
  ratings:
    importance: 0.25 - A methodology-validation demonstration, the first case in the environmental category, usable as a background component for climate-related cross-disciplinary scenarios
    variable: 1.0 - The Mauna Loa observational record is one of the longest and most precise continuous observational datasets in earth science, directly traceable to the literature
    equation: 0.5 - The author independently fit an exponential to real observational data, not an independently reproduced standard equation form
    simulation: 1.0 - The 1990 leave-one-out prediction of 364.0ppm against a measured 354.29ppm, a 2.7% deviation with an explicable direction, passes point-by-point verification
    optimization: 0.0 - This file contains no optimization block, being a pure observational-data-fitting demonstration with no decision variables
    confidence: 1.0 - An independent prediction test passes, a leave-one-out prediction using a data point not part of the fit agrees with the measured data
  tags: [environmental, climate, co2, validation, literature-benchmark, cross-domain]

variables:
  days_since_1959:
    description: Days elapsed since the start of 1959, the direct accumulation of the simulation clock
    value: 0.0
    unit: day
    type: state

  co2_ppm:
    description: >
      The predicted atmospheric CO2 concentration (ppm), computed with a constant compound-growth-
      rate model fit to the 1959/2024 endpoints,
      a static algebraic equation, not an independent dynamics integral.
    value: 316.0
    unit: ppm
    type: state

  co2_baseline_1959:
    description: The 1959 Mauna Loa annual-mean CO2 concentration (the fit's starting point)
    value: 316.0
    unit: ppm
    type: parameter
    reference: "NASA GISS / NOAA GML Mauna Loa record"

  annual_growth_rate:
    description: >
      The constant annual compound growth rate the author fit from the 1959 (316ppm) and 2024
      (425ppm) endpoints,
      a coefficient not given directly by the literature.
    value: 0.0045695
    unit: 1/year
    type: parameter
    reference: "This file's author's two-point compound-growth-rate fit to the Mauna Loa 1959/2024 observed values"

equations:
  clock_tick:
    description: "Clock accumulation: days_since_1959 tracks elapsed days step by step"
    step_unit: day
    condition: true
    priority: 5
    dynamics:
      days_since_1959: "days_since_1959 + step"

  co2_calc:
    description: "A static compound-growth-rate calculation: co2_ppm = 316*(1+r)^(t/365.25), not integrated over time, just reading the current days_since_1959"
    condition: true
    priority: 3
    dynamics:
      co2_ppm: "co2_baseline_1959 * (1.0 + annual_growth_rate) ** (days_since_1959 / 365.25)"

simulation:
  step_size:
    value: 365
    unit: day
  start_date: "1959-01-01"
  end_date: "2024-06-01"
  output_variables:
    - days_since_1959
    - co2_ppm
  plans:
    - id: "observed_record"
      label: "Reproducing the 1959-2024 Mauna Loa observational record (no input events, a purely clock-driven static curve evaluation)"
      regimens: []

references:
  - "Keeling CD et al., Scripps Institution of Oceanography / NOAA Global Monitoring Laboratory, Mauna Loa CO2 record (mlo.html)"
  - "NASA GISS Global Mean CO2 Mixing Ratios (Observations), data.giss.nasa.gov"
