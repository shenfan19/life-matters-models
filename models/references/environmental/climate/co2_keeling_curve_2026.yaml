category: environmental

metadata:
  name: co2_keeling_curve
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      验证目的：跨学科拓展到环境科学。Mauna Loa 观测站自1958年起连续测量大气CO2浓度，即广为人知的 Keeling Curve，是地球科学里持续时间最长、测量最精确的连续观测记录之一。用1959年316ppm和2024年425ppm两个端点年份拟合恒定复合增长率模型，对中间年份1990年做留一法预测，检验"简单指数增长"能否描述这条曲线，以及偏差方向是否符合"CO2增速本身在加速"这一已知事实。
    result: |
      本文件对应论文 `paper/c_paper_s1_cn.md` §6.2。用1959/2024两个端点拟合年复合增长率0.457%，预测1990年CO2浓度364.0ppm，NOAA/NASA GISS记录的1990年实测值为354.29ppm，预测偏高约2.7%，偏差方向与CO2年增速本身随时间加速这一事实一致：1960年代年增速约0.7ppm/年，2020年代年增速约2.5至3ppm/年，恒定速率模型用全周期两端点拟合，会在增速较慢的早期到中期区间系统性高估。
    limitations: |
      本文件用简单复合增长率模型近似一条已知非恒速的曲线，模型本身承认这一简化，预测偏差正是由此产生，不是数据或计算错误；不包含任何排放驱动机制，纯粹是对观测记录本身的函数拟合展示。
  ratings:
    importance: 0.25 - 方法论验证展示，environmental分类下首个案例，可作为气候相关跨学科场景背景组件
    variable: 1.0 - Mauna Loa观测记录是地球科学最长、最精确的连续观测数据之一，文献可直接追溯
    equation: 0.5 - 作者自行对真实观测数据做指数拟合，非独立复现的标准方程形式
    simulation: 1.0 - 1990年留一法预测364.0ppm vs 实测354.29ppm，偏差2.7%且方向可解释，逐点验证通过
    optimization: 0.0 - 本文件不含optimization，纯观测数据拟合验证，不涉及决策变量
    confidence: 1.0 - 独立预测检验通过：用不参与拟合的独立数据点做留一法预测，结果与实测数据吻合
  tags: [environmental, climate, co2, validation, literature-benchmark, cross-domain]

variables:
  days_since_1959:
    description: 自1959年初以来经过的天数，仿真时钟直接累加
    value: 0.0
    unit: day
    type: state

  co2_ppm:
    description: >
      预测的大气CO2浓度（ppm），用1959/2024两端点拟合的恒定复合增长率模型计算，
      静态代数方程，不是独立的动力学积分。
    value: 316.0
    unit: ppm
    type: state

  co2_baseline_1959:
    description: 1959年Mauna Loa年均CO2浓度（拟合起点）
    value: 316.0
    unit: ppm
    type: parameter
    reference: "NASA GISS / NOAA GML Mauna Loa 记录"

  annual_growth_rate:
    description: >
      作者用1959年(316ppm)与2024年(425ppm)两端点拟合的恒定年复合增长率，
      非文献直接给出的系数。
    value: 0.0045695
    unit: 1/year
    type: parameter
    reference: "本文件作者对 Mauna Loa 1959/2024 观测值的两点复合增长率拟合"

equations:
  clock_tick:
    description: "时钟累加：days_since_1959 逐步跟踪经过天数"
    step_unit: day
    condition: true
    priority: 5
    dynamics:
      days_since_1959: "days_since_1959 + step"

  co2_calc:
    description: "静态复合增长率计算：co2_ppm = 316·(1+r)^(t/365.25)，不随时间积分，只读当前 days_since_1959"
    condition: true
    priority: 3
    dynamics:
      co2_ppm: "co2_baseline_1959 * (1.0 + annual_growth_rate) ** (days_since_1959 / 365.25)"

simulation:
  step_size:
    value: 365
    unit: day
  start_date: "1959-01-01"
  end_date: "2024-06-01"
  output_variables:
    - days_since_1959
    - co2_ppm
  plans:
    - id: "observed_record"
      label: "1959-2024 Mauna Loa 观测记录复现（无输入事件，纯时钟驱动的静态曲线评估）"
      regimens: []

references:
  - "Keeling CD et al., Scripps Institution of Oceanography / NOAA Global Monitoring Laboratory, Mauna Loa CO2 record (mlo.html)"
  - "NASA GISS Global Mean CO2 Mixing Ratios (Observations), data.giss.nasa.gov"
