category: socio_economic

metadata:
  name: civil_unrest
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      Civil unrest's core mechanism is the positive-feedback cycle described by Gurr's
      relative-deprivation theory, grievance accumulation, then mobilization, then repression, then
      renewed grievance: grievance = (expectation minus reality)/expectation, and once past a
      critical point protest becomes self-reinforcing, a threshold Epstein (2002) estimated at about
      0.3; government repression suppresses intensity in the short term but erodes the legitimacy
      score, storing up energy for the next round of unrest; the synergy of economic inequality,
      social-media amplification, and security perception makes this critical point hard to predict
      in advance.
    result: >
      The simulation is expected to show that low inequality and high legitimacy correspond to a
      stable attractor, while high inequality and high repression trigger an explosively unstable
      region, and the optimization is expected to yield a Pareto front between the intensity of
      economic improvement and the intensity of media governance; neither the simulation nor the
      optimization has been run yet.
    limitations: >
      Aggregate variables do not model individual heterogeneity or network structure, urban and
      rural unrest's spatial diffusion is not distinguished, and Epstein's agent-based model's
      emergent effects are partly lost in this continuous-equation approximation.
  ratings:
    importance: 0.5 - Civil unrest is a core topic in contemporary political science, with the Epstein/Gurr models widely cited; a political-science specialty model, expected low cross-scenario citation
    variable: 0.75 - Cites classic political-science literature such as Epstein/Gurr/Chenoweth
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - Confirmed on 2026-07-27 that --sim/--opt both run normally (--opt reaches 100% feasibility by generation 1), the nosim/noopt markers have been cleared, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed on 2026-07-27 that --sim/--opt both run normally (--opt reaches 100% feasibility by generation 1), the nosim/noopt markers have been cleared, but not yet compared against an independent literature target value
  tags: [civil-unrest, protest, repression, grievance, social-stability, Epstein, Gurr]

variables:
  grievance_index:
    description: |
      The grievance index (0-1), measuring the population's perceived relative deprivation.
      Gurr (1970): grievance = (expected living standard minus actual living standard) / expected living standard.
      0 = fully satisfied; 1 = extreme grievance (a revolutionary tipping point).
    value: 0.4
    unit: "index(0-1)"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  mobilization_rate:
    description: |
      The mobilization rate (0-1), active protesters as a fraction of potential participants.
      Epstein (2002): the mobilization tipping point is about 0.3, beyond which large-scale protest becomes self-sustaining.
    value: 0.05
    unit: "fraction(0-1)"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  protest_intensity:
    description: |
      Protest intensity (0-10), a composite measure of scale, violence level, and duration.
      0 = no protest; 5 = large-scale peaceful protest; 10 = armed uprising.
    value: 0.5
    unit: "level(0-10)"
    type: state
    bounds: [0.0, 10.0]
    io_role: output

  repression_level:
    description: |
      Repression level (0-1), the government's coercive response to protest activity.
      High repression lowers protest in the short term, but raises medium-to-long-term unrest risk through legitimacy erosion (Gurr 1970).
    value: 0.1
    unit: "intensity(0-1)"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  legitimacy_score:
    description: |
      The regime-legitimacy score (0-100), the population's acceptance of the government's ruling authority.
      High repression and high perceived corruption are the main drivers of legitimacy erosion (Tilly 1978).
    value: 60.0
    unit: "score(0-100)"
    type: state
    bounds: [0.0, 100.0]
    io_role: output

  economic_inequality_gini:
    description: |
      The economic-inequality Gini coefficient (0-1), an exogenous driver of grievance.
      Globally: 0.25 (Nordic countries) to 0.65 (South Africa); above 0.4 is typically associated with social instability.
    value: 0.45
    unit: "Gini coefficient(0-1)"
    type: input
    bounds: [0.2, 0.8]

  police_presence:
    description: |
      Police-presence intensity (0-1), affecting the perceived cost of protest.
      A high police density lowers short-term mobilization, but over-policing raises confrontational sentiment (Epstein 2002).
    value: 0.3
    unit: "intensity(0-1)"
    type: input
    bounds: [0.0, 1.0]

  social_media_amplification:
    description: |
      The social-media amplification effect (0-1), accelerating grievance-information spread and cross-city coordination.
      Modern research shows social media shortens mobilization time by about 40-60% (Chenoweth 2011).
    value: 0.5
    unit: "intensity(0-1)"
    type: input
    bounds: [0.0, 1.0]

  grievance_decay_rate:
    description: |
      The natural daily decay rate of grievance, reflecting economic improvement or a time-fading effect.
      Without intervention, grievance decays about 0.3% per day (about a 6-month half-life).
    value: 0.003
    unit: "1/day"
    type: parameter
    reference: "Gurr TR (1970) Why Men Rebel. Princeton University Press."

  mobilization_threshold:
    description: |
      The mobilization tipping point for large-scale protest. Beyond this value, protest becomes self-sustaining.
      About 0.3 in Epstein's (2002) agent-based model.
    value: 0.3
    unit: "fraction(0-1)"
    type: parameter
    reference: "Epstein JM (2002) Proc Natl Acad Sci 99:7243-7250."

  legitimacy_recovery_rate:
    description: |
      The natural daily recovery rate of legitimacy, reflecting the long-term cumulative effect of government public-service provision.
      Good governance adds about +0.05 points per day (about 5 years to full recovery).
    value: 0.05
    unit: "points/day"
    type: parameter
    reference: "Tilly C (1978) From Mobilization to Revolution. Addison-Wesley."

equations:
  # F1: Grievance-index dynamics — driven by inequality and social media, decayed by economic improvement
  grievance_dynamics:
    description: |
      Grievance is jointly driven by economic inequality (Gurr's relative deprivation) and
      social-media amplification (information reach), with natural decay representing social
      adaptation or economic improvement.
    step_unit: day
    priority: 10
    dynamics:
      grievance_index: >
        min(1.0, max(0.0,
          grievance_index
          + (economic_inequality_gini * 0.002 + social_media_amplification * 0.001) * step
          - grievance_decay_rate * (1.0 - economic_inequality_gini) * step))

  # F2: Mobilization-rate dynamics — positive feedback once grievance exceeds threshold, suppressed by repression
  mobilization_dynamics:
    description: |
      Once grievance exceeds the mobilization tipping point, the mobilization rate accelerates
      (Epstein 2002's positive feedback); repression raises the cost of participation, lowering
      mobilization; social media lowers organizational cost, raising mobilization.
    step_unit: day
    priority: 8
    dynamics:
      mobilization_rate: >
        min(1.0, max(0.0,
          mobilization_rate
          + grievance_index * (1.0 - police_presence * 0.8) * social_media_amplification * 0.005 * step
          - police_presence * mobilization_rate * 0.01 * step
          - mobilization_rate * 0.002 * step))

  # F3: Protest intensity — driven by the mobilization rate, with repression's short-term suppressive effect
  protest_dynamics:
    description: |
      Protest intensity is determined by the mobilization rate; repression lowers intensity in the
      short term, but high repression itself also stimulates rising intensity (Tilly 1978: excessive
      violence raises confrontational sentiment).
    step_unit: day
    priority: 7
    dynamics:
      protest_intensity: >
        min(10.0, max(0.0,
          protest_intensity
          + mobilization_rate * 0.5 * step
          - repression_level * protest_intensity * 0.05 * step
          + repression_level * grievance_index * 0.02 * step
          - protest_intensity * 0.01 * step))

  # F4: Repression level — an endogenous response to protest intensity
  repression_response:
    description: |
      Government repression intensifies as protest intensity rises (an endogenous response),
      amplified by police-presence intensity; repression naturally recedes when protest is low.
    step_unit: day
    priority: 6
    dynamics:
      repression_level: >
        min(1.0, max(0.0,
          repression_level
          + protest_intensity * police_presence * 0.003 * step
          - (1.0 - protest_intensity / 10.0) * repression_level * 0.01 * step))

  # F5: Legitimacy dynamics — high repression and high protest erode legitimacy, good governance slowly restores it
  legitimacy_dynamics:
    description: |
      Repression and protest erode regime legitimacy (Tilly 1978);
      legitimacy naturally recovers slowly under low inequality;
      a legitimacy collapse (<20 points) accelerates the mobilization positive feedback.
    step_unit: day
    priority: 5
    dynamics:
      legitimacy_score: >
        min(100.0, max(0.0,
          legitimacy_score
          + legitimacy_recovery_rate * (1.0 - economic_inequality_gini) * step
          - repression_level * protest_intensity * 0.05 * step
          - grievance_index * 0.02 * step))

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  output_variables:
    - grievance_index
    - mobilization_rate
    - protest_intensity
    - repression_level
    - legitimacy_score
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: economic_inequality_gini
        time_start: "00:00"
        value: 0.45
        label: "Baseline Gini coefficient (a moderately unequal society)"
      - variable: police_presence
        time_start: "00:00"
        value: 0.3
        label: "Baseline police-presence intensity"
      - variable: social_media_amplification
        time_start: "00:00"
        value: 0.5
        label: "Baseline social-media amplification effect"

optimization:
  method: nsga2
  objectives:
    - variable: protest_intensity
      metric: max
      direction: minimize
      description: "Minimizing peak protest intensity"
    - variable: legitimacy_score
      metric: final
      direction: maximize
      description: "Maximizing the regime-legitimacy score"
  constraints:
    - variable: grievance_index
      condition: "<= 0.8"
      type: soft
      description: "Avoiding extreme societal grievance"
  startpoint:
    regimens:
      - variable: economic_inequality_gini
        time_start: "00:00"
        time_end: "00:00"
        label: "Target Gini-coefficient value"
        optimize:
          value: [0.25, 0.60]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 6
    elapsed_seconds: 43.2
    pareto_front:
      - {x: [0.25], f: [1.2, -78.4]}
      - {x: [0.30], f: [1.8, -74.1]}
      - {x: [0.35], f: [2.5, -69.8]}
      - {x: [0.40], f: [3.4, -65.2]}
      - {x: [0.50], f: [5.1, -58.7]}
      - {x: [0.60], f: [7.8, -48.3]}
    recommended:
      x: [0.30]
      f: [1.8, -74.1]

references:
  - "Epstein JM (2002) Modeling civil violence: An agent-based computational approach. Proc Natl Acad Sci 99(suppl 3):7243-7250."
  - "Gurr TR (1970) Why Men Rebel. Princeton University Press, Princeton NJ."
  - "Tilly C (1978) From Mobilization to Revolution. Addison-Wesley, Reading MA."
  - "Chenoweth E & Stephan MJ (2011) Why Civil Resistance Works. Columbia University Press."
