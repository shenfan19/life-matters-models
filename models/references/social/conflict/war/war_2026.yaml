metadata:
  todo:
    - type: quality
      severity: resolved
      issue: "[Diagnosis completed 2026-07-06, not a bug] Under the default optimization scenario (an initial tension of 10, no historical input trajectory), --opt converges to the trivial solution best_f=[100,0] (social_stability at the full 100, conflict_intensity at 0), showing no genuine tradeoff"
      evidence: "A 2026-07-06 --opt-only test run: feasible=100% throughout all 50 generations, with best_f already [100,0] from Gen1 onward and never changing. Cause: the initial tension of 10 is far below escalation_dynamics's trigger threshold of 50, so even with diplomatic_talks=0 and defense_spending=0 throughout, it never heats up; 'taking no action at all' is the trivial optimum, since this reference component's default configuration has no built-in source of conflict pressure."
      resolution: "A TODO re-check before the 2026-09-04 translation pass confirms this is an honest 'no tradeoff' finding, not a bug: genuine historical pressure (an arms-race trajectory, an exogenous resource shock) requires an explicit input trajectory to appear, with the specific historically calibrated scenarios kept in internal records (outside this reference component's public scope). This reference component is designed to stay general-purpose/scenario-free, and no pressure input is fabricated here; no further fix is needed."
  log:
    "2026-07-06_01-33-00":
      change: "Added the institutional_reversibility state, the k_reversibility_defense/k_reversibility_scarcity parameters, the resource_shock input, and the reversibility_decay/resource_shock_dynamics equations; changed the de_escalation effect to be modulated by institutional_reversibility; changed all equations.step_unit from the invalid 'month' to 'day', dividing the literal coefficients by 30 for conversion (a type-A state-independent flux term, an exact linear conversion); updated simulation.step_size to day accordingly."
      reason: "Added an 'institutional-reversibility erosion' mechanism so the model can express 'why a rational actor cannot brake in time,' not just the classic Richardson arms-race escalation. step_unit='month' had never passed schema validation before this (--sim errored 'must be minute|hour|day'), the real root cause of this file's long-standing nosim/noopt status, fixed together in this pass. Both --sim (with no default input scenario, holding flat throughout) and --opt (50 generations/pop50, converging to [100,0], see the todo above) have been test-run and pass."
  name: war
  lm_format_version: "1.0"
  updated: 2026-07-06
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      The Richardson arms-race framework (1960) describes geopolitical tension's dynamics:
      security fear and military expansion drive tension upward, while diplomatic effort and a decay
      coefficient denoted alpha for war-weariness drive it downward, with conflict intensity derived
      from tension through a threshold trigger function. The core tension is that each side's
      defensive buildup looks like an offensive threat to the other, forming a security-dilemma
      positive-feedback loop. The model also includes a state variable, institutional reversibility,
      corresponding to the institutional_reversibility field, describing why a rational actor,
      knowing the cliff lies ahead, still finds it hard to brake: how much diplomatic negotiation can
      pull tension back depends on the sunk cost measured by cumulative defense investment, and how
      much political reversibility has already been eroded by the countdown pressure of resource
      scarcity, not merely on the nominal intensity of the current period's diplomatic investment.
    result: >
      The simulation is expected to show a moderate-tension baseline's one-year evolution path
      under varying diplomatic intensity and military spending, and the nonlinear jump in conflict
      intensity once the tipping point is crossed, with the same diplomatic investment's cooling
      effect markedly weakened after institutional reversibility erodes; the specific historically
      calibrated scenarios are kept in internal records, outside this reference component's public
      scope.
    limitations: >
      A highly simplified model that does not distinguish nuclear deterrence from conventional war;
      it does not explicitly model specific domestic political-game mechanisms such as
      military-faction overreach, using only the aggregate institutional-reversibility state as a
      proxy; the Richardson framework was originally bilateral, and multilateral conflict would need
      a network extension; k_reversibility_defense and k_reversibility_scarcity are calibrated
      choices rather than directly measured literature values, see the TODO:SOURCE annotation on the
      corresponding variables.
  ratings:
    importance: 0.75 - War and conflict are among the world's most significant social risks, and the Richardson arms-race model is a classic benchmark; war is a foundational background component in several historical scenarios, moderate citation expected
    variable: 0.75 - Cites Richardson's classic work, the Wallace/Diehl arms-race-versus-escalation empirical debate, the Sleesman escalation-of-commitment meta-analysis, and authoritative data sources such as SIPRI/COW
    equation: 0.75 - The Richardson arms-race model is a classic, widely cited structure in conflict research, with resource desperation and reversibility erosion as self-built extensions
    simulation: 0.5 - No blocking todo found, but not yet compared against an independent literature target value
    optimization: 0.0 - Confirmed twice, on 2026-07-06 and 2026-09-04, that the default scenario converges to the trivial solution [100,0], with no genuine tradeoff between decision variables absent a historical pressure input; this is by design, not a bug
    confidence: 0.25 - No blocking todo found, but not yet compared against an independent literature target value
  tags: [war, conflict, geopolitics, Richardson, arms-race, escalation-of-commitment, social]

variables:
  # R1: Tension
  geopolitical_tension: {description: "Geopolitical tension", value: 10, unit: "score", type: state, bounds: [0, 100]}
  # R2: Conflict
  conflict_intensity: {description: "Conflict intensity", value: 0, unit: "level", type: state, bounds: [0, 10]}
  # R3: Consequence
  social_stability: {description: "Social stability", value: 100, unit: "score", type: state, bounds: [0, 100]}
  resource_scarcity: {description: "Resource-scarcity level", value: 0, unit: "score", type: state, bounds: [0, 100]}

  # R4: Institutional brake (added 2026-07-06)
  institutional_reversibility:
    type: state
    value: 100
    unit: "score"
    bounds: [0, 100]
    description: >
      Institutional reversibility: a multiplier state for how much diplomatic effort can pull
      tension back. 100=diplomatic effort takes full effect, 0=diplomatic effort can no longer lower
      tension at all (the "brake pads" are worn out). Eroded jointly by cumulative defense
      investment (sunk cost/vested interest groups) and resource scarcity (countdown pressure), with
      diplomatic negotiation offering only a weak recovery effect.
    reference: "The mechanism is inspired by the Sleesman et al. (2012) escalation-of-commitment meta-analysis (which aggregates correlation coefficients across many antecedent categories and does not give a directly transferable dynamics coefficient)"

  # P1: Inputs (Card Inputs)
  diplomatic_talks: {description: "Diplomatic-negotiation investment", value: 0, unit: "level", type: input}
  defense_spending: {description: "Defense-spending increment", value: 0, unit: "level", type: input}
  propaganda_campaign: {description: "Propaganda-campaign intensity", value: 0, unit: "level", type: input}

  resource_shock:
    type: input
    value: 0
    unit: "score"
    description: >
      An exogenous resource shock (e.g. an embargo/supply-cutoff event): pushes resource
      scarcity up in a pulse, independent of the resource consumption caused by conflict intensity,
      used to express "a sudden collapse in resource stock" as distinct from "used up by fighting a
      war," two different causal mechanisms.
    reference: "A calibrated choice; the specific historical anchor is kept in internal records (outside this reference component's public scope)"

  k_reversibility_defense:
    type: parameter
    value: 0.15
    unit: "score per level of defense spending"
    description: >
      The rate at which a defense-spending increment erodes institutional reversibility: a
      calibrated choice, not a directly measured literature value. The mechanism is based on the
      Sleesman et al. (2012) meta-analysis, that sunk cost and the degree of committed investment are
      robust, replicable predictors of the persistence of escalation of commitment, but the original
      paper aggregates correlation coefficients across many antecedent categories and does not give a
      value directly mappable to this dynamics coefficient.
    reference: "TODO:SOURCE a calibrated choice; the mechanism is based on Sleesman et al. (2012) Acad Manag J 55(3):541-562"

  k_tension_buildup:
    type: parameter
    value: 2.4
    unit: "score per level of defense spending per month"
    description: >
      The monthly rate at which defense-spending intensity raises geopolitical tension: a
      calibrated choice, not a directly measured literature value. This fixes an earlier version's
      mechanism gap where "defense spending never raised tension." The magnitude is chosen so that
      sustained high-intensity defense spending can drive tension near escalation_dynamics's trigger
      threshold (50 points) on a timescale of several years, with the specific historically
      calibrated scenarios kept in internal records (outside this reference component's public
      scope), a qualitative timescale calibration, not a year-by-year exact reproduction.
    reference: "TODO:SOURCE a calibrated choice; the mechanism is based on Richardson LF (1960) Arms and Insecurity"

  k_desperation:
    type: parameter
    value: 0.02
    unit: "level of conflict intensity per point of resource scarcity above threshold per month"
    description: >
      The rate at which resource scarcity above the threshold (50 points) directly raises
      conflict intensity: a calibrated choice, not a directly measured literature value. The
      magnitude is chosen so that when resource_scarcity stays at a high level, conflict intensity
      rises markedly on a timescale of about 1-2 years, with the specific historically calibrated
      scenarios kept in internal records (outside this reference component's public scope), a
      qualitative timescale calibration, not an exact reproduction.
    reference: "TODO:SOURCE a calibrated choice"

  k_reversibility_scarcity:
    type: parameter
    value: 0.3
    unit: "score per point of resource scarcity"
    description: >
      The rate at which resource scarcity erodes institutional reversibility: a calibrated
      choice, representing that the "countdown" pressure before resource stock bottoms out erodes
      reversibility faster than ordinary defense investment does. The specific historical anchor is
      kept in internal records (outside this reference component's public scope).
    reference: "TODO:SOURCE a calibrated choice"

equations:
  # F0: Reactive tension buildup (added 2026-07-06, fixing a key missing mechanism)
  tension_buildup:
    description: >
      Defense spending (arms-race intensity) raises geopolitical tension, the core reactive
      mechanism of the Richardson framework: one side's buildup is perceived by the other as a
      threat (the security dilemma). The earlier version had only de_escalation (diplomatic cooling)
      and escalation_dynamics (tension >50 converting to conflict), with no mechanism at all raising
      tension, causing tension to decay monotonically to 0 under the default scenario; this fixes
      that gap. k_tension_buildup is a calibrated choice (not a directly measured literature value):
      Richardson's (1960) original equation dx/dt=ky-ax+g targets bilateral independent
      military-spending variables, while this model uses a single aggregate defense_spending as a
      proxy for bilateral intensity, so the coefficient needs recalibration rather than direct reuse
      of the literature coefficient.
    step_unit: day
    dynamics:
      geopolitical_tension: "min(100, geopolitical_tension + k_tension_buildup * defense_spending / 30 * step)"
    priority: 6
    reference: "The mechanism is based on Richardson LF (1960) Arms and Insecurity; the coefficient is a calibrated choice, see the k_tension_buildup variable's TODO:SOURCE"

  # F0b: Resource-desperation escalation path (added 2026-07-06, a second escalation path
  # running parallel to tension_buildup: capturing "resource-shock-type" crises — a 2026-07-06
  # --sim test run found that tension_buildup/de_escalation alone cannot reproduce a
  # resource-shock-type crisis's escalation, with the net effect instead cooling to 0, and
  # resource_scarcity jumping after an embargo/supply cutoff but never converting to conflict —
  # a resource-shock-type crisis's real logic is not "security-dilemma-style mutual tension
  # probing" but "desperation logic on the countdown toward resource-stock exhaustion,"
  # requiring a second pathway independent of geopolitical_tension.
  desperation_pressure:
    description: >
      Resource scarcity directly raises conflict intensity: as resource stock nears exhaustion,
      the desperation logic of "fight or die waiting" drives conflict escalation independent of the
      ordinary security-dilemma tension pathway, a second escalation path running parallel to
      tension_buildup/escalation_dynamics (the security-dilemma path), used to capture the mechanism
      difference between a resource-shock-type crisis and a gradual arms-race-type crisis, with
      specific historical cases kept in internal records (outside this reference component's public
      scope).
    step_unit: day
    condition: resource_scarcity > 50
    dynamics:
      conflict_intensity: "min(10, conflict_intensity + k_desperation * (resource_scarcity - 50) / 30 * step)"
    priority: 4
    reference: "A calibrated choice; the specific historical anchor is kept in internal records (outside this reference component's public scope)"

  # F1: Escalation
  escalation_dynamics:
    description: >
      Tension converts to conflict (the security-dilemma path). The coefficient is calibrated on
      a monthly basis (the natural timescale of the original Richardson framework); on 2026-07-06,
      since step_unit only supports minute|hour|day ("month" was invalid, one root cause of this
      file's earlier nosim status), it was changed to a day-level step, with the literal coefficient
      divided by 30 to convert to a daily rate (a type-A state-independent flux term, an exact
      linear conversion, see model.md ADR 0121). Second pass on 2026-07-06: the social_stability
      depletion was moved to a separate conflict_toll equation (no longer attached to the
      geopolitical_tension>50 condition), because conflict driven by desperation_pressure (the
      resource-desperation path) should equally deplete social stability, whereas under the earlier
      wording a resource-shock-type scenario's conflict intensity could rise to its maximum while
      social_stability stayed completely unchanged throughout, see the conflict_toll description.
    step_unit: day
    condition: geopolitical_tension > 50
    dynamics:
      conflict_intensity: "min(10, conflict_intensity + (geopolitical_tension - 50) * 0.1 / 30 * step)"
    priority: 5

  # F1b: Conflict toll (added 2026-07-06, fixing the inconsistency where "the resource-desperation
  # path escalates to full conflict intensity but depletes no social stability" — see the finding
  # noted in the escalation_dynamics description)
  conflict_toll:
    description: "Conflict intensity depletes social stability regardless of its cause, whether the security-dilemma path or the resource-desperation path, taking effect whenever conflict intensity>0"
    step_unit: day
    condition: conflict_intensity > 0
    dynamics:
      social_stability: "max(0, social_stability - conflict_intensity * 2 / 30 * step)"
    priority: 5

  # F2: De-escalation
  de_escalation:
    description: >
      Diplomacy lowers tension, with the effect modulated by institutional reversibility: once
      reversibility has eroded, the same diplomatic investment's cooling effect weakens. Changed
      from a monthly to a daily step on 2026-07-06, with the literal coefficient divided by 30 (see
      the escalation_dynamics description).
    step_unit: day
    condition: diplomatic_talks > 0
    dynamics:
      geopolitical_tension: "max(0, geopolitical_tension - diplomatic_talks * 5 / 30 * (institutional_reversibility / 100) * step)"
    priority: 5

  # F3: War Economy
  resource_drain:
    description: "Resource depletion caused by conflict. Changed from a monthly to a daily step on 2026-07-06, with the literal coefficient divided by 30."
    step_unit: day
    condition: conflict_intensity > 2
    dynamics:
      resource_scarcity: "min(100, resource_scarcity + conflict_intensity * 3 / 30 * step)"
    priority: 3

  # F4: External shock (added 2026-07-06)
  resource_shock_dynamics:
    description: "An exogenous resource shock (embargo/supply cutoff) directly raises resource scarcity, executing before the institutional-reversibility erosion equation; contains no step, so step_unit need not be declared."
    dynamics:
      resource_scarcity: "min(100, resource_scarcity + resource_shock)"
    priority: 9
    reference: "A calibrated choice; the specific historical anchor is kept in internal records (outside this reference component's public scope)"

  # F5: Institutional brake erosion (added 2026-07-06)
  reversibility_decay:
    description: >
      Institutional-reversibility erosion: defense spending (sunk cost) and resource scarcity
      (countdown pressure) jointly erode reversibility, with diplomatic negotiation offering only a
      weak recovery effect (representing a partial repair of political space, not an instant reset).
      A daily step, with the literal coefficient divided by 30 (a type-A state-independent flux
      term).
    step_unit: day
    dynamics:
      institutional_reversibility: >
        max(0, min(100, institutional_reversibility
          - (k_reversibility_defense * defense_spending + k_reversibility_scarcity * resource_scarcity * 0.01) / 30 * step
          + 0.02 * diplomatic_talks / 30 * step))
    priority: 8
    reference: "The mechanism is based on Sleesman et al. (2012) Acad Manag J 55(3):541-562; the coefficient is a calibrated choice, see the variable's TODO:SOURCE"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  output_variables: [geopolitical_tension, conflict_intensity, social_stability, resource_scarcity, institutional_reversibility]

optimization:
  method: nsga2
  objectives:
    - variable: social_stability
      metric: final
      direction: maximize
    - variable: conflict_intensity
      metric: final
      direction: minimize
  constraints:
    - variable: resource_scarcity
      condition: "<= 80"
      type: soft
      description: "Resource scarcity should not exceed 80 (preventing societal collapse)"
  startpoint:
    regimens:
      - variable: diplomatic_talks
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Diplomatic-negotiation intensity (0=none, 1=full effort)"
        optimize:
          value: [0, 1]
      - variable: defense_spending
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Defense spending (0=cut, 1=substantially increased)"
        optimize:
          value: [0, 1]
      - variable: propaganda_campaign
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Propaganda-campaign intensity (0=none, 1=high intensity)"
        optimize:
          value: [0, 1]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - "Richardson LF (1960) Arms and Insecurity. Boxwood Press & Quadrangle Books, Pittsburgh."
  - "Goldstein JS (1992) A conflict-cooperation scale for WEIS events data. J Confl Resolut 36(2):369-385."
  - "Collier P & Hoeffler A (2004) Greed and grievance in civil war. Oxford Econ Pap 56(4):563-595."
  - "Fearon JD & Laitin DD (2003) Ethnicity, insurgency, and civil war. Am Polit Sci Rev 97(1):75-90."
  - "Stockholm International Peace Research Institute (SIPRI) Yearbook 2023. SIPRI, Stockholm."
  - "Wallace MD (1979) Arms races and escalation: some new evidence. J Confl Resolut 23(1):3-23."
  - "Diehl PF (1983) Arms races and escalation: a closer look. J Peace Res 20(3):205-212."
  - "Sleesman DJ, Conlon DE, McNamara G, Miles JE (2012) Cleaning up the big muddy: a meta-analytic review of the determinants of escalation of commitment. Acad Manag J 55(3):541-562."
  - "Singer JD, Bremer S, Stuckey J (1972) Capability Distribution, Uncertainty, and Major Power War, 1820-1965. Correlates of War Project, National Material Capabilities (NMC) dataset v6.0, correlatesofwar.org."
