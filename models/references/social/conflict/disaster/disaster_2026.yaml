metadata:
  name: disaster
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      A natural disaster's, such as an earthquake, flood, or hurricane, acute response dynamics
      are characterized by three state variables, hazard intensity, infrastructure damage, and
      population safety, based on the Sendai Framework's disaster-reduction logic: the competition
      between how quickly rescue resources arrive and how quickly damage spreads determines
      casualties. The first 72 hours are the golden rescue window (Guha-Sapir 2016), and delayed
      rescue and misallocated rescue resources form a genuine decision-optimization problem.
    result: >
      Simulating the 72-hour response to a magnitude-7 earthquake is expected to show the contrast
      between rising post-disaster damage and population safety recovering once rescue resources
      arrive; the simulation has not been run yet.
    limitations: >
      The spatial propagation of the disaster's expanding front is not included; the specific
      dynamics of earthquake, flood, and hurricane are not distinguished; parameters come from
      typical earthquake research and must be calibrated for the specific disaster type.
  ratings:
    importance: 0.75 - Disaster-response dynamics are a core topic in global public-safety research, and the Sendai Framework is an international standard; a general-purpose disaster-scenario component, expected moderate citation from historical/disaster scenarios
    variable: 0.5 - Cites authoritative sources such as the Sendai Framework/FEMA, but the model parameters are fairly sparse
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - Confirmed on 2026-07-27 that --sim/--opt both run normally (--opt reaches 100% feasibility by generation 1), the nosim/noopt markers have been cleared, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed on 2026-07-27 that --sim/--opt both run normally (--opt reaches 100% feasibility by generation 1), the nosim/noopt markers have been cleared, but not yet compared against an independent literature target value
  tags: [disaster, earthquake, emergency_response, Sendai_framework, risk]
variables:
  hazard_intensity:
    description: Hazard intensity
    value: 0
    unit: level
    type: state
    bounds:
      - 0
      - 10
  damage_index:
    description: The infrastructure-damage index
    value: 0
    unit: score
    type: state
    bounds:
      - 0
      - 100
  population_safety:
    description: The population-safety score
    value: 100
    unit: score
    type: state
    bounds:
      - 0
      - 100
  rescue_progress:
    description: Rescue-operation progress
    value: 0
    unit: '%'
    type: state
    bounds:
      - 0
      - 100
  supplies_delivery:
    description: Supply delivery
    value: 0
    unit: tons
    type: input
  evacuation_order:
    description: Evacuation-order intensity
    value: 0
    unit: level
    type: input
  infrastructure_repair:
    description: Repair investment
    value: 0
    unit: 10k
    type: input
equations:
  damage_dynamics:
    description: The disaster causes damage
    step_unit: hour
    condition: hazard_intensity > 3
    dynamics:
      damage_index: min(100, damage_index + (hazard_intensity - 3) * 5 * step)
      population_safety: max(0, population_safety - hazard_intensity * 2 * step)
    priority: 5
  rescue_dynamics:
    description: Rescue raises safety and repairs infrastructure
    step_unit: hour
    condition: supplies_delivery > 0
    dynamics:
      rescue_progress: min(100, rescue_progress + supplies_delivery * 0.5 * step)
      population_safety: min(100, population_safety + supplies_delivery * 0.2 * step)
    priority: 5
  repair_dynamics:
    description: Post-disaster reconstruction
    step_unit: hour
    condition: infrastructure_repair > 0 and hazard_intensity < 5
    dynamics:
      damage_index: max(0, damage_index - infrastructure_repair * 0.1 * step)
    priority: 3
simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-01-01"
  end_date: "2026-01-03"
  output_variables:
    - damage_index
    - population_safety
    - rescue_progress

optimization:
  method: nsga2
  objectives:
    - variable: population_safety
      metric: final
      direction: maximize
    - variable: rescue_progress
      metric: final
      direction: maximize
  constraints:
    - variable: damage_index
      condition: "<= 0.8"
      type: soft
      description: "Keep the disaster-damage index within 0.8"
  startpoint:
    regimens:
      - variable: supplies_delivery
        time_start: "06:00"
        time_end: "06:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Supply delivery (0=none, 1=full capacity)"
        optimize:
          value: [0, 1]
      - variable: evacuation_order
        time_start: "06:00"
        time_end: "06:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Evacuation-order intensity (0=no evacuation, 1=mandatory evacuation)"
        optimize:
          value: [0, 1]
      - variable: infrastructure_repair
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Infrastructure-repair effort (0=none, 1=full-effort repair)"
        optimize:
          value: [0, 1]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - "UNDRR (2015) Sendai Framework for Disaster Risk Reduction 2015-2030. United Nations, Geneva."
  - "Quarantelli EL (2005) Catastrophes are different from disasters. Social Science Research Council, New York."
  - "FEMA (2019) National Response Framework, 4th edition. US Department of Homeland Security."
  - "Guha-Sapir D et al. (2016) Annual Disaster Statistical Review 2015. CRED, Brussels."
  - "De Groeve T et al. (2013) Global Disaster Alert and Coordination System. JRC Technical Report EUR 25929."
