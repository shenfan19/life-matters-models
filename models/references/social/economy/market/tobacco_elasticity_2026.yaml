category: socio_economic

metadata:
  name: tobacco_elasticity
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      Validation purpose: a cross-disciplinary extension into public-health economics. Cigarette
      price elasticity is one of the economics effect sizes measured independently the most times,
      with the Gallet & List (2003) meta-analysis of 523 studies, IARC (2011), Chaloupka & Warner
      (2000), and other independent meta-analyses all converging on a short-run consensus value of
      about -0.4, with short-run elasticity systematically smaller in magnitude than long-run
      elasticity, about -0.44 in the long run, a stable structural fact repeatedly independently
      reproduced, not an isolated number from a single study.
    result: |
      This declares the short-run and long-run elasticity coefficients separately using the beta
      subtype in the LM format's evidence block, substituting the same price increase, to show the
      difference in predicted consumption decline between the two, verifying that the loader
      correctly carries and distinguishes these two effect sizes for the same phenomenon at
      different timescales.
    limitations: |
      This case, like education_classsize, demonstrates the correctness of effect-size encoding,
      not an independent prediction test, and -0.4 and -0.44 are themselves the target numbers being
      verified, not values extrapolated and then compared against a separate independent source. The
      literature gives no single directly reusable number for the specific adjustment speed between
      short-run and long-run, that is, how long it takes to transition from the short-run to the
      long-run elasticity, and this file does not model that transition process, only demonstrating
      the static prediction of each endpoint elasticity separately.
  ratings:
    importance: 0.25 - A methodology-validation demonstration, usable as a demand-response submodel for public-health-policy/taxation scenarios
    variable: 1.0 - Multiple independent meta-analyses converge on the same consensus value, the highest evidence quality among all cases in this library
    equation: 1.0 - The evidence_type conversion is a standard mechanism defined by the LM format specification, not a self-built structure
    simulation: 0.5 - The correctness of the effect-size encoding has been verified and demonstrated, but this is explicitly not an independent prediction test, a form of circular verification
    optimization: 0.0 - This file contains no optimization block, being a pure effect-size encoding demonstration with no decision variables
    confidence: 0.75 - The effect size itself comes from a high-quality independent source (a consensus value across multiple converging meta-analyses), and the loader's correct encoding is demonstrated; that this is not an independent prediction is noted in the rationale
  tags: [economics, public-health, tobacco, elasticity, evidence, validation, literature-benchmark, cross-domain]

variables:
  price_increase_pct:
    description: The cigarette price increase (%), an illustrative scenario value
    value: 20.0
    unit: "%"
    type: parameter

  consumption_change_shortrun_pct:
    description: The predicted short-run (within about 1 year) consumption change (%)
    value: 0.0
    unit: "%"
    type: state

  consumption_change_longrun_pct:
    description: The predicted long-run consumption change (%)
    value: 0.0
    unit: "%"
    type: state

  elasticity_shortrun:
    type: parameter
    evidence_type: beta
    value: -0.40
    unit: "% quantity change per % price change"
    description: The consensus short-run price elasticity of cigarette demand (converging across multiple independent meta-analyses, about -0.4)
    reference: "Gallet & List (2003); Chaloupka & Warner (2000); IARC (2011)"

  elasticity_longrun:
    type: parameter
    evidence_type: beta
    value: -0.44
    unit: "% quantity change per % price change"
    description: The consensus long-run price elasticity of cigarette demand (slightly larger in magnitude than the short run; Gallet & List 2003 reports -0.44)
    reference: "Gallet & List (2003)"

equations:
  shortrun_calc:
    description: "A static calculation: the short-run consumption change = the short-run elasticity x the price increase"
    condition: true
    priority: 4
    dynamics:
      consumption_change_shortrun_pct: "elasticity_shortrun * price_increase_pct"

  longrun_calc:
    description: "A static calculation: the long-run consumption change = the long-run elasticity x the price increase"
    condition: true
    priority: 3
    dynamics:
      consumption_change_longrun_pct: "elasticity_longrun * price_increase_pct"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables:
    - price_increase_pct
    - consumption_change_shortrun_pct
    - consumption_change_longrun_pct
  plans:
    - id: "price_increase_20pct"
      label: "The short-run/long-run consumption response to a 20% cigarette price increase"
      regimens: []

references:
  - "Gallet CA, List JA (2003) Cigarette demand: a meta-analysis of elasticities. Health Econ 12(10):821-835"
  - "Chaloupka FJ, Warner KE (2000) The economics of smoking. Handbook of Health Economics 1B:1539-1627"
  - "IARC (2011) Effectiveness of Tax and Price Policies for Tobacco Control. IARC Handbooks of Cancer Prevention, Vol 14"
