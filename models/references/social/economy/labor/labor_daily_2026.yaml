      issue: "Lacks sufficient literature citation support (migrated from the old filename's _noref suffix)"
      evidence: "Migrated from the legacy _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check and supply the missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: labor
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      A day-scale tradeoff between labor, savings, and fatigue: more work hours raise income but
      accumulate fatigue, while rest recovers fatigue but stops income, and the optimal work-and-rest
      timing cannot be given by intuition alone. This component supplies a minimal daily economic
      base layer for historical, literary, or economic scenarios.
    result: >
      The simulation is expected to show savings growing during work periods within a day and
      fatigue oscillating in a sawtooth pattern as work and rest alternate; the simulation has not
      been run yet, and this file is a demonstration component.
    limitations: A minimalist demonstration model whose parameters have no literature source; inflation, skill accumulation, and social security are not modeled, and it is not suited to long-timescale analysis.
  ratings:
    importance: 0.25 - The labor-savings-fatigue daily model is a scenario-driven base component intended mainly for demonstration; noref, mainly for demonstration, expected very low reuse within the framework
    variable: 0.25 - noref marker, parameters lack a literature source, a minimalist demonstration model
    equation: 0.25 - Parameters lack a literature source, the equation is a qualitative approximation with no independent reproduction
    simulation: 0.5 - No blocking todo found, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - No blocking todo found, but not yet compared against an independent literature target value
  tags: [economic, social, labor]

variables:
  savings: {description: "Personal savings", value: 500, unit: "yuan", type: state, bounds: [0, 1000000]}
  fatigue: {description: "Fatigue level", value: 0, unit: "score", type: state, bounds: [0, 100]}
  work_intensity: {description: "Work intensity", value: 0.0, unit: "coefficient", type: input, bounds: [0, 1]}
  hourly_wage: {description: "Hourly wage", value: 50, unit: "yuan/h", type: parameter}

equations:
  earning:
    description: "Labor income: savings rise with work intensity and hourly wage"
    step_unit: hour
    condition: work_intensity > 0
    dynamics:
      savings: "savings + work_intensity * hourly_wage * (step / 3600)"
      fatigue: "fatigue + work_intensity * 10 * (step / 3600)"
    priority: 7

  resting:
    description: "Natural recovery: fatigue declines slowly during non-work time"
    step_unit: hour
    condition: work_intensity == 0
    dynamics:
      fatigue: "fatigue - 2 * (step / 3600)"
    priority: 5

regimens:
  work_intensity:
    interpolation: step
    points:
      - {time: 0, value: 0.0}        # 00:00 (Sleeping)
      - {time: 32400, value: 1.0}    # 09:00 (Start Work)
      - {time: 43200, value: 0.2}    # 12:00 (Lunch Break)
      - {time: 46800, value: 1.0}    # 13:00 (Resume Work)
      - {time: 61200, value: 0.0}    # 17:00 (Off Work)
      - {time: 86400, value: 0.0}    # END

simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [savings, fatigue, work_intensity]

optimization:
  method: nsga2
  objectives:
    - variable: savings
      metric: final
      direction: maximize
    - variable: fatigue
      metric: final
      direction: minimize
  startpoint:
    regimens:
      - variable: work_intensity
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Work intensity (0=not working, 1=high intensity)"
        optimize:
          value: [0, 1]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
