      next: "核查并补充缺失的文献引用，或确认现有引用已足够后移除该 todo 项。"
  name: labor
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      劳动-储蓄-疲劳的日尺度权衡：工作时间增加收入但积累疲劳，休息恢复疲劳但停止收入，最优的工作和休息时序无法凭直觉给出。该组件为历史、文学或经济场景提供最简化的日经济基础层。
    result: >
      仿真预期呈现一日内储蓄随工作时段增长、疲劳在工作和休息交替下的锯齿形波动，仿真尚未运行，本文件为演示组件。
    limitations: 极简演示模型，参数无文献来源；未建模通货膨胀、技能积累或社会保障，不适合长时间尺度分析。
  ratings:
    validation_confidence: 2 - 未发现阻断性todo，但未与独立文献目标数值比对
    topic_importance: 3 - 劳动-储蓄-疲劳日模型是场景驱动的基础组件，演示价值为主
    framework_demand: 1 - noref，演示价值为主，框架复用预期极低
    evidence_quality: 2 - noref标记，参数无文献来源，为极简演示模型
    popularity: 2 - 日步长劳动模型较简单，不属于劳动经济学主流基准
  tags: [economic, social, labor]

variables:
  savings: {description: "个人储蓄", value: 500, unit: "元", type: state, bounds: [0, 1000000]}
  fatigue: {description: "疲劳度", value: 0, unit: "分", type: state, bounds: [0, 100]}
  work_intensity: {description: "工作强度", value: 0.0, unit: "系数", type: input, bounds: [0, 1]}
  hourly_wage: {description: "时薪", value: 50, unit: "元/h", type: parameter}

equations:
  earning:
    description: "劳动所得：根据工作强度和时薪增加储蓄"
    step_unit: hour
    condition: work_intensity > 0
    dynamics:
      savings: "savings + work_intensity * hourly_wage * (step / 3600)"
      fatigue: "fatigue + work_intensity * 10 * (step / 3600)"
    priority: 7

  resting:
    description: "自然恢复：非工作时间疲劳度缓慢下降"
    step_unit: hour
    condition: work_intensity == 0
    dynamics:
      fatigue: "fatigue - 2 * (step / 3600)"
    priority: 5

regimens:
  work_intensity:
    interpolation: step
    points:
      - {time: 0, value: 0.0}        # 00:00 (Sleeping)
      - {time: 32400, value: 1.0}    # 09:00 (Start Work)
      - {time: 43200, value: 0.2}    # 12:00 (Lunch Break)
      - {time: 46800, value: 1.0}    # 13:00 (Resume Work)
      - {time: 61200, value: 0.0}    # 17:00 (Off Work)
      - {time: 86400, value: 0.0}    # END

simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables: [savings, fatigue, work_intensity]

optimizer:
  method: nsga2
  objectives:
    - variable: savings
      metric: final
      direction: maximize
    - variable: fatigue
      metric: final
      direction: minimize
  startpoint:
    regimens:
      - variable: work_intensity
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "劳动强度（0=不工作，1=高强度）"
        optimize:
          value: [0, 1]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
