metadata:
  name: labor
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      效率工资理论（Shapiro & Stiglitz 1984）指出高疲劳直接降低生产力，而 Becker（1964）的人力资本理论表明技能培训提升长期时薪但有短期机会成本。劳动者面临跨期权衡：超时工作储蓄快但健康受损，适度工作加技能投资长期收益高但短期收入低，最优的加班策略和培训时机依赖于对疲劳积累速率的量化判断。
    result: >
      三方案仿真已用 --sim 验证，分别是均衡工作制、高强度加班和技能投资，年末存款与疲劳分层清晰：高强度加班方案存款最高但疲劳也最高，技能投资方案短期存款最低，原因是培训扣款加上无加班收入，但生产力系数持续提升，均衡方案居中，验证了超时工作换收入与适度工作加技能投资这一跨期权衡的方向性机制。优化已用 --opt 验证，NSGA-II 算法给出 7 个解，给出年末存款与平均生产力的权衡前沿：加班时长收敛至每天 2.92 小时，休假收敛至周末完整休假，技能培训投入从每天 0 小时增至 4 小时，存款从 259378 元降至 251949 元，平均生产力从 1.0 升至 1.664，体现了培训挤占加班时间与培训费用相对长期生产力提升之间的跨期权衡。
    limitations: >
      未包含通货膨胀、失业风险和社会保障；个体差异，如技能初值和行业类型，通过参数调整；单个劳动者模型，不反映市场均衡和宏观动态。
  ratings:
    importance: 0.5 - 人力资本-效率工资-疲劳健康耦合是劳动经济学核心研究问题；劳动经济基础组件，被历史/职场场景引用预期中等
    variable: 0.75 - 引用Becker/Shapiro-Stiglitz经典文献及OECD数据，参数有据
    equation: 0.5 - 自建方程锚定文献机制方向，非独立复现的标准形式
    simulation: 0.5 - 未发现阻断性todo，但未与独立文献目标数值比对
    optimization: 0.5 - 决策变量搜索前沿方向合理，未独立验证是否退化
    confidence: 0.25 - 未发现阻断性todo，但未与独立文献目标数值比对
  tags: [labor, economics, human_capital, efficiency_wage, fatigue, savings]

variables:
  # R1: Labor Output
  work_load: {description: "工作负荷", value: 40, unit: "h/week", type: state, bounds: [0, 100]}
  productivity: {description: "生产力系数", value: 1.0, unit: "系数", type: state, bounds: [0.1, 2.0]}
  # R2: Economy
  income_rate: {description: "时薪收入", value: 20, unit: "元/h", type: state, bounds: [0, 1000]}
  savings: {description: "存款储蓄", value: 5000, unit: "元", type: state, bounds: [0, 1000000]}
  # R3: Physiological Cost
  fatigue_level: {description: "疲劳度", value: 0, unit: "分", type: state, bounds: [0, 100]}
  # P1: Inputs (Card Inputs)
  overtime_hours: {description: "加班时数", value: 0, unit: "h", type: input}
  vacation_days: {description: "休假天数", value: 0, unit: "d", type: input}
  skill_training: {description: "技能培训", value: 0, unit: "h", type: input}

equations:
  # F1: Economic Dynamics（原周速率÷7换算为日速率，1周=7天）
  money_dynamics:
    description: "日薪与支出计算（周速率÷7）"
    step_unit: day
    condition: true
    dynamics:
      savings: "savings + (work_load + overtime_hours) * income_rate * step - 142.86 * step"
    priority: 5

  # F2: Fatigue Dynamics
  fatigue_dynamics:
    description: "工作导致疲劳累积（周速率÷7）"
    step_unit: day
    condition: true
    dynamics:
      fatigue_level: "max(0, fatigue_level + (overtime_hours * 0.2857 - vacation_days * 1.4286) * step)"
    priority: 5

  # F3: Productivity Impact
  skill_dynamics:
    description: "培训提升生产力（周速率÷7）"
    step_unit: day
    condition: skill_training > 0
    dynamics:
      productivity: "min(2.0, productivity + skill_training * 0.001429 * step)"
      savings: "savings - skill_training * 7.143 * step"
    priority: 3

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  output_variables: [savings, fatigue_level, productivity]
  plans:
  - id: default
    label: "均衡工作制（标准工时+周末休假）"
    regimens:
    - variable: overtime_hours
      time_start: "18:00"
      value: 1.0
      days: [Mon, Tue, Wed, Thu, Fri]
      date_range: ["2026-01-01", "2026-12-31"]
      label: "每日加班1小时"
    - variable: vacation_days
      time_start: "09:00"
      value: 1.0
      days: [Sat, Sun]
      date_range: ["2026-01-01", "2026-12-31"]
      label: "周末完整休假"

  - id: overtime_grind
    label: "高强度加班（无休假，短期收入优先）"
    regimens:
    - variable: overtime_hours
      time_start: "18:00"
      value: 4.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-12-31"]
      label: "每日加班4小时，无休息日"

  - id: skill_investment
    label: "技能投资（短期收入让位于长期生产力）"
    regimens:
    - variable: skill_training
      time_start: "20:00"
      value: 3.0
      days: [Mon, Tue, Wed, Thu, Fri]
      date_range: ["2026-01-01", "2026-12-31"]
      label: "每日培训3小时"
    - variable: vacation_days
      time_start: "09:00"
      value: 1.0
      days: [Sat, Sun]
      date_range: ["2026-01-01", "2026-12-31"]
      label: "周末完整休假"

optimization:
  method: nsga2
  objectives:
    - variable: savings
      metric: final
      direction: maximize
    - variable: productivity
      metric: mean
      direction: maximize
  constraints:
    - variable: fatigue_level
      condition: "<= 70"
      type: hard
      description: >
        疲劳水平不超过70（fatigue_level量表为0-100；原阈值0.8与该量表不符，
        已按"多数models里70作为警戒阈值"的一致惯例改正）。
  startpoint:
    regimens:
      - variable: overtime_hours
        time_start: "18:00"
        time_end: "18:00"
        days: [Mon, Tue, Wed, Thu, Fri]
        label: "每日加班时长（小时）"
        optimize:
          value: [0, 4]
      - variable: vacation_days
        time_start: "09:00"
        time_end: "09:00"
        days: [Sat, Sun]
        label: "周末每日休假（0=照常工作，1=完整休假）"
        optimize:
          value: [0, 1]
      - variable: skill_training
        time_start: "20:00"
        time_end: "20:00"
        days: [Mon, Tue, Wed, Thu, Fri]
        label: "每日技能培训投入（小时）"
        optimize:
          value: [0, 4]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-07-06"
    method: nsga2
    n_solutions: 7
    elapsed_seconds: 33.7
    pareto_front:
      - {x: [2.92, 1.00, 4.00], f: [-251949.02, -1.664]}
      - {x: [2.92, 1.00, 3.21], f: [-253410.51, -1.582]}
      - {x: [2.92, 1.00, 2.46], f: [-254802.37, -1.458]}
      - {x: [2.92, 1.00, 1.82], f: [-255996.25, -1.339]}
      - {x: [2.92, 1.00, 1.12], f: [-257290.94, -1.209]}
      - {x: [2.92, 1.00, 0.48], f: [-258478.95, -1.090]}
      - {x: [2.92, 1.00, 0.00], f: [-259378.13, -1.000]}
    recommended:
      x: [2.92, 1.00, 1.82]
      f: [-255996.25, -1.339]

references:
  - "Becker GS (1964) Human Capital: A Theoretical and Empirical Analysis. Columbia University Press, New York."
  - "Shapiro C & Stiglitz JE (1984) Equilibrium unemployment as a worker discipline device. Am Econ Rev 74(3):433-444."
  - "OECD (2023) Hours Worked: Average annual hours actually worked per worker. OECD Employment Database."
  - "Kivimäki M et al. (2015) Long working hours and risk of coronary heart disease and stroke. Lancet 385(9972):1739-1746."
