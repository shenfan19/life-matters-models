metadata:
  name: labor
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Efficiency-wage theory (Shapiro & Stiglitz 1984) shows that high fatigue directly lowers
      productivity, while Becker's (1964) human-capital theory shows that skill training raises
      long-term hourly wages at a short-term opportunity cost. A worker faces an intertemporal
      tradeoff: overtime work builds savings quickly but damages health, while moderate work plus
      skill investment yields higher long-term returns at lower short-term income, and the optimal
      overtime strategy and training timing depend on a quantitative judgment of the fatigue
      accumulation rate.
    result: >
      Three arms, a balanced-work schedule, high-intensity overtime, and skill investment, have
      been verified with --sim, with year-end savings and fatigue clearly stratified: the
      high-intensity-overtime arm has the highest savings but also the highest fatigue, the
      skill-investment arm has the lowest short-term savings, because training deductions combine
      with no overtime income, but its productivity coefficient keeps rising, and the balanced arm
      falls in between, confirming the directional mechanism of the intertemporal tradeoff between
      overtime income and moderate work plus skill investment. The optimization has been verified
      with --opt, with the NSGA-II algorithm giving 7 solutions on a tradeoff front between year-end
      savings and average productivity: overtime hours converge to 2.92 hours/day, vacation
      converges to a full weekend off, skill-training investment rises from 0 to 4 hours/day, savings
      fall from 259378 yuan to 251949 yuan, and average productivity rises from 1.0 to 1.664,
      reflecting the intertemporal tradeoff between training crowding out overtime time and training
      cost against a longer-term productivity gain.
    limitations: >
      Inflation, unemployment risk, and social security are not included; individual differences,
      such as initial skill level and industry type, are handled through parameter adjustment; this
      is a single-worker model and does not reflect market equilibrium or macro dynamics.
  ratings:
    importance: 0.5 - The coupling of human capital, efficiency wages, and fatigue/health is a core labor-economics research question; a foundational labor-economics component, expected moderate citation from historical/workplace scenarios
    variable: 0.75 - Cites classic literature such as Becker/Shapiro-Stiglitz and OECD data, with documented parameters
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - No blocking todo found, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - No blocking todo found, but not yet compared against an independent literature target value
  tags: [labor, economics, human_capital, efficiency_wage, fatigue, savings]

variables:
  # R1: Labor Output
  work_load: {description: "Work load", value: 40, unit: "h/week", type: state, bounds: [0, 100]}
  productivity: {description: "The productivity coefficient", value: 1.0, unit: "coefficient", type: state, bounds: [0.1, 2.0]}
  # R2: Economy
  income_rate: {description: "Hourly income", value: 20, unit: "yuan/h", type: state, bounds: [0, 1000]}
  savings: {description: "Savings", value: 5000, unit: "yuan", type: state, bounds: [0, 1000000]}
  # R3: Physiological Cost
  fatigue_level: {description: "Fatigue level", value: 0, unit: "score", type: state, bounds: [0, 100]}
  # P1: Inputs (Card Inputs)
  overtime_hours: {description: "Overtime hours", value: 0, unit: "h", type: input}
  vacation_days: {description: "Vacation days", value: 0, unit: "d", type: input}
  skill_training: {description: "Skill training", value: 0, unit: "h", type: input}

equations:
  # F1: Economic Dynamics (the original weekly rate divided by 7 to convert to a daily rate, 1 week=7 days)
  money_dynamics:
    description: "Daily wage and expense calculation (weekly rate divided by 7)"
    step_unit: day
    condition: true
    dynamics:
      savings: "savings + (work_load + overtime_hours) * income_rate * step - 142.86 * step"
    priority: 5

  # F2: Fatigue Dynamics
  fatigue_dynamics:
    description: "Work accumulates fatigue (weekly rate divided by 7)"
    step_unit: day
    condition: true
    dynamics:
      fatigue_level: "max(0, fatigue_level + (overtime_hours * 0.2857 - vacation_days * 1.4286) * step)"
    priority: 5

  # F3: Productivity Impact
  skill_dynamics:
    description: "Training raises productivity (weekly rate divided by 7)"
    step_unit: day
    condition: skill_training > 0
    dynamics:
      productivity: "min(2.0, productivity + skill_training * 0.001429 * step)"
      savings: "savings - skill_training * 7.143 * step"
    priority: 3

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  output_variables: [savings, fatigue_level, productivity]
  plans:
  - id: default
    label: "A balanced work schedule (standard hours plus a weekend off)"
    regimens:
    - variable: overtime_hours
      time_start: "18:00"
      value: 1.0
      days: [Mon, Tue, Wed, Thu, Fri]
      date_range: ["2026-01-01", "2026-12-31"]
      label: "1 hour of overtime daily"
    - variable: vacation_days
      time_start: "09:00"
      value: 1.0
      days: [Sat, Sun]
      date_range: ["2026-01-01", "2026-12-31"]
      label: "A full weekend off"

  - id: overtime_grind
    label: "High-intensity overtime (no days off, short-term income priority)"
    regimens:
    - variable: overtime_hours
      time_start: "18:00"
      value: 4.0
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      date_range: ["2026-01-01", "2026-12-31"]
      label: "4 hours of overtime daily, no rest days"

  - id: skill_investment
    label: "Skill investment (short-term income yields to long-term productivity)"
    regimens:
    - variable: skill_training
      time_start: "20:00"
      value: 3.0
      days: [Mon, Tue, Wed, Thu, Fri]
      date_range: ["2026-01-01", "2026-12-31"]
      label: "3 hours of training daily"
    - variable: vacation_days
      time_start: "09:00"
      value: 1.0
      days: [Sat, Sun]
      date_range: ["2026-01-01", "2026-12-31"]
      label: "A full weekend off"

optimization:
  method: nsga2
  objectives:
    - variable: savings
      metric: final
      direction: maximize
    - variable: productivity
      metric: mean
      direction: maximize
  constraints:
    - variable: fatigue_level
      condition: "<= 70"
      type: hard
      description: >
        Fatigue should not exceed 70 (the fatigue_level scale is 0-100; the original threshold of
        0.8 did not match this scale, and has been corrected following the common convention across
        most models of using 70 as the warning threshold).
  startpoint:
    regimens:
      - variable: overtime_hours
        time_start: "18:00"
        time_end: "18:00"
        days: [Mon, Tue, Wed, Thu, Fri]
        label: "Daily overtime duration (hours)"
        optimize:
          value: [0, 4]
      - variable: vacation_days
        time_start: "09:00"
        time_end: "09:00"
        days: [Sat, Sun]
        label: "Daily weekend rest (0=working as usual, 1=fully off)"
        optimize:
          value: [0, 1]
      - variable: skill_training
        time_start: "20:00"
        time_end: "20:00"
        days: [Mon, Tue, Wed, Thu, Fri]
        label: "Daily skill-training investment (hours)"
        optimize:
          value: [0, 4]
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
  results:
    generated_at: "2026-07-06"
    method: nsga2
    n_solutions: 7
    elapsed_seconds: 33.7
    pareto_front:
      - {x: [2.92, 1.00, 4.00], f: [-251949.02, -1.664]}
      - {x: [2.92, 1.00, 3.21], f: [-253410.51, -1.582]}
      - {x: [2.92, 1.00, 2.46], f: [-254802.37, -1.458]}
      - {x: [2.92, 1.00, 1.82], f: [-255996.25, -1.339]}
      - {x: [2.92, 1.00, 1.12], f: [-257290.94, -1.209]}
      - {x: [2.92, 1.00, 0.48], f: [-258478.95, -1.090]}
      - {x: [2.92, 1.00, 0.00], f: [-259378.13, -1.000]}
    recommended:
      x: [2.92, 1.00, 1.82]
      f: [-255996.25, -1.339]

references:
  - "Becker GS (1964) Human Capital: A Theoretical and Empirical Analysis. Columbia University Press, New York."
  - "Shapiro C & Stiglitz JE (1984) Equilibrium unemployment as a worker discipline device. Am Econ Rev 74(3):433-444."
  - "OECD (2023) Hours Worked: Average annual hours actually worked per worker. OECD Employment Database."
  - "Kivimäki M et al. (2015) Long working hours and risk of coronary heart disease and stroke. Lancet 385(9972):1739-1746."
