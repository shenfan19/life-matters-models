category: socio_economic

metadata:
  name: class_size
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      Validation purpose: a cross-disciplinary extension into education. The Tennessee STAR
      (Student Teacher Achievement Ratio) experiment is one of the most frequently cited randomized
      controlled trials in the economics of education: kindergarten students were randomly assigned
      to a small class of about 15 students or a regular class of about 22 students, testing the
      causal effect of class size on standardized test scores.
    result: |
      A class-size reduction of 7 to 8 students, about 32%, corresponds to a standardized-test-
      score improvement of about a 0.22 standard-deviation Cohen's d effect size, from Krueger's
      1999 analysis. This file declares this effect size directly using the cohens_d subtype in the
      LM format's evidence block, verifying that the loader correctly carries and displays the
      effect size of this landmark education-economics experiment.
    limitations: |
      This case demonstrates the correctness of effect-size encoding, not an independent prediction
      test, unlike statin_ldl or epoc_recovery which have an independent data point outside the fit
      to compare against; the number 0.22 is itself the target being verified, not a value
      extrapolated and then compared against a separate independent source. population_sd is set to
      1.0 by the convention that the output variable itself is already in standard-deviation units,
      and is not converted to the raw-score units of any specific test scale.
  ratings:
    importance: 0.25 - A methodology-validation demonstration, the first case under the social/education category
    variable: 1.0 - Tennessee STAR is a landmark randomized controlled trial in education economics, directly traceable to the literature
    equation: 1.0 - The evidence_type conversion is a standard mechanism defined by the LM format specification, not a self-built structure
    simulation: 0.5 - The correctness of the effect-size encoding has been verified and demonstrated, but this is explicitly not an independent prediction test, a form of circular verification
    optimization: 0.0 - This file contains no optimization block, being a pure effect-size encoding demonstration with no decision variables
    confidence: 0.75 - The effect size itself comes from a high-quality independent source (the Tennessee STAR RCT), and the loader's correct encoding is demonstrated; that this is not an independent prediction is noted in the rationale
  tags: [education, class-size, evidence, validation, literature-benchmark, cross-domain]

variables:
  test_score_gain_sd:
    description: The standardized-test-score improvement corresponding to a 7-8 student class-size reduction (in SD units)
    value: 0.0
    unit: SD
    type: state

  class_size_effect:
    type: parameter
    evidence_type: cohens_d
    value: 0.22
    population_sd: 1.0
    unit: SD
    description: >
      The Tennessee STAR experiment: the effect size of the standardized-test-score difference
      between kindergarten students in a small class (~15) versus a regular class (~22)
      (Krueger 1999 analysis). population_sd=1.0 directly reflects the convention that the output
      variable itself is already in SD units.
    reference: "Krueger AB (1999) Q J Econ 114(2):497-532"

equations:
  display_effect:
    description: "A static demonstration: test_score_gain_sd = class_size_effect (for the cohens_d type: the effective value equals value times population_sd)"
    condition: true
    priority: 3
    dynamics:
      test_score_gain_sd: "class_size_effect"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables:
    - test_score_gain_sd
  plans:
    - id: "small_class_vs_regular"
      label: "Small class (~15) versus regular class (~22) effect-size demonstration"
      regimens: []

references:
  - "Krueger AB (1999) Experimental Estimates of Education Production Functions. Q J Econ 114(2):497-532"
  - "Finn JD, Achilles CM (1990) Answers and Questions About Class Size: A Statewide Experiment. Am Educ Res J 27(3):557-577"
