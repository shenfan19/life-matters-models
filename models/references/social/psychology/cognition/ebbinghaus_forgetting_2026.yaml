category: socio_economic

metadata:
  name: ebbinghaus_forgetting
  lm_format_version: "1.0"
  updated: 2026-07-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: |
      Validation purpose: a cross-disciplinary extension into psychology. Ebbinghaus (1885) used
      the "savings method" to measure his own memory-savings rate after learning lists of nonsense
      syllables, at seven time points, 20 minutes, 1 hour, 9 hours, 1 day, 2 days, 6 days, and 31
      days, the earliest quantitative memory-forgetting curve in the history of psychology. Murre &
      Dros (2015, PLOS ONE) independently replicated this experimental protocol with modern
      subjects, and the 130-years-later replication data offers a rare opportunity to test whether a
      forgetting curve fit to historical data can predict an independent modern sample.
    result: |
      A power-law forgetting curve, retention=A*(1+t/20min)^(-beta), is fit to Ebbinghaus's
      original 1885 seven data points, and substituting the time points from the Murre & Dros 2015
      replication experiment gives predictions that, compared with the 2015 independent measurements,
      agree best at the 1-day test point, predicting 32.2% against a measured 31.7%, a 1.5% error,
      with the remaining test points deviating by 15% to 48%, and the 31-day test point showing the
      largest deviation, which the Murre & Dros paper itself also flags as the most anomalous data
      point in that replication. The full time-point-by-time-point comparison table is in
      `ebbinghaus_forgetting_2026.md` in the same directory.
    limitations: |
      Ebbinghaus's original 1885 data comes from a self-experiment on one of his own subjects,
      a sample size of 1, and was never replicated across a large sample of individuals until 2015,
      which is the direct reason this case is classified as "cross-sample/cross-individual
      variability" rather than "a model structural error": a single individual's memory curve is not
      by itself sufficient to represent a population, and a systematic deviation appearing in another
      group of subjects 130 years later is expected, not a sign the fitted curve is wrong.
  ratings:
    importance: 0.25 - A foundational psychology model, usable as a memory/learning submodel in cross-disciplinary composite cases, not yet imported by a specific paper
    variable: 0.75 - Ebbinghaus 1885 is a foundational historical dataset in psychology, and Murre & Dros 2015 is a peer-reviewed independent replication
    equation: 0.5 - The author independently fit a power law to the historical data, not an independently reproduced standard equation form
    simulation: 0.5 - The 1-day test point agrees well (a 1.5% deviation), while most other test points deviate by 15-48%, correct in direction but with substantial magnitude deviation
    optimization: 0.0 - This file contains no optimization block and involves no decision variables
    confidence: 0.5 - A partial benchmark, the 1-day test point matches precisely, while the deviation at other test points stems from the 1885 original data's sample size of 1 and limited representativeness, as noted in the rationale
  tags: [psychology, memory, forgetting-curve, validation, literature-benchmark, cross-domain]

variables:
  time_since_learning:
    description: Time elapsed since learning (minutes), the direct accumulation of the simulation clock
    value: 0.0
    unit: minute
    type: state

  retention_pct:
    description: >
      The predicted memory-savings rate (%), computed from a power-law curve fit to Ebbinghaus
      1885's original seven data points, retention = retention_A*(1+t/20min)^(-retention_beta), a
      static algebraic equation, not an independent dynamics integral.
    value: 0.0
    unit: "%"
    type: state

  retention_A:
    description: The power-law fit coefficient (the author's least-squares fit to Ebbinghaus (1885)'s seven data points, not given directly by the literature)
    value: 0.5975
    unit: dimensionless
    type: parameter
    reference: "This file's author's power-law fit to Ebbinghaus (1885) data"

  retention_beta:
    description: The power-law fit exponent, fit the same way as retention_A
    value: 0.1442
    unit: dimensionless
    type: parameter
    reference: "This file's author's power-law fit to Ebbinghaus (1885) data"

equations:
  clock_tick:
    description: "Clock accumulation: time_since_learning tracks the minutes elapsed since learning step by step"
    step_unit: minute
    condition: true
    priority: 5
    dynamics:
      time_since_learning: "time_since_learning + step"

  retention_calc:
    description: "A static power-law calculation: retention_pct = A*(1+t/20)^(-beta), not integrated over time, just reading the current time_since_learning"
    condition: true
    priority: 3
    dynamics:
      retention_pct: "retention_A * (1.0 + time_since_learning / 20.0) ** (-retention_beta) * 100.0"

simulation:
  step_size:
    value: 10
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-02-02"
  output_variables:
    - time_since_learning
    - retention_pct
  plans:
    - id: "single_study_session"
      label: "Tracking the forgetting curve after a single study session (no input events, a purely clock-driven static curve evaluation)"
      regimens: []

references:
  - "Ebbinghaus H (1885) Über das Gedächtnis. Duncker & Humblot, Leipzig."
  - "Murre JMJ, Dros J (2015) Replication and Analysis of Ebbinghaus' Forgetting Curve. PLOS ONE 10(7):e0120644"
