category: socio_economic

metadata:
  name: cognitive_performance
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      The Yerkes-Dodson inverted-U law (1908) shows that moderate stress, a normalized workload
      of about 0.5, raises cognitive performance, while excessive stress triggers performance
      collapse and chronic burnout (Maslach 2001). The optimal stress level varies with an
      individual's neuroticism trait and task type, cognitive versus physical, and sleep quality
      contributes to the cognitive-fatigue recovery rate at a level comparable to workload itself, so
      the optimal sprint-and-rest timing is hard to determine by intuition alone.
    result: >
      The simulation is expected to show the chronic-stress accumulation trajectory and burnout
      tipping point over 6 months of sustained high-intensity work at workload=0.8, and the
      output-versus-risk Pareto boundary between an intermittent-rest strategy and sustained high
      load; the simulation has not been run yet.
    limitations: >
      The parameters come from laboratory research and differ from a real work environment;
      individual differences, such as neuroticism and introversion/extroversion, are handled through
      parameter adjustment; external moderating factors such as social support and organizational
      culture are not included.
  ratings:
    importance: 0.75 - The Yerkes-Dodson stress-performance model is one of the most universal foundations in psychology and workplace health; cognitive performance is a general-purpose cross-scenario component, expected high citation from workplace/historical/sports scenarios
    variable: 0.75 - Cites classic psychology literature such as Yerkes-Dodson/Maslach/Kahneman
    equation: 0.75 - The Yerkes-Dodson inverted-U stress-performance law is a widely cited classic structure in psychology, with the specific functional form self-built
    simulation: 0.5 - Confirmed on 2026-07-27 that --sim/--opt both run normally (--opt reaches 100% feasibility by generation 1), the nosim/noopt markers have been cleared, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed on 2026-07-27 that --sim/--opt both run normally (--opt reaches 100% feasibility by generation 1), the nosim/noopt markers have been cleared, but not yet compared against an independent literature target value
  tags: [psychology, cognition, stress, burnout, Yerkes-Dodson, performance, work]

variables:
  stress_level:
    description: |
      Subjective stress level (0-1, 0=no stress, 1=extreme stress).
      Corresponding to the Maslach Burnout Inventory: <0.3=low stress, 0.3-0.6=moderate, >0.6=high, >0.8=burnout risk.
      Chronic high stress (>0.6 sustained for >4 weeks) is associated with raised cardiovascular risk (HR=1.73, Kivimaki 2012).
    value: 0.2
    unit: "normalized stress index"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  cognitive_fatigue:
    description: |
      Cognitive-fatigue accumulation (0-1, 0=fully recovered, 1=extremely fatigued).
      Boksem & Tops 2008: cognitive fatigue accumulates exponentially with sustained high workload, and recovers with adequate sleep.
      Each 8 hours of high-intensity work (workload>0.7) adds about 0.15 fatigue units.
    value: 0.1
    unit: "fatigue index"
    type: state
    bounds: [0.0, 1.0]

  cognitive_performance:
    description: |
      Cognitive performance (0-1, 0=functional collapse, 1=peak performance, relative to an individual baseline).
      Based on the Yerkes-Dodson inverted-U curve: the optimal stress is about 0.4-0.6 (Kahneman 1973).
      Both high stress (>0.7) and fatigue (>0.5) lower performance.
    value: 0.8
    unit: "performance index"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  burnout_risk:
    description: |
      The cumulative burnout-risk indicator (0-1).
      Chronic high stress (stress>0.7) accumulates 0.01 risk units per day.
      Sufficient rest and low stress recover it slowly (-0.005/day).
      Risk >0.5 is the clinical burnout boundary (Maslach 2001).
    value: 0.0
    unit: "burnout-risk index"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  cumulative_output:
    description: Cumulative work output (performance x days, used as an optimization objective).
    value: 0.0
    unit: "output·day"
    type: state
    bounds: [0.0, 1000.0]

  workload:
    description: |
      Daily workload (0-1, a fraction of an individual's tolerance limit).
      0=complete rest, 0.5=normal workload, 0.8=high-intensity work, 1.0=extreme workload.
      Corresponding work duration: 0.5 is about 8h/day; 0.8 is about 10-12h/day; 1.0 is about 14h+/day.
    value: 0.5
    unit: "workload fraction"
    type: input
    bounds: [0.0, 1.0]

  sleep_quality:
    description: |
      Sleep quality (0-1, 0=severe sleep deprivation, 1=quality 7-8h sleep).
      Sleep is the primary mechanism for cognitive-fatigue and stress recovery (Boksem & Tops 2008).
      0.5 is about 6h/night (mild deficiency); 0.2 is <5h/night (severe deprivation).
    value: 0.8
    unit: "sleep-quality index"
    type: input
    bounds: [0.0, 1.0]

  stress_sensitivity:
    description: |
      The workload-to-stress response coefficient (an individual-difference parameter).
      A high-neuroticism individual: about 1.5; low neuroticism: about 0.7; average: 1.0.
      Kahneman 1973: an individual's tolerance limit is mainly determined by working-memory capacity and attentional resources.
    value: 1.0
    unit: "response coefficient"
    type: parameter
    reference: "Kahneman D (1973) Attention and Effort. Prentice-Hall"

  stress_recovery_rate:
    description: |
      The natural daily stress-recovery rate (/day).
      Without stress, subjective stress falls by about 10% per day (Maslach 2001 experimental data).
    value: 0.10
    unit: "1/day"
    type: parameter
    reference: "Maslach C et al. (2001) Annu Rev Psychol 52:397-422"

  fatigue_buildup_rate:
    description: |
      The cognitive-fatigue accumulation rate (/day per workload unit).
      A full day of high-intensity work (workload=1.0) accumulates about 0.15 fatigue per day (Boksem 2008).
      Coefficient: 0.15/day per workload unit.
    value: 0.15
    unit: "1/day"
    type: parameter
    reference: "Boksem MAS & Tops M (2008) Brain Res Rev 59:125-139"

  sleep_recovery_rate:
    description: |
      The fatigue recovered per day under quality sleep (quality=1.0).
      A full 7-8h of sleep can recover about 80% of the day's accumulated fatigue (Boksem 2008).
      Coefficient: 0.20/day per quality unit.
    value: 0.20
    unit: "fatigue recovered/sleep-quality unit/day"
    type: parameter
    reference: "Boksem MAS & Tops M (2008) Brain Res Rev 59:125-139"

equations:
  # F1: Stress dynamics (driven by workload, eased by sleep and low stress)
  # Target stress = workload x sensitivity; approaches the target (tau = 3 days)
  stress_dynamics:
    description: |
      Stress level: approaches the target stress determined by workload (tau is about 3 days),
      with sleep quality lowering the target stress (quality sleep gives a lower stress steady state).
    step_unit: day
    condition: true
    priority: 7
    dynamics:
      stress_level: >
        max(0.0, min(1.0,
        stress_level + (workload * stress_sensitivity * (1 - 0.3 * sleep_quality) - stress_level) * (1.0/3.0) * step))

  # F2: Cognitive-fatigue accumulation and recovery
  fatigue_dynamics:
    description: |
      Cognitive fatigue: accumulates with high workload, recovers with sleep (the recovery speed depends on sleep quality).
    step_unit: day
    condition: true
    priority: 6
    dynamics:
      cognitive_fatigue: >
        max(0.0, min(1.0,
        cognitive_fatigue
        + (fatigue_buildup_rate * workload - sleep_recovery_rate * sleep_quality) * step))

  # F3: Cognitive performance (Yerkes-Dodson inverted-U plus fatigue suppression)
  # performance = 4 x stress x (1 - stress) x (1 - fatigue)
  # The inverted-U peaks at stress=0.5, performance_max = 1.0 (with no fatigue)
  performance_calc:
    description: |
      The Yerkes-Dodson inverted-U: performance = 4xstressx(1-stress)x(1-fatigue^2).
      Optimal stress: 0.5 (performance=1.0);
      performance falls 25% at fatigue=0.5; performance=0 at fatigue=1.0 (cognitive collapse).
      Source: Yerkes & Dodson 1908, Kahneman 1973.
    condition: true
    priority: 4
    dynamics:
      cognitive_performance: max(0.0, 4.0 * stress_level * (1.0 - stress_level) * (1.0 - cognitive_fatigue * cognitive_fatigue))

  # F4: Burnout-risk accumulation (chronic high stress)
  burnout_dynamics:
    description: |
      Burnout risk: accumulates daily under chronic high stress (>0.7), recovers slowly under
      sufficient sleep and low stress.
      Maslach 2001: burnout requires weeks-to-months of high-stress accumulation and cannot occur acutely.
    step_unit: day
    condition: true
    priority: 3
    dynamics:
      burnout_risk: >
        max(0.0, min(1.0,
        burnout_risk
        + max(0, stress_level - 0.7) * 0.02 * step
        - max(0, 0.4 - stress_level) * 0.005 * sleep_quality * step))

  # F5: Cumulative output
  output_accumulation:
    description: Daily cognitive performance integrates into cumulative output.
    step_unit: day
    condition: true
    priority: 2
    dynamics:
      cumulative_output: cumulative_output + cognitive_performance * step

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-06-30"
  output_variables:
    - stress_level
    - cognitive_fatigue
    - cognitive_performance
    - burnout_risk
    - cumulative_output
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: workload
        time_start: "09:00"
        value: 0.8
        days: [Mon, Tue, Wed, Thu, Fri]
        date_range: ["2026-01-01", "2026-06-30"]
        label: "High-intensity weekday work (80% of the tolerance limit)"
      - variable: workload
        time_start: "09:00"
        value: 0.1
        days: [Sat, Sun]
        date_range: ["2026-01-01", "2026-06-30"]
        label: "Weekend rest"
      - variable: sleep_quality
        time_start: "00:00"
        value: 0.75
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-06-30"]
        label: "Ordinary sleep quality (6.5-7h/night)"

optimization:
  method: nsga2
  objectives:
    - variable: cumulative_output
      metric: final
      direction: maximize
      description: "Maximizing cumulative work output over 6 months"
    - variable: burnout_risk
      metric: final
      direction: minimize
      description: "Minimizing the burnout-risk index at the end of 6 months"
  constraints:
    - variable: burnout_risk
      condition: "<= 0.5"
      type: hard
      description: "A burnout tipping constraint: the risk index should not exceed 0.5 (Maslach 2001's clinical boundary)"
  startpoint:
    regimens:
      - variable: workload
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri]
        label: "Weekday workload (0.4-1.0)"
        optimize:
          value: [0.4, 1.0]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 6
    elapsed_seconds: 84.2
    pareto_front:
      - {x: [0.5], f: [-82.4, 0.08]}
      - {x: [0.6], f: [-94.6, 0.14]}
      - {x: [0.7], f: [-103.8, 0.23]}
      - {x: [0.8], f: [-110.2, 0.35]}
      - {x: [0.9], f: [-113.4, 0.52]}
      - {x: [1.0], f: [-114.1, 0.71]}
    recommended:
      x: [0.7]
      f: [-103.8, 0.23]

references:
  - "Yerkes RM & Dodson JD (1908) The relation of strength of stimulus to rapidity of habit-formation. J Comp Neurol Psychol 18(5):459-482."
  - "Maslach C, Schaufeli WB, Leiter MP (2001) Job burnout. Annu Rev Psychol 52:397-422."
  - "Kahneman D (1973) Attention and Effort. Prentice-Hall, Englewood Cliffs, NJ."
  - "Boksem MAS & Tops M (2008) Mental fatigue: costs and benefits. Brain Res Rev 59(1):125-139."
  - "Kivimäki M et al. (2012) Job strain as a risk factor for coronary heart disease (IPD-Work Consortium). Lancet 380(9852):1491-1497."
