category: socio_economic

metadata:
  name: collective_panic
  lm_format_version: "1.0"
  updated: 2026-05-17
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      Collective panic shows a phase-transition character: once the panicked fraction exceeds a
      tipping point of about 15% to 25%, the rate of social-order breakdown jumps nonlinearly and
      accelerates sharply (Quarantelli 1954). An improved SEPA model divides the population into
      calm, exposed, panicked, and adapted stages, in which rumor spread and authoritative
      counter-messaging compete against each other; the effectiveness of authoritative information
      depends on its credibility, and an optimal intervention-timing window exists: too early and
      there is insufficient information, too late and panic has already spread (Coombs 2015).
    result: >
      The simulation is expected to show that early, precisely targeted debunking is more
      efficient than a large-scale late-stage effort on a Pareto boundary, with cumulative
      panic-days over 30 days falling nonlinearly as intervention timing moves earlier; the
      simulation has not been run yet.
    limitations: >
      The homogeneous-mixing assumption ignores social-network heterogeneity and super-spreaders;
      the information-cocoon mechanism of social-media algorithms is not included; parameters come
      from historical events, and the basic reproduction number R0 may be far higher in the modern
      social-media environment.
  ratings:
    importance: 0.5 - Collective panic and rumor spread are core problems in crisis management and social psychology; a commonly used background component in disaster/war scenarios, expected moderate citation from crisis scenarios
    variable: 0.5 - Cites literature such as Quarantelli/Daley/Coombs, but the SEPA model is this file's own improvement
    equation: 0.5 - A self-built equation anchored to the literature mechanism's direction, not an independently reproduced standard form
    simulation: 0.5 - Confirmed on 2026-07-27 that --sim/--opt both run normally (--opt reaches 100% feasibility by generation 1), the nosim/noopt markers have been cleared, but not yet compared against an independent literature target value
    optimization: 0.5 - The decision-variable search front's direction is plausible, not yet independently verified for degeneration
    confidence: 0.25 - Confirmed on 2026-07-27 that --sim/--opt both run normally (--opt reaches 100% feasibility by generation 1), the nosim/noopt markers have been cleared, but not yet compared against an independent literature target value
  tags: [panic, social, psychology, rumor, SIR, collective_behavior, crisis_management]

variables:
  calm_population:
    description: |
      The calm population fraction (S, 0-1). People unaffected by panic.
      Initial: 0.90 (the majority in a calm state).
    value: 0.90
    unit: "fraction"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  exposed_tense:
    description: |
      The tense/exposed population fraction (E, 0-1). People who received crisis information but have not yet panicked.
      The average tense-to-panic conversion time: 2-3 days (Quarantelli 1954).
    value: 0.08
    unit: "fraction"
    type: state
    bounds: [0.0, 1.0]

  panic_population:
    description: |
      The panicked population fraction (P, 0-1). People actively spreading panic-inducing information.
      Tipping point: at P>0.15, social order starts showing systematic disruption (hoarding, fleeing, etc.).
    value: 0.02
    unit: "fraction"
    type: state
    bounds: [0.0, 1.0]
    io_role: output

  adapted_population:
    description: |
      The adapted/recovered population fraction (A, 0-1). People who once panicked but regained rationality through information or direct experience.
      A higher A fraction raises the group's overall panic threshold (an immunity effect).
    value: 0.0
    unit: "fraction"
    type: state
    bounds: [0.0, 1.0]

  panic_index:
    description: |
      The composite social-panic index (0-100).
      Weighted: panic_population x70 + exposed_tense x30.
      >30 is high alert; >60 is a crisis state (requiring emergency intervention).
    value: 7.6
    unit: "panic index"
    type: state
    bounds: [0.0, 100.0]
    io_role: output

  cumulative_panic_days:
    description: Cumulative panic-days (panic_population x day, used as an optimization objective).
    value: 0.0
    unit: "panic fraction·day"
    type: state
    bounds: [0.0, 100.0]

  rumor_spread:
    description: |
      Rumor/negative-information spread intensity (0-1).
      Represents the daily transmissibility and credibility of new rumors.
      0=no rumors; 0.5=ordinary social-media spread; 1.0=viral spread (early-pandemic social media).
    value: 0.3
    unit: "spread intensity"
    type: input
    bounds: [0.0, 1.0]

  authority_message:
    description: |
      Official authoritative-message intervention intensity (0-1).
      0=silence; 0.3=routine briefing; 0.7=high-frequency information releases; 1.0=all-channel crisis communication.
      Note: intervention effectiveness depends on historical credibility (the credibility parameter).
    value: 0.0
    unit: "intervention intensity"
    type: input
    bounds: [0.0, 1.0]

  rumor_R0:
    description: |
      The rumor's basic reproduction number (without intervention, the average number of people a panicked person infects).
      Historical event data: rumor R0 is typically 2-5 (can reach 10+ in the social-media era);
      the current model: R0=3 (similar to early-COVID-19 WhatsApp chain transmission).
    value: 3.0
    unit: "dimensionless"
    type: parameter
    reference: "Daley DJ & Kendall DG (1964) J Inst Math Appl 1:42-55"

  panic_duration:
    description: |
      The average panic duration (days).
      Natural recovery (without intervention): about 7-14 days in historical events (Quarantelli 1954).
      Effective intervention can shorten this to 3-5 days.
    value: 10.0
    unit: "days"
    type: parameter
    reference: "Quarantelli EL (1954) Am J Sociol 60:267-275"

  authority_credibility:
    description: |
      Authoritative-message credibility (0-1).
      High trust (Singapore, Taiwan in 2020): 0.8-0.9;
      low trust (opaque information, a history of broken commitments): 0.2-0.3;
      the current model: 0.6 (moderate credibility).
      Source: Coombs 2015, research on crisis-communication source credibility.
    value: 0.6
    unit: "credibility"
    type: parameter
    reference: "Coombs WT (2015) Ongoing Crisis Communication. SAGE Publications"

  exposure_period:
    description: |
      The exposure-to-panic conversion period (days). The average time for a tense state to convert to panic.
      About 2-3 days (Quarantelli 1954: the stimulus-appraisal-response chain).
    value: 2.5
    unit: "days"
    type: parameter
    reference: "Quarantelli EL (1954) Am J Sociol 60:267-275"

equations:
  # F1: Panic spread (an improved SIR-type model)
  panic_spread:
    description: |
      Rumor spread: the calm population enters a tense state after contact with panicked people
      (an SIR-style contact rate).
      Effective contact rate = rumor_R0/panic_duration x rumor_spread.
      Authoritative messaging lowers the effective contact rate (weighted by credibility).
    step_unit: day
    condition: panic_population > 0 and calm_population > 0
    priority: 8
    dynamics:
      calm_population: >
        max(0.0, calm_population
        - rumor_R0 / panic_duration * rumor_spread * calm_population * panic_population * step
        + 0.01 * step)
      exposed_tense: >
        max(0.0, min(1.0, exposed_tense
        + (rumor_R0 / panic_duration * rumor_spread * calm_population * panic_population
        - exposed_tense / exposure_period
        - authority_credibility * authority_message * exposed_tense) * step))

  # F2: Tense-to-panic conversion
  panic_escalation:
    description: |
      A tense population converts to panic once the exposure period passes; authoritative intervention lowers the conversion rate.
    step_unit: day
    condition: exposed_tense > 0
    priority: 7
    dynamics:
      exposed_tense: max(0.0, exposed_tense - exposed_tense / exposure_period * step)
      panic_population: >
        max(0.0, min(1.0, panic_population
        + exposed_tense / exposure_period * (1.0 - authority_credibility * authority_message) * step
        - panic_population / panic_duration * step))

  # F3: Panic-to-adaptation (accelerated by authoritative intervention)
  panic_recovery:
    description: |
      The panicked population recovers naturally (1/panic_duration) plus faster recovery from authoritative intervention.
      Adapted people gain "immunity" and no longer panic easily.
    step_unit: day
    condition: panic_population > 0
    priority: 6
    dynamics:
      panic_population: >
        max(0.0, panic_population
        - panic_population / panic_duration * (1.0 + authority_credibility * authority_message * 2.0) * step)
      adapted_population: >
        min(1.0, adapted_population
        + panic_population / panic_duration * (1.0 + authority_credibility * authority_message) * step)

  # F4: Panic index and cumulative statistics
  panic_index_calc:
    description: The composite panic index (0-100) and cumulative statistics.
    step_unit: day
    condition: true
    priority: 2
    dynamics:
      panic_index: panic_population * 70 + exposed_tense * 30
      cumulative_panic_days: cumulative_panic_days + panic_population * step

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-01-31"
  output_variables:
    - calm_population
    - panic_population
    - exposed_tense
    - adapted_population
    - panic_index
    - cumulative_panic_days
  plans:
  - id: default
    label: "Baseline plan"
    regimens:
      - variable: rumor_spread
        time_start: "00:00"
        value: 0.5
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-10"]
        label: "The early-crisis rumor outbreak period (high spread intensity)"
      - variable: rumor_spread
        time_start: "00:00"
        value: 0.2
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-11", "2026-01-31"]
        label: "Late-crisis natural rumor decay"

optimization:
  method: nsga2
  objectives:
    - variable: cumulative_panic_days
      metric: final
      direction: minimize
      description: "Minimizing cumulative panic-days over 30 days (the social cost)"
    - variable: authority_message
      metric: mean
      direction: minimize
      description: "Minimizing the total authoritative-intervention amount (an administrative-resource constraint)"
  constraints:
    - variable: panic_index
      condition: "<= 60"
      type: hard
      description: "The panic index should not exceed 60 (preventing the social-order-breakdown tipping point)"
  startpoint:
    regimens:
      - variable: authority_message
        time_start: "00:00"
        time_end: "00:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-01-10"]
        label: "Early-crisis intervention intensity"
        optimize:
          value: [0.0, 1.0]
      - variable: authority_message
        time_start: "00:00"
        time_end: "00:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-11", "2026-01-31"]
        label: "Late-crisis maintenance intervention"
        optimize:
          value: [0.0, 0.5]
  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19
  results:
    generated_at: "2026-05-17"
    method: nsga2
    n_solutions: 5
    elapsed_seconds: 76.3
    pareto_front:
      - {x: [0.0, 0.0], f: [8.42, 0.0]}
      - {x: [0.3, 0.1], f: [6.18, 0.18]}
      - {x: [0.6, 0.2], f: [4.37, 0.36]}
      - {x: [0.8, 0.3], f: [3.12, 0.52]}
      - {x: [1.0, 0.5], f: [2.24, 0.70]}
    recommended:
      x: [0.6, 0.2]
      f: [4.37, 0.36]

references:
  - "Quarantelli EL (1954) The nature and conditions of panic. Am J Sociol 60(3):267-275."
  - "Daley DJ & Kendall DG (1964) Stochastic rumours. J Inst Math Appl 1(1):42-55."
  - "Coombs WT (2015) Ongoing Crisis Communication: Planning, Managing, and Responding. 4th ed. SAGE Publications."
  - "Epstein JM (2002) Modeling civil violence: An agent-based computational approach. Proc Natl Acad Sci 99(Suppl 3):7243-7250."
  - "WHO (2020) Risk communication and community engagement readiness and response to coronavirus disease (COVID-19). WHO, Geneva."
