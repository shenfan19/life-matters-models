metadata:
  name: opinion_critical_mass
  lm_format_version: "1.0"
  version: "1.0.0"
  step_size:
    value: 1
    unit: day
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      A simple contagion-style diffusion model, such as logistic growth, converges monotonically
      to universal acceptance as long as any positive transmission rate exists, and cannot explain a
      repeatedly observed phenomenon: the same new norm or behavior can stay stalled for a long time
      while support remains low, yet once support crosses a certain tipping point, it can spread
      rapidly to a majority in a short time. This component explicitly models the population fraction
      holding a given position, corresponding to the opinion_support_share field, as a bistable
      dynamical state rather than monotonic diffusion, using an unstable fixed point to express
      "critical mass" itself: below this point the state spontaneously decays back to the original
      state, above it the state is pushed toward the new norm.
    method: >
      The core mechanism is a cubic-form bistable ordinary differential equation with an unstable
      fixed point at critical_mass_threshold; the experimental basis for this functional form and
      fixed-point location comes from Centola et al.'s (2018) controlled experiments on small-group
      social-convention change: when the proportion of a committed minority pushing for change falls
      below about 25%, the group ultimately reverts to the original convention; once the proportion
      reaches about 25%, a sudden shift in group dynamics occurs, with the majority switching to the
      new convention within a short time. This component additionally introduces an exogenous push
      force, advocacy_push, representing the direct push on support share from external events such
      as media coverage, elite statements, and legal rulings, and a resulting political backlash,
      polarization_backlash, representing the resistant counter-mobilization that active pressure
      itself provokes, whose presence weakens the push force's net effect.
    result: >
      This component is a reusable general-purpose mechanism definition and does not embed any
      specific historical scenario; historical/experimental calibration scenarios and an honest
      assessment of fit quality are in models/papers/sx2/opinion_critical_mass/.
    limitations: >
      Centola et al.'s (2018) 25% threshold comes from a controlled experimental group of tens of
      people with dense social ties, and this component uses it directly as the default calibration
      at national or large-population scale, a direct cross-scale reuse rather than a re-calibration;
      this cross-scale assumption itself has not been independently verified, and is this component's
      most significant limitation, with the specific test results found in the case file the result
      field above points to. The model represents "the population" as a single aggregate state
      variable, containing no network topology, individual heterogeneity, or any explicit interpersonal
      connection structure, so it cannot answer structural questions like "who influenced whom,"
      which require techniques outside the LM format's current scope, such as network renormalization
      or multi-agent simulation, discussed in the case file.
      k_diffusion_rate, k_push_effect, k_backlash_generation, k_backlash_decay, and k_backlash_drag
      are all calibrated choices rather than directly measured literature values.
  ratings:
    importance: 0.5 - The critical-mass mechanism for social-norm/attitude change is one of the core theories for understanding large-scale collective behavior change; an exploratory component, moderate citation expected
    variable: 0.75 - The core threshold cites a controlled experiment published in Science (Centola et al. 2018), and the backlash mechanism cites Klarman's (2013) systematic analysis of real historical cases
    equation: 0.5 - The bistable critical-mass structure has precedent in social physics, with the specific coupling form self-built
    simulation: 0.25 - The core threshold directly reuses a small-group experimental value; the same mechanism, when tested at national scale in papers/sx2/opinion_critical_mass_sim.yaml, was confirmed to show an order-of-magnitude timescale mismatch
    optimization: 0.0 - This file contains no optimization block and involves no decision variables
    confidence: 0.25 - The small-group experimental threshold is itself credible, but the cross-scale transfer to a large-population scenario has already been falsified by independent downstream testing and has not been recalibrated
  tags: [opinion-dynamics, social-physics, critical-mass, tipping-point, bistability, sociology, social]

variables:
  opinion_support_share:
    type: state
    value: 10
    unit: "score"
    bounds: [0, 100]
    description: "The population fraction holding the target position"

  polarization_backlash:
    type: state
    value: 0
    unit: "score"
    bounds: [0, 100]
    description: "The intensity of resistant counter-mobilization provoked by the active push force"
    reference: "The mechanism is based on Klarman (2013)"

  critical_mass_threshold:
    type: parameter
    value: 25
    unit: "score"
    bounds: [15, 35]
    description: "The critical-mass threshold: the location of the dynamical equation's unstable fixed point"
    reference: "Centola et al. (2018) Science 360(6393):1116-1119"

  k_diffusion_rate:
    type: parameter
    value: 0.05
    unit: "score/day, the bistable-term coefficient"
    description: >
      The overall rate coefficient of the bistable term: a calibrated choice, not a directly
      measured literature value. Centola et al. (2018) measured the threshold's location itself, but
      did not give a diffusion-speed constant for after the threshold is crossed; the magnitude is
      chosen so the trajectory evolves observably within a simulation window of tens to hundreds of
      days, rather than saturating instantly or never moving.
    reference: "TODO:SOURCE a calibrated choice; the fixed-point location is based on Centola et al. (2018)"

  k_push_effect:
    type: parameter
    value: 0.6
    unit: "score per level of push force per day"
    description: "The rate at which exogenous push force directly raises support share: a calibrated choice, not a directly measured literature value."
    reference: "TODO:SOURCE a calibrated choice"

  k_backlash_generation:
    type: parameter
    value: 0.1
    unit: "score per level of push force per day"
    description: >
      The rate at which push-force intensity raises backlash strength: a calibrated choice, not a
      directly measured literature value; the mechanism is based on Klarman (2013), where court
      rulings and other coercive pushes historically did provoke significant political backlash
      mobilization, but the original work is a historical case analysis and does not give a value
      directly mappable to this dynamics coefficient.
    reference: "TODO:SOURCE a calibrated choice; the mechanism is based on Klarman (2013)"

  k_backlash_decay:
    type: parameter
    value: 0.05
    unit: "1/day"
    description: "The natural decay rate of backlash strength, representing an issue's salience naturally fading over time: a calibrated choice, not a directly measured literature value."
    reference: "TODO:SOURCE a calibrated choice"

  k_backlash_drag:
    type: parameter
    value: 0.02
    unit: "score per point of backlash strength per day"
    description: "The rate at which backlash strength drags on the growth of support share: a calibrated choice, not a directly measured literature value."
    reference: "TODO:SOURCE a calibrated choice"

  advocacy_push:
    type: input
    value: 0
    unit: "level"
    bounds: [0, 1]
    description: "The intensity of the exogenous push force: a composite proxy for events such as media coverage, elite statements, and legal rulings, 0=none, 1=high-intensity sustained push"

equations:
  opinion_dynamics:
    description: >
      The core cubic-form bistable mechanism: an unstable fixed point exists at
      critical_mass_threshold, below which support share spontaneously decays back to 0, above which
      it is pushed toward 100, plus the exogenous push force's direct effect and the backlash
      strength's drag term.
    step_unit: day
    dynamics:
      opinion_support_share: >
        max(0, min(100, opinion_support_share
          + k_diffusion_rate * (opinion_support_share / 100) * (1 - opinion_support_share / 100)
          * (opinion_support_share / 100 - critical_mass_threshold / 100) * 100 * step
          + k_push_effect * advocacy_push * step
          - k_backlash_drag * polarization_backlash * step))
    priority: 5
    reference: "The cubic bistable structure and fixed-point location are based on Centola et al. (2018) Science 360(6393):1116-1119"

  backlash_dynamics:
    description: "A stronger exogenous push provokes higher backlash strength; backlash strength naturally decays over time, representing an issue's salience fading."
    step_unit: day
    dynamics:
      polarization_backlash: >
        max(0, min(100, polarization_backlash
          + k_backlash_generation * advocacy_push * step
          - k_backlash_decay * polarization_backlash * step))
    priority: 6
    reference: "The mechanism is based on Klarman (2013)"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  output_variables: [opinion_support_share, polarization_backlash]

references:
  - citation: "Centola D, Becker J, Brackbill D, Baronchelli A (2018) Experimental evidence for tipping points in social convention. Science 360(6393):1116-1119."
    description: "The experimentally measured critical-mass threshold of about 25%, and the basis for the bistable dynamics' functional form."
  - citation: "Klarman MJ (2013) From the Closet to the Altar: Courts, Backlash, and the Struggle for Same-Sex Marriage. Oxford University Press."
    description: "Historical evidence that coercive pushes such as court rulings provoked political backlash mobilization, the mechanism's basis, though it gives no directly mappable dynamics coefficient."
