  name: ch1907_de_hans_castorp
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Hans Castorp (Thomas Mann's The Magic Mountain, 1924) originally planned a 3-week stay at
      the sanatorium in Davos, Switzerland, but ultimately remains for 7 years. The core tension is
      among following the sanatorium regimen to recover from tuberculosis, pursuing intellectual
      exploration through philosophical debate with his intellectual interlocutors Settembrini and
      Naphta, and maintaining a connection to the outside world to prevent total absorption into the
      mountain's altered sense of time. Illness distorts his sense of time, while beyond the window
      Europe is sliding toward the 1914 outbreak of World War I.
    result: >
      The simulation is expected to show the monthly dynamics of tuberculosis-recovery progress,
      intellectual maturity, and connection to the real world across 84 months. This is currently a
      draft, with parameters still to be calibrated.
    limitations: A draft; parameters, objectives, and narrative details still need calibration; a literary setting whose tuberculosis-recovery-dynamics parameters need grounding in medical literature.
  ratings:
    variable: 0.0 - All 7 variables are marked TODO:SOURCE, with the tuberculosis-recovery parameters not anchored to medical literature
    equation: 0.0 - All 4 equations are purely self-built for the narrative, with reference marked TODO:SOURCE
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 84-month trajectory normally, not yet compared point-by-point against independent data
    optimization: 0.0 - Manual review on 2026-09-04, intellectual_engagement does directly lower health (-0.5/step) while raising intellectual_depth (+2.5/step), but the other decision variable treatment_adherence contributes a larger direct positive effect to health (+1.5/step), so even with intellectual_engagement maxed out, maxing out treatment_adherence still keeps health's net effect positive; both objectives can approach their upper bounds simultaneously, and no genuine tradeoff exists within the reachable space, consistent with --opt converging to a single front point (100,100); the earlier judgment only looked at the sign of the single intellectual_engagement coefficient and did not check for a third variable that could fully compensate
    importance: 0.25 - The Magic Mountain is a German literary classic, but with a relatively niche audience, and this is a literary setting, not a module the framework depends on
    innovation: 0.5 - Converting literary narrative tension into an optimizable dynamical system, with the core decision-tradeoff structure carried over from a known framework
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared against an independent literature target
  tags:
    - tuberculosis
    - sanatorium
    - time-distortion
    - war
    - europe
    - literature
variables:
  treatment_adherence:
    type: input
    value: 0.6
    unit: intensity
    bounds:
      - 0
      - 1
    description: Following the sanatorium regimen, rest, sunbathing, temperature logging, the sanatorium's standard treatment
    reference: TODO:SOURCE
  intellectual_engagement:
    type: input
    value: 0.5
    unit: intensity
    bounds:
      - 0
      - 1
    description: Intellectual exploration, philosophical debate with figures such as Settembrini and Naphta (stimulating but physically draining)
    reference: TODO:SOURCE
  world_engagement:
    type: input
    value: 0.2
    unit: intensity
    bounds:
      - 0
      - 1
    description: Connection to the outside world, following news from below the mountain, writing letters, attempting to leave
    reference: TODO:SOURCE
  health:
    type: state
    value: 45
    unit: hp
    bounds:
      - 0
      - 100
    description: Tuberculosis state, the recovery or progression of the disease (high=improving)
    reference: TODO:SOURCE
    io_role: output
  time_sense:
    type: state
    value: 30
    unit: score
    bounds:
      - 0
      - 100
    description: Time perception, distortion in his sense of time passing (high=time frozen, low=a lucid return)
    reference: TODO:SOURCE
    io_role: output
  intellectual_depth:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: Intellectual depth, the philosophical understanding accumulated in isolation
    reference: TODO:SOURCE
    io_role: output
  world_disconnect:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: Disconnection from the world, how detached he becomes from real society
    reference: TODO:SOURCE
    io_role: output
equations:
  health_change:
    dynamics:
      health: min(100, max(0, health + (treatment_adherence * 1.5) - (intellectual_engagement * 0.5) - 0.3))
    description: Tuberculosis slowly improves under the sanatorium regimen, but intellectual exertion offsets it
    reference: TODO:SOURCE
  time_distortion:
    dynamics:
      time_sense: min(100, time_sense + (1 - world_engagement) * 1.5)
    description: The sanatorium's time distortion accumulates the longer he stays
    reference: TODO:SOURCE
  intellectual_growth:
    dynamics:
      intellectual_depth: min(100, intellectual_depth + intellectual_engagement * 2.5)
    description: Intellectual depth grows through debate and exploration
    reference: TODO:SOURCE
  disconnect_growth:
    dynamics:
      world_disconnect: min(100, world_disconnect + (time_sense / 100) * 1.5 - world_engagement * 2.0)
    description: Disconnection from the world deepens with time-sense distortion
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: month
  start_date: '1907-07-01'
  end_date: '1914-06-30'
  output_types:
    - input
    - state
optimization:
  method: nsga2
  objectives:
    - variable: health
      metric: final
      direction: maximize
    - variable: intellectual_depth
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: treatment_adherence
        time_start: "09:00"
        time_end: "09:00"
        days:
