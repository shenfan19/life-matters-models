          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Following the sanatorium regimen
        optimize:
          value:
            - 0
            - 1
      - variable: intellectual_engagement
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Intellectual exploration
        optimize:
          value:
            - 0
            - 1
      - variable: world_engagement
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Connection to the outside world
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
