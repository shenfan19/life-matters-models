  description:
    problem: >
      第三次鼠疫大流行（1855 年云南起源，经香港→孟买→全球扩散）中，前抗生素时代个人可控干预极其有限——
      逃离、隔离和消灭鼠患是仅有的手段；具体人物视角（云南农民/香港殖民地医生/孟买码头工人）待确定。
    result: >
      仿真窗口已预置（1855-01-01 至 1855-12-31）——变量和公式待人物视角确定后填写；仿真尚未运行（TODO 存根）。
    limitations: 人物视角、地理背景和核心干预变量均未确定；需参考 Benedict 1996 和 Echenberg 2007。
  ratings:
    topic_importance: 4 - 第三次鼠疫是现代流行病学起源事件，历史和公卫价值高
    framework_demand: 1 - TODO存根，尚未被其他模型引用
    evidence_quality: 1 - TODO存根，变量和公式未实现，无法评估参数质量
    innovation: 2 - 鼠疫个人视角建模意图存在，但尚未实现
    social_value: 4 - 触及现代公共卫生制度起源，有重要历史教育价值
  tags: [plague, infectious-disease, 19th-century, pandemic, TODO]
  references:
    - "Benedict C (1996) Bubonic Plague in Nineteenth-Century China. Stanford University Press."
    - "Echenberg M (2007) Plague Ports: The Global Urban Impact of Bubonic Plague 1894-1901. NYU Press."
  step_size:
    value: 1
    unit: day

