category: dynamics

metadata:
  name: ad2077_nightcity_v
  lm_format_version: "1.0"
  updated: 2026-05-23
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      赛博朋克 2077 的 V（2077 年夜之城）面临三重约束：植入体（Cyberware）强化战斗力但积累 Cyberpsychosis 风险（Humanity 损耗）；
      Relic 芯片持续消耗神经系统；NCPD、企业和帮派三重外部威胁。具体弧线（主线/义侠/街头小子起源）待确定。
    result: >
      仿真窗口已预置（2077-01-01 至 2077-06-30）——Cyberware 量化参数和 Relic 进展速率待从游戏机制反推后填写；仿真尚未运行（TODO 存根）。
    limitations: 完全虚构，无学术来源；参数需从游戏机制反推；TODO 存根，尚未实现。
  ratings:
    topic_importance: 2 - 科幻游戏设定，跨媒体传播价值中等，学术场景复用度有限
    framework_demand: 1 - TODO存根，尚未被其他模型引用
    evidence_quality: 1 - TODO存根且完全虚构，无客观依据，无法评估
    innovation: 2 - 人机融合与Cyberpsychosis的量化建模意图有趣，但尚未实现
    social_value: 3 - 探索人机融合的边界和身份认同，有科幻哲学讨论价值
  tags: [cyberpunk, fiction, 2077, transhumanism, TODO]
  references:
    - "CD Projekt Red (2020) Cyberpunk 2077 [Video Game]. CD Projekt."
    - "Pondsmith M (1988) Cyberpunk 2013 Sourcebook. R. Talsorian Games."
  step_size:
    value: 1
    unit: day

