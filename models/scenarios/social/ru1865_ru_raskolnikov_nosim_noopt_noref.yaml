category: social
metadata:
  name: ru1865_ru_raskolnikov
  lm_format_version: "1.0"
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      拉斯柯尔尼科夫（陀思妥耶夫斯基《罪与罚》1866）谋杀放贷人后面临三重张力：
      掩盖罪行努力（降低被捕风险但「道德发烧」加剧，精神症状恶化）、
      精神救赎寻求（与索尼娅的接触减缓心理崩溃但增加暴露风险）、
      社会退缩程度（减少被发现概率但加速与现实脱节）——
      波尔菲里的审讯和自身精神发烧构成双重压力，90 天内从犯罪到坦白的心理崩溃轨迹。
    result: >
      仿真预期显示 90 天内精神健康、被捕风险和救赎进度的日动态——草案状态，参数待校准（noref）。
    limitations: 草案，参数、目标和叙事细节待校准；文学设定，无客观历史数据（noref）。
  ratings:
    topic_importance: 4 - 《罪与罚》是心理犯罪小说的巅峰，道德-精神健康-贫困的耦合极具研究价值
    framework_demand: 1 - TODO存根，尚未被其他模型引用
    evidence_quality: 1 - TODO草案，参数未完善，且为文学设定
    innovation: 2 - 将道德冲突外化为"精神发烧"动力学的意图极具创意，但尚未完善
    social_value: 5 - 探索道德越界的心理代价和救赎的可能性，是陀思妥耶夫斯基最重要作品
  tags:
  - poverty
  - crime
  - mental-health
  - fever
  - redemption
  - literature
  references:
  - Crime and Punishment (Dostoyevsky, 1866)
  step_size:
    value: 1
    unit: day
variables:
  concealment_effort:
    type: input
    value: 0.6
    unit: intensity
    bounds:
    - 0
    - 1
    description: 掩盖罪行努力：主动消除痕迹、控制表现、避免暴露
    reference: TODO:SOURCE
  spiritual_seeking:
    type: input
    value: 0.2
    unit: intensity
    bounds:
    - 0
    - 1
    description: 精神救赎寻求：与索尼娅等人的真实交流，寻求道德出路
    reference: TODO:SOURCE
  social_withdrawal:
    type: input
    value: 0.7
    unit: intensity
    bounds:
    - 0
    - 1
    description: 社会退缩程度：拒绝人际接触、独居程度（越高越安全，也越快崩溃）
    reference: TODO:SOURCE
  mental_health:
    type: state
    value: 45
    unit: score
    bounds:
    - 0
    - 100
    description: 精神状态：罪恶感·发烧·妄想·心理分裂的综合状态（高=稳定）
    reference: TODO:SOURCE
    io_role: output
  fever_level:
    type: state
    value: 30
    unit: score
    bounds:
    - 0
    - 100
    description: 发烧强度：心理创伤导致的生理发热（陀思妥耶夫斯基式症状）
    reference: TODO:SOURCE
    io_role: output
  detection_risk:
    type: state
    value: 10
    unit: score
    bounds:
    - 0
    - 100
    description: 被侦探发现的风险：波费利等侦探逐渐收紧包围圈的程度
    reference: TODO:SOURCE
    io_role: output
  redemption_potential:
    type: state
    value: 5
    unit: score
    bounds:
    - 0
    - 100
    description: 救赎可能性：走向自首和灵魂重建的内在能量
    reference: TODO:SOURCE
    io_role: output
  guilt_pressure:
    type: state
    value: 60
    unit: score
    bounds:
    - 0
    - 100
    description: 罪恶感压力：无法逃避的道德重量
    reference: TODO:SOURCE
    io_role: output
formulas:
  fever_dynamics:
    formula:
      fever_level: min(100, max(0, fever_level + ((guilt_pressure / 100) * 2.0) - (spiritual_seeking * 1.5)))
    description: 发烧随罪恶压力增高，精神寻求可缓解
    reference: TODO:SOURCE
  mental_health_change:
    formula:
      mental_health: max(0, min(100, mental_health - ((fever_level / 100) * 2.5) - (concealment_effort * 1.2) - (social_withdrawal
        * 0.8) + (spiritual_seeking * 2.0)))
    description: 精神状态受发烧·掩盖努力·孤立的消耗
    reference: TODO:SOURCE
  detection_progression:
    formula:
      detection_risk: min(100, detection_risk + (1.5) - (concealment_effort * 0.8) + ((guilt_pressure / 100) * 1.0))
    description: 侦探的追踪随时间推进，掩盖努力可短暂延缓
    reference: TODO:SOURCE
  guilt_dynamics:
    formula:
      guilt_pressure: min(100, max(0, guilt_pressure + (1.0 + social_withdrawal * 0.5) - (spiritual_seeking * 2.5)))
    description: 罪恶感随时间增长，只有精神寻求可真正减少
    reference: TODO:SOURCE
  redemption_growth:
    formula:
      redemption_potential: min(100, redemption_potential + (spiritual_seeking * 3.0 * (1 - concealment_effort * 0.5)))
    description: 救赎可能性随精神寻求增长，需要接受痛苦（非掩盖）
    reference: TODO:SOURCE
simulation:
  start_date: '1865-06-01'
  end_date: '1865-08-29'
  output_types:
  - input
  - state
optimizer:
  method: nsga2
  objectives:
  - variable: redemption_potential
    metric: final
    direction: maximize
  - variable: mental_health
    metric: final
    direction: maximize
  schedules:
  - variable: concealment_effort
    time: 09:00
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    label: 掩盖罪行努力
    optimize:
      value:
      - 0
      - 1
  - variable: spiritual_seeking
    time: 09:00
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    label: 精神救赎寻求
    optimize:
      value:
      - 0
      - 1
  - variable: social_withdrawal
    time: 09:00
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    label: 社会退缩程度
    optimize:
      value:
      - 0
      - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
