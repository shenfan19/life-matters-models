  name: uk1830_uk_oliver_twist
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      奥利弗·退斯特（狄更斯《雾都孤儿》1837）在 1830 年代伦敦济贫院制度下面临三重生存权衡：服从程度，即能降低惩罚风险，但会强化剥削关系；抵抗与逃跑尝试，即可能改变处境，但失败代价极高；以及建立人际连接，即能获得保护和援助网络，但需投入稀缺的时间与信任。制度性贫困使奥利弗的个人努力面临结构性天花板，与布朗罗的偶然相遇这一运气因素是关键转折变量。
    result: >
      仿真预期比较不同策略下奥利弗 78 周的生存状态、自由度和被剥削强度的轨迹。当前为草案状态，参数待校准。
    limitations: 草案，参数、目标和叙事细节待校准；文学设定，无客观历史数据。
  ratings:
    topic_importance: 4 - 《雾都孤儿》是童工制度和儿童剥削的最著名文学控诉，社会学意义重大
    framework_demand: 1 - TODO存根，尚未被其他模型引用
    evidence_quality: 1 - TODO草案，参数未完善，且为文学设定
    innovation: 2 - 将服从-抵抗-人际连接的生存策略博弈转化为动力学意图清晰，但尚未完善
    social_value: 5 - 触及儿童权利、阶级固化和社会责任的普世主题，狄更斯社会批判精髓
  tags:
    - orphan
    - child-labor
    - poverty
    - exploitation
    - survival
    - literature
  references:
    - Oliver Twist (Charles Dickens, 1837)
variables:
  compliance:
    type: input
    value: 0.5
    unit: ratio
    bounds:
      - 0
      - 1
    description: 服从程度：听从雇主/犯罪团伙指令（减少惩罚，换取最低生存资源）
    reference: TODO:SOURCE
  resistance_effort:
    type: input
    value: 0.3
    unit: intensity
    bounds:
      - 0
      - 1
    description: 抵抗与逃跑尝试：拒绝指令、尝试逃跑或向成年人求助
    reference: TODO:SOURCE
  connection_seeking:
    type: input
    value: 0.4
    unit: intensity
    bounds:
      - 0
      - 1
    description: 建立人际连接：向南希·布朗罗等人表达信任，寻求善意
    reference: TODO:SOURCE
  survival_resource:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: 生存资源：食物·衣物·基本庇护的累积水平
    reference: TODO:SOURCE
    io_role: output
  physical_health:
    type: state
    value: 55
    unit: hp
    bounds:
      - 0
      - 100
    description: 身体健康：营养不良·被打·疾病的综合健康状态
    reference: TODO:SOURCE
    io_role: output
  danger_level:
    type: state
    value: 25
    unit: score
    bounds:
      - 0
      - 100
    description: 当前危险等级：来自犯罪团伙/当局追捕的威胁程度
    reference: TODO:SOURCE
    io_role: output
  hope_for_escape:
    type: state
    value: 10
    unit: score
    bounds:
      - 0
      - 100
    description: 逃脱的希望：找到真正保护者、脱离剥削系统的可能性积累
    reference: TODO:SOURCE
    io_role: output
  moral_integrity:
    type: state
    value: 85
    unit: score
    bounds:
      - 0
      - 100
    description: 道德完整性：在压力下保持内心的善良（抵抗成为共犯）
    reference: TODO:SOURCE
    io_role: output
equations:
  resource_dynamics:
    dynamics:
      survival_resource: min(100, max(0, survival_resource + (compliance * 8.0) + (connection_seeking * 5.0) - 5.0))
    description: 服从换取资源，但道德代价高；连接可带来帮助
    reference: TODO:SOURCE
  health_dynamics:
    dynamics:
      physical_health: max(0, min(100, physical_health - (max(0, (50 - survival_resource) / 50) * 2.0) - ((1 - compliance) * danger_level / 100 * 3.0) + ((survival_resource / 100) * 1.5)))
    description: 营养不良+受伤+疾病消耗健康；资源多时健康恢复
    reference: TODO:SOURCE
  danger_dynamics:
    dynamics:
      danger_level: min(100, max(0, danger_level + (resistance_effort * 3.0) - (compliance * 2.0)))
    description: 抵抗增加危险；服从减少危险；逃脱成功则危险降低
    reference: TODO:SOURCE
  hope_growth:
    dynamics:
      hope_for_escape: min(100, max(0, hope_for_escape + (connection_seeking * 3.0) + (resistance_effort * 2.0) - ((danger_level / 100) * 1.5)))
    description: 逃脱希望随连接建立和抵抗积累增长
    reference: TODO:SOURCE
  moral_dynamics:
    dynamics:
      moral_integrity: max(0, min(100, moral_integrity - (compliance * 1.5) + (connection_seeking * 1.0) + (resistance_effort * 0.5)))
    description: 道德完整性随服从（共犯）消耗，随连接和抵抗维持
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: week
  start_date: '1830-01-01'
  end_date: '1831-06-30'
  output_types:
    - input
    - state
optimizer:
  method: nsga2
  objectives:
    - variable: hope_for_escape
      metric: final
      direction: maximize
    - variable: moral_integrity
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: compliance
        time_start: "09:00"
        time_end: "09:00"
        days:
