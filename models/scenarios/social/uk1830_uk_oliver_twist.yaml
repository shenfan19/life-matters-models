category: social
metadata:
  todo:
    - type: noref
      issue: "Lacks sufficient literature citation support (migrated from the old filename's _noref suffix)"
      evidence: "Migrated from the legacy _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check and supply the missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: uk1830_uk_oliver_twist
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      Under the 1830s London workhouse system, Oliver Twist (Dickens's Oliver Twist, 1837) faces
      a triple survival tradeoff: the degree of compliance can lower punishment risk, but reinforces
      the exploitative relationship; resistance and escape attempts might change his circumstances,
      but the cost of failure is extremely high; and building interpersonal connections can gain
      protection and a support network, but requires investing scarce time and trust. Systemic
      poverty puts a structural ceiling on Oliver's individual effort, and the chance encounter with
      Mr. Brownlow, a factor of luck, is the key turning-point variable.
    result: >
      The simulation is expected to compare Oliver's survival state, degree of freedom, and
      exploitation intensity across a 78-week trajectory under different strategies. This is
      currently a draft, with parameters still to be calibrated.
    limitations: A draft; parameters, objectives, and narrative details still need calibration; a literary setting with no objective historical data.
  ratings:
    variable: 0.0 - All 7 variables are marked TODO:SOURCE, a purely literary setting with no objective data
    equation: 0.0 - All 5 equations are purely self-built for the narrative, with reference marked TODO:SOURCE
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 78-week trajectory normally, not yet compared point-by-point against independent data
    optimization: 0.0 - Manual review on 2026-09-04, compliance does contribute an indirect positive effect on hope_for_escape through the danger_level pathway, but that pathway's coefficient (each 2.0-point drop in danger_level raises hope_for_escape by only 0.03) is far smaller than connection_seeking/resistance_effort's direct contribution to hope_for_escape (+3.0/+2.0 respectively), so in practice compliance's effect on hope_for_escape is negligible, and its only substantial effect is directly lowering moral_integrity (-1.5/step); no genuine tradeoff exists within the reachable space, consistent with --opt converging to a single front point (100,100); the earlier judgment only looked at the coefficient signs and did not check their relative magnitude
    importance: 0.5 - Oliver Twist is the most famous literary indictment of child labor and child exploitation, but this is a literary setting, not a module the framework depends on
    innovation: 0.5 - Converting literary narrative tension into an optimizable dynamical system, with the core decision-tradeoff structure carried over from a known framework
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared against an independent literature target
  tags:
    - orphan
    - child-labor
    - poverty
    - exploitation
    - survival
    - literature
variables:
  compliance:
    type: input
    value: 0.5
    unit: ratio
    bounds:
      - 0
      - 1
    description: The degree of compliance, obeying the orders of employers/the criminal gang (reducing punishment in exchange for minimal survival resources)
    reference: TODO:SOURCE
  resistance_effort:
    type: input
    value: 0.3
    unit: intensity
    bounds:
      - 0
      - 1
    description: Resistance and escape attempts, refusing orders, attempting to escape, or seeking help from an adult
    reference: TODO:SOURCE
  connection_seeking:
    type: input
    value: 0.4
    unit: intensity
    bounds:
      - 0
      - 1
    description: Building interpersonal connections, extending trust to figures like Nancy and Mr. Brownlow, seeking kindness
    reference: TODO:SOURCE
  survival_resource:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: Survival resources, the accumulated level of food, clothing, and basic shelter
    reference: TODO:SOURCE
    io_role: output
  physical_health:
    type: state
    value: 55
    unit: hp
    bounds:
      - 0
      - 100
    description: Physical health, a composite of malnutrition, beatings, and illness
    reference: TODO:SOURCE
    io_role: output
  danger_level:
    type: state
    value: 25
    unit: score
    bounds:
      - 0
      - 100
    description: The current danger level, the threat from pursuit by the criminal gang/the authorities
    reference: TODO:SOURCE
    io_role: output
  hope_for_escape:
    type: state
    value: 10
    unit: score
    bounds:
      - 0
      - 100
    description: Hope of escape, the accumulated possibility of finding a genuine protector and breaking free of the exploitative system
    reference: TODO:SOURCE
    io_role: output
  moral_integrity:
    type: state
    value: 85
    unit: score
    bounds:
      - 0
      - 100
    description: Moral integrity, keeping his inner goodness intact under pressure (resisting becoming complicit)
    reference: TODO:SOURCE
    io_role: output
equations:
  resource_dynamics:
    dynamics:
      survival_resource: min(100, max(0, survival_resource + (compliance * 8.0) + (connection_seeking * 5.0) - 5.0))
    description: Compliance trades for resources, but at a high moral cost; connection can bring help
    reference: TODO:SOURCE
  health_dynamics:
    dynamics:
      physical_health: max(0, min(100, physical_health - (max(0, (50 - survival_resource) / 50) * 2.0) - ((1 - compliance) * danger_level / 100 * 3.0) + ((survival_resource / 100) * 1.5)))
    description: Malnutrition, injury, and illness deplete health; health recovers when resources are ample
    reference: TODO:SOURCE
  danger_dynamics:
    dynamics:
      danger_level: min(100, max(0, danger_level + (resistance_effort * 3.0) - (compliance * 2.0)))
    description: Resistance raises danger; compliance lowers it; a successful escape lowers danger
    reference: TODO:SOURCE
  hope_growth:
    dynamics:
      hope_for_escape: min(100, max(0, hope_for_escape + (connection_seeking * 3.0) + (resistance_effort * 2.0) - ((danger_level / 100) * 1.5)))
    description: Hope of escape grows as connection is built and resistance accumulates
    reference: TODO:SOURCE
  moral_dynamics:
    dynamics:
      moral_integrity: max(0, min(100, moral_integrity - (compliance * 1.5) + (connection_seeking * 1.0) + (resistance_effort * 0.5)))
    description: Moral integrity is depleted by compliance (complicity), and sustained by connection and resistance
    reference: TODO:SOURCE
simulation:
