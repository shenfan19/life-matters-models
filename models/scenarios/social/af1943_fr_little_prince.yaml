  name: af1943_fr_little_prince
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      Over the 8 days the pilot spends with the little prince in the Sahara desert, three actions
      compete with each other: repairing the plane, an action tied to his own survival; truly
      listening, the depth of connection with the little prince; and persuading the little prince to
      stay. The more time spent repairing the plane, the shallower the connection with the little
      prince, while not repairing it threatens the pilot's own survival. The core question is whether
      the pilot can give the little prince another choice within these 8 days (Saint-Exupéry, 1943).
    result: >
      The simulation is expected to compare the trajectories of the little prince's probability of
      staying and the pilot's probability of survival under three strategies: mainly repairing the
      plane, mainly listening deeply, and a balanced allocation of both. This is currently a draft,
      with parameters still to be calibrated.
    limitations: A draft; parameters, objectives, and narrative details still need calibration; a literary setting with no objective historical data.
  ratings:
    variable: 0.0 - All 6 variables are marked TODO:SOURCE, a literary setting with no objective data support
    equation: 0.0 - All 4 equations are purely self-built for the narrative, with reference marked TODO:SOURCE
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 8-day trajectory normally, not yet compared point-by-point against independent data
    optimization: 0.0 - The connection_depth and understanding objectives are driven in the same direction by the equations, showing no structural tradeoff; verified on 2026-09-04 that --opt converges to a single front point (96,94), numerically confirming no tradeoff
    importance: 0.5 - The Little Prince is one of the most widely read literary works, but this is a literary setting, not a module the framework depends on
    innovation: 0.5 - Converting literary narrative tension into an optimizable dynamical system, with the core decision-tradeoff structure carried over from a known framework
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared against an independent literature target
  tags:
    - desert
    - meaning
    - connection
    - loss
    - philosophy
    - literature
variables:
  repair_effort:
    type: input
    value: 1.5
    unit: intensity
    bounds:
      - 0
      - 3
    description: Effort spent repairing the plane, the pilot's focus on repairing the engine (tied to his own survival)
    reference: TODO:SOURCE
  listening_depth:
    type: input
    value: 0.5
    unit: intensity
    bounds:
      - 0
      - 1
    description: Truly listening to the little prince, setting aside the adult perspective to genuinely understand what he says
    reference: TODO:SOURCE
  persuasion_attempt:
    type: input
    value: 0.3
    unit: intensity
    bounds:
      - 0
      - 1
    description: Persuading the little prince to stay, attempting to convince him not to go back (staying on Earth)
    reference: TODO:SOURCE
  pilot_survival:
    type: state
    value: 40
    unit: score
    bounds:
      - 0
      - 100
    description: The pilot's survival probability, his water supply and the plane's repair progress in the desert (low=certain death)
    reference: TODO:SOURCE
    io_role: output
  understanding:
    type: state
    value: 10
    unit: score
    bounds:
      - 0
      - 100
    description: True understanding, how genuinely the pilot understands what the little prince says matters
    reference: TODO:SOURCE
    io_role: output
  prince_resolve:
    type: state
    value: 70
    unit: score
    bounds:
      - 0
      - 100
    description: The little prince's resolve to go home, his determination to return to his rose (high=unshakeable)
    reference: TODO:SOURCE
    io_role: output
  connection_depth:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: The depth of connection, the genuine understanding and connection between the two of them (this is the story's real legacy)
    reference: TODO:SOURCE
    io_role: output
equations:
  survival_progress:
    dynamics:
      pilot_survival: min(100, max(0, pilot_survival + repair_effort * 8.0 - 5.0))
    description: Repairing the plane plus reducing water consumption
    reference: TODO:SOURCE
  understanding_growth:
    dynamics:
      understanding: min(100, max(0, understanding + (listening_depth * 12.0) - (persuasion_attempt * 4.0)))
    description: True listening brings understanding; rushing to persuade instead blocks it
    reference: TODO:SOURCE
  prince_resolve_change:
    dynamics:
      prince_resolve: min(100, max(0, prince_resolve + (persuasion_attempt * 3.0) - ((understanding / 100) * 2.0)))
    description: Attempts at persuasion instead strengthen his resolve (the more he is opposed, the firmer he becomes)
    reference: TODO:SOURCE
  connection_growth:
    dynamics:
      connection_depth: min(100, connection_depth + listening_depth * 10.0 + (1 - persuasion_attempt) * 3.0)
    description: Connection accumulates through listening and shared time; it is the story's only genuine legacy
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: day
  start_date: '1943-05-01'
  end_date: '1943-05-08'
  output_types:
    - input
    - state
optimization:
  method: nsga2
  objectives:
    - variable: connection_depth
      metric: final
      direction: maximize
    - variable: understanding
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: repair_effort
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Effort spent repairing the plane
        optimize:
          value:
            - 0
            - 3
      - variable: listening_depth
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Truly listening to the little prince
        optimize:
          value:
            - 0
            - 1
      - variable: persuasion_attempt
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Persuading the little prince to stay
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - Le Petit Prince (Antoine de Saint-Exupéry, 1943)
