category: social
metadata:
  todo:
    - type: noref
      issue: "Lacks sufficient literature citation support (migrated from the old filename's _noref suffix)"
      evidence: "Migrated from the legacy _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check and supply the missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: fr1815_fr_fantine
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      After being dismissed from the factory for being an unmarried mother, Fantine (Hugo's Les
      Misérables, 1862) faces a triple tradeoff: labor intensity can raise income but worsens her
      tuberculosis; the degree of self-sacrifice, selling her hair, teeth, and body to pay for
      Cosette's upkeep; and seeking help, possibly gaining support but requiring her to expose her
      identity, with the help itself unreliable. The Thénardiers' extortion keeps rising, and
      systemic poverty means every effort faces diminishing returns.
    result: >
      The simulation is expected to show the monthly dynamics of Fantine's health, her capacity to
      send money, and Cosette's survival probability across 36 months. This is currently a draft,
      with parameters still to be calibrated.
    limitations: A draft; parameters, objectives, and narrative details still need calibration; a literary setting whose 19th-century French labor-market parameters need grounding in historical literature.
  ratings:
    variable: 0.0 - All 7 variables are marked TODO:SOURCE, with the 19th-century French labor-market parameters not anchored to historical literature
    equation: 0.0 - All 5 equations are purely self-built for the narrative, with reference marked TODO:SOURCE
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 36-month trajectory normally, not yet compared point-by-point against independent data
    optimization: 0.5 - Verified on 2026-09-04, --opt converges to only 2 Pareto solutions (cosette_wellbeing 0/15 versus health 68.2/0, mutually exclusive), numerically confirming the directional inverse correlation, but the front is highly sparse and the population never spread out intermediate solutions, requiring manual review of whether it degenerated
    importance: 0.5 - Fantine is a classic literary figure of an impoverished single mother's labor exploitation, but this is a literary setting, not a module the framework depends on
    innovation: 0.5 - Converting literary narrative tension into an optimizable dynamical system, with the core decision-tradeoff structure carried over from a known framework
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared against an independent literature target
  tags:
    - poverty
    - single-mother
    - tuberculosis
    - exploitation
    - sacrifice
    - literature
variables:
  work_intensity:
    type: input
    value: 2.0
    unit: intensity
    bounds:
      - 0
      - 3
    description: Labor intensity, how hard she works, higher earns more but accelerates the lung disease
    reference: TODO:SOURCE
  sacrifice_level:
    type: input
    value: 0.5
    unit: ratio
    bounds:
      - 0
      - 1
    description: The degree of self-sacrifice, sacrificing her own survival resources (hair/teeth/body) to send money to Cosette
    reference: TODO:SOURCE
  seek_help:
    type: input
    value: 0.2
    unit: intensity
    bounds:
      - 0
      - 1
    description: Seeking help, asking the church/officials/benefactors for aid (high risk, a heavy toll on dignity)
    reference: TODO:SOURCE
  cosette_wellbeing:
    type: state
    value: 40
    unit: score
    bounds:
      - 0
      - 100
    description: Cosette's living condition, her daughter's quality of life at the inn (dependent on money sent)
    reference: TODO:SOURCE
    io_role: output
  health:
    type: state
    value: 75
    unit: hp
    bounds:
      - 0
      - 100
    description: Fantine's health, the cumulative depletion from tuberculosis, malnutrition, and overwork
    reference: TODO:SOURCE
    io_role: output
  income:
    type: state
    value: 50
    unit: score
    bounds:
      - 0
      - 100
    description: Monthly income (relative), her current level of labor income
    reference: TODO:SOURCE
    io_role: output
  desperation:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: The degree of desperation, a composite of social exclusion, worsening health, and depleted resources
    reference: TODO:SOURCE
    io_role: output
  tb_progression:
    type: state
    value: 10
    unit: score
    bounds:
      - 0
      - 100
    description: Tuberculosis progression, the disease's irreversible advance
    reference: TODO:SOURCE
    io_role: output
equations:
  health_decay:
    dynamics:
      health: max(0, health - ((tb_progression / 100) * 2.5) - (work_intensity * 0.8) - (sacrifice_level * 1.5) + seek_help * 0.5)
    description: Tuberculosis, labor intensity, and malnutrition deplete health
    reference: TODO:SOURCE
  tb_growth:
    dynamics:
      tb_progression: min(100, tb_progression + (1.0 + sacrifice_level * 1.2) + (work_intensity * 0.4))
    description: Tuberculosis accelerates with malnutrition and exhaustion
    reference: TODO:SOURCE
  income_dynamics:
    dynamics:
      income: max(0, (work_intensity * 15.0) - ((desperation / 100) * 20.0) + (seek_help * 5.0))
    description: Income rises with work intensity, but social exclusion (desperation) gradually lowers employment opportunity
    reference: TODO:SOURCE
  cosette_status:
    dynamics:
      cosette_wellbeing: max(0, min(100, cosette_wellbeing + ((income * sacrifice_level * 0.5) * (1 - (0.4))) * 0.1 - 2.0))
    description: Money sent improves Cosette's condition, but the innkeeper skims off a share
    reference: TODO:SOURCE
  desperation_growth:
    dynamics:
      desperation: min(100, max(0, desperation + ((1 - health / 100) * 2.0 + (1 - income / 100) * 1.5) - (seek_help * 1.5)))
    description: Desperation accumulates as health declines, income falls, and no help arrives
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: month
  start_date: '1815-01-01'
  end_date: '1817-12-31'
  output_types:
    - input
    - state
optimization:
  method: nsga2
  objectives:
    - variable: cosette_wellbeing
      metric: final
      direction: maximize
    - variable: health
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: work_intensity
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Labor intensity
        optimize:
          value:
            - 0
            - 3
      - variable: sacrifice_level
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: The degree of self-sacrifice
        optimize:
          value:
            - 0
            - 1
      - variable: seek_help
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Seeking help
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - Les Misérables (Victor Hugo, 1862)
