  name: fr1815_fr_fantine
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      芳汀（雨果《悲惨世界》1862）被工厂因未婚母亲身份解雇后面临三重权衡：劳动强度，即能增加收入但会加剧结核病病情；自我牺牲程度，即卖头发、牙齿、身体以换取珂赛特的生活费；以及寻求援助，即可能获得支持但需暴露身份且援助并不可靠。德纳第夫妇的勒索持续上涨，系统性贫困使任何努力都面临边际递减。
    result: >
      仿真预期显示 36 个月内芳汀的健康状态、汇款能力和珂赛特存活概率的月动态轨迹。当前为草案状态，参数待校准。
    limitations: 草案，参数、目标和叙事细节待校准；文学设定，19 世纪法国劳动市场参数需参考历史文献。
  ratings:
    variable: 0.0 - 全部7个变量均标注TODO:SOURCE，19世纪法国劳动市场参数未锚定历史文献
    equation: 0.0 - 5条方程均为纯叙事自建，reference标注TODO:SOURCE
    simulation: 0.5 - 配置完整，变量/方程/仿真区间齐全，但标记nosim尚未实际运行验证
    optimization: 0.5 - sacrifice_level/work_intensity对cosette_wellbeing与health方向性权衡由方程内生，未数值验证
    importance: 0.5 - 芳汀是贫困单亲母亲劳工剥削的经典文学形象，但为文学设定，非框架依赖模块
    innovation: 0.5 - 将文学叙事张力转化为可优化动力学系统，核心决策权衡结构沿用已知框架
    confidence: 0.0 - 尚未验证：未跑通--sim/--opt，此前fan分支曾标注0.25但未核实实际运行状态，予以更正
  tags:
    - poverty
    - single-mother
    - tuberculosis
    - exploitation
    - sacrifice
    - literature
  references:
    - 悲惨世界 (Victor Hugo, 1862)
variables:
  work_intensity:
    type: input
    value: 2.0
    unit: intensity
    bounds:
      - 0
      - 3
    description: 劳动强度：做工努力程度：高则多挣钱，但加速肺病
    reference: TODO:SOURCE
  sacrifice_level:
    type: input
    value: 0.5
    unit: ratio
    bounds:
      - 0
      - 1
    description: 自我牺牲程度：为寄钱给珂赛特牺牲自身生存资源（头发/牙齿/身体）
    reference: TODO:SOURCE
  seek_help:
    type: input
    value: 0.2
    unit: intensity
    bounds:
      - 0
      - 1
    description: 寻求援助：向教会/官员/善人求助（风险高，尊严代价大）
    reference: TODO:SOURCE
  cosette_wellbeing:
    type: state
    value: 40
    unit: score
    bounds:
      - 0
      - 100
    description: 珂赛特生存状态：女儿在客栈的生活质量（取决于汇款）
    reference: TODO:SOURCE
    io_role: output
  health:
    type: state
    value: 75
    unit: hp
    bounds:
      - 0
      - 100
    description: 芳汀的健康：肺结核+营养不足+过度劳动的累积损耗
    reference: TODO:SOURCE
    io_role: output
  income:
    type: state
    value: 50
    unit: score
    bounds:
      - 0
      - 100
    description: 月收入（相对）：当前的劳动收入水平
    reference: TODO:SOURCE
    io_role: output
  desperation:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: 绝望程度：社会排斥·健康恶化·资源枯竭的综合绝望
    reference: TODO:SOURCE
    io_role: output
  tb_progression:
    type: state
    value: 10
    unit: score
    bounds:
      - 0
      - 100
    description: 肺结核进展：结核病的不可逆进展
    reference: TODO:SOURCE
    io_role: output
equations:
  health_decay:
    dynamics:
      health: max(0, health - ((tb_progression / 100) * 2.5) - (work_intensity * 0.8) - (sacrifice_level * 1.5) + seek_help * 0.5)
    description: 肺结核+劳动强度+营养不足消耗健康
    reference: TODO:SOURCE
  tb_growth:
    dynamics:
      tb_progression: min(100, tb_progression + (1.0 + sacrifice_level * 1.2) + (work_intensity * 0.4))
    description: 结核病随营养不足和劳累而加速
    reference: TODO:SOURCE
  income_dynamics:
    dynamics:
      income: max(0, (work_intensity * 15.0) - ((desperation / 100) * 20.0) + (seek_help * 5.0))
    description: 收入随工作强度，但社会排斥（desperation）逐渐降低就业机会
    reference: TODO:SOURCE
  cosette_status:
    dynamics:
      cosette_wellbeing: max(0, min(100, cosette_wellbeing + ((income * sacrifice_level * 0.5) * (1 - (0.4))) * 0.1 - 2.0))
    description: 寄钱→珂赛特状态，但客栈主人会截留
    reference: TODO:SOURCE
  desperation_growth:
    dynamics:
      desperation: min(100, max(0, desperation + ((1 - health / 100) * 2.0 + (1 - income / 100) * 1.5) - (seek_help * 1.5)))
    description: 绝望随健康下降·收入下降·无援助积累
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: month
  start_date: '1815-01-01'
  end_date: '1817-12-31'
  output_types:
    - input
    - state
optimizer:
  method: nsga2
  objectives:
    - variable: cosette_wellbeing
      metric: final
      direction: maximize
    - variable: health
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: work_intensity
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 劳动强度
        optimize:
          value:
            - 0
            - 3
      - variable: sacrifice_level
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 自我牺牲程度
        optimize:
          value:
            - 0
            - 1
      - variable: seek_help
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 寻求援助
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
