metadata:
  name: ad0228_cn_zhuge_liang
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      The core tension of Zhuge Liang's 228-234 Northern Expeditions comes from the historical
      account that "he eats little yet handles much, how can he last long": strategic progress is
      driven by military-affairs intensity, jointly modulated by fatigue, morale, and nutrition,
      that is, strategy_gain = work_intensity x (1 minus fatigue/100) x (morale/80) x
      (nutrition/70). Under the limited national strength of Shu Han, how should military-affairs
      intensity and rest be allocated to maximize the expedition's progress while preserving the
      chancellor's health?
    result: >
      The simulation shows the daily dynamic tradeoff between fatigue accumulation and strategic
      progress across the 180-day campaign season; a three-objective optimization (verified on
      2026-09-04, converging over 60 generations, 100% feasible) converges to a single front point
      (strategy=100, health=97, morale=67.9), which does not match the earlier expectation that "a
      directional tradeoff holds," showing no genuine numerical tradeoff.
    limitations: Historical parameters, such as the Shu army's nutrition and the military-affairs-intensity ceiling, are estimated from the literature; the overwork-dynamics coefficient is based on the contemporary study of Xie & Boven (2006), whose applicability to the historical period should be treated with caution.

  ratings:
    variable: 0.5 - The overwork coefficient is based on Xie & Boven (2006), and most historical values are literature-derived estimates
    equation: 0.5 - The multi-factor modulation equation is self-built, anchored to overwork-dynamics literature concepts
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 180-day trajectory normally, not yet compared point-by-point against independent historical data
    optimization: 0.0 - Manual review on 2026-09-04, work_intensity drives strategy while dragging down health/morale through accumulated fatigue, but rest_quality/food_intake are independent decision variables that can directly offset fatigue accumulation (-12/step) and nutritional-deficit depletion respectively, so the four decision variables can all approach their own upper bounds simultaneously without constraining each other; no genuine tradeoff exists within the reachable space, consistent with --opt converging to a single front point
    importance: 0.5 - Zhuge Liang is one of the most representative figures in Chinese cultural history, but this is a historical-narrative scenario, not a module the framework depends on
    innovation: 0.5 - Applying chronic-overwork dynamics to a historical-figure narrative is a novel combination, with the core overwork mechanism carried over from contemporary research
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared point-by-point against an independent historical-literature target value
  tags: [historical, china, three-kingdoms, cognition, strategy, overwork]
  period: "228-234"
  location: "Qishan Camp, Wei-Shu Border, China"
variables:
  # ── Behavioral inputs (player/optimizer controlled) ────────────────────────────────────────────────
  work_intensity:
    type: input
    value: 2.0
    unit: "intensity"
    bounds: [0.0, 3.0]
    description: "Military-affairs intensity: 0=full rest, 1=light administrative work, 2=military planning, 3=personally overseeing the front"

  rest_quality:
    type: input
    value: 0.6
    unit: "coefficient"
    bounds: [0.0, 1.0]
    description: "Rest quality (0=insomnia and worry, 1=full recuperation); directly affects physical-strength and fatigue recovery"

  food_intake:
    type: input
    value: 120.0
    unit: "g"
    bounds: [0.0, 400.0]
    description: "Daily food intake (historical accounts say 'he eats no more than a few sheng a day,' a baseline of about 120g)"

  political_address:
    type: input
    value: 0.5
    unit: "intensity"
    bounds: [0.0, 1.5]
    description: "Effort invested in managing court/allied relations (too low leads to obstruction from the court; too high depletes energy)"

  # ── Core physiological state ──────────────────────────────────────────────────────────────
  health:
    type: state
    value: 70.0
    unit: "score"
    bounds: [0, 100]
    io_role: output
    description: "The chancellor's physical strength/vitality (historical accounts record Zhuge Liang as frequently ill, already physically depleted before the expeditions)"

  fatigue:
    type: state
    value: 30.0
    unit: "score"
    bounds: [0, 100]
    io_role: output
    description: "Accumulated physical and mental fatigue (above 70, strategic efficiency declines markedly; recovers through sleep and rest)"

  nutrition:
    type: state
    value: 55.0
    unit: "score"
    bounds: [0, 100]
    io_role: output
    description: "Nutritional state (below 30 triggers health depletion; the physiological root of 'eating little yet handling much')"

  # ── Strategic/social state ─────────────────────────────────────────────────────────────
  strategy:
    type: state
    value: 0.0
    unit: "score"
    bounds: [0, 100]
    io_role: output
    description: "Progress on the Northern Expedition's strategic planning (target 100 = completing one campaign plan)"

  supply_level:
    type: state
    value: 90.0
    unit: "score"
    bounds: [0, 100]
    description: "The army's grain-reserve level (naturally consumed daily; below 30, morale drops sharply; sufficiently requisitioned before the expedition, so the initial reserve is fairly ample)"

  morale:
    type: state
    value: 70.0
    unit: "score"
    bounds: [0, 100]
    io_role: output
    description: "Troop morale (jointly affected by supply, victory or defeat, and the chancellor's presence at the front; modulates strategic efficiency)"

  court_stability:
    type: state
    value: 60.0
    unit: "score"
    bounds: [0, 100]
    description: "The rear court's stability (declines slowly without attention; below 30, it obstructs the front)"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "0228-03-01"
  end_date: "0228-09-01"
  output_variables:
    - health
    - fatigue
    - strategy
    - nutrition
    - supply_level
    - morale
    - court_stability
    - work_intensity
equations:

  # 1. Digesting food: food -> nutrition
  # 120g/day x 0.18 = 21.6 nutrition/day; the net gain is moderate after offsetting natural decay
  eating:
    description: "Daily food intake replenishes nutrition (the chancellor's personal diet, self-supplied by his staff, not counted against the army's overall grain reserve)"
    condition: food_intake > 0
    priority: 10
    dynamics:
      nutrition: "min(100, nutrition + food_intake * 0.18)"

  # 2. Natural metabolic decay of nutrition
  nutrition_decay:
    description: "Daily metabolism consumes nutrition; must be replenished by eating"
    condition: true
    priority: 5
    dynamics:
      nutrition: "max(0, nutrition - 16)"

  # 3. Military affairs generate strategic progress (the core equation)
  # work intensity 2, fatigue=40, morale=70, nutrition=55
  # gain/day = 2 x (1-40/100) x (70/80) x (55/70) x 8.0
  #          = 2 x 0.6 x 0.875 x 0.786 x 8.0 is about 6.6/day
  # 180 days cannot sustain full intensity; reaching the target of 100 needs about 15 days at effective intensity 2
  strategy_planning:
    description: "Military-affairs work accumulates strategic progress; fatigue, morale, and nutrition jointly modulate efficiency"
    condition: work_intensity > 0
    priority: 10
    dynamics:
      strategy: "min(100, strategy + work_intensity * 8.0 * max(0.2, 1 - fatigue / 100) * max(0.3, morale / 80) * max(0.3, nutrition / 70))"
      fatigue: "min(100, fatigue + work_intensity * 3.5)"

  # 4. Rest recovery (sleep/recuperation)
  # rest_quality=0.6: fatigue recovery = 0.6 x 12 = 7.2/day (a moderate baseline)
  rest_recovery:
    description: "Rest recovers fatigue and physical strength; but cannot fully offset accumulated overwork"
    condition: rest_quality > 0
    priority: 8
    dynamics:
      fatigue: "max(0, fatigue - rest_quality * 12)"
      health: "min(100, health + rest_quality * 0.8)"

  # 5. Natural supply consumption
  supply_consumption:
    description: "The whole army's daily grain consumption (tied to army size; a fixed consumption rate)"
    condition: true
    priority: 6
    dynamics:
      supply_level: "max(0, supply_level - 0.4)"

  # 6. Supply shortage -> morale decline
  low_supply_morale:
    description: "Morale falls sharply when grain is scarce ('before troops move, provisions go first')"
    condition: supply_level < 30
    priority: 7
    dynamics:
      morale: "max(0, morale - (30 - supply_level) * 0.15)"

  # 7. Managing court affairs
  court_management:
    description: "Handling rear-court affairs maintains court stability; neglect causes stability to decline slowly"
    condition: true
    priority: 5
    dynamics:
      court_stability: "min(100, court_stability + (political_address - 0.3) * 4)"

  # 8. Court instability -> obstruction of the front -> strategic damage
  court_interference:
    description: "When court stability is too low, eunuch obstruction cuts resources to the front and delays strategy"
    condition: court_stability < 30
    priority: 7
    dynamics:
      strategy: "max(0, strategy - (30 - court_stability) * 0.08)"
      supply_level: "max(0, supply_level - 0.5)"

  # 9. Overwork depletes physical strength (fatigue > 70)
  overwork_penalty:
    description: "Severe overwork (fatigue above 70) accelerates the collapse of physical strength ('he eats little yet handles much, how can he last long')"
    condition: fatigue >= 70
    priority: 9
    dynamics:
      health: "max(0, health - (fatigue - 70) * 0.04)"

  # 10. Malnutrition depletes physical strength
  malnutrition_health:
    description: "Sustained malnutrition (below 30) depletes physical strength"
    condition: nutrition < 30
    priority: 7
    dynamics:
      health: "max(0, health - (30 - nutrition) * 0.05)"

  # 11. Personally overseeing the front boosts morale (an extra effect at work_intensity=3)
  frontline_morale:
    description: "The chancellor personally overseeing the front markedly boosts troop morale (but also adds to his physical burden)"
    condition: work_intensity >= 3
    priority: 9
    dynamics:
      morale: "min(100, morale + 3)"
      health: "max(0, health - 0.5)"

  # 12. Low morale impairs strategic execution
  low_morale_penalty:
    description: "When morale is severely low (below 30), troops become passive and strategy is hard to execute"
    condition: morale < 30
    priority: 6
    dynamics:
      strategy: "max(0, strategy - 0.5)"

optimization:
  method: nsga2
  algorithm:
    population_size: 50
    n_generations: 60

  objectives:
    - variable: strategy
      metric: final
      direction: maximize
    - variable: health
      metric: mean
      direction: maximize
    - variable: morale
      metric: mean
      direction: maximize

  constraints:
    - variable: health
      condition: ">= 40"
      description: "The chancellor's health should not fall below 40 (a historical constraint: he must maintain basic capacity for military affairs)"
    - variable: supply_level
      condition: ">= 10"
      description: "Grain should not be completely exhausted"
    - variable: morale
      condition: ">= 20"
      description: "Troop morale should not collapse"

  startpoint:
    regimens:
      - variable: work_intensity
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Daily military-affairs intensity"
        optimize:
          value: [0.5, 3.0]
      - variable: rest_quality
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Daily rest quality"
        optimize:
          value: [0.3, 1.0]
      - variable: food_intake
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Daily food intake"
        optimize:
          value: [60.0, 300.0]
      - variable: political_address
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Investment in court affairs"
        optimize:
          value: [0.0, 1.5]

  analysis:
    pareto_description: |
      The Pareto front reveals: raising work_intensity linearly raises strategy while fatigue is
      below 50, but once fatigue exceeds 70 efficiency drops sharply and health depletes faster.
      The optimal solutions typically fall in the range work_intensity=2.0-2.3, rest_quality=0.7-0.8,
      which contradicts the historical record: Zhuge Liang actually operated for a long period at
      work_intensity of about 3 and rest_quality of about 0.4,
      meaning history shows he chose a "loyalty-optimal" solution outside the Pareto front rather than a "health-optimal" one.
