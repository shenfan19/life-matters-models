category: social
metadata:
  todo:
    - type: noref
      issue: "Lacks sufficient literature citation support (migrated from the old filename's _noref suffix)"
      evidence: "Migrated from the legacy _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check and supply the missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: eu1800_dk_little_match_girl
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      The little match girl (Andersen, 1845) faces a triple tradeoff over 10 hours on New Year's
      Eve: how hard to try selling matches, possibly earning money but depleting body heat faster in
      the sub-zero cold; burning matches for warmth, bringing brief warmth and hallucination to ease
      her pain, but each match is a finite, non-renewable resource; and seeking shelter from the
      wind, possibly slowing the rate of heat loss, but hindered by systematic indifference and a
      child's isolation. The threat of her father's punishment forecloses the option of going home,
      and systemic social indifference makes seeking help nearly impossible.
    result: >
      The simulation is expected to show the hourly dynamics of body temperature, remaining
      matches, and survival probability across 10 hours. This is currently a draft, with parameters
      still to be calibrated.
    limitations: A draft; parameters, objectives, and narrative details still need calibration; the hypothermia physiological parameters need grounding in medical literature; a literary setting.
  ratings:
    variable: 0.0 - All 7 variables are marked TODO:SOURCE, with the hypothermia physiological parameters not anchored to medical literature
    equation: 0.0 - All 5 equations are purely self-built for the narrative, with reference marked TODO:SOURCE
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 10-hour trajectory normally, not yet compared point-by-point against independent data
    optimization: 0.0 - coins_earned and body_temperature show no opposing drive when traced through the equations, and matches_remaining is not wired into selling_outcome; verified on 2026-09-04 that --opt converges to a single front point (0.3,20), numerically confirming no tradeoff
    importance: 0.5 - The Little Match Girl is one of the most widely read fairy tales in the world, but this is a literary setting, not a module the framework depends on
    innovation: 0.5 - Converting literary narrative tension into an optimizable dynamical system, with the core decision-tradeoff structure carried over from a known framework
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared against an independent literature target
  tags:
    - poverty
    - child
    - cold
    - social-neglect
    - hallucination
    - literature
variables:
  match_selling_effort:
    type: input
    value: 0.5
    unit: intensity
    bounds:
      - 0
      - 1
    description: How hard she tries to sell matches, actively asking passersby to buy (raises the success rate, but consumes energy)
    reference: TODO:SOURCE
  match_burning:
    type: input
    value: 0.5
    unit: matches_per_hour
    bounds:
      - 0
      - 3
    description: Burning matches for warmth, striking a match for a moment of warmth (consumes her stock, brings hallucination and a feeling of warmth)
    reference: TODO:SOURCE
  shelter_seeking:
    type: input
    value: 0.3
    unit: intensity
    bounds:
      - 0
      - 1
    description: Seeking shelter from the wind, huddling against a street corner or wall to reduce heat loss
    reference: TODO:SOURCE
  body_temperature:
    type: state
    value: 35.5
    unit: celsius
    bounds:
      - 20
      - 37
    description: Body temperature, a core-temperature physiological indicator of hypothermia (36.5=normal, below 32=dangerous, below 28=fatal)
    reference: TODO:SOURCE
    io_role: output
  matches_remaining:
    type: state
    value: 80
    unit: count
    bounds:
      - 0
      - 100
    description: Remaining matches, the number not yet burned or sold
    reference: TODO:SOURCE
    io_role: output
  warmth_feeling:
    type: state
    value: 10
    unit: score
    bounds:
      - 0
      - 100
    description: A feeling of warmth (hallucinatory), the subjective warmth brought by matchlight, a psychological state decoupled from actual body temperature
    reference: TODO:SOURCE
    io_role: output
  hope:
    type: state
    value: 40
    unit: score
    bounds:
      - 0
      - 100
    description: A sense of hope, anticipation of rescue or a miracle (may intensify into hallucination as body temperature falls)
    reference: TODO:SOURCE
    io_role: output
  coins_earned:
    type: state
    value: 0
    unit: score
    bounds:
      - 0
      - 100
    description: Income from sales, copper coins earned from selling matches (the key to whether she can go home)
    reference: TODO:SOURCE
    io_role: output
equations:
  temperature_loss:
    dynamics:
      body_temperature: max(20, body_temperature - (0.8) + (shelter_seeking * 0.4) + (match_burning * 0.3))
    description: Body temperature falls over time, slowed by warmth and shelter
    reference: TODO:SOURCE
  match_consumption:
    dynamics:
      matches_remaining: max(0, matches_remaining - match_burning)
    description: Matches are consumed by burning
    reference: TODO:SOURCE
  selling_outcome:
    dynamics:
      coins_earned: min(100, coins_earned + (match_selling_effort * 3.0 * (max(0.1, (body_temperature - 28) / 9.0))))
    description: Selling success is affected by body temperature (functional capacity) and match stock
    reference: TODO:SOURCE
  warmth_feeling_dynamics:
    dynamics:
      warmth_feeling: max(0, min(100, warmth_feeling + (match_burning * 15.0 * (max(1.0, (36 - body_temperature) * 0.5))) - (8.0)))
    description: The feeling of warmth varies jointly with match burning and body temperature; hallucination intensity rises at low body temperature
    reference: TODO:SOURCE
  hope_dynamics:
    dynamics:
      hope: max(0, hope - 3.0 + coins_earned * 0.1)
    description: As body temperature falls, hope intensifies in hallucinatory form (a neurological symptom of hypothermia)
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: hour
  start_date: '1800-12-31'
  end_date: '1800-12-31'
  output_types:
    - input
    - state
optimization:
  method: nsga2
  objectives:
    - variable: coins_earned
      metric: final
      direction: maximize
    - variable: body_temperature
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: match_selling_effort
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: How hard she tries to sell matches
        optimize:
          value:
            - 0
            - 1
      - variable: match_burning
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Burning matches for warmth
        optimize:
          value:
            - 0
            - 3
      - variable: shelter_seeking
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Seeking shelter from the wind
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - The Little Match Girl (Hans Christian Andersen, 1845)
