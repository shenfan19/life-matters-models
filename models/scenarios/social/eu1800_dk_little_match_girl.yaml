  name: eu1800_dk_little_match_girl
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      卖火柴的小女孩（安徒生，1845）在新年前夜 10 小时内面临三重权衡：叫卖努力程度，即可能卖出火柴获得报酬，但在零下气温中会更快消耗体温；燃烧火柴取暖，即带来短暂温暖和幻觉以缓解痛苦，但每根火柴是有限且不可再生的资源；以及寻找避风处，即可能降低失温速率，但受系统性冷漠和儿童孤立阻碍。父亲的惩罚威胁使返家选项封闭，系统性社会冷漠使求助几乎不可能。
    result: >
      仿真预期显示 10 小时内体温、剩余火柴数量和生存概率的小时动态。当前为草案状态，参数待校准。
    limitations: 草案，参数、目标和叙事细节待校准；失温生理参数需参考医学文献；文学设定。
  ratings:
    variable: 0.0 - 全部7个变量均标注TODO:SOURCE，失温生理参数未锚定医学文献
    equation: 0.0 - 5条方程均为纯叙事自建，reference标注TODO:SOURCE
    simulation: 0.5 - 配置完整，变量/方程/仿真区间齐全，但标记nosim尚未实际运行验证
    optimization: 0.0 - coins_earned与body_temperature经方程追踪无对立驱动，matches_remaining未接入selling_outcome
    importance: 0.5 - 《卖火柴的小女孩》是全球最广泛阅读的童话之一，但为文学设定，非框架依赖模块
    innovation: 0.5 - 将文学叙事张力转化为可优化动力学系统，核心决策权衡结构沿用已知框架
    confidence: 0.0 - 尚未验证：未跑通--sim/--opt，此前fan分支曾标注0.25但未核实实际运行状态，予以更正
  tags:
    - poverty
    - child
    - cold
    - social-neglect
    - hallucination
    - literature
  references:
    - 卖火柴的小女孩 (Hans Christian Andersen, 1845)
variables:
  match_selling_effort:
    type: input
    value: 0.5
    unit: intensity
    bounds:
      - 0
      - 1
    description: 叫卖努力程度：主动向路人请求购买火柴（增加成功率，但消耗体力）
    reference: TODO:SOURCE
  match_burning:
    type: input
    value: 0.5
    unit: matches_per_hour
    bounds:
      - 0
      - 3
    description: 燃烧火柴取暖：划燃火柴取得片刻温暖（消耗存货，带来幻觉和温暖感）
    reference: TODO:SOURCE
  shelter_seeking:
    type: input
    value: 0.3
    unit: intensity
    bounds:
      - 0
      - 1
    description: 寻找避风处：在街角墙壁等处躲风，减少寒冷损耗
    reference: TODO:SOURCE
  body_temperature:
    type: state
    value: 35.5
    unit: celsius
    bounds:
      - 20
      - 37
    description: 体温：核心体温：低温症的生理指标（36.5=正常，<32=危险，<28=致命）
    reference: TODO:SOURCE
    io_role: output
  matches_remaining:
    type: state
    value: 80
    unit: count
    bounds:
      - 0
      - 100
    description: 剩余火柴：尚未燃烧或卖出的火柴数量
    reference: TODO:SOURCE
    io_role: output
  warmth_feeling:
    type: state
    value: 10
    unit: score
    bounds:
      - 0
      - 100
    description: 温暖感（幻觉）：火柴光带来的主观温暖感——与体温解耦的心理状态
    reference: TODO:SOURCE
    io_role: output
  hope:
    type: state
    value: 40
    unit: score
    bounds:
      - 0
      - 100
    description: 希望感：对救助或奇迹的期待（随体温下降可能增幻觉）
    reference: TODO:SOURCE
    io_role: output
  coins_earned:
    type: state
    value: 0
    unit: score
    bounds:
      - 0
      - 100
    description: 售出收入：卖出火柴赚到的铜板（是否能回家的关键）
    reference: TODO:SOURCE
    io_role: output
equations:
  temperature_loss:
    dynamics:
      body_temperature: max(20, body_temperature - (0.8) + (shelter_seeking * 0.4) + (match_burning * 0.3))
    description: 体温随时间下降，取暖和避风可减缓
    reference: TODO:SOURCE
  match_consumption:
    dynamics:
      matches_remaining: max(0, matches_remaining - match_burning)
    description: 火柴被燃烧消耗
    reference: TODO:SOURCE
  selling_outcome:
    dynamics:
      coins_earned: min(100, coins_earned + (match_selling_effort * 3.0 * (max(0.1, (body_temperature - 28) / 9.0))))
    description: 叫卖成功率受体温（行动能力）和火柴库存影响
    reference: TODO:SOURCE
  warmth_feeling_dynamics:
    dynamics:
      warmth_feeling: max(0, min(100, warmth_feeling + (match_burning * 15.0 * (max(1.0, (36 - body_temperature) * 0.5))) - (8.0)))
    description: 温暖感随火柴燃烧和体温共同变化；低体温时幻觉强度增加
    reference: TODO:SOURCE
  hope_dynamics:
    dynamics:
      hope: max(0, hope - 3.0 + coins_earned * 0.1)
    description: 希望感随体温下降而以幻觉形式增强（低温神经症状）
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: hour
  start_date: '1800-12-31'
  end_date: '1800-12-31'
  output_types:
    - input
    - state
optimizer:
  method: nsga2
  objectives:
    - variable: coins_earned
      metric: final
      direction: maximize
    - variable: body_temperature
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: match_selling_effort
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 叫卖努力程度
        optimize:
          value:
            - 0
            - 1
      - variable: match_burning
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 燃烧火柴取暖
        optimize:
          value:
            - 0
            - 3
      - variable: shelter_seeking
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 寻找避风处
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
