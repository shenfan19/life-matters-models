  name: ad2077_nightcity_v
  lm_format_version: "1.0"
  updated: 2026-05-23
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      夜之城 2077 年背景下，玩家角色 V 面临三重约束：植入体，即 Cyberware，能强化战斗力，但会积累 Cyberpsychosis 风险，即 Humanity 属性的损耗；Relic 芯片持续消耗神经系统；此外还面临 NCPD、企业和帮派的三重外部威胁。具体人物弧线，即主线、义体侠客或街头小子起源，待确定。
    result: >
      仿真窗口已预置为 2077-01-01 至 2077-06-30，Cyberware 量化参数和 Relic 进展速率有待从游戏机制反推后填写，仿真尚未运行；该文件目前是等待补全的占位模型。
    limitations: 完全虚构，无学术来源；参数需从游戏机制反推；模型尚未实现。
  ratings:
    variable: 0.0 - TODO存根，variables为空，且完全虚构无学术来源
    equation: 0.0 - TODO存根，equations为空未定义任何方程
    simulation: 0.0 - TODO存根，无可用方程与输出变量，无法产生仿真轨迹
    optimization: 0.0 - 无optimization块，模型设计上尚不含决策变量
    importance: 0.25 - 科幻游戏设定，跨媒体传播价值中等，学术场景复用度有限，且为TODO存根
    innovation: 0.25 - 人机融合与Cyberpsychosis的量化建模意图有趣，但尚未实现无法评估实际创新程度
    confidence: 0.0 - 仅有静态占位声明，未跑通--sim/--opt
