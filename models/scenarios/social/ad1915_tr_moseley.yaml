  name: ad1915_tr_moseley
  lm_format_version: "1.0"
  updated: 2026-07-24
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      物理学家 Henry Moseley 生于 1887 年，提出"莫斯利定律"，为原子序数概念和元素周期表提供了实验基础。1915 年 8 月他作为通讯军官在加里波利战役 Chunuk Bair 前线传递炮兵指令时被狙击手击中身亡。他的阵亡直接促使英国此后调整政策，限制将顶尖科学人才派往前线作战。本场景与 ad1940_fr_doeblin 同属"前线暴露强度 → 死亡概率"与"科研生产力轨迹 → 预期未来贡献"并列建模的系列，量化科学人才战场减员的机会成本，而非评判具体战役决策，具体参数化路径待确定。
    result: >
      仿真窗口已预置，覆盖 1915 年 8 月 6 日 Chunuk Bair 战斗至 8 月 10 日 Moseley 阵亡当日；变量和方程待参数化路径确定后填写，该场景尚未实际运行仿真。
    limitations: >
      "预期未来科研贡献"变量的构造方式存在方法论争议，需谨慎处理反事实推断的不确定性；通讯军官岗位的暴露强度量化尚未完成；需参考 Heilbron 1974。
