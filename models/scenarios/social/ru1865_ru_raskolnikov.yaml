category: social
metadata:
  todo:
    - type: noref
      issue: "Lacks sufficient literature citation support (migrated from the old filename's _noref suffix)"
      evidence: "Migrated from the legacy _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check and supply the missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: ru1865_ru_raskolnikov
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      After murdering the pawnbroker, Raskolnikov (Dostoevsky's Crime and Punishment, 1866) faces
      a triple tension: effort spent concealing the crime lowers the risk of arrest, but worsens a
      "moral fever" that intensifies his psychiatric symptoms; seeking spiritual redemption, contact
      with Sonya can ease his psychological collapse, but raises the risk of exposure; and the
      degree of social withdrawal can reduce the probability of being discovered, but accelerates his
      disconnection from reality. Porfiry's interrogation and his own psychological fever form a dual
      pressure, tracing a 90-day psychological-collapse trajectory from crime to confession.
    result: >
      The simulation is expected to show the daily dynamics of mental health, arrest risk, and
      redemption progress across 90 days. This is currently a draft, with parameters still to be
      calibrated.
    limitations: A draft; parameters, objectives, and narrative details still need calibration; a literary setting with no objective historical data.
  ratings:
    variable: 0.0 - All 7 variables are marked TODO:SOURCE, a purely literary setting with no objective data
    equation: 0.0 - All 5 equations are purely self-built for the narrative, with reference marked TODO:SOURCE
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 90-day trajectory normally, not yet compared point-by-point against independent data
    optimization: 0.0 - redemption_potential and mental_health show no opposing drive when traced through the equations, with spiritual_seeking benefiting both objectives at once; verified on 2026-09-04 that --opt converges to a single front point (100,100), numerically confirming no tradeoff
    importance: 0.5 - Crime and Punishment is the pinnacle of the psychological crime novel, but this is a literary setting, not a module the framework depends on
    innovation: 0.5 - Converting literary narrative tension into an optimizable dynamical system, with the core decision-tradeoff structure carried over from a known framework
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared against an independent literature target
  tags:
    - poverty
    - crime
    - mental-health
    - fever
    - redemption
    - literature
variables:
  concealment_effort:
    type: input
    value: 0.6
    unit: intensity
    bounds:
      - 0
      - 1
    description: Effort spent concealing the crime, actively erasing traces, controlling his behavior, and avoiding exposure
    reference: TODO:SOURCE
  spiritual_seeking:
    type: input
    value: 0.2
    unit: intensity
    bounds:
      - 0
      - 1
    description: Seeking spiritual redemption, genuine contact with Sonya and others, seeking a moral way out
    reference: TODO:SOURCE
  social_withdrawal:
    type: input
    value: 0.7
    unit: intensity
    bounds:
      - 0
      - 1
    description: The degree of social withdrawal, refusing human contact and living in isolation (safer, but collapses faster)
    reference: TODO:SOURCE
  mental_health:
    type: state
    value: 45
    unit: score
    bounds:
      - 0
      - 100
    description: Mental state, a composite of guilt, fever, delusion, and psychological fragmentation (high=stable)
    reference: TODO:SOURCE
    io_role: output
  fever_level:
    type: state
    value: 30
    unit: score
    bounds:
      - 0
      - 100
    description: Fever intensity, physiological fever induced by psychological trauma (a Dostoevskian symptom)
    reference: TODO:SOURCE
    io_role: output
  detection_risk:
    type: state
    value: 10
    unit: score
    bounds:
      - 0
      - 100
    description: The risk of detection, how much investigators like Porfiry gradually tighten the net
    reference: TODO:SOURCE
    io_role: output
  redemption_potential:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: Redemption potential, the inner energy driving him toward confession and spiritual rebuilding
    reference: TODO:SOURCE
    io_role: output
  guilt_pressure:
    type: state
    value: 60
    unit: score
    bounds:
      - 0
      - 100
    description: Guilt pressure, an inescapable moral weight
    reference: TODO:SOURCE
    io_role: output
equations:
  fever_dynamics:
    dynamics:
      fever_level: min(100, max(0, fever_level + ((guilt_pressure / 100) * 2.0) - (spiritual_seeking * 1.5)))
    description: Fever rises with guilt pressure, and spiritual seeking can ease it
    reference: TODO:SOURCE
  mental_health_change:
    dynamics:
      mental_health: max(0, min(100, mental_health - ((fever_level / 100) * 2.5) - (concealment_effort * 1.2) - (social_withdrawal * 0.8) + (spiritual_seeking * 2.0)))
    description: Mental state is depleted by fever, concealment effort, and isolation
    reference: TODO:SOURCE
  detection_progression:
    dynamics:
      detection_risk: min(100, detection_risk + (1.5) - (concealment_effort * 0.8) + ((guilt_pressure / 100) * 1.0))
    description: The investigation advances over time, and concealment effort can briefly delay it
    reference: TODO:SOURCE
  guilt_dynamics:
    dynamics:
      guilt_pressure: min(100, max(0, guilt_pressure + (1.0 + social_withdrawal * 0.5) - (spiritual_seeking * 2.5)))
    description: Guilt grows over time, and only spiritual seeking can genuinely reduce it
    reference: TODO:SOURCE
  redemption_growth:
    dynamics:
      redemption_potential: min(100, redemption_potential + (spiritual_seeking * 3.0 * (1 - concealment_effort * 0.5)))
    description: Redemption potential grows with spiritual seeking, requiring him to accept suffering rather than conceal it
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: day
  start_date: '1865-06-01'
  end_date: '1865-08-29'
  output_types:
    - input
    - state
optimization:
  method: nsga2
  objectives:
    - variable: redemption_potential
      metric: final
      direction: maximize
    - variable: mental_health
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: concealment_effort
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Effort spent concealing the crime
        optimize:
          value:
            - 0
            - 1
      - variable: spiritual_seeking
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Seeking spiritual redemption
        optimize:
          value:
            - 0
            - 1
      - variable: social_withdrawal
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: The degree of social withdrawal
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - Crime and Punishment (Dostoyevsky, 1866)
