  name: ru1865_ru_raskolnikov
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      拉斯柯尔尼科夫（陀思妥耶夫斯基《罪与罚》1866）谋杀放贷人后面临三重张力：掩盖罪行努力，即能降低被捕风险，但会加剧「道德发烧」，使精神症状恶化；精神救赎寻求，即与索尼娅的接触能减缓心理崩溃，但会增加暴露风险；以及社会退缩程度，即能减少被发现的概率，但会加速与现实脱节。波尔菲里的审讯和自身精神发烧构成双重压力，形成 90 天内从犯罪到坦白的心理崩溃轨迹。
    result: >
      仿真预期显示 90 天内精神健康、被捕风险和救赎进度的日动态。当前为草案状态，参数待校准。
    limitations: 草案，参数、目标和叙事细节待校准；文学设定，无客观历史数据。
  ratings:
    variable: 0.0 - 全部7个变量均标注TODO:SOURCE，纯文学设定无客观数据
    equation: 0.0 - 5条方程均为纯叙事自建，reference标注TODO:SOURCE
    simulation: 0.5 - 配置完整，变量/方程/仿真区间齐全，但标记nosim尚未实际运行验证
    optimization: 0.0 - redemption_potential与mental_health经方程追踪无对立驱动，spiritual_seeking同时有利两目标
    importance: 0.5 - 《罪与罚》是心理犯罪小说的巅峰，但为文学设定，非框架依赖模块
    innovation: 0.5 - 将文学叙事张力转化为可优化动力学系统，核心决策权衡结构沿用已知框架
    confidence: 0.0 - 尚未验证：未跑通--sim/--opt，此前fan分支曾标注0.25但未核实实际运行状态，予以更正
  tags:
    - poverty
    - crime
    - mental-health
    - fever
    - redemption
    - literature
  references:
    - Crime and Punishment (Dostoyevsky, 1866)
variables:
  concealment_effort:
    type: input
    value: 0.6
    unit: intensity
    bounds:
      - 0
      - 1
    description: 掩盖罪行努力：主动消除痕迹、控制表现、避免暴露
    reference: TODO:SOURCE
  spiritual_seeking:
    type: input
    value: 0.2
    unit: intensity
    bounds:
      - 0
      - 1
    description: 精神救赎寻求：与索尼娅等人的真实交流，寻求道德出路
    reference: TODO:SOURCE
  social_withdrawal:
    type: input
    value: 0.7
    unit: intensity
    bounds:
      - 0
      - 1
    description: 社会退缩程度：拒绝人际接触、独居程度（越高越安全，也越快崩溃）
    reference: TODO:SOURCE
  mental_health:
    type: state
    value: 45
    unit: score
    bounds:
      - 0
      - 100
    description: 精神状态：罪恶感·发烧·妄想·心理分裂的综合状态（高=稳定）
    reference: TODO:SOURCE
    io_role: output
  fever_level:
    type: state
    value: 30
    unit: score
    bounds:
      - 0
      - 100
    description: 发烧强度：心理创伤导致的生理发热（陀思妥耶夫斯基式症状）
    reference: TODO:SOURCE
    io_role: output
  detection_risk:
    type: state
    value: 10
    unit: score
    bounds:
      - 0
      - 100
    description: 被侦探发现的风险：波费利等侦探逐渐收紧包围圈的程度
    reference: TODO:SOURCE
    io_role: output
  redemption_potential:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: 救赎可能性：走向自首和灵魂重建的内在能量
    reference: TODO:SOURCE
    io_role: output
  guilt_pressure:
    type: state
    value: 60
    unit: score
    bounds:
      - 0
      - 100
    description: 罪恶感压力：无法逃避的道德重量
    reference: TODO:SOURCE
    io_role: output
equations:
  fever_dynamics:
    dynamics:
      fever_level: min(100, max(0, fever_level + ((guilt_pressure / 100) * 2.0) - (spiritual_seeking * 1.5)))
    description: 发烧随罪恶压力增高，精神寻求可缓解
    reference: TODO:SOURCE
  mental_health_change:
    dynamics:
      mental_health: max(0, min(100, mental_health - ((fever_level / 100) * 2.5) - (concealment_effort * 1.2) - (social_withdrawal * 0.8) + (spiritual_seeking * 2.0)))
    description: 精神状态受发烧·掩盖努力·孤立的消耗
    reference: TODO:SOURCE
  detection_progression:
    dynamics:
      detection_risk: min(100, detection_risk + (1.5) - (concealment_effort * 0.8) + ((guilt_pressure / 100) * 1.0))
    description: 侦探的追踪随时间推进，掩盖努力可短暂延缓
    reference: TODO:SOURCE
  guilt_dynamics:
    dynamics:
      guilt_pressure: min(100, max(0, guilt_pressure + (1.0 + social_withdrawal * 0.5) - (spiritual_seeking * 2.5)))
    description: 罪恶感随时间增长，只有精神寻求可真正减少
    reference: TODO:SOURCE
  redemption_growth:
    dynamics:
      redemption_potential: min(100, redemption_potential + (spiritual_seeking * 3.0 * (1 - concealment_effort * 0.5)))
    description: 救赎可能性随精神寻求增长，需要接受痛苦（非掩盖）
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: day
  start_date: '1865-06-01'
  end_date: '1865-08-29'
  output_types:
    - input
    - state
optimizer:
  method: nsga2
  objectives:
    - variable: redemption_potential
      metric: final
      direction: maximize
    - variable: mental_health
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: concealment_effort
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 掩盖罪行努力
        optimize:
          value:
            - 0
            - 1
      - variable: spiritual_seeking
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 精神救赎寻求
        optimize:
          value:
            - 0
            - 1
      - variable: social_withdrawal
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 社会退缩程度
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
