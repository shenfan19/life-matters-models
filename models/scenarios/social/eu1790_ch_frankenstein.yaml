category: social
metadata:
  todo:
    - type: noref
      issue: "Lacks sufficient literature citation support (migrated from the old filename's _noref suffix)"
      evidence: "Migrated from the legacy _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check and supply the missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: eu1790_ch_frankenstein
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      After fleeing his creation, Victor Frankenstein (Mary Shelley's Frankenstein, 1818) faces a
      triple tension: suppressing knowledge of the creature's existence lowers the immediate threat
      but accumulates the creature's drive for revenge; confronting the creature and accepting
      responsibility might resolve the conflict but demands an extreme psychological cost; and
      continuing his research, whether attempting to solve the problem or building a second
      creature. Every step the creator takes to refuse responsibility strengthens the creature's
      drive for revenge, and those closest to him die one after another.
    result: >
      The simulation is expected to show the trajectories of Frankenstein's physical state, degree
      of mental breakdown, and the creature's revenge intensity across 30 months. This is currently
      a draft, with parameters still to be calibrated.
    limitations: A draft; parameters, objectives, and narrative details still need calibration; a literary setting with no objective historical data.
  ratings:
    variable: 0.0 - All 7 variables are marked TODO:SOURCE, a purely literary setting with no objective data
    equation: 0.0 - All 5 equations are purely self-built for the narrative, with reference marked TODO:SOURCE
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 30-month trajectory normally, not yet compared point-by-point against independent data
    optimization: 0.0 - relationships_intact and health show no opposing drive when traced through the equations, and confrontation_willingness benefits both objectives in the same direction; verified on 2026-09-04 that --opt converges to a single front point (88.9,81.9), numerically confirming no tradeoff
    importance: 0.5 - Frankenstein is the most classic literary metaphor for scientific ethics and creator responsibility, but this is a literary setting, not a module the framework depends on
    innovation: 0.5 - Converting literary narrative tension into an optimizable dynamical system, with the core decision-tradeoff structure carried over from a known framework
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared against an independent literature target
  tags:
    - science
    - ethics
    - isolation
    - obsession
    - literature
variables:
  concealment_effort:
    type: input
    value: 0.5
    unit: intensity
    bounds:
      - 0
      - 1
    description: Suppressing knowledge of the creature's existence, whether he actively suppresses news of it and how much he keeps secret
    reference: TODO:SOURCE
  confrontation_willingness:
    type: input
    value: 0.2
    unit: intensity
    bounds:
      - 0
      - 1
    description: Willingness to confront the creature, whether he attempts to communicate with or face the creature (rather than flee)
    reference: TODO:SOURCE
  research_continuation:
    type: input
    value: 1.0
    unit: intensity
    bounds:
      - 0
      - 2
    description: The intensity of continued research, whether he keeps advancing his scientific work (to control or destroy the creature)
    reference: TODO:SOURCE
  health:
    type: state
    value: 85
    unit: hp
    bounds:
      - 0
      - 100
    description: Victor's vitality, his physical health, a composite of overexertion, the Arctic chase, and mental breakdown
    reference: TODO:SOURCE
    io_role: output
  ethical_burden:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: Ethical burden, the moral weight of unaccepted responsibility, accumulating through avoidance, easing through confrontation
    reference: TODO:SOURCE
    io_role: output
  relationships_intact:
    type: state
    value: 90
    unit: score
    bounds:
      - 0
      - 100
    description: Surviving relationships, the survival status of those closest to him, William, Justine, Clerval, Elizabeth, and others
    reference: TODO:SOURCE
    io_role: output
  creature_threat:
    type: state
    value: 10
    unit: score
    bounds:
      - 0
      - 100
    description: The creature's threat level, the intensity of its revenge actions, rising when ignored, potentially negotiable when confronted
    reference: TODO:SOURCE
    io_role: output
  scientific_control:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: Scientific control over the creature, whether research can understand, control, or destroy it
    reference: TODO:SOURCE
    io_role: output
equations:
  creature_growth:
    dynamics:
      creature_threat: min(100, creature_threat + (3.0 * (1 - confrontation_willingness) - 1.5 * confrontation_willingness))
    description: The creature's threat grows with avoidance, and can be eased by confrontation
    reference: TODO:SOURCE
  relationship_decay:
    dynamics:
      relationships_intact: max(0, relationships_intact - ((creature_threat / 100) * 4.0))
    description: The higher the threat, the faster relationships are lost
    reference: TODO:SOURCE
  ethical_accumulation:
    dynamics:
      ethical_burden: min(100, max(0, ethical_burden + (2.5 * (1 - confrontation_willingness) - 1.0 * confrontation_willingness)))
    description: Avoidance rapidly grows the ethical burden; confrontation can slowly unload it
    reference: TODO:SOURCE
  health_decay:
    dynamics:
      health: max(0, health - (research_continuation * 1.2) - ((ethical_burden / 100) * 1.5) - ((creature_threat / 100) * 0.8))
    description: Research, ethical burden, and threat together deplete health
    reference: TODO:SOURCE
  scientific_progress:
    dynamics:
      scientific_control: min(100, scientific_control + research_continuation * 2.0)
    description: Research advances scientific control, but cannot directly lower the threat (confrontation is also needed)
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: month
  start_date: '1790-01-01'
  end_date: '1792-06-30'
  output_types:
    - input
    - state
optimization:
  method: nsga2
  objectives:
    - variable: relationships_intact
      metric: final
      direction: maximize
    - variable: health
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: concealment_effort
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Suppressing knowledge of the creature's existence
        optimize:
          value:
            - 0
            - 1
      - variable: confrontation_willingness
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Willingness to confront the creature
        optimize:
          value:
            - 0
            - 1
      - variable: research_continuation
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: The intensity of continued research
        optimize:
          value:
            - 0
            - 2
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - Frankenstein (Mary Shelley, 1818)
