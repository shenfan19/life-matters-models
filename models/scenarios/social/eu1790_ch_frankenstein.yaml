category: social
metadata:
  todo:
    - type: noref
      issue: "缺少充分文献引用支持（从旧文件名后缀 _noref 迁移而来）"
      evidence: "迁移自旧版 _noref 后缀标记，尚未核查 metadata.references 及各变量 reference 字段的具体缺失项。"
      next: "核查并补充缺失的文献引用，或确认现有引用已足够后移除该 todo 项。"
  name: eu1790_ch_frankenstein
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      维克多·弗兰肯斯坦（玛丽·雪莱《弗兰肯斯坦》1818）逃离造物后面临三重张力：压制造物知情范围，即能降低直接威胁但会积累造物的复仇驱动；直面造物并承担责任，即可能化解冲突但要付出极度的心理代价；以及继续研究强度，即尝试解决问题或制造第二个造物。创造者拒绝承担责任的每一步都使造物的复仇动力增强，至亲相继死亡。
    result: >
      仿真预期显示 30 个月内弗兰肯斯坦的身体状态、精神崩溃程度和造物的复仇强度轨迹。当前为草案状态，参数待校准。
    limitations: 草案，参数、目标和叙事细节待校准；文学设定，无客观历史数据。
  ratings:
    variable: 0.0 - 全部7个变量均标注TODO:SOURCE，纯文学设定无客观数据
    equation: 0.0 - 5条方程均为纯叙事自建，reference标注TODO:SOURCE
    simulation: 0.75 - 2026-09-04验证，--sim正常产出30个月合理轨迹，未与独立数据逐点比对
    optimization: 0.0 - relationships_intact与health经方程追踪无对立驱动，confrontation_willingness同向有利两目标；2026-09-04验证--opt收敛至单一前沿点(88.9,81.9)，数值确认无权衡
    importance: 0.5 - 弗兰肯斯坦是科学伦理和创造者责任的最经典文学隐喻，但为文学设定，非框架依赖模块
    innovation: 0.5 - 将文学叙事张力转化为可优化动力学系统，核心决策权衡结构沿用已知框架
    confidence: 0.25 - 2026-09-04验证，--sim/--opt均正常跑通，但未与独立文献目标比较
  tags:
    - science
    - ethics
    - isolation
    - obsession
    - literature
variables:
  concealment_effort:
    type: input
    value: 0.5
    unit: intensity
    bounds:
      - 0
      - 1
    description: 压制造物知情范围：是否主动压制关于造物存在的消息，保密程度
    reference: TODO:SOURCE
  confrontation_willingness:
    type: input
    value: 0.2
    unit: intensity
    bounds:
      - 0
      - 1
    description: 直面造物的意愿：是否尝试与造物沟通或对峙（而非逃跑）
    reference: TODO:SOURCE
  research_continuation:
    type: input
    value: 1.0
    unit: intensity
    bounds:
      - 0
      - 2
    description: 继续研究强度：是否继续推进科学研究（以控制/销毁造物）
    reference: TODO:SOURCE
  health:
    type: state
    value: 85
    unit: hp
    bounds:
      - 0
      - 100
    description: 维克多生命力：身体健康状态：过度劳累、北极追逐、精神崩溃的综合损耗
    reference: TODO:SOURCE
    io_role: output
  ethical_burden:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: 伦理负担：未承担责任的道德重量：逃避→累积，直面→缓解
    reference: TODO:SOURCE
    io_role: output
  relationships_intact:
    type: state
    value: 90
    unit: score
    bounds:
      - 0
      - 100
    description: 亲情存续：威廉、贾斯汀、克拉维尔、伊丽莎白等至亲的存续状态
    reference: TODO:SOURCE
    io_role: output
  creature_threat:
    type: state
    value: 10
    unit: score
    bounds:
      - 0
      - 100
    description: 造物威胁等级：造物的复仇行动强度：被忽视则升高，被面对则可能谈判
    reference: TODO:SOURCE
    io_role: output
  scientific_control:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: 对造物的科学掌控：能否通过研究理解/控制/销毁造物
    reference: TODO:SOURCE
    io_role: output
equations:
  creature_growth:
    dynamics:
      creature_threat: min(100, creature_threat + (3.0 * (1 - confrontation_willingness) - 1.5 * confrontation_willingness))
    description: 造物威胁随逃避而增长，直面可减缓
    reference: TODO:SOURCE
  relationship_decay:
    dynamics:
      relationships_intact: max(0, relationships_intact - ((creature_threat / 100) * 4.0))
    description: 威胁越高，亲情损耗越快
    reference: TODO:SOURCE
  ethical_accumulation:
    dynamics:
      ethical_burden: min(100, max(0, ethical_burden + (2.5 * (1 - confrontation_willingness) - 1.0 * confrontation_willingness)))
    description: 逃避让伦理负担快速增长；直面可缓慢卸载
    reference: TODO:SOURCE
  health_decay:
    dynamics:
      health: max(0, health - (research_continuation * 1.2) - ((ethical_burden / 100) * 1.5) - ((creature_threat / 100) * 0.8))
    description: 研究+伦理负担+威胁三重消耗健康
    reference: TODO:SOURCE
  scientific_progress:
    dynamics:
      scientific_control: min(100, scientific_control + research_continuation * 2.0)
    description: 研究推进科学控制，但不能直接降低威胁（需配合直面）
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: month
  start_date: '1790-01-01'
  end_date: '1792-06-30'
  output_types:
    - input
    - state
optimization:
  method: nsga2
  objectives:
    - variable: relationships_intact
      metric: final
      direction: maximize
    - variable: health
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: concealment_effort
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 压制造物知情范围
        optimize:
          value:
            - 0
            - 1
      - variable: confrontation_willingness
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 直面造物的意愿
        optimize:
          value:
            - 0
            - 1
      - variable: research_continuation
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 继续研究强度
        optimize:
          value:
            - 0
            - 2
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - Frankenstein (Mary Shelley, 1818)
