category: social
metadata:
  todo:
    - type: noref
      issue: "Lacks sufficient literature citation support (migrated from the old filename's _noref suffix)"
      evidence: "Migrated from the legacy _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check and supply the missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: es1600_es_don_quixote
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      Don Quixote's (Cervantes's Don Quixote, 1605/1615) core question is: what is the cost of
      holding fast to an ideal? Knightly-action intensity accumulates a sense of chivalric-glory
      satisfaction while also accumulating bodily injury; maintaining belief sustains the motivation
      to act while deepening the rift with reality; and heeding Sancho's practical advice can lower
      the cost of failure but conflicts with the ideal's own logic. Every defeat is absorbed by Don
      Quixote into the knightly narrative, mistaking windmills for giants, but the real cost to body
      and social reputation cannot be dissolved by narrative.
    result: >
      The simulation is expected to compare the trajectories of chivalric satisfaction, physical
      state, and social dignity across 36 months under three strategies. This is currently a draft,
      with parameters still to be calibrated.
    limitations: A draft; parameters, objectives, and narrative details still need calibration; a literary setting with no objective historical data.
  ratings:
    variable: 0.0 - All 7 variables are marked TODO:SOURCE, a purely literary setting with no objective data
    equation: 0.0 - All 4 equations are purely self-built for the narrative, with reference marked TODO:SOURCE
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 36-month trajectory normally, not yet compared point-by-point against independent data
    optimization: 0.5 - Verified on 2026-09-04, --opt converges to 47 non-trivial Pareto solutions (ideal_strength 52.3-100, actual_good_done 28.8-86.4), numerically confirming the directional tradeoff of delusion_maintenance against ideal_strength and actual_good_done
    importance: 0.5 - Don Quixote is the founding work of the European novel, but this is a literary setting, not a module the framework depends on
    innovation: 0.5 - Converting literary narrative tension into an optimizable dynamical system, with the core decision-tradeoff structure carried over from a known framework
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared against an independent literature target
  tags:
    - idealism
    - delusion
    - physical-decline
    - social-ridicule
    - literature
variables:
  quest_intensity:
    type: input
    value: 2.0
    unit: intensity
    bounds:
      - 0
      - 3
    description: Knightly-action intensity, the frequency of adventures such as setting out to duel, attacking windmills, or rescuing a princess
    reference: TODO:SOURCE
  delusion_maintenance:
    type: input
    value: 0.8
    unit: ratio
    bounds:
      - 0
      - 1
    description: Maintaining belief, the degree of persistence in the chivalric worldview even after being struck by reality
    reference: TODO:SOURCE
  sancho_listening:
    type: input
    value: 0.2
    unit: intensity
    bounds:
      - 0
      - 1
    description: Heeding Sancho's practical advice, accepting his squire Sancho's practical suggestions (reducing needless harm)
    reference: TODO:SOURCE
  physical_health:
    type: state
    value: 65
    unit: hp
    bounds:
      - 0
      - 100
    description: Physical state, how his aging body withstands the injuries of adventure
    reference: TODO:SOURCE
    io_role: output
  ideal_strength:
    type: state
    value: 95
    unit: score
    bounds:
      - 0
      - 100
    description: Idealism strength, the intactness of his belief in the chivalric world
    reference: TODO:SOURCE
    io_role: output
  social_ridicule:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: The degree of social ridicule, how much those around him treat him as a madman
    reference: TODO:SOURCE
    io_role: output
  actual_good_done:
    type: state
    value: 0
    unit: score
    bounds:
      - 0
      - 100
    description: Genuine good deeds, real good accidentally accomplished through his mistaken methods
    reference: TODO:SOURCE
    io_role: output
equations:
  health_from_quests:
    dynamics:
      physical_health: max(0, physical_health - (quest_intensity * 2.5) + (sancho_listening * 1.0))
    description: Adventures cause direct injury his aging body cannot withstand
    reference: TODO:SOURCE
  ideal_dynamics:
    dynamics:
      ideal_strength: max(0, min(100, ideal_strength - (quest_intensity * 0.5 * (social_ridicule / 100)) + (delusion_maintenance * 1.0)))
    description: Belief slowly erodes under reality's blows; deliberately maintaining it can delay this
    reference: TODO:SOURCE
  ridicule_growth:
    dynamics:
      social_ridicule: min(100, social_ridicule + quest_intensity * 1.5)
    description: The more adventures, the more stories of mockery
    reference: TODO:SOURCE
  accidental_good:
    dynamics:
      actual_good_done: min(100, actual_good_done + quest_intensity * 0.8 * (1 - delusion_maintenance * 0.5))
    description: While pursuing knightly quests, he accidentally helps real people
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: month
  start_date: '1600-01-01'
  end_date: '1602-12-31'
  output_types:
    - input
    - state
optimization:
  method: nsga2
  objectives:
    - variable: ideal_strength
      metric: final
      direction: maximize
    - variable: actual_good_done
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: quest_intensity
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Knightly-action intensity
        optimize:
          value:
            - 0
            - 3
      - variable: delusion_maintenance
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Maintaining belief
        optimize:
          value:
            - 0
            - 1
      - variable: sancho_listening
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Heeding Sancho's practical advice
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - Don Quixote (Cervantes, 1605)
