category: social
metadata:
  todo:
    - type: noref
      issue: "Lacks sufficient literature citation support (migrated from the old filename's _noref suffix)"
      evidence: "Migrated from the legacy _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check and supply the missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: cn1930_cn_xiangzi
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Xiangzi's (Lao She's Camel Xiangzi, 1936) core question is: within the systematic
      exploitation of 1930s Beijing, how far can individual effort go? Rickshaw-pulling intensity,
      where pulling harder accumulates savings faster but depletes health more, the risk level of
      accepted fares, accepting higher-paying rides that carry warlord or fraud risk, and social
      maintenance, spent lowering the probability of being cheated, together determine whether
      Xiangzi can sustain hope after three losses of his rickshaw or instead descends into ruin.
    result: >
      The simulation is expected to show the monthly dynamics of savings, health, and mental state
      across 60 months, and the recovery-or-collapse trajectory after each of the three rickshaw
      losses. This is currently a draft, with parameters still to be calibrated.
    limitations: A draft; parameters, objectives, and narrative details still need calibration; a literary setting whose historical Beijing labor-market parameters need grounding in economic-history literature.
  ratings:
    variable: 0.0 - All 7 variables are marked TODO:SOURCE, with the historical labor-market parameters not anchored to economic-history literature
    equation: 0.0 - All 5 equations are purely self-built for the narrative, with reference marked TODO:SOURCE
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 60-month trajectory normally, not yet compared point-by-point against independent data
    optimization: 0.5 - Verified on 2026-09-04, --opt converges to 49 non-trivial Pareto solutions (savings 82.4-100, morale 99-100), numerically confirming the directional tradeoff of work_intensity/risk_tolerance against savings and morale
    importance: 0.5 - Camel Xiangzi is a classic of modern Chinese literature, but this is a literary setting, not a module the framework depends on
    innovation: 0.5 - Converting literary narrative tension into an optimizable dynamical system, with the core decision-tradeoff structure carried over from a known framework
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared against an independent literature target
  tags:
    - labor
    - class
    - exploitation
    - urbanization
    - health
    - literature
variables:
  work_intensity:
    type: input
    value: 2.0
    unit: intensity
    bounds:
      - 0
      - 3
    description: Rickshaw-pulling intensity, the daily work intensity, working harder saves money faster but depletes the body more
    reference: TODO:SOURCE
  risk_tolerance:
    type: input
    value: 0.5
    unit: ratio
    bounds:
      - 0
      - 1
    description: The risk level of accepted fares, whether to accept a dangerous route (a warlord-controlled area, a late-night fare) to earn more
    reference: TODO:SOURCE
  social_connection:
    type: input
    value: 0.3
    unit: ratio
    bounds:
      - 0
      - 1
    description: Social maintenance, the effort spent maintaining relationships with fellow rickshaw pullers, Huniu, and others
    reference: TODO:SOURCE
  savings:
    type: state
    value: 0
    unit: score
    bounds:
      - 0
      - 100
    description: Savings (a relative value), progress toward the goal of buying a rickshaw (100=successfully purchased)
    reference: TODO:SOURCE
    io_role: output
  physical_strength:
    type: state
    value: 95
    unit: hp
    bounds:
      - 0
      - 100
    description: Physical strength, bodily condition, the cumulative depletion from overwork plus malnutrition
    reference: TODO:SOURCE
    io_role: output
  morale:
    type: state
    value: 90
    unit: score
    bounds:
      - 0
      - 100
    description: Spirit and will, belief in the dream and the will to keep struggling
    reference: TODO:SOURCE
    io_role: output
  exploitation_damage:
    type: state
    value: 0
    unit: score
    bounds:
      - 0
      - 100
    description: The degree of exploitation suffered, cumulative harm from systemic exploitation (warlords, swindlers, Huniu, abusive employers)
    reference: TODO:SOURCE
    io_role: output
  heat_injury_risk:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: Heat-injury risk, the accumulated risk of heatstroke/heat-related illness from pulling a rickshaw under the blazing sun of a Beijing summer
    reference: TODO:SOURCE
    io_role: output
equations:
  savings_accumulation:
    dynamics:
      savings: min(100, savings + (work_intensity * 2.5 + risk_tolerance * 3.0) * max(0.3, physical_strength / 100))
    description: The savings rate, from work intensity plus risky fares, but liable to be wiped out by random exploitation
    reference: TODO:SOURCE
  body_wear:
    dynamics:
      physical_strength: max(0, physical_strength - (work_intensity * 1.8) - ((heat_injury_risk / 100) * 2.0) + social_connection * 0.8)
    description: Rickshaw-pulling intensity plus heat risk plus malnutrition drive physical-strength decline
    reference: TODO:SOURCE
  heat_risk_build:
    dynamics:
      heat_injury_risk: min(100, heat_injury_risk + work_intensity * 1.5 - social_connection * 1.0)
    description: Sustained high-intensity labor through summer accumulates heat risk (peaking each summer)
    reference: TODO:SOURCE
  morale_dynamics:
    dynamics:
      morale: max(0, min(100, morale - ((exploitation_damage / 100) * 2.5 + (1 - physical_strength / 100) * 1.5) + (social_connection * 1.5)))
    description: Morale depletes as physical strength declines and exploitation accumulates
    reference: TODO:SOURCE
  exploitation_growth:
    dynamics:
      exploitation_damage: min(100, exploitation_damage + (0.8) + (risk_tolerance * 1.5))
    description: The degree of exploitation grows in a compounding way with risky fares and social exposure
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: month
  start_date: '1930-01-01'
  end_date: '1934-12-31'
  output_types:
    - input
    - state
optimization:
  method: nsga2
  objectives:
    - variable: savings
      metric: final
      direction: maximize
    - variable: morale
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: work_intensity
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Rickshaw-pulling intensity
        optimize:
          value:
            - 0
            - 3
      - variable: risk_tolerance
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: The risk level of accepted fares
        optimize:
          value:
            - 0
            - 1
      - variable: social_connection
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Social maintenance
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - Camel Xiangzi (Lao She, 1936)
