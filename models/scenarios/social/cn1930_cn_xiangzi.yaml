  name: cn1930_cn_xiangzi
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      祥子（老舍《骆驼祥子》1936）的核心问题是：在 1930 年代北京系统性剥削中，个人努力能走多远？拉车强度，即越努力储蓄积累越快但健康消耗越大；接单风险度，即接受高收益但伴随军阀或骗局风险的订单；以及用于降低被骗概率的社交维护，三者权衡决定祥子是否能在三次失车打击后维持希望还是走向堕落。
    result: >
      仿真预期显示 60 个月内储蓄、健康和心理状态的月动态，以及三次失车后的恢复或崩溃轨迹。当前为草案状态，参数待校准。
    limitations: 草案，参数、目标和叙事细节待校准；文学设定，历史北京劳动市场参数需参考经济史文献。
  ratings:
    variable: 0.0 - 全部7个变量均标注TODO:SOURCE，历史劳动市场参数未锚定经济史文献
    equation: 0.0 - 5条方程均为纯叙事自建，reference标注TODO:SOURCE
    simulation: 0.5 - 配置完整，变量/方程/仿真区间齐全，但标记nosim尚未实际运行验证
    optimization: 0.5 - work_intensity/risk_tolerance对savings与morale方向性权衡由方程内生，未数值验证
    importance: 0.5 - 《骆驼祥子》是中国近现代文学经典，但为文学设定，非框架依赖模块
    innovation: 0.5 - 将文学叙事张力转化为可优化动力学系统，核心决策权衡结构沿用已知框架
    confidence: 0.0 - 尚未验证：未跑通--sim/--opt，此前fan分支曾标注0.25但未核实实际运行状态，予以更正
  tags:
    - labor
    - class
    - exploitation
    - urbanization
    - health
    - literature
variables:
  work_intensity:
    type: input
    value: 2.0
    unit: intensity
    bounds:
      - 0
      - 3
    description: 拉车强度：每日工作的强度——越努力省钱越快，但身体损耗越大
    reference: TODO:SOURCE
  risk_tolerance:
    type: input
    value: 0.5
    unit: ratio
    bounds:
      - 0
      - 1
    description: 接单风险度：是否接受危险路线（军阀区/深夜单）来赚更多钱
    reference: TODO:SOURCE
  social_connection:
    type: input
    value: 0.3
    unit: ratio
    bounds:
      - 0
      - 1
    description: 社交维护：维持与车行工友、虎妞等人际网络的投入
    reference: TODO:SOURCE
  savings:
    type: state
    value: 0
    unit: score
    bounds:
      - 0
      - 100
    description: 积蓄（相对值）：向买车目标的进度（100=成功购车）
    reference: TODO:SOURCE
    io_role: output
  physical_strength:
    type: state
    value: 95
    unit: hp
    bounds:
      - 0
      - 100
    description: 体力：身体状态：过度劳动+营养不足的累积损耗
    reference: TODO:SOURCE
    io_role: output
  morale:
    type: state
    value: 90
    unit: score
    bounds:
      - 0
      - 100
    description: 精神意志：对梦想的信念和继续挣扎的意志
    reference: TODO:SOURCE
    io_role: output
  exploitation_damage:
    type: state
    value: 0
    unit: score
    bounds:
      - 0
      - 100
    description: 被剥削程度：制度性剥削（军阀·骗子·虎妞·恶雇主）的累积伤害
    reference: TODO:SOURCE
    io_role: output
  heat_injury_risk:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: 高温损伤风险：北京夏日在烈日下拉车的中暑/热射病累积风险
    reference: TODO:SOURCE
    io_role: output
equations:
  savings_accumulation:
    dynamics:
      savings: min(100, savings + (work_intensity * 2.5 + risk_tolerance * 3.0) * max(0.3, physical_strength / 100))
    description: 存钱速率：工作强度+风险接单，但会被随机剥削清零
    reference: TODO:SOURCE
  body_wear:
    dynamics:
      physical_strength: max(0, physical_strength - (work_intensity * 1.8) - ((heat_injury_risk / 100) * 2.0) + social_connection * 0.8)
    description: 拉车强度+高温风险+营养不足→体力衰减
    reference: TODO:SOURCE
  heat_risk_build:
    dynamics:
      heat_injury_risk: min(100, heat_injury_risk + work_intensity * 1.5 - social_connection * 1.0)
    description: 夏日连续高强度劳动累积高温风险（每年夏天峰值）
    reference: TODO:SOURCE
  morale_dynamics:
    dynamics:
      morale: max(0, min(100, morale - ((exploitation_damage / 100) * 2.5 + (1 - physical_strength / 100) * 1.5) + (social_connection * 1.5)))
    description: 意志随体力下降和剥削积累而消耗
    reference: TODO:SOURCE
  exploitation_growth:
    dynamics:
      exploitation_damage: min(100, exploitation_damage + (0.8) + (risk_tolerance * 1.5))
    description: 被剥削程度随风险接单和社会接触的复杂增长
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: month
  start_date: '1930-01-01'
  end_date: '1934-12-31'
  output_types:
    - input
    - state
optimization:
  method: nsga2
  objectives:
    - variable: savings
      metric: final
      direction: maximize
    - variable: morale
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: work_intensity
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 拉车强度
        optimize:
          value:
            - 0
            - 3
      - variable: risk_tolerance
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 接单风险度
        optimize:
          value:
            - 0
            - 1
      - variable: social_connection
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 社交维护
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - 骆驼祥子 (老舍, 1936)
