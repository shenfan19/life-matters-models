  name: dz1940_fr_dr_rieux
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      里厄医生（加缪《鼠疫》1947）在 1940 年代奥兰鼠疫封城中面临三重权衡：救治强度，即能减少死亡但会加速自身体力和免疫耗竭；隔离执行严格度，即能遏制传播但会引发社会抵抗；以及自我保护与休息，即能维持长期战斗力但会减少眼前救治。他的妻子在封城前离城，生死未卜，荒诞处境使任何理性最优解都失去意义支撑。
    result: >
      仿真预期比较高强度救治为主、严格隔离为主、均衡分配三种策略下，城市死亡率与医生存活率的 52 周轨迹。当前为草案状态，参数待校准。
    limitations: 草案，参数、目标和叙事细节待校准；文学设定，鼠疫传播参数需参考 SIR 模型文献。
  ratings:
    variable: 0.0 - 全部7个变量均标注TODO:SOURCE，鼠疫传播参数未锚定SIR模型文献
    equation: 0.0 - 5条方程均为纯叙事自建，未采用SIR标准形式，reference标注TODO:SOURCE
    simulation: 0.5 - 配置完整，变量/方程/仿真区间齐全，但标记nosim尚未实际运行验证
    optimization: 0.5 - care_intensity对patients_treated与doctor_health方向性权衡由方程内生，未数值验证
    importance: 0.5 - 《鼠疫》是加缪存在主义代表作，但为文学设定，非框架依赖模块
    innovation: 0.5 - 将文学叙事张力转化为可优化动力学系统，核心决策权衡结构沿用已知框架
    confidence: 0.0 - 尚未验证：未跑通--sim/--opt，此前fan分支曾标注0.25但未核实实际运行状态，予以更正
  tags:
    - epidemic
    - duty
    - existentialism
    - isolation
    - sacrifice
    - literature
  references:
    - La Peste (Albert Camus, 1947)
variables:
  care_intensity:
    type: input
    value: 2.0
    unit: intensity
    bounds:
      - 0
      - 3
    description: 救治强度：医生积极投入病人救治的程度
    reference: TODO:SOURCE
  quarantine_strictness:
    type: input
    value: 0.6
    unit: intensity
    bounds:
      - 0
      - 1
    description: 隔离执行严格度：对病患及接触者实施严格隔离的力度
    reference: TODO:SOURCE
  self_care:
    type: input
    value: 0.3
    unit: intensity
    bounds:
      - 0
      - 1
    description: 自我保护与休息：医生自身的防护与休息
    reference: TODO:SOURCE
  patients_treated:
    type: state
    value: 0
    unit: people
    bounds:
      - 0
      - 500
    description: 累计救治人数：在有限资源下成功治疗或减少痛苦的患者数量
    reference: TODO:SOURCE
    io_role: output
  plague_spread:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: 疫情蔓延程度：疾病在城市中的扩散速度（隔离越严格，蔓延越慢）
    reference: TODO:SOURCE
    io_role: output
  doctor_health:
    type: state
    value: 90
    unit: hp
    bounds:
      - 0
      - 100
    description: 里厄的健康：长期过度劳累和暴露的身体状态
    reference: TODO:SOURCE
    io_role: output
  compassion_fatigue:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: 同情心疲劳：持续见证大规模死亡导致的情感麻木和耗竭
    reference: TODO:SOURCE
    io_role: output
  personal_grief:
    type: state
    value: 10
    unit: score
    bounds:
      - 0
      - 100
    description: 个人悲痛积累：妻子病重、盟友去世、无尽的失去带来的心理负担
    reference: TODO:SOURCE
    io_role: output
equations:
  treatment_rate:
    dynamics:
      patients_treated: patients_treated + care_intensity * 6.0 * (max(0.3, 1 - compassion_fatigue / 100) * max(0.4, doctor_health / 100))
    description: 救治效率受疫情扩散和医生状态影响
    reference: TODO:SOURCE
  plague_dynamics:
    dynamics:
      plague_spread: min(100, max(0, plague_spread + (3.0) - (quarantine_strictness * 4.0)))
    description: 鼠疫扩散受隔离强度影响
    reference: TODO:SOURCE
  health_decay:
    dynamics:
      doctor_health: max(0, doctor_health - ((plague_spread / 100) * care_intensity * 0.8) - (care_intensity * 0.5) + (self_care * 2.5))
    description: 医生健康随工作强度和疫情暴露而下降
    reference: TODO:SOURCE
  fatigue_accumulation:
    dynamics:
      compassion_fatigue: min(100, max(0, compassion_fatigue + ((plague_spread / 100) * 2.5 + care_intensity * 0.4) - (self_care * 1.5)))
    description: 同情心疲劳随死亡规模累积，休息可减缓
    reference: TODO:SOURCE
  grief_accumulation:
    dynamics:
      personal_grief: min(100, personal_grief + (0.8 + (plague_spread / 100) * 1.2))
    description: 个人悲痛随疫情时间缓慢累积（妻子→朋友→无数死亡）
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: week
  start_date: '1940-04-01'
  end_date: '1941-03-30'
  output_types:
    - input
    - state
optimizer:
  method: nsga2
  objectives:
    - variable: patients_treated
      metric: final
      direction: maximize
    - variable: doctor_health
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: care_intensity
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 救治强度
        optimize:
          value:
            - 0
            - 3
      - variable: quarantine_strictness
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 隔离执行严格度
        optimize:
          value:
            - 0
            - 1
      - variable: self_care
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 自我保护与休息
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
