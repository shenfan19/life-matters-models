category: social
metadata:
  todo:
    - type: noref
      issue: "Lacks sufficient literature citation support (migrated from the old filename's _noref suffix)"
      evidence: "Migrated from the legacy _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check and supply the missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: dz1940_fr_dr_rieux
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      During the 1940s plague lockdown of Oran, Dr. Rieux (Camus's The Plague, 1947) faces a
      triple tradeoff: treatment intensity can reduce deaths but accelerates the depletion of his
      own strength and immunity; strict enforcement of quarantine can contain transmission but
      provokes social resistance; and self-protection and rest can sustain his long-term capacity to
      fight but reduce immediate treatment. His wife left the city before the lockdown, her fate
      unknown, and the absurdity of the situation strips any rationally optimal solution of its
      meaning.
    result: >
      The simulation is expected to compare the city's mortality rate and the doctor's survival
      rate across a 52-week trajectory under three strategies: mainly high-intensity treatment,
      mainly strict quarantine, and a balanced allocation. This is currently a draft, with parameters
      still to be calibrated.
    limitations: A draft; parameters, objectives, and narrative details still need calibration; a literary setting whose plague-transmission parameters need grounding in SIR-model literature.
  ratings:
    variable: 0.0 - All 7 variables are marked TODO:SOURCE, with the plague-transmission parameters not anchored to SIR-model literature
    equation: 0.0 - All 5 equations are purely self-built for the narrative and do not adopt the standard SIR form, with reference marked TODO:SOURCE
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 52-week trajectory normally, not yet compared point-by-point against independent data
    optimization: 0.0 - Manual review on 2026-09-04, care_intensity does directly lower doctor_health (worst case -1.3/step) while raising patients_treated, but the other decision variable self_care contributes a larger direct positive effect to doctor_health (+2.5/step), so even with care_intensity maxed out, maxing out self_care still keeps doctor_health's net effect positive; both objectives can approach their upper bounds simultaneously, and no genuine tradeoff exists within the reachable space, consistent with --opt converging to a single front point (500,100); the earlier judgment only looked at the sign of the single care_intensity coefficient and did not check for a third variable that could fully compensate
    importance: 0.5 - The Plague is a representative work of Camus's existentialism, but this is a literary setting, not a module the framework depends on
    innovation: 0.5 - Converting literary narrative tension into an optimizable dynamical system, with the core decision-tradeoff structure carried over from a known framework
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared against an independent literature target
  tags:
    - epidemic
    - duty
    - existentialism
    - isolation
    - sacrifice
    - literature
variables:
  care_intensity:
    type: input
    value: 2.0
    unit: intensity
    bounds:
      - 0
      - 3
    description: Treatment intensity, how actively the doctor commits to treating patients
    reference: TODO:SOURCE
  quarantine_strictness:
    type: input
    value: 0.6
    unit: intensity
    bounds:
      - 0
      - 1
    description: Quarantine strictness, how forcefully strict quarantine is enforced on patients and contacts
    reference: TODO:SOURCE
  self_care:
    type: input
    value: 0.3
    unit: intensity
    bounds:
      - 0
      - 1
    description: Self-protection and rest, the doctor's own protective measures and rest
    reference: TODO:SOURCE
  patients_treated:
    type: state
    value: 0
    unit: people
    bounds:
      - 0
      - 500
    description: Cumulative patients treated, the number successfully treated or eased under limited resources
    reference: TODO:SOURCE
    io_role: output
  plague_spread:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: The extent of the epidemic's spread, the disease's spread rate through the city (stricter quarantine slows spread)
    reference: TODO:SOURCE
    io_role: output
  doctor_health:
    type: state
    value: 90
    unit: hp
    bounds:
      - 0
      - 100
    description: Rieux's health, his bodily state from prolonged overexertion and exposure
    reference: TODO:SOURCE
    io_role: output
  compassion_fatigue:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: Compassion fatigue, the emotional numbness and exhaustion from continually witnessing mass death
    reference: TODO:SOURCE
    io_role: output
  personal_grief:
    type: state
    value: 10
    unit: score
    bounds:
      - 0
      - 100
    description: Accumulated personal grief, the psychological burden from his wife's illness, allies' deaths, and endless loss
    reference: TODO:SOURCE
    io_role: output
equations:
  treatment_rate:
    dynamics:
      patients_treated: patients_treated + care_intensity * 6.0 * (max(0.3, 1 - compassion_fatigue / 100) * max(0.4, doctor_health / 100))
    description: Treatment efficiency is affected by the epidemic's spread and the doctor's own state
    reference: TODO:SOURCE
  plague_dynamics:
    dynamics:
      plague_spread: min(100, max(0, plague_spread + (3.0) - (quarantine_strictness * 4.0)))
    description: Plague spread is affected by quarantine intensity
    reference: TODO:SOURCE
  health_decay:
    dynamics:
      doctor_health: max(0, doctor_health - ((plague_spread / 100) * care_intensity * 0.8) - (care_intensity * 0.5) + (self_care * 2.5))
    description: The doctor's health declines with work intensity and epidemic exposure
    reference: TODO:SOURCE
  fatigue_accumulation:
    dynamics:
      compassion_fatigue: min(100, max(0, compassion_fatigue + ((plague_spread / 100) * 2.5 + care_intensity * 0.4) - (self_care * 1.5)))
    description: Compassion fatigue accumulates with the scale of death, eased by rest
    reference: TODO:SOURCE
  grief_accumulation:
    dynamics:
      personal_grief: min(100, personal_grief + (0.8 + (plague_spread / 100) * 1.2))
    description: Personal grief accumulates slowly over the epidemic's duration (wife, then friends, then countless deaths)
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: week
  start_date: '1940-04-01'
  end_date: '1941-03-30'
  output_types:
    - input
    - state
optimization:
  method: nsga2
  objectives:
    - variable: patients_treated
      metric: final
      direction: maximize
    - variable: doctor_health
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: care_intensity
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Treatment intensity
        optimize:
          value:
            - 0
            - 3
      - variable: quarantine_strictness
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Quarantine strictness
        optimize:
          value:
            - 0
            - 1
      - variable: self_care
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Self-protection and rest
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - La Peste (Albert Camus, 1947)
