category: social
metadata:
  todo:
    - type: noref
      issue: "Lacks sufficient literature citation support (migrated from the old filename's _noref suffix)"
      evidence: "Migrated from the legacy _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check and supply the missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: ru1880_ru_ivan_ilyich
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      In the 20 weeks after learning he is dying, Ivan Ilyich (Tolstoy's The Death of Ivan Ilyich,
      1886) faces a triple tradeoff: maintaining social decorum keeps family and professional
      relations looking normal on the surface, but its conflict with his true psychological needs
      deepens his loneliness; authentic expression can reduce loneliness and existential anxiety, but
      the family's and doctors' performance of decorum makes authentic expression extremely costly;
      and enduring pain can lighten the burden on others, but accelerates his physical and mental
      collapse. Only Gerasim's honest, undeceiving companionship can genuinely ease his suffering,
      and institutionalized hypocrisy is the core obstacle.
    result: >
      The simulation is expected to show the weekly dynamics of psychological isolation, physical
      pain, and dying peace over 20 weeks. This is currently a draft, with parameters still to be
      calibrated.
    limitations: A draft; parameters, objectives, and narrative details still need calibration; the end-of-life psychological-dynamics parameters need grounding in palliative-care literature.
  ratings:
    variable: 0.0 - All 7 variables are marked TODO:SOURCE, with the end-of-life psychological-dynamics parameters not anchored to palliative-care literature
    equation: 0.0 - All 5 equations are purely self-built for the narrative, with reference marked TODO:SOURCE
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 20-week trajectory normally, not yet compared point-by-point against independent data
    optimization: 0.0 - inner_peace and dignity_preserved show no opposing drive when traced through the equations, with facade_maintenance harming both objectives at once; verified on 2026-09-04 that --opt converges to a single front point (81,47.1), numerically confirming no tradeoff
    importance: 0.5 - The Death of Ivan Ilyich is the most profound literary exploration of end-of-life care and authenticity, but this is a literary setting, not a module the framework depends on
    innovation: 0.5 - Converting literary narrative tension into an optimizable dynamical system, with the core decision-tradeoff structure carried over from a known framework
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared against an independent literature target
  tags:
    - death
    - dignity
    - authenticity
    - social-pretense
    - disease
    - literature
variables:
  facade_maintenance:
    type: input
    value: 0.8
    unit: intensity
    bounds:
      - 0
      - 1
    description: Maintaining social decorum, continuing to appear normal, hiding his condition, avoiding the topic of death
    reference: TODO:SOURCE
  authentic_expression:
    type: input
    value: 0.2
    unit: intensity
    bounds:
      - 0
      - 1
    description: Authentic expression, expressing his true fear and needs to family, doctors, or servants
    reference: TODO:SOURCE
  pain_endurance:
    type: input
    value: 0.5
    unit: intensity
    bounds:
      - 0
      - 1
    description: The degree of pain endurance, refusing pain medication (opium), forcing himself through it (there was little else doctors could do at the time)
    reference: TODO:SOURCE
  pain_level:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: Pain level, the accumulated intensity of chronic internal pain (no effective analgesia in the 19th century)
    reference: TODO:SOURCE
    io_role: output
  inner_peace:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: Inner peace, the degree of accepting death and making peace with life
    reference: TODO:SOURCE
    io_role: output
  social_isolation:
    type: state
    value: 60
    unit: score
    bounds:
      - 0
      - 100
    description: Emotional isolation, the loneliness from family avoidance, perfunctory doctors, and a lack of genuine connection
    reference: TODO:SOURCE
    io_role: output
  dignity_preserved:
    type: state
    value: 30
    unit: score
    bounds:
      - 0
      - 100
    description: Preserved dignity, retaining dignity as a human being at the end of life (not social status, but a genuine self)
    reference: TODO:SOURCE
    io_role: output
  physical_decline:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: Physical decline, the irreversible accumulation of physiological deterioration
    reference: TODO:SOURCE
    io_role: output
equations:
  pain_progression:
    dynamics:
      pain_level: min(100, pain_level + (2.5) + (pain_endurance * 1.5))
    description: Pain grows irreversibly over time, and enduring it internalizes the suffering
    reference: TODO:SOURCE
  isolation_dynamics:
    dynamics:
      social_isolation: min(100, max(0, social_isolation + (facade_maintenance * 2.0) - (authentic_expression * 3.0)))
    description: Maintaining decorum drives the family further away (since their distance is also a performance); authentic expression can reduce isolation
    reference: TODO:SOURCE
  peace_growth:
    dynamics:
      inner_peace: min(100, inner_peace + (authentic_expression * 2.5 + (1 - facade_maintenance) * 1.5))
    description: Authentic expression and accepting pain (rather than avoiding it) slowly bring inner peace
    reference: TODO:SOURCE
  dignity_change:
    dynamics:
      dignity_preserved: min(100, max(0, dignity_preserved + ((inner_peace / 100) * 2.0) - (facade_maintenance * 1.0)))
    description: Rising inner peace raises dignity; a rising performance of decorum instead erodes genuine dignity
    reference: TODO:SOURCE
  body_decline:
    dynamics:
      physical_decline: min(100, physical_decline + 4.0 - (1 - pain_endurance) * 0.5)
    description: Physical decline proceeds at a fixed rate, unstoppable, only weakly influenced
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: week
  start_date: '1880-01-01'
  end_date: '1880-05-19'
  output_types:
    - input
    - state
optimization:
  method: nsga2
  objectives:
    - variable: inner_peace
      metric: final
      direction: maximize
    - variable: dignity_preserved
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: facade_maintenance
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Maintaining social decorum
        optimize:
          value:
            - 0
            - 1
      - variable: authentic_expression
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Authentic expression
        optimize:
          value:
            - 0
            - 1
      - variable: pain_endurance
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: The degree of pain endurance
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - The Death of Ivan Ilyich (Tolstoy, 1886)
