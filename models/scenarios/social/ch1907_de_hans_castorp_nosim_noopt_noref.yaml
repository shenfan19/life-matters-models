category: social
metadata:
  name: ch1907_de_hans_castorp
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      汉斯·卡斯托普（托马斯·曼《魔山》1924）在瑞士达沃斯疗养院原计划停留 3 周，最终滞留 7 年：
      遵从疗养规程（肺结核恢复）、思想探索（与智识对话者 Settembrini/Naphta 的哲学博弈）、
      保持与外部世界联系（防止彻底沉溺山上时间感）三者构成核心张力——
      疾病令时间感扭曲，窗外欧洲正在滑向 1914 年一战。
    result: >
      仿真预期显示 84 个月内肺结核恢复进度、思想成熟度和与现实世界连接度的月动态——草案状态，参数待校准（noref）。
    limitations: 草案，参数、目标和叙事细节待校准；文学设定，肺结核疗养动力学参数需参考医学文献（noref）。
  ratings:
    topic_importance: 3 - 魔山是德国文学经典，肺结核疗养院时间感的量化建模有独特研究价值
    framework_demand: 1 - TODO存根，尚未被其他模型引用
    evidence_quality: 1 - TODO草案，参数未实现，且为文学设定
    innovation: 2 - 将"时间感扭曲"和疗养规程的依从性转化为动力学意图存在，但尚未实现
    social_value: 4 - 探索疾病与时间感知、欧洲文明在战争前夜的深层主题
  tags:
    - tuberculosis
    - sanatorium
    - time-distortion
    - war
    - europe
    - literature
  references:
    - The Magic Mountain (Thomas Mann, 1924)
  step_size:
    value: 1
    unit: month
variables:
  treatment_adherence:
    type: input
    value: 0.6
    unit: intensity
    bounds:
      - 0
      - 1
    description: 遵从疗养规程：休息·日光浴·温度记录——疗养院的标准治疗
    reference: TODO:SOURCE
  intellectual_engagement:
    type: input
    value: 0.5
    unit: intensity
    bounds:
      - 0
      - 1
    description: 思想探索：与塞滕布里尼·纳夫塔等人的哲学辩论（刺激但消耗体力）
    reference: TODO:SOURCE
  world_engagement:
    type: input
    value: 0.2
    unit: intensity
    bounds:
      - 0
      - 1
    description: 与外部世界的联系：关注山下的新闻、写信、尝试下山
    reference: TODO:SOURCE
  health:
    type: state
    value: 45
    unit: hp
    bounds:
      - 0
      - 100
    description: 肺结核状态：肺结核的恢复或进展（高=好转）
    reference: TODO:SOURCE
    io_role: output
  time_sense:
    type: state
    value: 30
    unit: score
    bounds:
      - 0
      - 100
    description: 时间感知：对时间流逝的感知扭曲（高=时间静止，低=清醒回归）
    reference: TODO:SOURCE
    io_role: output
  intellectual_depth:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: 思想深度：在孤立中积累的哲学理解
    reference: TODO:SOURCE
    io_role: output
  world_disconnect:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: 与世界的疏离：与真实社会的脱节程度
    reference: TODO:SOURCE
    io_role: output
formulas:
  health_change:
    formula:
      health: min(100, max(0, health + (treatment_adherence * 1.5) - (intellectual_engagement * 0.5) - 0.3))
    description: 结核病在疗养中缓慢改善，但智识消耗会抵消
    reference: TODO:SOURCE
  time_distortion:
    formula:
      time_sense: min(100, time_sense + (1 - world_engagement) * 1.5)
    description: 疗养院的时间感扭曲随停留时间积累
    reference: TODO:SOURCE
  intellectual_growth:
    formula:
      intellectual_depth: min(100, intellectual_depth + intellectual_engagement * 2.5)
    description: 智识深度随辩论探索增长
    reference: TODO:SOURCE
  disconnect_growth:
    formula:
      world_disconnect: min(100, world_disconnect + (time_sense / 100) * 1.5 - world_engagement * 2.0)
    description: 与世界的疏离随时间感扭曲加深
    reference: TODO:SOURCE
simulation:
  start_date: '1907-07-01'
  end_date: '1914-06-30'
  output_types:
    - input
    - state
optimizer:
  method: nsga2
  objectives:
    - variable: health
      metric: final
      direction: maximize
    - variable: intellectual_depth
      metric: final
      direction: maximize
  schedules:
    - variable: treatment_adherence
      time_start: "09:00"
      time_end: "09:00"
      days:
        - Mon
        - Tue
        - Wed
        - Thu
        - Fri
        - Sat
        - Sun
      label: 遵从疗养规程
      optimize:
        value:
          - 0
          - 1
    - variable: intellectual_engagement
      time_start: "09:00"
      time_end: "09:00"
      days:
        - Mon
        - Tue
        - Wed
        - Thu
        - Fri
        - Sat
        - Sun
      label: 思想探索
      optimize:
        value:
          - 0
          - 1
    - variable: world_engagement
      time_start: "09:00"
      time_end: "09:00"
      days:
        - Mon
        - Tue
        - Wed
        - Thu
        - Fri
        - Sat
        - Sun
      label: 与外部世界的联系
      optimize:
        value:
          - 0
          - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
