metadata:
  name: ad1847_hu_semmelweis
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      Semmelweis's case, advocating handwashing to prevent puerperal fever from 1847 to 1865,
      demonstrates a positive-feedback barrier to innovation diffusion: acceptance gain = advocacy
      intensity x (evidence/60) x (1 minus resistance inertia), where resistance inertia = 0.4 +
      0.4 x (1 minus acceptance/100), so the lower the acceptance, the harder it is to advance,
      forming a self-reinforcing lock-in effect. The higher the advocacy intensity, the faster the
      researcher's mental health depletes, that is, the model variable mental_health falls faster,
      making the tradeoff between "persisting with advocacy" and "protecting the researcher" an
      unavoidable optimization problem.
    result: >
      The simulation shows the monthly dynamics of evidence quality, institutional acceptance, and
      mental health across 18 years, 216 months; a three-objective optimization (verified on
      2026-09-04, converging over 80 generations, 100% feasible, 50 Pareto solutions) confirms a
      genuine tradeoff between persisting with advocacy and protecting the researcher, not
      converging to a trivial solution.
    limitations: The Rogers diffusion parameters come from 20th-century research, and applying them to a 19th-century medical institution carries a generalization risk; the quantitative relationship between advocacy intensity and mental depletion is a model assumption.

  ratings:
    variable: 0.75 - Rogers's diffusion theory and the Carter biography supply a good literature basis
    equation: 0.5 - The acceptance-diffusion equation is self-built, anchored to concepts from Rogers's diffusion theory and the Carter biography's narrative
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 216-month trajectory normally, not yet compared point-by-point against independent historical data
    optimization: 0.5 - Verified on 2026-09-04, --opt converges to 50 Pareto solutions, a non-trivial solution set, confirming the directional tradeoff numerically, but the evidence is still not at RCT/meta level
    importance: 0.75 - Medical history's most famous case of knowledge resistance, drawing high attention in medical/science-policy circles, with direct relevance to evidence-based-medicine policy discussions
    innovation: 1.0 - The first modeling of scientific-innovation acceptance dynamics as an optimizable problem
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared point-by-point against an independent historical-literature target value
  tags: [historical, medical, handwashing, science-rejection, mental-health, 19th-century]
  period: "1847-1865"
  location: "Vienna General Hospital / Budapest, Hungary"
variables:
  # ── Behavioral inputs ─────────────────────────────────────────────────────────────
  research_effort:
    type: input
    value: 2.0
    unit: "intensity"
    bounds: [0.0, 3.0]
    description: "Research intensity: 0=stopped, 1=collecting case records, 2=statistical analysis, 3=publishing papers/lecturing"

  advocacy_intensity:
    type: input
    value: 1.5
    unit: "intensity"
    bounds: [0.0, 3.0]
    description: "Advocacy intensity: 0=silence, 1=discussing with colleagues, 2=institutional proposals, 3=public debate/publishing a monograph"

  self_care:
    type: input
    value: 0.4
    unit: "coefficient"
    bounds: [0.0, 1.0]
    description: "Self-care (0=fully neglecting health, 1=attending to rest, socializing, and psychological regulation)"

  # ── Scientific/social state ─────────────────────────────────────────────────────────────
  evidence:
    type: state
    value: 20.0
    unit: "score"
    bounds: [0, 100]
    io_role: output
    description: "Evidence quality and completeness (advocacy only becomes truly effective above 60; below 40 it is dismissed by institutions)"

  acceptance:
    type: state
    value: 5.0
    unit: "score"
    bounds: [0, 100]
    io_role: output
    description: "Medical-community acceptance (target 75 = major institutions begin promoting handwashing; below 10 means complete rejection)"

  isolation:
    type: state
    value: 15.0
    unit: "score"
    bounds: [0, 100]
    description: "Professional isolation level (rises with accumulated rejection; accelerates the decline of mental_health)"

  patient_mortality:
    type: state
    value: 80.0
    unit: "score"
    bounds: [0, 100]
    io_role: output
    description: "The obstetric-ward mortality index (high=bad; each successful act of advocacy actually lowers mortality)"

  # ── Mental health ─────────────────────────────────────────────────────────────
  mental_health:
    type: state
    value: 75.0
    unit: "score"
    bounds: [0, 100]
    io_role: output
    description: "Mental-health state (0=a mental breakdown requiring committal to an asylum; each rebuttal depletes it)"

simulation:
  step_size:
    value: 1
    unit: month
  start_date: "1847-01-01"
  end_date: "1865-01-01"
  output_variables:
    - mental_health
    - acceptance
    - evidence
    - isolation
    - patient_mortality
    - research_effort
    - advocacy_intensity
equations:

  # 1. Research accumulates evidence
  # research_effort=2, accumulating 2 x 2.5 = 5 points per month; reaching 60 needs 12 uninterrupted months
  evidence_accumulation:
    description: "Research work accumulates statistical evidence; the higher the research intensity, the faster evidence grows"
    condition: research_effort > 0
    priority: 10
    dynamics:
      evidence: "min(100, evidence + research_effort * 2.5)"
      mental_health: "max(0, mental_health - research_effort * 0.5)"

  # 2. Advocacy drives acceptance (the core equation)
  # evidence_factor = min(1, evidence/60)
  # rejection_resistance = 0.4 + 0.4*(1 - acceptance/100)
  # advocacy_intensity=2, evidence=60, acceptance=5:
  #   gain = 2 x 1.0 x (1 - 0.796) = 2 x 0.204 = 0.41/month
  # this is precisely the historical bind: even with sufficient evidence, institutional inertia is extremely hard to break
  advocacy_effect:
    description: "Advocacy drives institutional acceptance; when evidence is insufficient, rebuttal raises isolation"
    condition: advocacy_intensity > 0
    priority: 9
    dynamics:
      acceptance: "min(100, acceptance + advocacy_intensity * min(1, evidence / 60) * (1 - (0.4 + 0.4 * (1 - acceptance / 100))))"
      mental_health: "max(0, mental_health - advocacy_intensity * 1.2)"
      isolation: "min(100, isolation + advocacy_intensity * (1 - min(1, acceptance / 50)) * 0.8)"

  # 3. Self-care restores mental health
  self_care_recovery:
    description: "Self-care eases mental strain; but it reduces time available for research and advocacy"
    condition: self_care > 0
    priority: 8
    dynamics:
      mental_health: "min(100, mental_health + self_care * 5)"
      isolation: "max(0, isolation - self_care * 2)"

  # 4. Isolation accelerates mental collapse
  isolation_damage:
    description: "Ongoing professional isolation continually erodes mental health (the loneliness of not being understood)"
    condition: isolation > 20
    priority: 7
    dynamics:
      mental_health: "max(0, mental_health - (isolation - 20) * 0.06)"

  # 5. Rising acceptance -> falling patient mortality (a humanitarian outcome)
  acceptance_saves_lives:
    description: "Rising acceptance means more hospitals adopt handwashing, lowering patient mortality"
    condition: acceptance > 10
    priority: 6
    dynamics:
      patient_mortality: "max(0, patient_mortality - acceptance * 0.05)"

  # 6. Advocacy backfires when evidence is insufficient (mockery raises isolation)
  evidence_too_low:
    description: "Advocating forcefully with insufficient evidence backfires into mockery, accelerating professional marginalization"
    condition: "evidence < 30 and advocacy_intensity > 1.5"
    priority: 8
    dynamics:
      isolation: "min(100, isolation + 2)"
      mental_health: "max(0, mental_health - 2)"

  # 7. Mental collapse impairs research output
  mental_collapse_penalty:
    description: "Once mental health is severely damaged (below 25), work and advocacy can no longer proceed effectively"
    condition: mental_health < 25
    priority: 9
    dynamics:
      evidence: "max(0, evidence - 1)"
      acceptance: "max(0, acceptance - 0.5)"

optimization:
  method: nsga2
  algorithm:
    population_size: 50
    n_generations: 80

  objectives:
    - variable: acceptance
      metric: final
      direction: maximize
    - variable: mental_health
      metric: mean
      direction: maximize
    - variable: patient_mortality
      metric: final
      direction: minimize

  constraints:
    - variable: mental_health
      condition: ">= 20"
      description: "Mental health should not fully collapse (committal to an asylum)"
    - variable: evidence
      condition: ">= 40"
      metric: final
      description: "Sufficient evidence must be accumulated by the end of the evaluation period (initial evidence=20; only the endpoint needs to reach the target, not a constraint held throughout)"

  startpoint:
    regimens:
      - variable: research_effort
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["1847-01-01", "1848-12-21"]
        label: "Research-phase intensity (the first 24 months)"
        optimize:
          value: [0.0, 3.0]
      - variable: advocacy_intensity
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["1848-12-22", "1865-01-01"]
        label: "Advocacy-phase intensity (after 24 months)"
        optimize:
          value: [0.0, 3.0]
      - variable: self_care
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Self-care level"
        optimize:
          value: [0.0, 1.0]

  analysis:
    pareto_description: |
      Key finding: the optimal strategy is to first concentrate 2 years (24 months) on
      accumulating evidence (research_effort=3), then shift to advocacy (advocacy_intensity=2),
      while keeping self_care at about 0.5.
      Semmelweis's actual historical path: advocating too early at high intensity (while evidence
      was still insufficient) combined with extremely low self_care (about 0.1), resulting in slow
      acceptance progress and a mental collapse.
      This is exactly the "Pareto-dominated path" the model predicts, trading 18 years of suffering
      for a result that could have been reached faster.
