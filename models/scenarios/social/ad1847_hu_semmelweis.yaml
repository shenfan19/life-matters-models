  name: ad1847_hu_semmelweis
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      塞麦尔维斯自 1847 年至 1865 年推动洗手预防产褥热的案例展示了创新扩散的正反馈障碍：接受度增益 = 倡导强度 × (evidence/60) × (1−抵触惯性)，而抵触惯性 = 0.4 + 0.4 × (1−acceptance/100)，接受度越低，推动越难，形成自我强化的锁定效应。倡导强度越高，研究者心理健康消耗越快，即模型变量 mental_health 加速下降，使"坚持倡导"与"保护研究者"之间的权衡成为不可回避的优化问题。
    result: >
      仿真预期显示 18 年，合 216 个月内证据质量、机构接受度和心理健康的月动态，以及积极发表、间歇休养、阶段性放弃等不同倡导时机策略的轨迹差异；三目标优化预期给出最优倡导时序路径；该场景尚未实际运行仿真。
    limitations: Rogers 扩散参数来自 20 世纪研究，应用于 19 世纪医学机构存在泛化风险；倡导强度与心理损耗的定量关系为模型假设。

  ratings:
    topic_importance: 4 - 医学史最著名的知识阻力案例，医学史和科学政策圈高度关注
    framework_demand: 1 - 历史叙事场景，不被其他模型引用
    evidence_quality: 4 - Rogers 扩散理论和 Carter 传记提供良好文献基础
    innovation: 5 - 首次将科学创新接受度动力学建模为可优化问题
    social_value: 5 - 医学史最著名的知识阻力案例，直接关联循证医学政策
  tags: [historical, medical, handwashing, science-rejection, mental-health, 19th-century]
  period: "1847-1865"
  location: "Vienna General Hospital / Budapest, Hungary"
variables:
  # ── 行为输入 ─────────────────────────────────────────────────────────────────
  research_effort:
    type: input
    value: 2.0
    unit: "强度"
    bounds: [0.0, 3.0]
    description: "研究强度：0=停止, 1=收集病历, 2=统计分析, 3=发表论文/演讲"

  advocacy_intensity:
    type: input
    value: 1.5
    unit: "强度"
    bounds: [0.0, 3.0]
    description: "倡导强度：0=沉默, 1=同事交流, 2=机构提案, 3=公开辩论/出版专著"

  self_care:
    type: input
    value: 0.4
    unit: "系数"
    bounds: [0.0, 1.0]
    description: "自我照护（0=完全忽视健康, 1=注重休息社交与精神调节）"

  # ── 科学/社会状态 ─────────────────────────────────────────────────────────────
  evidence:
    type: state
    value: 20.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "证据质量与完整度（>60时advocacy才真正有效；<40时被机构一笑置之）"

  acceptance:
    type: state
    value: 5.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "医学界接受度（目标75=主要机构开始推广洗手；<10=完全不被接受）"

  isolation:
    type: state
    value: 15.0
    unit: "分"
    bounds: [0, 100]
    description: "职业孤立程度（随拒绝积累上升；加速mental_health下滑）"

  patient_mortality:
    type: state
    value: 80.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "产科病房死亡率指数（高=糟糕；每次倡导成功将实际降低死亡）"

  # ── 心理健康 ─────────────────────────────────────────────────────────────────
  mental_health:
    type: state
    value: 75.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "心理健康状态（0=精神崩溃送入精神病院；每次驳斥都在消耗）"

simulation:
  step_size:
    value: 1
    unit: month
  start_date: "1847-01-01"
  end_date: "1865-01-01"
  output_variables:
    - mental_health
    - acceptance
    - evidence
    - isolation
    - patient_mortality
    - research_effort
    - advocacy_intensity
equations:

  # 1. 研究积累证据
  # research_effort=2, 每月积累：2 × 2.5 = 5分；60分需12个月不间断
  evidence_accumulation:
    description: "研究工作积累统计证据；研究强度越高，证据增长越快"
    condition: research_effort > 0
    priority: 10
    dynamics:
      evidence: "min(100, evidence + research_effort * 2.5)"
      mental_health: "max(0, mental_health - research_effort * 0.5)"

  # 2. 倡导推动接受度（核心方程）
  # evidence_factor = min(1, evidence/60)
  # rejection_resistance = 0.4 + 0.4*(1 - acceptance/100)
  # advocacy_intensity=2, evidence=60, acceptance=5:
  #   gain = 2 × 1.0 × (1 - 0.796) = 2 × 0.204 = 0.41/月
  # 这正是历史上的困境：即便证据充足，制度惯性也极难突破
  advocacy_effect:
    description: "倡导推动机构接受；evidence不足时驳斥增加孤立感"
    condition: advocacy_intensity > 0
    priority: 9
    dynamics:
      acceptance: "min(100, acceptance + advocacy_intensity * min(1, evidence / 60) * (1 - (0.4 + 0.4 * (1 - acceptance / 100))))"
      mental_health: "max(0, mental_health - advocacy_intensity * 1.2)"
      isolation: "min(100, isolation + advocacy_intensity * (1 - min(1, acceptance / 50)) * 0.8)"

  # 3. 自我照护恢复心理健康
  self_care_recovery:
    description: "自我照护缓解精神压力；但减少了研究和倡导时间"
    condition: self_care > 0
    priority: 8
    dynamics:
      mental_health: "min(100, mental_health + self_care * 5)"
      isolation: "max(0, isolation - self_care * 2)"

  # 4. 孤立加速心理崩溃
  isolation_damage:
    description: "职业孤立持续侵蚀心理健康（无人理解的孤独感）"
    condition: isolation > 20
    priority: 7
    dynamics:
      mental_health: "max(0, mental_health - (isolation - 20) * 0.06)"

  # 5. 接受度提升→患者死亡率下降（人道主义成果）
  acceptance_saves_lives:
    description: "接受度提升意味着更多医院实施洗手，患者死亡率下降"
    condition: acceptance > 10
    priority: 6
    dynamics:
      patient_mortality: "max(0, patient_mortality - acceptance * 0.05)"

  # 6. 证据不足时倡导反效果（被嘲笑增加孤立）
  evidence_too_low:
    description: "证据不足时强行倡导反被嘲笑，加速职业边缘化"
    condition: "evidence < 30 and advocacy_intensity > 1.5"
    priority: 8
    dynamics:
      isolation: "min(100, isolation + 2)"
      mental_health: "max(0, mental_health - 2)"

  # 7. 心理崩溃影响研究产出
  mental_collapse_penalty:
    description: "心理严重受损（<25）时无法有效工作和倡导"
    condition: mental_health < 25
    priority: 9
    dynamics:
      evidence: "max(0, evidence - 1)"
      acceptance: "max(0, acceptance - 0.5)"

optimizer:
  method: nsga2
  algorithm:
    population_size: 50
    n_generations: 80

  objectives:
    - variable: acceptance
      metric: final
      direction: maximize
    - variable: mental_health
      metric: mean
      direction: maximize
    - variable: patient_mortality
      metric: final
      direction: minimize

  constraints:
    - variable: mental_health
      condition: ">= 20"
      description: "心理健康不能完全崩溃（送入精神病院）"
    - variable: evidence
      condition: ">= 40"
      metric: final
      description: "评估期末需积累足够证据（initial evidence=20，期末达标即可，非全程约束）"

  startpoint:
    regimens:
      - variable: research_effort
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["1847-01-01", "1848-12-21"]
        label: "研究阶段强度（前24个月）"
        optimize:
          value: [0.0, 3.0]
      - variable: advocacy_intensity
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["1848-12-22", "1865-01-01"]
        label: "倡导阶段强度（24个月后）"
        optimize:
          value: [0.0, 3.0]
      - variable: self_care
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "自我照护水平"
        optimize:
          value: [0.0, 1.0]

  analysis:
    pareto_description: |
      关键发现：最优策略是先集中2年（24个月）积累证据（research_effort=3），
      再转向倡导（advocacy_intensity=2），同时保持self_care≈0.5。
      历史塞麦尔维斯的实际路径：过早高强度倡导（evidence不足时）
      + 极低self_care（≈0.1），导致接受度进展缓慢且心理崩溃——
      这正是模型预测的"帕累托劣势路径"，以18年痛苦换来了本可更快实现的结果。
