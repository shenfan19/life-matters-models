  name: fr1815_fr_jean_valjean
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      冉·阿让（雨果《悲惨世界》1862）在主教的宽恕后选择救赎，面临三重持续张力：践行善行强度，即能积累社会资本和道德完整性，但暴露身份的风险也随之增加；隐藏身份，即能维持安全，但每次暴露威胁都可能引发道德危机；以及自我照料，即能保持长期能力，但与彻底利他的救赎逻辑相冲突。贾维尔的追踪是恒定的外部压力，构成跨越 18 年的逃亡与救赎弧线。
    result: >
      仿真预期显示 216 个月内道德资本、身份安全度和贾维尔追踪压力的动态轨迹。当前为草案状态，参数待校准。
    limitations: 草案，参数、目标和叙事细节待校准；文学设定，无客观历史数据。
  ratings:
    variable: 0.0 - 全部6个变量均标注TODO:SOURCE，纯文学设定无客观数据
    equation: 0.0 - 4条方程均为纯叙事自建，reference标注TODO:SOURCE
    simulation: 0.5 - 配置完整，变量/方程/仿真区间齐全，但标记nosim尚未实际运行验证
    optimization: 0.0 - redemption_progress与community_trust经方程追踪无对立驱动，两决策变量均单向有利
    importance: 0.5 - 冉·阿让是文学史上最著名的救赎叙事之一，但为文学设定，非框架依赖模块
    innovation: 0.5 - 将文学叙事张力转化为可优化动力学系统，核心决策权衡结构沿用已知框架
    confidence: 0.0 - 尚未验证：未跑通--sim/--opt，此前fan分支曾标注0.25但未核实实际运行状态，予以更正
  tags:
    - justice
    - redemption
    - labor-injury
    - aging
    - identity
    - literature
  references:
    - 悲惨世界 (Victor Hugo, 1862)
variables:
  virtue_effort:
    type: input
    value: 1.5
    unit: intensity
    bounds:
      - 0
      - 2
    description: 践行善行强度：用行动救助他人、回报社会的努力
    reference: TODO:SOURCE
  concealment:
    type: input
    value: 0.7
    unit: ratio
    bounds:
      - 0
      - 1
    description: 隐藏身份：掩盖前囚犯身份以在社会中生存
    reference: TODO:SOURCE
  self_care:
    type: input
    value: 0.3
    unit: intensity
    bounds:
      - 0
      - 1
    description: 自我照料：注意身体恢复，减少苦役后遗症的进展
    reference: TODO:SOURCE
  physical_health:
    type: state
    value: 60
    unit: hp
    bounds:
      - 0
      - 100
    description: 身体状态：19年苦役的长期损伤与老化的综合健康
    reference: TODO:SOURCE
    io_role: output
  redemption_progress:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: 救赎进度：用善行弥补过去的积累
    reference: TODO:SOURCE
    io_role: output
  javert_pursuit:
    type: state
    value: 15
    unit: score
    bounds:
      - 0
      - 100
    description: 贾维尔的追踪：警察对他身份和下落的掌握程度
    reference: TODO:SOURCE
    io_role: output
  community_trust:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: 社区信任：在新身份下建立的社会信任资本
    reference: TODO:SOURCE
    io_role: output
equations:
  health_decay:
    dynamics:
      physical_health: max(0, physical_health - (0.8) - (virtue_effort * 0.6) + (self_care * 1.5))
    description: 苦役后遗症不可逆；善行消耗体力；自我照料可减缓
    reference: TODO:SOURCE
  redemption_growth:
    dynamics:
      redemption_progress: min(100, redemption_progress + virtue_effort * 2.5)
    description: 善行积累救赎
    reference: TODO:SOURCE
  javert_tracking:
    dynamics:
      javert_pursuit: min(100, max(0, javert_pursuit + (0.5) + (virtue_effort * 0.3) - (concealment * 1.5)))
    description: 隐藏身份减缓追踪；善行的曝光度反而可能泄露线索
    reference: TODO:SOURCE
  trust_growth:
    dynamics:
      community_trust: min(100, community_trust + (virtue_effort * 1.5) + (concealment * 0.8))
    description: 社区信任随善行和稳定身份积累
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: month
  start_date: '1815-01-01'
  end_date: '1832-12-31'
  output_types:
    - input
    - state
optimizer:
  method: nsga2
  objectives:
    - variable: redemption_progress
      metric: final
      direction: maximize
    - variable: community_trust
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: virtue_effort
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 践行善行强度
        optimize:
          value:
            - 0
            - 2
      - variable: concealment
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 隐藏身份
        optimize:
          value:
            - 0
            - 1
      - variable: self_care
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 自我照料
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
