  name: fr1815_fr_jean_valjean
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  reviewed: false - Batch-drafted with AI assistance, not yet manually reviewed.
  description:
    problem: >
      After choosing redemption following the bishop's forgiveness, Jean Valjean (Hugo's Les
      Misérables, 1862) faces a sustained triple tension: the intensity of practicing good deeds
      accumulates social capital and moral integrity, but also raises the risk of exposing his
      identity; concealing his identity maintains safety, but each threat of exposure can trigger a
      moral crisis; and self-care preserves his long-term capacity, but conflicts with the logic of
      thoroughgoing altruistic redemption. Javert's pursuit is a constant external pressure, forming
      an 18-year arc of flight and redemption.
    result: >
      The simulation is expected to show the dynamic trajectory of moral capital, identity safety,
      and Javert's pursuit pressure across 216 months. This is currently a draft, with parameters
      still to be calibrated.
    limitations: A draft; parameters, objectives, and narrative details still need calibration; a literary setting with no objective historical data.
  ratings:
    variable: 0.0 - All 6 variables are marked TODO:SOURCE, a purely literary setting with no objective data
    equation: 0.0 - All 4 equations are purely self-built for the narrative, with reference marked TODO:SOURCE
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 216-month trajectory normally, not yet compared point-by-point against independent data
    optimization: 0.0 - redemption_progress and community_trust show no opposing drive when traced through the equations, with both decision variables beneficial in a single direction; verified on 2026-09-04 that --opt converges to a single front point (100,100), numerically confirming no tradeoff
    importance: 0.5 - Jean Valjean is one of the most famous redemption narratives in literary history, but this is a literary setting, not a module the framework depends on
    innovation: 0.5 - Converting literary narrative tension into an optimizable dynamical system, with the core decision-tradeoff structure carried over from a known framework
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared against an independent literature target
  tags:
    - justice
    - redemption
    - labor-injury
    - aging
    - identity
    - literature
variables:
  virtue_effort:
    type: input
    value: 1.5
    unit: intensity
    bounds:
      - 0
      - 2
    description: The intensity of practicing good deeds, effort spent helping others and giving back to society
    reference: TODO:SOURCE
  concealment:
    type: input
    value: 0.7
    unit: ratio
    bounds:
      - 0
      - 1
    description: Concealing his identity, hiding his past as a convict to survive in society
    reference: TODO:SOURCE
  self_care:
    type: input
    value: 0.3
    unit: intensity
    bounds:
      - 0
      - 1
    description: Self-care, attending to physical recovery, slowing the progression of after-effects from forced labor
    reference: TODO:SOURCE
  physical_health:
    type: state
    value: 60
    unit: hp
    bounds:
      - 0
      - 100
    description: Physical state, a composite of long-term damage from 19 years of forced labor and aging
    reference: TODO:SOURCE
    io_role: output
  redemption_progress:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: Redemption progress, accumulation of good deeds to make amends for the past
    reference: TODO:SOURCE
    io_role: output
  javert_pursuit:
    type: state
    value: 15
    unit: score
    bounds:
      - 0
      - 100
    description: Javert's pursuit, how much the police know of his identity and whereabouts
    reference: TODO:SOURCE
    io_role: output
  community_trust:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: Community trust, the social-trust capital built under his new identity
    reference: TODO:SOURCE
    io_role: output
equations:
  health_decay:
    dynamics:
      physical_health: max(0, physical_health - (0.8) - (virtue_effort * 0.6) + (self_care * 1.5))
    description: The after-effects of forced labor are irreversible; good deeds consume strength; self-care can slow the decline
    reference: TODO:SOURCE
  redemption_growth:
    dynamics:
      redemption_progress: min(100, redemption_progress + virtue_effort * 2.5)
    description: Good deeds accumulate redemption
    reference: TODO:SOURCE
  javert_tracking:
    dynamics:
      javert_pursuit: min(100, max(0, javert_pursuit + (0.5) + (virtue_effort * 0.3) - (concealment * 1.5)))
    description: Concealing his identity slows pursuit; but the visibility of good deeds can itself leak clues
    reference: TODO:SOURCE
  trust_growth:
    dynamics:
      community_trust: min(100, community_trust + (virtue_effort * 1.5) + (concealment * 0.8))
    description: Community trust accumulates with good deeds and a stable identity
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: month
  start_date: '1815-01-01'
  end_date: '1832-12-31'
  output_types:
    - input
    - state
optimization:
  method: nsga2
  objectives:
    - variable: redemption_progress
      metric: final
      direction: maximize
    - variable: community_trust
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: virtue_effort
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: The intensity of practicing good deeds
        optimize:
          value:
            - 0
            - 2
      - variable: concealment
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Concealing his identity
        optimize:
          value:
            - 0
            - 1
      - variable: self_care
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Self-care
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - Les Misérables (Victor Hugo, 1862)
