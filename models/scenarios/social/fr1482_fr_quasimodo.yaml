      metric: final
      direction: maximize
    - variable: sanctuary_integrity
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: defense_intensity
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Defense intensity
        optimize:
          value:
            - 0
            - 3
      - variable: care_for_esmeralda
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Caring for Esmeralda
        optimize:
          value:
            - 0
            - 1
      - variable: negotiation_attempt
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Attempting to communicate with the outside world
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - Notre-Dame de Paris (Victor Hugo, 1831)
