  name: fr1482_fr_quasimodo
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      卡西莫多（雨果《巴黎圣母院》1831）将艾丝美拉达藏入圣母院避难后面临三重权衡：防守强度，即能阻止追捕者入侵但会消耗体力且加剧冲突；对艾丝美拉达的照料，即能维持她的生存希望但会减少防守资源；以及与外界沟通尝试，即寻求援助但会暴露庇护位置的风险。卡西莫多的残障和语言障碍使外部沟通代价极高，圣母院的圣所豁免权是唯一法律屏障。
    result: >
      仿真预期比较三种策略下艾丝美拉达存活概率与卡西莫多体力剩余的 30 天轨迹。当前为草案状态，参数待校准。
    limitations: 草案，参数、目标和叙事细节待校准；文学设定，无客观历史数据。
  ratings:
    variable: 0.0 - 全部6个变量均标注TODO:SOURCE，纯文学设定无客观数据
    equation: 0.0 - 5条方程均为纯叙事自建，reference标注TODO:SOURCE
    simulation: 0.5 - 配置完整，变量/方程/仿真区间齐全，但标记nosim尚未实际运行验证
    optimization: 0.0 - esmeralda_hope与sanctuary_integrity经方程追踪无对立驱动，两决策变量各自独立作用于单一目标
    importance: 0.25 - 《巴黎圣母院》是雨果经典，但相对小众受众，且为文学设定，非框架依赖模块
    innovation: 0.5 - 将文学叙事张力转化为可优化动力学系统，核心决策权衡结构沿用已知框架
    confidence: 0.0 - 尚未验证：未跑通--sim/--opt，此前fan分支曾标注0.25但未核实实际运行状态，予以更正
  tags:
    - disability
    - isolation
    - protection
    - love
    - sacrifice
    - literature
  references:
    - Notre-Dame de Paris (Victor Hugo, 1831)
variables:
  defense_intensity:
    type: input
    value: 2.0
    unit: intensity
    bounds:
      - 0
      - 3
    description: 防守强度：主动抵抗攻入圣母院的人群/骑兵的激烈程度
    reference: TODO:SOURCE
  care_for_esmeralda:
    type: input
    value: 0.6
    unit: intensity
    bounds:
      - 0
      - 1
    description: 对艾丝美拉达的照料：提供食物·安慰·陪伴（减少她的恐惧与绝望）
    reference: TODO:SOURCE
  negotiation_attempt:
    type: input
    value: 0.2
    unit: intensity
    bounds:
      - 0
      - 1
    description: 与外界沟通尝试：通过弗罗洛等人寻求政治解决（风险：被利用）
    reference: TODO:SOURCE
  sanctuary_integrity:
    type: state
    value: 80
    unit: score
    bounds:
      - 0
      - 100
    description: 庇护所防守强度：圣母院能维持的安全屏障（物理+政治+宗教权威）
    reference: TODO:SOURCE
    io_role: output
  esmeralda_hope:
    type: state
    value: 35
    unit: score
    bounds:
      - 0
      - 100
    description: 艾丝美拉达的希望：她在庇护所中的心理状态和对未来的信心
    reference: TODO:SOURCE
    io_role: output
  quasimodo_health:
    type: state
    value: 70
    unit: hp
    bounds:
      - 0
      - 100
    description: 卡西莫多的体力：驼背+慢性疼痛+防守消耗的身体状态
    reference: TODO:SOURCE
    io_role: output
  external_pressure:
    type: state
    value: 30
    unit: score
    bounds:
      - 0
      - 100
    description: 外部威胁压力：王室·教会·民众对驱逐艾丝美拉达的压力
    reference: TODO:SOURCE
    io_role: output
  frollo_betrayal_risk:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: 弗罗洛背叛风险：卡西莫多对弗罗洛的信任被利用的程度
    reference: TODO:SOURCE
    io_role: output
equations:
  sanctuary_defense:
    dynamics:
      sanctuary_integrity: max(0, min(100, sanctuary_integrity + (defense_intensity * 5.0) - ((external_pressure / 100) * 4.0)))
    description: 防守力度vs外部压力
    reference: TODO:SOURCE
  esmeralda_mood:
    dynamics:
      esmeralda_hope: max(0, min(100, esmeralda_hope + (care_for_esmeralda * 3.0) - ((external_pressure / 100) * 2.0)))
    description: 希望感随照料和防守成功增加，随外部压力降低
    reference: TODO:SOURCE
  health_decay:
    dynamics:
      quasimodo_health: max(0, quasimodo_health - (1.0) - (defense_intensity * 1.5) + care_for_esmeralda * 0.3)
    description: 体力随防守强度和慢性疼痛消耗
    reference: TODO:SOURCE
  pressure_growth:
    dynamics:
      external_pressure: min(100, max(0, external_pressure + (2.5) - (negotiation_attempt * 2.0)))
    description: 外部压力随时间自然增长；谈判可部分缓解
    reference: TODO:SOURCE
  frollo_risk:
    dynamics:
      frollo_betrayal_risk: min(100, frollo_betrayal_risk + negotiation_attempt * 4.0)
    description: 与弗罗洛的沟通越多，被其利用艾丝美拉达的风险越高
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: day
  start_date: '1482-01-01'
  end_date: '1482-01-30'
  output_types:
    - input
    - state
optimizer:
  method: nsga2
  objectives:
    - variable: esmeralda_hope
      metric: final
      direction: maximize
    - variable: sanctuary_integrity
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: defense_intensity
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 防守强度
        optimize:
          value:
            - 0
            - 3
      - variable: care_for_esmeralda
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 对艾丝美拉达的照料
        optimize:
          value:
            - 0
            - 1
      - variable: negotiation_attempt
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: 与外界沟通尝试
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
