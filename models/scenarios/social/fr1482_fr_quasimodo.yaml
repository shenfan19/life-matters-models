category: social
metadata:
  todo:
    - type: noref
      issue: "Lacks sufficient literature citation support (migrated from the old filename's _noref suffix)"
      evidence: "Migrated from the legacy _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check and supply the missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: fr1482_fr_quasimodo
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      After hiding Esmeralda in Notre-Dame for sanctuary (Hugo's Notre-Dame de Paris, 1831),
      Quasimodo faces a triple tradeoff: defense intensity can stop pursuers from breaking in but
      depletes his strength and escalates the conflict; caring for Esmeralda sustains her will to
      survive but draws away resources from defense; and attempting to communicate with the outside
      world might seek help but risks exposing the sanctuary's location. Quasimodo's disability and
      speech impairment make outside communication extremely costly, and the cathedral's right of
      sanctuary is the only legal shield.
    result: >
      The simulation is expected to compare Esmeralda's survival probability and Quasimodo's
      remaining strength across a 30-day trajectory under three strategies. This is currently a
      draft, with parameters still to be calibrated.
    limitations: A draft; parameters, objectives, and narrative details still need calibration; a literary setting with no objective historical data.
  ratings:
    variable: 0.0 - All 6 variables are marked TODO:SOURCE, a purely literary setting with no objective data
    equation: 0.0 - All 5 equations are purely self-built for the narrative, with reference marked TODO:SOURCE
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 30-day trajectory normally, not yet compared point-by-point against independent data
    optimization: 0.0 - esmeralda_hope and sanctuary_integrity show no opposing drive when traced through the equations, with the two decision variables each acting independently on a single objective; verified on 2026-09-04 that --opt converges to a single front point (100,100), numerically confirming no tradeoff
    importance: 0.25 - Notre-Dame de Paris is a Hugo classic, but with a relatively niche audience, and this is a literary setting, not a module the framework depends on
    innovation: 0.5 - Converting literary narrative tension into an optimizable dynamical system, with the core decision-tradeoff structure carried over from a known framework
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared against an independent literature target
  tags:
    - disability
    - isolation
    - protection
    - love
    - sacrifice
    - literature
variables:
  defense_intensity:
    type: input
    value: 2.0
    unit: intensity
    bounds:
      - 0
      - 3
    description: Defense intensity, how fiercely he resists the crowd/cavalry attacking the cathedral
    reference: TODO:SOURCE
  care_for_esmeralda:
    type: input
    value: 0.6
    unit: intensity
    bounds:
      - 0
      - 1
    description: Caring for Esmeralda, providing food, comfort, and companionship (lowering her fear and despair)
    reference: TODO:SOURCE
  negotiation_attempt:
    type: input
    value: 0.2
    unit: intensity
    bounds:
      - 0
      - 1
    description: Attempting to communicate with the outside world, seeking a political solution through figures like Frollo (risk of being exploited)
    reference: TODO:SOURCE
  sanctuary_integrity:
    type: state
    value: 80
    unit: score
    bounds:
      - 0
      - 100
    description: The strength of the sanctuary's defense, the safety shield the cathedral can maintain (physical, political, and religious authority)
    reference: TODO:SOURCE
    io_role: output
  esmeralda_hope:
    type: state
    value: 35
    unit: score
    bounds:
      - 0
      - 100
    description: Esmeralda's hope, her psychological state in the sanctuary and confidence in the future
    reference: TODO:SOURCE
    io_role: output
  quasimodo_health:
    type: state
    value: 70
    unit: hp
    bounds:
      - 0
      - 100
    description: Quasimodo's strength, his bodily state, a composite of his hunched back, chronic pain, and defense exertion
    reference: TODO:SOURCE
    io_role: output
  external_pressure:
    type: state
    value: 30
    unit: score
    bounds:
      - 0
      - 100
    description: External threat pressure, pressure from the crown, church, and populace to expel Esmeralda
    reference: TODO:SOURCE
    io_role: output
  frollo_betrayal_risk:
    type: state
    value: 20
    unit: score
    bounds:
      - 0
      - 100
    description: The risk of Frollo's betrayal, how much Quasimodo's trust in Frollo is being exploited
    reference: TODO:SOURCE
    io_role: output
equations:
  sanctuary_defense:
    dynamics:
      sanctuary_integrity: max(0, min(100, sanctuary_integrity + (defense_intensity * 5.0) - ((external_pressure / 100) * 4.0)))
    description: Defense effort versus external pressure
    reference: TODO:SOURCE
  esmeralda_mood:
    dynamics:
      esmeralda_hope: max(0, min(100, esmeralda_hope + (care_for_esmeralda * 3.0) - ((external_pressure / 100) * 2.0)))
    description: Hope rises with care and successful defense, and falls with external pressure
    reference: TODO:SOURCE
  health_decay:
    dynamics:
      quasimodo_health: max(0, quasimodo_health - (1.0) - (defense_intensity * 1.5) + care_for_esmeralda * 0.3)
    description: Strength is depleted by defense intensity and chronic pain
    reference: TODO:SOURCE
  pressure_growth:
    dynamics:
      external_pressure: min(100, max(0, external_pressure + (2.5) - (negotiation_attempt * 2.0)))
    description: External pressure grows naturally over time; negotiation can partly ease it
    reference: TODO:SOURCE
  frollo_risk:
    dynamics:
      frollo_betrayal_risk: min(100, frollo_betrayal_risk + negotiation_attempt * 4.0)
    description: The more he communicates with Frollo, the higher the risk Frollo exploits it against Esmeralda
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: day
  start_date: '1482-01-01'
  end_date: '1482-01-30'
  output_types:
