  description:
    problem: >
      第三次鼠疫大流行始于 1855 年云南，经香港、孟买向全球扩散，前抗生素时代个人可控干预极其有限，逃离、隔离和消灭鼠患是仅有的手段；具体人物视角，例如云南农民、香港殖民地医生、孟买码头工人，待确定。
    result: >
      仿真窗口已预置，覆盖 1855 年 1 月 1 日至 12 月 31 日；变量和方程待人物视角确定后填写，该场景尚未实际运行仿真。
    limitations: 人物视角、地理背景和核心干预变量均未确定；需参考 Benedict 1996 和 Echenberg 2007。
