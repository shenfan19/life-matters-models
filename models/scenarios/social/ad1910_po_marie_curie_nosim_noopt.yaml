metadata:
  name: ad1910_po_marie_curie
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      居里夫人放射性研究（1898–1906，巴黎）中，辐射积累随实验强度线性增长（radiation += research_intensity × exposure_factor），
      同时辐射和过劳共同降低健康并抑制研究产出（progress += research_intensity × (1−radiation/120)）。
      授课与经费申请是维持研究经费的必要来源，使实验时间受限；
      性别歧视导致机构支持更少，加剧了辐射-健康-财务的三角约束。
    result: >
      仿真预期显示 8 年（96 月）内辐射积累、健康损耗、研究进度和经费的月动态；
      三目标优化（最大化放射性发现、维持健康、保持财务）预期给出最优实验/授课/休息分配路径——仿真尚未运行。
    limitations: 历史辐射剂量难以精确重建（居里夫人时代无个人剂量计）；辐射健康损耗使用现代 ICRP 框架，可能低估当时未知危害；性别歧视对机构支持的量化为模型假设。

  ratings:
    topic_importance: 5 - 居里夫人是全球最知名女科学家，辐射与性别权衡具有普世意义
    framework_demand: 1 - 历史叙事场景，不被其他模型引用
    evidence_quality: 3 - 辐射暴露动力学基础较好，历史细节估算成分中等
    innovation: 4 - 辐射累积 × 性别压制 × 研究节律三维权衡建模，视角独特
    social_value: 5 - 科学史最具代表性的性别与健康权衡案例，兼具科学教育和社会正义价值
  tags: [historical, curie, radiation, research, 19th-century, france, women-in-science]
  period: "1898-1906"
  location: "Paris, France"
  step_size:
    value: 1
    unit: month
variables:
  # 输入变量（玩家每月可调整）
  research_intensity:
    type: input
    value: 0.6
    unit: "强度"
    bounds: [0.0, 1.0]
    description: "实验室研究强度（0=不做实验, 1=全力投入）；辐射主要来源"

  rest_time:
    type: input
    value: 0.2
    unit: "强度"
    bounds: [0.0, 1.0]
    description: "休养与郊外疗养时间比例；降低辐射，恢复健康"

  teaching_load:
    type: input
    value: 0.3
    unit: "强度"
    bounds: [0.0, 0.8]
    description: "授课负荷（巴黎高等师范学校）；主要稳定收入来源，消耗健康"

  fundraise_effort:
    type: input
    value: 0.1
    unit: "强度"
    bounds: [0.0, 0.6]
    description: "经费申请投入（撰写报告、游说委员会）；大额收入但成功率低"

  # 状态变量
  health:
    type: state
    value: 100.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "身体健康（辐射损伤、过劳、营养不足的综合体现）"

  radiation:
    type: state
    value: 0.0
    unit: "分"
    bounds: [0, 120]
    io_role: output
    description: "辐射积累量（不可逆；>60时急性症状；>90时危及生命）"

  research_progress:
    type: state
    value: 0.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "研究进度（目标100=完成钋和镭的发现与提炼）"

  money:
    type: state
    value: 40.0
    unit: "分"
    bounds: [0, 100]
    io_role: output
    description: "研究经费（<10时无法维持实验室运转）"

simulation:
  start_date: "1910-01-01"
  end_date: "1918-01-01"
  output_variables:
  - health
  - radiation
  - research_progress
  - money
formulas:
  # 研究产出洞见，同时积累辐射
  research_gain:
    description: "实验室研究推进科学进展，同时辐射不可避免地积累"
    condition: research_intensity > 0
    priority: 10
    dynamics:
      research_progress: "min(100, research_progress + research_intensity * 8.0 * max(0.3, 1 - radiation / 120))"
      radiation: "min(120, radiation + research_intensity * 4.0)"
      money: "max(0, money - research_intensity * 2.0)"

  # 休养恢复健康，缓慢降低辐射（不可逆，只能减缓）
  rest_recovery:
    description: "休养恢复健康，新鲜空气和休息能轻微减缓辐射损伤"
    condition: rest_time > 0
    priority: 9
    dynamics:
      health: "min(100, health + rest_time * 10.0)"
      radiation: "max(0, radiation - rest_time * 1.5)"

  # 授课带来稳定收入，消耗健康
  teaching_income:
    description: "教学维持经费，但占用时间和精力，轻度损耗健康"
    condition: teaching_load > 0
    priority: 8
    dynamics:
      money: "min(100, money + teaching_load * 8.0)"
      health: "max(0, health - teaching_load * 2.0)"

  # 申请经费（高收益，低概率成功）
  fundraise_income:
    description: "游说科学委员会申请经费；时间消耗大，成功带来较大资助"
    condition: fundraise_effort > 0
    priority: 7
    dynamics:
      money: "min(100, money + fundraise_effort * 20.0)"
      health: "max(0, health - fundraise_effort * 3.0)"

  # 辐射持续损害健康（慢性，不可逆）
  radiation_damage:
    description: "长期辐射暴露对健康的慢性侵蚀"
    condition: radiation > 0
    priority: 6
    dynamics:
      health: "max(0, health - radiation * 0.04)"

  # 辐射超阈值：急性症状
  acute_radiation:
    description: "辐射积累超过60分后出现急性症状，健康加速恶化"
    condition: radiation >= 60
    priority: 11
    dynamics:
      health: "max(0, health - (radiation - 60) * 0.08)"

  # 经费不足无法维持实验室
  funding_crisis:
    description: "经费严重不足时实验室无法运转，研究进度停滞"
    condition: money < 10
    priority: 5
    dynamics:
      research_progress: "max(0, research_progress - 3.0)"
      health: "max(0, health - 2.0)"

  # 学术歧视：常态压力（每回合）
  discrimination_pressure:
    description: "作为女性科学家承受的持续性学术偏见压力"
    condition: true
    priority: 4
    dynamics:
      money: "max(0, money - 1.5)"
      health: "max(0, health - 0.5)"

optimizer:
  method: multi_objective
  algorithm: nsga2
  population_size: 50
  generations: 60

  objectives:
  - variable: research_progress
    direction: maximize
    weight: 1.0
  - variable: health
    direction: maximize
    weight: 0.8
  - variable: radiation
    direction: minimize
    weight: 0.6

  constraints:
  - expression: "health >= 30"
    description: "健康不能低于30（历史约束：居里夫人坚持工作至生命最后阶段）"
  - expression: "money >= 5"
    description: "最低经费维持实验室基本运转"

  variables_to_optimize:
  - name: research_fraction
    default: 0.6
    bounds: [0.0, 1.0]
    maps_to: research_intensity

  - name: rest_fraction
    default: 0.2
    bounds: [0.0, 0.5]
    maps_to: rest_time

  - name: teaching_fraction
    default: 0.3
    bounds: [0.0, 0.7]
    maps_to: teaching_load

  - name: fundraise_fraction
    default: 0.1
    bounds: [0.0, 0.5]
    maps_to: fundraise_effort
