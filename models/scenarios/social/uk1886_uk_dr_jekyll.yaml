category: social
metadata:
  todo:
    - type: noref
      issue: "Lacks sufficient literature citation support (migrated from the old filename's _noref suffix)"
      evidence: "Migrated from the legacy _noref suffix marker; the specific gaps in metadata.references and each variable's reference field have not yet been checked."
      next: "Check and supply the missing literature citations, or confirm the existing citations are sufficient and remove this todo item."
  name: uk1886_uk_dr_jekyll
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      Dr. Jekyll (Stevenson's Strange Case of Dr Jekyll and Mr Hyde, 1886) faces a triple dynamic
      tension: drug-usage frequency releases repressed impulses in the short term each time, but
      accumulating tolerance lowers the threshold for uncontrollable transformation; scientific
      research rigor pursues an antidote, but the research itself requires continued exposure to the
      drug; and maintaining a social facade lowers the risk of external discovery, but the positive
      feedback from repression accelerates dependency. The addiction spiral moves in sequence through
      self-control, habit, tolerance, spontaneous transformation in sleep, and loss of control, an
      irreversible phase-transition point.
    result: >
      The simulation is expected to show the trajectory over 52 weeks of the fraction of time Hyde
      controls the body, identity stability, and antidote-research progress. This is currently a
      draft, with parameters still to be calibrated.
    limitations: A draft; parameters, objectives, and narrative details still need calibration; the addiction-tolerance-dynamics parameters need grounding in neuroscience literature.
  ratings:
    variable: 0.0 - All 7 variables are marked TODO:SOURCE, with the addiction-tolerance-dynamics parameters not anchored to neuroscience literature
    equation: 0.0 - All 5 equations are purely self-built for the narrative, with reference marked TODO:SOURCE
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 52-week trajectory normally, not yet compared point-by-point against independent data
    optimization: 0.0 - self_control and antidote_progress show no opposing drive when traced through the equations, with research_rigor benefiting both objectives at once; verified on 2026-09-04 that --opt converges to a single front point (100,100), numerically confirming no tradeoff
    importance: 0.25 - Dr. Jekyll is a famous literary metaphor for addiction dynamics and the ethics of self-experimentation, but with a relatively niche audience, not a module the framework depends on
    innovation: 0.5 - Converting literary narrative tension into an optimizable dynamical system, with the core decision-tradeoff structure carried over from a known framework
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared against an independent literature target
  tags:
    - addiction
    - self-experimentation
    - dual-personality
    - ethics
    - literature
variables:
  drug_usage_frequency:
    type: input
    value: 1.0
    unit: times_per_week
    bounds:
      - 0
      - 5
    description: Drug-usage frequency, how many times per week he takes the transformation potion (higher means Hyde stays longer)
    reference: TODO:SOURCE
  research_rigor:
    type: input
    value: 0.5
    unit: intensity
    bounds:
      - 0
      - 1
    description: Scientific research rigor, effort spent analyzing the drug's mechanism and seeking an antidote
    reference: TODO:SOURCE
  social_facade:
    type: input
    value: 0.7
    unit: intensity
    bounds:
      - 0
      - 1
    description: Maintaining a social facade, keeping up a gentlemanly image as Jekyll, concealing Hyde's actions
    reference: TODO:SOURCE
  self_control:
    type: state
    value: 90
    unit: score
    bounds:
      - 0
      - 100
    description: Self-control, Jekyll's ability to keep his consciousness dominant (falling to 0 means Hyde has fully taken over)
    reference: TODO:SOURCE
    io_role: output
  hyde_dominance:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: Hyde's dominance, the degree to which the dark-side personality controls the body
    reference: TODO:SOURCE
    io_role: output
  drug_dependency:
    type: state
    value: 0
    unit: score
    bounds:
      - 0
      - 100
    description: Drug dependency, the progression of needing an ever-larger dose to achieve the same effect
    reference: TODO:SOURCE
    io_role: output
  social_exposure_risk:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: Social exposure risk, the risk of Hyde's actions being traced back to Jekyll
    reference: TODO:SOURCE
    io_role: output
  antidote_progress:
    type: state
    value: 0
    unit: score
    bounds:
      - 0
      - 100
    description: Antidote-research progress, progress toward a scientific solution to permanently control Hyde
    reference: TODO:SOURCE
    io_role: output
equations:
  dependency_growth:
    dynamics:
      drug_dependency: min(100, drug_dependency + (drug_usage_frequency * 2.5))
    description: Addiction grows exponentially with usage frequency
    reference: TODO:SOURCE
  self_control_decay:
    dynamics:
      self_control: max(0, min(100, self_control - ((drug_dependency / 100) * 3.0) - ((hyde_dominance / 100) * 2.0) + (research_rigor * 1.5)))
    description: Self-control is depleted by dependency and Hyde's dominance
    reference: TODO:SOURCE
  hyde_growth:
    dynamics:
      hyde_dominance: min(100, max(0, hyde_dominance + (drug_usage_frequency * 1.5 + (drug_dependency / 100) * 2.0) - (self_control / 100 * 1.0)))
    description: Hyde's personality strengthens with usage count and dependency
    reference: TODO:SOURCE
  exposure_risk:
    dynamics:
      social_exposure_risk: min(100, max(0, social_exposure_risk + ((hyde_dominance / 100) * 3.0) - (social_facade * 1.5)))
    description: Exposure risk grows with Hyde's dominance, and maintaining the facade can delay it
    reference: TODO:SOURCE
  antidote_research:
    dynamics:
      antidote_progress: min(100, antidote_progress + (research_rigor * (self_control / 100)) * 3.0)
    description: Antidote-research progress advances with research effort, but declining self-control lowers research efficiency
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: week
  start_date: '1886-01-01'
  end_date: '1886-12-30'
  output_types:
    - input
    - state
optimization:
  method: nsga2
  objectives:
    - variable: self_control
      metric: final
      direction: maximize
    - variable: antidote_progress
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: drug_usage_frequency
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Drug-usage frequency
        optimize:
          value:
            - 0
            - 5
      - variable: research_rigor
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Scientific research rigor
        optimize:
          value:
            - 0
            - 1
      - variable: social_facade
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Maintaining a social facade
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - Strange Case of Dr Jekyll and Mr Hyde (R.L. Stevenson, 1886)
