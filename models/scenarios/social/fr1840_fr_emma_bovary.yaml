  name: fr1840_fr_emma_bovary
  lm_format_version: "1.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      After marriage, Emma Bovary (Flaubert's Madame Bovary, 1857) faces a triple dynamic
      tension: the intensity of pursuing romanticism brings short-term emotional satisfaction but
      accumulates debt and moral cost; integrating into rural reality can lower debt risk but
      deepens her depression and disillusionment; and self-awareness can reduce both hallucination
      and debt but requires facing a reality she cannot escape. Restarting the romantic pursuit
      after each disillusionment forms a positive-feedback spiral, ultimately ending in a debt
      collapse.
    result: >
      The simulation is expected to show the monthly dynamics of psychological satisfaction, debt
      accumulation, and social reputation across 60 months, and the collapse trajectory. This is
      currently a draft, with parameters still to be calibrated.
    limitations: A draft; parameters, objectives, and narrative details still need calibration; a literary setting with no objective historical data.
  ratings:
    variable: 0.0 - All 6 variables are marked TODO:SOURCE, a purely literary setting with no objective data
    equation: 0.0 - All 4 equations are purely self-built for the narrative, with reference marked TODO:SOURCE
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 60-month trajectory normally, not yet compared point-by-point against independent data
    optimization: 0.0 - psychological_health and social_reputation show no opposing drive when traced through the equations, with romantic_pursuit harming both objectives at once; verified on 2026-09-04 that --opt converges to a single front point (100,95), numerically confirming no tradeoff
    importance: 0.25 - Madame Bovary is a classic literary case, but with a relatively niche audience, and this is a literary setting, not a module the framework depends on
    innovation: 0.5 - Converting literary narrative tension into an optimizable dynamical system, with the core decision-tradeoff structure carried over from a known framework
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared against an independent literature target
  tags:
    - depression
    - romantic-delusion
    - debt
    - society
    - literature
variables:
  romantic_pursuit:
    type: input
    value: 1.5
    unit: intensity
    bounds:
      - 0
      - 3
    description: The intensity of pursuing romanticism, the intensity of pursuing affairs, fine clothes, and extravagant living
    reference: TODO:SOURCE
  social_conformity:
    type: input
    value: 0.3
    unit: ratio
    bounds:
      - 0
      - 1
    description: Integrating into rural life, accepting a mundane reality and fulfilling the duties of wife and mother
    reference: TODO:SOURCE
  self_reflection:
    type: input
    value: 0.1
    unit: intensity
    bounds:
      - 0
      - 1
    description: Self-awareness, the effort to understand the gap between her own expectations and reality
    reference: TODO:SOURCE
  psychological_health:
    type: state
    value: 60
    unit: score
    bounds:
      - 0
      - 100
    description: Psychological health, an inverse indicator of depression level (high=healthy, low=collapsed)
    reference: TODO:SOURCE
    io_role: output
  debt_level:
    type: state
    value: 5
    unit: score
    bounds:
      - 0
      - 100
    description: Debt accumulation, debt incurred pursuing a romanticized life
    reference: TODO:SOURCE
    io_role: output
  disillusionment:
    type: state
    value: 10
    unit: score
    bounds:
      - 0
      - 100
    description: Disillusionment, the accumulated disappointment from each dashed expectation
    reference: TODO:SOURCE
    io_role: output
  social_reputation:
    type: state
    value: 65
    unit: score
    bounds:
      - 0
      - 100
    description: Social reputation, her social standing and how others regard her in the small town
    reference: TODO:SOURCE
    io_role: output
equations:
  debt_growth:
    dynamics:
      debt_level: min(100, debt_level + romantic_pursuit * 2.5)
    description: The romantic pursuit accumulates debt
    reference: TODO:SOURCE
  disillusionment_growth:
    dynamics:
      disillusionment: min(100, disillusionment + romantic_pursuit * 1.5 - self_reflection * 2.0)
    description: Each pursuit rebounds into disillusionment
    reference: TODO:SOURCE
  mental_decay:
    dynamics:
      psychological_health: max(0, min(100, psychological_health - ((disillusionment / 100) * 2.5) - ((debt_level / 100) * 1.5) + (social_conformity * 1.0) + (self_reflection * 1.5)))
    description: Disillusionment, debt, and repression together erode psychological health
    reference: TODO:SOURCE
  reputation_change:
    dynamics:
      social_reputation: max(0, min(100, social_reputation - (romantic_pursuit * 0.8) + social_conformity * 0.5))
    description: Exposure of the affairs lowers her reputation
    reference: TODO:SOURCE
simulation:
  step_size:
    value: 1
    unit: month
  start_date: '1840-01-01'
  end_date: '1844-12-31'
  output_types:
    - input
    - state
optimization:
  method: nsga2
  objectives:
    - variable: psychological_health
      metric: final
      direction: maximize
    - variable: social_reputation
      metric: final
      direction: maximize
  startpoint:
    regimens:
      - variable: romantic_pursuit
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: The intensity of pursuing romanticism
        optimize:
          value:
            - 0
            - 3
      - variable: social_conformity
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Integrating into rural life
        optimize:
          value:
            - 0
            - 1
      - variable: self_reflection
        time_start: "09:00"
        time_end: "09:00"
        days:
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
          - Sun
        label: Self-awareness
        optimize:
          value:
            - 0
            - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

references:
  - Madame Bovary (Gustave Flaubert, 1857)
