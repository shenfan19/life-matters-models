metadata:
  name: ad1910_po_marie_curie
  lm_format_version: "1.0"
  updated: 2026-04-23
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      In Marie Curie's radioactivity research in Paris from 1898 to 1906, accumulated radiation
      exposure, the radiation variable, rises linearly with experimental intensity, radiation +=
      research_intensity x exposure_factor, while radiation and overwork together lower health and
      suppress research output, progress += research_intensity x (1 minus radiation/120). Teaching
      and grant applications are necessary sources of research funding, limiting time available for
      experiments; gender discrimination reduces institutional support, worsening the triangular
      constraint among radiation, health, and finances.
    result: >
      The simulation shows the monthly dynamics of accumulated radiation, health depletion,
      research progress, and funding across 8 years, 96 months; a three-objective optimization
      (verified on 2026-09-04, converging over 60 generations, 100% feasible, 46 Pareto solutions)
      confirms a genuine tradeoff for research_intensity against research_progress (spanning 6.28 to
      100), while the health objective stays nearly constant across the front (around 99.3), and the
      radiation objective converges to 0 across all solutions; the tradeoff structure for the latter
      two has not been confirmed numerically and requires manual review.
    limitations: Historical radiation dose is difficult to reconstruct precisely, since personal dosimeters did not yet exist in Curie's time; the radiation health-damage model uses the modern ICRP framework, which may understate hazards unknown at the time; the quantification of gender discrimination's effect on institutional support is a model assumption.

  ratings:
    variable: 0.5 - Radiation damage is anchored to the modern ICRP framework, with historical dose and gender discrimination quantified as model assumptions
    equation: 0.5 - The radiation-and-research-output equations are self-built, anchored to point estimates from the ICRP radiation-damage framework
    simulation: 0.75 - Verified on 2026-09-04, --sim produces a plausible 96-month trajectory normally, not yet compared point-by-point against independent data
    optimization: 0.5 - Verified on 2026-09-04, --opt converges to 46 Pareto solutions, with the research_progress-dimension tradeoff numerically confirmed, but the health/radiation objectives stay nearly constant across the front, so the tradeoff there is not numerically supported
    importance: 0.5 - Marie Curie is one of the world's most famous female scientists, but this is a historical-narrative scenario, not a module the framework depends on
    innovation: 0.5 - The three-way tradeoff perspective of radiation accumulation, gender suppression, and research rhythm is a distinctive angle, with the core radiation-exposure mechanism carried over from the modern framework
    confidence: 0.25 - Verified on 2026-09-04, --sim/--opt both run normally, but not yet compared point-by-point against an independent historical-literature target value
  tags: [historical, curie, radiation, research, 19th-century, france, women-in-science]
  period: "1898-1906"
  location: "Paris, France"
variables:
  # Input variables (adjustable monthly by the player)
  research_intensity:
    type: input
    value: 0.6
    unit: "intensity"
    bounds: [0.0, 1.0]
    description: "Laboratory-research intensity (0=no experiments, 1=full commitment); the main source of radiation"

  rest_time:
    type: input
    value: 0.2
    unit: "intensity"
    bounds: [0.0, 1.0]
    description: "The proportion of time spent on recuperation and countryside rest; lowers radiation, restores health"

  teaching_load:
    type: input
    value: 0.3
    unit: "intensity"
    bounds: [0.0, 0.8]
    description: "Teaching load (at the Ecole Normale Superieure); the main stable income source, depletes health"

  fundraise_effort:
    type: input
    value: 0.1
    unit: "intensity"
    bounds: [0.0, 0.6]
    description: "Effort spent applying for funding (writing reports, lobbying committees); a large payoff but a low success rate"

  # State variables
  health:
    type: state
    value: 100.0
    unit: "score"
    bounds: [0, 100]
    io_role: output
    description: "Physical health (a composite of radiation damage, overwork, and malnutrition)"

  radiation:
    type: state
    value: 0.0
    unit: "score"
    bounds: [0, 120]
    io_role: output
    description: "Accumulated radiation (irreversible; acute symptoms above 60; life-threatening above 90)"

  research_progress:
    type: state
    value: 0.0
    unit: "score"
    bounds: [0, 100]
    io_role: output
    description: "Research progress (target 100 = completing the discovery and isolation of polonium and radium)"

  money:
    type: state
    value: 40.0
    unit: "score"
    bounds: [0, 100]
    io_role: output
    description: "Research funding (below 10, the laboratory cannot keep running)"

simulation:
  step_size:
    value: 1
    unit: month
  start_date: "1910-01-01"
  end_date: "1918-01-01"
  output_variables:
    - health
    - radiation
    - research_progress
    - money
equations:
  # Research yields insight while accumulating radiation
  research_gain:
    description: "Laboratory research advances scientific progress, while radiation accumulates unavoidably"
    condition: research_intensity > 0
    priority: 10
    dynamics:
      research_progress: "min(100, research_progress + research_intensity * 8.0 * max(0.3, 1 - radiation / 120))"
      radiation: "min(120, radiation + research_intensity * 4.0)"
      money: "max(0, money - research_intensity * 2.0)"

  # Rest restores health and slowly lowers radiation (irreversible, only slowed)
  rest_recovery:
    description: "Rest restores health; fresh air and rest can slightly slow radiation damage"
    condition: rest_time > 0
    priority: 9
    dynamics:
      health: "min(100, health + rest_time * 10.0)"
      radiation: "max(0, radiation - rest_time * 1.5)"

  # Teaching brings stable income, depletes health
  teaching_income:
    description: "Teaching sustains funding, but takes time and energy, mildly depleting health"
    condition: teaching_load > 0
    priority: 8
    dynamics:
      money: "min(100, money + teaching_load * 8.0)"
      health: "max(0, health - teaching_load * 2.0)"

  # Applying for funding (high payoff, low success probability)
  fundraise_income:
    description: "Lobbying the science committee for funding; consumes much time, and success brings a substantial grant"
    condition: fundraise_effort > 0
    priority: 7
    dynamics:
      money: "min(100, money + fundraise_effort * 20.0)"
      health: "max(0, health - fundraise_effort * 3.0)"

  # Radiation continually damages health (chronic, irreversible)
  radiation_damage:
    description: "Long-term radiation exposure's chronic erosion of health"
    condition: radiation > 0
    priority: 6
    dynamics:
      health: "max(0, health - radiation * 0.04)"

  # Radiation exceeding threshold: acute symptoms
  acute_radiation:
    description: "Once accumulated radiation exceeds 60, acute symptoms appear and health deteriorates faster"
    condition: radiation >= 60
    priority: 11
    dynamics:
      health: "max(0, health - (radiation - 60) * 0.08)"

  # Insufficient funding halts the laboratory
  funding_crisis:
    description: "When funding is severely short, the laboratory cannot operate and research progress stalls"
    condition: money < 10
    priority: 5
    dynamics:
      research_progress: "max(0, research_progress - 3.0)"
      health: "max(0, health - 2.0)"

  # Academic discrimination: a constant pressure (every step)
  discrimination_pressure:
    description: "The sustained academic-prejudice pressure borne as a female scientist"
    condition: true
    priority: 4
    dynamics:
      money: "max(0, money - 1.5)"
      health: "max(0, health - 0.5)"

optimization:
  method: nsga2
  algorithm:
    population_size: 50
    n_generations: 60

  objectives:
    - variable: research_progress
      metric: final
      direction: maximize
    - variable: health
      metric: mean
      direction: maximize
    - variable: radiation
      metric: final
      direction: minimize

  constraints:
    - variable: health
      condition: ">= 30"
      description: "Health should not fall below 30 (a historical constraint: Marie Curie kept working until the final stage of her life)"
    - variable: money
      condition: ">= 5"
      description: "A minimum funding level needed to keep the laboratory running at all"

  startpoint:
    regimens:
      - variable: research_intensity
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Laboratory-research intensity"
        optimize:
          value: [0.0, 1.0]
      - variable: rest_time
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "The proportion of time spent resting"
        optimize:
          value: [0.0, 0.5]
      - variable: teaching_load
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Teaching load"
        optimize:
          value: [0.0, 0.7]
      - variable: fundraise_effort
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Effort spent applying for funding"
        optimize:
          value: [0.0, 0.5]
