category: social
metadata:
  name: fr1815_fr_jean_valjean
  lm_format_version: "1.0"
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  description:
    problem: >
      冉·阿让（雨果《悲惨世界》1862）在主教的宽恕后选择救赎，面临三重持续张力：
      践行善行强度（积累社会资本和道德完整性，但暴露身份风险增加）、
      隐藏身份（维持安全但每次暴露威胁都可能引发道德危机）、
      自我照料（保持长期能力但与彻底利他的救赎逻辑冲突）——
      贾维尔的追踪是恒定外部压力，跨越 18 年的逃亡与救赎弧线。
    result: >
      仿真预期显示 216 个月内道德资本、身份安全度和贾维尔追踪压力的动态轨迹——草案状态，参数待校准（noref）。
    limitations: 草案，参数、目标和叙事细节待校准；文学设定，无客观历史数据（noref）。
  ratings:
    topic_importance: 4 - 冉·阿让是文学史上最著名的救赎叙事，司法不公与道德重生有深刻社会意义
    framework_demand: 1 - TODO存根，尚未被其他模型引用
    evidence_quality: 1 - TODO草案，参数未完善，且为文学设定
    innovation: 2 - 将善行-隐藏身份-自我照料的三角权衡转化为动力学意图清晰，但尚未完善
    social_value: 5 - 《悲惨世界》是探讨社会正义和人性救赎的世界级经典，社会价值极高
  tags:
  - justice
  - redemption
  - labor-injury
  - aging
  - identity
  - literature
  references:
  - 悲惨世界 (Victor Hugo, 1862)
  step_size:
    value: 1
    unit: month
variables:
  virtue_effort:
    type: input
    value: 1.5
    unit: intensity
    bounds:
    - 0
    - 2
    description: 践行善行强度：用行动救助他人、回报社会的努力
    reference: TODO:SOURCE
  concealment:
    type: input
    value: 0.7
    unit: ratio
    bounds:
    - 0
    - 1
    description: 隐藏身份：掩盖前囚犯身份以在社会中生存
    reference: TODO:SOURCE
  self_care:
    type: input
    value: 0.3
    unit: intensity
    bounds:
    - 0
    - 1
    description: 自我照料：注意身体恢复，减少苦役后遗症的进展
    reference: TODO:SOURCE
  physical_health:
    type: state
    value: 60
    unit: hp
    bounds:
    - 0
    - 100
    description: 身体状态：19年苦役的长期损伤与老化的综合健康
    reference: TODO:SOURCE
    io_role: output
  redemption_progress:
    type: state
    value: 5
    unit: score
    bounds:
    - 0
    - 100
    description: 救赎进度：用善行弥补过去的积累
    reference: TODO:SOURCE
    io_role: output
  javert_pursuit:
    type: state
    value: 15
    unit: score
    bounds:
    - 0
    - 100
    description: 贾维尔的追踪：警察对他身份和下落的掌握程度
    reference: TODO:SOURCE
    io_role: output
  community_trust:
    type: state
    value: 5
    unit: score
    bounds:
    - 0
    - 100
    description: 社区信任：在新身份下建立的社会信任资本
    reference: TODO:SOURCE
    io_role: output
formulas:
  health_decay:
    formula:
      physical_health: max(0, physical_health - (0.8) - (virtue_effort * 0.6) + (self_care * 1.5))
    description: 苦役后遗症不可逆；善行消耗体力；自我照料可减缓
    reference: TODO:SOURCE
  redemption_growth:
    formula:
      redemption_progress: min(100, redemption_progress + virtue_effort * 2.5)
    description: 善行积累救赎
    reference: TODO:SOURCE
  javert_tracking:
    formula:
      javert_pursuit: min(100, max(0, javert_pursuit + (0.5) + (virtue_effort * 0.3) - (concealment * 1.5)))
    description: 隐藏身份减缓追踪；善行的曝光度反而可能泄露线索
    reference: TODO:SOURCE
  trust_growth:
    formula:
      community_trust: min(100, community_trust + (virtue_effort * 1.5) + (concealment * 0.8))
    description: 社区信任随善行和稳定身份积累
    reference: TODO:SOURCE
simulation:
  start_date: '1815-01-01'
  end_date: '1832-12-31'
  output_types:
  - input
  - state
optimizer:
  method: nsga2
  objectives:
  - variable: redemption_progress
    metric: final
    direction: maximize
  - variable: community_trust
    metric: final
    direction: maximize
  schedules:
  - variable: virtue_effort
    time: 09:00
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    label: 践行善行强度
    optimize:
      value:
      - 0
      - 2
  - variable: concealment
    time: 09:00
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    label: 隐藏身份
    optimize:
      value:
      - 0
      - 1
  - variable: self_care
    time: 09:00
    days:
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    - Sun
    label: 自我照料
    optimize:
      value:
      - 0
      - 1
  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19
