
metadata:
  name: l1_drug_single_obj
  lm_format_version: "1.0"
  title: "[TEST L1] 单目标快速优化"
  description:
    problem: >
      最轻量调试路径（L1）：单一口服药物每日早晨给药，单一决策变量（剂量 0–50 mg），无 MC。
      目标为最大化第 30 天血浆浓度，约束肝脏累积负荷 ≤ 250 mg/L·day。
      设计为最快完成（约 1–3 秒），出现优化链路故障时最先用此模型定位问题。
    result: >
      优化应在数秒内完成，返回最优剂量及对应的血浆浓度与肝脏负荷数值。
      若端点、任务队列或结果回传任何环节异常，此模型是最快暴露问题的入口。
    limitations: 单目标、一维搜索空间，不覆盖 MC 或多目标功能，仅验证最基础优化链路。
  tags: [test, L1, single-objective, pharmacokinetics, debug]
  references:
    - "TEST L1: Simplified first-order PK model for optimizer unit test"
  step_size:
    value: 1
    unit: day

variables:
  plasma_level:
    description: 血浆药物浓度（mg/L），一阶吸收-清除动力学
    value: 0.0
    unit: mg/L
    type: state
    bounds: [0.0, 120.0]

  liver_load:
    description: 肝脏累积代谢负荷（mg/L·day），越高副作用风险越大
    value: 0.0
    unit: mg/L·day
    type: state
    bounds: [0.0, 1200.0]

  clearance_rate:
    description: |
      药物清除率（个体差异）。
      MC 参数：normal(0.3, 0.05) /day。
      均值 0.3：即半衰期 ≈ 2.3天。
    value: "normal(0.3, 0.05)"
    unit: per_day
    type: parameter
    bounds: [0.1, 0.6]

  dose_mg:
    description: 每日口服给药剂量（mg），优化决策变量
    value: 10.0
    unit: mg
    type: input
    bounds: [0.0, 50.0]

formulas:
  drug_kinetics:
    description: |
      一阶药代动力学。吸收率 60%，清除率 clearance_rate。
      稳态：plasma_level_ss = dose_mg * 0.6 / clearance_rate
      （dose=10 → ss≈20; dose=42 → ss≈84，约为约束上限）
    condition: true
    dynamics:
      plasma_level: "plasma_level + (dose_mg * 0.6 - plasma_level * clearance_rate) * step"
    priority: 10

  liver_accumulation:
    description: 肝脏负荷累积（每日 plasma_level 的 20%）
    condition: true
    dynamics:
      liver_load: "liver_load + plasma_level * 0.2 * step"
    priority: 5

simulation:
  start_date: "2025-01-01"
  end_date: "2025-01-31"
  plans:
    - id: default
      label: Default
      schedules:
        - variable: dose_mg
          time: "08:00"
          value: 10.0
          label: "Daily dose"
  output_variables: [plasma_level, liver_load, dose_mg]

optimizer:
  method: nsga2

  objectives:
    - variable: plasma_level
      metric: final
      direction: maximize

  constraints:
    - variable: liver_load
      condition: "<= 250"

  schedules:
    - variable: dose_mg
      time: "08:00"
      value: 10.0
      label: "Daily dose (mg)"
      optimize:
        value: [0.0, 50.0]

  algorithm:
    population_size: 10
    n_generations: 15
    seed: 19

