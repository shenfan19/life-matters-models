metadata:
  name: test_step_cross_import_base
  description:
    problem: >
      Base component (step=1 day) for the cross-step-size import test. Body mass decays
      by exactly 1% per day, giving a known analytical trajectory: day 0→100.0, day 1→99.0,
      day 2→98.01, day 3→97.03. These values are the ground truth that test_step_cross_import_top
      (running at 1-hour steps) must reproduce at 24-hour boundaries.
    result: >
      When imported by an hourly model, body_mass at 24-hour marks should match the daily
      ground truth exactly. Any deviation indicates the engine is applying the wrong step size
      to this formula.
    limitations: No physiological meaning; purely a numeric correctness fixture.
  tags: [test, step_size, cross_import, day, multi_scale]
  references: ["TEST: cross-step-size import — base component (1-day step)"]
  step_size:
    value: 1
    unit: day

variables:
  body_mass:
    type: state
    value: 100.0
    unit: kg
    description: Body mass; decays 1% per day (Euler). Known analytical trajectory.
    reference: "TEST synthetic"

formulas:
  mass_decay:
    description: 1% daily decay; step=1 day so coefficient is exactly 0.01 per day.
    dynamics:
      body_mass: "body_mass - 0.01 * body_mass * step"
    priority: 5

simulation:
  start_date: "2026-01-01"
  end_date:   "2026-01-03"
  output_variables: [body_mass]
