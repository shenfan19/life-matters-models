metadata:
  name: test_plans
  lm_format_version: "1.0"
  description:
    problem: >
      Validates simulation.plans loading without a sibling simulation.schedules block.
      Three named plans (conservative / balanced / aggressive) each define their own
      caloric deficit and exercise schedule; no global schedules block exists. Also tests
      that output_variables and output_types union rule applies correctly.
    result: >
      GUI should show all three plans as separate F-MPLAN tabs at load time. Each plan's
      trajectory should differ in slope according to its deficit and exercise combination.
      No cross-contamination between plan schedules should occur.
    limitations: Simplified linear weight model; no metabolic adaptation or plateau.
  tags: [test, plans, multi-plan, f-mplan, no-schedules]
  references: ["TEST: simulation.plans without schedules block"]
  step_size:
    value: 1
    unit: day

variables:
  body_weight:
    type: state
    value: 90.0
    unit: kg
    description: Body weight; decreases with caloric deficit and exercise.

  caloric_deficit:
    type: input
    value: 0.0
    unit: kcal
    description: Daily caloric deficit event (per-event amount; fires once per day).

  exercise_minutes:
    type: input
    value: 0.0
    unit: minutes
    description: Daily exercise session (pulse; each minute burns ~5 kcal equivalent).

  weight_loss_factor:
    type: parameter
    value: 0.000129
    unit: kg per kcal
    description: Weight lost per kcal deficit (7700 kcal ≈ 1 kg).

  exercise_burn:
    type: parameter
    value: 0.000645
    unit: kg per minute
    description: Weight equivalent burned per minute of moderate exercise (5 kcal/min ÷ 7750).

formulas:
  weight_dynamics:
    description: Daily weight change from caloric deficit (rate × step) + exercise burn (pulse).
    dynamics:
      body_weight: "max(50.0, body_weight - caloric_deficit * weight_loss_factor - exercise_minutes * exercise_burn)"
    priority: 5

simulation:
  start_date: "2026-01-01"
  end_date:   "2026-06-30"
  output_variables: [body_weight]
  output_types: [input]

  plans:
    - id: "conservative"
      label: "Conservative (300 kcal deficit, no exercise)"
      schedules:
        - variable: caloric_deficit
          time: "00:00"
          value: 300.0
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          label: "300 kcal/day deficit"

    - id: "balanced"
      label: "Balanced (500 kcal deficit + 3×/week exercise)"
      schedules:
        - variable: caloric_deficit
          time: "00:00"
          value: 500.0
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          label: "500 kcal/day deficit"
        - variable: exercise_minutes
          time: "07:00"
          value: 30.0
          days: [Mon, Wed, Fri]
          label: "30 min aerobic MWF"

    - id: "aggressive"
      label: "Aggressive (800 kcal deficit + 5×/week exercise)"
      schedules:
        - variable: caloric_deficit
          time: "00:00"
          value: 800.0
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          label: "800 kcal/day deficit"
        - variable: exercise_minutes
          time: "07:00"
          value: 45.0
          days: [Mon, Tue, Wed, Thu, Fri]
          label: "45 min aerobic Mon–Fri"

optimizer:
  method: nsga2
  objectives:
    - variable: body_weight
      metric: final
      direction: minimize
  schedules:
    - variable: caloric_deficit
      time: "00:00"
      label: "Daily caloric deficit (kcal/day)"
      optimize:
        value: [200.0, 1000.0]
    - variable: exercise_minutes
      time: "07:00"
      label: "Exercise session + weekly pattern"
      optimize:
        value: [0.0, 60.0]
        days_pool: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        days_n: [1, 7]
  algorithm:
    population_size: 25
    n_generations: 40
    seed: 19
