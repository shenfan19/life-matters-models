
metadata:
  name: l2_drug_pareto
  title: "[TEST L2] 三剂时段 · 双目标 Pareto"
  description:
    problem: >
      中等规模调试路径（L2）：每日三次给药（早/午/晚），各时段生物利用度不同（早晨空腹最高）。
      三个决策变量分别对应各时段剂量，双目标：最大化血浆浓度均值（疗效）与最小化肝脏负荷终值（毒性）。
      无 MC，用于验证多变量搜索和 Pareto 前沿可视化功能，预计 1–3 分钟完成。
    result: >
      优化结束后应呈现疗效-毒性单调权衡的 Pareto 前沿曲线。
      早晨（吸收率最高）的剂量在高疗效解中应占更大比重。
    limitations: 无 MC，不验证时刻或日期维度优化，仅覆盖三变量剂量搜索。
  tags: [test, L2, multi-objective, pareto, 3-variable, pharmacokinetics]
  references:
    - "TEST L2: Three-dose schedule optimization for Pareto front test"
  step_size:
    value: 1
    unit: day

variables:
  plasma_level:
    description: 血浆药物浓度（mg/L），三次给药叠加
    value: 0.0
    unit: mg/L
    type: state
    bounds: [0.0, 150.0]

  liver_load:
    description: 肝脏累积代谢负荷（30天）
    value: 0.0
    unit: mg/L·day
    type: state
    bounds: [0.0, 2000.0]

  clearance_rate:
    description: 药物日清除率（固定），0.28 /day，半衰期 ≈ 2.5天
    value: 0.28
    unit: per_day
    type: parameter
    bounds: [0.1, 0.5]

  morning_dose:
    description: 早晨给药剂量（mg），吸收率 70%（空腹最佳）
    value: 10.0
    unit: mg
    type: input
    bounds: [0.0, 30.0]

  noon_dose:
    description: 中午给药剂量（mg），吸收率 55%（餐后）
    value: 5.0
    unit: mg
    type: input
    bounds: [0.0, 30.0]

  evening_dose:
    description: 晚上给药剂量（mg），吸收率 45%（代谢降低）
    value: 5.0
    unit: mg
    type: input
    bounds: [0.0, 30.0]

formulas:
  drug_kinetics:
    description: |
      三次给药日步长动力学。
      daily_absorbed = morning*0.70 + noon*0.55 + evening*0.45
      每日清除 plasma_level * clearance_rate。
    condition: true
    dynamics:
      plasma_level: "plasma_level + (morning_dose * 0.70 + noon_dose * 0.55 + evening_dose * 0.45 - plasma_level * clearance_rate) * step"
    priority: 10

  liver_accumulation:
    description: 肝脏日负荷（plasma_level 的 18%）
    condition: true
    dynamics:
      liver_load: "liver_load + plasma_level * 0.18 * step"
    priority: 5

simulation:
  start_date: "2025-01-01"
  end_date: "2025-01-31"
  plans:
    - id: default
      label: Default
      schedules:
        - variable: morning_dose
          time: "08:00"
          value: 10.0
          label: "Morning dose"
        - variable: noon_dose
          time: "12:00"
          value: 5.0
          label: "Noon dose"
        - variable: evening_dose
          time: "20:00"
          value: 5.0
          label: "Evening dose"
  output_variables: [plasma_level, liver_load, morning_dose, noon_dose, evening_dose]

optimizer:
  method: nsga2

  objectives:
    - variable: plasma_level
      metric: mean
      direction: maximize

    - variable: liver_load
      metric: final
      direction: minimize

  constraints:
    - variable: liver_load
      condition: "<= 600"

  schedules:
    - variable: morning_dose
      time: "08:00"
      value: 10.0
      label: "Morning dose (mg)"
      optimize:
        value: [0.0, 30.0]

    - variable: noon_dose
      time: "12:00"
      value: 5.0
      label: "Noon dose (mg)"
      optimize:
        value: [0.0, 30.0]

    - variable: evening_dose
      time: "20:00"
      value: 5.0
      label: "Evening dose (mg)"
      optimize:
        value: [0.0, 30.0]

  algorithm:
    population_size: 20
    n_generations: 20
    seed: 19

