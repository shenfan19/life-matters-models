metadata:
  name: test_banister
  lm_format_version: "1.0"
  updated: 2026-05-01
  author: LM Test
  description:
    problem: >
      Banister 适应-疲劳双室模型（Morton 1990）综合验证场景，同时覆盖 MC 仿真、日程触发和多目标优化三条链路。
      个体适应增益与疲劳增益服从正态分布，MC 多条曲线在训练中期（第 4–8 周）出现可见分叉。
      设计为 16 周训练块 + 2 周减量期，日步长，双目标搜索末期表现与峰值疲劳之间的权衡。
    result: >
      MC 运行后应呈现多条分叉的 fitness/fatigue 曲线，个体间差异清晰可见。
      优化收敛后应给出末期表现与峰值疲劳的 Pareto 前沿，两个目标呈单调权衡关系。
      任何链路异常（MC 采样错误、优化结果格式错误、回归错误）均应在此模型中暴露。
    limitations: 参数和动力学为最小测试集，未经临床或运动科学验证，仅用于链路回归测试。
  tags: [test, banister, mc, opt, exercise, fitness, fatigue]
  references:
    - "Morton RH et al. (1990) Modeling human performance in running. J Appl Physiol 69(3):1171–1177"
    - "Mujika I et al. (1996) Effects of training on performance in competitive swimming. Can J Appl Physiol 21(5):395–406"
  step_size:
    value: 1
    unit: day

# ── 变量 ───────────────────────────────────────────────────────────────────────
variables:
  fitness:
    description: 体能分量（运动适应积累，时间常数45天）
    value: 0.0
    unit: AU
    type: state
    bounds: [0, 2000]

  fatigue:
    description: 疲劳分量（训练负荷累积，时间常数15天）
    value: 0.0
    unit: AU
    type: state
    bounds: [0, 3000]

  performance:
    description: 综合表现 = 基础 + fitness - fatigue
    value: 494.0
    unit: AU
    type: state
    bounds: [0, 1000]

  training_load:
    description: 当日训练负荷（任意单位，由 schedule/opt 驱动）
    value: 0.0
    unit: AU
    type: input

  # ── MC 概率参数 ──────────────────────────────────────────────────────────────
  g:
    description: 体能增益系数，个体差异±15%。MC 时各条曲线采样不同值
    value: "normal(1.0, 0.15)"
    unit: 无量纲
    type: parameter
    bounds: [0.4, 2.0]

  h:
    description: 疲劳增益系数，个体差异±15%。MC 时决定疲劳积累速率
    value: "normal(2.0, 0.30)"
    unit: 无量纲
    type: parameter
    bounds: [0.8, 4.0]

  k1:
    description: 体能衰减速率（1/45 per day，Morton 1990）
    value: 0.02222
    unit: 1/day
    type: parameter
    bounds: [0.01, 0.05]

  k2:
    description: 疲劳衰减速率（1/15 per day，Morton 1990）
    value: 0.06667
    unit: 1/day
    type: parameter
    bounds: [0.03, 0.15]

  p0:
    description: 基础表现（无训练基准）
    value: 494.0
    unit: AU
    type: parameter

# ── 动力学公式 ─────────────────────────────────────────────────────────────────
# step_size = 1 day（native unit），所有系数均为 per-day 速率
formulas:
  fitness_dynamics:
    description: "体能分量 Euler 更新：增益 − 自然衰减"
    condition: true
    priority: 5
    dynamics:
      fitness: fitness + (g * training_load - k1 * fitness) * step

  fatigue_dynamics:
    description: "疲劳分量 Euler 更新：增益 − 自然衰减"
    condition: true
    priority: 5
    dynamics:
      fatigue: fatigue + (h * training_load - k2 * fatigue) * step

  performance_update:
    description: "瞬时表现 = 基础 + 体能 − 疲劳（不含 step，静态指标计算）"
    condition: true
    priority: 3
    dynamics:
      performance: p0 + fitness - fatigue

# ── 优化设置 ──────────────────────────────────────────────────────────────────

# Opt：双目标 Pareto — 最大化第16周末表现 × 最小化峰值疲劳
optimizer:
  enabled: true
  method: "nsga2"                 # 双目标用 NSGA-II

  objectives:
    - variable: performance
      metric: final               # 仿真结束时的值
      direction: maximize
      description: "最大化16周训练结束时的表现"
    - variable: fatigue
      metric: max                 # 仿真过程中的最大值
      direction: minimize
      description: "最小化峰值疲劳（防止过度训练）"

  constraints:
    - variable: fatigue
      condition: "<= 900"
      type: hard
      description: "疲劳硬约束：防止过度训练（Morton 1990 建议上限）"
    - variable: performance
      condition: ">= 400"
      type: soft
      description: "表现下限：减量期不得低于基准值"

  schedules:
    - variable: training_load
      time_start: "09:00"
      time_end: "09:00"
      days: [Mon, Wed, Fri]
      label: "主训练日"
      optimize:
        value: [0, 140]
    - variable: training_load
      time_start: "09:00"
      time_end: "09:00"
      days: [Tue, Thu]
      label: "辅助训练日"
      optimize:
        value: [0, 60]
    - variable: training_load
      time_start: "09:00"
      time_end: "09:00"
      days: [Sat, Sun]
      label: "恢复/休息日"
      optimize:
        value: [0, 20]


  algorithm:
    population_size: 60
    n_generations: 100
    seed: 19

# ── 仿真设置 ──────────────────────────────────────────────────────────────────
# 测试用：1 周训练模式验证 Fitness-Fatigue 动力学，7 步快速完成
simulation:
  start_date: "2026-01-01"
  end_date: "2026-01-07"          # 7 天（1 周）
  output_variables:
    - fitness
    - fatigue
    - performance
    - training_load
  plans:
    - id: default
      label: Default
      schedules:
        - variable: training_load
          time: "09:00"
          value: 70.0
          days: [Mon, Tue, Wed, Thu, Fri]
          date_range: ["2026-01-01", "2026-01-07"]
          label: "主训练日"
        - variable: training_load
          time: "09:00"
          value: 35.0
          days: [Sat]
          date_range: ["2026-01-01", "2026-01-07"]
          label: "恢复日"
  mc:
    runs: 8
