    comments: |
      60个解的剂量x在[0,50]mg区间内连续分布，blood_pressure随剂量单调递减（155.0→145.2mmHg），
      uric_acid随剂量单调递增（420.2→438.1μmol/L）——整条前沿是一条连续、非退化的剂量-反应曲线，
      没有任何剂量同时严格劣于另一剂量（每个点都是非支配解），即联合可行域非空且连续。
      这与同目录homair_ogtt（A2a）案例的"部分个体被两套标准给出矛盾分类、可行域受限"形成对照：
      本案例（A2b）展示的是权衡（tradeoff），不是矛盾（contradiction）——两条独立文献的效应量
      装入同一框架后，没有产生空集，只是确认了"降压与控尿酸不能同时免费获得"这一臨床常识。
      recommended点（24.87mg）取前沿中点附近，不代表临床推荐剂量，仅为展示用途。
