metadata:
  name: diuretic_tradeoff_opt
  lm_format_version: "1.0"
  description:
    problem: "单一决策变量 thiazide_dose 的双目标优化，最小化血压加最小化血尿酸。两个目标的文献依据彼此独立，Law 2009 降压、Choi 2012 升尿酸，检验联合可行域是否为空，或是否呈现连续的剂量-反应权衡前沿。完整物理机制见 imports 的 diuretic_tradeoff_sim。"
    method: "机制与 diuretic_tradeoff_sim.yaml 相同，完整机制列表见该文件 description.method；本文件只对该单一决策变量跑双目标优化，检验联合可行域的形状。"
  references:
    - "见 ./diuretic_tradeoff_sim.yaml"

imports:
  - ./diuretic_tradeoff_sim

optimizer:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-07-01"
  step_size:
    value: 1
    unit: hour

  objectives:
    - variable: blood_pressure
      metric: final
      direction: minimize
      description: "26周末收缩压，越低越好"
    - variable: uric_acid
      metric: final
      direction: minimize
      description: "26周末血尿酸，越低越好"

  startpoint:
    regimens:
      - variable: thiazide_dose
        time_start: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "HCTZ 每日剂量（唯一决策变量）"
        optimize:
          value: [0.0, 50.0]

  algorithm:
    population_size: 60
    n_generations: 80
    seed: 19

  results:
    generated_at: "2026-06-26"
    method: nsga2
