metadata:
  name: banister_step_convergence_grid_pointer
  lm_format_version: "1.0"
  description:
    problem: >-
      纯指引文件，不含仿真/优化内容，本文件本身不可运行，缺少 variables/equations/simulation 声明，仅用于 GUI/仓库浏览时把"S1 Banister 案例"下的读者指向真正的步长收敛性检验模型。
    method: "本文件不含机制，纯为导航指引；机制内容见 banister_validation.yaml description.method。"
    result: >-
      论文 §6 Verify 提到的 Banister 解析解对比与步长收敛性检验网格，其可运行模型不在本目录，而在 `models/test_fixtures/valid/` 下的 6 个独立文件，这些文件创建于 2026-07-15，遵循只做步长变化、固定最大区间 60 天的简化原则，文件名依次为 `test_valid_banister_v1_analytical.yaml`，步长 1 天；`test_valid_banister_v1_step_12h.yaml`；`test_valid_banister_v1_step_6h.yaml`；`test_valid_banister_v1_step_3h.yaml`；`test_valid_banister_v1_step_1h.yaml`；`test_valid_banister_v1_step_30min.yaml`。6 个文件物理设置完全相同，均为常数训练负荷 50 AU/天、Morton 1990 标准参数，只有 `simulation.step_size` 不同，各自单独运行 `--sim-only` 即可复现论文 §6 Verify 记录的 60 天末误差，按步长从粗到细依次为 0.78%、0.38%、0.19%、0.10%、0.03%、0.02%。放在 `test_fixtures/valid/` 而非本目录，是因为这 6 个文件是引擎正确性 fixture，回答的是引擎数值积分是否准确，这与本目录 `banister_validation.yaml` 里 daily_training/five_day_training 头对头对比数字尚未在当前协议下重新核对是两个独立问题，不要混淆，后者对应的是模型自身参数是否已核对到最新状态，记录在该文件 metadata.todo，属于 §7 Validation Research 案例小节的范畴，与本文件指向的 6 个 fixture 无关。
    limitations: 本文件不含可运行内容，纯粹是仓库导航用的指引条目。
  tags: [banister, pointer, no_content]
  references:
    - "详见 test_verification/verification_report.md 协议 V2"
  todo:
    - type: nosim
      issue: "本文件设计上不可运行（无 variables/equations/simulation），是指引性质的空文件，见 description.result 的 6 个文件路径。"
