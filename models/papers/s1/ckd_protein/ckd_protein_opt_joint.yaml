metadata:
  name: ckd_protein_opt_joint
  lm_format_version: "1.0"
  updated: 2026-05-22
  description:
    problem: "CKD 蛋白质-肌肉权衡的联合多学科优化：三餐蛋白量、晚餐用餐时机与限制期→标准期切换时机同时搜索，目标是同时最大化 GFR 与 muscle_mass，代表肾科与康复科联合视角。完整物理机制与对比仿真见 imports 的 ckd_protein_sim，与单学科视角的 ckd_protein_opt_renal.yaml、ckd_protein_opt_muscle.yaml 并列对比，才能体现联合优化揭示的权衡区间。"
    method: "机制与 ckd_protein_sim.yaml 相同，完整机制列表见该文件 description.method；本文件把 GFR、muscle_mass、健康时长三个目标放进同一个多目标搜索，体现联合优化相对两个单学科最优各自能达到的权衡幅度。"
  references:
    - "见 ./ckd_protein_sim.yaml"
  log:
    "2026-08-05_00-00-00":
      change: "results 精简为 2026-08-02（依从性维度加入后）的最终收敛结果；此前多次 rerun 记录迁移至 history/2026-08-05_ckd_protein_opt_joint.yaml"
      reason: "落实 ADR 0141，主文件只保留当前有效结果。"

imports:
  - ./ckd_protein_sim

# ── 优化设置（T1+T2+T4 联合优化，多学科：GFR + muscle_mass + lm_score）──────────
optimizer:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  step_size:
    value: 1
    unit: hour

  objectives:
    - variable: muscle_mass
      metric: final
      direction: maximize
      description: "最大化52周末骨骼肌质量（防肌少症，康复科视角）"
    - variable: GFR
      metric: final
      direction: maximize
      description: "最大化52周末 GFR（减缓肾功能衰退，肾科视角）"
    - variable: lm_score
      metric: final
      direction: maximize
      description: "最大化 CKD 健康时长（GFR ≥ 30、muscle_mass ≥ 22 kg、BUN ≤ 20 的累计天数）"

  constraints:
    - variable: BUN
      condition: "<= 20"
      type: hard
      description: "血尿素氮约束：BUN ≤ 20 mg/dL"
    - variable: GFR
      condition: ">= 30"
      type: hard
      description: "GFR 下限：不得进入 CKD 4 期"
    # 2026-06-20 删除：dietary_protein>=0.10 这条约束默认按"全程每个时间步"检查（无 metric 字段），
    # 但 dietary_protein 是脉冲输入，非进餐时刻恒为0，导致约束在8736步轨迹上几乎处处违反，
    # 是三个opt场景持续0% feasible的第二个根因（第一个是beta0/mu_d/mu_u单位bug，已修复）。
    # 该约束本身也冗余：三餐搜索下界 0.15（见 startpoint）已经满足"单次进餐>=0.10"的原始意图，
    # 故直接删除而非加 metric 修正。详见 ckd_protein_sim.yaml metadata.todo 的 resolved 条目。

  startpoint:
    regimens:
      # T1: 早餐蛋白量（固定08:00，优化量）
      - variable: dietary_protein
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "早餐蛋白量"
        optimize:
          value: [0.15, 0.45]

      # T1: 午餐蛋白量（固定12:00）
      - variable: dietary_protein
        time_start: "12:00"
        time_end: "12:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "午餐蛋白量"
        optimize:
          value: [0.15, 0.40]

      # T1+T2: 晚餐蛋白量 + 用餐时间窗优化（时间营养学）
      # 科学意义：睡前蛋白（~21:00）激活夜间mTOR，改善肌肉蛋白合成
      # Snijders 2015, Res 2012：睡前蛋白摄入显著提升夜间蛋白合成速率
      - variable: dietary_protein
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "晚餐蛋白量与用餐时机（时间营养学优化）"
        optimize:
          value: [0.15, 0.45]
          time_start: ["17:00", "22:00"]

      # T4: 限制期→标准期切换时机（在第13-39周窗口内搜索最优切换点）
      # 科学意义：GFR 稳定后才能安全提升蛋白；过早提升加速 GFR 损伤
      - variable: dietary_protein
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "标准期启动时机（限制→标准切换日）"
        optimize:
          value: [0.27, 0.42]
          date_range: [["2026-04-01", "2026-10-01"], ["2026-12-31", "2026-12-31"]]


  mc:
    runs: 5
    seed: 19

  algorithm:
    population_size: 100
    n_generations: 200
    seed: 19

  results:
    generated_at: "2026-08-02"
    method: nsga2
    population_size: 40
    n_generations: 10
    n_solutions: 8
    pareto_front_range:
      muscle_mass: [25.165798832403617, 28.883325370138163]
      GFR: [40.73612531291626, 42.940957604890855]
      lm_score: [362.5916666666918, 364.0000000000258]
    recommended:
      status: "取前沿上同时逼近两个单学科最优的均衡解（归一化后两个目标的最小完成度最大）"
      x: [0.29937499575280424, 0.2942248666049889, 0.2947868413628133, 0.41851956549053215, 0.3585736964372492, 180.16630791893255]
      f: [28.110065640584857, 42.42646125211021, 364.0000000000258]
    note: "解码 recommended：早餐0.299g/kg（08:00）、午餐0.294g/kg（12:00）、晚餐0.295g/kg（17:25）、标准期追加0.359g/kg（08:00起2026-06-29/第26周）。前沿范围与 ckd_protein_opt_renal.yaml/ckd_protein_opt_muscle.yaml 两个单学科场景的独立收敛值（GFR 43.05、muscle_mass 28.75）互相印证，权衡幅度真实存在但温和。晚餐时机17:25与前沿另一端点（GFR最优端）的21:41不构成单调规律，确认晚餐时机对本模型无实际因果作用。已更新 ckd_protein_sim.yaml 的 opt_optimized plan为本次解码结果。更早的多次 rerun 记录见 history/2026-08-05_ckd_protein_opt_joint.yaml。"
