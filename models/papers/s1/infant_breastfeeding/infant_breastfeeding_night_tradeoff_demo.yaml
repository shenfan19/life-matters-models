metadata:
  name: infant_breastfeeding_night_tradeoff_demo
  lm_format_version: "1.0"
  updated: 2026-08-04
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  references:
    - citation: "Scammon & Doyle (1920) AJDC 20:516-538"
      description: "新生儿胃容量随体重的比例关系，用于计算胃容量上限。"
    - citation: "Cavell B (1981) Acta Paediatr Scand 70:639-641"
      description: "一阶胃排空速率常数，用于计算胃内奶量随时间下降的动力学。"
    - citation: "Doan T et al. (2007) J Perinat Neonatal Nurs 21(3):200-206"
      description: "母乳喂养与父母睡眠时长关系的实测数据，用于标定夜间喂奶消耗母亲有效睡眠的系数。"
    - citation: "Borbely AA (1982) Hum Neurobiol 1(3):195-204"
      description: "睡眠调节双过程模型，用于母亲睡眠债的自然恢复动态。"
    - citation: "Goyal D et al. (2009) Arch Womens Ment Health 12(4):229-237"
      description: "睡眠碎片化程度与产后抑郁症状关联的判据，用于标定母亲健康时长的睡眠债阈值。"
    - citation: "Bonnet MH (1985) Effect of sleep disruption on sleep, performance, and mood. Sleep 8(1):11-19"
      description: "睡眠中断对睡眠质量的影响，用于标定夜间喂奶造成的睡眠碎片化质量折损。"
    - citation: "Insana SP & Montgomery-Downs HE (2013) Sleep and postpartum fatigue. Infant Behav Dev 36(4):554-560"
      description: "产后疲劳与睡眠关系的实测数据，为睡眠碎片化质量折损提供支持。"
    - citation: "Chatterji P & Markowitz S (2012) Family leave after childbirth and the mental health of new mothers. J Ment Health Policy Econ 15(2):61-76"
      description: "产假时长与母亲心理健康关系的测量数据，用于标定短假期抑郁风险指数的峰值。"
    - citation: "Whitney MD, Holbrook C, Alvarado L, Boyd S (2023) Length of Maternity Leave Impact on Mental and Physical Health of Mothers and Infants, a Systematic Review and Meta-analysis. Matern Child Health J 27(8):1308-1323"
      description: "产假时长对母婴身心结局影响的系统综述与荟萃分析，用于标定12周循证阈值。"
    - citation: "Kleven H, Landais C, Sogaard JE (2019) Children and Gender Inequality: Evidence from Denmark. Am Econ J Appl Econ 11(4):181-209"
      description: "延长职业中断带来真实长期经济代价的行政数据证据，为职业代价指数的存在性提供依据。"
    - citation: "Rios-Leyvraz M & Yao Q (2023) The Volume of Breast Milk Intake in Infants and Young Children: A Systematic Review and Meta-Analysis. Breastfeed Med 18(3):188-197, DOI 10.1089/bfm.2022.0281"
      description: "婴幼儿母乳摄入总量的系统综述与荟萃分析，用于标定夜间净吸收奶量预算的量级。"
    - citation: "La Leche League International, Frequency of Feeding FAQ (哺乳频率常见问题页面，机构临床经验总结，非单篇原始测量研究)"
      description: "机构临床经验总结的哺乳频率参考，为夜间占比估计提供补充依据。"
  log:
    "2026-08-02_00-00-00":
      change: "新增母亲职业发展心理维度：重返职场时点作为新的T4决策变量，驱动 maternal_depression_index（短假期抑郁风险，随请假天数趋近12周连续下降）与 career_penalty_index（超过12周后连续上升的职业代价）两条连续曲线；母亲睡眠动态叠加睡眠碎片化质量折损；仿真窗口从14天延长到140天以容纳12周阈值前后的搜索空间"
      reason: "刻意用连续曲线而非二元阈值驱动母亲侧目标，避免重蹈原90天模型WHO二元阈值一旦满足即无边际收益、导致前沿退化为单点的覆辙；两条曲线的锚点分别取自 Chatterji & Markowitz (2012) 的CES-D测量值与 Whitney et al. (2023) 报告的12周循证阈值，career_penalty_index 斜率依据 Kleven et al. (2019) 仅代表机制存在性，是标定选择。"
    "2026-08-03_00-00-00":
      change: "诊断夜间4个候选时段在完整预算重跑下全部贴近搜索上界、从未出现关闭某个时段的角点收敛问题"
      reason: "maternal_sleep_tracking 方程只判断时段是否非零、不判断喂了多少mL，而 total_absorbed_volume 目标对多开时段只有奖励没有惩罚，使'部分关闭'解在当时的目标结构下从未被真正的trade-off支撑，为下一步引入夜间总量预算约束提供诊断依据。"
    "2026-08-04_00-00-00":
      change: "新增夜间净吸收奶量预算约束（150 mL/night×140天=21000 mL，取值依据 Rios-Leyvraz & Yao 2023 与 La Leche League International 的夜间占比估计），并将约束口径从原始喂奶量改为扣除胃容量溢出后的净吸收量"
      reason: "把'该不该关掉某个时段'从一个不改变收益的孤立跳变改造成'固定预算内怎么分配'的连续可探索权衡；口径改为净吸收量是因为标定依据的文献测的是婴儿实际摄入量，不是护理者倒了多少奶。"
    "2026-08-05_00-00-00":
      change: "移除已解决的 todo 条目；description 补充 method 字段"
      reason: "落实 ADR 0141，主文件只保留当前状态，调试脉络转移至 history/2026-08-05_infant_breastfeeding_night_tradeoff_demo.yaml。"
    "2026-08-06_00-00-00":
      change: "description 按 problem/method/result/limitations 四字段重写，problem 改为按机制分组的多级列表，每组下用子条目列出对应来源文献各自的贡献，method/result/limitations 同样改为列表结构，清理硬换行、非豁免括号与调试过程叙述"
      reason: "落实 ADR 0142，此前的 result 字段把最终结论与优化器调试历程混在同一段长文字里，读者难以从中提取当前有效的结论；曾尝试把来源文献单列成 citation 字段，但与 problem 里各机制的缺口说明重复，改为把每条来源文献直接挂在它所属的机制条目下面；调试历程本身已完整保留在上方 log 与 history/ 中，不丢失信息。"
    "2026-08-06_01-00-00":
      change: "problem 里每条来源文献的贡献说明搬进 references 对应条目的 description，references 每项从纯字符串改为 {citation, description} 对象；problem 只保留机制分组与缺口陈述，不再嵌套列出具体文献"
      reason: "problem 加了两层嵌套列表后本身变得臃肿，来源文献的贡献说明本质是这篇文献自身的属性，挂在它所属的 reference 条目上比塞进 problem 更合适，GUI 侧边栏参考文献框同步支持两列显示。"
  description:
    problem: |
      夜间喂养的时段与总量、母亲睡眠恢复、母亲重返职场时点三者之间如何取舍，是本文件要回答的问题，这些机制各自成立于自己的研究范围，本文件用四个独立的夜间候选时段代替单一喂养总量、用重返职场时点作为额外决策变量，把它们放进同一份决策结构下，才能显现喂养安排、母亲睡眠与重返职场节奏之间的真实权衡。
      - 婴儿胃容量与胃排空动力学：原始研究只描述单次喂奶后胃内奶量的变化，不涉及母亲睡眠或重返职场决策。
      - 母亲睡眠债与睡眠碎片化：原始研究只追踪夜间喂奶对母亲睡眠质量的影响，不涉及婴儿摄入量或重返职场时点。
      - 短假期抑郁风险与超期职业代价：原始研究只描述请假天数本身如何驱动这两条心理与经济曲线，不涉及夜间喂养决策。
      - 母乳夜间摄入占比：原始研究提供的是人群层面的总量估计，不涉及单个婴儿在多个候选时段之间如何分配。
      每篇来源文献具体贡献了什么机制或数据，见下方 references 各条目的 description。婴儿体重在仿真窗口内固定为出生体重，不建模体重增长，用于把讨论聚焦在决策变量结构本身能否产生真实权衡，而不是生长曲线标定问题。
    method: |
      婴儿胃容量与胃排空动力学、母亲睡眠债与睡眠碎片化动力学、母亲重返职场后的心理与经济代价、重返职场时点对日间哺乳有效性的折损，这四组机制共享同一组决策变量：夜间四个候选喂养时段与重返职场时点。
      - 夜间喂奶次数和总量既决定婴儿总吸收奶量，也通过睡眠碎片化直接消耗母亲的健康时长。
      - 重返职场时点既压低日间哺乳有效性、迫使更多夜奶才能维持总摄入量，又同时驱动母亲的抑郁风险与职业代价两条方向相反的曲线。
      四个目标因此产生真实的跨机制权衡，而不是各自独立优化。
    result: |
      完整预算 NSGA-II 搜索给出60个非支配解，呈现6种夜间时段激活模式，母亲健康时长与婴儿总吸收奶量之间形成真实的集中喂养换母亲睡眠质量、分散喂养换总奶量的权衡。
      - 1个时段激活方案27解，母亲健康时长达到140天满分。
      - 2个时段激活方案33解，涵盖五种不同的时段配对，母亲健康时长降到29.50到31.13天之间。
      - 总吸收奶量随激活时段数增加而上升，从59142 mL到69372 mL，与母亲健康时长呈相反方向变化。
      两个独立的单轴扫描进一步验证了这一权衡的来源。
      - 固定重返职场在产后12周、只改变夜间喂养次数：母亲达标天数的真实拐点落在1次到2次夜奶之间，从满分140天骤降至30.3天，反映长期睡眠债累积与睡眠碎片化质量折损两个机制的叠加效果。
      - 固定夜间喂养为23点与凌晨3点两次、只改变重返职场天数：产后12周严格支配所有更早的返岗时点，真实的两难只存在于12周之后，继续请假换来更多婴儿吸收奶量，但要承担连续上升的职业代价。
      与同目录 infant_breastfeeding_night_tradeoff_demo_babyfloor.yaml 的对比结果见该文件自身的 description.result。
    limitations: |
      本模型在以下几个方面做了简化：
      - 婴儿侧目标简化为总吸收奶量 total_absorbed_volume，不是体重达标天数，这是刻意回避生长曲线标定问题的简化，不能等价于婴儿营养或生长结局的完整代理指标，仅用于演示决策变量结构本身能否产生非退化前沿。
      - 婴儿体重固定为出生体重，20周窗口内实际会有明显生长，这一简化不代表真实生长轨迹，只用于比较不同喂养方案与不同职业节律方案之间的相对奶量差异，不用于绝对营养结局判断。
      - 胃容量与排空机制沿用固定参数，胃容量每公斤体重30 mL、胃排空速率常数0.46每小时，继承同样的标定不确定性。
      - 短假期抑郁风险指数与职业代价指数中，产后12周阈值与短假期抑郁风险量级有真实文献锚点，但职业代价指数的具体斜率是标定选择，只定性代表延长职业中断有真实、有文献记录的长期经济代价这一机制存在，不是某篇文献直接测得的数值。
      - 夜间净吸收奶量预算150 mL每晚取自三月龄纯母乳喂养婴儿日均总摄入量乘以约20%的夜间占比估计，未与日间固定喂养量重新校准以匹配全天总摄入量，是同一简化边界下的标定选择，不是对全天营养总量的绝对建模。
  ratings:
    validation_confidence: 1 - 简化演示场景，尚未与任何独立文献目标数值比对，仅验证决策变量结构本身是否产生非退化前沿

# ── 变量 ─────────────────────────────────────────────────────────────────────
variables:

  baby_weight_fixed:
    type: parameter
    value: 3.3
    unit: kg
    description: >
      固定出生体重，本演示场景不建模体重增长。2026-08-02仿真窗口从14天延长到140天后，这一简化的失真程度比原版更明显（20周内婴儿体重实际会有显著增长），但本文件的 total_absorbed_volume目标本来就是"决策变量结构能否产生非退化前沿"的相对比较代理指标，不是绝对生长结局判断，继续使用固定体重以保持与原14天版本的一致性、避免引入原始90天模型已知的体重标定问题。

  stomach_capacity_per_kg:
    type: parameter
    value: 30.0
    unit: mL/kg
    description: "每kg体重对应的胃容量，沿用原文件参数。"
    reference: "Scammon & Doyle (1920) AJDC 20:516-538."

  gastric_emptying_rate:
    type: parameter
    value: 0.46
    unit: 1/hour
    description: "胃排空一阶速率常数，沿用原文件参数。"
    reference: "Cavell B (1981) Acta Paediatr Scand 70:639-641."

  sleep_disruption_per_nightfeed:
    type: parameter
    value: 0.75
    unit: hour
    description: "每次夜间喂奶消耗的有效睡眠时间，沿用原文件参数。"
    reference: "Doan T et al. (2007) J Perinat Neonatal Nurs 21(3):200-206."

  sleep_recovery_rate:
    type: parameter
    value: 0.083
    unit: hour/hour
    description: "每小时睡眠债自然恢复速率，沿用原文件参数。"
    reference: "Borbely AA (1982) Hum Neurobiol 1(3):195-204."

  sleep_fragmentation_quality_loss:
    type: parameter
    value: 0.4
    unit: dimensionless
    bounds: [0, 0.8]
    description: >
      夜间喂奶造成的睡眠碎片化对"剩余睡眠"恢复效率的折损比例，2026-08-02改编自 postpartum_recovery_sim.yaml（S4）已验证的同名机制与同一数值（0.4为标定选择，非直接文献测量值，原文件已如此标注）。
    reference: "Bonnet MH (1985) Sleep 8(1):11-19; Insana SP & Montgomery-Downs HE (2013) Infant Behav Dev 36(4):554-560"

  # ── 母亲职业发展心理维度（2026-08-02新增）─────────────────────────────────────
  return_to_work_trigger:
    type: input
    value: 0.0
    unit: dimensionless
    bounds: [0.0, 1.0]
    description: >
      重返职场触发标记（T4决策变量：只搜索触发的起始日期，量值本身固定不搜索）。从 optimizer搜到的起始日起每天0点触发一次，触发后 return_to_work_ratchet 方程把 at_work 锁定为1（不会因为触发窗口结束而复位），代表"重返职场是一次性状态转换，不是可逆事件"。

  at_work:
    type: state
    value: 0.0
    unit: dimensionless
    bounds: [0, 1]
    description: "是否已重返职场的棘轮状态（一旦变为1，此后保持1，见 return_to_work_ratchet）。"

  leave_length_days:
    type: state
    value: 0.0
    unit: day
    description: >
      实际请假天数：at_work=0期间逐日累加，at_work变为1后冻结，冻结时的值即为本次仿真里"实际请假多少天才重返职场"，同时驱动 maternal_depression_index 与 career_penalty_index 两条曲线。

  leave_threshold_days:
    type: parameter
    value: 84.0
    unit: day
    description: >
      产后12周（84天），母婴身心结局最优的循证阈值，兼作 maternal_depression_index 的下降终点与 career_penalty_index 的上升起点。
    reference: "Whitney MD et al. (2023) Matern Child Health J 27(8):1308-1323"

  depression_penalty_max:
    type: parameter
    value: 0.79
    unit: dimensionless
    description: >
      请假时长趋近0时 maternal_depression_index 的峰值，直接取自 Chatterji & Markowitz（2012）报告的真实测量值："产假<12周"对应 CES-D 12项抑郁量表 +0.79分。maternal_depression_index 在请假0至84天间按线性插值从此峰值降到0，是把该文献单一时间点的categorical测量值換算为连续曲线的工程近似（文献本身未提供连续的剂量-反应轨迹数据），非独立测量值本身延伸出的连续曲线。
    reference: "Chatterji P & Markowitz S (2012) J Ment Health Policy Econ 15(2):61-76"

  career_penalty_rate_per_day:
    type: parameter
    value: 0.01
    unit: 1/day
    description: >
      请假超过 leave_threshold_days 后，career_penalty_index 每多请假一天的增量。标定选择，非直接文献测量值：Kleven et al.（2019）用丹麦行政数据证明生育后女性收入受到真实、持续的长期损失（"child penalty"），为"延长职业中断有真实经济代价"这一机制的存在性提供文献依据，但该文献未给出"每多请假一天代价增加多少"的斜率，此处取值仅代表量级存在、方向正确，不代表已校准的真实斜率。
    reference: "标定选择（见描述）；机制存在性依据 Kleven H et al. (2019) Am Econ J Appl Econ 11(4):181-209"

  maternal_depression_index:
    type: state
    value: 0.79
    unit: dimensionless
    description: >
      短假期抑郁风险指数（CES-D量表点数近似）：leave_length_days在0至 leave_threshold_days区间内线性下降至0，之后保持0（不是二元阈值，每多请一天假风险连续下降，避免重蹈原90天模型WHO二元阈值导致前沿退化为单点的覆辙）。
    reference: "Chatterji P & Markowitz S (2012) J Ment Health Policy Econ 15(2):61-76"

  career_penalty_index:
    type: state
    value: 0.0
    unit: dimensionless
    description: >
      职业代价指数：leave_length_days超过leave_threshold_days后，超出部分乘以 career_penalty_rate_per_day连续累积，之前恒为0。与maternal_depression_index 方向相反，共同构成请假时长的真实两面权衡（而非"请假越长越好"的单调关系）。
    reference: "标定选择，机制存在性依据 Kleven H et al. (2019)"

  work_daytime_retention_factor:
    type: parameter
    value: 0.7
    unit: dimensionless
    bounds: [0, 1]
    description: >
      重返职场后，日间哺乳/泵奶能达成的比例（相对未返岗时的100%）。标定选择，非直接文献测量值，定性方向由"全职工作与更早重返职场显著降低母乳喂养持续时长/频率"这一发现支撑（Determinants of breastfeeding initiation and cessation among employed mothers 队列研究），用于让"重返职场时点"这一决策与已有的夜间喂养决策空间产生真实耦合：更早重返职场会压低日间奶量，迫使更多夜奶才能维持总摄入量。
    reference: "标定选择；定性支持见描述"

  # 日间固定喂养（非决策变量，通过 startpoint.regimens 的无 optimize 块条目声明）
  breast_milk_day:
    type: input
    value: 100.0
    unit: mL
    description: "日间固定喂养量，非决策变量。"

  effective_breast_milk_day:
    type: state
    value: 0.0
    unit: mL
    description: >
      实际有效日间哺乳量（脉冲，语义同breast_milk_day）：at_work=0时等于breast_milk_day，at_work=1后按work_daytime_retention_factor打折。stomach_intake_and_overflow/absorbed_volume_tracking改用这个变量而非breast_milk_day，使重返职场时点真实影响婴儿侧摄入结局。

  # 夜间4个候选时段，独立决策变量，0表示跳过
  night_feed_1:
    type: input
    value: 0.0
    unit: mL
    bounds: [0, 90]
    description: "夜间候选喂奶时段1（23:00）。值0表示本次跳过不喂。"

  night_feed_2:
    type: input
    value: 0.0
    unit: mL
    bounds: [0, 90]
    description: "夜间候选喂奶时段2（01:00）。值0表示本次跳过不喂。"

  night_feed_3:
    type: input
    value: 0.0
    unit: mL
    bounds: [0, 90]
    description: "夜间候选喂奶时段3（03:00）。值0表示本次跳过不喂。"

  night_feed_4:
    type: input
    value: 0.0
    unit: mL
    bounds: [0, 90]
    description: "夜间候选喂奶时段4（05:00）。值0表示本次跳过不喂。"

  night_absorbed_volume_budget:
    type: parameter
    value: 150.0
    unit: mL
    description: >
      夜间（23:00-05:00窗口）四个候选时段净吸收奶量（扣除胃容量溢出后）预算上限,
      2026-08-04新增,2026-08-04当日第二次修订：原参数名night_feed_budget_per_night约束的是
      night_feed_total（四时段原始喂奶量之和,未扣除溢出）,但取值依据的文献（见下方）测的是
      婴儿实际摄入/吸收量,不是喂了多少,原始喂奶量口径与吸收量口径的文献数字直接对标不严谨,
      改为约束night_absorbed_volume（净吸收量,equations区块night_absorbed_volume_tracking计算）
      更贴合文献口径,取值本身不变。取自Rios-Leyvraz & Yao（2023）系统综述/meta分析报告的3月龄
      纯母乳喂养婴儿日均摄入量735 mL/day,乘以La Leche League International《哺乳频率常见问题》
      页面给出的"夜间约占全天摄入量20%"这一哺乳医学界常引用的临床经验估计（该估计无对应单篇
      原始测量研究的独立footnote,是机构经验总结非直接测量值）,735×0.20≈147 mL,取整为150 mL/night,
      是标定选择而非直接文献测量值。未与breast_milk_day代表的日间固定喂养量重新校准以匹配
      735 mL/day的全天总量（日间固定4次×100mL=400mL,加上本预算150mL/night共550mL/day,低于
      735mL/day），本文件total_absorbed_volume目标本来就是决策变量结构相对比较的代理指标而非
      绝对营养结局判断,见metadata.description.limitations,此处沿用同一简化边界,不额外引入全天
      总量重新标定的范围。
    reference: "Rios-Leyvraz M & Yao Q (2023) Breastfeed Med 18(3):188-197, DOI 10.1089/bfm.2022.0281；La Leche League International 哺乳频率FAQ"

  baby_stomach_volume:
    type: state
    value: 0.0
    unit: mL
    description: "宝宝胃内当前奶量。"

  total_absorbed_volume:
    type: state
    value: 0.0
    unit: mL
    description: "累计吸收奶量（不含溢出部分），婴儿侧目标的简化代理指标。"

  night_absorbed_volume:
    type: state
    value: 0.0
    unit: mL
    description: >
      夜间四个候选时段（night_feed_1..4）净吸收奶量（扣除胃容量溢出后）的仿真窗口累计总和，
      2026-08-04新增，2026-08-04当日第二次修订由night_feed_total（原始喂奶量口径）改为本变量
      （吸收量口径），见night_absorbed_volume_budget的description。仅用于optimizer.constraints
      约束夜奶总预算，不是独立的婴儿侧目标。

  mother_sleep_debt:
    type: state
    value: 0.0
    unit: hour
    description: "妈妈累计睡眠债，沿用原文件动态。"

  lm_mother_score:
    type: state
    value: 0.0
    unit: hour
    description: "妈妈健康时长：睡眠债低于4小时的累计小时数。"

# ── 动力学方程 ────────────────────────────────────────────────────────────────
equations:

  return_to_work_ratchet:
    step_unit: hour
    priority: 50
    dynamics:
      at_work: "max(at_work, 1.0 if return_to_work_trigger > 0 else 0.0)"
    description: >
      重返职场是一次性状态转换：return_to_work_trigger 从T4搜到的起始日起每天触发，at_work 一旦被置1便不会复位（棘轮），代表这是不可逆事件而非可重复开关。

  leave_length_tracking:
    step_unit: day
    priority: 45
    dynamics:
      leave_length_days: "leave_length_days + step * (1 if at_work < 0.5 else 0)"
    description: "请假天数累加：at_work=0期间逐日累加，变1后自动冻结（增量条件恒为0）。"

  psych_index_update:
    step_unit: day
    priority: 40
    dynamics:
      maternal_depression_index: "max(0.0, depression_penalty_max * (1.0 - leave_length_days / leave_threshold_days))"
      career_penalty_index: "max(0.0, leave_length_days - leave_threshold_days) * career_penalty_rate_per_day"
    description: >
      两条连续曲线，均为 leave_length_days 的直接函数（无记忆，每步用当前leave_length_days 重新计算，leave_length_days冻结后两者自然也冻结在最终值）：请假越短抑郁风险越高（线性降到leave_threshold_days=0），请假超过leave_threshold_days后职业代价连续上升。
    reference: "Chatterji P & Markowitz S (2012); Whitney MD et al. (2023); Kleven H et al. (2019)"

  effective_daytime_feed_calc:
    step_unit: hour
    priority: 12
    dynamics:
      effective_breast_milk_day: >
        (breast_milk_day * (1.0 if at_work < 0.5 else work_daytime_retention_factor))
        if breast_milk_day > 0 else 0
    description: >
      实际有效日间哺乳量，仅在喂奶脉冲时刻（breast_milk_day>0）非零，其余步为0（保持与 breast_milk_day相同的脉冲语义，避免非进餐小时被误注入非零值）。priority 12，早于 absorbed_volume_tracking（11）/stomach_intake_and_overflow（10）执行，两者改用这个变量而非 breast_milk_day。

  absorbed_volume_tracking:
    priority: 11
    dynamics:
      total_absorbed_volume: >
        total_absorbed_volume + effective_breast_milk_day + night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - max(0.0, baby_stomach_volume + effective_breast_milk_day + night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - stomach_capacity_per_kg * baby_weight_fixed)
    description: >
      喂奶脉冲的吸收量记账：priority 11，先于 stomach_intake_and_overflow（priority 10）执行，读取的 baby_stomach_volume 是本步更新前的旧值，避免与胃容量更新方程重复计算溢出量。2026-08-02改用 effective_breast_milk_day（重返职场后打折）而非 breast_milk_day。

  night_absorbed_volume_tracking:
    priority: 11
    dynamics:
      night_absorbed_volume: >
        (night_absorbed_volume + (night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - max(0.0, baby_stomach_volume + night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - stomach_capacity_per_kg * baby_weight_fixed)))
        if (night_feed_1 > 0 or night_feed_2 > 0 or night_feed_3 > 0 or night_feed_4 > 0) else night_absorbed_volume
    description: >
      夜间四时段净吸收量（扣除胃容量溢出）的累计记账，2026-08-04新增，priority与
      absorbed_volume_tracking相同，读取的baby_stomach_volume是本步更新前的旧值。用
      if(是否有夜间脉冲)门控整个更新表达式：夜间脉冲时累加净吸收量，其余时段（含日间脉冲与
      空步）原样保持night_absorbed_volume不变（不能写成else 0，那会把累计值每步清零）。

  stomach_intake_and_overflow:
    priority: 10
    dynamics:
      baby_stomach_volume: >
        baby_stomach_volume + effective_breast_milk_day + night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - max(0.0, baby_stomach_volume + effective_breast_milk_day + night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - stomach_capacity_per_kg * baby_weight_fixed)
    description: "喂奶脉冲：加入胃，超过胃容量的部分记为溢出（不计入吸收量）。2026-08-02同上改用 effective_breast_milk_day。"

  gastric_emptying:
    step_unit: hour
    priority: 0
    dynamics:
      baby_stomach_volume: "max(0.0, baby_stomach_volume - gastric_emptying_rate * baby_stomach_volume * step)"
    description: "一阶胃排空，沿用原文件参数。"

  maternal_sleep_tracking:
    step_unit: hour
    priority: 20
    dynamics:
      mother_sleep_debt: >
        max(0.0, mother_sleep_debt - sleep_recovery_rate * step
        + sleep_disruption_per_nightfeed * (1 + sleep_fragmentation_quality_loss)
        * (1 if (night_feed_1 > 0 or night_feed_2 > 0 or night_feed_3 > 0 or night_feed_4 > 0) else 0))
    description: >
      睡眠债动态：本步任意一个夜间时段有非零喂奶即计一次夜醒代价，沿用原文件单次代价系数，2026-08-02叠加睡眠碎片化质量折损乘子（改编自postpartum_recovery_sim.yaml，引用Bonnet 1985）。

  lm_mother_score_update:
    step_unit: hour
    priority: 30
    dynamics:
      lm_mother_score: "lm_mother_score + step / 24.0 * (1 if mother_sleep_debt <= 4.0 else 0)"
    description: "妈妈健康时长累积（单位：天），判据沿用原文件 4.0h 阈值。"

