metadata:
  name: infant_breastfeeding_opt_infant
  lm_format_version: "1.0"
  description:
    problem: |
      儿科与婴儿生长单学科视角优化，只最大化 lm_baby_score，即宝宝体重达标时长，不考虑母亲睡眠剥夺，代表如果只听儿科生长指南、不管母亲产后健康，单学科最优会推到什么程度。
      与 infant_breastfeeding_opt_maternal.yaml 的产后母亲健康单学科视角、infant_breastfeeding_opt_joint.yaml 的联合多学科视角并列对比，才能体现联合优化揭示的权衡区间；完整物理机制、来源文献与对比仿真见 imports 的 infant_breastfeeding_sim.yaml 的 description.problem，本文件不重复列出，只把优化目标收窄为儿科单学科视角。
    method: |
      机制与 infant_breastfeeding_sim.yaml 相同，耦合结构说明见该文件 description.method，此处不重复。
      本文件只把优化目标收窄为单一学科视角，仅最大化 lm_baby_score，决策变量与搜索空间与 infant_breastfeeding_opt_maternal.yaml、infant_breastfeeding_opt_joint.yaml 完全一致，便于三者并列比较。
    result: |
      儿科单学科最优解的 lm_baby_score 收敛到9.54，两次独立重跑逐位一致，确认数值落在 day 单位修复后的正确量级。
    limitations: |
      机制层面的局限见 imports 的 infant_breastfeeding_sim.yaml 的 description.limitations，此处不重复。
  references:
    - "见 ./infant_breastfeeding_sim.yaml"
  log:
    "2026-08-05_00-00-00":
      change: "results 精简为 2026-07-10 的最终收敛结果，移除已确认的 24 倍单位放大历史记录 historical_stale_from_2026-06-19；description 补充 method 字段"
      reason: "落实 ADR 0141，主文件只保留当前有效结果，调试脉络转移至 history/2026-08-05_infant_breastfeeding_opt_infant.yaml。"
    "2026-08-06_00-00-00":
      change: "description 按 problem/method/result/limitations 四字段重写，新增 result/limitations 字段，problem/method 改为列表结构，清理非豁免括号与破折号，来源文献的指向从单独的 citation 字段并入 problem 里对 infant_breastfeeding_sim.yaml description.problem 的引用"
      reason: "落实 ADR 0142。"

imports:
  - ./infant_breastfeeding_sim

optimizer:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-04-01"
  step_size:
    value: 1
    unit: hour

  objectives:
    - variable: lm_baby_score
      metric: final
      direction: maximize
      description: "儿科单学科目标：仅最大化宝宝体重达标时长，不权衡母亲睡眠剥夺"

  constraints:
    - variable: baby_weight
      condition: ">= 3.0"
      type: hard
      description: "宝宝体重不低于2.7kg（出生体重90%），防止极端喂养不足方案"

  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

  # 与 infant_breastfeeding_opt_joint.yaml 完全相同的决策变量结构，只换目标函数，
  # 这样三个场景的搜索空间一致，结果才可比。
  startpoint:
    regimens:
      - variable: breast_milk
        time_start: "07:00"
        time_end: "07:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "白天喂奶 7:00"
        optimize:
          value: [20, 150]

      - variable: breast_milk
        time_start: "10:00"
        time_end: "10:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "白天喂奶 10:00"
        optimize:
          value: [20, 150]

      - variable: breast_milk
        time_start: "13:00"
        time_end: "13:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "白天喂奶 13:00"
        optimize:
          value: [20, 150]

      - variable: breast_milk
        time_start: "16:00"
        time_end: "16:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "白天喂奶 16:00"
        optimize:
          value: [20, 150]

      - variable: breast_milk
        time_start: "19:00"
        time_end: "19:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "白天喂奶 19:00"
        optimize:
          value: [20, 150]

      - variable: breast_milk
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "夜间喂奶一（前半夜）"
        optimize:
          value: [10, 120]
          time_start: ["21:00", "23:00"]
          time_step: "1h"

      - variable: breast_milk
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "夜间喂奶二（后半夜）"
        optimize:
          value: [10, 120]
          time_start: ["02:00", "05:00"]
          time_step: "1h"

  results:
    status: "2026-07-10 与 2026-07-14 两次独立重跑逐位一致（best_f=9.541666666666666），确认 lm_baby_score 落在 day 单位修复后的正确量级。"
    generated_at: "2026-07-10"
    method: nsga2
    population_size: 50
    n_generations: 80
    n_solutions: 50
    recommended:
      x: [135.6992323595469, 129.61185633684858, 128.84318513592677, 114.47571037134443, 98.58923115124817, 117.21945306732596, 1.9305386062949834, 109.0843512998072, 1.326709768321983]
      f: [9.541666666666666]
    note: "infant-only 单目标最优值（9.5417 天）与 infant_breastfeeding_opt_joint.yaml 同期联合优化结果完全相同，50 个候选解的决策变量在夜间喂奶时机/奶量上高度一致，仅白天喂奶量有排列组合差异，目标值恒定——在当前模型参数下，婴儿生长目标与母亲睡眠目标之间未出现权衡，联合优化点同时是两个单学科目标各自的最优点，不构成 Pareto 前沿。这一发现需要结合 metadata.todo 中已知的溢奶量级/体重落后问题一并解读：当前'无权衡'结论可能是参数未校准的副产物，而非真实生理结论。本结果与 infant_breastfeeding_opt_joint.yaml 的对照均建立在 2026-07-28 母亲侧健康阈值修改（mother_sleep_debt<=15.0 改为 <=4.0）之前的模型版本上，联合前沿是否仍然退化为单点尚待用当前阈值重新验证。更早的重跑记录见 history/2026-08-05_infant_breastfeeding_opt_infant.yaml。"
