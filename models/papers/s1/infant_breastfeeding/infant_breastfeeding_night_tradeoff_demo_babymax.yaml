metadata:
  name: infant_breastfeeding_night_tradeoff_demo_babymax
  lm_format_version: "1.0"
  updated: 2026-08-04
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  references:
    - "Scammon & Doyle (1920) AJDC 20:516-538"
    - "Cavell B (1981) Acta Paediatr Scand 70:639-641"
    - "Doan T et al. (2007) J Perinat Neonatal Nurs 21(3):200-206"
    - "Borbely AA (1982) Hum Neurobiol 1(3):195-204"
    - "Goyal D et al. (2009) Arch Womens Ment Health 12(4):229-237"
    - "Bonnet MH (1985) Effect of sleep disruption on sleep, performance, and mood. Sleep 8(1):11-19"
    - "Insana SP & Montgomery-Downs HE (2013) Sleep and postpartum fatigue. Infant Behav Dev 36(4):554-560"
    - "Chatterji P & Markowitz S (2012) Family leave after childbirth and the mental health of new mothers. J Ment Health Policy Econ 15(2):61-76"
    - "Whitney MD, Holbrook C, Alvarado L, Boyd S (2023) Length of Maternity Leave Impact on Mental and Physical Health of Mothers and Infants, a Systematic Review and Meta-analysis. Matern Child Health J 27(8):1308-1323"
    - "Kleven H, Landais C, Sogaard JE (2019) Children and Gender Inequality: Evidence from Denmark. Am Econ J Appl Econ 11(4):181-209"
  log:
    "2026-08-05_00-00-00":
      change: "移除已解决的 todo 条目；description 补充 method 字段"
      reason: "落实 ADR 0141，主文件只保留当前状态，调试脉络转移至 history/2026-08-05_infant_breastfeeding_night_tradeoff_demo_babymax.yaml。"
    "2026-08-06_00-00-00":
      change: "description 按 problem/method/result/limitations 四字段重写，problem/method/result/limitations 改为列表结构，去掉案例C这类框架内部代号，改用基线文件指代，清理硬换行与非豁免括号，来源文献不再单列 citation 字段，改为直接挂在基线文件 description.problem 各机制条目下面"
      reason: "落实 ADR 0142。"
  description:
    problem: |
      与同目录 infant_breastfeeding_night_tradeoff_demo.yaml 共享完全相同的动力学机制与来源文献，为什么需要联合建模见该文件 description.problem，此处不重复。
      本文件把夜间净吸收奶量预算从150 mL每晚拉高到400 mL每晚，超过四个候选时段各自0到90 mL上界能产生的物理上限360 mL每晚，使这条约束实质上不再起作用，目标结构不变，用于回答：夜间预算约束是塑造前沿婴儿与母亲权衡这一发现的关键因素，还是即使预算不设限前沿也能自发保持多样性。
    method: |
      机制与同目录 infant_breastfeeding_night_tradeoff_demo.yaml 相同，耦合结构说明见该文件 description.method，此处不重复。
      本文件把 night_absorbed_volume_budget 从150 mL每晚拉高到400 mL每晚，超过决策变量物理上限使约束不再绑定，用于检验夜间预算约束松紧本身对前沿结构的影响。
    result: |
      预算拉高到400 mL每晚且不再绑定后，前沿没有收窄成几乎全是婴儿利益的单一区域，反而变得更宽，但更宽的部分主要是信息量最低的极端解，真正有决策价值的中段权衡反而被稀释。
      - 前沿保留了基线文件已经找到的单时段与双时段两种规模，母亲健康时长140.0与29.42到29.50。
      - 新增了基线文件因预算限制从未出现过的三时段与四时段两种规模，母亲健康时长分别为3.21与1.4583，后者正是基线文件在加入预算约束前记录过的角点收敛冻结值本身。
      - 总吸收奶量范围从基线文件的59142到69372 mL扩大到59142到87756 mL。
      预算约束真正的作用因此不是把前沿限制在某个区域内，而是把四个时段全开、母亲收益冻结在最差值这一支配性但信息量最低的解排除在可行域之外：这个解在总奶量单一维度上确实最优，一旦预算不限制它，搜索算法必然把它保留为非支配解，但它对研究母亲与婴儿权衡这件事没有信息量。更准确的说法不是预算越高越偏向婴儿利益，而是预算越高，前沿越容易被单一维度最优但退化的解重新占据一角，预算约束真正的作用是排除这类退化解，不是单纯限制婴儿一侧的收益上限。
    limitations: |
      与基线文件共享同一套简化边界，详见该文件 description.limitations，此处不重复。
      400 mL每晚这个数字是刻意选取的方法论探针，明确超过决策变量物理上限，让约束不绑定，不代表任何临床推荐喂养量，不应被引用为标定选择以外的任何意义。
  ratings:
    validation_confidence: 1 - 简化演示场景，尚未与任何独立文献目标数值比对，仅验证夜间预算约束松紧对决策变量结构的影响

# ── 变量 ─────────────────────────────────────────────────────────────────────
variables:

  baby_weight_fixed:
    type: parameter
    value: 3.3
    unit: kg
    description: >
      固定出生体重，本演示场景不建模体重增长。2026-08-02仿真窗口从14天延长到140天后，这一简化的失真程度比原版更明显（20周内婴儿体重实际会有显著增长），但本文件的 total_absorbed_volume目标本来就是"决策变量结构能否产生非退化前沿"的相对比较代理指标，不是绝对生长结局判断，继续使用固定体重以保持与原14天版本的一致性、避免引入原始90天模型已知的体重标定问题。

  stomach_capacity_per_kg:
    type: parameter
    value: 30.0
    unit: mL/kg
    description: "每kg体重对应的胃容量，沿用原文件参数。"
    reference: "Scammon & Doyle (1920) AJDC 20:516-538."

  gastric_emptying_rate:
    type: parameter
    value: 0.46
    unit: 1/hour
    description: "胃排空一阶速率常数，沿用原文件参数。"
    reference: "Cavell B (1981) Acta Paediatr Scand 70:639-641."

  sleep_disruption_per_nightfeed:
    type: parameter
    value: 0.75
    unit: hour
    description: "每次夜间喂奶消耗的有效睡眠时间，沿用原文件参数。"
    reference: "Doan T et al. (2007) J Perinat Neonatal Nurs 21(3):200-206."

  sleep_recovery_rate:
    type: parameter
    value: 0.083
    unit: hour/hour
    description: "每小时睡眠债自然恢复速率，沿用原文件参数。"
    reference: "Borbely AA (1982) Hum Neurobiol 1(3):195-204."

  sleep_fragmentation_quality_loss:
    type: parameter
    value: 0.4
    unit: dimensionless
    bounds: [0, 0.8]
    description: >
      夜间喂奶造成的睡眠碎片化对"剩余睡眠"恢复效率的折损比例，2026-08-02改编自 postpartum_recovery_sim.yaml（S4）已验证的同名机制与同一数值（0.4为标定选择，非直接文献测量值，原文件已如此标注）。
    reference: "Bonnet MH (1985) Sleep 8(1):11-19; Insana SP & Montgomery-Downs HE (2013) Infant Behav Dev 36(4):554-560"

  # ── 母亲职业发展心理维度 ─────────────────────────────────────
  return_to_work_trigger:
    type: input
    value: 0.0
    unit: dimensionless
    bounds: [0.0, 1.0]
    description: >
      重返职场触发标记（T4决策变量：只搜索触发的起始日期，量值本身固定不搜索）。从 optimizer搜到的起始日起每天0点触发一次，触发后 return_to_work_ratchet 方程把 at_work 锁定为1（不会因为触发窗口结束而复位），代表"重返职场是一次性状态转换，不是可逆事件"。

  at_work:
    type: state
    value: 0.0
    unit: dimensionless
    bounds: [0, 1]
    description: "是否已重返职场的棘轮状态（一旦变为1，此后保持1，见 return_to_work_ratchet）。"

  leave_length_days:
    type: state
    value: 0.0
    unit: day
    description: >
      实际请假天数：at_work=0期间逐日累加，at_work变为1后冻结，冻结时的值即为本次仿真里"实际请假多少天才重返职场"，同时驱动 maternal_depression_index 与 career_penalty_index 两条曲线。

  leave_threshold_days:
    type: parameter
    value: 84.0
    unit: day
    description: >
      产后12周（84天），母婴身心结局最优的循证阈值，兼作 maternal_depression_index 的下降终点与 career_penalty_index 的上升起点。
    reference: "Whitney MD et al. (2023) Matern Child Health J 27(8):1308-1323"

  depression_penalty_max:
    type: parameter
    value: 0.79
    unit: dimensionless
    description: >
      请假时长趋近0时 maternal_depression_index 的峰值，直接取自 Chatterji & Markowitz（2012）报告的真实测量值："产假<12周"对应 CES-D 12项抑郁量表 +0.79分。maternal_depression_index 在请假0至84天间按线性插值从此峰值降到0，是把该文献单一时间点的categorical测量值換算为连续曲线的工程近似（文献本身未提供连续的剂量-反应轨迹数据），非独立测量值本身延伸出的连续曲线。
    reference: "Chatterji P & Markowitz S (2012) J Ment Health Policy Econ 15(2):61-76"

  career_penalty_rate_per_day:
    type: parameter
    value: 0.01
    unit: 1/day
    description: >
      请假超过 leave_threshold_days 后，career_penalty_index 每多请假一天的增量。标定选择，非直接文献测量值：Kleven et al.（2019）用丹麦行政数据证明生育后女性收入受到真实、持续的长期损失（"child penalty"），为"延长职业中断有真实经济代价"这一机制的存在性提供文献依据，但该文献未给出"每多请假一天代价增加多少"的斜率，此处取值仅代表量级存在、方向正确，不代表已校准的真实斜率。
    reference: "标定选择（见描述）；机制存在性依据 Kleven H et al. (2019) Am Econ J Appl Econ 11(4):181-209"

  maternal_depression_index:
    type: state
    value: 0.79
    unit: dimensionless
    description: >
      短假期抑郁风险指数（CES-D量表点数近似）：leave_length_days在0至 leave_threshold_days区间内线性下降至0，之后保持0（不是二元阈值，每多请一天假风险连续下降，避免重蹈原90天模型WHO二元阈值导致前沿退化为单点的覆辙）。
    reference: "Chatterji P & Markowitz S (2012) J Ment Health Policy Econ 15(2):61-76"

  career_penalty_index:
    type: state
    value: 0.0
    unit: dimensionless
    description: >
      职业代价指数：leave_length_days超过leave_threshold_days后，超出部分乘以 career_penalty_rate_per_day连续累积，之前恒为0。与maternal_depression_index 方向相反，共同构成请假时长的真实两面权衡（而非"请假越长越好"的单调关系）。
    reference: "标定选择，机制存在性依据 Kleven H et al. (2019)"

  work_daytime_retention_factor:
    type: parameter
    value: 0.7
    unit: dimensionless
    bounds: [0, 1]
    description: >
      重返职场后，日间哺乳/泵奶能达成的比例（相对未返岗时的100%）。标定选择，非直接文献测量值，定性方向由"全职工作与更早重返职场显著降低母乳喂养持续时长/频率"这一发现支撑（Determinants of breastfeeding initiation and cessation among employed mothers 队列研究），用于让"重返职场时点"这一决策与已有的夜间喂养决策空间产生真实耦合：更早重返职场会压低日间奶量，迫使更多夜奶才能维持总摄入量。
    reference: "标定选择；定性支持见描述"

  # 日间固定喂养（非决策变量，通过 startpoint.regimens 的无 optimize 块条目声明）
  breast_milk_day:
    type: input
    value: 100.0
    unit: mL
    description: "日间固定喂养量，非决策变量。"

  effective_breast_milk_day:
    type: state
    value: 0.0
    unit: mL
    description: >
      实际有效日间哺乳量（脉冲，语义同breast_milk_day）：at_work=0时等于breast_milk_day，at_work=1后按work_daytime_retention_factor打折。stomach_intake_and_overflow/absorbed_volume_tracking改用这个变量而非breast_milk_day，使重返职场时点真实影响婴儿侧摄入结局。

  # 夜间4个候选时段，独立决策变量，0表示跳过
  night_feed_1:
    type: input
    value: 0.0
    unit: mL
    bounds: [0, 90]
    description: "夜间候选喂奶时段1（23:00）。值0表示本次跳过不喂。"

  night_feed_2:
    type: input
    value: 0.0
    unit: mL
    bounds: [0, 90]
    description: "夜间候选喂奶时段2（01:00）。值0表示本次跳过不喂。"

  night_feed_3:
    type: input
    value: 0.0
    unit: mL
    bounds: [0, 90]
    description: "夜间候选喂奶时段3（03:00）。值0表示本次跳过不喂。"

  night_feed_4:
    type: input
    value: 0.0
    unit: mL
    bounds: [0, 90]
    description: "夜间候选喂奶时段4（05:00）。值0表示本次跳过不喂。"

  night_absorbed_volume_budget:
    type: parameter
    value: 400.0
    unit: mL
    description: >
      夜间（23:00-05:00窗口）四个候选时段净吸收奶量之和的预算上限，本案例（案例A）刻意拉高到
      400 mL/night，超过night_feed_1..4四个决策变量各自[0,90]上界能产生的物理上限
      （4×90=360 mL/night），让这条约束实质上不再绑定。跟案例C（同目录基线文件，150 mL/night）
      唯一的差异就是这个数字，用于测试预算约束的松紧如何塑造前沿。不是标定选择，是方法论探针，
      不代表任何临床推荐喂养量。

  baby_stomach_volume:
    type: state
    value: 0.0
    unit: mL
    description: "宝宝胃内当前奶量。"

  total_absorbed_volume:
    type: state
    value: 0.0
    unit: mL
    description: "累计吸收奶量（不含溢出部分），婴儿侧目标的简化代理指标。"

  night_absorbed_volume:
    type: state
    value: 0.0
    unit: mL
    description: >
      夜间四个候选时段（night_feed_1..4）净吸收奶量（扣除胃容量溢出后）的仿真窗口累计总和，
      仅用于optimizer.constraints约束夜奶总预算，不是独立的婴儿侧目标。

  mother_sleep_debt:
    type: state
    value: 0.0
    unit: hour
    description: "妈妈累计睡眠债，沿用原文件动态。"

  lm_mother_score:
    type: state
    value: 0.0
    unit: hour
    description: "妈妈健康时长：睡眠债低于4小时的累计小时数。"

# ── 动力学方程 ────────────────────────────────────────────────────────────────
equations:

  return_to_work_ratchet:
    step_unit: hour
    priority: 50
    dynamics:
      at_work: "max(at_work, 1.0 if return_to_work_trigger > 0 else 0.0)"
    description: >
      重返职场是一次性状态转换：return_to_work_trigger 从T4搜到的起始日起每天触发，at_work 一旦被置1便不会复位（棘轮），代表这是不可逆事件而非可重复开关。

  leave_length_tracking:
    step_unit: day
    priority: 45
    dynamics:
      leave_length_days: "leave_length_days + step * (1 if at_work < 0.5 else 0)"
    description: "请假天数累加：at_work=0期间逐日累加，变1后自动冻结（增量条件恒为0）。"

  psych_index_update:
    step_unit: day
    priority: 40
    dynamics:
      maternal_depression_index: "max(0.0, depression_penalty_max * (1.0 - leave_length_days / leave_threshold_days))"
      career_penalty_index: "max(0.0, leave_length_days - leave_threshold_days) * career_penalty_rate_per_day"
    description: >
      两条连续曲线，均为 leave_length_days 的直接函数（无记忆，每步用当前leave_length_days 重新计算，leave_length_days冻结后两者自然也冻结在最终值）：请假越短抑郁风险越高（线性降到leave_threshold_days=0），请假超过leave_threshold_days后职业代价连续上升。
    reference: "Chatterji P & Markowitz S (2012); Whitney MD et al. (2023); Kleven H et al. (2019)"

  effective_daytime_feed_calc:
    step_unit: hour
    priority: 12
    dynamics:
      effective_breast_milk_day: >
        (breast_milk_day * (1.0 if at_work < 0.5 else work_daytime_retention_factor))
        if breast_milk_day > 0 else 0
    description: >
      实际有效日间哺乳量，仅在喂奶脉冲时刻（breast_milk_day>0）非零，其余步为0（保持与 breast_milk_day相同的脉冲语义，避免非进餐小时被误注入非零值）。priority 12，早于 absorbed_volume_tracking（11）/stomach_intake_and_overflow（10）执行，两者改用这个变量而非 breast_milk_day。

  absorbed_volume_tracking:
    priority: 11
    dynamics:
      total_absorbed_volume: >
        total_absorbed_volume + effective_breast_milk_day + night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - max(0.0, baby_stomach_volume + effective_breast_milk_day + night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - stomach_capacity_per_kg * baby_weight_fixed)
    description: >
      喂奶脉冲的吸收量记账：priority 11，先于 stomach_intake_and_overflow（priority 10）执行，读取的 baby_stomach_volume 是本步更新前的旧值，避免与胃容量更新方程重复计算溢出量。2026-08-02改用 effective_breast_milk_day（重返职场后打折）而非 breast_milk_day。

  night_absorbed_volume_tracking:
    priority: 11
    dynamics:
      night_absorbed_volume: >
        (night_absorbed_volume + (night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - max(0.0, baby_stomach_volume + night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - stomach_capacity_per_kg * baby_weight_fixed)))
        if (night_feed_1 > 0 or night_feed_2 > 0 or night_feed_3 > 0 or night_feed_4 > 0) else night_absorbed_volume
    description: >
      夜间四时段净吸收量（扣除胃容量溢出）的累计记账，priority与absorbed_volume_tracking相同，
      读取的baby_stomach_volume是本步更新前的旧值。用if(是否有夜间脉冲)门控整个更新表达式：
      夜间脉冲时累加净吸收量，其余时段（含日间脉冲与空步）原样保持night_absorbed_volume不变
      （不能写成else 0，那会把累计值每步清零）。

  stomach_intake_and_overflow:
    priority: 10
    dynamics:
      baby_stomach_volume: >
        baby_stomach_volume + effective_breast_milk_day + night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - max(0.0, baby_stomach_volume + effective_breast_milk_day + night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - stomach_capacity_per_kg * baby_weight_fixed)
    description: "喂奶脉冲：加入胃，超过胃容量的部分记为溢出（不计入吸收量）。2026-08-02同上改用 effective_breast_milk_day。"

  gastric_emptying:
    step_unit: hour
    priority: 0
    dynamics:
      baby_stomach_volume: "max(0.0, baby_stomach_volume - gastric_emptying_rate * baby_stomach_volume * step)"
    description: "一阶胃排空，沿用原文件参数。"

  maternal_sleep_tracking:
    step_unit: hour
    priority: 20
    dynamics:
      mother_sleep_debt: >
        max(0.0, mother_sleep_debt - sleep_recovery_rate * step
        + sleep_disruption_per_nightfeed * (1 + sleep_fragmentation_quality_loss)
        * (1 if (night_feed_1 > 0 or night_feed_2 > 0 or night_feed_3 > 0 or night_feed_4 > 0) else 0))
    description: >
      睡眠债动态：本步任意一个夜间时段有非零喂奶即计一次夜醒代价，沿用原文件单次代价系数，2026-08-02叠加睡眠碎片化质量折损乘子（改编自postpartum_recovery_sim.yaml，引用Bonnet 1985）。

  lm_mother_score_update:
    step_unit: hour
    priority: 30
    dynamics:
