metadata:
  name: infant_breastfeeding_opt_joint
  lm_format_version: "1.0"
  description:
    problem: |
      母婴喂养节律联合多学科优化配置，白天各次喂奶量与夜间喂奶量、时机同时是决策变量，同时最大化 lm_baby_score 与 lm_mother_score，代表儿科婴儿生长与产后母亲健康联合视角。
      与 infant_breastfeeding_opt_infant.yaml、infant_breastfeeding_opt_maternal.yaml 两个单学科视角并列对比，才能体现联合优化揭示的权衡区间；完整物理机制、来源文献与对比仿真见 imports 的 infant_breastfeeding_sim.yaml 的 description.problem，本文件不重复列出，把优化目标合并为儿科与母亲健康联合视角。
    method: |
      机制与 infant_breastfeeding_sim.yaml 相同，耦合结构说明见该文件 description.method，此处不重复。
      本文件把白天各次喂奶量与夜间喂奶量、时机联合优化，同时最大化 lm_baby_score 与 lm_mother_score，与两个单学科视角文件共享相同的决策变量与搜索空间，便于三者并列比较。
    result: |
      联合优化解在旧母亲侧阈值下收敛到 lm_baby_score 9.54与 lm_mother_score 90分，两次独立重跑逐位一致，母亲侧目标同样命中该轮阈值下的满分上限，与单学科母亲健康优化的结果一致。
    limitations: |
      本结果建立在2026-07-28母亲侧健康阈值修改之前的模型版本上，即睡眠债判定阈值从15小时改为4小时之前，尚未用当前阈值重新验证，母亲侧命中满分上限这一结果的有效性因此存疑。
      机制层面的局限见 imports 的 infant_breastfeeding_sim.yaml 的 description.limitations，此处不重复。
  references:
    - "见 ./infant_breastfeeding_sim.yaml"
  log:
    "2026-08-05_00-00-00":
      change: "results 精简为 2026-07-10 的收敛结果，移除已确认的 24 倍单位放大历史记录 historical_stale_from_2026-06-15；description 补充 method 字段；status 如实标注本结果早于 2026-07-28 阈值修改"
      reason: "落实 ADR 0141，主文件只保留当前状态并诚实标注结果的有效期，调试脉络转移至 history/2026-08-05_infant_breastfeeding_opt_joint.yaml。"
    "2026-08-06_00-00-00":
      change: "description 按 problem/method/result/limitations 四字段重写，新增 result/limitations 字段，把结果早于阈值修改这一有效性提示从 optimizer.results.status 提升到 description.limitations，problem/method 改为列表结构，去掉 T1/T2 这类框架内部符号，清理非豁免括号与破折号，来源文献的指向从单独的 citation 字段并入 problem 里对 infant_breastfeeding_sim.yaml description.problem 的引用"
      reason: "落实 ADR 0142。"

imports:
  - ./infant_breastfeeding_sim

optimizer:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-04-01"
  step_size:
    value: 1
    unit: hour

  objectives:
    - variable: lm_baby_score
      metric: final
      direction: maximize
      description: "最大化3月龄结束时宝宝体重达WHO生长曲线97%阈值的累计小时数（宝宝成长质量，儿科视角）"
    - variable: lm_mother_score
      metric: final
      direction: maximize
      description: "最大化妈妈睡眠债低于15小时的累计小时数（衡量产后睡眠可持续性，母亲健康视角）"

  constraints:
    - variable: baby_weight
      condition: ">= 3.0"
      type: hard
      description: "宝宝体重不低于2.7kg（出生体重90%），防止极端喂养不足方案"


  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

  startpoint:
    regimens:
      # 5次白天喂奶（固定时刻，优化奶量）
      - variable: breast_milk
        time_start: "07:00"
        time_end: "07:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "白天喂奶 7:00"
        optimize:
          value: [20, 150]

      - variable: breast_milk
        time_start: "10:00"
        time_end: "10:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "白天喂奶 10:00"
        optimize:
          value: [20, 150]

      - variable: breast_milk
        time_start: "13:00"
        time_end: "13:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "白天喂奶 13:00"
        optimize:
          value: [20, 150]

      - variable: breast_milk
        time_start: "16:00"
        time_end: "16:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "白天喂奶 16:00"
        optimize:
          value: [20, 150]

      - variable: breast_milk
        time_start: "19:00"
        time_end: "19:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "白天喂奶 19:00"
        optimize:
          value: [20, 150]

      # 2次夜间喂奶（优化奶量 + 时机，T1+T2）
      - variable: breast_milk
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "夜间喂奶一（前半夜）"
        optimize:
          value: [10, 120]
          time_start: ["21:00", "23:00"]
          time_step: "1h"

      - variable: breast_milk
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "夜间喂奶二（后半夜）"
        optimize:
          value: [10, 120]
          time_start: ["02:00", "05:00"]
          time_step: "1h"

  results:
    status: "本结果建立在 2026-07-28 母亲侧健康阈值修改（mother_sleep_debt<=15.0 改为 <=4.0）之前的模型版本上，尚未用当前阈值重新验证；2026-07-10 与 2026-07-14 两次独立重跑在旧阈值下逐位一致（best_f=[9.541666...,90]）。"
    generated_at: "2026-07-10"
    method: nsga2
    population_size: 50
    n_generations: 80
    n_solutions: 50
    pareto_front:
      - {x: [135.6992323595469, 129.61185633684858, 128.84318513592677, 114.47571037134443, 98.58923115124817, 117.21945306732596, 1.9305386062949834, 109.0843512998072, 1.326709768321983], f: [9.541666666666666, 90.00000000000149]}
    recommended:
      x: [135.6992323595469, 129.61185633684858, 128.84318513592677, 114.47571037134443, 98.58923115124817, 117.21945306732596, 1.9305386062949834, 109.0843512998072, 1.326709768321983]
      f: [9.541666666666666, 90.00000000000149]
    note: "50 个候选解在目标空间全部退化为同一点 f=[9.54,90]（Pareto 前沿仅 1 个非支配目标向量），与 infant_breastfeeding_opt_infant.yaml 的单学科最优完全一致——在旧阈值下联合优化未揭示真正的权衡，儿科单学科的全局最优点本身已同时满足母亲侧约束。阈值已改为4小时后这一'无权衡'结论是否仍然成立需要重新用当前模型跑 --opt 确认。更早的重跑记录见 history/2026-08-05_infant_breastfeeding_opt_joint.yaml。"
