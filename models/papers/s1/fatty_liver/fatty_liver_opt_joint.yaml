metadata:
  name: fatty_liver_opt_joint
  lm_format_version: "1.0"
  description:
    problem: "脂肪肝运动周期化联合多学科优化配置，基础活动强度与强化训练的叠加量、频率、升级时机同时作为决策变量，联合最小化肝脂肪与疲劳峰值，代表肝病科与运动医学联合视角。完整物理机制与对比仿真见 imports 的 fatty_liver_sim。与单学科视角的 fatty_liver_opt_hepatology.yaml、fatty_liver_opt_exercise.yaml 并列对比，才能体现联合优化揭示的权衡区间。"
    method: "机制与 fatty_liver_sim.yaml 相同，完整机制列表见该文件 description.method；本文件把基础活动强度与强化训练叠加量、频率、升级时机这几个决策变量联合优化，同时最小化肝脂肪与疲劳峰值。"
  references:
    - "见 ./fatty_liver_sim.yaml"
  log:
    "2026-08-05_00-00-00":
      change: "results 精简为 2026-07-11 的最终收敛结果，移除已确认冗余的 historical_stale_from_2026-07-10（含其嵌套的 historical_stale_from_2026-06-15）子块与内部任务记录指针；description 补充 method 字段"
      reason: "落实 ADR 0141，主文件只保留当前有效结果，调试脉络转移至 history/2026-08-05_fatty_liver_opt_joint.yaml。"

imports:
  - ../banister/banister_validation
  - ./fatty_liver_sim

optimizer:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-03-27"
  step_size:
    value: 1
    unit: day

  objectives:
    - variable: liver_fat_pct
      metric: final
      direction: minimize
      description: "最小化 12 周末肝脂肪百分比（肝病科视角，主要健康结局）"
    - variable: fatigue
      metric: max
      direction: minimize
      description: "最小化训练期疲劳峰值（运动医学视角，损伤/脱落风险代理指标）"

  mc:
    runs: 5
    seed: 19

  algorithm:
    population_size: 80
    n_generations: 150
    seed: 19


  startpoint:
    regimens:
      # T1: 基础日常活动（全程每日，中低强度）
      - variable: training_load
        time_start: "07:00"
        time_end: "07:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "基础日常活动强度"
        optimize:
          value: [2.5, 5.0]

      # T1+T3+T4: 强化训练叠加（在基础之上；T3 控制频率，T4 控制升级时机）
      # 物理含义：强化日总强度 = 基础值 + 叠加值（两个 pulse 同时刻累加）
      - variable: training_load
        time_start: "07:00"
        time_end: "07:00"
        label: "强化训练叠加量 × 频率 × 升级时机"
        optimize:
          value: [2.0, 5.5]
          days_pool: [Mon, Tue, Wed, Thu, Fri, Sat]
          days_n: [3, 5]
          date_range:
            - ["2026-01-01", "2026-02-12"]
            - ["2026-03-27", "2026-03-27"]

  results:
    status: "同一配置（pop=80/gen=150/seed=19/mc=5）在 2026-07-11 与 2026-07-14 两次独立重跑中逐位一致，前沿在 fatigue 维度较早前更宽（14.3–61.9 AU，此前 20.3–54.1 AU），liver_fat_pct 维度基本不变（2.83–10.33%，此前 2.83–10.7%）。独立 --sim-only 复核显示前沿中段（liver_fat_pct≈8.4% 附近）opt 内部报告的低 fatigue 解不完全可信，复核后确认约4%的温和改善而非报告的更大幅改善，见 note；未采信、未更新 joint_optimized plan、未更新论文表6。"
    generated_at: "2026-07-11"
    method: nsga2
    population_size: 80
    n_generations: 150
    n_solutions: 31
