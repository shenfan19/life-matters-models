metadata:
  name: masld_hua_ihio
  lm_format_version: "1.0"
  updated: 2026-05-26
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      MASLD（消化科）与 HOMA-IR（内分泌科）联合管理下，减重速率超过 0.3 kg/周会触发酮体-IR 恶化循环，使跨科室联合可行域收缩乃至成为非凸区域。
      IHIO 核心问题：减重速率是否构成跨病种的分岔控制参数——即是否存在某个速率阈值，使 Pareto 前沿形状发生质变？基于 S2 A7 模型，在不同减重速率约束下比较前沿变化。
    result: |
      仿真预期：
      1. 温和减重约束（≤0.27 kg/周）下，Pareto 前沿 hypervolume 下降约 30%；
      2. 但 HOMA-IR 端点改善更大，因为消除了酮体恶化循环；
      3. 空腹晨练优势在两种约束下均稳健。
      注：仿真尚未运行。
    limitations: |
      酮体-IR 恶化的动力学系数为估算值，待精化；分岔阈值 0.3 kg/周来自 MASLD 文献，个体差异通过参数分布隐含；仿真尚未运行（nosim）。
  ratings:
    topic_importance: 4 - 分岔点分析兼具系统科学和临床双重意义
    framework_demand: 3 - S3分析模型，import自s2 A7，被s4引用
    evidence_quality: 3 - IL-6 耦合系数仍为估算，分岔断言对该系数敏感
    paper_value: 5 - S3 理论深度最强案例，IHIO 框架核心证据
    innovation: 5 - 减重速率作为控制分岔点，超参数扫描展示连续变化，无先例
  tags: [MASLD, insulin_resistance, HOMA-IR, IHIO, bifurcation, feasibility]
  references:
    - "参见 s2/masld_insulin.yaml 完整引用"
    - "Deb K et al. (2002) NSGA-II. IEEE Trans Evol Comput 6(2):182-197"
    - "Gonzalez-Franquesa A et al. (2023) Fasted exercise and liver fat. Cell Metab 36(1):108-125"
    - "Erickson ML et al. (2019) Effect of exercise timing on insulin sensitivity. Diabetologia 62(8):1387-1395"
  step_size:
    value: 1
    unit: day

imports:
  - papers/s2/masld_insulin_noref

# 继承 s2/masld_insulin_noref 全部变量、公式和约束
# 覆盖 optimizer：双约束对比验证分岔假说（减重速率 ≤0.38 vs ≤0.27 kg/w）


optimizer:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-07-01"
  step_size:
    value: 1
    unit: day

  objectives:
    - variable: liver_fat
      metric: final
      direction: minimize
      description: "最小化26周末肝脂（消化科目标）"
    - variable: HOMA_IR
      metric: final
      direction: minimize
      description: "最小化26周末胰岛素抵抗指数（内分泌科目标）"

  constraints:
    - variable: ALT
      condition: "<= 40"
      metric: final
      type: hard
      description: "26周末ALT回落至正常上限（初始ALT=52高于此阈值，作为治疗终点目标而非全程安全约束）"
    - variable: blood_glucose
      condition: "<= 7.8"
      type: hard
    - variable: body_weight
      condition: ">= 72"
      type: hard
      description: "减重速率约束 ≤0.38 kg/w（IHIO 分岔分析的宽松侧）"

  schedules:
    # T1: 热量缺口（控制减重速率的直接决策变量）
    - variable: caloric_deficit
      time_start: "00:00"
      time_end: "00:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "每日热量缺口（分岔控制参数）"
      optimize:
        value: [150.0, 600.0]

    # T1+T2: 运动量 + 运动时机（空腹 vs 餐后对 IR 改善的异质效应）
    - variable: exercise_met_min
      days: [Mon, Wed, Fri]
      label: "有氧运动量与时机（T2 IHIO 时间维度）"
      optimize:
        value: [100.0, 300.0]
        time_start: ["06:00", "20:00"]

    # T1+T3: 饮食升糖负荷 + 频率模式
    - variable: exercise_met_min
      time_start: "07:00"
      time_end: "07:00"
      label: "运动频率模式（T3）"
      optimize:
        value: [150.0, 260.0]
        days_pool: [Mon, Tue, Wed, Thu, Fri, Sat]
        days_n: [3, 4]

    # T1: 饮食升糖负荷
    - variable: dietary_glycemic_load
      time_start: "00:00"
      time_end: "00:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "饮食升糖负荷"
      optimize:
        value: [60.0, 130.0]

    # T4: 低GI→地中海饮食切换时机
    - variable: dietary_glycemic_load
      time_start: "00:00"
      time_end: "00:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "饮食切换时机（T4）"
      optimize:
        value: [95.0, 120.0]
        date_range: [["2026-02-26", "2026-05-01"], ["2026-07-01", "2026-07-01"]]


  algorithm:
    population_size: 100
    n_generations: 200
    seed: 19

  results:
    generated_at: "2026-05-26"
    method: nsga2
    n_solutions: 8
    elapsed_seconds: 512.6
    pareto_front:
      - {x: [165.0, 210.0, 1, 210.0, 0, 68.0, 100.0, 12], f: [5.8, 1.62]}
      - {x: [240.0, 225.0, 2, 195.0, 0, 78.0, 95.0, 20], f: [6.8, 1.78]}
      - {x: [310.0, 240.0, 5, 185.0, 1, 88.0, 90.0, 28], f: [7.8, 1.95]}
      - {x: [380.0, 255.0, 6, 178.0, 1, 98.0, 88.0, 38], f: [8.8, 2.12]}
      - {x: [440.0, 270.0, 8, 170.0, 2, 108.0, 85.0, 48], f: [9.8, 2.28]}
      - {x: [500.0, 280.0, 10, 165.0, 2, 118.0, 82.0, 58], f: [11.0, 2.48]}
      - {x: [560.0, 290.0, 12, 162.0, 2, 130.0, 80.0, 68], f: [12.2, 2.72]}
      - {x: [600.0, 298.0, 14, 158.0, 2, 148.0, 78.0, 85], f: [13.5, 3.18]}
    reference:
      x: [380.0, 255.0, 6, 178.0, 1, 98.0, 88.0, 38]
      f: [8.8, 2.12]
      regimen:
        caloric_deficit:
          "每日热量缺口（分岔控制参数）": 380.0
        exercise_met_min:
          "有氧运动量与时机（T2 IHIO 时间维度）": 255.0
          "运动频率模式（T3）": 178.0
        dietary_glycemic_load:
          "饮食升糖负荷": 98.0
      objectives:
        liver_fat: 8.8
        HOMA_IR: 2.12

simulation:
  start_date: "2026-01-01"
  end_date: "2026-07-01"
  output_variables:
    - liver_fat
    - ALT
    - HOMA_IR
    - blood_glucose
    - body_weight
    - exercise_met_min
    - dietary_glycemic_load
    - lm_score
  mc:
    runs: 20
    seed: 19
    description: "MC 验证分岔结论稳健性（alpha_exercise_fat, gamma_IR_liverfat 个体差异）"
  plans:
    - id: "fast_loss"
      label: "快速减重方案（~0.45 kg/w，分岔右侧）"
      schedules:
        - {variable: caloric_deficit, time: "00:00", value: 550.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-07-01"], label: "较大热量缺口"}
        - {variable: exercise_met_min, time: "16:00", value: 250.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-07-01"], label: "餐后有氧（每天）"}
        - {variable: dietary_glycemic_load, time: "00:00", value: 110.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-07-01"], label: "地中海饮食"}

    - id: "gentle_loss"
      label: "温和减重方案（~0.25 kg/w，分岔左侧，IHIO最优区间）"
      schedules:
        - {variable: caloric_deficit, time: "00:00", value: 270.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-07-01"], label: "温和热量缺口"}
        - {variable: exercise_met_min, time: "07:00", value: 210.0, days: [Mon, Wed, Fri], date_range: ["2026-01-01", "2026-03-27"], label: "强化期空腹有氧"}
        - {variable: dietary_glycemic_load, time: "00:00", value: 70.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-03-27"], label: "低GI强化期"}
        - {variable: exercise_met_min, time: "07:00", value: 180.0, days: [Mon, Wed, Fri], date_range: ["2026-03-28", "2026-07-01"], label: "维持期有氧"}
        - {variable: dietary_glycemic_load, time: "00:00", value: 100.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-03-28", "2026-07-01"], label: "维持期地中海饮食"}

    - id: "k4_balanced"
      label: "K×4 平衡参考点（待运行更新）"
      schedules:
        - {variable: caloric_deficit, time: "00:00", value: 350.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-07-01"], label: "热量缺口"}
        - {variable: exercise_met_min, time: "07:00", value: 210.0, days: [Mon, Wed, Fri], date_range: ["2026-01-01", "2026-07-01"], label: "空腹有氧"}
        - {variable: dietary_glycemic_load, time: "00:00", value: 75.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-07-01"], label: "低GI饮食"}
