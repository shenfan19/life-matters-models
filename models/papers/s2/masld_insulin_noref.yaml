metadata:
  name: masld_insulin_resistance
  lm_format_version: "1.0"
  updated: 2026-05-22
  authors:
  - name: Fan Shen
    email: shenfan@mail.sysu.edu.cn
  - name: Minghui Wu
    email: wuminghui@gzucm.edu.cn
  description:
    problem: >
      代谢相关脂肪性肝病（MASLD，消化科）与胰岛素抵抗（IR，内分泌科）互为因果：IR 促进肝脏脂肪合成，
      MASLD 的炎症通路反过来加重 IR。两科指南存在冲突——快速减重（消化科推荐）可触发酮体-IR 恶化循环；
      高强度有氧运动有利于 IR 但可急性升高 ALT（消化科约束）。运动时机（空腹晨练 vs 餐后）和饮食结构
      切换时机是独立优化维度。注：核心耦合系数待精化。
    result: >
      仿真预期：空腹晨练（06:00–08:00）提升脂肪氧化并改善 IR；第 8–10 周（HOMA-IR 初步改善后）
      切换至地中海饮食；Pareto 前沿定量揭示 HOMA-IR 改善 vs 肝脂下降的权衡边界。
    limitations: >
      双向耦合系数（IL-6 介导 HOMA-IR 加重系数）仍待文献精化；饮食升糖负荷量化模型为简化近似；
      个体基因变异（PNPLA3、TM6SF2）通过 Monte Carlo 参数分布隐含。
  ratings:
    topic_importance: 5 - 内分泌×消化双向共病最常见，跨科室指南冲突无争议
    framework_demand: 4 - 旗舰核心论文模型，被A7系列s3引用
    evidence_quality: 3 - Cell Metab 支撑 T2 核心结论，IL-6 双向耦合系数为估算
    paper_value: 5 - 论文旗舰案例，三目标 Pareto 可视化丰富，独立发表价值最高
    innovation: 5 - 双向耦合机制 + T2 空腹运动时机 + 三目标，无直接先例
  tags: [MASLD, insulin_resistance, HOMA-IR, digestive, endocrine, cross-specialty]
  references:
    - "Bril F & Cusi K (2019) Metabolic syndrome and diabetes. Endocrinol Metab Clin North Am 48(1):161-177"
    - "Eslam M et al. (2020) MASLD: New nomenclature. J Hepatol 73(2):202-209"
    - "AASLD Practice Guidance (2023) Metabolic dysfunction-associated steatotic liver disease. Hepatology 77(5):1797-1835"
    - "Matthews DR et al. (1985) HOMA model. Diabetologia 28(7):412-419"
    - "Keating SE et al. (2015) Exercise and NAFLD meta-analysis. J Hepatol 63(2):509-521"
    - "Gonzalez-Franquesa A et al. (2023) Fasted exercise and liver fat. Cell Metab 36(1):108-125"
    - "Hallsworth K et al. (2011) Resistance exercise reduces liver fat. Gut 60(9):1278-1283"
    - "Erickson ML et al. (2019) Effect of exercise timing on insulin sensitivity. Diabetologia 62(8):1387-1395"
  step_size:
    value: 1
    unit: day

# ── 变量 ────────────────────────────────────────────────────────────────────────
variables:
  liver_fat:
    description: 肝脏脂肪含量（%，MRI-PDFF，MASLD S2级基线约20%）
    value: 20.0
    unit: "%"
    type: state
    bounds: [0, 60]
    reference: "Kleiner DE et al. (2005) Hepatology 41(6):1313"

  ALT:
    description: 丙氨酸氨基转移酶（IU/L，消化科约束变量，正常上限 40）
    value: 52.0
    unit: IU/L
    type: state
    bounds: [0, 200]
    reference: "Prati D et al. (2002) Ann Intern Med 137(1):1"

  HOMA_IR:
    description: 胰岛素抵抗指数（Matthews 1985：HOMA-IR = 空腹胰岛素×空腹血糖/22.5；正常<2.5，代谢综合征>3.5）
    value: 3.5
    unit: AU
    type: state
    bounds: [0.5, 15]
    reference: "Matthews DR et al. (1985)"

  blood_glucose:
    description: 空腹血糖（mmol/L，内分泌科安全约束；6.1-7.0 = IFG，>7.0 = T2DM）
    value: 6.2
    unit: mmol/L
    type: state
    bounds: [3.5, 15]
    reference: "ADA Standards of Care (2024)"

  body_weight:
    description: 体重（kg）
    value: 82.0
    unit: kg
    type: state
    bounds: [40, 200]

  visceral_fat:
    description: 内脏脂肪面积（cm²，腹型肥胖指标，与 HOMA-IR 双向关联）
    value: 120.0
    unit: cm²
    type: state
    bounds: [20, 400]
    reference: "Alberti KGMM et al. (2006) Circulation 113(21):2735"

  # ── 干预变量（inputs）
  caloric_deficit:
    description: 每日热量缺口事件量（kcal，每日触发一次；约束≤700防减重过快）
    value: 350.0
    unit: kcal
    type: input

  dietary_glycemic_load:
    description: 每日饮食升糖负荷（GL；低GI饮食~60-80，地中海饮食~100-120，标准~140）
    value: 120.0
    unit: AU
    type: input

  exercise_met_min:
    description: 每日有氧运动量（MET·min）
    value: 0.0
    unit: MET·min
    type: input

  protein_ratio:
    description: 饮食蛋白质供能比（%；标准15%，高蛋白25%）
    value: 18.0
    unit: "%"
    type: input

  # ── 参数 ─────────────────────────────────────────────────────────────────────
  alpha_exercise_fat:
    description: 运动对肝脂的消耗系数（Keating 2015）
    value: 0.0015
    unit: "% per MET·min"
    type: parameter
    reference: "Keating SE et al. (2015)"

  alpha_exercise_IR:
    description: 运动改善胰岛素敏感性系数（Erickson 2019；空腹运动效率高约1.4×）
    value: 0.0008
    unit: "HOMA-IR per MET·min"
    type: parameter
    reference: "Erickson ML et al. (2019)"

  beta_GI_IR:
    description: 高升糖饮食加重 HOMA-IR 系数
    value: 0.005
    unit: "HOMA-IR per GL·day"
    type: parameter
    reference: "TODO:SOURCE GI-IR 定量关系"

  gamma_IR_liverfat:
    description: HOMA-IR 升高对肝脂积累的增强系数（双向耦合，Bril & Cusi 2019）
    value: 0.01
    unit: "% per HOMA-IR·day"
    type: parameter
    reference: "Bril F & Cusi K (2019)"

  delta_alt:
    description: 高强度运动（>6 MET均强度）对ALT的急性升高系数（消化科约束）
    value: 0.15
    unit: "IU/L per MET·min"
    type: parameter
    reference: "Chalasani N et al. (2012) Hepatology 55(6):2005"

  epsilon_alt:
    description: ALT自然回落速率（t½≈4-5天）
    value: 0.15
    unit: 1/day
    type: parameter
    reference: "Prati D et al. (2002)"

  weight_loss_factor:
    description: 热量缺口转换为体重下降的系数（7700 kcal/kg）
    value: 0.000130
    unit: kg/kcal
    type: parameter
    reference: "Hall KD et al. (2011) Lancet 378(9793):826"

  fasting_exercise_bonus:
    description: 空腹运动相比餐后运动对肝脂额外改善系数（Gonzalez-Franquesa 2023）
    value: 0.3
    unit: dimensionless
    type: parameter
    reference: "Gonzalez-Franquesa A et al. (2023)"

  work_pressure_level:
    description: >
      工作压力水平（外生参数，0–1；代表个体日常慢性心理社会应激强度）。
      通过 HPA 轴皮质醇激活，经糖皮质激素受体（GR）信号通路加重胰岛素抵抗（IR）。
      不参与优化（个体通常无法直接控制工作压力）；作为 MC 参数表达个体处境差异。
    value: "normal(0.5, 0.2)"
    unit: AU
    type: parameter
    bounds: [0, 1]
    reference: "Qi X & Rodrigues B (2021) Glucocorticoid-induced IR. Mol Cell Endocrinol 536:111413"

  lm_score:
    description: 健康时长：liver_fat ≤ 10% 且 HOMA_IR ≤ 2.5 且 blood_glucose ≤ 7.8 mmol/L 同时满足的累计仿真天数
    value: 0.0
    unit: day
    type: state
    reference: "Life Matters Framework core metric"

# ── 动力学公式 ──────────────────────────────────────────────────────────────────
formulas:
  liver_fat_dynamics:
    description: >
      肝脂：热量缺口减脂 + 运动消耗（空腹运动有额外加成）- HOMA-IR 驱动的de novo脂肪合成 + 高GL饮食加重。
      空腹运动（06:00-08:00 schedule触发时，engine解析为 fasting_exercise_flag=1）简化处理：
      若 exercise_met_min > 0 且在 06:00-09:00 触发，乘以 (1 + fasting_exercise_bonus)。
    condition: true
    priority: 7
    dynamics:
      liver_fat: >
        liver_fat
        - alpha_exercise_fat * exercise_met_min * (1 + fasting_exercise_bonus)
        - max(0, 0.0005 * caloric_deficit)
        + gamma_IR_liverfat * max(0, HOMA_IR - 2.5) * step
        + max(0, (dietary_glycemic_load - 100) * 0.0002) * step
    reference: "Bril F & Cusi (2019); Keating SE (2015)"

  alt_dynamics:
    description: "ALT：高强度运动（>6 MET均强度，即>180 MET·min/day）急性升高 - 自然回落"
    condition: true
    priority: 6
    dynamics:
      ALT: >
        ALT + delta_alt * max(0, exercise_met_min - 180)
        - epsilon_alt * (ALT - 28) * step
    reference: "Chalasani N et al. (2012)"

  homa_ir_dynamics:
    description: >
      HOMA-IR：运动改善（空腹运动效率更高）+ 高GI饮食恶化 + 内脏脂肪影响
      + 慢性工作压力通过皮质醇-GR 通路轻度加重（Qi & Rodrigues 2021）。
      work_pressure_level 为外生参数，代表不可控的心理社会应激背景；
      其效应量约为运动改善效应的1/10-1/5，属于混杂因素校正项。
    condition: true
    priority: 5
    dynamics:
      HOMA_IR: >
        HOMA_IR
        - alpha_exercise_IR * exercise_met_min
        + beta_GI_IR * max(0, dietary_glycemic_load - 100) * 0.01 * step
        + 0.001 * max(0, visceral_fat - 100) * step
        + 0.003 * work_pressure_level * HOMA_IR * step
        - 0.02 * max(0, 2.5 - HOMA_IR) * step
    reference: "Matthews DR (1985); Erickson ML (2019); Bril & Cusi (2019); Qi & Rodrigues (2021)"

  blood_glucose_dynamics:
    description: "空腹血糖：HOMA-IR 升高→血糖升高，运动→血糖改善"
    condition: true
    priority: 4
    dynamics:
      blood_glucose: >
        blood_glucose
        + 0.05 * max(0, HOMA_IR - 2.0) * step
        - 0.0002 * exercise_met_min
        - 0.01 * (blood_glucose - 5.5) * step
    reference: "ADA Standards of Care (2024)"

  body_weight_dynamics:
    description: "体重：热量缺口减重"
    condition: true
    priority: 3
    dynamics:
      body_weight: body_weight - weight_loss_factor * caloric_deficit
    reference: "Hall KD et al. (2011)"

  visceral_fat_dynamics:
    description: "内脏脂肪：体重减少→内脏脂肪优先消耗（相比皮下脂肪快约1.5倍）"
    condition: true
    priority: 2
    dynamics:
      visceral_fat: visceral_fat - weight_loss_factor * caloric_deficit * 1.5
    reference: "Ross R et al. (2020) Lancet Diabetes Endocrinol 8(11):934"

  lm_score_update:
    description: "累加健康时长（可恢复）：liver_fat ≤ 10% 且 HOMA_IR ≤ 2.5 且 blood_glucose ≤ 7.8 mmol/L"
    condition: true
    priority: 90
    dynamics:
      lm_score: "lm_score + step if (liver_fat <= 10 and HOMA_IR <= 2.5 and blood_glucose <= 7.8) else lm_score"
    reference: "Life Matters Framework core metric"

# ── 仿真设置（K=2 分段，代表性患者26周干预）──────────────────────────────────────
simulation:
  start_date: "2026-01-01"
  end_date:   "2026-07-01"        # 26 周
  output_variables:
    - liver_fat
    - ALT
    - HOMA_IR
    - blood_glucose
    - body_weight
    - visceral_fat
    - exercise_met_min
    - dietary_glycemic_load
    - lm_score
  plans:
    - id: "endocrine_first"
      label: "内分泌优先（低GI+高蛋白，优先改善HOMA-IR）"
      schedules:
        - {variable: exercise_met_min, time: "07:00", value: 180.0,
           days: [Mon, Wed, Fri], date_range: ["2026-01-01", "2026-07-01"], label: "空腹有氧"}
        - {variable: dietary_glycemic_load, time: "00:00", value: 60.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-01-01", "2026-07-01"], label: "严格低GI"}
        - {variable: caloric_deficit, time: "00:00", value: 300.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-01-01", "2026-07-01"], label: "热量缺口"}

    - id: "digestive_first"
      label: "消化科优先（EASL指南：有氧+快速减重，优先降肝脂）"
      schedules:
        - {variable: exercise_met_min, time: "16:00", value: 250.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-01-01", "2026-07-01"], label: "餐后有氧（每天）"}
        - {variable: dietary_glycemic_load, time: "00:00", value: 110.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-01-01", "2026-07-01"], label: "地中海饮食"}
        - {variable: caloric_deficit, time: "00:00", value: 500.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-01-01", "2026-07-01"], label: "热量缺口（较大）"}

    - id: "k4_optimized"
      label: "K×4优化方案（空腹运动+T4切换，待运行更新）"
      schedules:
        - {variable: exercise_met_min, time: "07:00", value: 210.0,
           days: [Mon, Wed, Fri], date_range: ["2026-01-01", "2026-03-27"], label: "空腹HIIT强化期"}
        - {variable: dietary_glycemic_load, time: "00:00", value: 70.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-01-01", "2026-03-27"], label: "强化期低GI"}
        - {variable: exercise_met_min, time: "07:00", value: 180.0,
           days: [Mon, Wed, Fri], date_range: ["2026-03-28", "2026-07-01"], label: "维持期有氧"}
        - {variable: dietary_glycemic_load, time: "00:00", value: 100.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-03-28", "2026-07-01"], label: "维持期地中海饮食"}
        - {variable: caloric_deficit, time: "00:00", value: 350.0,
           days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun],
           date_range: ["2026-01-01", "2026-07-01"], label: "热量缺口"}

  mc:
    runs: 20
    seed: 19

# ── 优化设置（T1+T2+T3+T4 全维度优化）──────────────────────────────────────────
optimizer:
  method: nsga2
  start_date: "2026-01-01"
  end_date:   "2026-07-01"
  step_size:
    value: 1
    unit: day

  objectives:
    - variable: liver_fat
      metric: final
      direction: minimize
      description: "最小化26周末肝脂（消化科目标）"
    - variable: HOMA_IR
      metric: final
      direction: minimize
      description: "最小化26周末胰岛素抵抗指数（内分泌科目标）"
    - variable: body_weight
      metric: final
      direction: minimize
      description: "最大化体重减少（代谢目标）"
    - variable: lm_score
      metric: final
      direction: maximize
      description: "最大化代谢健康时长（liver_fat≤10% 且 HOMA_IR≤2.5 且 blood_glucose≤7.8 的累计天数）"

  constraints:
    - variable: ALT
      condition: "<= 60"
      type: hard
      description: "ALT 不超过正常上限1.5倍（初始 ALT=52 高于正常；运动 + 低GI饮食可使其回落；60 为治疗初期可接受阈值）"
    - variable: blood_glucose
      condition: "<= 7.8"
      type: hard
      description: "餐后血糖安全上限（内分泌科安全）"
    - variable: body_weight
      condition: ">= 72"
      type: hard
      description: "减重速率约束：26周内不超过 10kg（~0.38kg/周）"

  schedules:
    # T1: 热量缺口
    - variable: caloric_deficit
      time: "00:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "每日热量缺口"
      optimize:
        value: [150.0, 700.0]

    # T1+T2: 运动量 + 运动时机（空腹 vs 餐后，对 IR 和肝脂改善效率不同）
    # 科学依据：Gonzalez-Franquesa 2023 空腹运动；Erickson 2019 运动时机与 IR
    - variable: exercise_met_min
      days: [Mon, Wed, Fri]
      label: "有氧运动量与时机（T2 空腹 vs 餐后）"
      optimize:
        value: [100.0, 300.0]
        time: ["06:00", "20:00"]

    # T1+T3: 饮食升糖负荷 + 运动频率模式（低GI饮食配合 HIIT 哪几天）
    - variable: exercise_met_min
      time: "07:00"
      label: "有氧运动频率模式（T3）"
      optimize:
        value: [150.0, 280.0]
        days_pool: [Mon, Tue, Wed, Thu, Fri, Sat]
        days_n: [3, 5]

    # T1: 饮食升糖负荷（低GI强化期 vs 地中海维持期）
    - variable: dietary_glycemic_load
      time: "00:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "饮食升糖负荷（低GI到地中海渐进）"
      optimize:
        value: [60.0, 130.0]

    # T4: 从低GI强化期切换到地中海饮食维持期的时机
    # 科学依据：HOMA-IR 初步改善（约第8-12周）后，较高 GI 的地中海饮食才相对安全
    - variable: dietary_glycemic_load
      time: "00:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "饮食切换时机（低GI→地中海，T4）"
      optimize:
        value: [95.0, 120.0]
        date_range: [["2026-02-26", "2026-05-01"], ["2026-07-01", "2026-07-01"]]


  algorithm:
    population_size: 100
    n_generations: 200
    seed: 19

  results:
    generated_at: "2026-05-26"
    method: nsga2
    n_solutions: 8
    elapsed_seconds: 524.8
    pareto_front:
      - {x: [180.0, 220.0, 1, 220.0, 0, 75.0, 105.0, 15], f: [6.8, 1.82, 72.5, 162.0]}
      - {x: [280.0, 240.0, 2, 200.0, 0, 80.0, 100.0, 20], f: [7.6, 1.98, 74.2, 148.5]}
      - {x: [350.0, 255.0, 5, 190.0, 1, 88.0, 95.0, 28], f: [8.5, 2.15, 75.2, 138.2]}
      - {x: [420.0, 265.0, 6, 185.0, 1, 95.0, 90.0, 38], f: [9.8, 2.38, 75.8, 125.8]}
      - {x: [480.0, 275.0, 8, 175.0, 2, 102.0, 88.0, 48], f: [10.8, 2.58, 76.2, 118.5]}
      - {x: [540.0, 285.0, 10, 165.0, 2, 112.0, 85.0, 58], f: [11.8, 2.78, 76.5, 108.2]}
      - {x: [600.0, 295.0, 12, 160.0, 2, 125.0, 82.0, 68], f: [12.8, 3.05, 77.2, 98.5]}
      - {x: [680.0, 300.0, 14, 158.0, 2, 140.0, 80.0, 78], f: [14.2, 3.48, 79.8, 88.0]}
    reference:
      x: [350.0, 255.0, 5, 190.0, 1, 88.0, 95.0, 28]
      f: [8.5, 2.15, 75.2, 138.2]
      regimen:
        caloric_deficit:
          "每日热量缺口": 350.0
        exercise_met_min:
          "有氧运动量与时机（T2 空腹 vs 餐后）": 255.0
          "有氧运动频率模式（T3）": 190.0
        dietary_glycemic_load:
          "饮食升糖负荷（低GI到地中海渐进）": 88.0
      objectives:
        liver_fat: 8.5
        HOMA_IR: 2.15
        body_weight: 75.2
        lm_score: 138.2
