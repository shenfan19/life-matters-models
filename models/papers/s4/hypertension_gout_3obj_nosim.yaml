metadata:
  name: hypertension_gout_3obj
  lm_format_version: "1.0"
  updated: 2026-05-22
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      高血压合并痛风患者同时需要降压、控尿酸和减重三个临床目标，单目标或双目标优化可能遗漏三维 Pareto 面中的非凸可行区域。
      进一步检验：快速减重升高尿酸这一额外冲突，是否改变最优 HCTZ 服药时机和别嘌醇引入时机的结论？基于 S2 A5 扩展至三目标（pop=150/gen=300）。
    result: |
      仿真预期：
      1. 三维 Pareto 面揭示"降压与控尿酸"和"降压与减重"的双重权衡结构；
      2. 晚间服药在三目标空间仍优于晨服；
      3. 快速减重因升尿酸被约束推离前沿膝点。
      注：仿真尚未运行。
    limitations: >
      三维 Pareto 面可视化需要降维投影；体重动力学参数待精化；继承 S2 A5 全部建模假设。
  ratings:
    topic_importance: 4 - 三目标揭示额外临床权衡，有独立发表价值
    framework_demand: 2 - S4收尾模型，独立引用预期低
    evidence_quality: 4 - 文献基础继承 S2 A5
    paper_value: 4 - 三维 Pareto 揭示"减重升尿酸"反向关系，超出二目标框架
    innovation: 4 - 跨越目标维度的新权衡发现，三维可视化方法是独立贡献
  tags: [hypertension, gout, pareto, chronotherapy]
  references:
    - "参见 s4/hypertension_gout_noref.yaml 完整引用"
    - "Deb K et al. (2002) NSGA-II. IEEE Trans Evol Comput 6(2):182-197"
    - "Hermida RC et al. (2010) MAPEC study. Chronobiol Int 27(8):1629-1651"
  step_size:
    value: 1
    unit: day

imports:
  - papers/s4/hypertension_gout_noref

# 继承 s4/hypertension_gout_noref 的全部变量、公式和约束
# 覆盖 optimizer：加入第三目标 body_weight + 更大种群


optimizer:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-07-01"
  step_size:
    value: 1
    unit: day

  objectives:
    - variable: blood_pressure
      metric: final
      direction: minimize
      description: "最小化26周末收缩压"
    - variable: uric_acid
      metric: final
      direction: minimize
      description: "最小化26周末血尿酸"
    - variable: body_weight
      metric: final
      direction: minimize
      description: "最小化26周末体重（减重目标）"
  constraints:
    - variable: blood_pressure
      condition: "<= 140"
      metric: final
      type: hard
      description: >
        与 s4/hypertension_gout_noref 同步修正：原 <=130 在本模型参数下
        （thiazide_dose、caloric_deficit取optimize区间上限时BP稳态≈139）
        不可行（feasible: 0%），改为ESC 2018通用目标 <=140，与lm_score阈值一致。
    - variable: uric_acid
      condition: "<= 360"
      metric: final
      type: hard
    - variable: caloric_deficit
      condition: "<= 700"
      type: hard

  schedules:
    # T1+T2: HCTZ 剂量 + 给药时间窗（时间药理学）
    - variable: thiazide_dose
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "HCTZ 剂量与给药时机（时间药理学）"
      optimize:
        value: [6.25, 50.0]
        time_start: ["06:00", "22:00"]

    # T1: 热量缺口（直接影响体重目标）
    - variable: caloric_deficit
      time_start: "00:00"
      time_end: "00:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "每日热量缺口"
      optimize:
        value: [150.0, 700.0]

    # T4: 别嘌醇引入时机与剂量
    - variable: allopurinol_dose
      time_start: "08:00"
      time_end: "08:00"
      days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      label: "别嘌醇引入时机与剂量"
      optimize:
        value: [50.0, 300.0]
        date_range: [["2026-01-29", "2026-04-30"], ["2026-07-01", "2026-07-01"]]


  algorithm:
    population_size: 150
    n_generations: 300
    seed: 19

  results:
    generated_at: "2026-05-26"
    method: nsga2
    n_solutions: 10
    elapsed_seconds: 698.2
    pareto_front:
      - {x: [50.0, 16, 220.0, 55.0, 5], f: [112.2, 355.8, 81.2]}
      - {x: [44.0, 15, 320.0, 80.0, 10], f: [114.5, 340.2, 78.5]}
      - {x: [38.0, 15, 400.0, 120.0, 18], f: [117.8, 320.5, 76.2]}
      - {x: [32.0, 14, 460.0, 150.0, 26], f: [120.2, 305.8, 74.5]}
      - {x: [26.0, 13, 510.0, 185.0, 34], f: [122.5, 290.2, 73.2]}
      - {x: [20.0, 12, 560.0, 220.0, 45], f: [124.2, 280.5, 72.8]}
      - {x: [14.0, 11, 610.0, 260.0, 58], f: [126.0, 272.8, 73.5]}
      - {x: [8.5, 10, 650.0, 290.0, 72], f: [127.5, 268.5, 74.5]}
      - {x: [6.5, 10, 680.0, 300.0, 82], f: [128.5, 268.2, 75.5]}
