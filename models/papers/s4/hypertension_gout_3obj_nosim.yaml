      regimen:
        thiazide_dose:
          "HCTZ 剂量与给药时机（时间药理学）": 26.0
        caloric_deficit:
          "每日热量缺口": 510.0
        allopurinol_dose:
          "别嘌醇引入时机与剂量": 185.0
