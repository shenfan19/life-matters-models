metadata:
  name: aircrew_circadian
  lm_format_version: "1.0"
  updated: 2026-08-24
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  log:
    "2026-08-24_00-00-00":
      change: "Renamed variable post_return_duty_fatigue to circadian_misalignment_proxy, including the equations and output_variables that depend on it; added Kronauer, Forger & Jewett (2000), Serkh & Forger (2014), and Yildiz, Gzara & Elhedhli (2017) to references, three citations previously verified only on the paper side and not yet backfilled into the model file"
      reason: "Codex review on 2026-08-22 pointed out that the variable name covered only circadian phase and amplitude, not homeostatic sleep pressure, and that the name 'duty_fatigue' risked being read by reviewers as a complete fatigue-risk model. The three citations were independently verified through web search before being added to the paper, which does not satisfy the letter of the rule that every citation must be traceable to the model file, so they are backfilled here."
    "2026-08-31_00-00-00":
      change: "Changed alpha0 from 0.05 to 0.1, beta_n from 0.0075 to 0.007, and g_gain from 33.75 to 37; the reference/locator for all three moved from Rea et al. (2022) Table 2 to the revised values given after eq.9 in St Hilaire et al. (2007)"
      reason: "A citation-tracing check found that the equation structure was taken from St Hilaire (2007) while the parameter values still followed the older Kronauer values as transcribed by Rea 2022. The user confirmed this was an oversight, and the parameters were switched to the revised values St Hilaire gives directly, so the equation structure and parameter source now match."
  description:
    problem: |
      When aircrew fly long-haul round-trip international routes, crew scheduling departments must trade off between two objectives.
      - A shorter layover reduces the crew's total days away, lowering hotel, per-diem, and aircraft turnaround cost and raising crew and aircraft turnaround efficiency. Airline scheduling literature broadly documents this operational objective, see the references below for the specific contribution of each entry.
      - A shorter layover leaves the crew's endogenous circadian phase less fully resynchronized when they resume duty on the return leg, raising the probability that the return flight falls near the core-body-temperature nadir and raising fatigue-related safety risk.
      This is a genuine bidirectional trade-off: the same decision variable, layover length, moves the two objectives in opposite directions, not a pseudo-conflict that can be optimized to the best of both at once.
      The eastbound-westbound asymmetry is another key structural feature of this problem. Crossing the same number of time zones, eastbound travel is typically harder to recover from than westbound, and this asymmetry should emerge from the circadian pacemaker model's own equations rather than being layered on as an extra empirical coefficient, see the method section below.
    method: |
      The core mechanism is the Forger-Jewett-Kronauer, FJK, circadian pacemaker's third-order nonlinear ODE, with three state variables, x, an approximation of the core body temperature rhythm, xc, a complementary oscillator component, and n, photoreceptor or light-adaptation state.
      - Process P, the x and xc dynamics, is a limit-cycle oscillator structure taken from the revised version in Jewett, Forger & Kronauer (1999).
      - Process L, the light-drive computation chain for alpha, n, and B, converts light stimulus into the drive B that enters the pacemaker, taken from the full light-drive equation set reported in St Hilaire et al. (2007).
      - The standard parameter set draws on two sources. mu, q, k, the light-response exponent, and I0 are transcribed from Table 2 of Rea et al. (2022), which compiles the calibrated version from Kronauer et al. (2000); the original literature for Kronauer et al. (2000) could not be directly verified, so this citation entry is marked in references as a transcribed source. alpha0, beta_n, and G use the revised values given after eq.9 in St Hilaire et al. (2007), sharing the same source as the Process L equation structure adopted in this file. tau_x uses the 24.2-hour mean intrinsic period for healthy adults reported by Czeisler et al. (1999), consistent in magnitude with the previous parameter table and serving as an independent cross-check.
      The eastbound-westbound asymmetry is not an added mechanism. The model defines the simulation clock itself as destination local time, t=0 being the moment of arrival at the destination; tz_shift_hours is positive for eastbound and negative for westbound. The only source of asymmetry is the inherent bias toward phase delay that tau_x, about 24.2 hours, slightly longer than 24 hours, produces in the x and xc equations under free-running conditions. The delay direction matches the adjustment westbound travel needs, while eastbound travel needs the opposite adjustment and so runs slower. This structural source is consistent in direction with the eastbound-harder-to-recover phenomenon reported in the clinical literature, Sack (2010).
      Two decision variables:
      - layover_days, continuous, days: the number of layover days, directly controlling the moment the simulation clock switches from destination local time back to origin local time, t = layover_days times 24 hours.
      - light_pulse_center_hour, continuous, destination local clock hour: the destination local-clock time each day during the layover at which the crew actively seeks high-intensity light, whether via a light-therapy device or deliberately arranged outdoor exposure, feeding directly into the Process L light-drive equations. This is not an externally supplied phase-response curve lookup, but a direct application of the nonlinear phase-response capability already built into the FJK model itself.
      Light-pulse intensity, light_pulse_lux, and the light-therapy window width, pulse_halfwidth_hours, are held fixed as parameters rather than decision variables in this file, keeping the search space limited to the two decision dimensions the candidate list names explicitly, layover days and light-exposure timing.
      Boundary with sleep_schedule.yaml: sleep_schedule.yaml covers the homeostatic sleep pressure, the S process, and bedtime timing of the Borbély two-process model, focused on the single-time-zone question of how long and when to sleep. This model does not model homeostatic sleep pressure at all, covering only the phase dynamics of the circadian pacemaker, the C process or FJK model, focused on the separate question of how long phase realignment takes after crossing time zones. The two models could in principle be coupled through imports in the future, but this file does not take that step, to avoid inflating the decision-variable dimensionality and over-constraining the search.
    result: |
      - `--sim` runs all 6 plans cleanly, 8 days, step_size = 15 minutes, 768 steps per plan. x oscillates stably with a period of about 24 hours, amplitude about [-1.14, 1.07]; xc amplitude is about [-1.32, 1.04], both consistent with the near-unity amplitude expected of the FJK limit-cycle design.
      - The eastbound-westbound asymmetry is confirmed: under the same 1.5-day short layover, westbound, tz_shift = -8, gives circadian_misalignment_proxy = 0.878, and eastbound, tz_shift = +8, gives 1.000, saturating at the ceiling; westbound outperforms eastbound, matching the direction Sack (2010) reports for westbound being easier to recover from. This asymmetry comes entirely from the structural parameter tau_x, about 24.2 hours, with no added directional coefficient.
      - The effect of layover_days on circadian_misalignment_proxy was confirmed during diagnostic scanning to trend downward overall but not strictly monotonically: 1.0 day = 1.000, 2.0 days = 0.999, 2.5 days = 0.940, 2.6 days = 0.961, 2.8 days = 0.961, 3.0 days = 0.951, 4.0 days = 0.872. The 1.0 to 2.0 day range is already close to the saturation ceiling, and there is a small local rebound in the 2.5 to 3.0 day range; this same set of values was rechecked at a 5-minute step and the fluctuation persists, so it is not a discretization artifact of the 15-minute step, consistent with the note under limitations that circadian_misalignment_proxy conflates phase alignment with instantaneous amplitude.
      - The effect of light_pulse_center_hour on the fatigue proxy runs counter to the original directional prediction: under a 3.0-day layover, moving light exposure to early morning, 08:00, is clearly worse than keeping it at noon, 12:00, fatigue rising from 0.951 to a ceiling of 1.000, and moving it to evening, 18:00, is also worse though by a smaller margin, 0.989, rather than the predicted improvement from moving toward morning. The possible reasons and what this finding means for `--opt` are discussed in limitations, alongside the comparison against the qualitative prediction in aircrew_circadian_opt.yaml.
      - The `--opt` numerical results for this model are in aircrew_circadian_opt.yaml: the front has 100 of 100 solutions non-dominated, with trip_cost_days spanning about 4 days and circadian_misalignment_proxy spanning about 0.42. Isolating the contribution of light_pulse_center_hour at fixed layover_days gives, for layover_days from 1 to 5 days, contributions of 0, 0.009, 0.136, and 0.199 respectively, growing substantially as the layover lengthens, showing that this dimension is not marginal, only that its optimal direction remains afternoon rather than the predicted morning.
    limitations: |
      - The engine's t/time symbol is measured, in practice, against simulation.step_size.unit, minute in this file, globally, and does not follow the step_unit each equation declares for itself; this is inconsistent with the LM_format_1.0.md §3.2 description that t/time is measured in equation.step_unit, a discrepancy between the engine implementation and the specification document discovered empirically through `--sim` output while drafting this file, not a bug in this file itself. Every expression in this file that involves t has been manually converted to minutes accordingly; any other model that uses t or time directly for cross-day or cross-hour comparisons may be subject to the same discrepancy, and it is recommended that this be handled as a separate engine/specification reconciliation task rather than fixed within the scope of this modeling task.
      - circadian_misalignment_proxy, 1 minus the running minimum of alertness_proxy within the 24-hour post-return window, actually measures how far the pacemaker amplitude has contracted toward its natural lower bound within that window, not purely whether phase is aligned with local day and night. The two are entangled while the pacemaker is still transient and has not fully settled onto the limit cycle, and the counterintuitive light-timing result found during diagnostic scanning is plausibly related to this entanglement rather than indicating that the FJK model's phase-response curve itself does not hold. A purer phase-alignment metric would require separately extracting the pacemaker's phase angle, for example atan2(xc, x), and comparing it against a target phase; this file does not implement that, leaving it for future work.
      - light_pulse_center_hour is fixed to a single time of day throughout the layover and does not adjust with the day-by-day phase shift, unlike real chronobiological intervention protocols that adjust light timing day by day; this may be another reason the morning or evening light exposure failed to show the expected effect.
      - The light environment is simplified into two levels, day and night, 500 and 10 lux, with no modeling of overcast conditions or indoor-outdoor variation; the linear mapping alertness_proxy = 0.5 + 0.5 times x and the values for day_lux, night_lux, light_pulse_lux, pulse_halfwidth_hours, and crew_day_overhead_fixed are all engineering calibrations rather than direct literature measurements, each flagged with TODO:SOURCE in its own variable entry.
      - The outbound leg's own time-zone transition is not modeled, the simulation clock starts directly at "arrived at destination" at t=0, nor is homeostatic sleep pressure modeled, the S process, see the boundary note with sleep_schedule.yaml, nor is sleep-debt accumulation across multiple consecutive flight segments; these are mechanisms the candidate list mentions but this file does not incorporate, left for future extension.
      - The true time constant of n, photoreceptor or light-adaptation state, is on the order of about 17 minutes, back-calculated from alpha0 and beta_n, close to the same order of magnitude as this file's 15-minute simulation step, so Euler discretization may not fully resolve this fastest dynamic; the oscillation amplitudes of x and xc remain stable near their expected magnitude, suggesting this coarseness has not caused obvious numerical instability, but a finer step, for example 5 minutes, would be a more robust choice and was not adopted here due to the computational budget available for this session.
  ratings:
    importance: 0.75 - long-haul aircrew fatigue safety is a significant topic in aviation medicine, already incorporated into the FAA and IATA regulatory frameworks; currently modeled independently, sharing the Borbély lineage with sleep_schedule but with non-overlapping mechanisms
    variable: 0.75 - the FJK core parameters draw on two published sources, mu, q, k, the light-response exponent, and I0 transcribed from the calibrated version in Rea 2022, alpha0, beta_n, and G taken from St Hilaire 2007's own revised values, with light-therapy intensity and half-width as engineering calibrations
    equation: 1.0 - the FJK third-order ODE is a widely cited standard form that has been reproduced continuously since 1999
    simulation: 0.75 - the resynchronization timescale independently matches Serkh & Forger, without a full point-by-point data comparison
    optimization: 0.75 - the operational-versus-fatigue trade-off in aircrew scheduling has literature support; after the 2026-08-31 parameter correction, a full-budget search with pop=100/gen=200 found 100 non-dominated solutions with continuous coverage, and the contribution of the light-timing decision dimension grows substantially as layover days increase; the earlier "limited contribution" conclusion has been revised, see the results in aircrew_circadian_opt.yaml
    innovation: 0.5 - the FJK model itself is not original to this work; coupling it into K by 4 scheduling optimization is the incremental contribution
    confidence: 0.75 - external literature verification on 2026-08-20 found the front's magnitude independently consistent; what was initially thought to be an anomalous finding in light timing, converging at noon rather than the predicted morning, turned out on review to be a genuine independent prediction check passed, since the model was never fitted to clinical recommendations and only after computing its own answer did it turn out to match the clinical light-exposure advice for eastbound jet lag, which alone would justify a full score; the 2026-08-24 full-budget re-run confirmed the earlier reduced-budget front was not an artifact, but the fatigue proxy still lacks a sleep-debt mechanism, an unresolved gap, and the paper accordingly repositions this case from validation to a feasibility demonstration, see c_paper_s1_cn.md §7.1
  tags: [aviation, circadian, jet_lag, FJK, fatigue, time_biology, cross_domain]

# ── Variables ────────────────────────────────────────────────────────────────
variables:
  # ── Process P: circadian pacemaker limit-cycle oscillator states ───────────
  x:
    description: >
      The FJK model's main oscillator variable, approximately tracking the core body temperature rhythm; the limit-cycle design keeps its amplitude stable near 1. The initial value of 1.0 represents the assumed starting condition of the crew departing near their personal daytime or high-alertness phase, not a precisely solved limit-cycle fixed point; over a multi-day simulation it converges on its own to the true limit cycle, with a transient lasting on the order of several days at the start, a known limitation, see limitations.
    value: 1.0
    unit: AU
    type: state
    bounds: [-1.5, 1.5]
    reference: "Jewett ME, Forger DB, Kronauer RE (1999)"
    locator: "eq.4"

  xc:
    description: The FJK model's complementary oscillator variable, jointly determining phase and amplitude together with x.
    value: 0.0
    unit: AU
    type: state
    bounds: [-1.5, 1.5]
    reference: "Jewett ME, Forger DB, Kronauer RE (1999)"
    locator: "eq.5"

  n:
    description: Photoreceptor or light-adaptation state, Process L, in [0,1], with 1 representing full light adaptation.
    value: 0.5
    unit: AU
    type: state
    bounds: [0, 1]
    reference: "St Hilaire MA et al. (2007)"
    locator: "eq.3"

  local_clock_hour:
    description: >
      The local-clock hour, 0 to 24, at the crew's current location as of the current simulation time. While t is below layover_days times 24 hours, this follows destination local time, since the simulation clock itself is destination local time with t=0 at arrival; once t reaches that threshold, the return flight, the reference switches to origin local time, that is (t minus tz_shift_hours) modulo 24. This is the sole time-basis source for the eastbound-westbound asymmetry mechanism, see metadata.description.method.
    value: 0.0
    unit: hour
    type: state
    bounds: [0, 24]
    reference: "Structural definition, not a direct literature value"
    locator: "TODO:LOCATE"

  ambient_light_lux:
    description: >
      The ambient baseline light intensity at the current time, excluding active light therapy, simplified into two levels by local day and night: about 500 lux for daytime indoor ambient light and about 10 lux at night. The specific values are engineering calibrations, not direct literature measurements; the qualitative difference in light level between day and night has broad common-knowledge support, TODO:SOURCE for the specific two-level values.
    value: 500.0
    unit: lux
    type: state
    bounds: [0, 20000]
    reference: "Calibration choice, not a direct literature measurement"
    locator: "TODO:SOURCE"

  total_light_lux:
    description: Ambient baseline light plus any active light-therapy pulse, the direct input to Process L.
    value: 500.0
    unit: lux
    type: state
    bounds: [0, 20000]
    reference: "St Hilaire MA et al. (2007)"
    locator: "TODO:LOCATE"

  alpha_light:
    description: Process L's forward drive rate constant, a nonlinear function of light intensity.
    value: 0.0
    unit: 1/min
    type: state
    bounds: [0, 1]
    reference: "St Hilaire MA et al. (2007)"
    locator: "eq.9"

  b_hat:
    description: Light-drive conversion amount before circadian phase modulation.
    value: 0.0
    unit: AU
    type: state
    bounds: [0, 50]
    reference: "St Hilaire MA et al. (2007)"
    locator: "eq.2"

  b_drive:
    description: The final light-drive amount B entering the Process P equations, after modulation by x and xc.
    value: 0.0
    unit: AU
    type: state
    bounds: [-50, 50]
    reference: "St Hilaire MA et al. (2007)"
    locator: "eq.6"

  alertness_proxy:
    description: >
      An alertness-level proxy, obtained by linearly mapping x, 0.5 + 0.5 times x, so the proxy approaches 1, high alertness, as x nears its limit-cycle peak and approaches 0, low alertness, near the trough, corresponding to the vicinity of the core-body-temperature nadir. This linear mapping is a simplifying assumption of this file, not an output of the FJK paper itself; the FJK model describes only the pacemaker's phase dynamics and does not directly output alertness. The mapping follows the general approach in the biomathematical fatigue-model lineage, such as the Three Process Model and SAFTE, of treating circadian phase as one driving component of alertness, with the specific coefficients being engineering calibrations, TODO:SOURCE.
    value: 0.75
    unit: AU
    type: state
    bounds: [0, 1]
    reference: "Calibration choice, following the general approach of Akerstedt & Folkard (1997) rather than its specific equations"
    locator: "TODO:SOURCE"

  worst_alertness_window:
    description: >
      The running minimum of alertness_proxy within the window of the first duty day after return, the 24 hours starting from landing on the return leg. The running minimum, rather than a single-instant snapshot, is used because x itself oscillates continuously with a period of about 24 hours, and a single-instant snapshot would conflate phase noise unrelated to how well-adapted the crew is, whether the sample happens to land near the day's circadian peak or trough, with the effect this file actually cares about, whether real adaptation has occurred. Diagnostic testing under `--sim` found circadian_misalignment_proxy jumping sharply between 0.002 and 1.0 for the same eastbound direction with only a 0.5-day difference in layover_days, and confirmed this was exactly this sampling artifact rather than a genuine non-monotonic mechanism, with the process recorded under metadata.description.limitations. Taking the minimum within the window corresponds to "the worst moment across the whole duty day," consistent with the practice in aviation biomathematical fatigue models such as SAFTE of reporting the lowest effectiveness value during a duty period, see the background note on Akerstedt & Folkard 1997 in references.
    value: 1.0
    unit: AU
    type: state
    bounds: [0, 1]
    reference: "Structural definition, with the sampling-window design following the general practice of biomathematical fatigue models"
    locator: "TODO:LOCATE"

  circadian_misalignment_proxy:
    description: >
      The fatigue metric for the first duty day after return = 1 minus worst_alertness_window. Once the window closes, worst_alertness_window stops updating, so this value likewise stays fixed; it is this file's safety-side optimization target.
    value: 0.0
    unit: AU
    type: state
    bounds: [0, 1]
    reference: "Structural definition, not a direct literature value"
    locator: "TODO:LOCATE"

  trip_cost_days:
    description: >
      The crew's total days away for this trip, layover days plus the fixed round-trip overhead, serving as a proxy for operational cost and crew turnaround efficiency. crew_day_overhead_fixed is set to 2 days, representing the fixed days consumed by the outbound and return legs themselves; it is an engineering calibration, not data from any specific airline, TODO:SOURCE.
    value: 0.0
    unit: day
    type: state
    bounds: [0, 20]
    reference: "Calibration choice, not a direct literature measurement"
    locator: "TODO:SOURCE"

  # ── Decision and background inputs ──────────────────────────────────────
  layover_days:
    description: >
      The number of layover days, in destination local time. Controls the moment the simulation clock switches from the destination-local-time reference back to the origin-local-time reference, that is, the return departure time = layover_days times 24 hours.
    value: 1.5
    unit: day
    type: input

  light_pulse_center_hour:
    description: >
      The destination local-clock center time each day during the layover at which the crew actively seeks high-intensity light, whether from a light-therapy device or deliberately arranged outdoor exposure; this only takes effect within the days covered by layover_days.
    value: 12.0
    unit: hour
    type: input

  tz_shift_hours:
    description: >
      The time-zone offset crossed on this trip, positive for eastbound and negative for westbound, abstracted to a representative magnitude for a long-haul cross-time-zone segment, about 7 to 9 time zones, not tied to any specific airline or city pair. It is held as a fixed background setting to compare across plans; because the crew has no way to adjust this quantity, it is not treated as a decision variable in optimization.
    value: 8.0
    unit: hour
    type: input

  # ── Parameters: Process P, FJK limit-cycle oscillator ──────────────────────
  mu:
    description: Process P's limit-cycle amplitude-recovery coefficient.
    value: 0.13
    unit: AU
    type: parameter
    reference: "Rea MS et al. (2022) Table 2, transcribed from Kronauer et al. (2000)"
    locator: "Table 2"

  q:
    description: The coupling coefficient in the Process P xc equation.
    value: 0.33
    unit: AU
    type: parameter
    reference: "Rea MS et al. (2022) Table 2, transcribed from Kronauer et al. (2000)"
    locator: "Table 2"

  k:
    description: The coefficient by which light shortens the pacemaker's period.
    value: 0.55
    unit: AU
    type: parameter
    reference: "Rea MS et al. (2022) Table 2, transcribed from Kronauer et al. (2000)"
    locator: "Table 2"

  tau_x:
    description: >
      The intrinsic circadian period, about 24.2 hours on average across healthy adults, slightly longer than 24 hours. This "slightly over 24" is the structural source of this file's eastbound-westbound asymmetry mechanism, see the method section.
    value: 24.2
    unit: hour
    type: parameter
    reference: "Czeisler CA et al. (1999) Science 284(5423):2177-2181"
    locator: "abstract"

  correction_factor:
    description: An empirical correction constant on the period term in the xc equation.
    value: 0.99729
    unit: AU
    type: parameter
    reference: "Jewett ME, Forger DB, Kronauer RE (1999)"
    locator: "eq.9"

  omega_hour:
    description: The angular-frequency coefficient pi/12, converting a 24-hour period into a phase increment per hour.
    value: 0.2617993878
    unit: rad/hour
    type: parameter
    reference: "Definitional constant, pi/12"
    locator: "eq.10, eq.17"

  # ── Parameters: Process L, light drive ─────────────────────────────────────
  alpha0:
    description: The proportionality coefficient in Process L's forward drive rate constant.
    value: 0.1
    unit: 1/min
    type: parameter
    reference: "St Hilaire MA et al. (2007) J Theor Biol 247(4):583-599"
    locator: "revised parameter following eq.9"

  beta_n:
    description: The decay rate constant for the Process L light-adaptation state n.
    value: 0.007
    unit: 1/min
    type: parameter
    reference: "St Hilaire MA et al. (2007) J Theor Biol 247(4):583-599"
    locator: "revised parameter following eq.9"

  g_gain:
    description: Process L's light-drive gain coefficient.
    value: 37.0
    unit: AU
    type: parameter
    reference: "St Hilaire MA et al. (2007) J Theor Biol 247(4):583-599"
    locator: "revised parameter following eq.9"

  light_response_exponent:
    description: >
      The exponent on light intensity in Process L's forward drive rate. Rea et al. (2022) note that Kronauer et al. (1999) originally used 0.6, revised to 0.5 in Kronauer et al. (2000); this file follows the latter.
    value: 0.5
    unit: AU
    type: parameter
    reference: "Rea MS et al. (2022) Table 2, transcribed from Kronauer et al. (2000)"
    locator: "Table 2"

  i0_ref_lux:
    description: Process L's light-intensity normalization reference value.
    value: 9500.0
    unit: lux
    type: parameter
    reference: "Rea MS et al. (2022) Table 2, transcribed from Kronauer et al. (2000)"
    locator: "Table 2"

  # ── Parameters: light environment and operational-cost calibration ─────────
  day_lux:
    description: Simplified ambient baseline light, indoor ambient light level during the day, 06:00-22:00 local time.
    value: 500.0
    unit: lux
    type: parameter
    reference: "Calibration choice, not a direct literature measurement"
    locator: "TODO:SOURCE"

  night_lux:
    description: Simplified ambient baseline light, low light level at night, 22:00-06:00 local time.
    value: 10.0
    unit: lux
    type: parameter
    reference: "Calibration choice, not a direct literature measurement"
    locator: "TODO:SOURCE"

  light_pulse_lux:
    description: >
      Active light-therapy pulse intensity, held fixed as a parameter rather than a decision variable, at a typical light-therapy device magnitude, commonly reported in the literature as roughly 2500 to 10000 lux.
    value: 5000.0
    unit: lux
    type: parameter
    reference: "Calibration choice, taking the median of the typical light-therapy device range, not a single direct literature measurement"
    locator: "TODO:SOURCE"

  pulse_halfwidth_hours:
    description: Half-width of the daily light-therapy window, giving a total window length of about 2 hours.
    value: 1.0
    unit: hour
    type: parameter
    reference: "Calibration choice, not a direct literature measurement"
    locator: "TODO:SOURCE"

  crew_day_overhead_fixed:
    description: The fixed number of days consumed by the outbound and return legs themselves, used to compute trip_cost_days.
    value: 2.0
    unit: day
    type: parameter
    reference: "Calibration choice, not data from any specific airline"
    locator: "TODO:SOURCE"

# ── Equations ─────────────────────────────────────────────────────────────────
equations:
  local_clock_update:
    description: >
      Computes the current local-clock hour. While t is before the return departure time, this follows the destination-local-time reference, that is, t itself modulo 24, since the simulation clock is defined as destination local time from the moment of arrival; after that point it switches to the origin-local-time reference. The engine's t/time symbol is always measured against simulation.step_size.unit, minute in this file, regardless of each equation's own step_unit, so t/60 converts to hours here and layover_days*1440 converts to minutes.
    priority: 21
    condition: true
    dynamics:
      local_clock_hour: "((t/60) % 24) if (t < layover_days * 1440) else (((t/60) - tz_shift_hours) % 24)"
    reference: "Structural definition"
    locator: "TODO:LOCATE"

  ambient_light_update:
    description: Ambient baseline light, simplified into two levels by local day and night.
    priority: 20
    condition: true
    dynamics:
      ambient_light_lux: "day_lux if (local_clock_hour >= 6 and local_clock_hour < 22) else night_lux"
    reference: "Calibration choice"
    locator: "TODO:SOURCE"

  total_light_update:
    description: >
      Ambient baseline light plus any active light-therapy pulse. The light-therapy pulse only takes effect within the days covered by the layover, in a window centered on light_pulse_center_hour, with the distance to the window center computed as the shortest cyclic distance so the window is not incorrectly truncated when it spans midnight.
    priority: 19
    condition: true
    dynamics:
      total_light_lux: >
        ambient_light_lux + (light_pulse_lux if (
        t < layover_days * 1440
        and abs(((t/60 % 24) - light_pulse_center_hour + 12) % 24 - 12) <= pulse_halfwidth_hours
        ) else 0)
    reference: "St Hilaire MA et al. (2007)"
    locator: "TODO:LOCATE"

  process_l_alpha_update:
    description: Process L's forward drive rate constant.
    priority: 18
    condition: true
    dynamics:
      alpha_light: "alpha0 * (total_light_lux / i0_ref_lux) ** light_response_exponent * (total_light_lux / (total_light_lux + 100))"
    reference: "St Hilaire MA et al. (2007)"
    locator: "eq.9"

  process_l_bhat_update:
    description: Light-drive conversion amount, using the previous step's light-adaptation state n.
    priority: 17
    condition: true
    dynamics:
      b_hat: "g_gain * (1 - n) * alpha_light"
    reference: "St Hilaire MA et al. (2007)"
    locator: "eq.2"

  process_l_bdrive_update:
    description: The final light-drive amount B, using the previous step's x and xc for phase modulation.
    priority: 16
    condition: true
    dynamics:
      b_drive: "b_hat * (1 - 0.4 * x) * (1 - 0.4 * xc)"
    reference: "St Hilaire MA et al. (2007)"
    locator: "eq.6"

  process_l_n_dynamics:
    description: The dynamics of the photoreceptor or light-adaptation state n.
    step_unit: hour
    priority: 15
    condition: true
    dynamics:
      n: "n + 60 * (alpha_light * (1 - n) - beta_n * n) * step"
    reference: "St Hilaire MA et al. (2007)"
    locator: "eq.3"

  process_p_x_dynamics:
    description: >
      Process P's main oscillator equation. Reads the current step's xc before it has been updated, since process_p_xc_dynamics has lower priority and executes after this equation.
    step_unit: hour
    priority: 14
    condition: true
    dynamics:
      x: "x + step * omega_hour * (xc + mu * (x/3 + (4/3)*x**3 - (256/105)*x**7) + b_drive)"
    reference: "Jewett ME, Forger DB, Kronauer RE (1999)"
    locator: "eq.10"

  process_p_xc_dynamics:
    description: >
      Process P's complementary equation. This equation executes after process_p_x_dynamics, so it reads the current step's already-updated x, the engine's sequential write semantics, equivalent to a semi-implicit Euler scheme. This discretization order is deliberately chosen for this oscillatory system, since a semi-implicit scheme is generally more stable than pure explicit Euler for oscillatory systems.
    step_unit: hour
    priority: 13
    condition: true
    dynamics:
      xc: "xc + step * omega_hour * (q * b_drive * xc - x * ((24/(correction_factor*tau_x))**2 + k*b_drive))"
    reference: "Jewett ME, Forger DB, Kronauer RE (1999)"
    locator: "eq.17"

  alertness_proxy_update:
    description: The alertness-level proxy, see the variable description.
    priority: 12
    condition: true
    dynamics:
      alertness_proxy: "max(0, min(1, 0.5 + 0.5*x))"
    reference: "Calibration choice"
    locator: "TODO:SOURCE"

  worst_alertness_window_tracking:
    description: >
      Continuously tracks the running minimum of alertness_proxy within the 24-hour window starting at return landing; it does not update outside that window, since the engine skips this equation when the condition is false, so worst_alertness_window automatically holds the value it had when the window closed. t is measured in simulation.step_size.unit, minutes; layover_days*1440 gives the minute count at the return-flight time, and the window width of 1440 minutes equals 24 hours.
    priority: 11
    condition: "t >= (layover_days*1440) and t < (layover_days*1440 + 1440)"
    dynamics:
      worst_alertness_window: "min(worst_alertness_window, alertness_proxy)"
    reference: "Structural definition"
    locator: "TODO:LOCATE"

  circadian_misalignment_proxy_update:
    description: >
      The fatigue metric = 1 minus worst_alertness_window. Once the window closes, worst_alertness_window no longer changes, so this value naturally stays fixed as well, with no separate snapshot or lock logic needed.
    priority: 10.5
    condition: true
    dynamics:
      circadian_misalignment_proxy: "1 - worst_alertness_window"
    reference: "Structural definition"
    locator: "TODO:LOCATE"

  trip_cost_update:
    description: The crew's total days away, a proxy for operational cost and turnaround efficiency.
    priority: 10
    condition: true
    dynamics:
      trip_cost_days: "layover_days + crew_day_overhead_fixed"
    reference: "Calibration choice"
    locator: "TODO:SOURCE"

# ── Simulation settings ────────────────────────────────────────────────────────
simulation:
  step_size:
    value: 15
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-09"
  output_variables:
    - x
    - xc
    - n
    - local_clock_hour
    - total_light_lux
    - alertness_proxy
    - worst_alertness_window
    - circadian_misalignment_proxy
    - trip_cost_days
    - layover_days
    - light_pulse_center_hour
    - tz_shift_hours
  plans:
    - id: "eastbound_short_layover"
      label: "Eastbound, short 1.5-day layover, light timing not optimized (noon)"
      regimens:
        - {variable: layover_days, time_start: "00:00", time_end: "24:00", value: 1.5, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "1.5-day layover"}
        - {variable: tz_shift_hours, time_start: "00:00", time_end: "24:00", value: 8.0, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "Eastbound, 8 time zones"}
        - {variable: light_pulse_center_hour, time_start: "00:00", time_end: "24:00", value: 12.0, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "Light timing: noon (not optimized)"}

    - id: "eastbound_long_layover"
      label: "Eastbound, long 4-day layover, light timing not optimized (noon)"
      regimens:
        - {variable: layover_days, time_start: "00:00", time_end: "24:00", value: 4.0, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "4-day layover"}
        - {variable: tz_shift_hours, time_start: "00:00", time_end: "24:00", value: 8.0, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "Eastbound, 8 time zones"}
        - {variable: light_pulse_center_hour, time_start: "00:00", time_end: "24:00", value: 12.0, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "Light timing: noon (not optimized)"}

    - id: "eastbound_mid_layover"
      label: "Eastbound, moderate 3-day layover, light timing not optimized (noon)"
      regimens:
        - {variable: layover_days, time_start: "00:00", time_end: "24:00", value: 3.0, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "3-day layover"}
        - {variable: tz_shift_hours, time_start: "00:00", time_end: "24:00", value: 8.0, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "Eastbound, 8 time zones"}
        - {variable: light_pulse_center_hour, time_start: "00:00", time_end: "24:00", value: 12.0, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "Light timing: noon (not optimized)"}

    - id: "eastbound_short_layover_optimized_light"
      label: "Eastbound, short 1.5-day layover, light timing moved to early morning (assumed phase-advance window)"
      regimens:
        - {variable: layover_days, time_start: "00:00", time_end: "24:00", value: 1.5, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "1.5-day layover"}
        - {variable: tz_shift_hours, time_start: "00:00", time_end: "24:00", value: 8.0, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "Eastbound, 8 time zones"}
        - {variable: light_pulse_center_hour, time_start: "00:00", time_end: "24:00", value: 8.0, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "Light timing: early morning 08:00 (assumed phase-advance window)"}

    - id: "eastbound_mid_layover_light_morning"
      label: "Eastbound, moderate 3-day layover, light timing moved to early morning (assumed phase-advance window)"
      regimens:
        - {variable: layover_days, time_start: "00:00", time_end: "24:00", value: 3.0, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "3-day layover"}
        - {variable: tz_shift_hours, time_start: "00:00", time_end: "24:00", value: 8.0, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "Eastbound, 8 time zones"}
        - {variable: light_pulse_center_hour, time_start: "00:00", time_end: "24:00", value: 8.0, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "Light timing: early morning 08:00 (assumed phase-advance window)"}

    - id: "westbound_short_layover"
      label: "Westbound, short 1.5-day layover, light timing not optimized (noon), for eastbound-westbound comparison"
      regimens:
        - {variable: layover_days, time_start: "00:00", time_end: "24:00", value: 1.5, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "1.5-day layover"}
        - {variable: tz_shift_hours, time_start: "00:00", time_end: "24:00", value: -8.0, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "Westbound, 8 time zones"}
        - {variable: light_pulse_center_hour, time_start: "00:00", time_end: "24:00", value: 12.0, delivery: level, date_range: ["2026-01-01", "2026-01-09"], label: "Light timing: noon (not optimized)"}

references:
  - citation: "Jewett ME, Forger DB, Kronauer RE (1999) Revised limit cycle oscillator model of human circadian pacemaker. J Biol Rhythms 14(6):493-499. DOI:10.1177/074873049901400608"
    description: "The direct source of the Process P, x and xc, limit-cycle oscillator equation structure."
  - citation: "St Hilaire MA, Klerman EB, Khalsa SBS, Wright KP, Czeisler CA, Kronauer RE (2007) Addition of a non-photic component to a light-based mathematical model of the human circadian pacemaker. J Theor Biol 247(4):583-599"
    description: "The direct source of the Process L, alpha, n, Bhat, B, light-drive chain equations, including the revised form of alpha adopted in this file; alpha0, beta_n, and G are likewise taken from the revised values given after eq.9 in this paper, sharing the source of the equation structure."
  - citation: "Rea MS, Nagare R, Bierman A, Figueiro MG (2022) The circadian stimulus-oscillator model: Improvements to Kronauer's model of the human circadian pacemaker. Front Neurosci 16:965525"
    description: "The transcribed source for mu, q, k, the light-response exponent, and I0 in the standard parameter set, this paper's Table 2 compiling values from Kronauer et al. 2000, whose original article could not be directly verified from this file; alpha0, beta_n, and G instead use the revised values St Hilaire et al. (2007) give directly, no longer taken from this paper's Table 2."
  - citation: "Czeisler CA, Duffy JF, Shanahan TL, et al. (1999) Stability, precision, and near-24-hour period of the human circadian pacemaker. Science 284(5423):2177-2181"
    description: "The independent confirmation source for tau_x, the roughly 24.2-hour mean intrinsic period in healthy adults."
  - citation: "Sack RL (2010) Jet Lag. N Engl J Med 362(5):440-447"
    description: "The clinical-review source for the eastbound-versus-westbound asymmetry in circadian resynchronization rate, about 1 hour per day versus about 1.5 hours per day, used as the external reference for this file's `--sim` eastbound-westbound comparison."
  - citation: "Åkerstedt T, Folkard S (1997) The Three-Process Model of Alertness and its Extension to Performance, Sleep Latency, and Sleep Length. Chronobiol Int 14(2):115-123"
    description: "Background reference for the aviation-fatigue biomathematical-model lineage; this file does not directly adopt its equation forms."
  - citation: "IATA, ICAO, IFALPA (2015) Fatigue Management Guide for Airline Operators, 2nd Edition"
    description: "Jointly published by the International Air Transport Association, the International Civil Aviation Organization, and the International Federation of Air Line Pilots' Associations, not by IATA alone, confirmed on 2026-08-21 against the cover page and the joint foreword. Serves as industry background documenting that airline fatigue-risk-management systems treat scheduling structure, including layover length, as a manageable variable."
  - citation: "Kronauer RE, Forger DB, Jewett ME (2000) Erratum to: Quantifying human circadian pacemaker response to brief, extended, and repeated light stimuli over the photopic range. J Biol Rhythms 15(2):184-186"
    description: "The original calibration source for the mu, q, k, light_response_exponent, and i0_ref_lux portion of the standard parameter set transcribed by Rea et al. (2022) Table 2, an erratum to an earlier 1999 main paper by the same authors, Kronauer, Forger & Jewett (J Biol Rhythms 14(6):501-515). Its existence has been cross-confirmed against the reference lists of Rea et al. (2022) and St Hilaire et al. (2007), whose entries match exactly in title, volume, and page numbers; the specific Table 2 values have been checked directly against rea2022.bib, but the erratum text itself has not yet been obtained. alpha0, beta_n, and g_gain have since switched to the revised values St Hilaire et al. (2007) give directly, no longer relying on this transcribed source."
  - citation: "Serkh K, Forger DB (2014) Optimal schedules of light exposure for rapidly correcting circadian misalignment. PLOS Comput Biol 10(4):e1003523"
    description: "The closest literature using the same FJK circadian pacemaker model for optimal light control, covering only the resynchronization-time axis with no cost axis; one of the external references used to compare this case against the magnitude of existing literature, resynchronization-day scale, see paper §7.3."
  - citation: "Yildiz B, Gzara F, Elhedhli S (2017) Airline crew pairing with fatigue: Modeling and analysis. Transportation Research Part C: Emerging Technologies 74:99-112"
    description: "A representative operations-research work embedding a biomathematical fatigue quantity into the crew-pairing cost objective, with decision variables that are combinatorial, pairing and roster assignment, and no continuous decision variables for layover days or light-exposure timing, nor an embedded FJK pacemaker ODE. Used as an external reference for comparing this case against the magnitude and scope of existing crew-scheduling optimization literature, see paper §7.3."
