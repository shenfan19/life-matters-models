metadata:
  name: aircrew_circadian_opt
  lm_format_version: "1.0"
  description:
    problem: >
      Under an eastbound scenario, tz_shift_hours fixed at +8, the direction where the return leg is harder to recover from and the operational-safety tension is sharpest, see the eastbound-westbound asymmetry check in aircrew_circadian_sim.yaml, this file searches over two decision variables, layover days and light-exposure timing, to make explicit the real trade-off between the operational-cost proxy, trip_cost_days, and the fatigue proxy for the first duty day after return, circadian_misalignment_proxy. The complete physical mechanism is in the imported aircrew_circadian_sim.
    method: >
      The mechanism is identical to aircrew_circadian_sim.yaml, see that file's description.method for the full list. This file narrows the search range of the two decision variables to the region confirmed during that file's `--sim` diagnostic scanning to carry a real gradient without overall saturation: layover_days takes [1,5] days, since the `--sim` diagnostics show worst_alertness_window already saturated in the 1.0 to 1.5-day range while fatigue varies continuously across 2 to 5 days, see this file's log, and light_pulse_center_hour takes [4,22] local-clock hours, excluding the core sleep period.

      Qualitative predictions, made before running `--opt` and not based on any numerical result:
      - The partial derivative of trip_cost_days with respect to layover_days is always +1, since trip_cost_days = layover_days + crew_day_overhead_fixed is a direct linear relationship, and with respect to light_pulse_center_hour is always 0, since that constant expression does not contain this variable.
      - The partial derivative of circadian_misalignment_proxy with respect to layover_days is expected to be negative, since a longer layover lets the FJK pacemaker move closer to the limit-cycle state realigned with the destination or origin rhythm, so the fatigue proxy on the first duty day after return should fall accordingly, with diminishing marginal benefit expected, since convergence toward the limit cycle is an asymptotic process.
      - The partial derivative of circadian_misalignment_proxy with respect to light_pulse_center_hour is expected to be non-monotonic, since the phase-response curve, PRC, intrinsic to the FJK model implies favorable and unfavorable windows for light timing; the prediction is that moving light exposure toward the crew's local early morning, assumed to correspond to the phase-advance window and matching the direction of phase advance eastbound travel requires, should reduce the fatigue proxy.
      - Because layover_days genuinely moves both objectives in opposite directions, positive for cost, negative for fatigue, while light_pulse_center_hour affects only the fatigue objective and not cost, the front is expected to show a continuous curve of rising cost and falling fatigue, with light_pulse_center_hour optimized to a local optimum at each value of layover_days without independently widening the front.

    result: |
      - 100 of 100 solutions are non-dominated and the front is continuous with no single-point degeneration: trip_cost_days runs from 3.0 to 6.99 days, a span of about 4.0 days, and circadian_misalignment_proxy falls from 1.0 to 0.583, a span of about 0.42, with all 99 adjacent pairs strictly non-increasing.
      - Against the qualitative predictions: trip_cost_days being always +1 with respect to layover_days and always 0 with respect to light timing matches exactly, trip_cost_days = layover_days + 2.0 holding for every solution on the front. The prediction that circadian_misalignment_proxy falls as layover_days grows is directionally correct in broad terms but not strictly monotonic, the 1.0 to 2.0 day range sitting near the saturation ceiling and a small local rebound appearing in the 2.5 to 3.0 day range, see the diagnostic scan in aircrew_circadian_sim.yaml, which does not fully match the prediction of steady monotonic asymptotic improvement throughout.
      - After the 2026-08-31 re-search using St Hilaire (2007)'s own revised parameters, alpha0, beta_n, G, the finding that did not match the prediction shifted from "light_pulse_center_hour contributes almost nothing" to "the direction of light_pulse_center_hour still does not match the prediction, but its contribution is much larger than under the old parameters." All 100 solutions converge light_pulse_center_hour to about 13.1 to 14.9 local-clock hours, noon to early afternoon, with none falling in the predicted early-morning phase-advance window, the same directional conclusion as before. But isolating the contribution of light_pulse_center_hour at fixed layover_days, comparing noon, 12:00, against the front's converged value, shows this dimension's contribution growing substantially as layover_days increases: no difference at layover=1.0 day, both saturating at the ceiling, about 0.009 at 2.0 days, about 0.136 at 4.0 days, and about 0.199 at 5.0 days, four points spread across the whole search range and all avoiding the 2.5 to 3.0 day local-fluctuation zone, indicating this is a genuine effect that strengthens with longer layovers, not a fluctuation artifact. The earlier conclusion that "the light_pulse_center_hour dimension has not been validated within the current modeling scope" no longer holds; in long-layover scenarios, light timing is a second decision dimension with substantial contribution, only converging in direction toward afternoon rather than the predicted morning.
      - optimization.results.recommended selects the point on the front closest in operational cost to the non-LM baseline, layover about 3.11 days, light_pulse_center_hour about 14.03, cost=5.11 days, fatigue=0.856; it is not a unique optimum, shown for illustration only.
      - The 2026-08-24 full-budget re-run, pop=100/gen=200, versus the earlier 2026-08-19 run at pop=48/gen=60, kept the qualitative conclusions stable, with the light_pulse_center_hour convergence range shifting slightly right and narrowing from 11.6-13.6 to 12.5-15.0. After the 2026-08-31 parameter correction, the same full-budget re-search shifted the convergence range further right to 13.1-14.9, and the cost/fatigue range moved from 3.00-6.99/0.608-1.000 to 3.00-6.99/0.583-1.000; the complete record is in optimization.results.note.

imports:
  - ./aircrew_circadian_sim

references:
  - citation: "See ./aircrew_circadian_sim.yaml"

optimization:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-01-09"
  step_size:
    value: 15
    unit: minute

  objectives:
    - variable: trip_cost_days
      metric: final
      direction: minimize
      description: "Minimize the crew's total days away, the operational-cost and turnaround-efficiency proxy"
    - variable: circadian_misalignment_proxy
      metric: final
      direction: minimize
      description: "Minimize the fatigue proxy for the first duty day after return, the safety-side objective"

  startpoint:
    regimens:
      - variable: tz_shift_hours
        time_start: "00:00"
        time_end: "24:00"
        value: 8.0
        delivery: level
        label: "Eastbound, 8 time zones (fixed background quantity, not a decision variable)"

      - variable: layover_days
        time_start: "00:00"
        time_end: "24:00"
        label: "Layover days"
        delivery: level
        optimize:
          value: [1.0, 5.0]

      - variable: light_pulse_center_hour
        time_start: "00:00"
        time_end: "24:00"
        label: "Light-exposure timing (local-clock hour)"
        delivery: level
        optimize:
          value: [4.0, 22.0]

  algorithm:
    population_size: 100
    n_generations: 200
    seed: 19

  results:
    generated_at: "2026-08-31"
    method: nsga2
    n_solutions: 100
    elapsed_seconds: 2285
    note: "2026-08-24 full-budget result (pop=100/gen=200): cost range 3.00-6.99, fatigue range 0.608-1.000, light_pulse_center_hour convergence range 12.53-14.98. A 2026-08-31 citation-tracing check found that alpha0, beta_n, and g_gain had been using the older Kronauer values transcribed by Rea 2022 rather than the revised values St Hilaire (2007) gives directly after its eq.9; after switching to the revised values, the same full budget (pop=100/gen=200, seed=19) was re-run: trip_cost_days = layover_days + 2.0 holds exactly across all 100 solutions, matching the old-parameter result; the cost range 3.00-6.99 is unchanged; the fatigue range narrows to 0.583-1.000, better at the lower end than under the old parameters; all 99 adjacent pairs on the front are strictly non-increasing, with zero violations; the light_pulse_center_hour convergence range shifts right from 12.53-14.98 to 13.11-14.89, still hugging noon to early afternoon and staying far from both the search lower bound of 4.0 and the predicted early-morning region, the directional conclusion unchanged. New finding: isolating the contribution of light_pulse_center_hour at fixed layover_days shows it growing substantially as layover_days increases, no difference at 1.0 day, about 0.009 at 2.0 days, about 0.136 at 4.0 days, and about 0.199 at 5.0 days, all four points avoiding the 2.5-3.0 day local-fluctuation zone found in aircrew_circadian_sim.yaml's diagnostic scan; the earlier conclusion under the old parameters that 'light_pulse_center_hour contributes only marginally and this dimension's value is unvalidated' no longer holds, since this dimension carries a substantial contribution in long-layover scenarios."
    pareto_front:
