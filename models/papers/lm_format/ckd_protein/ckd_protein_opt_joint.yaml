metadata:
  name: ckd_protein_opt_joint
  lm_format_version: "1.0"
  updated: 2026-05-22
  description:
    problem: "Joint multidisciplinary optimization of the CKD protein-muscle trade-off: three-meal protein amounts, dinner timing, and the restricted-to-standard switch timing are searched together, with the goal of simultaneously maximizing GFR and muscle_mass, representing a joint nephrology and rehabilitation perspective. The complete physical mechanism and comparison simulations are in the imported ckd_protein_sim, and comparing this file side by side with the single-discipline ckd_protein_opt_renal.yaml and ckd_protein_opt_muscle.yaml is what reveals the trade-off range exposed by joint optimization."
    method: "The mechanism is identical to ckd_protein_sim.yaml, see that file's description.method for the full list; this file places GFR, muscle_mass, and healthy-duration score into the same multi-objective search, showing the trade-off range joint optimization achieves relative to what each single-discipline optimum can reach on its own."
  log:
    "2026-08-05_00-00-00":
      change: "results was trimmed to the final converged result from 2026-08-02, after the adherence dimension was added; earlier repeated rerun records were migrated to history/2026-08-05_ckd_protein_opt_joint.yaml"
      reason: "Implementing ADR 0141, the main file retains only currently valid results."
    "2026-08-23_00-00-00":
      change: "Re-searched after adding the protein_synthesis_saturation ceiling to muscle_dynamics in ckd_protein_sim.yaml, population_size=40/n_generations=10, a session environment limit, same as the 2026-08-02 record; after 10 generations the search found 12 non-dominated solutions, muscle_mass ranging 24.19-27.87 and GFR ranging 41.75-43.02, a non-degenerate front"
      reason: "Same as the 2026-08-23 record in ckd_protein_opt_muscle.yaml: after adding the synthesis saturation ceiling, the previously found front was no longer truly optimal and needed a re-search."
    "2026-09-02_00-00-00":
      change: "results was filled out with the complete pareto_front list, since it had previously stored only the range and a single recommended point, so the Figure 3 plotting script had been re-invoking the optimizer live each time, which exposed that the same seed=19 and the same population_size=40/n_generations=10 configuration did not reproduce the same result. This re-search found 9 non-dominated solutions, muscle_mass ranging 25.89-27.61 and GFR ranging 42.45-43.13, a narrower front than the 12-solution front of 24.19-27.87/41.75-43.02 recorded on 2026-08-23, judged to be a reproducibility issue from environment or dependency-version drift rather than a change in the model mechanism itself; the 9 solutions found this time are the authoritative reproducible result under the current environment. The specific regimen in the recommended field, breakfast, lunch, dinner, and the standard-period addition, has already been written into the opt_optimized plan in ckd_protein_sim.yaml and directly verified by simulation, independent of optimizer reproducibility, so it is kept unchanged; the GFR of 41.49 and muscle mass of 26.20 cited in Table 6 and the main text come from that plan's `--sim` result and are likewise unaffected."
      reason: "The user asked that the plotting script read from archived results rather than re-optimizing live; the archived results lacked a complete pareto_front list, which had to be filled in first to support this change."

imports:
  - ./ckd_protein_sim

# ── Optimization settings (T1+T2+T4 joint optimization, multidisciplinary: GFR + muscle_mass + lm_score) ──────────
optimization:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  step_size:
    value: 1
    unit: hour

  objectives:
    - variable: muscle_mass
      metric: final
      direction: maximize
      description: "Maximize skeletal muscle mass at week 52 (preventing sarcopenia, the rehabilitation perspective)"
    - variable: GFR
      metric: final
      direction: maximize
      description: "Maximize GFR at week 52 (slowing kidney-function decline, the nephrology perspective)"
    - variable: lm_score
      metric: final
      direction: maximize
      description: "Maximize CKD healthy-duration score (cumulative days on which GFR ≥ 30, muscle_mass ≥ 22 kg, and BUN ≤ 20 all hold)"

  constraints:
    - variable: BUN
      condition: "<= 20"
      type: hard
      description: "Blood urea nitrogen constraint: BUN ≤ 20 mg/dL"
    - variable: GFR
      condition: ">= 30"
      type: hard
      description: "GFR lower bound: must not enter CKD stage 4"
    # Removed on 2026-06-20: the dietary_protein>=0.10 constraint was checked by default at every time step
    # across the whole run (no metric field), but dietary_protein is a pulse input that is zero except at
    # meal times, so the constraint was violated at nearly every one of the 8736 steps in the trajectory.
    # This was the second root cause of all three opt scenarios persistently showing 0% feasible (the first
    # was the beta0/mu_d/mu_u unit bug, already fixed). The constraint was also redundant: the three-meal
    # search lower bound of 0.15 (see startpoint) already satisfies its original intent of "at least 0.10
    # per meal," so it was removed outright rather than fixed with a metric setting. See the resolved item
    # in ckd_protein_sim.yaml metadata.todo for details.

  startpoint:
    regimens:
      # T1: breakfast protein amount (fixed at 08:00, optimized quantity)
      - variable: dietary_protein
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Breakfast protein amount"
        optimize:
          value: [0.15, 0.45]

      # T1: lunch protein amount (fixed at 12:00)
      - variable: dietary_protein
        time_start: "12:00"
        time_end: "12:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Lunch protein amount"
        optimize:
          value: [0.15, 0.40]

      # T1+T2: dinner protein amount plus meal-timing window optimization (chrononutrition)
      # Rationale: pre-sleep protein, around 21:00, activates overnight mTOR, improving muscle protein synthesis
      # Kouw 2017, Res 2012: pre-sleep protein intake significantly raises overnight synthesis rate
      - variable: dietary_protein
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Dinner protein amount and meal timing (chrononutrition optimization)"
        optimize:
          value: [0.15, 0.45]
          time_start: ["17:00", "22:00"]

      # T4: restricted-to-standard switch timing (searched within the week 13-39 window)
      # Rationale: raising protein is only safe once GFR has stabilized; raising it too early accelerates GFR damage
      - variable: dietary_protein
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Standard-period start timing (restricted-to-standard switch day)"
        optimize:
          value: [0.27, 0.42]
          date_range: [["2026-04-01", "2026-10-01"], ["2026-12-31", "2026-12-31"]]


  mc:
    runs: 5
    seed: 19

  algorithm:
    population_size: 100
    n_generations: 200
    seed: 19

  results:
    generated_at: "2026-09-02"
    method: nsga2
    population_size: 40
    n_generations: 10
    n_solutions: 9
    pareto_front_range:
