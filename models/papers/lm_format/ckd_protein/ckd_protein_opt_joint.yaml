    recommended:
      status: "The balanced solution on the front closest to both single-discipline optima at once, taking the normalized solution whose worse-off objective completion is maximized"
      x: [0.2835228116433856, 0.29216931782910394, 0.2935959748966051, 2.2789036229032407, 0.2788540442971292, 181.6516510484636]
      f: [27.476432954541036, 42.53959362145301, 364.0000000000258]
    note: "Re-searched after adding the protein-synthesis saturation ceiling, Moore et al. 2015, see the protein_synthesis_saturation entry in ckd_protein_sim.yaml. Decoding recommended: breakfast 0.284 g/kg (08:00), lunch 0.292 g/kg (12:00), dinner 0.294 g/kg (19:17), standard-period addition 0.279 g/kg (starting 08:00 on 2026-07-02, week 27). This front's range cross-confirms against the independent convergence values of the two single-discipline scenarios, ckd_protein_opt_renal.yaml, unchanged since GFR does not depend on the synthesis saturation ceiling, still 43.05, and ckd_protein_opt_muscle.yaml, reconverged to 27.79 after adding the ceiling; the trade-off is real but moderate, and the 12 non-dominated solutions are not degenerate. The old solution's standard-period addition before the ceiling was added, 0.359 g/kg, itself stayed below the new saturation point of 0.40, but the new front's overall intake distribution, after the three-meal totals changed, sits closer beneath this 0.30-0.40 saturation range, with no meal pushed above the saturation point to waste intake. The opt_optimized plan in ckd_protein_sim.yaml has been updated with this decoded result. Earlier repeated rerun records are in history/2026-08-05_ckd_protein_opt_joint.yaml."

