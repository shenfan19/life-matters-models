metadata:
  name: fatty_liver_opt_joint
  lm_format_version: "1.0"
  description:
    problem: "A joint, multi-discipline optimization configuration for fatty-liver exercise periodization, with the baseline activity intensity and the additional training block's volume, frequency, and escalation timing all acting as decision variables, jointly minimizing liver fat and peak fatigue, representing a combined hepatology and sports medicine perspective. See the imported fatty_liver_sim for the complete physical mechanism and the comparison simulation. Comparing this against the single-discipline perspectives fatty_liver_opt_hepatology.yaml and fatty_liver_opt_exercise.yaml is what reveals the tradeoff range a joint optimization exposes."
    method: "The mechanism matches fatty_liver_sim.yaml; see that file's description.method for the complete mechanism list. This file jointly optimizes the baseline activity intensity and the additional training block's volume, frequency, and escalation timing, minimizing both liver fat and peak fatigue at once."
  log:
    "2026-08-05_00-00-00":
      change: "results streamlined to the final converged result from 2026-07-11, removing the confirmed-redundant historical_stale_from_2026-07-10 sub-block (including its nested historical_stale_from_2026-06-15) and its internal task-record pointer; description gains a method field"
      reason: "Implements ADR 0141: the main file now keeps only the currently valid result, with the debugging trail moved to history/2026-08-05_fatty_liver_opt_joint.yaml."

imports:
  - papers/lm_format/banister/banister_validation
  - ./fatty_liver_sim

references:
  - "See ./fatty_liver_sim.yaml"

optimization:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-03-27"
  step_size:
    value: 1
    unit: day

  objectives:
    - variable: liver_fat_pct
      metric: final
      direction: minimize
      description: "Minimizing the liver fat percentage at week 12, a hepatology-perspective, primary health outcome"
    - variable: fatigue
      metric: max
      direction: minimize
      description: "Minimizing the peak fatigue during training, a sports-medicine-perspective proxy for injury or dropout risk"

  mc:
    runs: 5
    seed: 19

  algorithm:
    population_size: 80
    n_generations: 150
    seed: 19


  startpoint:
    regimens:
      # T1: baseline daily activity (every day throughout, low to moderate intensity)
      - variable: training_load
        time_start: "07:00"
        time_end: "07:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Baseline daily activity intensity"
        optimize:
          value: [2.5, 5.0]

      # T1+T3+T4: an additional training block (on top of the baseline; T3 controls frequency, T4 controls escalation timing)
      # Physical meaning: total intensity on a training day = the baseline value plus the block's value (two pulses accumulated at the same time)
      - variable: training_load
        time_start: "07:00"
        time_end: "07:00"
        label: "Additional training-block volume x frequency x escalation timing"
        optimize:
          value: [2.0, 5.5]
          days_pool: [Mon, Tue, Wed, Thu, Fri, Sat]
          days_n: [3, 5]
          date_range:
            - ["2026-01-01", "2026-02-12"]
            - ["2026-03-27", "2026-03-27"]

  results:
    status: "The same configuration (pop=80/gen=150/seed=19/mc=5) matched exactly across two independent reruns on 2026-07-11 and 2026-07-14; the front is wider than before along the fatigue dimension (14.3-61.9 AU, versus 20.3-54.1 AU previously), while the liver_fat_pct dimension is essentially unchanged (2.83-10.33%, versus 2.83-10.7% previously). An independent --sim-only check found that the front's midsection (around liver_fat_pct approximately 8.4%) reported a low-fatigue solution internally in opt that was not fully trustworthy; on review, only a modest improvement of about 4% was confirmed rather than the larger improvement originally reported (see note). This was not adopted, and the joint_optimized plan and the paper's table 6 were not updated."
    generated_at: "2026-07-11"
    method: nsga2
    population_size: 80
    n_generations: 150
    n_solutions: 31
    pareto_front_range:
      liver_fat_pct: [2.832, 10.328]
