    note: "recommended takes the front's solution at liver_fat_pct approximately 8.4%, for comparison against the historical joint_optimized plan (8.02%/29.24 AU/24 days). Decoding x: basic=4.01 MET throughout plus add=2.07 MET on Mon/Tue/Sat (3 times a week) starting 2026-01-04. Independent --sim-only validation (a 5-run MC mean) gives liver_fat_pct=8.39%, fatigue=28.10 AU, lm_score=20 days. fatigue does show about a 4% improvement, but liver_fat_pct is slightly worse (+0.37pp) and the number of healthy-threshold days drops from 24 to 20, making this another tradeoff point on the front rather than a solution strictly dominating the existing plan, so it did not replace the joint_optimized plan in fatty_liver_sim.yaml and the paper's table 6 was not updated. The front's other solutions with fatigue<19.6 (9 solutions in the liver_fat_pct 8-10.3% range) were not individually re-checked and serve only as qualitative reference: the fatigue dimension's front widening is itself supported by deterministic, low-variance solutions at both ends of the front and is trustworthy, but the exact numbers of the specific midsection solutions would need an independent check before being adopted. See history/2026-08-05_fatty_liver_opt_joint.yaml for the earlier rerun record (including two earlier batches of historical results from 2026-07-10 and 2026-06-15)."
