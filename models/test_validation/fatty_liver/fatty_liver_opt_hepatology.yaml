metadata:
  name: fatty_liver_opt_hepatology
  lm_format_version: "1.0"
  description:
    problem: "An optimization from hepatology's single-discipline perspective: minimizing only the liver fat percentage at week 12, with no fatigue or dropout risk considered, representing how far a single-discipline optimum would be pushed if only hepatology guidelines were heeded, ignoring sports medicine's concerns. Comparing this against sports medicine's single-discipline optimization, fatty_liver_opt_exercise.yaml, and the combined multi-discipline fatty_liver_opt_joint.yaml is what reveals the tradeoff range a joint optimization exposes. See the imported fatty_liver_sim for the complete physical mechanism and the comparison simulation."
    method: "The mechanism matches fatty_liver_sim.yaml; see that file's description.method for the complete mechanism list. This file narrows the optimization objective to a single-discipline perspective, minimizing only the liver fat percentage, with the decision variables and search space kept identical to fatty_liver_opt_exercise.yaml and fatty_liver_opt_joint.yaml, so the three can be compared side by side."
  log:
    "2026-08-05_00-00-00":
      change: "results streamlined to the final converged result from 2026-07-11, removing the confirmed-redundant historical_stale_from_2026-07-10 sub-block; description gains a method field"
      reason: "Implements ADR 0141: the main file now keeps only the currently valid result, with the debugging trail moved to history/2026-08-05_fatty_liver_opt_hepatology.yaml."

imports:
  - papers/lm_format/banister/banister_validation
  - ./fatty_liver_sim

references:
  - "See ./fatty_liver_sim.yaml"

optimization:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-03-27"
  step_size:
    value: 1
    unit: day

  objectives:
    - variable: liver_fat_pct
      metric: final
      direction: minimize
      description: "Hepatology's single-discipline objective: minimizing only the liver fat percentage at week 12, with no peak fatigue traded off"

  # The exact same decision-variable structure as fatty_liver_opt_joint.yaml, only the objective
  # function differs, so all three scenarios share the same search space and their results are comparable.
  startpoint:
    regimens:
      - variable: training_load
        time_start: "07:00"
        time_end: "07:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Baseline daily activity intensity"
        optimize:
          value: [2.5, 5.0]

      - variable: training_load
        time_start: "07:00"
        time_end: "07:00"
        label: "Additional training-block volume x frequency x escalation timing"
        optimize:
          value: [2.0, 5.5]
          days_pool: [Mon, Tue, Wed, Thu, Fri, Sat]
          days_n: [3, 5]
          date_range:
            - ["2026-01-01", "2026-02-12"]
            - ["2026-03-27", "2026-03-27"]

  mc:
    runs: 5
    seed: 19

  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

  results:
    status: "liver_fat_pct is a deterministic output, unaffected by optimization.mc's inner-loop resampling parameter; two independent reruns on 2026-07-11 and 2026-07-14 both matched the result below exactly."
    generated_at: "2026-07-11"
    method: nsga2
    population_size: 50
    n_generations: 80
    n_solutions: 50
    recommended:
      x: [4.9999999999999964, 5.499999999999999, 39.981310054165945, 0.000173871999573465]
      f: [2.8320000000000203]
    note: "Cross-validated with --sim-only in fatty_liver_sim.yaml, the hepatology_optimized plan gives fatigue=51.612, matching the paper's existing table 6 number; the single-discipline result is consistent with the most aggressive end of fatty_liver_opt_joint.yaml's front, f approximately [2.83,54.1]. See history/2026-08-05_fatty_liver_opt_hepatology.yaml for the earlier rerun record."
