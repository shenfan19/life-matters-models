metadata:
  name: fatty_liver_sim
  lm_format_version: "1.0"
  version: "1.0.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      脂肪肝（NAFLD）患者运动进阶时机量化：EASL/AGA 指南推荐从中等强度开始、逐步升级至较高强度，但何时升级、每周训练几次缺乏量化依据，单篇来源文献回答不了这一问题：
      - 肝脂肪运动减少的证据只报告训练剂量与肝脂肪含量下降的关系，不涉及 ALT 或疲劳。
      - ALT 改善的证据只报告训练剂量与血清转氨酶下降的关系，不涉及肝脂肪或疲劳。
      - Banister 适应-疲劳模型的原始参数针对运动员标定，久坐 NAFLD 人群的疲劳积累显著高于运动员，过激方案会增加损伤和脱落风险，原始参数不能直接套用于这一人群。
      每篇来源文献具体贡献了什么，见下方 references 各条目的 description。
    method: |
      本文件融合以下机制：
      - 肝脂肪运动减少动力学：训练剂量线性降低肝脏脂肪含量（Keating 2012 meta-analysis）
      - ALT 改善动力学：训练剂量慢性降低血清转氨酶（Front Physiol 2022 meta-analysis）
      - Banister 适应-疲劳动力学：复用 `papers/lm_format/banister/banister_validation.yaml` 的 fatigue 分量，系数重新标定至久坐 NAFLD 人群的日尺度，Morton 1990 原始参数是针对运动员标定的。
      同一个决策变量，即每日训练强度与强化训练的频率和起始时机，同时驱动减脂、ALT 改善和疲劳积累三条轨迹：训练强度越高、升级越早，肝脂肪和 ALT 改善越快，但疲劳积累也越快，久坐人群的疲劳耐受远低于运动员，使升级时机与训练频率成为独立于强度大小之外的真实权衡维度。
    result: |
      - 本文件携带完整的 variables/equations 物理机制，与论文 Table 6/图 4 用的对比仿真方案 simulation.plans，可直接 `--sim` 跑出全部对比方案。
      - 三个单/多学科优化场景见同目录：`fatty_liver_opt_hepatology.yaml`，肝病科单目标仅最小化肝脂肪；`fatty_liver_opt_exercise.yaml`，运动医学单目标仅最小化疲劳峰值；`fatty_liver_opt_joint.yaml`，联合多目标肝脂肪加疲劳峰值。三者并列对比才能体现单学科各自最优与联合权衡的差异。
    limitations: |
      - 肝脂肪动力学为线性近似，不含饮食、体重或胰岛素抵抗协同效应。
      - 疲劳系数从运动员参数缩放至久坐人群，未经 NAFLD 人群直接验证。
      - 模型假设方案完全执行，未建模依从性下降。
      - 疲劳子系统通过 imports 复用 `papers/lm_format/banister/banister_validation` 的 fatigue/h/k2/training_load 机制方程，本文件只覆盖这些变量的取值和量纲，重新标定为久坐 NAFLD 人群，与 banister_validation 的运动员标定值不同，是预期的人群差异，不是不一致；单独使用本文件而不带该 import 会缺少 fatigue_dynamics。
      - `fatty_liver_opt_exercise.yaml` 与 `fatty_liver_opt_joint.yaml` 各自报告过一个前沿解，经独立 `--sim-only` 复核未能证实，前者的 recommended 解实测无改善，后者中段 fatigue 较低的解实测改善幅度小于 opt 内部报告值，判定为 mc.runs=5 小样本下的 noisy-fitness 选择偏差；下方 `exercise_optimized`/`joint_optimized` 方案保留的是已复核确认的取值，未采信未复核的前沿解。
  ratings:
    importance: 0.5 - NAFLD患病率>25%，运动进阶时机量化有临床价值，但为独立演示模型，尚无论文归属
    variable: 0.75 - alpha_fat/gamma_alt由Keating 2012/Front Physiol 2022 meta分析效应量直接推导，h/k2从Morton 1990运动员参数有依据地缩放
    equation: 0.75 - 疲劳子系统直接复用已验证的Banister方程结构，肝脂肪/ALT两条为锚定meta分析效应量的自建线性关系
    simulation: 0.75 - 多方案轨迹方向合理，经多轮noisy-fitness偏差排查交叉验证，未与独立NAFLD人群数据逐点比对
    optimization: 0.75 - 肝病科(激进降脂高疲劳)与运动医学(保守低疲劳)单目标解方案差异显著，联合前沿经反复--sim-only复核确认真实
    innovation: 0.75 - 将已验证的Banister周期化模型引入NAFLD运动处方并量化升级时机，组合形式为新贡献
    confidence: 0.25 - 经noisy-fitness偏差排查交叉验证自洽，但未与独立NAFLD人群文献目标数值比对
  tags: [fatty_liver, NAFLD, exercise, periodization, Banister, NSGA2]
  log:
    "2026-08-06_04-00-00":
      change: "按 ADR 0142/0143 迁移：problem 改为主题句加机制分组列表，result/limitations 改为列表结构，references 全部改为 {citation, description} 对象写法；清理非豁免括号、破折号与调试过程叙述"
      reason: "落实 ADR 0143：编辑 papers/ 模型时顺带完成 description/references 迁移，不再以任务范围小为由跳过。"
    "2026-06-24_00-00-00":
      change: "修正 schedule_runner.py 的 apply_schedules()，把仿真起始日的星期对齐方式从硬编码周一改为真正对齐 simulation.start_date 的日历星期"
      reason: "原实现按 dow = prev_day_idx % 7 计算，未考虑 start_date 本身可能不是周一（本文件 start_date=2026-01-01 实际是周四），导致按 days: [Mon...] 过滤训练日的方案星期相位与真实日历错位；修正后论文 §6.4 表6 数值同步更新。"
    "2026-08-05_00-00-00":
      change: "移除已解决的 todo 条目与纯历史性的文件结构迁移记录；description 补充 method 字段"
      reason: "落实 ADR 0141，主文件只保留当前状态，调试脉络转移至 history/2026-08-05_fatty_liver_sim.yaml。"

imports:
  - papers/lm_format/banister/banister_validation

references:
  - citation: "Keating SE et al. (2012) Exercise and NAFLD: a systematic review and meta-analysis. J Hepatol 57(1):157-166"
    description: "运动减脂系数 alpha_fat 的推导来源：典型有氧干预 12 周减少肝脂肪约 3.5%。"
  - citation: "Morton RH et al. (1990) Modelling human performance in running. J Appl Physiol 69(3):1171-1177"
    description: "Banister 适应-疲劳双室模型的原始参数来源，本文件通过 imports 复用其 fatigue 机制，并把 h/k2 等系数从运动员量级重新标定至久坐 NAFLD 人群。"
  - citation: "Exercise Training on Serum Transaminases in NAFLD: Meta-Analysis. Front Physiol (2022) doi:10.3389/fphys.2022.894044"
    description: "ALT 慢性改善系数 gamma_alt 的推导来源：有氧干预平均 12 周减少 ALT 约 7 IU/L。"
  - citation: "Prati D et al. (2002) Updated definitions of healthy ranges for serum ALT. Ann Intern Med 137(1):1-10"
    description: "ALT 正常上限 40 IU/L 的定义来源。"
  - citation: "Mofrad P et al. (2003) Clinical and histologic spectrum of NAFLD. Hepatology 37(6):1286"
    description: "alt_level 基线取值，NAFLD 患者轻度升高至 45 IU/L 的来源。"
  - citation: "EASL-EASD-EASO Clinical Practice Guidelines (2016) Management of NAFLD. J Hepatol 64(6):1388-1402"
    description: "从中等强度开始、逐步升级至较高强度这一运动处方指南，problem 里指出的量化空白正是针对该指南的升级时机与训练频率未给出依据。"

# 以下变量覆盖 banister_core 的同名变量，重新标定为久坐 NAFLD 人群：
variables:
  liver_fat_pct:
    type: state
    value: 15.0
    unit: "%"
    bounds: [0, 60]
    description: "肝脏脂肪含量（%，MRI-PDFF），NAFLD 典型初值 15%"
    reference: "Kleiner DE et al. (2005) Hepatology 41(6):1313"
    locator: "TODO:LOCATE"

  alt_level:
    type: state
    value: 45.0
    unit: IU/L
    bounds: [5, 200]
    description: "丙氨酸氨基转移酶（NAFLD 患者轻度升高基线，ULN=40 IU/L），随运动训练慢性下降"
    reference: "Mofrad P et al. (2003) Hepatology 37(6):1286"
    locator: "TODO:LOCATE"

  # 覆盖 banister_core 的 fatigue（运动员 bounds=[0,3000]）为 NAFLD 久坐人群量级
  fatigue:
    type: state
    value: 0.0
    unit: AU
    bounds: [0, 500]
    description: "运动疲劳积累（Banister fitness-fatigue 结构，任意单位，来自 banister_core），代理损伤和脱落风险；bounds 覆盖为久坐 NAFLD 人群量级（原 banister_core 为运动员量级 [0,3000]）"
    reference: "Morton RH et al. (1990)"
    locator: "TODO:LOCATE"

  # 覆盖 banister_core 的 training_load（unit AU，无 bounds）为本案例的 MET 单位输入
  training_load:
    type: input
    value: 0.0
    unit: MET
    bounds: [0, 12]
    description: "当日总运动强度（基础活动与强化训练在同一时刻 pulse 累加；非训练日为 0）。覆盖 banister_core 的 training_load 单位（AU→MET）"
    io_role: input

  lm_score:
    type: state
    value: 0.0
    unit: day
    description: "健康时长：liver_fat_pct ≤ 10% 且 alt_level ≤ 40 IU/L 同时满足的累计天数"
    reference: "Life Matters Framework core metric"

  alpha_fat:
    type: parameter
    value: 0.016
    unit: "% per MET·day"
    description: >
      运动减脂系数（每 MET 训练日对应的肝脂肪下降百分比）。
      推导：Keating 2012 meta 报告典型有氧干预（~180 min/week at ~4.5 MET，4 次/周）
      12 周减少肝脂肪约 3.5%；总训练日 48 天；
      alpha = 3.5 / (4.5 × 48) ≈ 0.016 %/(MET·day)。
    reference: "Keating SE et al. (2012) J Hepatol 57(1):157-166"
    locator: "TODO:LOCATE"

  gamma_alt:
    type: parameter
    value: 0.032
    unit: "IU/L per MET·day"
    description: >
      运动训练对 ALT 的慢性改善系数。
      推导：Frontiers Physiol 2022 meta 报告有氧干预平均减少 ALT 约 7 IU/L/12 周；
      典型干预剂量同 alpha_fat 推导（48 训练日 @ 4.5 MET）；
      gamma = 7 / (4.5 × 48) ≈ 0.032 IU/L/(MET·day)。
    reference: "Front Physiol (2022) doi:10.3389/fphys.2022.894044"
    locator: "TODO:LOCATE"

  # 覆盖 banister_core 的 h（运动员标准值 2.0，dimensionless，bounds=[0.8,4.0]）
  h:
    type: parameter
    value: normal(0.40, 0.10)
    unit: "AU per MET·day"
    bounds: [0.1, 1.0]
    description: >
      Banister 疲劳增益系数，缩放自 Morton 1990 运动员参数至久坐 NAFLD 人群 MET 单位
      （覆盖 banister_core 的 h=2.0，运动员标准值）。
      原参数 h=2.0 对应运动员训练单位（~50 AU/session）；
      NAFLD 患者典型运动 5–8 MET/session，缩放比 ≈ 1/10，
      再乘久坐人群疲劳敏感性修正 1.5× → h ≈ 0.35–0.45；
      取均值 0.40，σ=0.10（±25% 个体间差异）。MC 模式每 run 采样一次。
    reference: "Morton RH et al. (1990) J Appl Physiol 69(3):1171"
    locator: "Table 1"

  # 覆盖 banister_core 的 k2（运动员 bounds=[0.03,0.15]，值 0.06667）；本案例直接用 Morton 1990
  # Table 1 原始值 0.067（与 banister_core 的 0.06667 同一时间常数 τ₂=15天，取整保留两位有效数字）
  k2:
    type: parameter
    value: 0.067
    unit: 1/day
    bounds: [0.02, 0.15]
    description: "疲劳衰减速率，对应时间常数 τ₂=15 天，直接使用 Morton 1990 Table 1 原始值（与 banister_core 的 k2=0.06667 同一来源，数值取整一致）。"
    reference: "Morton RH et al. (1990) J Appl Physiol 69(3):1171"
    locator: "Table 1"

equations:
  fat_reduction:
    description: "肝脂肪：运动剂量线性减少（Keating 2012）"
    step_unit: day
    priority: 5
    dynamics:
      liver_fat_pct: "max(0, liver_fat_pct - alpha_fat * training_load * step)"
    reference: "Keating SE et al. (2012)"
    locator: "TODO:LOCATE"

  alt_improvement:
    description: "ALT：运动训练慢性改善；非训练日（training_load=0）保持不变"
    step_unit: day
    priority: 4
    dynamics:
      alt_level: "max(10, alt_level - gamma_alt * training_load * step)"
    reference: "Front Physiol (2022) doi:10.3389/fphys.2022.894044"
    locator: "TODO:LOCATE"

  # 覆盖 banister_core 的 fatigue_dynamics：仅覆盖 step_unit（hour→day，匹配本案例日尺度仿真
  # 和 h/k2 的日尺度标定），dynamics 表达式继承自 banister_core（同一套方程，不重复声明）
  fatigue_dynamics:
    step_unit: day

  lm_score_update:
    description: "累加健康时长（可恢复）：liver_fat_pct ≤ 10% 且 alt_level ≤ 40 IU/L"
    step_unit: day
    priority: 90
    dynamics:
      lm_score: "lm_score + step if (liver_fat_pct <= 10 and alt_level <= 40) else lm_score"
    reference: "Life Matters Framework core metric"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-03-27"
  output_variables:
    - liver_fat_pct
    - alt_level
    - fatigue
    - training_load
    - lm_score
  plans:
    - id: "daily_walk"
      label: "每日步行（基准，3.5 MET × 7 天/周）"
      regimens:
        - variable: training_load
          time_start: "07:00"
          value: 3.5
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "每日中等强度步行"

    - id: "progressive_wk4"
      label: "渐进方案（第 4 周升级，强化 3 次/周，+4.0 MET）"
      regimens:
        - variable: training_load
          time_start: "07:00"
          value: 3.5
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "每日基础活动 3.5 MET"
        - variable: training_load
          time_start: "07:00"
          value: 4.0
          days: [Mon, Wed, Fri]
          date_range: ["2026-01-22", "2026-03-27"]
          label: "强化叠加 +4.0 MET（第 4 周起，3 次/周）"

    - id: "aggressive_wk1"
      label: "激进方案（第 1 周即升级，强化 5 次/周，+4.5 MET）"
      regimens:
        - variable: training_load
          time_start: "07:00"
          value: 3.5
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "每日基础活动 3.5 MET"
        - variable: training_load
          time_start: "07:00"
          value: 4.5
          days: [Mon, Tue, Wed, Thu, Fri]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "强化叠加 +4.5 MET（全程，5 次/周）"

    - id: "hepatology_optimized"
      label: "肝病科单学科优化方案（仅最小化肝脂肪，5.0+5.5 MET 全程，搜索空间上界，见 fatty_liver_opt_hepatology.yaml）——12周末肝脂肪2.83%，但疲劳峰值高（与 joint 前沿最激进端一致）"
      regimens:
        - variable: training_load
          time_start: "07:00"
          value: 5.0
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "每日基础活动提高至 5.0 MET（搜索空间上界）"
        - variable: training_load
          time_start: "07:00"
          value: 5.5
          days: [Mon, Tue, Wed, Thu, Fri]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "强化叠加 +5.5 MET（全程，5次/周，搜索空间上界）"

    - id: "exercise_optimized"
      label: "运动医学单学科优化方案（仅最小化疲劳峰值，2.5+2.0 MET 全程，搜索空间下界，见 fatty_liver_opt_exercise.yaml）——疲劳峰值20.0 AU最低，但肝脂肪改善最慢（与 joint 前沿最保守端接近）"
      regimens:
        - variable: training_load
          time_start: "07:00"
          value: 2.5
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "每日基础活动维持 2.5 MET（搜索空间下界）"
        - variable: training_load
          time_start: "07:00"
          value: 2.0
          days: [Mon, Wed, Fri]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "强化叠加 +2.0 MET（全程，3次/周，搜索空间下界）"
      # 2026-07-11 排查记录：optimization.mc reset bug 修复后 fatty_liver_opt_exercise.yaml
      # 重新搜索报告 best_f=13.22（远优于本方案的搜索空间下界基线），但取其 recommended x
      # 解码为具体 regimen（basic=2.56 MET 全程 + add=2.31 MET Mon/Tue/Fri 从 2026-02-06 起）
      # 后用 --sim-only 独立验证（5-run MC 均值）得 fatigue=20.29，非但没有改善，反而略差于
      # 本方案（19.18/20.0）。判定 opt 搜索内部报告的 13.22 是 mc.runs=5 小样本下的noisy-fitness
      # 选择偏差（搜索过程只用该个体某一次5-run抽样的结果做选择，未独立复核），不采信、不更新
      # 本方案，保留搜索空间下界基线。详见 tasks/2026-07-11_decisions_mc_rerun_s1.md。

    - id: "joint_optimized"
      label: "联合多学科优化方案（基础提高至 4.2 MET/天 + 强化 +2.2 MET，3 次/周，见 fatty_liver_opt_joint.yaml）— 12周末肝脂肪与疲劳峰值同时优于渐进方案"
      regimens:
        - variable: training_load
          time_start: "07:00"
          value: 4.2
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "每日基础活动提高至 4.2 MET（参考 fatty_liver_opt_joint.yaml pareto_front 中 x0≈4.18 的解）"
        - variable: training_load
          time_start: "07:00"
          value: 2.2
          days: [Mon, Wed, Fri]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "强化叠加 +2.2 MET（全程，3 次/周，参考 x1≈2.25 / x3≈0 即 days_n 下限的解）"
      # 2026-07-11 排查记录：optimization.mc reset bug 修复后 fatty_liver_opt_joint.yaml 重新搜索
      # （150/150代跑满）前沿在 liver_fat_pct≈8.4% 附近出现 fatigue低至19.6的解，解码后
      # （basic=4.01+add=2.07 Mon/Tue/Sat 2026-01-04起）--sim-only独立验证（5-run MC均值）得
      # fatigue=28.10、liver_fat_pct=8.39、lm_score=20天——fatigue确有改善（28.10 vs 本方案
      # 29.24，约4%）但liver_fat_pct略差（+0.37pp）且健康达标天数从24天降至20天，是前沿上的
      # 另一个权衡点而非严格支配本方案的改进解，不替换本方案（本方案是论文'24天'叙事的直接依据）。
