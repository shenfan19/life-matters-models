metadata:
  name: fatty_liver_sim
  lm_format_version: "1.0"
  version: "1.0.0"
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      Quantifying exercise-progression timing for a fatty liver (NAFLD) patient: EASL/AGA
      guidelines recommend starting at moderate intensity and progressively escalating to a higher
      intensity, but when to escalate and how many sessions per week lack a quantitative basis, and
      a single source publication cannot answer this:
      - The evidence for exercise reducing liver fat only reports the relationship between training
        dose and liver-fat reduction, without covering ALT or fatigue.
      - The evidence for ALT improvement only reports the relationship between training dose and
        serum transaminase reduction, without covering liver fat or fatigue.
      - The Banister fitness-fatigue model's original parameters were calibrated for athletes; a
        sedentary NAFLD population accumulates fatigue markedly faster than athletes, and an overly
        aggressive plan raises injury and dropout risk, so the original parameters cannot be applied
        directly to this population.
      What each source publication specifically contributes is described in each entry's
      description under references below.
    method: |
      This file combines the following mechanisms:
      - Exercise-driven liver-fat reduction dynamics: training dose linearly lowers liver fat
        content (Keating 2012's meta-analysis).
      - ALT improvement dynamics: training dose chronically lowers serum transaminase (the Front
        Physiol 2022 meta-analysis).
      - Banister fitness-fatigue dynamics: reuses the fatigue component from
        `papers/lm_format/banister/banister_validation.yaml`, with its coefficients recalibrated to
        a day-scale sedentary NAFLD population, since Morton 1990's original parameters were
        calibrated for athletes.
      The same decision variable, the daily training intensity together with the additional
      training block's frequency and start timing, drives three trajectories at once, fat
      reduction, ALT improvement, and fatigue accumulation: a higher training intensity and an
      earlier escalation improve liver fat and ALT faster, but also accumulate fatigue faster, and
      a sedentary population's fatigue tolerance is far below an athlete's, making escalation
      timing and training frequency a real tradeoff dimension independent of intensity alone.
    result: |
      - This file carries the complete physical mechanism (variables/equations) plus the
        comparison simulation plans used in the paper's Table 6 and Figure 4, and running `--sim`
        directly produces every comparison plan.
      - The three single- and multi-discipline optimization scenarios are in the same directory:
        `fatty_liver_opt_hepatology.yaml` (hepatology's single objective, minimizing only liver
        fat), `fatty_liver_opt_exercise.yaml` (sports medicine's single objective, minimizing only
        peak fatigue), and `fatty_liver_opt_joint.yaml` (a joint multi-objective, liver fat plus
        peak fatigue). Comparing all three side by side is what reveals the difference between each
        single discipline's own optimum and the joint tradeoff.
    limitations: |
      - The liver-fat dynamics are a linear approximation, with no diet, weight, or
        insulin-resistance interaction effect included.
      - The fatigue coefficients are scaled from athlete parameters to a sedentary population, not
        directly validated against a NAFLD population.
      - The model assumes the plan is followed exactly, with no modeled decline in adherence.
      - The fatigue subsystem reuses the fatigue/h/k2/training_load mechanism equations from
        `papers/lm_format/banister/banister_validation` through imports; this file only overrides
        those variables' values and dimensions, recalibrated for a sedentary NAFLD population,
        different from banister_validation's athlete-calibrated values, an expected population
        difference rather than an inconsistency. Using this file alone without that import would be
        missing fatigue_dynamics.
      - `fatty_liver_opt_exercise.yaml` and `fatty_liver_opt_joint.yaml` each reported a front
        solution that an independent `--sim-only` check could not confirm: the former's recommended
        solution showed no actual improvement when measured, and the latter's midsection solution
        with lower fatigue showed a smaller actual improvement than opt internally reported; both
        were judged to be a noisy-fitness selection bias from the small mc.runs=5 sample. The
        `exercise_optimized`/`joint_optimized` plans below keep the already-checked, confirmed
        values, and do not adopt the unchecked front solutions.
  ratings:
    importance: 0.5 - NAFLD's prevalence exceeds 25%, and quantifying exercise-progression timing has clinical value, but this is an independent demonstration model not yet attached to a paper
    variable: 0.75 - alpha_fat/gamma_alt are derived directly from the effect sizes in the Keating 2012/Front Physiol 2022 meta-analyses; h/k2 are scaled with justification from Morton 1990's athlete parameters
    equation: 0.75 - The fatigue subsystem directly reuses the already-validated Banister equation structure; the liver-fat and ALT equations are self-built linear relationships anchored to the meta-analysis effect sizes
    simulation: 0.75 - The multiple plans' trajectories are directionally plausible and cross-validated through several rounds of checking for a noisy-fitness bias, but have not been compared point by point against independent NAFLD population data
    optimization: 0.75 - The hepatology single-objective solution (aggressive fat reduction, high fatigue) and the sports-medicine single-objective solution (conservative, low fatigue) differ markedly, and the joint front was confirmed genuine through repeated --sim-only checks
    innovation: 0.75 - Brings the already-validated Banister periodization model into a NAFLD exercise prescription and quantifies escalation timing; the combined form is a new contribution
    confidence: 0.25 - Self-consistent and cross-validated through checking for a noisy-fitness bias, but not compared against an independent NAFLD population's literature target values
  tags: [fatty_liver, NAFLD, exercise, periodization, Banister, NSGA2]
  log:
    "2026-08-06_04-00-00":
      change: "Migrated per ADR 0142/0143: problem changed to a topic sentence plus a mechanism-grouped list, result/limitations changed to a list structure, references all changed to the {citation, description} object form; non-exempt parentheses, dashes, and debugging-process narrative cleaned out"
      reason: "Implements ADR 0143: editing a papers/ model now also completes the description/references migration, no longer skipped on the grounds that the task's scope is small."
    "2026-06-24_00-00-00":
      change: "Fixed schedule_runner.py's apply_schedules() so that the simulation start date's day-of-week alignment changed from hardcoded Monday to genuinely aligning with the calendar day of the week for simulation.start_date"
      reason: "The original implementation computed dow = prev_day_idx % 7, without accounting for start_date itself possibly not being a Monday (this file's start_date=2026-01-01 is actually a Thursday), causing the day-of-week phase used to filter training days by days: [Mon...] to be misaligned with the real calendar; after the fix, the paper's section 6.4 table 6 numbers were updated accordingly."
    "2026-08-05_00-00-00":
      change: "Removed resolved todo items and purely historical file-structure migration records; description gains a method field"
      reason: "Implements ADR 0141: the main file now keeps only the current state, with the debugging trail moved to history/2026-08-05_fatty_liver_sim.yaml."

imports:
  - papers/lm_format/banister/banister_validation

references:
  - citation: "Keating SE et al. (2012) Exercise and NAFLD: a systematic review and meta-analysis. J Hepatol 57(1):157-166"
    description: "The source for deriving the exercise-driven fat-reduction coefficient alpha_fat: a typical 12-week aerobic intervention reduces liver fat by about 3.5%."
  - citation: "Morton RH et al. (1990) Modelling human performance in running. J Appl Physiol 69(3):1171-1177"
    description: "The source of the Banister fitness-fatigue two-compartment model's original parameters; this file reuses its fatigue mechanism through imports and recalibrates coefficients such as h/k2 from an athlete's magnitude to a sedentary NAFLD population."
  - citation: "Exercise Training on Serum Transaminases in NAFLD: Meta-Analysis. Front Physiol (2022) doi:10.3389/fphys.2022.894044"
    description: "The source for deriving the chronic ALT-improvement coefficient gamma_alt: an aerobic intervention averaging 12 weeks reduces ALT by about 7 IU/L."
  - citation: "Prati D et al. (2002) Updated definitions of healthy ranges for serum ALT. Ann Intern Med 137(1):1-10"
    description: "The source of the ALT upper limit of normal, 40 IU/L."
  - citation: "Mofrad P et al. (2003) Clinical and histologic spectrum of NAFLD. Hepatology 37(6):1286"
    description: "The source for alt_level's baseline value, a mild elevation to 45 IU/L in NAFLD patients."
  - citation: "EASL-EASD-EASO Clinical Practice Guidelines (2016) Management of NAFLD. J Hepatol 64(6):1388-1402"
    description: "The exercise-prescription guideline of starting at moderate intensity and progressively escalating to a higher intensity; the quantification gap noted in problem is exactly that this guideline gives no basis for escalation timing or training frequency."

# The following variables override the same-named variables in banister_core, recalibrated for a sedentary NAFLD population:
variables:
  liver_fat_pct:
    type: state
    value: 15.0
    unit: "%"
    bounds: [0, 60]
    description: "Liver fat content (%, MRI-PDFF), a typical NAFLD starting value of 15%"
    reference: "Kleiner DE et al. (2005) Hepatology 41(6):1313"
    locator: "TODO:LOCATE"

  alt_level:
    type: state
    value: 45.0
    unit: IU/L
    bounds: [5, 200]
    description: "Alanine aminotransferase (a mildly elevated baseline in NAFLD patients, ULN=40 IU/L), declining chronically with exercise training"
    reference: "Mofrad P et al. (2003) Hepatology 37(6):1286"
    locator: "TODO:LOCATE"

  # Overrides banister_core's fatigue (athlete bounds=[0,3000]) to a sedentary-NAFLD-population magnitude
  fatigue:
    type: state
    value: 0.0
    unit: AU
    bounds: [0, 500]
    description: "Accumulated exercise fatigue (the Banister fitness-fatigue structure, an arbitrary unit, from banister_core), a proxy for injury and dropout risk; bounds rescaled to a sedentary NAFLD population's magnitude (the original banister_core is at an athlete's magnitude, [0,3000])"
    reference: "Morton RH et al. (1990)"
    locator: "TODO:LOCATE"

  # Overrides banister_core's training_load (unit AU, no bounds) to this case's MET-unit input
  training_load:
    type: input
    value: 0.0
    unit: MET
    bounds: [0, 12]
    description: "The day's total exercise intensity (the baseline activity and an additional training block accumulate as pulses at the same moment; 0 on a non-training day). Overrides banister_core's training_load unit (AU to MET)"
    io_role: input

  lm_score:
    type: state
    value: 0.0
    unit: day
    description: "Healthy duration: the accumulated days with liver_fat_pct at most 10% and alt_level at most 40 IU/L both satisfied"
    reference: "Life Matters Framework core metric"

  alpha_fat:
    type: parameter
    value: 0.016
    unit: "% per MET·day"
    description: >
      The exercise-driven fat-reduction coefficient (the percentage drop in liver fat per MET
      training day).
      Derivation: Keating 2012's meta-analysis reports a typical aerobic intervention (about
      180 min/week at about 4.5 MET, 4 times a week) reducing liver fat by about 3.5% over
      12 weeks, over a total of 48 training days;
      alpha = 3.5 / (4.5 x 48) is approximately 0.016 %/(MET·day).
    reference: "Keating SE et al. (2012) J Hepatol 57(1):157-166"
    locator: "TODO:LOCATE"

  gamma_alt:
    type: parameter
    value: 0.032
    unit: "IU/L per MET·day"
    description: >
      The chronic ALT-improvement coefficient from exercise training.
      Derivation: the Frontiers Physiol 2022 meta-analysis reports an aerobic intervention reducing
      ALT by about 7 IU/L on average over 12 weeks;
      the typical intervention dose is the same as alpha_fat's derivation (48 training days at
      4.5 MET);
      gamma = 7 / (4.5 x 48) is approximately 0.032 IU/L/(MET·day).
    reference: "Front Physiol (2022) doi:10.3389/fphys.2022.894044"
    locator: "TODO:LOCATE"

  # Overrides banister_core's h (the athlete standard value 2.0, dimensionless, bounds=[0.8,4.0])
  h:
    type: parameter
    value: normal(0.40, 0.10)
    unit: "AU per MET·day"
    bounds: [0.1, 1.0]
    description: >
      The Banister fatigue-gain coefficient, scaled from Morton 1990's athlete parameters to a
      sedentary NAFLD population's MET unit (overriding banister_core's h=2.0, the athlete
      standard value).
      The original parameter h=2.0 corresponds to an athlete's training unit (about
      50 AU/session); a NAFLD patient's typical exercise is 5 to 8 MET/session, a scaling ratio of
      approximately 1/10, further multiplied by a 1.5x correction for a sedentary population's
      fatigue sensitivity, giving h approximately 0.35 to 0.45; the mean 0.40 is taken, with
      sigma=0.10 (plus or minus 25% individual variation). Sampled once per run in MC mode.
    reference: "Morton RH et al. (1990) J Appl Physiol 69(3):1171"
    locator: "Table 1"

  # Overrides banister_core's k2 (athlete bounds=[0.03,0.15], value 0.06667); this case uses
  # Morton 1990 Table 1's original value of 0.067 directly (the same time constant tau2=15 days
  # as banister_core's 0.06667, rounded to two significant figures)
  k2:
    type: parameter
    value: 0.067
    unit: 1/day
    bounds: [0.02, 0.15]
    description: "The fatigue decay rate, corresponding to a time constant tau2=15 days, using Morton 1990 Table 1's original value directly (the same source as banister_core's k2=0.06667, consistent once rounded)."
    reference: "Morton RH et al. (1990) J Appl Physiol 69(3):1171"
    locator: "Table 1"

equations:
  fat_reduction:
    description: "Liver fat: linearly reduced by exercise dose (Keating 2012)"
    step_unit: day
    priority: 5
    dynamics:
      liver_fat_pct: "max(0, liver_fat_pct - alpha_fat * training_load * step)"
    reference: "Keating SE et al. (2012)"
    locator: "TODO:LOCATE"

  alt_improvement:
    description: "ALT: chronically improved by exercise training; unchanged on a non-training day (training_load=0)"
    step_unit: day
    priority: 4
    dynamics:
      alt_level: "max(10, alt_level - gamma_alt * training_load * step)"
    reference: "Front Physiol (2022) doi:10.3389/fphys.2022.894044"
    locator: "TODO:LOCATE"

  # Overrides banister_core's fatigue_dynamics: only step_unit is overridden (hour to day, matching
  # this case's day-scale simulation and the day-scale calibration of h/k2); the dynamics
  # expression is inherited from banister_core (the same equation, not redeclared)
  fatigue_dynamics:
    step_unit: day

  lm_score_update:
    description: "Accumulates healthy duration (recoverable): liver_fat_pct at most 10% and alt_level at most 40 IU/L"
    step_unit: day
    priority: 90
    dynamics:
      lm_score: "lm_score + step if (liver_fat_pct <= 10 and alt_level <= 40) else lm_score"
    reference: "Life Matters Framework core metric"

simulation:
  step_size:
    value: 1
    unit: day
  start_date: "2026-01-01"
  end_date: "2026-03-27"
  output_variables:
    - liver_fat_pct
    - alt_level
    - fatigue
    - training_load
    - lm_score
  plans:
    - id: "daily_walk"
      label: "Daily walking (baseline, 3.5 MET x 7 days/week)"
      regimens:
        - variable: training_load
          time_start: "07:00"
          value: 3.5
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "Daily moderate-intensity walking"

    - id: "progressive_wk4"
      label: "Progressive plan (escalating at week 4, an additional block 3 times/week, +4.0 MET)"
      regimens:
        - variable: training_load
          time_start: "07:00"
          value: 3.5
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "Daily baseline activity, 3.5 MET"
        - variable: training_load
          time_start: "07:00"
          value: 4.0
          days: [Mon, Wed, Fri]
          date_range: ["2026-01-22", "2026-03-27"]
          label: "An additional block of +4.0 MET (starting week 4, 3 times a week)"

    - id: "aggressive_wk1"
      label: "Aggressive plan (escalating in week 1, an additional block 5 times/week, +4.5 MET)"
      regimens:
        - variable: training_load
          time_start: "07:00"
          value: 3.5
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "Daily baseline activity, 3.5 MET"
        - variable: training_load
          time_start: "07:00"
          value: 4.5
          days: [Mon, Tue, Wed, Thu, Fri]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "An additional block of +4.5 MET (throughout, 5 times a week)"

    - id: "hepatology_optimized"
      label: "Hepatology's single-discipline optimized plan (minimizing only liver fat, 5.0+5.5 MET throughout, the search space's upper bound, see fatty_liver_opt_hepatology.yaml); liver fat 2.83% at week 12, but a high peak fatigue (consistent with the most aggressive end of the joint front)"
      regimens:
        - variable: training_load
          time_start: "07:00"
          value: 5.0
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "Daily baseline activity raised to 5.0 MET (the search space's upper bound)"
        - variable: training_load
          time_start: "07:00"
          value: 5.5
          days: [Mon, Tue, Wed, Thu, Fri]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "An additional block of +5.5 MET (throughout, 5 times a week, the search space's upper bound)"

    - id: "exercise_optimized"
      label: "Sports medicine's single-discipline optimized plan (minimizing only peak fatigue, 2.5+2.0 MET throughout, the search space's lower bound, see fatty_liver_opt_exercise.yaml); the lowest peak fatigue at 20.0 AU, but the slowest liver-fat improvement (close to the joint front's most conservative end)"
      regimens:
        - variable: training_load
          time_start: "07:00"
          value: 2.5
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "Daily baseline activity kept at 2.5 MET (the search space's lower bound)"
        - variable: training_load
          time_start: "07:00"
          value: 2.0
          days: [Mon, Wed, Fri]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "An additional block of +2.0 MET (throughout, 3 times a week, the search space's lower bound)"
      # 2026-07-11 review record: after fixing the optimization.mc reset bug, a rerun search on
      # fatty_liver_opt_exercise.yaml reported best_f=13.22 (far better than this plan's search-space
      # lower-bound baseline), but decoding its recommended x into a specific regimen (basic=2.56 MET
      # throughout plus add=2.31 MET on Mon/Tue/Fri starting 2026-02-06) and independently validating
      # with --sim-only (a 5-run MC mean) gave fatigue=20.29, not only no improvement but in fact
      # slightly worse than this plan (19.18/20.0). The 13.22 reported internally by the opt search was
      # judged to be a noisy-fitness selection bias from the small mc.runs=5 sample (the search process
      # selected based only on that individual's result from one particular 5-run sample, without an
      # independent check); it was not adopted, this plan was not updated, and the search-space
      # lower-bound baseline was kept. See tasks/2026-07-11_decisions_mc_rerun_s1.md for detail.

    - id: "joint_optimized"
      label: "A joint multi-discipline optimized plan (baseline raised to 4.2 MET/day plus an additional block of +2.2 MET, 3 times a week, see fatty_liver_opt_joint.yaml); both liver fat and peak fatigue at week 12 beat the progressive plan"
      regimens:
        - variable: training_load
          time_start: "07:00"
          value: 4.2
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "Daily baseline activity raised to 4.2 MET (referencing the solution at x0 approximately 4.18 in fatty_liver_opt_joint.yaml's pareto_front)"
        - variable: training_load
          time_start: "07:00"
          value: 2.2
          days: [Mon, Wed, Fri]
          date_range: ["2026-01-01", "2026-03-27"]
          label: "An additional block of +2.2 MET (throughout, 3 times a week, referencing the solution at x1 approximately 2.25 / x3 approximately 0, i.e. days_n's lower bound)"
      # 2026-07-11 review record: after fixing the optimization.mc reset bug, a rerun search on
      # fatty_liver_opt_joint.yaml (running the full 150/150 generations) produced a front solution
      # near liver_fat_pct approximately 8.4% with fatigue as low as 19.6; decoding it (basic=4.01 plus
      # add=2.07 on Mon/Tue/Sat starting 2026-01-04) and independently validating with --sim-only
      # (a 5-run MC mean) gave fatigue=28.10, liver_fat_pct=8.39, lm_score=20 days. fatigue does show
      # an improvement (28.10 versus this plan's 29.24, about 4%), but liver_fat_pct is slightly worse
      # (+0.37pp) and the number of healthy-threshold days drops from 24 to 20, making this another
      # tradeoff point on the front rather than a solution strictly dominating this plan, so it did not
      # replace this plan (this plan is the direct basis for the paper's "24 days" narrative). The
      # other, even-lower fatigue values (in the 14-19 range) opt reported internally on the same front
      # were not individually checked, and are likewise not adopted on suspicion of the same
      # noisy-fitness issue as exercise_optimized. See tasks/2026-07-11_decisions_mc_rerun_s1.md for
      # detail.
  mc:
    runs: 5
    seed: 19
