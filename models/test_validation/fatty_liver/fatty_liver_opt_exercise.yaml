metadata:
  name: fatty_liver_opt_exercise
  lm_format_version: "1.0"
  description:
    problem: "An optimization from sports medicine's single-discipline perspective: minimizing only the peak fatigue during training, with no liver outcome considered, representing how far a single-discipline optimum would be pushed if only sports medicine and periodization theory were heeded, ignoring hepatology's concerns. Comparing this against hepatology's single-discipline optimization, fatty_liver_opt_hepatology.yaml, and the combined multi-discipline fatty_liver_opt_joint.yaml is what reveals the tradeoff range a joint optimization exposes. See the imported fatty_liver_sim for the complete physical mechanism and the comparison simulation."
    method: "The mechanism matches fatty_liver_sim.yaml; see that file's description.method for the complete mechanism list. This file narrows the optimization objective to a single-discipline perspective, minimizing only the peak fatigue during training, with the decision variables and search space kept identical to fatty_liver_opt_hepatology.yaml and fatty_liver_opt_joint.yaml, so the three can be compared side by side."
  log:
    "2026-08-05_00-00-00":
      change: "results streamlined to the final converged result from 2026-07-11, removing the confirmed-redundant historical_stale_from_2026-07-10 sub-block and its internal task-record pointer; description gains a method field"
      reason: "Implements ADR 0141: the main file now keeps only the currently valid result, with the debugging trail moved to history/2026-08-05_fatty_liver_opt_exercise.yaml."

imports:
  - papers/lm_format/banister/banister_validation
  - ./fatty_liver_sim

references:
  - "See ./fatty_liver_sim.yaml"

optimization:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-03-27"
  step_size:
    value: 1
    unit: day

  objectives:
    - variable: fatigue
      metric: max
      direction: minimize
      description: "Sports medicine's single-discipline objective: minimizing only the peak fatigue during training, with no liver outcome traded off"

  # The exact same decision-variable structure as fatty_liver_opt_joint.yaml, only the objective
  # function differs, so all three scenarios share the same search space and their results are comparable.
  startpoint:
    regimens:
      - variable: training_load
        time_start: "07:00"
        time_end: "07:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Baseline daily activity intensity"
        optimize:
          value: [2.5, 5.0]

      - variable: training_load
        time_start: "07:00"
        time_end: "07:00"
        label: "Additional training-block volume x frequency x escalation timing"
        optimize:
          value: [2.0, 5.5]
          days_pool: [Mon, Tue, Wed, Thu, Fri, Sat]
          days_n: [3, 5]
          date_range:
            - ["2026-01-01", "2026-02-12"]
            - ["2026-03-27", "2026-03-27"]

  mc:
    runs: 5
    seed: 19

  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

  results:
    status: "The same configuration (pop=50/gen=80/mc=5) reported best_f=13.22 identically across two independent reruns on 2026-07-11 and 2026-07-14, but an independent --sim-only check could not reproduce this value; it was judged to be an untrustworthy selection bias, with the reason given in note, and was not adopted, so the exercise_optimized plan and the paper's table 6 were not updated."
    generated_at: "2026-07-11"
    method: nsga2
    population_size: 50
    n_generations: 80
    n_solutions: 1
    recommended:
      x: [2.563566070099759, 2.309615214149592, 1.5736754218210045, 36.223757412702476]
      f: [13.222817316070035]
    note: "Decoding x: a baseline activity of 2.56 MET throughout plus an additional block of 2.31 MET on Mon/Tue/Fri (3 times a week) starting 2026-02-06 (within the date_range search window, not the full run). Writing this decoded regimen into the exercise_optimized plan of fatty_liver_sim.yaml and independently validating with --sim-only (a 5-run MC mean, different from the single 5-run sample the opt's internal evaluation uses) gives fatigue=20.29, no improvement, in fact slightly worse than that plan's existing value of 19.18/20.0. With a small mc.runs=5 sample size, the 'best' individual the opt search selects may simply reflect the particular set of MC samples it happened to draw at the moment it was evaluated (a noisy-fitness selection bias), not its true expected peak fatigue; this change did not replace the exercise_optimized plan or update the paper's table 6. See history/2026-08-05_fatty_liver_opt_exercise.yaml for the earlier rerun record."
