metadata:
  name: hypertension_gout_validation_case
  lm_format_version: "1.0"
  updated: 2026-07-21
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
    - name: Minghui Wu
      email: wuminghui@gzucm.edu.cn
  description:
    problem: |
      高血压合并痛风模型的文献对标验证入口：import 论文 `papers/s4/hypertension_gout/hypertension_gout_sim.yaml`
      的完整物理机制，只保留两个手工设计的指南方案（晨服HCTZ不加别嘌醇 morning_hctz_no_allo /
      晚服HCTZ+择期加别嘌醇 evening_hctz_with_allo），不包含 uricacid_optimized/weight_optimized/
      joint_optimized 三个 opt 结果回填方案——那些属于 `hypertension_gout_opt_*.yaml` 的优化合理性
      验证范围（见 `../validation_report.md` 第2节），不在本文件的文献对标验证范围内。
    result: |
      本文件保留 morning_hctz_no_allo/evening_hctz_with_allo 两个方案，对应
      `../validation_report.md` 第1节"高血压+痛风"验证点。
    limitations: 参数与已知未解决问题（时间药理学机制缺失等，详见
      `papers/s4/hypertension_gout/hypertension_gout_sim.yaml` metadata.todo）与被 import
      文件完全一致，本文件不重复记录，只收窄 plans 范围。
  tags: [hypertension, gout, validation, literature-benchmark]

imports:
  - papers/s4/hypertension_gout/hypertension_gout_sim

references:
  - "完整引用列表见 papers/s4/hypertension_gout/hypertension_gout_sim.yaml"

simulation:
  plans:
    - id: "morning_hctz_no_allo"
      label: "晨服 HCTZ 47mg，不加别嘌醇（ACR指南基准方案）"
      regimens:
        - {variable: thiazide_dose, time_start: "08:00", value: 47.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-07-01"], label: "HCTZ 晨服"}
        - {variable: caloric_deficit, time_start: "00:00", value: 400.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-07-01"], label: "每日热量缺口"}

    - id: "evening_hctz_with_allo"
      label: "晚间 HCTZ 22:00 + 第8周加别嘌醇（时间药理学方案）"
      regimens:
        - {variable: thiazide_dose, time_start: "22:00", value: 47.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-07-01"], label: "HCTZ 晚服（22:00）"}
        - {variable: allopurinol_dose, time_start: "08:00", value: 150.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-02-26", "2026-07-01"], label: "别嘌醇（第8周起）"}
        - {variable: caloric_deficit, time_start: "00:00", value: 400.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-07-01"], label: "每日热量缺口"}
