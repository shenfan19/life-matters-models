metadata:
  name: infant_breastfeeding_night_tradeoff_demo_babyband
  lm_format_version: "1.0"
  updated: 2026-08-04
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  log:
    "2026-08-05_00-00-00":
      change: "Removed resolved todo items; description gains a method field"
      reason: "Implements ADR 0141: the main file now keeps only the current state, with the debugging trail moved to history/2026-08-05_infant_breastfeeding_night_tradeoff_demo_babyband.yaml."
    "2026-08-06_00-00-00":
      change: "description rewritten into the four fields problem/method/result/limitations; problem/method/result/limitations changed to a list structure; the framework-internal code name Case C was replaced with a reference to the baseline file; hard-wrapping and non-exempt parentheses cleaned out; source publications are no longer listed as a separate citation field, and instead attached directly under each mechanism item in the baseline file's description.problem"
      reason: "Implements ADR 0142."
  description:
    problem: |
      Shares exactly the same dynamics mechanism and objective structure as
      infant_breastfeeding_night_tradeoff_demo.yaml in the same directory; see that file's
      description.problem for why joint modeling is needed, not repeated here.
      This file adds a lower-bound constraint of 80 mL a night on top of the baseline file's
      existing 150 mL-a-night nighttime budget ceiling; it answers whether adding both an upper and
      a lower bound to a give-more-is-better baby objective changes the front's structure, and in
      particular whether the single-window plan that performs best in the baseline file can still
      stay on the front.
    method: |
      The mechanism matches infant_breastfeeding_night_tradeoff_demo.yaml in the same directory;
      see that file's description.method for the coupling structure, not repeated here.
      This file adds a lower-bound constraint of 80 mL a night on top of the baseline file's
      existing 150 mL-a-night nighttime budget ceiling, testing whether, with the objective
      structure unchanged, adding just a lower bound preserves the baseline file's multi-window
      tradeoff structure.
    result: |
      After adding the 80 mL-a-night lower bound, the front still keeps the baseline file's
      tradeoff structure of two adjacent windows, but the single-window plan that performs best in
      the baseline file does not appear on this front; whether this represents a genuine exclusion
      effect or an incompletely explored search has not been confirmed.
      - 44 non-dominated solutions resulted, fewer than the population size of 60, all concentrated
        at the scale of two adjacent windows active: night_feed_1 and night_feed_2 both on, with 41
        solutions at 85 mL and 3 solutions at 90 mL.
      - lm_mother_score is constant at 29.5, exactly matching the value the baseline file's
        two-adjacent-windows pattern gives; total_absorbed_volume ranges 67525 to 69367 mL, falling
        in the upper half of the baseline file's overall range of 59142 to 69372 mL.
      - The single-window plan that performs best in the baseline file, a perfect mother
        healthy-duration score of 140 days, has a net absorbed volume in theory far above the
        11200 mL lower bound and should be feasible, but it did not appear on this run's final
        front.
      A non-dominated-solution count of 44, below the population size of 60, is itself a signal
      that the search did not explore fully, and this cannot rule out that this is a search
      completeness issue under this budget rather than this plan being genuinely infeasible; a
      larger search budget or a different random seed would be needed to confirm further, and this
      result is recorded here as an honest observation, not as a final conclusion.
    limitations: |
      Shares the same simplified boundaries as the baseline file; see that file's
      description.limitations for detail, not repeated here.
      The 80 mL-a-night lower-bound figure is itself a calibration choice, based on being below a
      single window's 90 mL upper bound, for the test purpose of checking whether the lower bound
      itself changes the front's structure; it is not a minimum-intake requirement given by an
      independent publication.
  ratings:
    importance: 0.25 - A simplified demonstration scenario, a test probe in nature, not an independent scientific case
    variable: 0.5 - Most parameters follow the existing literature anchors already used in infant_breastfeeding_sim/postpartum_recovery_sim, with the mechanism mainly inherited
    equation: 0.5 - A self-built equation reusing postpartum_recovery_sim's already-validated return-to-work ratchet and career-penalty mechanism
    simulation: 0.5 - Runs successfully and produces 44 non-dominated solutions, but the perfect-score single-window plan seen in the baseline file did not appear this time, and whether that is a search-completeness issue or a genuine exclusion effect has not been confirmed
    optimization: 0.25 - lm_mother_score is constant across every solution, leaving it uncertain whether the baby-side tradeoff structure genuinely changed after adding the lower-bound constraint
    innovation: 0.25 - A probe-natured variant adding a two-sided constraint to an existing model; the contribution is testing, not a new mechanism
    confidence: 0.0 - A simplified demonstration scenario, not yet compared against any independent literature target value, validating only how a two-sided nighttime budget constraint affects the decision-variable structure

# -- Variables ---------------------------------------------------------------
variables:

  baby_weight_fixed:
    type: parameter
    value: 3.3
    unit: kg
    description: >
      A fixed birth weight; this demonstration scenario does not model weight growth. After the
      simulation window was extended from 14 to 140 days on 2026-08-02, this simplification's
      distortion is more pronounced than in the original version (an infant's weight would actually
      grow substantially over 20 weeks), but this file's total_absorbed_volume objective is
      inherently a relative comparison proxy for whether the decision-variable structure can
      produce a non-degenerate front, not an absolute growth-outcome judgment, so the fixed weight
      is kept for consistency with the original 14-day version and to avoid the weight-calibration
      issue already known in the original 90-day model.

  stomach_capacity_per_kg:
    type: parameter
    value: 30.0
    unit: mL/kg
    description: "Stomach capacity per kg of body weight, following the original file's parameter."
    reference: "Scammon & Doyle (1920) AJDC 20:516-538."

  gastric_emptying_rate:
    type: parameter
    value: 0.46
    unit: 1/hour
    description: "The first-order gastric-emptying rate constant, following the original file's parameter."
    reference: "Cavell B (1981) Acta Paediatr Scand 70:639-641."

  sleep_disruption_per_nightfeed:
    type: parameter
    value: 0.75
    unit: hour
    description: "The effective sleep time lost per nighttime feed, following the original file's parameter."
    reference: "Doan T et al. (2007) J Perinat Neonatal Nurs 21(3):200-206."

  sleep_recovery_rate:
    type: parameter
    value: 0.083
    unit: hour/hour
    description: "The natural sleep-debt recovery rate per hour, following the original file's parameter."
    reference: "Borbely AA (1982) Hum Neurobiol 1(3):195-204."

  sleep_fragmentation_quality_loss:
    type: parameter
    value: 0.4
    unit: dimensionless
    bounds: [0, 0.8]
    description: >
      The fraction by which nighttime-feeding-induced sleep fragmentation discounts the recovery
      efficiency of "remaining sleep"; adapted 2026-08-02 from the already-validated same-named
      mechanism and the same value (0.4) in postpartum_recovery_sim.yaml (S4), a calibration choice
      rather than a direct literature measurement, as already noted in the original file.
    reference: "Bonnet MH (1985) Sleep 8(1):11-19; Insana SP & Montgomery-Downs HE (2013) Infant Behav Dev 36(4):554-560"

  # -- The mother's career-development psychological dimension --------------------
  return_to_work_trigger:
    type: input
    value: 0.0
    unit: dimensionless
    bounds: [0.0, 1.0]
    description: >
      A return-to-work trigger flag (a T4 decision variable: only the trigger's start date is
      searched, with the value itself fixed and not searched). It triggers once a day at midnight
      starting from the date optimization finds; once triggered, the return_to_work_ratchet
      equation locks at_work at 1 (it does not reset when the trigger window ends), representing
      that returning to work is a one-time state transition, not a reversible event.

  at_work:
    type: state
    value: 0.0
    unit: dimensionless
    bounds: [0, 1]
    description: "The ratchet state for whether the mother has returned to work (once it becomes 1, it stays 1 thereafter; see return_to_work_ratchet)."

  leave_length_days:
    type: state
    value: 0.0
    unit: day
    description: >
      The actual number of leave days: accumulated day by day while at_work=0, and frozen once
      at_work becomes 1; the frozen value is this run's "how many days of leave were actually taken
      before returning to work," and it also drives both the maternal_depression_index and
      career_penalty_index curves.

  leave_threshold_days:
    type: parameter
    value: 84.0
    unit: day
    description: >
      12 postpartum weeks (84 days), the evidence-based threshold at which mother-and-infant
      outcomes are best, serving both as maternal_depression_index's endpoint for its decline and
      career_penalty_index's starting point for its rise.
    reference: "Whitney MD et al. (2023) Matern Child Health J 27(8):1308-1323"

  depression_penalty_max:
    type: parameter
    value: 0.79
    unit: dimensionless
    description: >
      maternal_depression_index's peak as leave length approaches 0, taken directly from the real
      measured value Chatterji and Markowitz (2012) report: leave under 12 weeks corresponds to a
      +0.79-point change on the CES-D 12-item depression scale. maternal_depression_index
      interpolates linearly from this peak down to 0 as leave runs from 0 to 84 days, an
      engineering approximation converting that publication's single categorical measurement point
      into a continuous curve (the publication itself does not supply continuous dose-response
      trajectory data); it is not a continuous curve extended from an independent measurement.
    reference: "Chatterji P & Markowitz S (2012) J Ment Health Policy Econ 15(2):61-76"

  career_penalty_rate_per_day:
    type: parameter
    value: 0.01
    unit: 1/day
    description: >
      Once leave exceeds leave_threshold_days, career_penalty_index's increment per additional day
      of leave. A calibration choice, not a direct literature measurement: Kleven et al. (2019) use
      Danish administrative data to demonstrate a real, sustained long-term earnings loss for women
      after childbirth (the "child penalty"), supplying the literature basis for the existence of
      the mechanism that extending a career interruption carries a real economic cost, but that
      publication gives no slope for how much cost each additional day of leave adds; the value used
      here only represents that the magnitude exists and the direction is correct, not an already
      calibrated real slope.
    reference: "A calibration choice (see description); the mechanism's existence is based on Kleven H et al. (2019) Am Econ J Appl Econ 11(4):181-209"

  maternal_depression_index:
    type: state
    value: 0.79
    unit: dimensionless
    description: >
      A short-leave depression-risk index (an approximation of a CES-D scale score): declines
      linearly to 0 as leave_length_days runs from 0 to leave_threshold_days, then stays at 0 (not
      a binary threshold; the risk declines continuously with each extra day of leave, avoiding a
      repeat of the original 90-day model's problem where a WHO binary threshold degenerated the
      front to a single point).
    reference: "Chatterji P & Markowitz S (2012) J Ment Health Policy Econ 15(2):61-76"

  career_penalty_index:
    type: state
    value: 0.0
    unit: dimensionless
    description: >
      A career-cost index: once leave_length_days exceeds leave_threshold_days, the excess
      accumulates continuously, multiplied by career_penalty_rate_per_day; it stays at 0 before
      that. It moves opposite to maternal_depression_index, together forming leave length's real
      two-sided tradeoff, rather than a monotonic "longer leave is always better" relationship.
    reference: "A calibration choice; the mechanism's existence is based on Kleven H et al. (2019)"

  work_daytime_retention_factor:
    type: parameter
    value: 0.7
    unit: dimensionless
    bounds: [0, 1]
    description: >
      After returning to work, the fraction of daytime breastfeeding or pumping still achievable
      (relative to 100% before returning). A calibration choice, not a direct literature
      measurement, with its qualitative direction supported by a cohort study's finding that
      full-time work and an earlier return to work markedly reduce breastfeeding duration and
      frequency (Determinants of breastfeeding initiation and cessation among employed mothers). It
      lets the return-to-work timing decision genuinely couple with the existing nighttime feeding
      decision space: returning to work earlier lowers daytime milk volume, forcing more nighttime
      feeds to maintain the total intake.
    reference: "A calibration choice; qualitative support noted in the description"

  # Fixed daytime feeding (not a decision variable, declared via a no-optimize-block entry in startpoint.regimens)
  breast_milk_day:
    type: input
    value: 100.0
    unit: mL
    description: "The fixed daytime feeding amount, not a decision variable."

  effective_breast_milk_day:
    type: state
    value: 0.0
    unit: mL
    description: >
      The actual effective daytime breastfeeding amount (a pulse, with the same semantics as
      breast_milk_day): equals breast_milk_day while at_work=0, and is discounted by
      work_daytime_retention_factor once at_work=1. stomach_intake_and_overflow and
      absorbed_volume_tracking use this variable instead of breast_milk_day, so the return-to-work
      timing genuinely affects the baby-side intake outcome.

  # The 4 nighttime candidate windows, independent decision variables, 0 means skipped
  night_feed_1:
    type: input
    value: 0.0
    unit: mL
    bounds: [0, 90]
    description: "Nighttime candidate feeding window 1 (23:00). A value of 0 means skipped this time."

  night_feed_2:
    type: input
    value: 0.0
    unit: mL
    bounds: [0, 90]
    description: "Nighttime candidate feeding window 2 (01:00). A value of 0 means skipped this time."

  night_feed_3:
    type: input
    value: 0.0
    unit: mL
    bounds: [0, 90]
    description: "Nighttime candidate feeding window 3 (03:00). A value of 0 means skipped this time."

  night_feed_4:
    type: input
    value: 0.0
    unit: mL
    bounds: [0, 90]
    description: "Nighttime candidate feeding window 4 (05:00). A value of 0 means skipped this time."

  night_absorbed_volume_budget:
    type: parameter
    value: 150.0
    unit: mL
    description: >
      The upper-bound budget on the sum of net absorbed volume across the four nighttime candidate
      windows, exactly matching Case C (the baseline file in the same directory); see that file's
      same-named parameter's description for the basis of this value. This case (Case D) adds a
      lower-bound constraint on top of it; see night_absorbed_volume_floor.
    reference: "Rios-Leyvraz M & Yao Q (2023) Breastfeed Med 18(3):188-197, DOI 10.1089/bfm.2022.0281; La Leche League International's breastfeeding-frequency FAQ"

  night_absorbed_volume_floor:
    type: parameter
    value: 80.0
    unit: mL
    description: >
      A lower-bound budget on the sum of net absorbed volume across the four nighttime candidate
      windows, newly added in this case (Case D), together with the existing 150 mL/night upper
      bound forming a "daily two-sided constraint." 80 mL is below a single window's physical
      upper bound of 90 mL; the test purpose is to check the hypothesis that, when a lower bound
      exists but is not overly tight, the front's structure can still preserve the single-window
      plan Case C already found. This is a calibration choice (a test point), not a minimum-intake
      requirement given by an independent publication.
    reference: "A calibration choice (see description)"

  baby_stomach_volume:
    type: state
    value: 0.0
    unit: mL
    description: "The baby's current stomach volume of milk."

  total_absorbed_volume:
    type: state
    value: 0.0
    unit: mL
    description: "The cumulative absorbed milk volume (excluding overflow), a simplified proxy for the baby-side objective."

  night_absorbed_volume:
    type: state
    value: 0.0
    unit: mL
    description: >
      The simulation window's cumulative sum of net absorbed volume (after subtracting overflow due
      to stomach capacity) across the four nighttime candidate windows (night_feed_1..4); used only
      to constrain the total nighttime budget (both the upper and lower bounds) in
      optimization.constraints, not an independent baby-side objective.

  mother_sleep_debt:
    type: state
    value: 0.0
    unit: hour
    description: "The mother's accumulated sleep debt, following the original file's dynamics."

  lm_mother_score:
    type: state
    value: 0.0
    unit: hour
    description: "The mother's healthy duration: the accumulated hours with sleep debt below 4 hours."

# -- Dynamics equations --------------------------------------------------------
equations:

  return_to_work_ratchet:
    step_unit: hour
    priority: 50
    dynamics:
      at_work: "max(at_work, 1.0 if return_to_work_trigger > 0 else 0.0)"
    description: >
      Returning to work is a one-time state transition: return_to_work_trigger fires daily starting
      from the date T4 searches for, and once at_work is set to 1 it never resets (a ratchet),
      representing that this is an irreversible event, not a repeatable switch.

  leave_length_tracking:
    step_unit: day
    priority: 45
    dynamics:
      leave_length_days: "leave_length_days + step * (1 if at_work < 0.5 else 0)"
    description: "Accumulates leave days: adds up day by day while at_work=0, and automatically freezes once it becomes 1 (the increment condition is then always 0)."

  psych_index_update:
    step_unit: day
    priority: 40
    dynamics:
      maternal_depression_index: "max(0.0, depression_penalty_max * (1.0 - leave_length_days / leave_threshold_days))"
      career_penalty_index: "max(0.0, leave_length_days - leave_threshold_days) * career_penalty_rate_per_day"
    description: >
      Two continuous curves, both a direct function of leave_length_days (memoryless, recomputed
      each step from the current leave_length_days, so both naturally freeze at their final value
      once leave_length_days freezes): the shorter the leave, the higher the depression risk
      (declining linearly to 0 at leave_threshold_days), and the career cost rises continuously once
      leave exceeds leave_threshold_days.
    reference: "Chatterji P & Markowitz S (2012); Whitney MD et al. (2023); Kleven H et al. (2019)"

  effective_daytime_feed_calc:
    step_unit: hour
    priority: 12
    dynamics:
      effective_breast_milk_day: >
        (breast_milk_day * (1.0 if at_work < 0.5 else work_daytime_retention_factor))
        if breast_milk_day > 0 else 0
    description: >
      The actual effective daytime breastfeeding amount, nonzero only at a feeding pulse moment
      (breast_milk_day>0) and 0 at every other step (keeping the same pulse semantics as
      breast_milk_day, avoiding an accidental nonzero value being injected at a non-feeding hour).
      Priority 12, executing before absorbed_volume_tracking (11) and stomach_intake_and_overflow
      (10), both of which use this variable instead of breast_milk_day.

  absorbed_volume_tracking:
    priority: 11
    dynamics:
      total_absorbed_volume: >
        total_absorbed_volume + effective_breast_milk_day + night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - max(0.0, baby_stomach_volume + effective_breast_milk_day + night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - stomach_capacity_per_kg * baby_weight_fixed)
    description: >
      Records a feeding pulse's absorbed amount: priority 11, executing before
      stomach_intake_and_overflow (priority 10), reading baby_stomach_volume's old value from
      before this step's update, avoiding double-counting the overflow with the stomach-volume
      update equation. Changed 2026-08-02 to use effective_breast_milk_day (discounted after
      returning to work) instead of breast_milk_day.

  night_absorbed_volume_tracking:
    priority: 11
    dynamics:
      night_absorbed_volume: >
        (night_absorbed_volume + (night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - max(0.0, baby_stomach_volume + night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - stomach_capacity_per_kg * baby_weight_fixed)))
        if (night_feed_1 > 0 or night_feed_2 > 0 or night_feed_3 > 0 or night_feed_4 > 0) else night_absorbed_volume
    description: >
      Accumulates the net absorbed amount across the four nighttime windows (after subtracting
      stomach-capacity overflow), at the same priority as absorbed_volume_tracking, reading
      baby_stomach_volume's old value from before this step's update. The whole update expression
      is gated by an if (whether a nighttime pulse occurred): it accumulates the net absorbed amount
      on a nighttime pulse, and leaves night_absorbed_volume unchanged at every other step
      (including a daytime pulse or an empty step); it cannot be written as an else 0, since that
      would zero out the accumulated value every step.

  stomach_intake_and_overflow:
    priority: 10
    dynamics:
      baby_stomach_volume: >
        baby_stomach_volume + effective_breast_milk_day + night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - max(0.0, baby_stomach_volume + effective_breast_milk_day + night_feed_1 + night_feed_2 + night_feed_3 + night_feed_4
        - stomach_capacity_per_kg * baby_weight_fixed)
    description: "A feeding pulse: added to the stomach, with the part exceeding stomach capacity recorded as overflow (not counted as absorbed). Changed 2026-08-02, as above, to use effective_breast_milk_day."

  gastric_emptying:
    step_unit: hour
    priority: 0
    dynamics:
      baby_stomach_volume: "max(0.0, baby_stomach_volume - gastric_emptying_rate * baby_stomach_volume * step)"
    description: "First-order gastric emptying, following the original file's parameter."

  maternal_sleep_tracking:
    step_unit: hour
    priority: 20
    dynamics:
      mother_sleep_debt: >
        max(0.0, mother_sleep_debt - sleep_recovery_rate * step
        + sleep_disruption_per_nightfeed * (1 + sleep_fragmentation_quality_loss)
        * (1 if (night_feed_1 > 0 or night_feed_2 > 0 or night_feed_3 > 0 or night_feed_4 > 0) else 0))
    description: >
      Sleep-debt dynamics: any nonzero feeding in any nighttime window this step counts one waking
      cost, following the original file's single-cost coefficient; a sleep-fragmentation
      quality-loss multiplier was added 2026-08-02 (adapted from postpartum_recovery_sim.yaml,
      citing Bonnet 1985).

  lm_mother_score_update:
    step_unit: hour
    priority: 30
    dynamics:
      lm_mother_score: "lm_mother_score + step / 24.0 * (1 if mother_sleep_debt <= 4.0 else 0)"
    description: "Accumulates the mother's healthy duration (in days), using the original file's 4.0h threshold."

# -- Simulation setup ----------------------------------------------------------
simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-01-01"
  end_date: "2026-05-21"
  output_types: [input, state]
  plans:
    - id: "no_night_feeds"
      label: "All nighttime feeds skipped (a control: daytime feeding only), returning to work at a fixed 84 days"
      regimens:
        - {variable: breast_milk_day, time_start: "07:00", value: 100.0, label: "Daytime 7:00"}
        - {variable: breast_milk_day, time_start: "11:00", value: 100.0, label: "Daytime 11:00"}
        - {variable: breast_milk_day, time_start: "15:00", value: 100.0, label: "Daytime 15:00"}
        - {variable: breast_milk_day, time_start: "19:00", value: 100.0, label: "Daytime 19:00"}
        - {variable: return_to_work_trigger, time_start: "00:00", value: 1.0, date_range: ["2026-03-26", "2026-05-21"], label: "Returning to work (fixed at day 84, 12 weeks)"}

optimization:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-05-21"
  step_size:
    value: 1
    unit: hour

  constraints:
    - variable: night_absorbed_volume
      condition: "<= 21000"
      metric: final
      type: hard
      description: >
        The nighttime net-absorbed-volume budget's upper bound (Case D, matching Case C):
        150 mL/night x 140 days = 21000 mL, with the calibration basis in
        night_absorbed_volume_budget.
    - variable: night_absorbed_volume
      condition: ">= 11200"
      metric: final
      type: hard
      description: >
        The nighttime net-absorbed-volume budget's lower bound (newly added in Case D):
        80 mL/night x 140 days = 11200 mL, with the calibration basis in
        night_absorbed_volume_floor.

  objectives:
    - variable: total_absorbed_volume
      metric: final
      direction: maximize
      description: "Maximizing the cumulative absorbed milk volume at day 140 (a simplified baby-side proxy)"
    - variable: lm_mother_score
      metric: final
      direction: maximize
      description: "Maximizing the mother's healthy duration (days) at day 140"
    - variable: maternal_depression_index
      metric: final
      direction: minimize
      description: "Minimizing the short-leave depression-risk index"
    - variable: career_penalty_index
      metric: final
      direction: minimize
      description: "Minimizing the career-cost index, opposite in direction to the previous objective"

  startpoint:
    regimens:
      - {variable: breast_milk_day, time_start: "07:00", value: 100.0, label: "Daytime 7:00 (a fixed background quantity)"}
      - {variable: breast_milk_day, time_start: "11:00", value: 100.0, label: "Daytime 11:00 (a fixed background quantity)"}
      - {variable: breast_milk_day, time_start: "15:00", value: 100.0, label: "Daytime 15:00 (a fixed background quantity)"}
      - {variable: breast_milk_day, time_start: "19:00", value: 100.0, label: "Daytime 19:00 (a fixed background quantity)"}
      - variable: night_feed_1
        time_start: "23:00"
        label: "Nighttime 23:00 (a T1 decision variable)"
        optimize:
          value: [0.0, 90.0]
          value_step: 5
      - variable: night_feed_2
        time_start: "01:00"
        label: "Nighttime 01:00 (a T1 decision variable)"
        optimize:
          value: [0.0, 90.0]
          value_step: 5
      - variable: night_feed_3
        time_start: "03:00"
        label: "Nighttime 03:00 (a T1 decision variable)"
        optimize:
          value: [0.0, 90.0]
          value_step: 5
      - variable: night_feed_4
        time_start: "05:00"
        label: "Nighttime 05:00 (a T1 decision variable)"
        optimize:
          value: [0.0, 90.0]
          value_step: 5
      - variable: return_to_work_trigger
        time_start: "00:00"
        label: "Return-to-work timing (a T4 decision variable)"
        optimize:
          value: [0.9, 1.0]
          date_range:
            - ["2026-01-15", "2026-04-15"]   # the start-date search window: day 14 to day 104
            - ["2026-05-21", "2026-05-21"]   # a fixed end date: the last day of the simulation

  algorithm:
    population_size: 60
    n_generations: 60
