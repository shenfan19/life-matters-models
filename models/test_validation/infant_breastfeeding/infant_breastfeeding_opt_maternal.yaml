metadata:
  name: infant_breastfeeding_opt_maternal
  lm_format_version: "1.0"
  description:
    problem: |
      产后与母亲健康单学科视角优化，只最大化 lm_mother_score，即母亲睡眠债达标时长，不考虑宝宝体重达标，代表如果只听产后母亲休养建议、不管宝宝生长诉求，单学科最优会推到什么程度。
      与 infant_breastfeeding_opt_infant.yaml 的儿科婴儿生长单学科视角、infant_breastfeeding_opt_joint.yaml 的联合多学科视角并列对比，才能体现联合优化揭示的权衡区间；完整物理机制、来源文献与对比仿真见 imports 的 infant_breastfeeding_sim.yaml 的 description.problem，本文件不重复列出，只把优化目标收窄为产后母亲健康单学科视角。
    method: |
      机制与 infant_breastfeeding_sim.yaml 相同，耦合结构说明见该文件 description.method，此处不重复。
      本文件只把优化目标收窄为单一学科视角，仅最大化 lm_mother_score，决策变量与搜索空间与 infant_breastfeeding_opt_infant.yaml、infant_breastfeeding_opt_joint.yaml 完全一致，便于三者并列比较。
    result: |
      母亲健康单学科最优解的 lm_mother_score 收敛到90分，即达到该轮阈值下的满分上限，两次独立重跑逐位一致，50个候选解全部命中上限。
    limitations: |
      本结果建立在2026-07-28母亲侧健康阈值修改之前的模型版本上，即睡眠债判定阈值从15小时改为4小时之前，尚未用当前阈值重新验证，恒为满分这一结果的有效性因此存疑。
      机制层面的局限见 imports 的 infant_breastfeeding_sim.yaml 的 description.limitations，此处不重复。
  log:
    "2026-08-05_00-00-00":
      change: "results 精简为 2026-07-10 的收敛结果，移除已确认的 24 倍单位放大历史记录 historical_stale_from_2026-06-19；description 补充 method 字段；status 如实标注本结果早于 2026-07-28 阈值修改"
      reason: "落实 ADR 0141，主文件只保留当前状态并诚实标注结果的有效期，调试脉络转移至 history/2026-08-05_infant_breastfeeding_opt_maternal.yaml。"
    "2026-08-06_00-00-00":
      change: "description 按 problem/method/result/limitations 四字段重写，新增 result/limitations 字段，把结果早于阈值修改这一有效性提示从 optimization.results.status 提升到 description.limitations，problem/method 改为列表结构，清理非豁免括号与破折号，来源文献的指向从单独的 citation 字段并入 problem 里对 infant_breastfeeding_sim.yaml description.problem 的引用"
      reason: "落实 ADR 0142，结果有效期这类真实的置信度提示应该在读者最先看到的 description 里出现，不应该只藏在 optimization.results.status 这一层。"

imports:
  - ./infant_breastfeeding_sim

references:
  - "见 ./infant_breastfeeding_sim.yaml"

optimization:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-04-01"
  step_size:
    value: 1
    unit: hour

  objectives:
    - variable: lm_mother_score
      metric: final
      direction: maximize
      description: "母亲健康单学科目标：仅最大化妈妈睡眠债达标时长，不权衡宝宝体重达标"

  constraints:
    - variable: baby_weight
      condition: ">= 3.0"
      type: hard
      description: "宝宝体重不低于2.7kg（出生体重90%），即使单学科只看母亲睡眠，仍保留这条安全底线，否则不是临床上可讨论的方案"

  algorithm:
    population_size: 50
    n_generations: 80
    seed: 19

  # 与 infant_breastfeeding_opt_joint.yaml 完全相同的决策变量结构，只换目标函数，
  # 这样三个场景的搜索空间一致，结果才可比。
  startpoint:
    regimens:
      - variable: breast_milk
        time_start: "07:00"
        time_end: "07:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "白天喂奶 7:00"
        optimize:
          value: [20, 150]

      - variable: breast_milk
        time_start: "10:00"
        time_end: "10:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "白天喂奶 10:00"
        optimize:
          value: [20, 150]

      - variable: breast_milk
        time_start: "13:00"
        time_end: "13:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "白天喂奶 13:00"
        optimize:
          value: [20, 150]

      - variable: breast_milk
        time_start: "16:00"
        time_end: "16:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "白天喂奶 16:00"
        optimize:
          value: [20, 150]

      - variable: breast_milk
        time_start: "19:00"
        time_end: "19:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "白天喂奶 19:00"
        optimize:
          value: [20, 150]

      - variable: breast_milk
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "夜间喂奶一（前半夜）"
        optimize:
          value: [10, 120]
          time_start: ["21:00", "23:00"]
          time_step: "1h"

      - variable: breast_milk
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "夜间喂奶二（后半夜）"
        optimize:
          value: [10, 120]
          time_start: ["02:00", "05:00"]
          time_step: "1h"

  results:
    status: "本结果建立在 2026-07-28 母亲侧健康阈值修改（mother_sleep_debt<=15.0 改为 <=4.0）之前的模型版本上，尚未用当前阈值重新验证；2026-07-10 与 2026-07-14 两次独立重跑在旧阈值下逐位一致（best_f 恒为 90，50 个候选解全部命中上限）。"
    generated_at: "2026-07-10"
    method: nsga2
    population_size: 50
    n_generations: 80
    n_solutions: 50
    recommended:
      x: [52.074504378392724, 29.747907828243804, 93.08527500197914, 35.19215182364666, 112.66961137856431, 56.950529611920885, 1.019404350872441, 25.905053208289445, 1.9328254362860577]
      f: [90.00000000000149]
    note: "在旧阈值（15小时）下该目标在搜索空间内高度退化，只要保留约2次夜间喂奶、单次喂奶量在合理范围内即可几乎处处达成，真正的张力来自婴儿生长侧（见 infant_breastfeeding_opt_infant.yaml）。阈值已改为4小时后这一退化结论是否仍然成立需要重新跑 --opt 确认。recommended 取候选解中的第一个，非唯一最优。更早的重跑记录见 history/2026-08-05_infant_breastfeeding_opt_maternal.yaml。"
