    status: "The first NSGA-II run on 2026-08-04 (pop=60/gen=60/seed=19). 60 non-dominated
      solutions, with night_feed_1 (23:00) and night_feed_4 (05:00), the pair of the four candidate
      windows furthest apart, active in all 60 solutions, and night_feed_2/night_feed_3 always at 0.
      But unlike the corner convergence recorded on 2026-08-03 in the baseline file (the same
      directory's infant_breastfeeding_night_tradeoff_demo.yaml), this is not converging to the
      search bounds: night_feed_1 takes continuous values within [45,70] and night_feed_4 within
      [50,85], with about 50 distinct specific mL combinations among the 60 solutions, genuinely
      continuously distributed solutions. But the objective space itself is highly degenerate:
      lm_mother_score is constant at 31.125 across all 60 solutions, maternal_depression_index only
      takes 0 or 0.009404761904755381, and career_penalty_index only takes 0 or about 0 (8.1e-15,
      floating-point noise); the three objectives effectively have only two combinations, not a rich
      continuous front. Diagnosis: once total_absorbed_volume changed from a maximize objective to
      a >=60000 lower-bound constraint, more milk volume is no longer a competitive pressure, and
      the optimizer only needs to satisfy the lower bound at the least sleep-debt cost; with 23:00
      and 05:00 six hours apart, the sleep-debt floor's truncation effect in the
      max(0.0, ...) term of the maternal_sleep_tracking equation makes this far-apart pair of
      windows cheaper in debt than an adjacent pair (such as 23:00+01:00, which the baseline file
      recorded as giving 29.5): the debt has more time to decay toward 0 between the two feeds,
      wasting less recovered capacity to the truncation. A single-window plan could in principle
      reach lm_mother_score's perfect score of 140, but under the 60000 mL lower-bound constraint it
      would need to push the return-to-work timing well away from 84 days to make up the total
      volume, which would markedly raise career_penalty_index or maternal_depression_index, and it
      is dominated by a plan near 2 windows plus day 84, so the single-window plan does not survive
      onto the final front. The decoded return-to-work timing (T4) lands at leave_length_days=83-84
      days, closely tracking Whitney et al. (2023)'s evidence-based 12-week threshold, because
      maternal_depression_index and career_penalty_index are each a monotonic, oppositely directed
      function of leave_length_days with 84 days as the dividing point, so the only window where
      both can be near 0 at once sits right at that dividing point; this is determined by the
      model's own structure and is consistent with the systematic scan's conclusion already
      established on 2026-08-03, not a new finding from this change."
