metadata:
  name: banister_validation_case
  lm_format_version: "1.0"
  updated: 2026-07-21
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      The literature-benchmark validation entry point for the Banister fitness-fatigue model: imports
      the complete physical mechanism (variables/equations, Morton 1990 parameters) from the paper
      `papers/lm_format/banister/banister_validation.yaml`, keeping only the plan that directly
      reproduces the literature, and excluding an opt-derived or improved plan, which falls under
      `banister_opt.yaml`'s optimization-plausibility validation scope (see section 2 of
      `../validation_report.md`) and outside this file's literature-benchmark validation scope.
    result: |
      This file keeps only the daily_training plan (Morton 1990's original two-segment protocol,
      w=50 AU/day for 16 weeks plus w=10 AU/day for a 4-week taper), corresponding to the "Training
      Adaptation-Fatigue" validation point in section 1 of `../validation_report.md`. On 2026-07-21,
      this plan's training_load values were reverted from the previous three-segment 75/30/60 form
      back to the literature's original values; see the resolved record in
      `papers/lm_format/banister/banister_validation.yaml`'s metadata.todo for detail.
    limitations: The parameters, bounds, and unit conversions match `papers/lm_format/banister/banister_validation.yaml`
      exactly; this file does not re-maintain the physical mechanism and only narrows the plans.
  tags: [banister, validation, literature-benchmark]

imports:
  - papers/lm_format/banister/banister_validation

references:
  - "The complete reference list is in papers/lm_format/banister/banister_validation.yaml"

simulation:
  plans:
    - id: "daily_training"
      label: "Daily training (7 days/week, Morton 1990's original literature protocol, w=50/10)"
      regimens:
        - {variable: training_load, time_start: "09:00", value: 50.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-04-22"], label: "Buildup phase, w=50 AU/day (weeks 1-16, Morton 1990's original value)"}
        - {variable: training_load, time_start: "09:00", value: 10.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-04-23", "2026-05-20"], label: "Taper, w=10 AU/day (weeks 17-20, Morton 1990's original value)"}
