metadata:
  name: banister_opt
  lm_format_version: "1.0"
  updated: 2026-05-22
  description:
    problem: "Banister 模型 K×4 行为优化扩展，涵盖训练负荷、训练频率与减量时机三个决策维度，论文当前文本标注为后续工作范围，不在 §6.2 报告结果。完整物理机制与对比仿真见 imports 的 banister_validation。"
    method: "机制与 banister_validation.yaml 相同，完整机制列表见该文件 description.method；本文件只把训练负荷、训练频率、减量起始时机、维持期负荷这几个决策变量收窄为一次 K×4 多目标优化，同时最大化 performance、最小化 fatigue。"
  log:
    "2026-08-05_00-00-00":
      change: "results 精简为 2026-07-10 的最终收敛结果，移除已确认不可复现的 historical_stale_from_2026-06-15 子块，status 文本去除过程叙述；description 补充 method 字段"
      reason: "落实 ADR 0141，主文件只保留当前有效结果，调试脉络转移至 history/2026-08-05_banister_opt.yaml。"
    "2026-08-13_00-00-00":
      change: "新增 Halson SL (2014) 引用"
      reason: "该引用原本挂在 banister_validation.yaml，但描述的是本文件训练频率决策维度的文献依据，本文件自己的 references 之前只有一条占位符，属孤儿引用遗留，随本文件归档至 test_validation 一并迁移过来。"

imports:
  - papers/lm_format/banister/banister_validation

references:
  - "见 ./banister_validation.yaml（体能/疲劳时间常数、增益系数、基础表现等共享物理机制的引用）"
  - citation: "Halson SL (2014) Monitoring training load to understand fatigue in athletes. Sports Med 44(Suppl 2):139-147"
    description: "训练频率，即每周训练天数，改变疲劳积累节奏这一定性机制的文献依据，用于本文件训练频率决策维度的设计。"

optimization:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-04-22"
  step_size:
    value: 1
    unit: hour

  objectives:
    - variable: performance
      direction: maximize
      metric: final
      description: 最大化第16周末综合表现（AU）
    - variable: fatigue
      direction: minimize
      metric: final
      description: 最小化训练结束时疲劳积累（AU）
  constraints:
    - variable: fatigue
      condition: "<= 2500"
      type: hard
      description: 疲劳上限 2500 AU，防止过度训练（Banister模型AU量纲，与训练负荷相称）
    - variable: performance
      condition: ">= 480"
      type: soft
      metric: final
      description: 第16周末表现不低于基础值 480 AU（训练初期fatigue快于fitness积累，performance会先降后升，约束仅检查终值）

  startpoint:
    regimens:
      # T1: 渐进期负荷强度（每日，固定区间）
      - variable: training_load
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-03-11"]
        label: "渐进期负荷"
        optimize:
          value: [40.0, 120.0]

      # T1+T3: 渐进期训练频率（几天/周）——休息日 training_load=0，促进疲劳恢复
      # 科学意义：5天/周 vs 7天/周 改变疲劳积累节奏（Halson 2014）
      - variable: training_load
        time_start: "09:00"
        time_end: "09:00"
        date_range: ["2026-01-01", "2026-03-11"]
        label: "渐进期训练频率（天/周）"
        optimize:
          value: [50.0, 110.0]
          days_pool: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          days_n: [5, 7]

      # T1+T4: 减量期起始时机（在第7-12周之间搜索最优减量点）
      # 科学意义：减量早1-2周 vs 文献标准第11周是否能提高峰值表现？
      - variable: training_load
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "减量期起始时机与负荷"
        optimize:
          value: [0.0, 45.0]
          date_range: [["2026-02-19", "2026-03-25"], ["2026-04-22", "2026-04-22"]]

      # T1: 维持期负荷（减量后的巩固期）
      - variable: training_load
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-03-26", "2026-04-22"]
        label: "维持期负荷"
        optimize:
          value: [0.0, 100.0]

  algorithm:
    population_size: 60
    n_generations: 120
    seed: 19

  results:
