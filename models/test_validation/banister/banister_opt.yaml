metadata:
  name: banister_opt
  lm_format_version: "1.0"
  updated: 2026-05-22
  description:
    problem: "A K×4 behavioral optimization extension of the Banister model, covering three decision dimensions, training load, training frequency, and taper timing; the paper's current text marks this as follow-on work, not reported in section 6.2. See the imported banister_validation for the complete physical mechanism and the comparison simulation."
    method: "The mechanism matches banister_validation.yaml; see that file's description.method for the complete mechanism list. This file narrows training load, training frequency, taper start timing, and maintenance-phase load into a single K×4 multi-objective optimization, jointly maximizing performance and minimizing fatigue."
  log:
    "2026-08-05_00-00-00":
      change: "results streamlined to the final converged result from 2026-07-10, removing the confirmed-unreproducible historical_stale_from_2026-06-15 sub-block, with process narrative removed from the status text; description gains a method field"
      reason: "Implements ADR 0141: the main file now keeps only the currently valid result, with the debugging trail moved to history/2026-08-05_banister_opt.yaml."
    "2026-08-13_00-00-00":
      change: "Added a citation to Halson SL (2014)"
      reason: "This citation had originally been attached to banister_validation.yaml, but it actually describes the literature basis for this file's own training-frequency decision dimension; this file's own references previously carried only a single placeholder, an orphaned citation, so it was migrated here when this file was archived to test_validation."

imports:
  - papers/lm_format/banister/banister_validation

references:
  - "See ./banister_validation.yaml for citations covering the shared physical mechanism (the fitness/fatigue time constants, gain coefficients, baseline performance, etc.)"
  - citation: "Halson SL (2014) Monitoring training load to understand fatigue in athletes. Sports Med 44(Suppl 2):139-147"
    description: "The literature basis for the qualitative mechanism that training frequency, the number of training days per week, changes the pace of fatigue accumulation, used in designing this file's training-frequency decision dimension."

optimization:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-04-22"
  step_size:
    value: 1
    unit: hour

  objectives:
    - variable: performance
      direction: maximize
      metric: final
      description: Maximizing overall performance (AU) at the end of week 16
    - variable: fatigue
      direction: minimize
      metric: final
      description: Minimizing accumulated fatigue (AU) at the end of training
  constraints:
    - variable: fatigue
      condition: "<= 2500"
      type: hard
      description: A fatigue ceiling of 2500 AU, preventing overtraining (the Banister model's AU dimension, proportionate to training load)
    - variable: performance
      condition: ">= 480"
      type: soft
      metric: final
      description: Performance at the end of week 16 not below the baseline of 480 AU (fatigue accumulates faster than fitness early in training, so performance dips before rising; the constraint checks only the final value)

  startpoint:
    regimens:
      # T1: buildup-phase load intensity (daily, a fixed interval)
      - variable: training_load
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-01-01", "2026-03-11"]
        label: "Buildup-phase load"
        optimize:
          value: [40.0, 120.0]

      # T1+T3: buildup-phase training frequency (days per week); training_load=0 on a rest day promotes fatigue recovery
      # Scientific significance: 5 days/week versus 7 days/week changes the pace of fatigue accumulation (Halson 2014)
      - variable: training_load
        time_start: "09:00"
        time_end: "09:00"
        date_range: ["2026-01-01", "2026-03-11"]
        label: "Buildup-phase training frequency (days/week)"
        optimize:
          value: [50.0, 110.0]
          days_pool: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          days_n: [5, 7]

      # T1+T4: taper-phase start timing (searching for the optimal taper point between weeks 7 and 12)
      # Scientific significance: does tapering 1-2 weeks earlier than the literature standard of week 11 improve peak performance?
      - variable: training_load
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Taper-phase start timing and load"
        optimize:
          value: [0.0, 45.0]
          date_range: [["2026-02-19", "2026-03-25"], ["2026-04-22", "2026-04-22"]]

      # T1: maintenance-phase load (the consolidation period after tapering)
      - variable: training_load
        time_start: "09:00"
        time_end: "09:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        date_range: ["2026-03-26", "2026-04-22"]
        label: "Maintenance-phase load"
        optimize:
          value: [0.0, 100.0]

  algorithm:
    population_size: 60
    n_generations: 120
    seed: 19

  results:
    status: "This result is based on the configuration after banister_validation.yaml's k1/k2 hour-conversion fix; an independent rerun with the same configuration on 2026-07-14 matched the 60-solution front, the recommended point below, and the min-fatigue endpoint exactly, confirming it reproduces."
