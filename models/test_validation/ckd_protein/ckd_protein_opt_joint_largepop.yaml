metadata:
  name: ckd_protein_pareto
  lm_format_version: "1.0"
  updated: 2026-08-05
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
  description:
    problem: |
      Reproducing the CKD protein-muscle joint multi-objective optimization front at a larger search
      scale: verifying whether the tradeoff structure, breakfast and lunch protein pressed to their
      lower bound with the restriction-to-standard-phase switch timing being the actual key lever,
      and the conclusion that dinner protein-intake timing has no causal effect on the model's
      outcome, hold up as search depth increases.
    method: |
      The mechanism matches ckd_protein_sim.yaml; see that file's description.method for the complete
      mechanism list. This file uses exactly the same joint objective structure as
      ckd_protein_opt_joint.yaml, namely GFR, muscle_mass, and the healthy-duration score, only
      expanding the search budget from pop=100/gen=200 to pop=150/gen=300, for a front-robustness
      check.
    result: |
      - The Pareto front has 31 non-dominated solutions in total, with GFR ranging 40.9 to
        42.9 mL/min/1.73m², muscle_mass ranging 33.4 to 38.5 kg, and lm_score constant at 364 across
        every solution.
      - The front's range essentially coincides with the smaller-budget pop=100 version (the
        historical value from before ckd_protein_opt_joint.yaml's correction), with no significant
        tail found to have been missed at the larger search scale, validating the tradeoff
        structure's robustness under a larger search.
    limitations: |
      - The computational cost is significantly higher than the standard configuration, suited to
        pre-publication search refinement; it inherits every modeling assumption and limitation from
        s1/ckd_protein.
      - This file's most recent complete search finished on 2026-07-10, on a model version from
        before the 2026-08-02 adherence-dimension and directionality correction, and has not yet been
        revalidated against the current model; the numbers here are for reference on the search
        scale's own robustness only, and the currently valid front is in `ckd_protein_opt_joint.yaml`.
  ratings:
    importance: 0.25 - A methodological wrap-up validation, appendix-level material, best positioned as a data source for a convergence analysis
    variable: 0.75 - The literature basis is inherited from s1/ckd_protein_sim.yaml
    equation: 0.5 - The mechanism is inherited from s1/ckd_protein_sim.yaml, a self-built equation anchored to a literature point estimate
    simulation: 0.5 - The mechanism is inherited from s1/ckd_protein_sim.yaml; this file adds no new simulation content
    optimization: 0.5 - The front remains non-degenerate (31 solutions) under a larger search budget, confirming the tradeoff structure is robust, but this is on a since-superseded model version
    innovation: 0.25 - A search-budget-expansion validation, of more methodological than scientific novelty
    confidence: 0.0 - The result is on a model version from before the 2026-08-02 adherence-dimension and directionality correction and has not been revalidated against the current model; the currently valid front is in ckd_protein_opt_joint.yaml
  tags: [ckd, protein, muscle]
  log:
    "2026-06-15_00-00-00":
      change: "The imports path papers/s1/ckd_protein_noref changed to papers/s1/ckd_protein_HOLD"
      reason: "Both --sim/--opt reported Cannot load model: the imported file had been renamed with the _HOLD suffix, and this file's imports path had not been updated to match."
    "2026-06-25_00-00-00":
      change: "The file migrated from papers/s4/ckd_protein_pareto.yaml to papers/s1/ckd_protein/ckd_protein_opt_joint_largepop.yaml, with the imports path changed to ./ckd_protein_sim"
      reason: "This scenario is a search-budget-expansion validation of the s1/ckd_protein case, not an independent case, and belongs under that case's own directory."
    "2026-08-05_00-00-00":
      change: "Removed resolved metadata.todo items; results streamlined to the last complete search's result from 2026-07-10, with the remaining rerun records moved to history/2026-08-05_ckd_protein_opt_joint_largepop.yaml; description gains a method field, and problem now states the validation goal directly"
      reason: "Implements ADR 0141; also honestly notes that this file has not yet been revalidated against the model version corrected on 2026-08-02, see results.status."

imports:
  - papers/lm_format/ckd_protein/ckd_protein_sim

references:
  - "See ckd_protein_sim.yaml for the complete reference list"
  - citation: "Deb K et al. (2002) NSGA-II. IEEE Trans Evol Comput 6(2):182-197"
    description: "The methodological source for the NSGA-II multi-objective optimization algorithm itself; this file's optimization.method uses this algorithm to search for the Pareto front at a larger population and generation budget."
  - citation: "Kouw IWK et al. (2017) Pre-sleep protein and overnight muscle protein synthesis. J Nutr 147(12):2252-2261"
    description: "The mechanism literature for pre-sleep protein promoting overnight muscle synthesis, used here to test whether dinner protein-intake timing shows the causal pattern this mechanism predicts at a larger search scale; the result shows no consistent pattern for this decision variable across the front's solutions, consistent with the mechanism gap already recorded in ckd_protein_sim.yaml."

# Inherits every variable, equation, and constraint from ckd_protein_sim
# Only overrides the optimization configuration (a larger population, with the same T1+T2+T4 inputs)

optimization:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-12-31"

  objectives:
    - variable: muscle_mass
      metric: final
      direction: maximize
      description: "Maximizing skeletal muscle mass at week 52"
    - variable: GFR
      metric: final
      direction: maximize
      description: "Maximizing GFR at week 52"
    - variable: lm_score
      metric: final
      direction: maximize
      description: "Maximizing CKD healthy duration, the accumulated days with GFR at least 30, muscle_mass at least 22 kg, and BUN at most 20"

  constraints:
    - variable: BUN
      condition: "<= 20"
      type: hard
    - variable: GFR
      condition: ">= 30"
      type: hard

  startpoint:
    regimens:
      # T1: breakfast protein amount
      - variable: dietary_protein
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Breakfast protein amount"
        optimize:
          value: [0.15, 0.45]

      # T1: lunch protein amount
      - variable: dietary_protein
        time_start: "12:00"
        time_end: "12:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Lunch protein amount"
        optimize:
          value: [0.15, 0.40]

      # T1+T2: dinner protein amount plus meal-timing window (chrono-nutrition)
      - variable: dietary_protein
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Dinner protein amount and meal timing"
        optimize:
          value: [0.15, 0.45]
          time_start: ["17:00", "22:00"]

      # T4: restriction-to-standard-phase switch timing
      - variable: dietary_protein
        time_start: "08:00"
        time_end: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "Standard-phase start timing"
        optimize:
          value: [0.27, 0.42]
          date_range: [["2026-04-01", "2026-10-01"], ["2026-12-31", "2026-12-31"]]

  mc:
    runs: 5
    seed: 19

  algorithm:
    population_size: 150
    n_generations: 300
    seed: 19

  results:
    status: "This file's most recent complete search (2026-07-10) is on a model version from before the 2026-08-02 adherence-dimension and directionality correction, and has not been revalidated against the current model; the numbers here are for reference on the search scale's own robustness only, and the currently valid front is in ckd_protein_opt_joint.yaml."
    generated_at: "2026-07-10"
    method: nsga2
    population_size: 150
    n_generations: "8/300"
    n_solutions: 31
    pareto_front_range:
      GFR: [40.916, 42.923]
      muscle_mass: [33.419, 38.538]
      lm_score: "constant at 364.0 across all 31 solutions"
    recommended:
      x: [0.19253420892206038, 0.2825734558841018, 0.30054613683819725, 1.9536293937682137, 0.2854986687478265, 173.73504308475066]
      f: [35.71878173323725, 42.59878875902801, 364.0000000000258]
    note: "The front's range essentially coincides with the pop=100 version (the historical value from before ckd_protein_opt_joint.yaml's correction), with no significant tail found to have been missed at the larger search scale. See history/2026-08-05_ckd_protein_opt_joint_largepop.yaml for the earlier rerun records and the complete pareto_front."
