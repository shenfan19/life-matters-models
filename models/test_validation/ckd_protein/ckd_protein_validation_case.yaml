metadata:
  name: ckd_protein_validation_case
  lm_format_version: "1.0"
  updated: 2026-07-21
  authors:
    - name: Fan Shen
      email: shenfan@mail.sysu.edu.cn
    - name: Minghui Wu
      email: wuminghui@gzucm.edu.cn
  description:
    problem: |
      The literature-benchmark validation entry point for the CKD protein-muscle tradeoff model:
      imports the complete physical mechanism from the paper
      `papers/lm_format/ckd_protein/ckd_protein_sim.yaml`, keeping only the three hand-designed
      guideline or clinical plans (kidney-protection-first, kidney_protect; clinically balanced,
      balanced; muscle-preservation-first, muscle_preserve), and excluding the three opt-result
      backfilled plans renal_optimized/muscle_optimized/opt_optimized, which fall under the
      `ckd_protein_opt_*.yaml` files' optimization-plausibility validation scope (see section 2 of
      `../validation_report.md`) and outside this file's literature-benchmark validation scope.
    result: |
      This file keeps the three plans kidney_protect/balanced/muscle_preserve, corresponding to the
      "CKD Protein-Muscle" validation point in section 1 of `../validation_report.md` (with
      kidney_protect's protein intake landing closest to the KDIGO-recommended range of
      0.6-0.8 g/kg/day, serving as the primary comparison plan).
    limitations: The parameters, bounds, and known unresolved issues (the BUN clearance coefficient, the
      direction of muscle_mass's net change, etc.; see the metadata.todo of
      `papers/lm_format/ckd_protein/ckd_protein_sim.yaml` for detail) match the imported file exactly;
      this file does not repeat that record and only narrows the plans.
  tags: [ckd, protein, muscle, validation, literature-benchmark]

imports:
  - papers/lm_format/ckd_protein/ckd_protein_sim

references:
  - "The complete reference list is in papers/lm_format/ckd_protein/ckd_protein_sim.yaml"

simulation:
  plans:
    - id: "kidney_protect"
      label: "Kidney-protection-first (a GFR endpoint, low protein throughout)"
      regimens:
        - {variable: dietary_protein, time_start: "08:00", value: 0.22, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "Breakfast protein"}
        - {variable: dietary_protein, time_start: "12:00", value: 0.21, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "Lunch protein"}
        - {variable: dietary_protein, time_start: "18:00", value: 0.22, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "Dinner protein"}

    - id: "balanced"
      label: "Clinically balanced plan (K=2 segments, restricted for the first 26 weeks, standard for the second 26)"
      regimens:
        - {variable: dietary_protein, time_start: "08:00", value: 0.22, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-06-30"], label: "Restriction-phase breakfast"}
        - {variable: dietary_protein, time_start: "12:00", value: 0.21, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-06-30"], label: "Restriction-phase lunch"}
        - {variable: dietary_protein, time_start: "21:00", value: 0.22, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-06-30"], label: "Restriction-phase dinner (before bed)"}
        - {variable: dietary_protein, time_start: "08:00", value: 0.29, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-07-01", "2026-12-31"], label: "Standard-phase breakfast"}
        - {variable: dietary_protein, time_start: "12:00", value: 0.27, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-07-01", "2026-12-31"], label: "Standard-phase lunch"}
        - {variable: dietary_protein, time_start: "21:00", value: 0.28, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-07-01", "2026-12-31"], label: "Standard-phase dinner (before bed)"}

    - id: "muscle_preserve"
      label: "Muscle-preservation-first (a muscle endpoint, standard protein throughout)"
      regimens:
        - {variable: dietary_protein, time_start: "08:00", value: 0.38, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "Breakfast protein"}
        - {variable: dietary_protein, time_start: "12:00", value: 0.36, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "Lunch protein"}
        - {variable: dietary_protein, time_start: "21:00", value: 0.37, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-12-31"], label: "Dinner protein (before bed)"}
