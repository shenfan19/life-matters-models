    comments: |
      The 60 solutions' dose x is distributed continuously across the [0,50]mg range, with
      blood_pressure decreasing monotonically with dose (155.0 to 145.2mmHg) and uric_acid
      increasing monotonically with dose (420.2 to 438.1μmol/L). The whole front is a continuous,
      non-degenerate dose-response curve, with no dose strictly worse on both objectives than
      another (every point is a non-dominated solution), meaning the joint feasible region is
      non-empty and continuous.
      This contrasts with the homair_ogtt (A2a) case in the same directory, where some individuals
      are given contradictory classifications by the two standards, restricting the feasible
      region: this case (A2b) shows a tradeoff, not a contradiction. Loading two independent
      publications' effect sizes into the same framework did not produce an empty set; it simply
      confirmed the clinical common sense that lowering blood pressure and controlling uric acid
      cannot both be had for free.
      The recommended point (24.87mg) is taken from near the front's midpoint and does not
      represent a clinically recommended dose; it is for display purposes only.
