metadata:
  name: diuretic_tradeoff_opt
  lm_format_version: "1.0"
  description:
    problem: "A two-objective optimization on the single decision variable thiazide_dose, minimizing blood pressure and minimizing blood uric acid. The two objectives' literature bases are independent of each other, Law 2009 for blood-pressure lowering and Choi 2012 for uric-acid raising, testing whether the joint feasible region is empty or shows a continuous dose-response tradeoff front. See the imported diuretic_tradeoff_sim for the complete physical mechanism."
    method: "The mechanism matches diuretic_tradeoff_sim.yaml; see that file's description.method for the complete mechanism list. This file only runs a two-objective optimization on this single decision variable, testing the joint feasible region's shape."

imports:
  - ./diuretic_tradeoff_sim

references:
  - "See ./diuretic_tradeoff_sim.yaml"

optimization:
  method: nsga2
  start_date: "2026-01-01"
  end_date: "2026-07-01"
  step_size:
    value: 1
    unit: hour

  objectives:
    - variable: blood_pressure
      metric: final
      direction: minimize
      description: "Systolic blood pressure at week 26, lower is better"
    - variable: uric_acid
      metric: final
      direction: minimize
      description: "Blood uric acid at week 26, lower is better"

  startpoint:
    regimens:
      - variable: thiazide_dose
        time_start: "08:00"
        days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
        label: "HCTZ's daily dose (the sole decision variable)"
        optimize:
          value: [0.0, 50.0]

  algorithm:
    population_size: 60
    n_generations: 80
    seed: 19

  results:
