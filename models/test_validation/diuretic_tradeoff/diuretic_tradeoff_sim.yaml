metadata:
  log:
    "2026-08-12_00-00-01":
      change: "thiazide_level_dynamics's pulse term thiazide_dose is no longer multiplied by step, keeping only the decay term multiplied by step"
      reason: "A step-size grid test (1h/6h/15min) found the standard_dose plan's final blood_pressure at 150.1/126.6/153.8 and uric_acid at 428.9/800 (pinned to its upper bound)/422.4, drifting systematically with step_size, the same pulse-and-decay-term-multiplied-together-by-step bug as in s4/hypertension_gout_sim.yaml in the same repository; see the Equation Step-Size Rules section of docs/authoring/variables_and_equations.md and life-matters-home/tasks/2026-08-12_task_pulse-multiplied-by-step-design-bug.md for detail"
    "2026-08-12_00-00-00":
      change: "ua_baseline_prod's unit field changed from μmol/day to μmol/hour, with the value unchanged"
      reason: "Found during a systematic scan for a day/hour unit-conversion bug across the whole S1-S4 library: this file shares the same ua_baseline_prod design with s4/hypertension_gout in the same repository, and that file was confirmed to be a pure labeling issue, since the value itself was already calibrated for hour and its steady-state back-calculation matches the baseline urate of 420; this file was fixed the same way at the same time, with no effect on any existing simulation result."
    "2026-08-06_03-00-00":
      change: "Migrated per ADR 0142/0143: problem changed to a topic sentence plus a list structure, references all changed to the {citation, description} object form; non-exempt parentheses and dashes cleaned out of result/limitations"
      reason: "Implements ADR 0143: editing a papers/ model now also completes the description/references migration, no longer skipped on the grounds that the task's scope is small."
  name: diuretic_tradeoff
  lm_format_version: "1.0"
  updated: 2026-06-26
  description:
    problem: |
      A thiazide diuretic's blood-pressure-lowering effect and its uric-acid-raising side effect come from two independent measurements never jointly evaluated within the same framework, and loading both publications' dose-response coefficients into the same pharmacokinetic-pharmacodynamic model tests whether the joint feasible region is a contradiction, meaning no dose satisfies both objectives at once, or a tradeoff, meaning a continuous dose-response front exists with simply no free lunch.
      - Law et al. (2009)'s meta-analysis reports only HCTZ dose's effect on blood pressure, with no uric acid outcome.
      - Choi et al. (2012)'s cohort study reports only HCTZ dose's effect on gout or uric acid risk, with no blood pressure outcome.
      This case contrasts with the homair_ogtt reverse-verification case's joint-determination pattern: homair_ogtt shows a restricted joint feasible region, where some individuals get contradictory conclusions from the two standards, while this case shows the tradeoff-not-contradiction pattern, where the feasible region is non-empty and continuous.
    method: |
      This file combines the following mechanisms:
      - HCTZ pharmacokinetics: a dosing pulse accumulates into a first-order-eliminating body-level state, thiazide_level, with a half-life of about 10 hours (Beermann and Groschinsky-Grind 1977).
      - Blood-pressure relaxation dynamics: blood_pressure relaxes toward a post-treatment steady-state target driven by thiazide_level, with the blood-pressure-lowering potency coefficient taken from Law 2009's meta-analysis.
      - Uric-acid dynamics: uric_acid's steady state is set by baseline production and natural clearance, with thiazide_level suppressing clearance through URAT1 competitive reabsorption, its coefficient taken from the Choi 2012 cohort.
      The same decision variable, the daily HCTZ dose, drives both the blood pressure and uric acid trajectories at once through the shared pharmacokinetic state thiazide_level: a higher dose lowers blood pressure more, but the same dose also suppresses uric acid clearance more, producing a genuine tradeoff within a single model between two outcome measures drawn from different, independently measured publications.
    result: |
      Running an NSGA-II two-objective optimization on the single decision variable thiazide_dose, minimizing blood pressure and minimizing blood uric acid, produces a continuous, non-degenerate dose-response front, a higher dose lowers blood pressure more but raises uric acid more, with no single dose reaching the optimum on both objectives at once, while every dose point remains a feasible solution; see `optimization.results` in `diuretic_tradeoff_opt.yaml` for the specific front data.
    limitations: |
      The mechanism parameters, lambda_T (blood-pressure-lowering potency) and gamma_T (the uric-acid-clearance-suppression coefficient), are taken from the same calibrated literature basis (Law 2009, Choi 2012, Beermann 1977) already used in the s4/hypertension_gout case in the same repository. This file is a stripped-down version, removing the weight-loss, allopurinol, and other clinical decision dimensions specific to the s4 case and keeping only the minimal single-drug, dual-outcome demonstration structure; it cannot substitute for the s4 case's complete clinical decision analysis.
  ratings:
    importance: 0.25 - Hypertension co-occurring with gout is a common comorbidity, but this case is positioned as a simplified validation demonstration, not a standalone clinical decision tool
    variable: 0.75 - Parameters are inherited from the already-checked Law 2009/Choi 2012/Beermann 1977 literature anchors used in s4/hypertension_gout
    equation: 0.75 - First-order drug elimination is a standard PK structure, with the mechanism inherited from the already-validated s4/hypertension_gout design
    simulation: 0.5 - Runs successfully and produces three plans' trajectories, but as a stripped-down demonstration version it has not been independently benchmarked against additional data beyond the s4 case
    optimization: 0.75 - The NSGA-II two-objective search confirms a continuous, non-degenerate dose-response front, demonstrating that combining two independent publications' effect sizes yields a tradeoff rather than a contradiction
    innovation: 0.25 - The mechanism follows the s4 case; the contribution is the stripped-down structure and the cross-literature joint-feasibility test framework itself
    confidence: 0.5 - Combining two independently measured publications' effect sizes yields a non-empty, contradiction-free feasible region, but the two source publications' parameters were not re-checked against current conclusions this time
  tags: [diuretic, hypertension, gout, tradeoff_not_contradiction, simulation_as_validation, cross_literature]

# -- Variables ----------------------------------------------------------------
variables:
  blood_pressure:
    description: Systolic blood pressure (mmHg), with an untreated baseline of 155 (the representative value for ESC 2018-defined grade 2 hypertension)
    value: 155.0
    unit: mmHg
    type: state
    bounds: [80, 220]
    reference: "Williams B et al. (2018)"
    locator: "TODO:LOCATE"

  uric_acid:
    description: Blood uric acid (μmol/L), with an untreated baseline of 420 (above the gout-flare threshold of 360, representing a patient who already has hyperuricemia)
    value: 420.0
    unit: μmol/L
    type: state
    bounds: [100, 800]
    reference: "FitzGerald JD et al. (2020)"
    locator: "TODO:LOCATE"

  thiazide_dose:
    description: HCTZ's single daily dose (mg), the sole decision variable; a default value of 0.0 represents untreated when not overridden by a schedule
    value: 0.0
    unit: mg
    type: input

  thiazide_level:
    description: |
      The body's effective HCTZ level, a first-order pharmacokinetic decay state with a half-life
      of about 10h. An instantaneous dosing pulse accumulates into this decaying state first, and
      bp_dynamics/ua_dynamics read this state rather than the instantaneous dose. The structure and
      parameters follow the already-validated design in s4/hypertension_gout_sim.yaml in the same
      repository (an instantaneous dose driving a slow relaxation equation directly would be almost
      completely canceled out by a 23-hour rebound; see that file's metadata.todo for the historical
      debugging record).
    value: 0.0
    unit: mg
    type: state
    bounds: [0, 200]
    reference: "Beermann B & Groschinsky-Grind M (1977)"
    locator: "TODO:LOCATE"

  k_thiazide_decay:
    description: HCTZ's elimination rate constant, equal to ln2/t_half, with t_half taken as 10h (the midpoint of the 6.4-15h plasma half-life range reported by Beermann 1977)
    value: 0.0693
    unit: 1/hour
    type: parameter
    reference: "Beermann B & Groschinsky-Grind M (1977)"
    locator: "TODO:LOCATE"

  lambda_T:
    description: HCTZ's blood-pressure-lowering potency (Law 2009's meta-analysis reports a standard dose lowering blood pressure by about 8mmHg)
    value: 0.32
    unit: mmHg/mg
    type: parameter
    reference: "Law MR et al. (2009)"
    locator: "TODO:LOCATE"

  gamma_T:
    description: HCTZ's suppression coefficient on uric acid clearance (via URAT1 competitive reabsorption, Choi 2012)
    value: 0.0018
    unit: 1/mg
    type: parameter
    reference: "Choi HK et al. (2012)"
    locator: "TODO:LOCATE"

  ua_baseline_prod:
    description: >
      Uric acid's baseline production rate (back-calculated from a representative patient's baseline,
      with an untreated steady-state uric_acid of 420). Fixed 2026-08-12: unit had previously been
      labeled μmol/day, but the value itself was already calibrated for use in ua_dynamics's
      step_unit:hour; the steady-state back-calculation of 200/0.476 is approximately 420.2, matching
      the baseline urate of 420, confirming this was a pure labeling issue and the value itself needed
      no change.
    value: 200.0
    unit: μmol/hour
    type: parameter
    reference: "A representative patient, baseline urate=420 μmol/L"

# -- Dynamics equations ---------------------------------------------------------
equations:
  thiazide_level_dynamics:
    description: >
      HCTZ's body level: a dosing pulse accumulates, decaying at a first-order elimination rate
      constant. Fixed 2026-08-12: the pulse term thiazide_dose and the decay term
      k_thiazide_decay*thiazide_level had previously been placed in the same parenthesis and both
      multiplied by step, but thiazide_dose is delivered once by a regimen and is already numerically
      the amount due this step, so it should not be multiplied by step again; only a genuinely
      continuous first-order elimination term should be. The previous form happened to be numerically
      unchanged at this file's fixed step_size of 1 hour, but switching to a 6-hour step drove
      uric_acid straight to its upper bound (see the same fix in s4/hypertension_gout_sim.yaml in the
      same repository, and the "Equation Step-Size Rules" section of
      docs/authoring/variables_and_equations.md).
    step_unit: hour
    priority: 7
    dynamics:
      thiazide_level: "thiazide_level + thiazide_dose - k_thiazide_decay * thiazide_level * step"
    reference: "Beermann B & Groschinsky-Grind M (1977)"
    locator: "TODO:LOCATE"

  bp_dynamics:
    description: "Blood pressure relaxes toward a post-treatment steady-state target, equal to the untreated baseline of 155 minus HCTZ's blood-pressure-lowering effect, driven by thiazide_level"
    step_unit: hour
    condition: true
    priority: 6
    dynamics:
      blood_pressure: "blood_pressure - 0.04 * (blood_pressure - (155 - lambda_T * thiazide_level)) * step"
    reference: "Law MR et al. (2009)"
    locator: "TODO:LOCATE"

  ua_dynamics:
    description: "Uric acid: baseline production minus HCTZ-suppressed clearance (URAT1 competition) minus natural clearance, relaxing toward the steady state set by the baseline production-to-clearance ratio"
    step_unit: hour
    condition: true
    priority: 5
    dynamics:
      uric_acid: "uric_acid + (ua_baseline_prod - 0.476 * uric_acid * (1 - gamma_T * thiazide_level)) * step"
    reference: "Choi HK et al. (2012)"
    locator: "TODO:LOCATE"

# -- Simulation setup (26 weeks: a single dose's steady-state trajectory) --------------
simulation:
  step_size:
    value: 1
    unit: hour
  start_date: "2026-01-01"
  end_date: "2026-07-01"
  output_variables:
    - blood_pressure
    - uric_acid
    - thiazide_dose
    - thiazide_level
  plans:
    - id: "no_treatment"
      label: "Untreated baseline (no HCTZ)"
      regimens: []

    - id: "standard_dose"
      label: "Standard-dose plan (HCTZ 25mg/day, the common ESC/ESH starting dose)"
      regimens:
        - {variable: thiazide_dose, time_start: "08:00", value: 25.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-07-01"], label: "HCTZ 25mg/day"}

    - id: "max_dose"
      label: "Maximum-dose plan (HCTZ 50mg/day, the clinical dose ceiling)"
      regimens:
        - {variable: thiazide_dose, time_start: "08:00", value: 50.0, days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], date_range: ["2026-01-01", "2026-07-01"], label: "HCTZ 50mg/day"}

references:
  - citation: "Law MR et al. (2009) Use of blood pressure lowering drugs in the prevention of cardiovascular disease: meta-analysis. BMJ 338:b1665"
    description: "The source of the dose-response coefficient lambda_T for HCTZ's blood-pressure-lowering potency."
  - citation: "Choi HK et al. (2012) Antihypertensive drugs and risk of incident gout among patients with hypertension: population case-control study. BMJ 344:d8190; Ann Rheum Dis 71(5):723-727"
    description: "The source of the coefficient gamma_T for HCTZ suppressing uric acid clearance via URAT1 competitive reabsorption."
  - citation: "Beermann B & Groschinsky-Grind M (1977) Pharmacokinetics of hydrochlorothiazide in man. Eur J Clin Pharmacol 12(4):297-303"
    description: "The source of HCTZ's plasma half-life, calibrating thiazide_level's first-order elimination rate constant k_thiazide_decay."
  - citation: "Williams B et al. (2018) 2018 ESC/ESH Guidelines for the management of arterial hypertension. Eur Heart J 39(33):3021-3104"
    description: "The source of the staging definition behind blood_pressure's untreated baseline of 155 mmHg."
  - citation: "FitzGerald JD et al. (2020) 2020 American College of Rheumatology Guideline for the Management of Gout. Arthritis Care Res 72(6):744-760"
    description: "The guideline source for uric_acid's gout-flare threshold and untreated baseline."
