metadata:
  name: homair_ogtt
  lm_format_version: "1.0"
  updated: 2026-06-26
  log:
    "2026-08-13_00-00-00":
      change: "k_disp_basal 补上 Bergman RN (1989) Diabetes glucose effectiveness Sg 文献引用（0.026±0.008 /min，与校准值0.024吻合）；k_clear 补上 Matthews DR et al. (1985) Clin Endocrinol 胰岛素半衰期文献引用；c_abs 引用改指向已有的 Bergman RN et al. (1981)，并在 comments 中注明细胞外液分布容积约1.65 dL/kg的量级依据；k_absorb/HGO_const/HGO_ir/k_disp_ins/k_secrete/basal_secrete/gut_glucose/gut_absorption 保留 TODO:SOURCE，各自在 comments 中补充查证结论——其中 k_absorb 假设的30分钟吸收半衰期与文献报告的58-97.5分钟胃排空半排空时间存在2-3倍差异，k_disp_ins 校准值也高于文献报告的正常人SI典型范围，均标记为待后续核实调整；其余为本文件自定义的现象学参数，非标准 minimal model 分腔的直接对应量。"
