metadata:
  name: homair_ogtt
  lm_format_version: "1.0"
  updated: 2026-06-26
  log:
    "2026-08-13_00-00-00":
      change: "k_disp_basal gains a citation to Bergman RN (1989) Diabetes on glucose effectiveness Sg (0.026±0.008 /min, matching the calibrated value of 0.024); k_clear gains a citation to Matthews DR et al. (1985) Clin Endocrinol on insulin half-life; c_abs's reference now points to the already-present Bergman RN et al. (1981), with a comment added noting the extracellular distribution volume of about 1.65 dL/kg as the basis for its magnitude; k_absorb/HGO_const/HGO_ir/k_disp_ins/k_secrete/basal_secrete/gut_glucose/gut_absorption keep TODO:SOURCE, each with a comment added recording the check's conclusion. Among these, k_absorb's assumed 30-minute absorption half-life differs by a factor of 2-3 from the literature's reported gastric-emptying half-time of 58-97.5 minutes, and k_disp_ins's calibrated value is also higher than the literature's typical normal-population SI range; both are flagged for future reconciliation. The rest are phenomenological parameters custom to this file, with no direct counterpart in the standard minimal model."
      reason: "Before submission, checking whether the coefficients marked TODO:SOURCE have an available literature source: three of them (k_disp_basal/k_clear/c_abs) were confirmed to match in magnitude, and their real citations were added; k_absorb was found to differ substantially in value from the literature and needed flagging for a future decision on whether to recalibrate; the rest were confirmed to be phenomenological parameters custom to this model with no directly corresponding publication, so the estimated values were kept with the reasoning noted, for a future modeler's reference."
    "2026-08-06_05-00-00":
      change: "Migrated per ADR 0142/0143: problem changed to a topic sentence plus a list of gaps, result/limitations changed to a list structure, references all changed to the {citation, description} object form; dashes, sentence-initial narrative citations, and parentheses mixing a number with a citation cleaned out"
      reason: "Implements ADR 0143: editing a papers/ model now also completes the description/references migration, no longer skipped on the grounds that the task's scope is small."
    "2026-06-26_18-00-00":
      change: "Completed the first version's calibration: separate liver/muscle two-pathway coefficients (HGO_const/HGO_ir and k_disp_basal/k_disp_ins), added an 8-hour fasting lead-in period (starting at 00:00, with the OGTT glucose load triggered only at 08:00), and relaxed S_muscle's sampling lower bound from 0.25 to 0.18."
      reason: "The first version (a single k_disposal, no lead-in period, sampling the 'fasting' value at t=1min) did not give the system enough time to converge to the individualized steady state each S_hepatic/S_muscle pair determines; 300 MC runs showed HOMA-IR barely changing with the parameters (all clustered between 3.2 and 4.0), with 300 out of 300 individuals classified as HOMA-abnormal-but-OGTT-normal, unable to show the true four-quadrant distribution. An independent Python prototype (the script is in the conversation record) numerically confirmed: (a) the system converges within about 200 minutes, so an 8-hour lead-in period is sufficient; (b) only after splitting peripheral disposal into an insulin-independent part (k_disp_basal) and an insulin-dependent part (k_disp_ins) does S_muscle's effect on fasting glucose become significantly weaker than its effect on the 2-hour post-load glucose (since the latter occurs at a higher insulin concentration), which is what reproduces Abdul-Ghani 2006's report of isolated IFG (HOMA-abnormal, OGTT-normal) and isolated IGT (HOMA-normal, OGTT-abnormal) coexisting."
    "2026-06-26_18-30-00":
      change: "S_muscle's sampling lower bound relaxed from 0.18 to 0.10, and the MC runs raised from 300/1000 to a final 1000 (seed=19)."
      reason: "Under the [0.18,1.3] range, n=1000 produced only 2 isolated-IGT cases (0.2%), not enough for a robust demonstration; a grid scan (620 points) estimated the isolated-IGT quadrant's share at about 3% under the [0.10,1.3] range, matching the 2.9% actually measured at n=1000 under that range. The final four-quadrant distribution: concordant-normal 53.6%, concordant-abnormal 29.1%, isolated-IFG-like 14.4%, isolated-IGT-like 2.9% (discordant totaling 17.3%), written into description.result."
  description:
    problem: |
      Insulin resistance has no single gold-standard measure: HOMA-IR, fasting glucose times fasting
      insulin, needs only one fasting blood draw, while the oral glucose tolerance test (OGTT)'s
      2-hour glucose needs post-load tracking. The two do not always agree across a population, and
      a single source publication cannot answer why:
      - HOMA-IR's own diagnostic threshold varies by population and assay method, with the literature
        reporting a range of roughly 1.7 to 3.5 and no universal constant (Wallace 2004).
      - Abdul-Ghani et al. (2006) show that isolated impaired fasting glucose, dominated by hepatic
        insulin resistance with near-normal muscle insulin sensitivity, and isolated impaired glucose
        tolerance, dominated by muscle insulin resistance with lesser hepatic involvement, are
        different facets of the same metabolic syndrome, but this evidence on its own says nothing
        about how to jointly simulate the two diagnostic standards in the same virtual population.
      This case demonstrates LM format's simulation-as-validation use: loading two independent
      diagnostic standards, HOMA-IR with a threshold of 2.7 (Yeni-Komshian 2000) and OGTT 2-hour
      glucose with a threshold of 7.8 mmol/L, that is 140 mg/dL (ADA 2024), into the same
      physiological framework to test the joint determination's feasible region. This tests not
      whether either publication is right, but whether the same virtual population's classifications
      under the two standards overlap.
    method: |
      This file combines the following mechanisms:
      - The hepatic glucose output pathway: baseline hepatic glucose output plus an excess output
        driven by hepatic insulin sensitivity S_hepatic, dominating fasting glucose and HOMA-IR
        (Abdul-Ghani 2006).
      - The peripheral glucose disposal pathway: insulin-independent disposal plus insulin-dependent
        disposal, with the latter jointly set by muscle insulin sensitivity S_muscle and the current
        insulin concentration, at a magnitude referencing Bergman 1981.
      - Gut absorption dynamics: the OGTT's 75g glucose load absorbs into the blood by first-order
        kinetics.
      - Beta-cell secretion and clearance dynamics: baseline insulin secretion plus glucose-stimulated
        secretion, cleared at a first-order rate.
      These pathways share the same glucose-insulin state: S_hepatic and S_muscle are two
      independently sampled parameters representing population heterogeneity, but each one's effect
      can only show up by passing through the same glucose/insulin dynamical system; the peripheral
      disposal term is amplified by the insulin concentration, making S_muscle's effect on fasting
      glucose far smaller than its effect on the 2-hour post-load glucose. This is exactly the
      mechanism source that lets HOMA-IR and OGTT, two independent diagnostic standards, give
      different classifications for the same virtual population.
    result: |
      A Monte Carlo simulation generates 1000 virtual individuals, with hepatic sensitivity
      S_hepatic and muscle sensitivity S_muscle sampled independently and uniformly to represent
      population heterogeneity; each individual first converges to their own individualized steady
      state over an 8-hour fasting lead-in, then undergoes a standard 75g OGTT, with a fasting blood
      draw and a 2-hour post-load blood draw classified respectively by HOMA-IR above 2.7
      (Yeni-Komshian 2000) and OGTT 2-hour glucose above 140 mg/dL, that is 7.8 mmol/L (ADA 2024).
      - The joint feasible region is non-empty but markedly smaller than the whole population: the
        two standards agree on normal for 53.6% and agree on abnormal for 29.1%, an 82.7% total
        concordance rate.
      - Of the 17.3% discordant, HOMA-IR abnormal but OGTT normal, dominated by hepatic insulin
        resistance and isolated-IFG-like, accounts for 14.4%; HOMA-IR normal but OGTT abnormal,
        dominated by muscle insulin resistance and isolated-IGT-like, accounts for 2.9%. Both
        directions of discordance are non-zero, consistent in direction with the isolated IFG/IGT
        phenomena Abdul-Ghani 2006 reports; under this model's parameters the two proportions are
        asymmetric, with hepatic-axis discordance more common, which does not represent the exact
        proportion in a real population and only shows that the two measures genuinely track
        different physiological pathways.
    limitations: |
      - This model is a simplified two-pathway phenomenological model, not a direct reproduction of
        Bergman 1981's complete minimal model or a DeFronzo clamp study: the hepatic and muscle
        pathways are each represented by an independent insulin-sensitivity parameter rather than the
        real compartmental mechanism for hepatic glucose output and peripheral glucose disposal; the
        beta-cell secretion dynamics are a linear approximation and do not model the difference
        between first-phase and second-phase secretion.
      - Coefficients such as the absorption dynamics and secretion rates are order-of-magnitude
        estimates marked TODO:SOURCE, calibrated via --sim so that a reference individual (S_hepatic
        and S_muscle both 1.0) has a fasting glucose of about 90 mg/dL, a HOMA-IR of about 1.8, and
        an OGTT 2-hour glucose of about 105 mg/dL, all falling within the literature's reported
        normal range, without matching the exact numbers of any specific population cohort item by
        item.
  ratings:
    importance: 0.25 - The inconsistency between insulin-resistance diagnostic standards is a real clinical issue, but this case is positioned as a methodological demonstration rather than a proposed new guideline, not a flagship case
    variable: 0.25 - S_hepatic/S_muscle/k_disp_basal/k_clear/c_abs have literature anchors, but HGO_const/HGO_ir/k_secrete/basal_secrete/k_absorb/k_disp_ins are custom phenomenological parameters, and k_absorb/k_disp_ins were found on checking to differ from the literature by a factor of 2 to 3
    equation: 0.25 - The two-pathway phenomenological model is explicitly not a direct reproduction of Bergman's complete minimal model, with several coefficients being --sim-calibrated values rather than literature measurements
    simulation: 0.75 - The 1000-individual MC population simulation qualitatively reproduces the bidirectional isolated-IFG/IGT discordance Abdul-Ghani 2006 reports, without claiming the specific proportions match a real population
    optimization: 0.0 - This file contains no optimization, being a pure population-classification analysis with no decision-variable search
    innovation: 0.5 - The hepatic/muscle two-pathway separation mechanism is used to reproduce the already-known isolated-IFG/IGT phenomena, methodologically novel but building on an already-known finding for its core mechanism
    confidence: 0.5 - Both directions of discordance qualitatively reproduce the direction Abdul-Ghani 2006 reports, but key coefficients such as k_absorb/k_disp_ins were found on checking not to match the literature's magnitude
  tags: [insulin_resistance, HOMA-IR, OGTT, simulation_as_validation, cross_literature]

# -- Variables ----------------------------------------------------------------
variables:
  glucose:
    description: Plasma glucose concentration (mg/dL); the starting value is a generic, non-individualized initial value, and the simulation's first 8 fasting hours converge to each individual's true steady state
    value: 90.0
    unit: mg/dL
    type: state
    bounds: [40, 400]
    reference: "ADA (2024)"
    locator: "TODO:LOCATE"

  insulin:
    description: Plasma insulin concentration (μU/mL); the starting value is likewise generic and converges to the individualized steady state over the fasting lead-in
    value: 8.0
    unit: μU/mL
    type: state
    bounds: [1, 300]
    reference: "Matthews DR et al. (1985)"
    locator: "TODO:LOCATE"

  gut_glucose:
    description: Unabsorbed gut glucose (g); after the OGTT's 75g load, it enters the blood by first-order absorption kinetics
    value: 0.0
    unit: g
    type: state
    bounds: [0, 100]
    reference: "TODO:SOURCE a standard-OGTT absorption-kinetics estimate"
    comments: "The absorption-rate assumption is discussed in k_absorb's comments: it differs in magnitude from the literature's reported gastric-emptying half-time, not yet reconciled."

  HOMA_IR:
    description: HOMA-IR = (glucose [mmol/L] x insulin [μU/mL]) / 22.5; computed step by step, with only the value at 08:00 (the fasting blood-draw moment) carrying diagnostic meaning
    value: 0.0
    unit: AU
    type: state
    reference: "Matthews DR et al. (1985)"

  glucose_load:
    description: The OGTT's standard glucose load (a one-time event quantity, entering gut_glucose once triggered at 08:00)
    value: 0.0
    unit: g
    type: input

  # -- Individual-variation parameters (MC-sampled, representing the virtual population) ------------
  S_hepatic:
    description: |
      Hepatic insulin sensitivity (a relative unit, 1.0 equals the normal reference). Determines how
      unsuppressed hepatic glucose output is in the fasting state, so it mainly drives the fasting
      glucose/HOMA-IR axis, corresponding to Abdul-Ghani 2006's "isolated IFG is dominated by hepatic
      insulin resistance." The population sampling range [0.35, 1.3] covers normal through
      pronounced hepatic insulin resistance. Sampled independently of S_muscle.
    value: "uniform(0.35, 1.3)"
    unit: AU
    type: parameter
    bounds: [0.35, 1.3]
    reference: "Abdul-Ghani MA et al. (2006)"
    locator: "TODO:LOCATE"

  S_muscle:
    description: |
      Muscle/peripheral insulin sensitivity (a relative unit, 1.0 equals the normal reference). The
      insulin-dependent peripheral glucose disposal rate is proportional to this parameter times the
      current insulin concentration; since insulin is far higher after a load than while fasting,
      this parameter's effect on OGTT 2h glucose is far larger than its effect on fasting glucose,
      corresponding to Abdul-Ghani 2006's "isolated IGT is dominated by muscle insulin resistance."
      The sampling range [0.10,1.3]'s lower bound is lower than S_hepatic's: a more severe peripheral
      resistance is needed to push the 2h glucose past the 140 mg/dL threshold while keeping fasting
      glucose/HOMA-IR normal (verified numerically during calibration, see metadata.log; a grid scan
      showed the "isolated muscle resistance" quadrant at about 3% under [0.10,1.3] but under 0.2%
      under [0.18,1.3], since too narrow a lower bound leaves this quadrant almost unsampled at a
      finite MC sample size, hence widening the lower bound to 0.10).
    value: "uniform(0.10, 1.3)"
    unit: AU
    type: parameter
    bounds: [0.10, 1.3]
    reference: "Abdul-Ghani MA et al. (2006)"
    locator: "TODO:LOCATE"

  HGO_const:
    description: |
      The baseline hepatic glucose output rate (the part unrelated to insulin sensitivity,
      corresponding to the glucose consumption of insulin-independent tissue such as the brain and
      red blood cells, which hepatic output must match at the fasting steady state). Calibrated via
      --sim so that fasting glucose's steady state lands at 90 mg/dL when S_hepatic=S_muscle=1.0.
    value: 1.2
    unit: mg/dL/min
    type: parameter
    bounds: [0.5, 2.5]
    reference: "TODO:SOURCE a calibrated value, at a magnitude referencing Bergman RN et al. (1981)'s hepatic-glucose-output-rate range"
    comments: "This coefficient is a phenomenological parameter custom to this file (the part of baseline hepatic glucose output unrelated to insulin sensitivity), with no direct counterpart in a standard Bergman minimal-model compartment; its value is calibrated via --sim to a reference individual's fasting glucose steady state, and no independent literature measurement mapping directly to it was found."

  HGO_ir:
    description: |
      The coefficient for excess hepatic glucose output driven by hepatic insulin resistance: no
      excess output when S_hepatic=1; when S_hepatic<1, a sustained positive flux
      HGO_ir*(1/S_hepatic-1) results, representing hepatic output not adequately suppressed by
      insulin. Calibrated via --sim so that fasting glucose lands within the IFG diagnostic range
      (100-125 mg/dL) at S_hepatic=0.5 (moderate hepatic IR, with S_muscle held at 1.0).
    value: 3.0
    unit: mg/dL/min
    type: parameter
    bounds: [1.0, 6.0]
    reference: "TODO:SOURCE a calibrated value, at a magnitude referencing Bergman RN et al. (1981)'s hepatic-glucose-output-rate range"
    comments: "This coefficient is a phenomenological parameter custom to this file (excess output driven by hepatic insulin resistance), with no direct counterpart in a standard Bergman minimal-model compartment; its value is calibrated via --sim to the IFG diagnostic range, and no independent literature measurement mapping directly to it was found."

  k_disp_basal:
    description: |
      The insulin-independent glucose disposal rate coefficient (unrelated to both S_muscle and
      insulin, representing the fixed consumption of tissue such as the brain and red blood cells).
      One clearance term equals k_disp_basal*(glucose-70), with 70 mg/dL as the physiological
      disposal floor. Calibrated together with k_disp_ins so that a reference individual
      (S_hepatic=S_muscle=1.0) has a fasting glucose steady state of 90 and an OGTT 2h glucose
      falling back to about 105 mg/dL.
    value: 0.024
    unit: 1/min
    type: parameter
    bounds: [0.005, 0.05]
    reference: "Bergman RN (1989) Diabetes 38(12):1512-1527"
    locator: "TODO:LOCATE"

  k_disp_ins:
    description: |
      The insulin-dependent glucose disposal rate coefficient. The second clearance term equals
      k_disp_ins*S_muscle*insulin*(glucose-70), which is amplified by the insulin concentration,
      making S_muscle's effect on fasting glucose (low insulin) far smaller than its effect on the
      2h post-load glucose (high insulin); this is the key mechanism by which this model separates
      the HOMA-IR and OGTT determinations.
      Calibrated via --sim, for the same reason as k_disp_basal.
    value: 0.0045
    unit: 1/(min·μU/mL)
    type: parameter
    bounds: [0.001, 0.02]
    reference: "TODO:SOURCE a calibrated value, at a magnitude referencing Bergman RN et al. (1981)'s Si range"
    comments: "This file's calibrated value of 0.0045 /(min·μU/mL) is higher than the literature's reported typical normal-population insulin sensitivity SI range (several studies report roughly 2 to 23x10⁻⁴ /(min·μU/mL), with most means clustered around 3 to 8x10⁻⁴); the reason for this higher magnitude has not been confirmed and needs reconciling in future work."

  k_absorb:
    description: The gut glucose absorption rate constant, equal to ln2/t_half, with t_half taken as 30 minutes (the standard-OGTT glucose-absorption half-life magnitude)
    value: 0.0231
    unit: 1/minute
    type: parameter
    reference: "TODO:SOURCE an estimate at the magnitude of standard OGTT gastric-emptying plus small-intestine absorption kinetics"
    comments: "Assumes a 30-minute absorption half-life for the glucose load (k_absorb=ln2/30), but a subsequent literature search found the OGTT gastric-emptying half-time measured at roughly 58 to 97.5 minutes, with a sex difference (65±3 minutes for men, 79±2 minutes for women), slower than this file's assumption by a factor of 2 to 3; the reason for the difference has not been confirmed and this has not been recalibrated, needing reconciling in future work."

  c_abs:
    description: The rise in blood glucose concentration per gram of absorbed glucose (approximately a glucose-distribution-volume conversion, an about 12L adult extracellular glucose pool)
    value: 8.3
    unit: (mg/dL)/g
    type: parameter
    reference: "Bergman RN et al. (1981)"
    comments: "The extracellular glucose distribution volume's magnitude references the Bergman minimal model's V parameter's common value of about 1.65 dL/kg; converted for a 70kg reference individual, this is about 11.6L, consistent with this file's approximately 12L magnitude. No other primary source for the 1.65 dL/kg figure itself, independent of Bergman (1981), was found; a more precise source would need to check V's reported value in the original minimal-model paper."

  k_secrete:
    description: |
      The beta-cell glucose-stimulated insulin-secretion rate coefficient: the secretion term equals
      basal_secrete + k_secrete*max(0, glucose-g_thresh). Calibrated via --sim so that a reference
      individual's fasting insulin steady state is 8 μU/mL, and shows a plausible compensatory
      hyperinsulinemia as fasting glucose rises (in a hepatic-IR individual, fasting glucose and
      insulin rise together, doubly amplifying HOMA-IR).
    value: 0.015
    unit: (μU/mL)/(min·mg/dL)
    type: parameter
    bounds: [0.005, 0.05]
    reference: "TODO:SOURCE a calibrated value, at a magnitude referencing Matthews DR et al. (1985)'s normal-population insulin-secretion range"
    comments: "This coefficient is a linearized secretion-rate parameter custom to this file, with no direct counterpart in the literature's standard first-phase/second-phase secretion dynamics model; its value is calibrated via --sim to a reference individual's fasting insulin steady state, and no independent literature measurement mapping directly to it was found."

  basal_secrete:
    description: The beta-cell baseline secretion rate (the part unrelated to how far glucose deviates from the threshold), jointly determining the fasting insulin steady state together with k_secrete
    value: 0.6
    unit: μU/mL/min
    type: parameter
    reference: "TODO:SOURCE a calibrated value"
    comments: "This coefficient is a linearized secretion-rate parameter custom to this file, with no direct counterpart in the literature's standard first-phase/second-phase secretion dynamics model; its value is calibrated via --sim to a reference individual's fasting insulin steady state, and no independent literature measurement mapping directly to it was found."

  g_thresh:
    description: The reference threshold for glucose-stimulated secretion (a model design parameter, not a true beta-cell glucose-sensing threshold)
    value: 50.0
    unit: mg/dL
    type: parameter

  k_clear:
    description: The insulin hepatic/renal clearance rate constant (plasma insulin's half-life is about 4 to 6 minutes; the rate constant corresponds to the midpoint, about 4.6 minutes)
    value: 0.15
    unit: 1/minute
    type: parameter
    reference: "Matthews DR et al. (1985) Clin Endocrinol (Oxf) 23(1):71-79"
    locator: "TODO:LOCATE"

# -- Dynamics equations ---------------------------------------------------------
equations:
  gut_absorption:
    description: "Gut glucose absorbs and empties by first-order kinetics (the OGTT load's sole source is the glucose_load pulse)"
    step_unit: minute
    priority: 10
    dynamics:
      gut_glucose: "max(0, gut_glucose + glucose_load - k_absorb * gut_glucose * step)"
    reference: "TODO:SOURCE a standard-OGTT absorption-kinetics estimate"
    comments: "The absorption-rate assumption is discussed in k_absorb's comments: it differs in magnitude from the literature's reported gastric-emptying half-time, not yet reconciled."

  glucose_dynamics:
    description: |
      Glucose: gut absorption input, plus baseline hepatic glucose output, plus excess output driven
      by hepatic insulin resistance (dominated by S_hepatic), minus insulin-independent disposal,
      minus insulin-dependent disposal (dominated by S_muscle, with the effect amplified by the
      insulin concentration, so it is far stronger after a load than while fasting, the key to
      separating the HOMA-IR and OGTT determinations).
    step_unit: minute
    condition: true
    priority: 6
    dynamics:
      glucose: >
        glucose
        + (k_absorb * gut_glucose * c_abs
           + HGO_const + HGO_ir * (1.0 / S_hepatic - 1.0)
           - (k_disp_basal + k_disp_ins * S_muscle * insulin) * (glucose - 70.0)) * step
    reference: "Bergman RN et al. (1981); Abdul-Ghani MA et al. (2006)"
    locator: "TODO:LOCATE"

  insulin_dynamics:
    description: "Insulin: baseline secretion, plus the beta cell's secretory response to glucose stimulation, minus hepatic/renal clearance"
    step_unit: minute
    condition: true
    priority: 5
    dynamics:
      insulin: "insulin + (basal_secrete + k_secrete * max(0, glucose - g_thresh) - k_clear * insulin) * step"
    reference: "Matthews DR et al. (1985)"
    locator: "TODO:LOCATE"

  homa_ir_calc:
    description: "HOMA-IR computed step by step (an algebraic relationship, no step; only the value at the 08:00 fasting draw is used for diagnostic classification)"
    condition: true
    priority: 1
    dynamics:
      HOMA_IR: "(glucose / 18.0) * insulin / 22.5"
    reference: "Matthews DR et al. (1985)"

# -- Simulation setup (a single day: an 8-hour fasting lead-in from 00:00 converges to the individualized steady state, then the OGTT draw plus 75g glucose load at 08:00, then the 2h draw at 10:00) --
simulation:
  step_size:
    value: 1
    unit: minute
  start_date: "2026-01-01"
  end_date: "2026-01-02"
  output_variables:
    - glucose
    - insulin
    - HOMA_IR
    - gut_glucose
    - S_hepatic
    - S_muscle
  plans:
    - id: "default"
      label: "The standard OGTT plan (an 8h fasting lead-in, then a fasting draw plus 75g glucose load at 08:00, then the 2h draw at 10:00)"
      regimens:
        - {variable: glucose_load, time_start: "08:00", value: 75.0, label: "The 75g oral glucose load (the standard OGTT plan, dosed immediately after the 08:00 fasting draw)"}
  mc:
    runs: 1000
    seed: 19

references:
  - citation: "Matthews DR et al. (1985) Homeostasis model assessment: insulin resistance and beta-cell function from fasting plasma glucose and insulin concentrations in man. Diabetologia 28(7):412-419"
    description: "The source of HOMA-IR's own original definition, fasting glucose times fasting insulin."
  - citation: "Yeni-Komshian H et al. (2000) Relationship between several surrogate estimates of insulin resistance and quantification of insulin-mediated glucose disposal in 490 healthy nondiabetic volunteers. Diabetes Care 23(2):171-175"
    description: "The source of HOMA-IR's abnormal-determination threshold of 2.7."
  - citation: "Wallace TM, Levy JC, Matthews DR (2004) Use and abuse of HOMA modeling. Diabetes Care 27(6):1487-1495"
    description: "The source of the limitation that HOMA-IR's determination threshold varies by population and assay method with no universal constant."
  - citation: "Abdul-Ghani MA et al. (2006) Contributions of beta-cell dysfunction and insulin resistance to the pathogenesis of impaired glucose tolerance and impaired fasting glucose. Diabetes Care 29(5):1130-1139"
    description: "The source of the evidence dividing isolated IFG as hepatic-resistance-dominated and isolated IGT as muscle-resistance-dominated, and also the basis for the hepatic-glucose-output pathway's design where S_hepatic dominates fasting glucose and HOMA-IR."
  - citation: "Bergman RN et al. (1981) Quantitative estimation of insulin sensitivity. Am J Physiol 236(6):E667-E677"
    description: "The magnitude reference for the peripheral glucose disposal pathway; this file is a simplified two-pathway phenomenological model, not a direct reproduction of that paper's complete minimal model, see limitations."
  - citation: "Bergman RN (1989) Toward Physiological Understanding of Glucose Tolerance: Minimal-Model Approach (Banting Lecture). Diabetes 38(12):1512-1527"
    description: "The magnitude source for the insulin-independent glucose disposal rate coefficient k_disp_basal; this paper reports a normal-population glucose effectiveness Sg of 0.026±0.008 /min, matching this file's calibrated value of 0.024 /min."
  - citation: "Matthews DR et al. (1985) The half-life of endogenous insulin and C-peptide in man assessed by somatostatin suppression. Clin Endocrinol (Oxf) 23(1):71-79"
    description: "The magnitude source for the insulin clearance rate coefficient k_clear; this paper reports a plasma insulin half-life of about 5 to 6 minutes, matching the half-life of about 4.6 minutes implied by this file's calibrated value. This is a different paper from this file's other same-author, same-year citation, Matthews DR et al. (1985) Diabetologia on the HOMA-IR definition, distinguished here by journal name."
  - citation: "American Diabetes Association (2024) Standards of Care: Classification and Diagnosis of Diabetes. Diabetes Care 47(Suppl 1):S20-S42"
    description: "The guideline source for the OGTT 2-hour glucose abnormal-determination threshold of 7.8 mmol/L."
