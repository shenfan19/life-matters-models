    <h1>Life Matters（大德曰生）</h1>
    <h2>关于项目</h2>
    <p>Life Matters 将已发表的健康与行为研究写成可运行、可组合的动力学模型，帮助读者观察日常行为如何影响健康，以及目标之间有哪些取舍。</p>
    <p>模型库发布 LM YAML 格式规范和示例模型。参考引擎负责运行模型和比较方案。</p>
    <p>请结合每个模型的来源、假设和验证状态解读结果。模拟结果用于研究和教育，不提供医疗建议。</p>
    <ul>
      <li><a href="https://github.com/shenfan19/life-matters-models">模型库</a></li>
      <li><a href="https://github.com/shenfan19/life-matters-reference-engine">参考引擎</a></li>
    </ul>
    <p>本站只做匿名的访客计数，不用 cookie，不收集个人信息。</p>
