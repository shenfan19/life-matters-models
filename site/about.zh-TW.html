    <h1>Life Matters（大德曰生）</h1>
    <h2>關於計畫</h2>
    <p>Life Matters 將已發表的健康與行為研究寫成可執行、可組合的動力學模型，協助讀者觀察日常行為如何影響健康，以及目標之間有哪些取捨。</p>
    <p>模型庫發布 LM YAML 格式規格和範例模型。參考引擎負責執行模型和比較方案。</p>
    <p>請參考各模型的來源、假設和驗證狀態解讀結果。模擬結果用於研究與教育，不提供醫療建議。</p>
    <ul>
      <li><a href="https://github.com/shenfan19/life-matters-models">模型庫</a></li>
      <li><a href="https://github.com/shenfan19/life-matters-reference-engine">參考引擎</a></li>
    </ul>
